<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Colors in Soccer · 한글 이해 & 거꾸로 영작</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=Nunito:wght@700;900&display=swap');
:root{--c1:#f97316;--c2:#3b82f6;--c3:#10b981;--c4:#8b5cf6;--c5:#ec4899;--c6:#f59e0b;--c7:#06b6d4;--c8:#ef4444;
--bg:#f0f9ff;--card-bg:#fffdf7;--shadow:rgba(0,0,0,0.10);--ink:#1a1a2e;--muted:#666;
--ok:#10b981;--ok-bg:#dcfce7;--no:#ef4444;--no-bg:#fee2e2;--line:#e8e8e8;}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
body{background:var(--bg);font-family:'Noto Sans KR',sans-serif;color:var(--ink);padding-bottom:70px;}
.page-title{text-align:center;padding:22px 16px 8px;}
.page-title h1{font-family:'Nunito','Noto Sans KR',sans-serif;font-size:clamp(20px,5vw,30px);font-weight:900;}
.page-title .subtitle{font-size:13px;color:var(--muted);margin-top:5px;}
.deco-bar{width:80px;height:5px;background:linear-gradient(90deg,var(--c5),var(--c6),var(--c3));border-radius:10px;margin:8px auto 0;}
.steps{position:sticky;top:0;z-index:30;background:var(--bg);max-width:920px;margin:14px auto 0;padding:8px 12px;display:flex;gap:6px;overflow-x:auto;}
.step{flex:1;min-width:80px;font-family:inherit;font-size:11.5px;font-weight:700;padding:10px 5px;border-radius:22px;border:none;cursor:pointer;background:#fff;color:var(--muted);box-shadow:0 2px 8px var(--shadow);transition:.2s;text-align:center;line-height:1.3;white-space:nowrap;}
.step.on{background:var(--ink);color:#fff;}
.step .sn{display:block;font-size:9.5px;opacity:.7;}
.wrap{max-width:920px;margin:0 auto;padding:18px 16px;}
.intro{background:#fffbeb;border:2px solid #fcd34d;border-radius:14px;padding:14px 18px;font-size:13px;color:#555;line-height:1.8;margin-bottom:18px;}
.intro b{color:var(--ink);}
.bar{height:7px;background:#dbeafe;border-radius:5px;overflow:hidden;margin-bottom:18px;}
.bar>div{height:100%;background:linear-gradient(90deg,var(--c5),var(--c3));border-radius:5px;width:0;transition:.4s;}
.ctrl-bar{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-bottom:16px;}
.ctrl-btn{font-family:inherit;font-size:13px;font-weight:700;padding:9px 20px;border-radius:30px;border:none;cursor:pointer;box-shadow:0 2px 8px var(--shadow);}
.btn-dark{background:var(--ink);color:#fff;}.btn-gray{background:#e5e7eb;color:var(--ink);}
/* 한글 해석본 */
.kr-block{background:var(--card-bg);border-radius:16px;box-shadow:0 4px 18px var(--shadow);border:2px solid var(--line);padding:18px 20px;margin-bottom:16px;}
.kr-sec{font-size:13px;font-weight:900;color:var(--c5);margin:14px 0 8px;padding-left:10px;border-left:4px solid var(--c5);}
.kr-line{font-size:15px;line-height:2;color:#222;padding:2px 0;}
.kr-line .nm{display:inline-block;width:26px;color:#aaa;font-size:12px;font-weight:700;}
/* 개요/흐름 */
.flow{display:flex;flex-direction:column;gap:0;margin:10px 0;}
.flow-item{background:#f0f7ff;border-radius:12px;padding:12px 16px;font-size:13.5px;font-weight:700;color:#0369a1;position:relative;margin-bottom:26px;}
.flow-item:last-child{margin-bottom:0;}
.flow-item::after{content:'▼';position:absolute;bottom:-22px;left:50%;transform:translateX(-50%);color:#93c5e8;font-size:14px;}
.flow-item:last-child::after{display:none;}
.flow-item .ft{font-size:11px;color:var(--c5);display:block;margin-bottom:2px;}
/* 내용일치 OX (한글) */
.qcard{background:var(--card-bg);border-radius:16px;box-shadow:0 4px 18px var(--shadow);border:2px solid var(--line);padding:18px;margin-bottom:14px;}
.qnum{font-size:11px;color:var(--muted);margin-bottom:8px;font-weight:700;}
.qsent{font-size:15px;font-weight:700;line-height:1.6;}
.ox-row{display:flex;gap:10px;margin-top:12px;}
.ox{flex:1;padding:13px;border:2px solid var(--line);border-radius:12px;background:#fff;font-size:16px;font-weight:900;cursor:pointer;text-align:center;}
.ox.pickO{border-color:var(--ok);background:var(--ok-bg);color:var(--ok);}
.ox.pickX{border-color:var(--no);background:var(--no-bg);color:var(--no);}
.fb{font-size:13px;min-height:18px;font-weight:700;margin-top:9px;}.fb.ok{color:var(--ok);}.fb.no{color:var(--no);}
/* 순서 배열 */
.order-item{background:#fff;border:2px solid var(--line);border-radius:12px;padding:12px 14px;font-size:13.5px;font-weight:700;margin-bottom:8px;cursor:pointer;display:flex;align-items:center;gap:10px;box-shadow:0 2px 6px var(--shadow);}
.order-item .pick-no{width:26px;height:26px;border-radius:50%;background:#e5e7eb;color:#666;display:inline-flex;align-items:center;justify-content:center;font-size:12px;font-weight:900;flex-shrink:0;}
.order-item.picked .pick-no{background:var(--c5);color:#fff;}
/* 거꾸로 영작 */
.build{min-height:54px;background:#f0f7ff;border:2px dashed #93c5e8;border-radius:10px;padding:12px;font-size:15px;font-weight:700;line-height:1.9;margin:12px 0;}
.build .bw{display:inline-block;background:#fff;border:1.5px solid var(--c5);border-radius:8px;padding:3px 10px;margin:3px;cursor:pointer;}
.tokens{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 12px;}
.token{padding:9px 14px;border:2px solid var(--line);border-radius:10px;background:#fff;font-size:14px;font-weight:700;cursor:pointer;box-shadow:0 2px 6px var(--shadow);}
.token.used{opacity:.3;pointer-events:none;}
.ansbox{font-size:13px;color:#0369a1;background:#e0f2fe;padding:9px 12px;border-radius:9px;margin-top:8px;display:none;line-height:1.6;}
.hintrow{font-size:12.5px;color:var(--muted);margin-top:8px;}
.hintrow .ph{display:inline-block;background:#fdf2f8;color:#be185d;font-weight:700;padding:2px 9px;border-radius:8px;margin:2px;}
.b{padding:9px 20px;border:none;border-radius:24px;font-family:inherit;font-size:13px;font-weight:700;cursor:pointer;box-shadow:0 2px 8px var(--shadow);}
.b1{background:var(--c5);color:#fff;}.b2{background:#e5e7eb;color:var(--ink);}.b3{background:var(--c3);color:#fff;}
.nav2{display:flex;justify-content:space-between;align-items:center;margin-top:16px;}
.nav2 .b{background:#fff;color:var(--ink);}.nav2 .b:disabled{opacity:.35;}
.cnt{font-size:13px;color:var(--muted);font-weight:700;}
.result{text-align:center;padding:30px 16px;}
.score{font-size:60px;font-weight:900;background:linear-gradient(90deg,var(--c5),var(--c3));-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
.rmsg{font-size:15px;color:var(--muted);margin:6px 0 22px;font-weight:700;}
</style>
</head>
<body>
<div class="page-title">
  <h1>🇰🇷 한글 이해 & 거꾸로 영작</h1>
  <p class="subtitle">Colors in Soccer · 한글로 내용 잡고 → 영어로 산출</p>
  <div class="deco-bar"></div>
</div>
<div class="steps">
  <button class="step on" id="s0" onclick="go(0)"><span class="sn">1단계</span>한글 통독</button>
  <button class="step" id="s1" onclick="go(1)"><span class="sn">2단계</span>흐름·개요</button>
  <button class="step" id="s2" onclick="go(2)"><span class="sn">3단계</span>내용일치</button>
  <button class="step" id="s3" onclick="go(3)"><span class="sn">4단계</span>순서배열</button>
  <button class="step" id="s4" onclick="go(4)"><span class="sn">5단계</span>거꾸로영작</button>
</div>
<div class="wrap" id="app"></div>

<script>
/* 한글 해석본 (단락 구분) */
const KR=[
 {sec:"① 도입 — 축구와 색의 중요성",lines:[
  "축구는 전 세계에서 인기 있는 스포츠이다.",
  "그것은 또한 꽤 단순하다.",
  "당신은 공, 작은 공터, 그리고 차려는 욕구만 있으면 된다!",
  "오, 한 가지를 더 잊지 마라.",
  "당신은 색의 중요성을 이해할 필요가 있다!"]},
 {sec:"② 흑백 축구공의 유래",lines:[
  "오늘날 축구공은 다양한 색으로 나오지만, 검은색과 흰색 공은 꽤 흔하다.",
  "당신은 이 인기 있는 디자인의 유래에 대해 들어본 적 있는가?",
  "검은색과 흰색 공은 멕시코의 1970년 월드컵 동안 나왔다.",
  "사람들은 흑백 TV에서 그것들을 쉽게 발견할 수 있었다.",
  "정말 영리하지 않은가?",
  "이제 우리는 컬러 TV가 있지만, 여전히 고전적인 흑백 축구공을 찬다."]},
 {sec:"③ 유니폼 색의 역할",lines:[
  "각 팀의 선수들은 자신들만의 색을 가진 유니폼을 입는다.",
  "유니폼 색은 같은 정신 아래 팀을 하나로 묶는 힘을 가진다.",
  "그것들은 또한 경기장에서도 유용하다.",
  "선수들은 팀의 고유한 색 덕분에 서로를 발견하고 빠른 결정을 내릴 수 있다.",
  "경기장에서 심판들은 선수들과 눈에 띄어야 하기 때문에 특별한 색을 입는다.",
  "여러 색들 중에서, 검은색이 그들이 가장 좋아하는 색이었다.",
  "검은색은 강력해 보이며, '나와 논쟁하지 마!'라는 강한 메시지를 전달한다."]},
 {sec:"④ 의사소통 수단으로서의 색 카드",lines:[
  "심판들은 1970년 이래로 노란색과 빨간색 카드를 사용해 왔다.",
  "다른 색의 카드들은 선수들에게 다른 메시지를 전달한다.",
  "노란 카드는 '그 반칙들을 조심하라!'라고 말한다.",
  "빨간 카드는 '퇴장!'을 의미한다.",
  "다른 나라의 모든 선수들이 이 카드들의 의미를 명확히 이해한다."]},
 {sec:"⑤ 맺음 — 색을 즐겨라",lines:[
  "당신은 축구 경기를 볼 계획이 있는가?",
  "그러면 경기장의 다양한 색들을 확인해라.",
  "더욱 재미있을 것이다!"]}
];

/* 흐름·개요 (사건/논리 순서) */
const FLOW=[
 {t:"도입",x:"축구는 단순하지만, '색'의 중요성을 이해해야 한다"},
 {t:"유래",x:"흑백 공 → 1970 멕시코 월드컵, 흑백 TV에서 잘 보이게"},
 {t:"역할 1",x:"유니폼 색 → 팀을 하나로 묶고, 경기 중 식별·빠른 판단"},
 {t:"역할 2",x:"심판은 눈에 띄려 특별한 색(검은색=강력함) 착용"},
 {t:"소통",x:"색 카드(노랑=경고, 빨강=퇴장) → 만국 공통 의사소통"},
 {t:"맺음",x:"경기장의 다양한 색을 확인하면 더 재미있다"}
];

/* 내용일치 OX (한글로만 판단) */
const OX=[
 {q:"검은색·흰색 축구공은 1970년 멕시코 월드컵 동안 나왔다.",a:true},
 {q:"흑백 공은 컬러 TV에서 잘 보이게 하려고 만들어졌다.",a:false,exp:"흑백 TV에서 잘 보이게 하려는 것이었습니다."},
 {q:"유니폼 색은 팀을 하나로 묶고 경기 중 식별에도 도움이 된다.",a:true},
 {q:"심판은 선수들과 똑같은 색을 입어 섞이려고 한다.",a:false,exp:"선수들과 '눈에 띄려고(stand out)' 특별한 색을 입습니다."},
 {q:"심판이 가장 좋아해 온 색은 검은색이다.",a:true},
 {q:"노란 카드는 '퇴장'을, 빨간 카드는 '경고'를 의미한다.",a:false,exp:"노랑=경고(조심), 빨강=퇴장입니다. 반대로 서술됨."},
 {q:"색 카드는 나라가 달라도 모든 선수가 그 의미를 이해한다.",a:true},
 {q:"심판들은 1970년 이래로 노란·빨간 카드를 사용해 왔다.",a:true}
];

/* 거꾸로 영작 (한글 → 영어, 토큰 배열) */
const BUILD=[
 {kr:"축구는 전 세계에서 인기 있는 스포츠이다.",ph:["all over the world"],ans:["Soccer","is","a","popular","sport","all over the world"]},
 {kr:"당신은 색의 중요성을 이해할 필요가 있다!",ph:["need to","importance"],ans:["You","need","to","understand","the","importance","of","colors"]},
 {kr:"사람들은 흑백 TV에서 그것들을 쉽게 발견할 수 있었다.",ph:["could","spot","on ~ TVs"],ans:["People","could","spot","them","easily","on","their","black and white","TVs"]},
 {kr:"유니폼 색은 팀을 하나로 묶는 힘을 가진다.",ph:["the power to unite"],ans:["Uniform","colors","have","the","power","to","unite","the","team"]},
 {kr:"심판들은 1970년 이래로 노란·빨간 카드를 사용해 왔다.",ph:["have used","since"],ans:["Referees","have","used","yellow and red cards","since","1970"]},
 {kr:"선수들은 고유한 색 덕분에 빠른 결정을 내릴 수 있다.",ph:["thanks to","make decisions"],ans:["Players","can","make","quick","decisions","thanks to","their","unique","colors"]},
 {kr:"검은색은 강력해 보인다.",ph:["look + 형용사"],ans:["Black","looks","powerful"]},
 {kr:"모든 선수가 이 카드들의 의미를 명확히 이해한다.",ph:["clearly","these cards"],ans:["All","players","clearly","understand","the","meaning","of","these","cards"]}
];

let view=0;
let oxAns=Array(OX.length).fill(null);
let orderPick=[];
let bIdx=0,bBuilt=[],bDone=Array(BUILD.length).fill(null);
function go(v){view=v;for(let i=0;i<5;i++)document.getElementById('s'+i).classList.toggle('on',i===v);if(v===4)bBuilt=[];render();}
function norm(s){return (s||'').toLowerCase().replace(/[^a-z0-9가-힣\s]/g,'').replace(/\s+/g,' ').trim();}
function render(){document.getElementById('app').innerHTML=[v0,v1,v2,v3,v4][view]();}

/* 1단계 한글 통독 */
function v0(){
 let h=`<div class="intro">💡 <b>1단계 · 한글 해석본 통독</b><br>영어는 잠시 접어두고, 한글로 글 전체를 빠르게 읽으며 <b>무슨 이야기인지</b> 큰 그림을 잡으세요. 단락 제목을 보며 글의 구조를 의식하며 읽는 게 핵심이에요.</div>`;
 KR.forEach(g=>{h+=`<div class="kr-block"><div class="kr-sec">${g.sec}</div>`;
  g.lines.forEach((l,i)=>{h+=`<div class="kr-line">${l}</div>`;});h+=`</div>`;});
 return h;
}
/* 2단계 흐름·개요 */
function v1(){
 let h=`<div class="intro">💡 <b>2단계 · 시간 흐름 & 개요 잡기</b><br>글이 <b>어떤 순서</b>로 전개되는지 한눈에 정리했어요. 도입 → 유래 → 역할 → 소통 → 맺음의 논리 흐름을 머릿속에 그려두면 내용일치 문제가 쉬워져요.</div>
 <div class="kr-block"><div class="flow">`;
 FLOW.forEach(f=>{h+=`<div class="flow-item"><span class="ft">${f.t}</span>${f.x}</div>`;});
 h+=`</div></div>
 <div class="kr-block"><div class="kr-sec">🎯 글의 핵심 메시지</div>
 <div class="kr-line">축구 속 <b>색(color)</b>은 단순한 장식이 아니라, <b>식별·팀 결속·의사소통</b>의 중요한 도구다. 그러니 경기장의 다양한 색을 알고 보면 축구가 더 재미있다.</div></div>`;
 return h;
}
/* 3단계 내용일치 (한글) */
function v2(){
 const done=oxAns.filter(v=>v!==null).length;
 let h=`<div class="intro">💡 <b>3단계 · 내용 일치 확인 (한글)</b><br>1·2단계에서 잡은 흐름을 바탕으로 O/X를 고르세요. 틀린 진술은 <b>어디가 왜 틀렸는지</b> 설명이 나옵니다.</div>
 <div class="bar"><div style="width:${Math.round(done/OX.length*100)}%"></div></div>`;
 OX.forEach((o,i)=>{const p=oxAns[i],g=p!==null;
  h+=`<div class="qcard"><div class="qnum">문제 ${i+1} / ${OX.length}</div><div class="qsent">${o.q}</div>
   <div class="ox-row"><div class="ox${p===true?(o.a?' pickO':' pickX'):''}" onclick="pickOX(${i},true)">O</div>
   <div class="ox${p===false?(!o.a?' pickO':' pickX'):''}" onclick="pickOX(${i},false)">X</div></div>`;
  if(g){const c=p===o.a;h+=`<div class="fb ${c?'ok':'no'}">${c?'✓ 정답!':'✗ 오답'} ${o.exp?'— '+o.exp:'(정답: '+(o.a?'O':'X')+')'}</div>`;}
  h+=`</div>`;});
 if(done===OX.length){const ok=OX.filter((o,i)=>oxAns[i]===o.a).length;
  h+=`<div class="result"><div class="score">${ok}/${OX.length}</div><div class="rmsg">${ok>=6?'내용 이해 완벽! 순서 배열로 →':'흐름을 다시 확인해보세요'}</div><button class="b b3" onclick="go(3)">순서 배열 →</button></div>`;}
 return h;
}
function pickOX(i,v){oxAns[i]=v;render();}
/* 4단계 순서 배열 */
function v3(){
 if(!window._shuf){window._shuf=FLOW.map((f,i)=>({...f,oi:i})).sort(()=>Math.random()-.5);}
 const sh=window._shuf;
 let h=`<div class="intro">💡 <b>4단계 · 사건/논리 순서 배열</b><br>아래 단락들이 뒤섞여 있어요. 글의 흐름대로 <b>순서대로 탭</b>하세요. 다시 탭하면 취소됩니다.</div>`;
 sh.forEach(f=>{const idx=orderPick.indexOf(f.oi);
  h+=`<div class="order-item${idx>=0?' picked':''}" onclick="pickOrder(${f.oi})"><span class="pick-no">${idx>=0?idx+1:'·'}</span><span><b style="color:var(--c5)">${f.t}</b> — ${f.x}</span></div>`;});
 h+=`<div style="text-align:center;margin-top:14px"><button class="b b1" onclick="checkOrder()">순서 확인</button> <button class="b b2" onclick="orderPick=[];render()">초기화</button></div>
 <div class="fb" id="ofb" style="text-align:center">&nbsp;</div>`;
 return h;
}
function pickOrder(oi){const i=orderPick.indexOf(oi);if(i>=0)orderPick.splice(i,1);else orderPick.push(oi);render();}
function checkOrder(){const correct=orderPick.length===FLOW.length&&orderPick.every((v,i)=>v===i);
 const fb=document.getElementById('ofb');if(orderPick.length<FLOW.length){fb.className='fb no';fb.textContent='✗ 모든 단락을 순서대로 선택하세요.';return;}
 fb.className='fb '+(correct?'ok':'no');fb.textContent=correct?'✓ 정답! 글의 흐름을 정확히 파악했어요 🎉':'✗ 다시 도전! 도입→유래→역할→소통→맺음 순서예요.';}
/* 5단계 거꾸로 영작 */
function v4(){
 const done=bDone.filter(v=>v!==null).length;
 if(done===BUILD.length){const ok=bDone.filter(v=>v==='ok').length;
  return `<div class="intro">💡 <b>5단계 · 거꾸로 영작</b></div><div class="result"><div class="score">${ok}/${BUILD.length}</div>
   <div class="rmsg">${ok>=6?'한글→영어 산출 완성! 최고예요 🎉':'틀린 문장을 다시 영작해보세요'}</div>
   <button class="b b1" onclick="bIdx=0;bBuilt=[];bDone=Array(${BUILD.length}).fill(null);delete window._shb;render()">다시 풀기</button></div>`;}
 const q=BUILD[bIdx];
 if(!q._sh)q._sh=[...q.ans].map((w,i)=>({w,i})).sort(()=>Math.random()-.5);
 let toks=q._sh.map(o=>`<span class="token${bBuilt.includes(o.i)?' used':''}" onclick="addTok(${o.i})">${o.w}</span>`).join('');
 let built=bBuilt.map(i=>`<span class="bw" onclick="rmTok(${i})">${q.ans[i]}</span>`).join(' ');
 const st=bDone[bIdx];
 return `<div class="intro">💡 <b>5단계 · 거꾸로 영작 (한글 → 영어)</b><br>한글 뜻과 <span style="background:#fdf2f8;color:#be185d;padding:1px 6px;border-radius:6px">핵심 표현 힌트</span>를 보고, 단어를 순서대로 탭해 영어 문장을 완성하세요.</div>
  <div class="bar"><div style="width:${Math.round(done/BUILD.length*100)}%"></div></div>
  <div class="qcard"><div class="qnum">${bIdx+1} / ${BUILD.length}</div>
   <div class="qsent" style="color:#065f46">${q.kr}</div>
   <div class="hintrow">핵심 표현: ${q.ph.map(p=>`<span class="ph">${p}</span>`).join('')}</div>
   <div class="build">${built||'<span style="color:#aaa">여기에 영어 문장이 만들어집니다</span>'}</div>
   <div class="tokens">${toks}</div>
   <div class="fb${st==='ok'?' ok':st==='no'?' no':''}" id="bfb">${st==='ok'?'✓ 정답!':st==='no'?'✗ 다시 배열해보세요':'&nbsp;'}</div>
   <div class="ansbox" id="bans" style="${st==='no'?'display:block':''}">정답: ${q.ans.join(' ')}</div>
   <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:8px"><button class="b b1" onclick="checkB()">확인</button><button class="b b2" onclick="bBuilt=[];render()">지우기</button><button class="b b2" onclick="showB()">정답 보기</button></div></div>
  <div class="nav2"><button class="b" onclick="bNav(-1)" ${bIdx===0?'disabled':''}>← 이전</button><span class="cnt">${done}/${BUILD.length} 완료</span><button class="b" onclick="bNav(1)">다음 →</button></div>`;
}
function addTok(i){if(!bBuilt.includes(i))bBuilt.push(i);render();}
function rmTok(i){bBuilt=bBuilt.filter(x=>x!==i);render();}
function checkB(){const q=BUILD[bIdx];const made=bBuilt.map(i=>q.ans[i]).join(' ');bDone[bIdx]=norm(made)===norm(q.ans.join(' '))?'ok':'no';render();}
function showB(){bDone[bIdx]='no';render();}
function bNav(d){bIdx=Math.max(0,Math.min(BUILD.length-1,bIdx+d));bBuilt=[];render();}
render();
</script>
</body>
</html>
