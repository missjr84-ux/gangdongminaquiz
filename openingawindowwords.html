const colors=i=>'c'+((i%8)+1);
function openTab(id,btn){document.querySelectorAll('.section').forEach(s=>s.classList.remove('active'));document.getElementById(id).classList.add('active');document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));btn.classList.add('active')}
function speak(text){if(!window.speechSynthesis)return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang='en-US';u.rate=.86;speechSynthesis.speak(u)}
function speakVisible(){const texts=[...document.querySelector('.section.active').querySelectorAll('[data-text]')].map(x=>x.dataset.text);let i=0;speechSynthesis.cancel();function next(){if(i>=texts.length)return;const u=new SpeechSynthesisUtterance(texts[i++]);u.lang='en-US';u.rate=.86;u.onend=next;speechSynthesis.speak(u)}next()}
function revealAll(){document.querySelectorAll('.flip').forEach(c=>c.classList.add('open'))}

function done(btn){btn.classList.toggle('done');btn.textContent=btn.classList.contains('done')?'완료됨':'완료'}
function esc(s){return String(s).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;')}
function cardHTML(i,title,tag,body,text){return `<div class="card flip ${colors(i)}" data-text="${esc(text)}" onclick="if(event.target.tagName!=='BUTTON')this.classList.toggle('open')"><div class="head"><div class="num">${i+1}</div>${esc(title)}<div class="tag">${esc(tag)}</div></div><div class="body">${body}<div class="row"><button class="small speak" onclick="speak(this.closest('.card').dataset.text)">🔊 듣기</button><button class="small check" onclick="done(this)">완료</button></div></div></div>`}
function makeWords(){const g=document.getElementById('wordGrid');DATA.words.forEach((w,i)=>g.insertAdjacentHTML('beforeend',cardHTML(i,w[0],w[1],`<div class="word">${esc(w[0])}</div><div class="meaning">${esc(w[1])}</div><div class="ex">${esc(w[2])}</div><div class="meta"><b>유의어</b> ${esc(w[3]||'-')}<br><b>반의어</b> ${esc(w[4]||'-')}</div>`,w[0]+'. '+w[2])))}
function makePoly(){const g=document.getElementById('polyGrid');DATA.poly.forEach((p,i)=>g.insertAdjacentHTML('beforeend',cardHTML(i,p[0],p[2],`<div class="word">${esc(p[0])}</div><div class="meaning">${esc(p[2])}</div><div class="ex">${esc(p[1])}</div><div class="meta"><b>선택지</b> ${esc(p[3].join(' / '))}</div>`,p[1])))}
function makeRelation(){const g=document.getElementById('relationGrid');DATA.families.forEach((f,i)=>g.insertAdjacentHTML('beforeend',cardHTML(i,f[0]+' → '+f[1],'파생어',`<div class="word">${esc(f[0])} → ${esc(f[1])}</div><div class="meaning">${esc(f[2])}</div><div class="ex">${esc(f[1])} + 명사 형태로 출제</div>`,f[0]+'. '+f[1])));DATA.words.filter(w=>w[3]||w[4]).forEach((w,i)=>g.insertAdjacentHTML('beforeend',cardHTML(i+DATA.families.length,w[0],'유의/반의',`<div class="word">${esc(w[0])}</div><div class="meaning">${esc(w[1])}</div><div class="meta"><b>유의어</b> ${esc(w[3]||'-')}<br><b>반의어</b> ${esc(w[4]||'-')}</div>`,w[0])))}
function makePhrases(){const g=document.getElementById('phraseGrid');DATA.phrases.forEach((p,i)=>g.insertAdjacentHTML('beforeend',cardHTML(i,p[0],p[1],`<div class="word" style="font-size:20px">${esc(p[0])}</div><div class="meaning">${esc(p[1])}</div><div class="ex">${esc(p[2])}</div><div class="meta"><b>내용일치 포인트</b> 표현의 뜻과 상황을 함께 기억</div>`,p[0]+'. '+p[2])))}
let correct=0, answered=0;
function addQuiz(q,opts,ans){const area=document.getElementById('quizArea');const box=document.createElement('div');box.className='quiz-box';box.innerHTML=`<div class="q">${area.children.length+1}. ${q}</div>`+opts.map((o,i)=>`<button class="opt" onclick="choose(this,${i===ans?1:0})">${String.fromCharCode(9312+i)} ${esc(o)}</button>`).join('');area.appendChild(box)}
function makeQuiz(){DATA.tests.forEach(t=>addQuiz(t[0],t[1],t[2]))}
function choose(btn,isCorrect){const box=btn.closest('.quiz-box');if(box.dataset.done)return;box.dataset.done='1';answered++;if(isCorrect){btn.classList.add('correct');correct++}else{btn.classList.add('wrong');box.querySelectorAll('.opt').forEach(o=>{if(o.getAttribute('onclick').includes(',1)'))o.classList.add('correct')})}document.getElementById('score').textContent=`점수: ${correct} / ${answered}`}
makeWords();makePoly();makeRelation();makePhrases();makeQuiz();
</script>
</body>
</html>
