<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>비교급·최상급 뼈대 노트</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=Lora:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F8F7F4;--card:#fff;--card2:#F2F0EB;
  --ink:#1A1A2E;--sub:#4A4A6A;--muted:#7B7B9B;
  --border:#DDD9F0;--border-lt:#EDEAF8;
  --purple:#5C4FD4;--purple-lt:#EEEAFF;--purple-dk:#3D3399;
  --green:#1a6e3c;--green-lt:#E6F4EC;
  --amber:#8A5200;--amber-lt:#FFF3DC;
  --red:#A0203C;--red-lt:#FDEAF0;
  --blue:#1A4E9E;--blue-lt:#E6EEFB;
  --ok:#1a6e3c;--ok-bg:#E6F4EC;
  --no:#A0203C;--no-bg:#FDEAF0;
  --shadow:0 2px 10px rgba(92,79,212,.08),0 0 0 1px #DDD9F0;
  --r:14px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{background:var(--bg);color:var(--ink);font-family:'Noto Sans KR',sans-serif;font-size:14px;line-height:1.7;-webkit-font-smoothing:antialiased;overflow-x:hidden;}

/* 헤더 */
.header{background:linear-gradient(135deg,var(--purple-dk),var(--purple));color:#fff;padding:16px 20px 0;position:sticky;top:0;z-index:30;box-shadow:0 2px 12px rgba(92,79,212,.3);}
.header-top{display:flex;align-items:center;gap:10px;margin-bottom:10px;}
.header h1{font-size:16px;font-weight:900;flex:1;}
.page-info{font-size:12px;opacity:.8;white-space:nowrap;}
.step-tabs{display:flex;gap:4px;overflow-x:auto;padding-bottom:0;}
.stab{flex:1;min-width:52px;background:rgba(255,255,255,.12);border:none;color:rgba(255,255,255,.7);font-family:inherit;font-size:10px;font-weight:700;padding:8px 3px 10px;cursor:pointer;border-radius:8px 8px 0 0;text-align:center;line-height:1.3;transition:.2s;white-space:nowrap;}
.stab.on{background:#fff;color:var(--purple);}
.stab .sn{display:block;font-size:8px;opacity:.7;margin-bottom:1px;}

/* 페이지 */
.page-wrap{max-width:760px;margin:0 auto;padding:14px 16px 80px;}
.page-enter{animation:pgIn .25s ease;}
@keyframes pgIn{from{opacity:0;transform:translateX(16px)}to{opacity:1;transform:none}}

/* 카드 */
.sec{background:var(--card);border-radius:var(--r);border:1px solid var(--border);box-shadow:var(--shadow);padding:18px 20px;margin-bottom:10px;}
.sec-head{display:flex;align-items:center;gap:9px;padding-bottom:10px;border-bottom:2px solid var(--border-lt);margin-bottom:14px;flex-wrap:wrap;}
.badge{font-size:11px;font-weight:700;padding:3px 12px;border-radius:99px;color:#fff;}
.bp{background:var(--purple);}.bg{background:var(--green);}
.ba{background:var(--amber);}.br{background:var(--red);}.bb{background:var(--blue);}
.sec-title{font-size:14px;font-weight:900;}

/* 예문 */
.ex{margin:7px 0;padding:8px 12px;border-radius:9px;background:var(--card2);}
.ex .en{font-family:'Lora',serif;font-size:14px;line-height:1.8;color:var(--ink);}
.ex .kr{font-size:12px;color:var(--muted);margin-top:2px;}
.ex .hl{background:#FFD700;color:#1A1A2E;border-radius:4px;padding:0 4px;font-weight:700;}
.ex .hlr{background:#FFB3C6;color:var(--red);border-radius:4px;padding:0 4px;font-weight:700;}
.ex .hlg{background:#B3E8C8;color:var(--green);border-radius:4px;padding:0 4px;font-weight:700;}
.ex .bad{color:var(--red);text-decoration:line-through;}
.ex .good{color:var(--green);font-weight:700;}

/* 공식 */
.formula{border-radius:12px;padding:14px 18px;margin:10px 0;font-family:'Noto Sans KR',sans-serif;font-size:13px;line-height:2.1;border-left:5px solid var(--purple);background:var(--purple-lt);position:relative;}
.formula .f-label{font-size:10px;font-weight:900;color:var(--purple);letter-spacing:.06em;text-transform:uppercase;margin-bottom:6px;display:block;}
.formula .key{font-size:15px;font-weight:900;color:var(--purple-dk);display:block;margin-bottom:4px;font-family:'Lora',serif;letter-spacing:.3px;}
.formula .key .slot{display:inline-block;background:var(--purple);color:transparent;border-radius:6px;padding:2px 9px;font-size:14px;margin:0 2px;cursor:pointer;user-select:none;transition:color .2s,background .2s;border:2px dashed rgba(255,255,255,.5);position:relative;}
.formula .key .slot::before{content:'?';position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);color:#fff;font-weight:900;font-size:13px;pointer-events:none;}
.formula .key .slot.revealed{color:#fff;border-style:solid;border-color:transparent;}
.formula .key .slot.revealed::before{display:none;}
.formula.green .key .slot{background:var(--green);}
.formula.amber .key .slot{background:var(--amber);}
.formula.red .key .slot{background:var(--red);}
.formula.blue .key .slot{background:var(--blue);}
.formula .dim{font-size:12px;color:var(--sub);display:block;margin-top:3px;}
.formula .dim .arr{color:var(--purple);font-weight:700;margin-right:4px;}
.formula .eq{font-size:11px;color:var(--muted);margin-top:4px;display:block;padding-top:4px;border-top:1px dashed var(--border);}
.formula.green{border-left-color:var(--green);background:var(--green-lt);}
.formula.green .f-label{color:var(--green);}
.formula.green .key{color:#0d4a27;}
.formula.green .key .slot{background:var(--green);}
.formula.green .dim .arr{color:var(--green);}
.formula.amber{border-left-color:var(--amber);background:var(--amber-lt);}
.formula.amber .f-label{color:var(--amber);}
.formula.amber .key{color:#5a3500;}
.formula.amber .key .slot{background:var(--amber);}
.formula.amber .dim .arr{color:var(--amber);}
.formula.red{border-left-color:var(--red);background:var(--red-lt);}
.formula.red .f-label{color:var(--red);}
.formula.red .key{color:#6e0020;}
.formula.red .key .slot{background:var(--red);}
.formula.red .dim .arr{color:var(--red);}
.formula.blue{border-left-color:var(--blue);background:var(--blue-lt);}
.formula.blue .f-label{color:var(--blue);}
.formula.blue .key{color:#0d2f6e;}
.formula.blue .key .slot{background:var(--blue);}
.formula.blue .dim .arr{color:var(--blue);}
.formula .sub-f{font-size:11px;color:var(--sub);}

/* 표 */
.tbl{width:100%;border-collapse:collapse;margin:10px 0;font-size:13px;}
.tbl th{background:var(--purple);color:#fff;padding:8px 10px;text-align:center;font-weight:700;}
.tbl td{padding:7px 10px;border:1px solid var(--border-lt);text-align:center;vertical-align:middle;}
.tbl tr:nth-child(even) td{background:var(--purple-lt);}

/* 개념 박스 */
.cbox{border-radius:11px;padding:12px 15px;margin:9px 0;border:1.5px solid;}
.cbox-p{background:var(--purple-lt);border-color:var(--border);}
.cbox-g{background:var(--green-lt);border-color:#b2d8c2;}
.cbox-a{background:var(--amber-lt);border-color:#f0d090;}
.cbox-r{background:var(--red-lt);border-color:#e8b0c0;}
.cbox-b{background:var(--blue-lt);border-color:#b0c8f0;}
.cbox-title{font-size:12px;font-weight:900;margin-bottom:7px;}
.ct-p{color:var(--purple);}.ct-g{color:var(--green);}
.ct-a{color:var(--amber);}.ct-r{color:var(--red);}.ct-b{color:var(--blue);}

/* 경고 */
.warn{background:#FFF8DC;border:1.5px solid #F0C040;border-radius:10px;padding:10px 14px;margin:9px 0;font-size:13px;}
.danger{background:var(--red-lt);border:1.5px solid #e8b0c0;border-radius:10px;padding:10px 14px;margin:9px 0;font-size:13px;}
.tip{background:var(--green-lt);border:1.5px solid #b2d8c2;border-radius:10px;padding:10px 14px;margin:9px 0;font-size:13px;}



/* no-other 변환 카드 */
.conv-card{border:2px solid var(--border);border-radius:12px;overflow:hidden;margin:10px 0;}
.conv-head{background:var(--purple);color:#fff;padding:9px 14px;font-size:13px;font-weight:900;}
.conv-row{padding:10px 14px;border-bottom:1px solid var(--border-lt);display:flex;gap:10px;align-items:flex-start;}
.conv-row:last-child{border-bottom:none;}
.conv-num{font-size:11px;font-weight:900;color:var(--purple);min-width:22px;padding-top:2px;}
.conv-body{flex:1;}
.conv-en{font-family:'Lora',serif;font-size:14px;line-height:1.8;color:var(--ink);}
.conv-kr{font-size:12px;color:var(--muted);margin-top:2px;}
.conv-tag{display:inline-block;font-size:10px;font-weight:700;padding:2px 8px;border-radius:99px;margin-left:6px;}
.tag-sup{background:var(--purple-lt);color:var(--purple);}
.tag-comp{background:var(--green-lt);color:var(--green);}
.tag-pos{background:var(--blue-lt);color:var(--blue);}

/* 문제 */
.q-item{margin-bottom:13px;padding-bottom:13px;border-bottom:1px solid var(--border-lt);}
.q-item:last-child{border-bottom:none;margin-bottom:0;padding-bottom:0;}
.q-item.hide{display:none;}
.q-num{font-size:11px;font-weight:900;color:var(--purple);margin-bottom:5px;}
.q-sent{font-family:'Lora',serif;font-size:14px;line-height:2.1;color:var(--ink);}
.q-kr{font-size:12px;color:var(--muted);background:var(--card2);padding:5px 10px;border-radius:7px;margin:5px 0 8px;}
.q-hint{font-size:11px;color:var(--blue);background:var(--blue-lt);border:1px solid #b0c8f0;border-radius:7px;padding:5px 10px;margin-bottom:7px;}
.q-hint b{font-weight:900;}
.b-inp{border:none;border-bottom:2px solid var(--purple);padding:0 5px;font-size:13px;font-family:'Lora',serif;background:transparent;color:var(--ink);outline:none;vertical-align:bottom;min-width:90px;}
.b-inp:focus{border-bottom-color:var(--purple-dk);}
.b-inp.ok{border-bottom-color:var(--ok);color:var(--ok);}
.b-inp.no{border-bottom-color:var(--no);color:var(--no);}

/* 칩 */
.chip-wrap{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0;}
.chip{padding:6px 12px;border:1.5px solid var(--border);border-radius:99px;font-size:13px;cursor:pointer;background:var(--card);color:var(--ink);font-family:'Lora',serif;transition:.12s;user-select:none;}
.chip:hover{border-color:var(--purple);background:var(--purple-lt);}
.chip.used{opacity:.3;pointer-events:none;}
.answer-slots{display:flex;gap:6px;flex-wrap:wrap;min-height:40px;border:1.5px dashed var(--border);border-radius:10px;padding:6px 10px;margin:6px 0;background:var(--card2);align-items:center;}
.slot-chip{padding:5px 11px;border:1.5px solid var(--purple);border-radius:99px;font-size:13px;background:var(--purple-lt);color:var(--purple);cursor:pointer;font-family:'Lora',serif;}

/* 선택형 */
.mc-opts{display:flex;flex-direction:column;gap:7px;margin:8px 0;}
.mc-opt{padding:9px 14px;border:1.5px solid var(--border);border-radius:10px;background:var(--card2);font-size:13px;cursor:pointer;font-family:inherit;transition:.12s;display:flex;align-items:flex-start;gap:8px;}
.mc-opt:hover{border-color:var(--purple);background:var(--purple-lt);}
.mc-opt .on{font-weight:900;color:var(--muted);min-width:18px;padding-top:1px;}
.mc-opt.ch-ok{border-color:var(--ok);background:var(--ok-bg);color:var(--ok);font-weight:700;}
.mc-opt.ch-no{border-color:var(--no);background:var(--no-bg);color:var(--no);}
.mc-opt.ch-rv{border-color:var(--ok);background:var(--ok-bg);opacity:.55;}
.q-fb{font-size:12px;margin-top:6px;padding:6px 10px;border-radius:7px;display:none;}
.q-fb.show.ok{display:block;background:var(--ok-bg);color:var(--ok);}
.q-fb.show.no{display:block;background:var(--no-bg);color:var(--no);}
.ans-reveal{display:none;margin-top:7px;padding:8px 12px;background:var(--ok-bg);border-radius:8px;font-size:12px;color:var(--ok);line-height:1.7;font-family:'Lora',serif;}
.ans-reveal.open{display:block;}

/* 버튼 */
.mini-btn{padding:5px 12px;border:1px solid var(--border);border-radius:99px;font-size:12px;cursor:pointer;font-family:inherit;background:var(--card);color:var(--sub);}
.mini-btn:hover{background:var(--purple-lt);border-color:var(--border);color:var(--purple);}
.q-btns{display:flex;gap:6px;margin-top:7px;flex-wrap:wrap;align-items:center;}
.check-bar{display:flex;gap:7px;flex-wrap:wrap;align-items:center;margin-top:14px;padding-top:11px;border-top:1px dashed var(--border-lt);}
.cb{padding:8px 16px;border-radius:99px;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit;border:none;}
.cb-g{background:var(--purple);color:#fff;}
.cb-r{background:var(--card);border:1.5px solid var(--no);color:var(--no);}
.cb-r:disabled{opacity:.35;cursor:not-allowed;}
.cb-s{background:var(--card);border:1.5px solid var(--border-lt);color:var(--sub);}
.result-pill{font-size:12px;font-weight:700;padding:5px 13px;border-radius:99px;display:none;}
.pill-ok{background:var(--ok-bg);color:var(--ok);}
.pill-bad{background:var(--amber-lt);color:var(--amber);}

/* TTS */
.snd{display:inline-flex;align-items:center;background:none;border:1px solid var(--border-lt);border-radius:99px;padding:3px 9px;font-size:11px;color:var(--muted);cursor:pointer;font-family:inherit;gap:3px;}
.snd:hover,.snd.playing{background:var(--purple-lt);border-color:var(--border);color:var(--purple);}

.divider{height:1px;background:var(--border-lt);margin:14px 0;}

/* 흐름도 */
.flow-diagram{display:flex;flex-direction:column;align-items:center;gap:0;padding:4px 0;}
.fd-start{background:var(--ink);color:#fff;border-radius:12px;padding:11px 24px;font-size:14px;font-weight:900;text-align:center;}
.fd-arrow-down{font-size:22px;color:var(--muted);line-height:1.2;text-align:center;margin:2px 0;}
.fd-q{background:var(--blue-lt);border:2px solid #b0c8f0;border-radius:12px;padding:11px 20px;font-size:13px;font-weight:700;color:var(--blue);text-align:center;width:100%;max-width:420px;}
.fd-row{display:flex;gap:10px;width:100%;margin:8px 0;justify-content:center;flex-wrap:nowrap;}
.fd-row-wrap{flex-wrap:wrap;}
.fd-branch{display:flex;flex-direction:column;align-items:center;gap:0;flex:1;min-width:140px;max-width:200px;}
.fd-label{font-size:11px;font-weight:700;color:var(--muted);background:var(--card2);border-radius:6px;padding:3px 10px;text-align:center;white-space:nowrap;}
.fd-or{display:flex;align-items:center;font-size:11px;color:var(--muted);padding-top:22px;flex-shrink:0;}
.fd-ans{border-radius:11px;padding:10px 12px;font-size:12px;font-weight:700;text-align:center;width:100%;line-height:1.6;}
.fd-ans.green{background:var(--green-lt);border:2px solid #b2d8c2;color:var(--green);}
.fd-ans.purple{background:var(--purple-lt);border:2px solid var(--border);color:var(--purple);}
.fd-ans.blue{background:var(--blue-lt);border:2px solid #b0c8f0;color:var(--blue);}
.fd-ans.amber{background:var(--amber-lt);border:2px solid #f0d090;color:var(--amber);}
.fd-ans.red{background:var(--red-lt);border:2px solid #e8b0c0;color:var(--red);}
.fd-ex{display:block;font-size:11px;font-weight:400;margin-top:5px;padding-top:5px;border-top:1px dashed rgba(0,0,0,.12);font-family:'Lora',serif;font-style:italic;line-height:1.6;}
.fd-divider{width:100%;height:1px;background:var(--border-lt);margin:12px 0;}
.fd-tip{background:var(--amber-lt);border:1.5px solid #f0d090;border-radius:10px;padding:10px 16px;font-size:13px;color:var(--amber);text-align:center;width:100%;margin-top:8px;}
@media(max-width:600px){.fd-row{gap:6px;}.fd-branch{min-width:100px;}.fd-ans{font-size:11px;padding:8px 8px;}.fd-or{display:none;}}
.tag-line{font-size:11px;color:var(--muted);text-align:center;margin-top:20px;}
@media(max-width:480px){.tbl{font-size:12px;}.formula .key{font-size:14px;}.formula .slot{font-size:13px;}}
</style>
</head>
<body>

<div class="header">
  <div class="header-top">
    <h1>📐 비교급·최상급 뼈대 노트</h1>
    <span class="page-info" id="pageInfo">1 / 7</span>
  </div>
  <div class="step-tabs" id="stepTabs"></div>
</div>

<div class="page-wrap" id="app"></div>
<div class="tag-line">준티 잉글리쉬 · 자체 제작 학습 콘텐츠 · 문법 뼈대 노트</div>

<script>
/* ══ Web Audio 책 넘기는 소리 ══ */
const _ac=new(window.AudioContext||window.webkitAudioContext)();
function playPageTurn(){
  try{
    if(_ac.state==='suspended')_ac.resume();
    const now=_ac.currentTime;
    const make=(len,vol,delay,hp)=>{
      const buf=_ac.createBuffer(1,Math.floor(_ac.sampleRate*len),_ac.sampleRate);
      const d=buf.getChannelData(0);
      for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*(1-i/d.length);
      const src=_ac.createBufferSource();src.buffer=buf;
      const f=_ac.createBiquadFilter();f.type='highpass';f.frequency.value=hp;
      const g=_ac.createGain();
      g.gain.setValueAtTime(0,now+delay);
      g.gain.linearRampToValueAtTime(vol,now+delay+0.02);
      g.gain.exponentialRampToValueAtTime(0.001,now+delay+len);
      src.connect(f);f.connect(g);g.connect(_ac.destination);
      src.start(now+delay);src.stop(now+delay+len);
    };
    make(0.16,0.32,0,1800);make(0.07,0.14,0.09,3200);
  }catch(e){}
}

/* ══ TTS ══ */
let voice=null,ttsOk=false;
function loadVoices(){
  const vs=speechSynthesis.getVoices();
  const p=['Google US English','Samantha','Microsoft Aria','Karen','Alex'];
  for(const n of p){const v=vs.find(x=>x.name===n);if(v){voice=v;return;}}
  voice=vs.find(v=>v.lang==='en-US')||null;
}
if('speechSynthesis' in window){loadVoices();speechSynthesis.onvoiceschanged=loadVoices;}
function unlockTTS(){if(ttsOk||!('speechSynthesis' in window))return;const u=new SpeechSynthesisUtterance('');u.volume=0;speechSynthesis.speak(u);ttsOk=true;}
document.addEventListener('touchstart',unlockTTS,{once:true});
document.addEventListener('click',unlockTTS,{once:true});
function speak(t,b){
  if(!('speechSynthesis' in window))return;
  unlockTTS();speechSynthesis.cancel();
  document.querySelectorAll('.snd.playing').forEach(x=>x.classList.remove('playing'));
  const u=new SpeechSynthesisUtterance(t);
  if(voice)u.voice=voice;u.lang='en-US';u.rate=.9;
  if(b){b.classList.add('playing');u.onend=()=>b.classList.remove('playing');}
  speechSynthesis.speak(u);
}
function mkSnd(t){const b=document.createElement('button');b.className='snd';b.innerHTML='🔊';b.onclick=()=>speak(t,b);return b;}

/* ══ 유틸 ══ */
function mk(t,c){const b=document.createElement('button');b.className=c;b.type='button';b.textContent=t;return b;}
function norm(s){return(s||'').toLowerCase().replace(/[^a-z0-9 ]/g,'').replace(/\s+/g,' ').trim();}
function ansBtn(el){
  const b=mk('정답 보기','mini-btn');
  b.onclick=()=>{const o=el.classList.toggle('open');b.textContent=o?'정답 숨기기':'정답 보기';};
  return b;
}
function attachBar(wrap,items){
  const bar=document.createElement('div');bar.className='check-bar';
  const pill=document.createElement('span');pill.className='result-pill';pill.style.display='none';
  const gb=mk('전체 채점','cb cb-g');
  const rb=mk('❌ 틀린 것만 다시','cb cb-r');rb.disabled=true;
  const sb=mk('전체 보기','cb cb-s');sb.style.display='none';
  function refresh(){
    const ok=items.filter(x=>x._ok).length;
    pill.style.display='inline-block';
    pill.className='result-pill '+(ok===items.length?'pill-ok':'pill-bad');
    pill.textContent=ok+' / '+items.length+' 정답';
    rb.disabled=ok===items.length;
  }
  gb.onclick=()=>{items.forEach(it=>{if(!it.row.classList.contains('hide'))it._ok=it.grade();});refresh();};
  rb.onclick=()=>{
    items.forEach(it=>{it._ok?it.row.classList.add('hide'):(it.row.classList.remove('hide'),it.reset());});
    sb.style.display='inline-block';
  };
  sb.onclick=()=>{items.forEach(it=>it.row.classList.remove('hide'));pill.style.display='none';};
  bar.append(gb,rb,sb,pill);
  wrap.appendChild(bar);
}

/* ══ 페이지 전환 ══ */
const STEPS=[
  {label:'원급이란?',sn:'개념'},
  {label:'형태 만들기',sn:'규칙'},
  {label:'원급 공식',sn:'as~as'},
  {label:'비교급 공식',sn:'비교급'},
  {label:'최상급 공식',sn:'최상급'},
  {label:'로직 트리',sn:'판단'},
  {label:'확인 문제',sn:'연습'},
];
let cur=0;

function renderTabs(){
  const tabs=document.getElementById('stepTabs');tabs.innerHTML='';
  STEPS.forEach((s,i)=>{
    const b=document.createElement('button');b.className='stab'+(i===cur?' on':'');
    b.innerHTML='<span class="sn">'+s.sn+'</span>'+s.label;
    b.onclick=()=>goPage(i);
    tabs.appendChild(b);
  });
  document.getElementById('pageInfo').textContent=(cur+1)+' / '+STEPS.length;
}

function goPage(i){
  if(i===cur)return;
  playPageTurn();
  cur=i;renderTabs();
  const app=document.getElementById('app');
  app.innerHTML='';
  setTimeout(()=>{
    app.classList.add('page-enter');
    const builders=[p1,p2,p3,p4,p5,p6,p7];
    app.innerHTML=builders[i]();
    attachPageEvents(i);
    attachSlots();
    setTimeout(()=>app.classList.remove('page-enter'),250);
  },80);
}

function attachPageEvents(i){
  if(i===6)buildQuizEvents();
}

/* ══════════════════════════
   P3 — 원급 공식
══════════════════════════ */
function p3(){
  return `
<div class="sec">
  <div class="sec-head"><span class="badge bp">STEP 3</span><span class="sec-title">원급 비교 공식 완전 정리</span></div>

    <span class="f-label">📌 원급 비교 기본 공식</span>
    <span class="key">A + V + <span class="slot">as</span> + 원급 + <span class="slot">as</span> + B</span>
    <span class="dim"><span class="arr">→</span> A는 B<strong>만큼</strong> ~하다 (같음)</span>
  </div>
  <div class="ex"><div class="en">She is <span class="hl">as tall as</span> I am.</div><div class="kr">→ 그녀는 나만큼 키가 크다.</div></div>

  <div class="ex"><div class="en">She is <span class="hl">not as tall as</span> I am.</div><div class="kr">→ 그녀는 나만큼 키가 크지 않다. (내가 더 크다)</div></div>

  <div class="divider"></div>

    <div class="formula amber">
      <span class="f-label">📌 배수 표현</span>
      <span class="key"><span class="slot">twice / three times / half</span> + as + 원급 + as</span>
      <span class="dim"><span class="arr">→</span> ~의 두 배 / 세 배 / 절반만큼 ~하다</span>
    </div>
    <div class="ex"><div class="en">This room is <span class="hl">twice as large as</span> that one.</div><div class="kr">→ 이 방은 저 방의 두 배만큼 크다.</div></div>
    <div class="ex"><div class="en">She earns <span class="hl">three times as much as</span> I do.</div><div class="kr">→ 그녀는 나보다 세 배나 많이 번다.</div></div>
  </div>

  <div class="cbox cbox-g">
    <div class="cbox-title ct-g">as many/much/few/little + 명사 + as</div>
    <div class="formula green">

   words:["No","other","mountain","in","the","world","is","higher","than","Mt.","Everest","."],
   ans:"No other mountain in the world is higher than Mt. Everest."},
  {kr:"더 많이 읽을수록 더 많이 알게 된다.",
   hint:"The + 비교급 + S + V, the + 비교급 + S + V",
   words:["The","more","you","read",",","the","more","you","know","."],
   ans:"The more you read, the more you know."},
];

let blankItems=[], mcItems=[], chipItems=[];

function buildQuizEvents(){
  buildBlanks();
  buildMC();
  buildChips();
}

function buildBlanks(){
  const wrap=document.getElementById('blankQ');
  if(!wrap)return;
  BLANK_Q.forEach((d,i)=>{
    const row=document.createElement('div');row.className='q-item';
    const num=document.createElement('div');num.className='q-num';num.textContent='Q'+(i+1);
    const kr=document.createElement('div');kr.className='q-kr';kr.textContent=d.kr;
    const hint=document.createElement('div');hint.className='q-hint';
    hint.innerHTML='<b>💡 어순 힌트</b> '+d.hint;
    const sentDiv=document.createElement('div');sentDiv.className='q-sent';
    const inp=document.createElement('input');inp.className='b-inp';inp.type='text';
    inp.autocomplete='off';inp.spellcheck=false;inp.placeholder='___';
    inp.style.minWidth='140px';
    if(d.parts.length===2){
      sentDiv.appendChild(document.createTextNode(d.parts[0]));
      sentDiv.appendChild(inp);
    } else {
      sentDiv.appendChild(document.createTextNode(d.parts[0]));
      sentDiv.appendChild(inp);
      sentDiv.appendChild(document.createTextNode(d.parts[2]||''));
    }
    const reveal=document.createElement('div');reveal.className='ans-reveal';
    reveal.innerHTML='정답: <strong>'+d.b+'</strong><br>'+d.en+'<br><span style="font-size:11px;color:var(--muted);">해석: '+d.kr+'</span>';
    const sndB=mkSnd(d.en);
    const chk=document.createElement('button');chk.className='mini-btn';chk.textContent='채점';
    const fb=document.createElement('div');fb.className='q-fb';
    const item={row,_ok:false,
      grade(){
        const ok=norm(inp.value)===norm(d.b);
        inp.classList.remove('ok','no');inp.classList.add(ok?'ok':'no');
        fb.className='q-fb show '+(ok?'ok':'no');
        fb.textContent=ok?'✅ 정답!':'❌ 다시 확인해보세요.';
        return ok;
      },
      reset(){inp.value='';inp.classList.remove('ok','no');fb.className='q-fb';}};
    chk.onclick=()=>{item._ok=item.grade();};
    inp.addEventListener('keydown',e=>{if(e.key==='Enter')item._ok=item.grade();});
    const btns=document.createElement('div');btns.className='q-btns';
    btns.append(chk,sndB,ansBtn(reveal));
    row.append(num,kr,hint,sentDiv,fb,btns,reveal);
    wrap.appendChild(row);blankItems.push(item);
  });
  attachBar(wrap,blankItems);
}

function buildMC(){
  const wrap=document.getElementById('mcQ');
  if(!wrap)return;
  MC_Q.forEach((d,i)=>{
    const row=document.createElement('div');row.className='q-item';
    const num=document.createElement('div');num.className='q-num';num.textContent='Q'+(i+1);
    const q=document.createElement('div');q.className='q-sent';q.textContent=d.q;
    const kr=document.createElement('div');kr.className='q-kr';kr.textContent=d.kr;
    const hint=document.createElement('div');hint.className='q-hint';
    hint.innerHTML='<b>💡 힌트</b> '+d.hint;
    const opts=document.createElement('div');opts.className='mc-opts';
    const fb=document.createElement('div');fb.className='q-fb';
    let done=false;
    d.opts.forEach((o,oi)=>{
      const b=document.createElement('div');b.className='mc-opt';
      b.innerHTML='<span class="on">'+'①②③④'[oi]+'</span>'+o;
      b.onclick=()=>{
        if(done)return;done=true;
        const ok=oi===d.ans;
        b.classList.add(ok?'ch-ok':'ch-no');
        [...opts.children].forEach((x,xi)=>{if(xi===d.ans&&!ok)x.classList.add('ch-rv');});
        fb.className='q-fb show '+(ok?'ok':'no');
        fb.textContent=(ok?'✅ ':'❌ ')+d.fb;
      };
      opts.appendChild(b);
    });
    row.append(num,q,kr,hint,opts,fb);
    wrap.appendChild(row);
  });
}

function buildChips(){
  const wrap=document.getElementById('chipQ');
  if(!wrap)return;
  CHIP_Q.forEach((d,i)=>{
    const row=document.createElement('div');row.className='q-item';
    const num=document.createElement('div');num.className='q-num';num.textContent='Q'+(i+1);
    const kr=document.createElement('div');kr.className='q-kr';kr.textContent=d.kr;
    const hint=document.createElement('div');hint.className='q-hint';
    hint.innerHTML='<b>💡 구조 힌트</b> '+d.hint;
    const slots=document.createElement('div');slots.className='answer-slots';
    const chips=document.createElement('div');chips.className='chip-wrap';
    const used=[];
    [...d.words].sort(()=>Math.random()-.5).forEach((w,wi)=>{
      const orig=d.words.indexOf(w);
      const c=document.createElement('button');c.className='chip';c.textContent=w;
      c.dataset.wi=wi;
      c.onclick=()=>{
        if(c.classList.contains('used'))return;
        c.classList.add('used');
        const sc=document.createElement('button');sc.className='slot-chip';sc.textContent=w;
        sc.onclick=()=>{c.classList.remove('used');sc.remove();};
        slots.appendChild(sc);
      };
      chips.appendChild(c);
    });
    const reveal=document.createElement('div');reveal.className='ans-reveal';
    reveal.innerHTML='정답: <strong>'+d.ans+'</strong>';
    const chk=document.createElement('button');chk.className='mini-btn';chk.textContent='확인';
    chk.onclick=()=>{
      const cur=[...slots.querySelectorAll('.slot-chip')].map(s=>s.textContent).join(' ');
      const ok=cur===d.ans;
      if(ok){slots.style.borderColor='var(--ok)';slots.style.background='var(--ok-bg)';}
      else{slots.style.borderColor='var(--no)';reveal.classList.add('open');}
    };
    const reset=document.createElement('button');reset.className='mini-btn';reset.textContent='초기화';
    reset.onclick=()=>{
      slots.innerHTML='';slots.style.borderColor='';slots.style.background='';
      chips.querySelectorAll('.chip').forEach(c=>c.classList.remove('used'));
      reveal.classList.remove('open');
    };
    const btns=document.createElement('div');btns.className='q-btns';
    btns.append(chk,reset,mkSnd(d.ans),ansBtn(reveal));
    row.append(num,kr,hint,chips,slots,btns,reveal);
    wrap.appendChild(row);
  });
}
