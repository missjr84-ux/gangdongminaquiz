<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>모의고사 변형 — 유형 공식 훈련</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#F4F5F7;--paper:#FFFFFF;--ink:#1E2330;--muted:#636A77;--line:#D8DCE3;--mark:#FFE07A;--ok:#17805A;--okbg:#E5F4EC;--bad:#C93C4A;--badbg:#FBE9EB;--hint:#9A6B00;--hintbg:#FFF5D6;}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Noto Sans KR',system-ui,sans-serif;font-size:17px;line-height:1.65;padding-bottom:env(safe-area-inset-bottom)}
.wrap{max-width:800px;margin:0 auto;padding:16px 16px 80px}
header.top{padding:18px 0 14px;border-bottom:2px solid var(--ink);margin-bottom:14px}
header.top h1{margin:0;font-size:24px;font-weight:900;letter-spacing:-.5px}
header.top p{margin:4px 0 0;color:var(--muted);font-size:15px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 6px}
.srow,.qrow{display:flex;flex-wrap:wrap;gap:8px;width:100%}
.srow{margin-bottom:6px}
.stab{font:inherit;border:2px solid var(--line);background:var(--paper);border-radius:8px;padding:6px 12px;cursor:pointer;color:var(--ink);display:flex;flex-direction:column;align-items:flex-start;line-height:1.35;min-height:46px;text-align:left}
.stab b{font-size:15px}
.stab span{font-size:12.5px;color:var(--muted)}
.stab.on{border-color:var(--ink);box-shadow:inset 0 -3px 0 var(--ink)}
.stab.done b::after{content:' ✓';color:var(--ok)}
.stab:disabled{opacity:.4;cursor:not-allowed}
.chip{border:2px solid var(--line);background:var(--paper);border-radius:999px;padding:6px 14px;font:inherit;font-size:15px;font-weight:700;color:var(--ink);cursor:pointer;display:flex;gap:6px;align-items:center;min-height:42px}
.chip .dot{width:9px;height:9px;border-radius:50%;background:var(--c)}
.chip.on{border-color:var(--c);box-shadow:inset 0 -3px 0 var(--c)}
.chip.done::after{content:'✓';color:var(--ok);font-weight:900}
.chip:disabled{opacity:.4;cursor:not-allowed}
.chip.res{--c:var(--ink)}
.progress{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin:6px 0 18px}
.progress i{display:block;height:100%;background:var(--ink);transition:width .4s}
.qhead{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin:6px 0 10px}
.btn.arm{background:var(--bad);border-color:var(--bad);color:#fff}
.qhead .redo1{margin:0 0 0 auto;min-height:36px;padding:4px 12px;font-size:14px}
.qhead h2{margin:0;font-size:22px;font-weight:900}
.badge{display:inline-block;border-radius:6px;padding:2px 10px;font-size:14px;font-weight:700;color:#fff;background:var(--c)}
.src{color:var(--muted);font-size:14px}
.formula{border-left:5px solid var(--c);padding:6px 0 6px 14px;margin:0 0 16px}
.formula div{font-weight:700;font-size:16px}
.formula div::before{content:'공식 ';color:var(--c);font-weight:900}
.paper{background:var(--paper);border:1px solid var(--line);border-radius:4px;padding:20px 22px;margin-bottom:18px}
.blk{margin:0 0 12px;font-size:18px;line-height:2.05}
.blk:last-child{margin-bottom:0}
.blk .lab{font-weight:900;margin-right:6px}
.blk.given{border:1.5px solid var(--ink);padding:8px 14px;border-radius:3px}
.blk.given .lab{display:block;font-size:14px;color:var(--muted);font-weight:700;line-height:1.4;margin-bottom:2px}
.blk u{text-decoration-thickness:2px;text-underline-offset:4px}
.trbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:0 0 10px}
.trbar .btn{margin:0}
.trbar span{color:var(--muted);font-size:14.5px}
.blk2{margin:0 0 14px}
.blk2.given{border:1.5px solid var(--ink);padding:6px 14px;border-radius:3px}
.blk2 .lab{display:block;font-weight:900;margin:0 0 2px}
.pair{padding:10px 0;border-top:1px dashed var(--line)}
.blk2 .pair:first-of-type{border-top:0}
.en{font-size:18px;line-height:1.9}
.sn{display:inline-block;min-width:22px;font-size:13px;font-weight:900;color:var(--muted);vertical-align:2px}
.kr{font-size:16px;line-height:1.8;color:#3A4150;padding-left:22px}
.nt{font-size:14.5px;line-height:1.7;color:var(--c);font-weight:700;padding-left:22px;margin-top:2px}
.cue.on{text-decoration:underline wavy var(--c);text-decoration-thickness:2px;text-underline-offset:5px;font-weight:700;color:var(--c)}
.sen.scand{cursor:pointer;border-radius:3px}
.sen.scand:hover{background:#EDF0F4}
.sen.spick{background:#FFF0B3}
.sen[data-pick]::before,.sen[data-ord]::before{content:attr(data-pick);display:inline-block;font-size:12px;font-weight:900;line-height:1;padding:3px 6px;border-radius:9px;background:var(--ink);color:#fff;margin-right:4px;vertical-align:2px}
.sen[data-ord]::before{content:attr(data-ord);background:var(--c)}
.sen.skip{color:#5F6672}
.sen.skip[data-ord]::before{background:#E1E4E9;color:#3F4550}
.tblw{margin:4px 0 14px;overflow-x:auto}
.tblt{font-weight:900;text-align:center;margin-bottom:6px}
.dt{border-collapse:collapse;width:100%;font-size:16px}
.dt th,.dt td{border:1px solid #9AA1AD;padding:6px 10px;text-align:left}
.dt th{background:#F1F3F6}
.dt td.n{text-align:center}
.tblu{font-size:13.5px;color:var(--muted);text-align:right;margin-top:4px}
.pv{border:1px dashed #AEB4BF;border-radius:4px;padding:10px 14px;margin:-8px 0 18px;background:#FAFBFC}
.pvh{font-size:13.5px;font-weight:700;color:var(--muted);margin-bottom:4px}
.pvo{font-size:15px;line-height:1.7;padding:2px 0}
.sen.sshow{outline:2px dashed var(--bad);outline-offset:2px}
.seqv{margin-top:6px;font-weight:700}
.tk{border-radius:3px;transition:background-color .25s}
.tk.cand{cursor:pointer;background-image:linear-gradient(transparent 88%,#B9BFCA 88%);padding:0 1px}
.tk.cand:hover{background-color:#F0F2F5}
.tk.cand.box{outline:2px dashed #8A93A3;outline-offset:2px;background-color:#F1F3F6;background-image:none;border-radius:4px;padding:0 3px}
.tk.box[data-bn]::before{content:attr(data-bn);display:inline-block;font-size:11.5px;font-weight:900;line-height:1;padding:3px 6px;border-radius:9px;background:#5F6672;color:#fff;margin-right:4px;vertical-align:2px}
.tk.sel{background-color:var(--mark)!important;background-image:none}
.tk.show{outline:2px dashed var(--bad);outline-offset:2px}
.tk.found{background-image:linear-gradient(transparent 82%,var(--c) 82%);font-weight:700}
.tk.wrong{background-color:var(--badbg)!important;text-decoration:line-through;text-decoration-color:var(--bad)}
.tk:focus-visible,.opt:focus-visible,.chip:focus-visible,.btn:focus-visible,.rchip:focus-visible{outline:3px solid #2B68C4;outline-offset:2px}
.step{background:var(--paper);border:1px solid var(--line);border-radius:4px;margin-bottom:12px;padding:16px 18px}
.step.lock{background:transparent;border-style:dashed;color:var(--muted);padding:12px 18px}
.step.ok{border-color:var(--ok)}
.shd{display:flex;gap:10px;align-items:flex-start}
.num{flex:none;width:30px;height:30px;border-radius:50%;border:2px solid var(--ink);display:grid;place-items:center;font-weight:900;font-size:15px}
.step.ok .num{background:var(--ok);border-color:var(--ok);color:#fff}
.step.lock .num{border-color:var(--line);color:var(--muted)}
.sq{font-weight:700;font-size:17px;padding-top:2px}
.sbody{margin:12px 0 0 40px}
.opts{display:grid;gap:8px}
.opt{text-align:left;font:inherit;font-size:16px;border:2px solid var(--line);background:#fff;border-radius:6px;padding:10px 14px;cursor:pointer;color:var(--ink);min-height:48px}
.opt:hover{border-color:#9AA2AF}
.opt.pick{border-color:var(--ok);background:var(--okbg);font-weight:700}
.opt.no{border-color:var(--bad);background:var(--badbg)}
.opt.show{border-style:dashed;border-color:var(--bad)}
.opt:disabled{cursor:default}
.mrow{border-top:1px solid var(--line);padding:10px 0}
.mrow:first-child{border-top:0;padding-top:0}
.mlab{font-weight:700;margin-bottom:6px}
.mlab.x::after{content:' — 다시';color:var(--bad);font-weight:700}
.rchips{display:flex;flex-wrap:wrap;gap:6px}
.rchip{font:inherit;font-size:15px;border:2px solid var(--line);background:#fff;border-radius:999px;padding:6px 12px;cursor:pointer;color:var(--ink);min-height:40px}
.rchip.sel{border-color:var(--ink);background:var(--ink);color:#fff}
.rchip.show{border-style:dashed;border-color:var(--bad)}
.rchip:disabled{cursor:default}
.btn{font:inherit;font-weight:700;font-size:16px;border:2px solid var(--ink);background:var(--ink);color:#fff;border-radius:6px;padding:10px 20px;cursor:pointer;margin-top:12px;min-height:46px}
.btn.ghost{background:#fff;color:var(--ink)}
.msg{margin-top:10px;padding:10px 12px;border-radius:6px;font-size:15.5px}
.msg.hint{background:var(--hintbg);color:#5E4300}
.msg.ok{background:var(--okbg);color:#0E5A3E}
.msg.rv{background:var(--badbg);color:#7D1F2A}
.pre{border-left:3px solid var(--c);padding:6px 0 6px 12px;margin:0 0 12px;font-size:15.5px;line-height:1.75}
.pre div:first-child{font-weight:700}
.tapnote{font-size:14.5px;color:var(--muted);margin:2px 0 0}
.after{background:var(--paper);border:2px solid var(--ok);border-radius:4px;padding:18px 20px;margin:6px 0 16px}
.after h3{margin:0 0 10px;font-size:19px}
.after h4{margin:16px 0 6px;font-size:16px}
.mg{margin:8px 0 12px;border-left:3px solid var(--c);padding-left:12px}
.mgt{font-weight:900;font-size:15px;margin-bottom:2px}
.mgi{padding:4px 0;border-top:1px dashed var(--line);font-size:15px;line-height:1.6}
.mgi:first-of-type{border-top:0}
.mgi b{display:block}
.mgi span{color:var(--muted)}
.olist div{padding:6px 0;border-top:1px solid var(--line);font-size:15.5px}
.olist div:first-child{border-top:0}
.olist b{display:inline-block;min-width:0;margin-right:6px}
table.lk{width:100%;border-collapse:collapse;font-size:15px}
table.lk td{border:1px solid var(--line);padding:7px 9px;vertical-align:top}
table.lk td:first-child{width:50%}
details{margin-top:14px;border-top:1px solid var(--line);padding-top:10px}
summary{cursor:pointer;font-weight:700}
details p{font-size:15.5px;line-height:1.9}
.next{display:flex;justify-content:flex-end}
.sum{background:var(--paper);border:2px solid var(--ink);border-radius:4px;padding:20px}
.sum h2{margin:0 0 6px;font-size:22px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0}
.stats div{border:1px solid var(--line);border-radius:4px;padding:10px;text-align:center}
.stats b{display:block;font-size:26px;font-weight:900}
.code{font-size:26px;font-weight:900;letter-spacing:2px;border:2px dashed var(--ink);padding:10px 14px;text-align:center;margin:12px 0}
.qline{display:flex;justify-content:space-between;align-items:center;gap:8px;border-top:1px solid var(--line);padding:8px 0;font-size:15.5px;flex-wrap:wrap}
.qline .btn{margin:0;padding:6px 12px;min-height:38px;font-size:14.5px}
.foot{margin-top:24px;color:var(--muted);font-size:13.5px;text-align:center}
.flash{animation:fl .5s}
@keyframes fl{0%{transform:scale(1)}40%{transform:scale(1.02)}100%{transform:scale(1)}}
@media (max-width:560px){body{font-size:16px}.paper{padding:16px}.blk{font-size:17px}.sbody{margin-left:0}.step{padding:14px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;scroll-behavior:auto!important}}
</style>
</head>

  b=`<p class="tapnote">${st.done?'찾은 단서가 지문에 밑줄로 남아 있다.':'위 지문에서 해당 부분을 탭한 뒤 확인을 누르세요. 다시 탭하면 취소된다.'}</p>${st.done?'':`<button class="btn" data-chk="${k}">확인</button>`}`;
 }else if(s.k==='order'){
  const lab=st.sel.length?st.sel.map(n=>n+'번째').join(' → '):'아직 안 고름';
  b=st.done?`<p class="tapnote">지문에 읽는 순서 번호가 남아 있다.</p>`:`<p class="tapnote">위 지문에서 문장을 순서대로 탭하세요. 다시 탭하면 빠진다.</p><div class="seqv">선택: ${esc(lab)}</div><button class="btn" data-chk="${k}">확인</button> <button class="btn ghost" data-clr="${k}">다시 고르기</button>`;
 }else if(s.k==='match'){
  b=s.rows.map((r,ri)=>{const v=st.sel[ri];const x=!st.done&&st.bad.includes(ri);return `<div class="mrow"><div class="mlab${x?' x':''}">${esc(r[0])}</div><div class="rchips">${r[1].map((o,j)=>{let c='rchip';if(v===j)c+=' sel';if(!st.done&&st.rv&&j===r[2]&&v!==j)c+=' show';return `<button class="${c}" data-s="${k}" data-r="${ri}" data-o="${j}" ${st.done?'disabled':''}>${esc(o)}</button>`}).join('')}</div></div>`}).join('')+(st.done?'':`<button class="btn" data-chk="${k}">확인</button>`);
 }
 let msg='';
 if(st.done){msg=`<div class="msg ok">${st.res===1?'한 번에 정답!':st.res===2?'힌트 보고 정답.':'정답 확인 후 직접 해결.'}${s.w?' '+esc(s.w):''}</div>`}
 else if(st.msg){msg=`<div class="msg ${st.mt}">${esc(st.msg)}</div>`}
 const pre=s.pre?`<div class="pre">${s.pre.map(l=>`<div>${esc(l)}</div>`).join('')}</div>`:'';
 return `<div class="step${st.done?' ok':''}" id="st${k}"><div class="shd"><span class="num">${k+1}</span><span class="sq">${esc(title)}</span></div><div class="sbody">${pre}${b}${msg}</div></div>`;
}
function paintPassage(i){
 const d=DATA[i],q=ST.q[i],a=active(i);
 const found=new Set();d.steps.forEach((s,k)=>{if(s.k==='tap'&&q.steps[k].done)s.a.forEach(x=>found.add(x))});
 const s=a>=0?d.steps[a]:null,st=a>=0?q.steps[a]:null;
 document.querySelectorAll('#psg .sen').forEach(el=>{const n=+el.dataset.sn;el.className='sen';delete el.dataset.pick;delete el.dataset.ord;
  if(s&&s.k==='order'){el.classList.add('scand');const p=st.sel.indexOf(n);if(p>=0){el.classList.add('spick');el.dataset.pick=s.any?'✓':String(p+1)}if(st.rv&&!st.sel.includes(n)&&s.seq.includes(n))el.classList.add('sshow')}
  if(!(s&&s.k==='order'))d.steps.forEach((s2,k2)=>{if(s2.k!=='order'||!q.steps[k2].done)return;const R={};(s2.roles||'').split('|').forEach(x=>{const p=x.indexOf(':');if(p>0)R[+x.slice(0,p)]=x.slice(p+1)});
   if(s2.seq.includes(n)){el.classList.add('key');el.dataset.ord=(s2.any?'':(s2.seq.indexOf(n)+1)+' ')+(R[n]||'읽기')}else if(R[n]){el.classList.add('skip');el.dataset.ord=R[n]}});
 });
 document.querySelectorAll('#psg .cue').forEach(el=>{el.classList.toggle('on',!!(s&&s.cue&&s.cue.includes(el.dataset.cue)))});
 document.querySelectorAll('#psg .tk').forEach(el=>{
  const id=el.dataset.id;el.className='tk';delete el.dataset.bn;el.removeAttribute('tabindex');el.removeAttribute('role');
  if(found.has(id))el.classList.add('found');
  if(s&&s.k==='tap'&&s.c.includes(id)){el.classList.add('cand');if(s.box){el.classList.add('box');el.dataset.bn=s.c.indexOf(id)+1}else delete el.dataset.bn;el.tabIndex=0;el.setAttribute('role','button');
   if(st.sel.includes(id))el.classList.add('sel');
   if(st.rv&&s.a.includes(id)&&!st.sel.includes(id))el.classList.add('show');
   if(st.bad.includes(id)&&!st.sel.includes(id))el.classList.add('wrong');}
 });
}
function bind(i){
 const d=DATA[i],q=ST.q[i];
 document.querySelectorAll('#psg .tk').forEach(el=>{
  const f=()=>{const a=active(i);if(a<0)return;const s=d.steps[a];if(s.k!=='tap'||!s.c.includes(el.dataset.id))return;const st=q.steps[a];const id=el.dataset.id;st.bad=st.bad.filter(x=>x!==id);
   st.sel=st.sel.includes(id)?st.sel.filter(x=>x!==id):[...st.sel,id];paintPassage(i)};
  el.onclick=f;el.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();f()}};
 });
 document.querySelectorAll('#psg .sen').forEach(el=>{el.addEventListener('click',()=>{const a=active(i);if(a<0)return;const s=d.steps[a];if(s.k!=='order')return;const st=q.steps[a];const n=+el.dataset.sn;st.sel=st.sel.includes(n)?st.sel.filter(x=>x!==n):[...st.sel,n];st.msg='';renderKeep(i,a)})});
 document.querySelectorAll('[data-clr]').forEach(b=>b.onclick=()=>{const k=+b.dataset.clr;q.steps[k].sel=[];renderKeep(i,k)});
 document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{const k=+b.dataset.s,j=+b.dataset.o;const st=q.steps[k];st.sel=j;check(i,k)});
 document.querySelectorAll('.rchip').forEach(b=>b.onclick=()=>{const k=+b.dataset.s,r=+b.dataset.r,j=+b.dataset.o;const st=q.steps[k];st.sel[r]=j;st.bad=st.bad.filter(x=>x!==r);renderKeep(i,k)});
 document.querySelectorAll('[data-chk]').forEach(b=>b.onclick=()=>check(i,+b.dataset.chk));
 const tb=$('#trbtn');if(tb)tb.onclick=()=>{ST.tr=!ST.tr;save();renderKeep(i,0)};
 twoTap($('#redo1'),'한 번 더 누르면 처음부터',()=>{ST.q[i]={steps:d.steps.map(s=>newStep(s))};ST.view='q';save();render();window.scrollTo({top:0,behavior:'smooth'})});
 const nx=$('#nx');if(nx)nx.onclick=()=>{const L=sessQ(sessIdx(i)),j=L.indexOf(i);if(j<L.length-1){ST.cur=L[j+1];ST.view='q'}else ST.view='sum';save();render();window.scrollTo({top:0,behavior:'smooth'})};
}
function renderKeep(i,k){const y=window.scrollY;renderQ(i);chips();window.scrollTo(0,y)}
function check(i,k){
 const s=DATA[i].steps[k],st=ST.q[i].steps[k];let ok=false;
 if(s.k==='choice'||s.k==='final'){ok=st.sel===s.a;if(!ok&&!st.bad.includes(st.sel))st.bad.push(st.sel)}
 else if(s.k==='tap'){const A=new Set(s.a),S=new Set(st.sel);ok=A.size===S.size&&[...A].every(x=>S.has(x));if(!ok){st.bad=st.sel.filter(x=>!A.has(x));st.sel=st.sel.filter(x=>A.has(x))}}
 else if(s.k==='order'){if(s.any){const A=new Set(s.seq),S=new Set(st.sel);ok=A.size===S.size&&[...A].every(x=>S.has(x));if(!ok)st.sel=st.sel.filter(x=>A.has(x))}else{ok=st.sel.length===s.seq.length&&st.sel.every((x,j)=>x===s.seq[j]);if(!ok)st.sel=[]}}
 else if(s.k==='match'){if(st.sel.some(v=>v===null)){st.msg='모든 줄을 골라야 확인할 수 있어요.';st.mt='hint';return renderKeep(i,k)}st.bad=[];s.rows.forEach((r,ri)=>{if(st.sel[ri]!==r[2])st.bad.push(ri)});ok=st.bad.length===0;if(!ok)st.bad.forEach(ri=>st.sel[ri]=null)}
 if(ok){st.done=true;st.res=st.rv?3:(st.att===0?1:2);st.msg='';st.bad=[];save();renderKeep(i,k);
  const nxt=document.getElementById('st'+(k+1));const tgt=nxt||document.querySelector('.after');if(tgt){tgt.classList.add('flash');tgt.scrollIntoView({behavior:'smooth',block:'center'})}
  return}
 st.att++;
 if(st.att===1){st.msg='힌트: '+s.h;st.mt='hint'}
 else{st.rv=true;st.msg=s.k==='order'?'읽어야 할 문장을 빨간 점선으로 표시했어요. '+(s.any?'모두 탭하고':'순서대로 탭하고')+' 확인을 누르세요.':s.k==='tap'?'정답 위치를 빨간 점선으로 표시했어요. 직접 탭해서 확인을 누르세요.':s.k==='match'?'정답을 빨간 점선으로 표시했어요. 직접 골라서 확인을 누르세요.':'정답을 빨간 점선으로 표시했어요. 직접 눌러서 넘어가세요.';st.mt='rv'}
 save();renderKeep(i,k);
}
function afterHTML(d){
 const A=d.after;
 return `<div class="after"><h3>정답 ${(()=>{const f=d.steps.find(x=>x.k==='final');return esc(f.o[f.a].split(' ')[0])})()} — 해설</h3>
 <h4>선지 판정</h4><div class="olist">${A.opts.map(o=>`<div><b>${esc(o[0])}</b>${esc(o[1])}</div>`).join('')}</div>
 <h4>연결구조</h4><table class="lk">${A.link.map(r=>`<tr><td>${esc(r[0])}</td><td>${esc(r[1])}</td></tr>`).join('')}</table>
 <p style="font-size:15.5px;margin:12px 0 0">${esc(A.note)}</p>
 ${A.more?`<h4>같이 알아두면 좋을 표현</h4>${A.more.map(g=>`<div class="mg"><div class="mgt">${esc(g.t)}</div>${g.i.map(x=>`<div class="mgi"><b>${esc(x[0])}</b><span>${esc(x[1])}</span></div>`).join('')}</div>`).join('')}`:''}
 <p style="font-size:14.5px;color:var(--muted);margin:10px 0 0">지문 위 "문장별 해석 켜기"를 누르면 문장마다 해석과 구문 포인트가 나온다.</p></div>`;
}
function stats(L){let o=0,h=0,r=0;L.forEach(i=>ST.q[i].steps.forEach(s=>{if(s.res===1)o++;else if(s.res===2)h++;else if(s.res===3)r++}));return{o,h,r}}
function code(L,k){const{o,h,r}=stats(L);const p=n=>String(n).padStart(2,'0');const c=String.fromCharCode(65+((o*3+h*5+r*7+k*11)%26));return `${EXAM.code}${SS.length>1?'-S'+sessNum(k):''}-${p(o)}${p(h)}${p(r)}-${c}`}
function renderSum(){
 const k=ST.sess,L=sessQ(k),S=SS[k];const{o,h,r}=stats(L);const fin=sessDone(k);const nm=SS.length>1?S.n:'';
 let x=`<div class="sum"><h2>${fin?(nm?nm+' 완료':L.length+'문항 완료'):(nm?nm+' 진행 상황':'진행 상황')}</h2>${S.t?`<p style="margin:0 0 4px;font-weight:700">${esc(S.t)}</p>`:''}<p style="margin:0;color:var(--muted)">${fin?'완료 코드를 클래스룸 댓글로 제출하세요.':L.length+'문항을 모두 끝내면 완료 코드가 나온다.'}</p>
 ${fin?`<div class="code">${code(L,k)}</div>`:''}
 <div class="stats"><div><b>${o}</b>한 번에 정답</div><div><b>${h}</b>힌트 후 정답</div><div><b>${r}</b>정답 공개</div></div>
 <h3 style="font-size:17px;margin:16px 0 4px">문항별</h3>`;
 L.forEach(i=>{const d=DATA[i],q=ST.q[i];const rv=q.steps.filter(s=>s.res===3).length,hh=q.steps.filter(s=>s.res===2).length;
  const dn=qDone(i);x+=`<div class="qline"><span><span class="badge" style="--c:${color(d)}">${d.type}</span> ${d.src}번 변형 — ${dn?`힌트 ${hh} · 공개 ${rv}`:'아직 안 끝남'}</span>${dn?'':`<button class="btn ghost" data-go="${i}">풀러 가기</button>`}${rv?`<button class="btn ghost" data-redo="${i}">공개된 문제 다시 풀기</button>`:''}</div>`});
 x+=`<div style="margin-top:16px;display:flex;gap:8px;flex-wrap:wrap">${fin&&k<SS.length-1?`<button class="btn" id="nsess">다음 회차로 (${esc(SS[k+1].n)})</button>`:''}<button class="btn ghost" id="redoS">${nm?esc(nm)+' ':''}전부 다시 풀기</button><button class="btn ghost" id="reset">모든 회차 기록 지우기</button></div></div>`;
 $('#main').innerHTML=x;
 document.querySelectorAll('[data-redo]').forEach(b=>b.onclick=()=>{const i=+b.dataset.redo;ST.q[i]={steps:DATA[i].steps.map(s=>newStep(s))};ST.cur=i;ST.view='q';save();render();window.scrollTo({top:0})});
 document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{ST.cur=+b.dataset.go;ST.view='q';save();render();window.scrollTo({top:0})});
 const ns=$('#nsess');if(ns)ns.onclick=()=>{ST.sess=k+1;ST.cur=sessQ(k+1)[0];ST.view='q';save();render();window.scrollTo({top:0})};
 twoTap($('#redoS'),'한 번 더 누르면 이 회차만 처음부터',()=>{L.forEach(i=>{ST.q[i]={steps:DATA[i].steps.map(s=>newStep(s))}});ST.cur=L[0];ST.view='q';save();render();window.scrollTo({top:0})});
 twoTap($('#reset'),'한 번 더 누르면 모든 기록 삭제',()=>{ST=fresh();ST.sess=0;save();render()});
}
/* 시작 */
document.title=EXAM.title;$('#ttl').textContent=EXAM.title;$('#sub').textContent=EXAM.sub;$('#foot').textContent=EXAM.footer+(EXAM.ver?' · '+EXAM.ver:'');
try{render()}catch(e){console.error(e);ST=fresh();ST.sess=0;try{save()}catch(_){}render()}
</script></body></html>
