<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>준티 잉글리쉬 · 중2 L5 문법 뼈대 노트 (지각동사 · 주격 관계대명사)</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;900&family=Lora:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f5f4fa; --card:#ffffff; --card2:#eeecf7; --card3:#f8f7fd;
  --purple:#5b4fa8; --purple-lt:#ece9f8; --purple-dk:#3b2f8a;
  --green:#1a7a3c; --green-lt:#e8f5ec;
  --amber:#e8a020; --amber-lt:#fef3dc;
  --blue:#1a5c9e; --blue-lt:#e8f0fb;
  --red:#c0392b; --red-lt:#fdecea;
  --text:#1a1a2e; --muted:#6b6880; --border:#d8d4ee;
  --ok:#1a7a3c; --ok-bg:#e8f5ec; --no:#c0392b; --no-bg:#fdecea;
  --ink:#1a1a2e; --sub:#6b6880; --r:12px;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Noto Sans KR',sans-serif;background:var(--bg);color:var(--text);padding:14px 10px 60px;}
.wrap{max-width:740px;margin:0 auto;}
header{background:linear-gradient(135deg,#3b2f8a,#7b6fd0);border-radius:16px;padding:20px 22px;color:#fff;margin-bottom:12px;}
header .brand{font-size:11px;font-weight:900;letter-spacing:2px;opacity:.85;}
header h1{font-size:19px;font-weight:900;margin-top:4px;}
header .sub{font-size:12px;opacity:.85;margin-top:4px;}
.pager{display:flex;align-items:center;gap:8px;margin-bottom:12px;}
.pg-btn{border:none;background:var(--purple);color:#fff;border-radius:10px;padding:11px 16px;font-size:13px;font-weight:900;cursor:pointer;font-family:inherit;}
.pg-btn:disabled{background:var(--card2);color:var(--muted);cursor:default;}
.pg-dots{flex:1;display:flex;justify-content:center;gap:6px;flex-wrap:wrap;}
.pg-dot{width:26px;height:26px;border-radius:50%;background:var(--card);border:2px solid var(--border);color:var(--muted);font-size:11px;font-weight:900;display:flex;align-items:center;justify-content:center;cursor:pointer;}
.pg-dot.on{background:var(--purple);border-color:var(--purple);color:#fff;}
.card{background:var(--card);border:1.5px solid var(--border);border-radius:var(--r);padding:16px;margin-bottom:12px;}
.sec-title{font-size:15px;font-weight:900;color:var(--purple-dk);margin-bottom:10px;}
.p-desc{font-size:13px;line-height:1.9;color:var(--text);margin-bottom:10px;}
.p-desc b{color:var(--purple-dk);}
.formula{border-radius:12px;padding:14px 18px;margin:10px 0;font-family:'Noto Sans KR',sans-serif;font-size:13px;line-height:2.1;border-left:5px solid var(--purple);background:var(--purple-lt);}
.formula.green{border-left-color:var(--green);background:var(--green-lt);}
.formula.amber{border-left-color:var(--amber);background:var(--amber-lt);}
.formula.red{border-left-color:var(--red);background:var(--red-lt);}
.formula.blue{border-left-color:var(--blue);background:var(--blue-lt);}
.formula .f-label{font-size:10px;font-weight:900;color:var(--purple);display:block;margin-bottom:6px;}
.formula.green .f-label{color:var(--green);} .formula.amber .f-label{color:var(--amber);}
.formula.red .f-label{color:var(--red);} .formula.blue .f-label{color:var(--blue);}
.formula .key{font-size:15px;font-weight:900;color:var(--purple-dk);display:block;font-family:'Lora',serif;}
.formula .slot{display:inline-block;background:var(--purple);color:transparent;border-radius:6px;padding:2px 9px;font-size:14px;margin:0 2px;cursor:pointer;border:2px dashed rgba(255,255,255,.5);position:relative;transition:color .2s;}
.formula .slot::before{content:'?';position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);color:#fff;font-weight:900;pointer-events:none;}
.formula .slot.revealed{color:#fff;border-style:solid;border-color:transparent;}
.formula .slot.revealed::before{display:none;}
.formula .dim{font-size:12px;color:var(--sub);display:block;margin-top:3px;}
.formula .eq{font-size:11px;color:var(--muted);margin-top:4px;display:block;padding-top:4px;border-top:1px dashed var(--border);}
.warn-tbl{width:100%;border-collapse:collapse;font-size:12.5px;margin:10px 0;}
.warn-tbl th{background:var(--purple-lt);color:var(--purple-dk);padding:8px;border:1px solid var(--border);font-size:12px;}
.warn-tbl td{padding:8px;border:1px solid var(--border);line-height:1.7;}
.warn-tbl .x{color:var(--no);font-family:'Lora',serif;}
.warn-tbl .o{color:var(--ok);font-family:'Lora',serif;font-weight:600;}
.flow-diagram{display:flex;flex-direction:column;align-items:center;gap:0;padding:4px 0;}
.fd-start{background:var(--ink);color:#fff;border-radius:12px;padding:11px 24px;font-size:14px;font-weight:900;}
.fd-arrow-down{font-size:22px;color:var(--muted);text-align:center;margin:2px 0;}
.fd-q{background:var(--blue-lt);border:2px solid #b0c8f0;border-radius:12px;padding:11px 20px;font-size:13px;font-weight:700;color:var(--blue);width:100%;max-width:420px;text-align:center;}
.fd-row{display:flex;gap:10px;width:100%;margin:8px 0;justify-content:center;flex-wrap:nowrap;}
.fd-row-wrap{flex-wrap:wrap;}
.fd-branch{display:flex;flex-direction:column;align-items:center;gap:0;flex:1;min-width:140px;max-width:220px;}
.fd-label{font-size:11px;font-weight:700;color:var(--muted);background:var(--card2);border-radius:6px;padding:3px 10px;text-align:center;white-space:nowrap;}
.fd-ans{border-radius:11px;padding:10px 12px;font-size:12px;font-weight:700;text-align:center;width:100%;line-height:1.6;}
.fd-ans.green{background:var(--green-lt);border:2px solid #b2d8c2;color:var(--green);}
.fd-ans.purple{background:var(--purple-lt);border:2px solid var(--border);color:var(--purple);}
.fd-ans.blue{background:var(--blue-lt);border:2px solid #b0c8f0;color:var(--blue);}
.fd-ans.amber{background:var(--amber-lt);border:2px solid #f0d090;color:var(--amber);}
.fd-ans.red{background:var(--red-lt);border:2px solid #e8b0c0;color:var(--red);}
.fd-ex{display:block;font-size:11px;font-weight:400;margin-top:5px;padding-top:5px;border-top:1px dashed rgba(0,0,0,.12);font-family:'Lora',serif;font-style:italic;}
.fd-tip{background:var(--amber-lt);border:1.5px solid #f0d090;border-radius:10px;padding:10px 16px;font-size:13px;color:var(--amber);text-align:center;width:100%;margin-top:8px;font-weight:700;}
.ex-line{font-family:'Lora',serif;font-size:14px;line-height:2;padding:4px 0;}
.ex-line i{font-family:'Noto Sans KR',sans-serif;font-style:normal;font-size:12px;color:var(--muted);display:block;}
.q-card{background:var(--card3);border:1.5px solid var(--border);border-radius:10px;padding:12px 14px;margin-bottom:10px;}
.q-num{display:inline-block;background:var(--purple);color:#fff;border-radius:6px;font-size:11px;font-weight:900;padding:2px 8px;margin-bottom:6px;}
.q-t{font-size:13.5px;font-weight:700;line-height:1.7;margin-bottom:8px;}
.q-sent{font-family:'Lora',serif;font-size:14.5px;line-height:2.2;background:#fff;border:1px dashed var(--border);border-radius:8px;padding:9px 12px;margin-bottom:8px;}
.q-sent input{border:none;border-bottom:2px solid var(--purple);width:110px;font-size:14.5px;font-family:'Lora',serif;text-align:center;background:transparent;padding:2px 4px;}
.q-sent input.ok{border-bottom-color:var(--ok);background:var(--ok-bg);border-radius:6px 6px 0 0;}
.q-sent input.no{border-bottom-color:var(--no);background:var(--no-bg);border-radius:6px 6px 0 0;}
.q-hint{font-size:11.5px;color:var(--muted);margin-bottom:6px;}
.mini-btn{border:none;background:var(--purple);color:#fff;border-radius:8px;padding:8px 16px;font-size:12.5px;font-weight:900;cursor:pointer;font-family:inherit;}
.mc-opt{border:1.5px solid var(--border);background:#fff;border-radius:9px;padding:9px 12px;font-size:13px;margin-bottom:6px;cursor:pointer;line-height:1.6;transition:.12s;}
.mc-opt:hover{border-color:var(--purple);}
.mc-opt.ok{border-color:var(--ok);background:var(--ok-bg);font-weight:700;}
.mc-opt.no{border-color:var(--no);background:var(--no-bg);}
.mc-opt.rv{border-color:var(--ok);background:var(--ok-bg);}
.mc-opt.dis{pointer-events:none;opacity:.85;}
.q-fb{display:none;font-size:12.5px;font-weight:700;margin-top:7px;line-height:1.6;}
.q-fb.show{display:block;}
.q-fb.ok{color:var(--ok);} .q-fb.no{color:var(--no);}
.check-bar{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0;}
.cb-btn{flex:1;min-width:110px;border:none;border-radius:10px;padding:11px 8px;font-size:13px;font-weight:900;cursor:pointer;font-family:inherit;}
.cb-btn.main{background:var(--purple);color:#fff;}
.cb-btn.warn{background:var(--amber);color:#fff;}
.cb-btn.ghost{background:var(--card2);color:var(--muted);}
.score-line{font-size:14px;font-weight:900;color:var(--purple-dk);text-align:center;margin:8px 0;display:none;}
.score-line.show{display:block;}
.ord-chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px;}
.ord-chip{border:1.5px solid var(--purple);color:var(--purple);background:#fff;border-radius:8px;padding:7px 11px;font-size:12.5px;font-family:'Lora',serif;cursor:pointer;}
.ord-chip.used{opacity:.3;pointer-events:none;}
.ord-slots{min-height:44px;border:2px dashed var(--border);border-radius:10px;padding:8px;display:flex;flex-wrap:wrap;gap:5px;margin-bottom:8px;align-items:center;}
.ord-slots>span{font-size:12px;color:var(--muted);margin:auto;}
.ord-slot{background:var(--purple-lt);border:1.5px solid var(--border);border-radius:8px;padding:7px 11px;font-size:12.5px;font-family:'Lora',serif;cursor:pointer;}
.ord-btns{display:flex;gap:6px;}
.ord-btns button{border:none;border-radius:8px;padding:8px 14px;font-size:12.5px;font-weight:900;cursor:pointer;font-family:inherit;}
.ord-btns .ob-c{background:var(--purple);color:#fff;}
.ord-btns .ob-r{background:var(--card2);color:var(--muted);}
.ans-r{display:none;background:var(--ok-bg);border:1.5px solid #b2d8c2;border-radius:8px;padding:8px 12px;font-size:12.5px;margin-top:7px;line-height:1.7;font-family:'Lora',serif;}
.ans-r.open{display:block;}
.foot{text-align:center;font-size:11px;color:var(--muted);margin-top:20px;}
/* ---- focus mode ---- */
.prog-wrap{display:flex;align-items:center;gap:10px;margin:4px 0 14px;}
.prog-txt{font-size:.85rem;font-weight:700;color:var(--primary);white-space:nowrap;}
.prog{flex:1;height:10px;background:var(--card3);border-radius:99px;overflow:hidden;}
.prog-fill{height:100%;width:0%;background:linear-gradient(90deg,var(--primary),#8f84d8);border-radius:99px;transition:width .3s;}
.sq{display:inline-flex;gap:6px;vertical-align:middle;margin:0 2px;}
.sq-c{display:inline-block;padding:3px 12px;border-radius:99px;border:2px solid var(--primary);background:#fff;color:var(--primary);font-weight:800;cursor:pointer;font-size:.92em;user-select:none;}
.sq-c:active{transform:scale(.95);}
.sq-c.no{border-color:#d05a5a;color:#d05a5a;background:#fdecec;}
.sq-done{display:inline-block;padding:3px 12px;border-radius:99px;background:#e5f6e9;border:2px solid #4a9e5c;color:#2e7d3f;font-weight:800;font-size:.92em;}
.shake{animation:shake .3s;}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@keyframes pop{from{transform:scale(.94);opacity:0}to{transform:scale(1);opacity:1}}
.gate-msg{background:#fff7e0;border:1.5px solid #e6c34a;border-radius:10px;padding:10px 12px;margin-top:12px;font-size:.85rem;display:none;}
.gate-msg.show{display:block;animation:pop .25s;}
.solo{background:#fff;border:2px solid var(--line);border-radius:16px;padding:20px 18px;box-shadow:0 3px 14px rgba(91,79,168,.08);}
.hint-box{display:none;background:#fff7e0;border:1.5px solid #e6c34a;border-radius:10px;padding:10px 12px;margin-top:10px;font-size:.88rem;}
.hint-box.show{display:block;animation:pop .25s;}
.ansrv{display:none;background:#fdecec;border:1.5px solid #e08787;border-radius:10px;padding:10px 12px;margin-top:10px;font-size:.92rem;}
.ansrv.show{display:block;}
.next-btn{display:none;margin-top:14px;width:100%;padding:13px;border:none;border-radius:12px;background:var(--primary);color:#fff;font-weight:800;font-size:1rem;cursor:pointer;font-family:inherit;}
.next-btn.show{display:block;animation:pop .25s;}
.done-card{text-align:center;background:#fff;border:2px solid var(--primary);border-radius:18px;padding:34px 20px;}
.done-card .big{font-size:2.4rem;}
.done-code{display:inline-block;margin-top:14px;background:var(--primary);color:#fff;font-family:'Lora',serif;font-size:1.5rem;font-weight:700;letter-spacing:2px;padding:10px 26px;border-radius:12px;}
.done-sub{margin-top:10px;font-size:.85rem;color:var(--ink2);}
.mini-note{font-size:.78rem;color:var(--ink2);margin-top:8px;}
.mc-opt.dim1{opacity:.4;pointer-events:none;text-decoration:line-through;}
.pg-done{position:absolute;top:-6px;right:-4px;font-size:.7rem;}
.pg-dot{position:relative;}
</style>
</head>
<body>
<div class="wrap">
<header>
  <div class="brand">JUNTI ENGLISH · 준티 잉글리쉬 · 문법 뼈대 노트</div>
  <h1>중2 Lesson 05 문법 — 지각동사 · 주격 관계대명사</h1>
  <div class="sub">🎯 집중 훈련 모드 — 골라야 열리고, 다 맞혀야 넘어가요 · 완료 코드 발급</div>
</header>
<div class="pager">
  <button class="pg-btn" id="pgPrev" onclick="goPage(cur-1)">◀ 이전</button>
  <div class="pg-dots" id="pgDots"></div>
  <button class="pg-btn" id="pgNext" onclick="tryNext()">다음 ▶</button>
</div>
<div class="gate-msg" id="gate">🔒 이 페이지의 <b>고르기</b>와 <b>문제</b>를 모두 맞혀야 다음 페이지가 열려요!</div>
<div id="app"></div>
<div class="foot">ⓒ 준티 잉글리쉬 · 중2 Lesson 05 문법 · 집중 훈련 모드</div>
</div>
<script>
/* ===================== DATA ===================== */
const PAGE_TITLES=["개요","지각동사 공식","지각동사 심화","관계대명사 공식","관계대명사 심화","판단 흐름도","확인 문제"];
const G1_CHECK=[
 {q:"Tom saw Mom [to read / reading] a book.",opts:["to read","reading"],ans:1,exp:"지각동사 saw + 목적어 + 동사원형/현재분사. to부정사는 절대 불가!"},
 {q:"Tom heard Carol [plays / playing] the piano.",opts:["plays","playing"],ans:1,exp:"heard + 목적어 뒤에는 동사원형(play) 또는 현재분사(playing). plays(3인칭 단수형)는 불가!"},
 {q:"Tom saw his cats [to sleep / sleep] on the sofa.",opts:["to sleep","sleep"],ans:1,exp:"지각동사 뒤 목적격 보어는 동사원형 OK, to부정사 X!"}
];
const G2_CHECK=[
 {q:"A poet is a person ________ writes poems.",opts:["who","which"],ans:0,exp:"선행사 a person(사람) → who[that]"},
 {q:"A snail is a small animal ________ moves very slowly.",opts:["who","which"],ans:1,exp:"선행사 a small animal(동물) → which[that]"},
 {q:"A library is a place ________ has many books.",opts:["who","which"],ans:1,exp:"선행사 a place(사물·장소) → which[that]"}
];
const FILL_QS=[
 {sent:"I saw Tom [coming] out of the kitchen.",blanks:["coming|come"],hint:"지각동사 + 목적어 + 동사원형/-ing (come 활용)"},
 {sent:"She heard someone [call] her name.",blanks:["call|calling"],hint:"지각동사 heard 뒤 목적격 보어 (call 활용)"},
 {sent:"I felt something [fall] on my head.",blanks:["fall|falling"],hint:"지각동사 felt 뒤 목적격 보어 (fall 활용)"},
 {sent:"I watched the children [playing] in the garden.",blanks:["playing|play"],hint:"지각동사 watched 뒤 목적격 보어 (play 활용)"},
 {sent:"The teacher made us [clean] the room.",blanks:["clean"],hint:"사역동사 made + 목적어 + 동사원형 (clean 활용)"},
 {sent:"Mom let me [go] out with my friends.",blanks:["go"],hint:"사역동사 let + 목적어 + 동사원형 (go 활용)"},
 {sent:"Ms. Jones was a wise old lady [who] lived next door.",blanks:["who|that"],hint:"선행사가 사람 → 주격 관계대명사"},
 {sent:"He solved the problems [which] happened in this town.",blanks:["which|that"],hint:"선행사가 사물 → 주격 관계대명사"},
 {sent:"Look at the boy and the dog [that] are running.",blanks:["that"],hint:"선행사가 사람+동물 → 반드시 이것만!"},
 {sent:"The boy who [plays] soccer is my brother.",blanks:["plays"],hint:"단수 선행사 → 동사 수일치 (play 활용)"},
 {sent:"They are my friends who always [help] me.",blanks:["help"],hint:"복수 선행사 → 동사 수일치 (help 활용)"},
 {sent:"A poet is a person [who] writes poems.",blanks:["who|that"],hint:"선행사가 사람 → 주격 관계대명사"}
];
const MC_QS=[
 {q:"'I saw him ________ away.'의 빈칸에 올 수 <b>없는</b> 것은?",opts:["run","running","to run","run과 running 둘 다 가능"],ans:2,exp:"지각동사 뒤 목적격 보어: 동사원형·현재분사(O), to부정사(X)!"},
 {q:"'I heard him singing.'의 의미로 알맞은 것은?",opts:["노래하는 전 과정을 처음부터 끝까지 들었다","노래하고 있는 중에 일부를 들었다","노래를 부르라고 시켰다","노래를 못 부르게 했다"],ans:1,exp:"현재분사(-ing)는 진행 중인 동작의 일부를 지각. 전 과정은 동사원형(sing)!"},
 {q:"She is running with a dog ________ has a long tail.",opts:["who","whom","which","whose"],ans:2,exp:"선행사 a dog(동물) → which[that]. who는 사람에게만!"},
 {q:"선행사가 '사람 + 동물'일 때 쓸 수 있는 관계대명사는?",opts:["who","which","that","whom"],ans:2,exp:"사람+사물[동물] 선행사 → that만 가능!"},
 {q:"The student ________ studies hard will succeed.",opts:["who","whom","which","what"],ans:0,exp:"선행사 the student(사람)+주어 역할 → 주격 who. whom은 목적격!"},
 {q:"다음 중 <b>어법상 틀린</b> 문장은?",opts:["I saw her cross the street.","I saw her crossing the street.","We noticed the door open slowly.","I saw her to cross the street."],ans:3,exp:"지각동사 + 목적어 + to부정사(X)!"},
 {q:"The man ________ found the cat was a detective.",opts:["who","which","whose","whom"],ans:0,exp:"선행사 the man(사람), 주어 역할 → who[that]"},
 {q:"The teacher let us ________ early.",opts:["leave","to leave","leaving","left"],ans:0,exp:"사역동사 let + 목적어 + 동사원형!"},
 {q:"They are the students ________ live in this town.",opts:["who live","who lives","which live","who living"],ans:0,exp:"선행사 the students(사람·복수) → who + 복수 동사 live"},
 {q:"주격 관계대명사에 대한 설명으로 알맞은 것은?",opts:["관계대명사절에서 주어 역할을 하며 생략할 수 없다","항상 생략할 수 있다","목적어 역할을 한다","전치사 뒤에만 쓴다"],ans:0,exp:"주격 관계대명사는 절 안에서 주어 역할 → 생략 불가! (목적격은 생략 가능)"}
];
const ORDER_QS=[

let audioCtx=null;
document.addEventListener('click',function(){if(!audioCtx){try{audioCtx=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}},{once:true});
function playPageTurn(){
  try{
    if(!audioCtx)return;
    const dur=0.12,buf=audioCtx.createBuffer(1,audioCtx.sampleRate*dur,audioCtx.sampleRate);
    const d=buf.getChannelData(0);
    for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*(1-i/d.length);
    const src=audioCtx.createBufferSource();src.buffer=buf;
    const bp=audioCtx.createBiquadFilter();bp.type='bandpass';bp.frequency.value=1600;
    const g=audioCtx.createGain();g.gain.value=0.18;
    src.connect(bp);bp.connect(g);g.connect(audioCtx.destination);src.start();
  }catch(e){}
}
function norm(s){
  return (s||'').toLowerCase()
    .replace(/[^a-z0-9\-\s]/gi,'')
    .replace(/\s+/g,' ')
    .trim();
}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
/* ---- 고르기(slot-quiz): 정답을 탭해야 열림 ---- */
function sq(ans,wrong){
  const id='sq'+(sqSeq++);
  SQ[id]={ans,wrong,done:false};
  const first=Math.random()<0.5;
  const chips=first?[ans,wrong]:[wrong,ans];
  return '<span class="sq" id="'+id+'">'
    +chips.map(c=>'<span class="sq-c" onclick="sqPick(\''+id+'\',this,'+(c===ans)+')">'+esc(c)+'</span>').join('')
    +'</span>';
}
function sqPick(id,el,ok){
  const s=SQ[id];if(!s||s.done)return;
  if(ok){
    s.done=true;
    document.getElementById(id).outerHTML='<span class="sq-done">✔ '+esc(s.ans)+'</span>';
    updateGate();
  }else{
    el.classList.add('no','shake');setTimeout(()=>el.classList.remove('shake'),350);
  }
}
function pageSqIds(){return Object.keys(SQ).filter(id=>document.getElementById(id)||document.querySelector('#'+id));}
function pageCleared(){
  // 현재 DOM에 남아 있는(미완료) sq가 없고, 현재 페이지 체크업이 전부 done이면 통과
  const sqLeft=[...document.querySelectorAll('.sq')].length;
  const ckLeft=[...document.querySelectorAll('[data-ck]')].filter(el=>!CK[el.getAttribute('data-ck')]||!CK[el.getAttribute('data-ck')].done).length;
  return sqLeft===0&&ckLeft===0;
}
function updateGate(){
  if(pageCleared()){
    PAGE_DONE[cur]=true;
    document.getElementById('gate').classList.remove('show');
    drawDots();
  }
}
function tryNext(){
  if(cur>=6)return;
  if(!PAGE_DONE[cur]){
    const g=document.getElementById('gate');
    g.classList.add('show','shake');setTimeout(()=>g.classList.remove('shake'),350);
    return;
  }
  goPage(cur+1);
}
function drawDots(){
  const dots=document.getElementById('pgDots');
  dots.innerHTML=PAGE_TITLES.map((t,i)=>'<div class="pg-dot'+(i===cur?' on':'')+'" title="'+esc(t)+'" onclick="'+(i<=cur||PAGE_DONE[i-1]?'goPage('+i+')':'')+'">'+(i+1)+(PAGE_DONE[i]?'<span class="pg-done">✅</span>':'')+'</div>').join('');
}
function goPage(v){
  if(v<0||v>6)return;
  if(v>cur&&!PAGE_DONE[cur]&&v!==cur){tryNext();return;}
  cur=v;
  playPageTurn();
  window.scrollTo(0,0);
  document.getElementById('pgPrev').disabled=(v===0);
  document.getElementById('pgNext').disabled=(v===6);
  document.getElementById('gate').classList.remove('show');
  drawDots();
  const app=document.getElementById('app');app.innerHTML='';
  setTimeout(()=>{
    [buildP1,buildP2,buildP3,buildP4,buildP5,buildP6,buildP7][v]();
    updateGate();
  },80);
}

/* ---------- MC 렌더 공통 (체크업/확인문제) ---------- */
function mcHtml(qid,q,hint){
  CK[qid]={wrong:0,forced:false,done:false,ans:q.ans,exp:q.exp,hint:hint||''};
  let h='<div class="q-card" data-ck="'+qid+'"><div class="q-t" style="font-family:Lora,serif;">'+q.q+'</div>';
  q.opts.forEach((o,oi)=>{h+='<div class="mc-opt" id="mo_'+qid+'_'+oi+'" onclick="ansCK(\''+qid+'\','+oi+','+q.opts.length+')">'+String.fromCharCode(9312+oi)+' '+esc(o)+'</div>';});
  h+='<div class="hint-box" id="hb_'+qid+'"></div><div class="ansrv" id="ar_'+qid+'"></div></div>';
  return h;
}
function ansCK(qid,sel,len){
  const s=CK[qid];if(!s||s.done)return;
  const el=document.getElementById('mo_'+qid+'_'+sel);
  if(sel===s.ans){
    s.done=true;el.classList.add('ok');
    for(let i=0;i<len;i++)document.getElementById('mo_'+qid+'_'+i).classList.add('dis');
    const hb=document.getElementById('hb_'+qid);hb.classList.add('show');hb.innerHTML='✅ 정답! '+esc(s.exp);
    updateGate();
    if(typeof onCkPass==='function')onCkPass(qid);
    return;
  }
  el.classList.add('no','shake');setTimeout(()=>el.classList.remove('shake'),350);
  if(s.forced)return;
  s.wrong++;
  if(s.wrong===1){
    el.classList.add('dim1');
    const hb=document.getElementById('hb_'+qid);hb.classList.add('show');hb.innerHTML='💡 '+esc(s.hint||'다시 생각해봐!');
  }else{
    s.forced=true;
    document.getElementById('mo_'+qid+'_'+s.ans).classList.add('rv');
    const ar=document.getElementById('ar_'+qid);ar.classList.add('show');
    ar.innerHTML='정답 보기에 표시했어. <b>직접 클릭</b>해야 통과!';
  }
}

function nextQ(){qIdx++;playPageTurn();window.scrollTo(0,0);renderQ();}
function qHint(m){const hb=document.getElementById('qhb');hb.classList.add('show');hb.innerHTML='💡 '+m;}
function qRev(m){const ar=document.getElementById('qar');ar.classList.add('show');ar.innerHTML=m;}
function matchAns(input,ansStr){return ansStr.split('|').some(a=>norm(a)===norm(input));}
function ansQF(){
  const q=curQ().q;let allOk=true;
  q.blanks.forEach((b,pi)=>{
    const inp=document.getElementById('qf_'+pi);
    const ok=matchAns(inp.value,b);
    inp.classList.remove('ok','no');inp.classList.add(ok?'ok':'no');
    if(!ok){allOk=false;inp.classList.add('shake');setTimeout(()=>inp.classList.remove('shake'),350);}
  });
  if(allOk){qHint('✅ 정답!');document.getElementById('nx').classList.add('show');return;}
  if(qForced)return;
  qWrong++;
  if(qWrong===1){
    const firsts=q.blanks.map(b=>b.split('|')[0].trim()[0]).join(', ');
    qHint('첫 글자 힌트: <b>'+esc(firsts)+'</b> — 위 💡 규칙을 소리 내어 읽고 다시!');
  }else{
    qForced=true;
    qRev('정답: <b>'+q.blanks.map(b=>esc(b.split('|').join(' / '))).join(', ')+'</b> — 그대로 입력하면 다음으로!');
    q.blanks.forEach((b,pi)=>{const inp=document.getElementById('qf_'+pi);inp.value='';inp.classList.remove('ok','no');});
    document.getElementById('qf_0').focus();
  }
}
function pickQ(ci){
  const chip=document.getElementById('qc'+ci);
  if(!chip||chip.classList.contains('used'))return;
  chip.classList.add('used');ordSeq.push(ci);
  const slots=document.getElementById('qs');
  const hint=slots.querySelector('span');if(hint)hint.remove();
  const s=document.createElement('div');s.className='ord-slot';s.textContent=chip.textContent;
  s.onclick=function(){ordSeq.splice(ordSeq.indexOf(ci),1);s.remove();chip.classList.remove('used');
    if(slots.children.length===0)slots.innerHTML='<span>여기에 순서대로 클릭하세요</span>';};
  slots.appendChild(s);
}
function rsQO(){
  const q=curQ().q;ordSeq=[];
  q.words.forEach((w2,ci)=>{const el=document.getElementById('qc'+ci);if(el)el.classList.remove('used');});
  document.getElementById('qs').innerHTML='<span>여기에 순서대로 클릭하세요</span>';
}
function ansQO(){
  const q=curQ().q;
  const built=ordSeq.map(ci=>q.words[ci]).join(' ');
  if(ordSeq.length===q.words.length&&norm(built)===norm(q.ans)){
    qHint('✅ 정답!');document.getElementById('nx').classList.add('show');return;
  }
  const os=document.getElementById('qs');os.classList.add('shake');setTimeout(()=>os.classList.remove('shake'),350);
  if(qForced)return;
  qWrong++;
  if(qWrong===1)qHint('첫 칩: <b>'+esc(q.ans.split(' ')[0])+'</b> ~로 시작해. 다시 배열!');
  else{qForced=true;qRev('정답 순서: <b>'+esc(q.ans)+'</b> — 그대로 배열하면 다음으로!');rsQO();}
}
goPage(0);
</script>
