<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>Lesson 4 · Opening a Window to the World</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=Lora:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f7f6f2;--card:#ffffff;--card2:#f0eee7;
  --primary:#1a5c38;--primary-lt:#e8f4ed;--primary-dk:#0f3d25;
  --accent:#e8a020;--accent-lt:#fef3dc;
  --text:#1a1a1a;--muted:#6b6b6b;--border:#e0ddd5;
  --ok:#1a7a3c;--ok-bg:#e8f5ec;--no:#c0392b;--no-bg:#fdecea;
  --info:#1a5c9e;--info-bg:#e8f0fb;
  --r:12px;--r-sm:8px;
  --shadow:0 2px 10px rgba(0,0,0,.08);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{background:var(--bg);font-family:'Noto Sans KR',sans-serif;color:var(--text);min-height:100vh;padding-bottom:70px;-webkit-font-smoothing:antialiased;}
.header{background:linear-gradient(135deg,var(--primary-dk),var(--primary));color:#fff;padding:18px 20px 0;position:sticky;top:0;z-index:30;box-shadow:0 2px 12px rgba(0,0,0,.2);}
.header-top{display:flex;align-items:center;gap:12px;margin-bottom:4px;}
.header h1{font-size:17px;font-weight:900;flex:1;}
.timer-badge{background:rgba(255,255,255,.18);border-radius:20px;padding:4px 12px;font-size:12px;font-weight:700;display:flex;align-items:center;gap:5px;white-space:nowrap;}
.tabs{display:flex;gap:5px;margin-top:12px;overflow-x:auto;padding-bottom:0;}
.tab{flex:1;min-width:58px;background:rgba(255,255,255,.12);border:none;color:rgba(255,255,255,.75);font-family:inherit;font-size:11px;font-weight:700;padding:10px 4px 12px;cursor:pointer;transition:.2s;text-align:center;white-space:nowrap;border-radius:10px 10px 0 0;position:relative;}
.tab.on{background:#fff;color:var(--primary);padding-bottom:14px;}
.tab .sn{display:block;font-size:9px;opacity:.7;margin-bottom:2px;}
.tab .done-dot{position:absolute;top:6px;right:6px;width:7px;height:7px;background:var(--accent);border-radius:50%;display:none;}
.tab.completed .done-dot{display:block;}
.wrap{max-width:740px;margin:0 auto;padding:16px;}
.page-enter{animation:pageIn .3s ease;}
@keyframes pageIn{from{opacity:0;transform:translateX(14px)}to{opacity:1;transform:none}}
.desc{background:var(--primary-lt);border-left:3px solid var(--primary);border-radius:0 var(--r-sm) var(--r-sm) 0;padding:11px 14px;font-size:13px;color:var(--primary);line-height:1.6;margin-bottom:14px;}
.desc b{color:var(--text);}
.prog-wrap{margin-bottom:14px;}
.prog-label{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-bottom:5px;font-weight:700;}
.prog-track{height:7px;background:var(--card2);border-radius:5px;overflow:hidden;}
.prog-fill{height:100%;background:linear-gradient(90deg,var(--primary),#2d9e5f);border-radius:5px;transition:width .4s ease;}
.glabel{font-size:11px;font-weight:900;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;margin:20px 0 10px;padding-bottom:6px;border-bottom:1px solid var(--border);}
.snd{display:inline-flex;align-items:center;background:none;border:1px solid var(--border);border-radius:99px;padding:3px 9px;font-size:11px;color:var(--muted);cursor:pointer;font-family:inherit;transition:.12s;gap:3px;white-space:nowrap;}
.snd:hover,.snd.playing{background:var(--primary-lt);border-color:var(--primary);color:var(--primary);}

/* 단어 매치 */
.match-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.mcol{display:flex;flex-direction:column;gap:7px;}
.chip{background:var(--card);border:1.5px solid var(--border);border-radius:10px;padding:11px 8px;font-size:13px;font-weight:700;text-align:center;cursor:pointer;transition:.15s;box-shadow:0 1px 4px rgba(0,0,0,.05);}
.chip:hover{border-color:var(--accent);background:var(--accent-lt);}
.chip.sel{border-color:var(--accent);background:var(--accent-lt);}
.chip.done{border-color:var(--ok);background:var(--ok-bg);color:var(--ok);opacity:.6;pointer-events:none;}
.chip.kr{font-weight:500;font-size:12px;}
.mmsg{text-align:center;font-size:13px;color:var(--muted);margin:12px 0;min-height:20px;font-weight:700;}

/* 영영풀이 퀴즈 */
.def-quiz-card{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:16px;margin-bottom:10px;box-shadow:var(--shadow);}
.def-quiz-card .dq-num{font-size:11px;color:var(--muted);font-weight:700;margin-bottom:8px;}
.def-quiz-card .dq-def{font-family:'Lora',serif;font-style:italic;font-size:14px;line-height:1.7;color:var(--text);margin-bottom:12px;background:var(--card2);padding:10px 13px;border-radius:8px;}
.dq-opts{display:grid;grid-template-columns:1fr 1fr;gap:7px;}
.dq-opt{padding:9px 10px;border:1.5px solid var(--border);border-radius:9px;background:var(--card2);font-size:13px;font-weight:700;cursor:pointer;text-align:center;transition:.13s;font-family:'Lora',serif;}
.dq-opt:hover{border-color:var(--accent);}
.dq-opt.dq-ok{border-color:var(--ok);background:var(--ok-bg);color:var(--ok);}
.dq-opt.dq-no{border-color:var(--no);background:var(--no-bg);color:var(--no);}
.dq-opt.dq-dim{opacity:.32;pointer-events:none;}
.dq-fb{font-size:12px;margin-top:8px;padding:6px 10px;border-radius:7px;display:none;}
.dq-fb.show{display:block;}
.dq-fb.ok{background:var(--ok-bg);color:var(--ok);}
.dq-fb.no{background:var(--no-bg);color:var(--no);}

/* 단어 카드 */
.vcard{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:14px;margin-bottom:9px;box-shadow:var(--shadow);}
.vhead{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:8px;}
.ven{font-family:'Lora',serif;font-size:18px;font-weight:700;}
.vkr{font-size:14px;color:var(--primary);font-weight:700;}
.vrow{font-size:12.5px;margin-top:6px;line-height:1.6;display:flex;gap:6px;align-items:baseline;}
.vlab{font-weight:700;font-size:11px;padding:1px 7px;border-radius:5px;flex-shrink:0;}
.vlab.syn{background:var(--ok-bg);color:var(--ok);}
.vlab.ant{background:var(--no-bg);color:var(--no);}
.vdef{font-size:12px;color:var(--muted);margin-top:7px;font-style:italic;line-height:1.5;background:var(--card2);padding:7px 10px;border-radius:7px;font-family:'Lora',serif;}

/* 프레이즈 */
.qcard{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:16px;margin-bottom:11px;box-shadow:var(--shadow);}
.qnum{font-size:11px;color:var(--muted);margin-bottom:7px;font-weight:700;}
.qkr{font-size:13px;color:var(--muted);background:var(--card2);padding:8px 11px;border-radius:8px;margin-bottom:10px;line-height:1.5;}
.qsent{font-size:15px;line-height:2;font-family:'Lora',serif;}
.blank-tap{display:inline-block;background:var(--accent-lt);border-bottom:2px solid var(--accent);min-width:54px;padding:0 6px;border-radius:5px 5px 0 0;color:transparent;cursor:pointer;transition:.2s;font-weight:700;}
.blank-tap.show{color:var(--accent);}
.phrase-inp{width:100%;padding:9px 12px;border:1.5px solid var(--border);border-radius:8px;background:var(--card2);color:var(--text);font-size:14px;font-family:'Lora',serif;margin:8px 0 4px;outline:none;}
.phrase-inp:focus{border-color:var(--primary);background:#fff;}
.phrase-inp.ok{border-color:var(--ok);background:var(--ok-bg);}
.phrase-inp.no{border-color:var(--no);background:var(--no-bg);}
.phrase-fb{font-size:12px;min-height:16px;margin-bottom:4px;}
.phrase-fb.ok{color:var(--ok);}.phrase-fb.no{color:var(--no);}

/* 본문 */
.sent-card{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:15px;margin-bottom:10px;box-shadow:var(--shadow);}
.sent-num{font-size:11px;font-weight:900;color:var(--primary);margin-bottom:6px;}
.sent-en{font-family:'Lora',serif;font-size:15px;line-height:1.8;flex:1;}
.sent-kr-btn{font-size:12px;color:var(--muted);border:1px solid var(--border);background:var(--card2);border-radius:20px;padding:4px 12px;cursor:pointer;font-family:inherit;margin-top:8px;}
.sent-kr-btn:hover{border-color:var(--primary);color:var(--primary);}
.sent-kr{display:none;font-size:13px;color:var(--info);background:var(--info-bg);padding:8px 11px;border-radius:8px;margin-top:7px;line-height:1.55;}
.sent-kr.show{display:block;}

/* OX */
.ox-row{display:flex;gap:9px;margin-top:10px;}
.ox{flex:1;padding:11px;border:1.5px solid var(--border);border-radius:10px;background:var(--card);font-size:15px;font-weight:700;cursor:pointer;text-align:center;transition:.15s;}
.ox:hover{border-color:var(--primary);}
.ox.pickO{border-color:var(--ok);background:var(--ok-bg);color:var(--ok);}
.ox.pickX{border-color:var(--no);background:var(--no-bg);color:var(--no);}
.ox-fb{font-size:12.5px;margin-top:8px;padding:6px 10px;border-radius:7px;}
.ox-fb.ok{background:var(--ok-bg);color:var(--ok);}
.ox-fb.no{background:var(--no-bg);color:var(--no);}

/* 단락 매칭 (5단계) */
.para-match-wrap{margin:10px 0;}
.para-match-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px;}
.pm-card{background:var(--card);border:2px solid var(--border);border-radius:var(--r);padding:12px;cursor:pointer;transition:.15s;box-shadow:0 1px 5px rgba(0,0,0,.07);min-height:100px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;}
.pm-card:hover{border-color:var(--accent);transform:translateY(-2px);}
.pm-card.sel{border-color:var(--accent);background:var(--accent-lt);box-shadow:0 0 0 3px rgba(232,160,32,.2);}
.pm-card.matched{border-color:var(--ok);background:var(--ok-bg);pointer-events:none;}
.pm-card.wrong-flash{border-color:var(--no);background:var(--no-bg);}
.pm-card svg{width:56px;height:56px;margin-bottom:6px;}
.pm-card .pc-label{font-size:12px;font-weight:700;color:var(--text);}
.pm-content-card{background:var(--card);border:2px solid var(--border);border-radius:var(--r);padding:13px;cursor:pointer;transition:.15s;box-shadow:0 1px 5px rgba(0,0,0,.07);min-height:100px;}
.pm-content-card:hover{border-color:var(--accent);}
.pm-content-card.sel{border-color:var(--accent);background:var(--accent-lt);}
.pm-content-card.matched{border-color:var(--ok);background:var(--ok-bg);pointer-events:none;}
.pm-content-card.wrong-flash{border-color:var(--no);background:var(--no-bg);}
.pm-content-card .cc-title{font-size:11px;font-weight:900;color:var(--primary);margin-bottom:6px;}
.pm-content-card .cc-body{font-size:12px;line-height:1.65;color:var(--text);}
.pm-section-label{font-size:11px;font-weight:700;color:var(--muted);margin-bottom:8px;text-align:center;}
.pm-result{text-align:center;font-size:13px;font-weight:700;padding:10px;border-radius:9px;margin-top:8px;display:none;}
.pm-result.show{display:block;}
.pm-result.ok{background:var(--ok-bg);color:var(--ok);}

/* 종합시험 — 빈칸 */
.exam-passage{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:18px 20px;box-shadow:var(--shadow);}
.ep-section{margin-bottom:18px;padding-bottom:18px;border-bottom:1px solid var(--border);}
.ep-section:last-child{border-bottom:none;margin-bottom:0;}
.ep-section-title{font-size:11px;font-weight:900;color:var(--primary);letter-spacing:.05em;margin-bottom:10px;padding:3px 10px;background:var(--primary-lt);border-radius:6px;display:inline-block;}
.ep-sent{font-family:'Lora',serif;font-size:14px;line-height:2.1;color:var(--text);margin-bottom:6px;}
.ep-inp{border:none;border-bottom:2px solid var(--accent);padding:0 5px;font-size:13px;font-family:'Lora',serif;background:transparent;color:var(--text);outline:none;vertical-align:bottom;min-width:90px;}
.ep-inp:focus{border-bottom-color:var(--primary);}
.ep-inp.ok{border-bottom-color:var(--ok);color:var(--ok);}
.ep-inp.no{border-bottom-color:var(--no);color:var(--no);}
.exam-ctrl{display:flex;gap:9px;flex-wrap:wrap;margin-top:14px;}
.b{padding:9px 20px;border:none;border-radius:20px;font-family:inherit;font-size:13px;font-weight:700;cursor:pointer;transition:.15s;}
.b:active{transform:scale(.97);}
.b1{background:var(--primary);color:#fff;}
.b2{background:var(--card2);color:var(--muted);border:1px solid var(--border);}
.b3{background:var(--accent);color:#fff;}
.b:disabled{opacity:.3;cursor:default;}
.exam-result-bar{margin-top:14px;padding:14px 16px;border-radius:var(--r);text-align:center;}
.exam-result-bar.ok{background:var(--ok-bg);color:var(--ok);}
.exam-result-bar.bad{background:var(--accent-lt);color:var(--accent);}
.exam-result-bar .er-score{font-size:28px;font-weight:900;}
.exam-result-bar .er-msg{font-size:13px;margin-top:4px;}

/* 완료 배너 */
.complete-banner{background:linear-gradient(135deg,var(--primary),#2d9e5f);color:#fff;border-radius:var(--r);padding:16px 20px;text-align:center;margin-bottom:14px;}
.cb-icon{font-size:28px;margin-bottom:5px;}
.cb-title{font-size:16px;font-weight:900;}
.cb-sub{font-size:12px;opacity:.85;margin-top:3px;}

.tag-line{font-size:11px;color:var(--muted);text-align:center;margin-top:20px;}

/* 본문 영작 */
.eng-item{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:15px;margin-bottom:10px;box-shadow:var(--shadow);}
.eng-num{font-size:11px;font-weight:900;color:var(--primary);margin-bottom:5px;}
.eng-kr{font-size:15px;font-weight:700;line-height:1.7;color:var(--text);margin-bottom:8px;}
.hint-row{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:8px;display:none;}
.hint-chip{font-size:11px;font-weight:700;padding:3px 10px;border-radius:99px;background:var(--primary-lt);color:var(--primary);border:1px solid var(--border);}
.eng-ta{width:100%;min-height:44px;padding:8px 12px;border:1.5px solid var(--border);border-radius:9px;font-size:13px;font-family:'Lora',serif;line-height:1.65;resize:none;color:var(--text);background:var(--card2);outline:none;}
.eng-ta:focus{border-color:var(--primary);background:#fff;}
.eng-fb{font-size:12px;margin-top:5px;padding:6px 10px;border-radius:7px;display:none;}
.eng-fb.ok{background:var(--ok-bg);color:var(--ok);}
.eng-fb.no{background:var(--no-bg);color:var(--no);}

/* OX 영어 문장 + 해석 */
.ox-en{font-family:'Lora',serif;font-size:14px;line-height:1.7;margin-bottom:4px;}
.ox-kr-btn{font-size:11px;color:var(--muted);border:1px solid var(--border);background:var(--card2);border-radius:20px;padding:3px 10px;cursor:pointer;font-family:inherit;margin-bottom:8px;}
.ox-kr-btn:hover{border-color:var(--primary);color:var(--primary);}
.ox-kr{display:none;font-size:12px;color:var(--info);background:var(--info-bg);padding:6px 10px;border-radius:7px;margin-bottom:8px;line-height:1.5;}
.ox-kr.show{display:block;}
@media(max-width:520px){.wrap{padding:12px;}.dq-opts{grid-template-columns:1fr;}.para-match-grid{grid-template-columns:1fr;}}
</style>
</head>

<div class="header">
  <div class="header-top">
    <h1>🌍 Opening a Window to the World</h1>
    <div class="timer-badge">⏱ <span id="timerDisplay">00:00</span></div>
  </div>
  <div style="font-size:11px;opacity:.75;margin-bottom:8px;">천재(이재영) · Lesson 4 · 준티 잉글리쉬</div>
  <div class="tabs">
    <button class="tab on"  id="t0" onclick="go(0)"><span class="sn">1단계</span>📝 단어<div class="done-dot"></div></button>
    <button class="tab"     id="t1" onclick="go(1)"><span class="sn">2단계</span>🔑 프레이즈<div class="done-dot"></div></button>
    <button class="tab"     id="t2" onclick="go(2)"><span class="sn">3단계</span>📖 본문<div class="done-dot"></div></button>
    <button class="tab"     id="t3" onclick="go(3)"><span class="sn">4단계</span>✅ OX퀴즈<div class="done-dot"></div></button>
    <button class="tab"     id="t4" onclick="go(4)"><span class="sn">5단계</span>🗂 단락매칭<div class="done-dot"></div></button>
    <button class="tab"     id="t5" onclick="go(5)"><span class="sn">시험</span>🏆 종합시험<div class="done-dot"></div></button>
  </div>
</div>
<div class="wrap" id="app"></div>
<div class="tag-line">준티 잉글리쉬 · 자체 제작 학습 콘텐츠</div>

<script>
/* ══ Web Audio: 책 넘기는 합성음 ══ */
const _ac=new(window.AudioContext||window.webkitAudioContext)();
function playPageTurn(){
  try{
    if(_ac.state==='suspended')_ac.resume();
    const now=_ac.currentTime;
    const make=(len,vol,delay,hpFreq)=>{
      const buf=_ac.createBuffer(1,Math.floor(_ac.sampleRate*len),_ac.sampleRate);
      const d=buf.getChannelData(0);
      for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*(1-i/d.length);
      const src=_ac.createBufferSource();src.buffer=buf;
      const hp=_ac.createBiquadFilter();hp.type='highpass';hp.frequency.value=hpFreq;
      const g=_ac.createGain();
      g.gain.setValueAtTime(0,now+delay);
      g.gain.linearRampToValueAtTime(vol,now+delay+0.02);
      g.gain.exponentialRampToValueAtTime(0.001,now+delay+len);
      src.connect(hp);hp.connect(g);g.connect(_ac.destination);
      src.start(now+delay);src.stop(now+delay+len);
    };
    make(0.16,0.32,0,1800);
    make(0.07,0.14,0.09,3200);
  }catch(e){}
}

/* ══ TTS 표준 블록 ══ */
let voice=null,ttsOk=false;
function loadVoices(){
  const vs=speechSynthesis.getVoices();
  const prefer=['Google US English','Google UK English Female','Samantha','Microsoft Aria','Microsoft Jenny','Microsoft Zira','Karen','Alex'];
  for(const n of prefer){const v=vs.find(x=>x.name===n);if(v){voice=v;return;}}
  voice=vs.find(v=>v.lang==='en-US')||vs.find(v=>v.lang&&v.lang.startsWith('en'))||null;
}
if('speechSynthesis' in window){loadVoices();speechSynthesis.onvoiceschanged=loadVoices;}
function unlockTTS(){if(ttsOk||!('speechSynthesis' in window))return;const u=new SpeechSynthesisUtterance('');u.volume=0;speechSynthesis.speak(u);ttsOk=true;}
document.addEventListener('touchstart',unlockTTS,{once:true});
document.addEventListener('click',unlockTTS,{once:true});
function speak(text,btn,slow){
  if(!('speechSynthesis' in window))return;
  unlockTTS();speechSynthesis.cancel();
  document.querySelectorAll('.snd.playing').forEach(b=>b.classList.remove('playing'));
  const u=new SpeechSynthesisUtterance(String(text).trim());
  if(voice)u.voice=voice;u.lang='en-US';u.rate=slow?.55:.92;u.pitch=1.0;
  if(btn){btn.classList.add('playing');u.onend=u.onerror=()=>btn.classList.remove('playing');}
  speechSynthesis.speak(u);
}
function mkSnd(text){
  const b=document.createElement('button');b.className='snd';b.innerHTML='🔊';b.title='듣기';
  b.onclick=()=>speak(text,b,false);return b;
}

/* ══ 타이머 ══ */
let timerSec=0,timerInterval=null;
function startTimer(){if(timerInterval)return;timerInterval=setInterval(()=>{timerSec++;const m=String(Math.floor(timerSec/60)).padStart(2,'0'),s=String(timerSec%60).padStart(2,'0');document.getElementById('timerDisplay').textContent=m+':'+s;},1000);}
document.addEventListener('click',startTimer,{once:true});

/* ══════════════════════════════════════
   데이터
══════════════════════════════════════ */
const VOCAB=[
  {en:"attract",kr:"끌어당기다",syn:"draw, appeal to",ant:"repel",def:"to cause someone or something to move toward a place"},
  {en:"attractive",kr:"매력적인",syn:"appealing, charming",ant:"unattractive",def:"pleasing or interesting; able to draw attention"},
  {en:"culture",kr:"문화",syn:"customs, civilization",ant:"—",def:"the way of life or customs of a particular people or group"},
  {en:"effective",kr:"효과적인",syn:"successful, useful",ant:"ineffective",def:"producing the result that was intended"},
  {en:"creative",kr:"창의적인",syn:"inventive, original",ant:"unimaginative",def:"having the ability to make new things or ideas"},

function makeDefQuiz(){
  return VOCAB.map((v,i)=>{
    const wrongs=VOCAB.filter((_,j)=>j!==i).sort(()=>Math.random()-.5).slice(0,3).map(x=>x.en);
    const opts=[v.en,...wrongs].sort(()=>Math.random()-.5);
    return {def:v.def,ans:v.en,kr:v.kr,opts};
  });
}

function viewWord(){
  if(!defQuiz){defQuiz=makeDefQuiz();defQuiz.forEach(()=>defState.push({answered:false,correct:false}));}
  const doneN=defState.filter(s=>s.answered).length;
  const okN=defState.filter(s=>s.correct).length;
  if(doneN===VOCAB.length)completed.add(0);

  let h=`<div class="desc"><b>1단계 · 단어 학습</b><br>영영풀이를 읽고 해당 단어를 고르세요. 그다음 전체 카드로 확인하세요.</div>
  <div class="prog-wrap">
    <div class="prog-label"><span>완료 ${doneN}/${VOCAB.length}</span><span>${okN} 정답</span></div>
    <div class="prog-track"><div class="prog-fill" id="wordProg" style="width:${Math.round(doneN/VOCAB.length*100)}%"></div></div>
  </div>
  <div class="glabel">🧠 영영풀이 퀴즈 (20문제)</div>`;

  defQuiz.forEach((q,i)=>{
    const st=defState[i];
    h+=`<div class="def-quiz-card" data-dq="${i}">
      <div class="dq-num">Q${i+1} / ${VOCAB.length}</div>
      <div class="dq-def">${q.def}</div>
      <div class="dq-opts">`;
    q.opts.forEach(opt=>{
      let cls='dq-opt';
      if(st.answered){
        if(opt===q.ans)cls+=' dq-ok';
        else cls+=' dq-dim';
      }
      h+=`<div class="${cls}" onclick="answerDef(${i},'${opt.replace(/'/g,"\\'")}',this)">${opt}</div>`;
    });
    h+=`</div>`;
    if(st.answered){
      h+=`<div class="dq-fb show ${st.correct?'ok':'no'}">${st.correct?'✅ 정답! — '+q.kr:'❌ 정답: '+q.ans+' ('+q.kr+')'}</div>`;
    }
    h+=`</div>`;
  });

  h+=`<div class="glabel">📖 전체 단어 카드 (20개)</div>`;
  VOCAB.forEach(voc=>{
    h+=`<div class="vcard">
      <div class="vhead">
        <span class="ven">${voc.en}</span>
        <span class="vkr">${voc.kr}</span>
        <span id="vsnd_${voc.en.replace(/\s/g,'_')}"></span>
      </div>
      <div class="vrow"><span class="vlab syn">유의어</span>${voc.syn}</div>
      <div class="vrow"><span class="vlab ant">반의어</span>${voc.ant}</div>
      <div class="vdef">💬 ${voc.def}</div>
    </div>`;
  });
  return h;
}

function answerDef(i,opt,btn){
  if(defState[i].answered)return;
  const q=defQuiz[i];
  const ok=opt===q.ans;
  defState[i]={answered:true,correct:ok};

  // DOM 직접 업데이트 (스크롤 유지)
  const card=document.querySelector('[data-dq="'+i+'"]');
  if(!card)return;
  [...card.querySelectorAll('.dq-opt')].forEach(b=>{
    b.classList.remove('dq-ok','dq-no','dq-dim');
    if(b.textContent.trim()===q.ans)b.classList.add('dq-ok');
    else b.classList.add('dq-dim');
    b.onclick=null;
  });
  let fb=card.querySelector('.dq-fb');
  if(!fb){fb=document.createElement('div');card.appendChild(fb);}
  fb.className='dq-fb show '+(ok?'ok':'no');
  fb.textContent=ok?'✅ 정답! — '+q.kr:'❌ 정답: '+q.ans+' ('+q.kr+')';

  // 진행바 업데이트
  const doneN=defState.filter(s=>s.answered).length;
  const okN=defState.filter(s=>s.correct).length;
  const prog=document.getElementById('wordProg');
  if(prog)prog.style.width=Math.round(doneN/VOCAB.length*100)+'%';
  const pl=document.querySelector('.prog-label');
  if(pl){pl.children[0].textContent='완료 '+doneN+'/'+VOCAB.length;pl.children[1].textContent=okN+' 정답';}
  if(doneN===VOCAB.length)completed.add(0);
}

function viewPhrase(){
  const done=phraseState.filter(s=>s.ok).length;
  if(done===PHRASE_FILL.length)completed.add(1);
  let h=`<div class="desc"><b>2단계 · 핵심 프레이즈</b><br>노란 빈칸을 탭해 확인하고, 직접 입력해서 채점도 해보세요.</div>
  <div class="prog-wrap">
    <div class="prog-label"><span id="pProg">완료 ${done}/${PHRASE_FILL.length}</span></div>
    <div class="prog-track"><div class="prog-fill" id="pProgBar" style="width:${Math.round(done/PHRASE_FILL.length*100)}%"></div></div>
  </div>`;
  PHRASE_FILL.forEach((f,i)=>{
    const st=phraseState[i];
    const displayed=f.sent.replace(`[${f.b}]`,`<span class="blank-tap${st.shown?' show':''}" onclick="togglePhrase(${i})">${f.b}</span>`);
    h+=`<div class="qcard" data-phrase="${i}">
      <div class="qnum">표현 ${i+1} / ${PHRASE_FILL.length}</div>
      <div class="qkr">${f.kr}</div>
      <div class="qsent">${displayed}</div>
      <input class="phrase-inp${st.graded?(st.ok?' ok':' no'):''}" data-pi="${i}" placeholder="직접 입력해서 채점" value="${st.inputVal}"
        oninput="phraseState[${i}].inputVal=this.value"
        onkeydown="if(event.key==='Enter')phraseGrade(${i})">
      <div class="phrase-fb${st.graded?(st.ok?' ok':' no'):''}">${st.graded?(st.ok?'✅ 정답!':'❌ 정답: '+f.b):'&nbsp;'}</div>
      <button class="b b1" style="padding:6px 14px;font-size:12px;margin-top:4px;" onclick="phraseGrade(${i})">채점</button>
    </div>`;
  });
  return h;
}
function togglePhrase(i){
  phraseState[i].shown=!phraseState[i].shown;
  const card=document.querySelector('[data-phrase="'+i+'"]');
  if(!card)return;
  const span=card.querySelector('.blank-tap');
  if(span)span.classList.toggle('show',phraseState[i].shown);
}
function phraseGrade(i){
  const f=PHRASE_FILL[i];
  const inp=document.querySelector('[data-pi="'+i+'"]');
  if(!inp)return;
  const val=inp.value.trim().toLowerCase();
  const ok=val===f.b.toLowerCase();
  phraseState[i].graded=true;phraseState[i].ok=ok;
  inp.className='phrase-inp '+(ok?'ok':'no');
  const fb=inp.nextElementSibling;
  if(fb){fb.className='phrase-fb '+(ok?'ok':'no');fb.textContent=ok?'✅ 정답!':'❌ 정답: '+f.b;}
  const done=phraseState.filter(s=>s.ok).length;
  const pp=document.getElementById('pProg');const pb=document.getElementById('pProgBar');
  if(pp)pp.textContent='완료 '+done+'/'+PHRASE_FILL.length;
  if(pb)pb.style.width=Math.round(done/PHRASE_FILL.length*100)+'%';
  if(done===PHRASE_FILL.length)completed.add(1);
}

function gradeEngWrite(i){
  const d=ENG_WRITE[i];const st=engWriteState[i];
  const ta=document.querySelector('[data-ew-ta="'+i+'"]');
  if(!ta)return;
  st.inputVal=ta.value;
  const val=ta.value.trim().toLowerCase().replace(/[.,!?'"]/g,'');
  const ans=d.ans.toLowerCase().replace(/[.,!?'"]/g,'');
  const ok=val===ans;
  st.attempts++;
  if(ok){st.solved=true;}
  else if(st.attempts===1){showHint(i);}
  else{
    // 2회 이상 오답 → 정답 공개
    const ansEl=document.getElementById('ewans_'+i);
    if(ansEl)ansEl.classList.add('show');
  }
  const fb=document.getElementById('ewfb_'+i);
  if(fb){
    fb.style.display='block';
    if(ok){fb.style.background='var(--ok-bg)';fb.style.color='var(--ok)';fb.textContent='✅ 정답!';}
    else if(st.attempts===1){fb.style.background='var(--no-bg)';fb.style.color='var(--no)';fb.textContent='❌ 힌트를 보고 다시 도전!';}
    else{fb.style.background='var(--no-bg)';fb.style.color='var(--no)';fb.textContent='❌ 정답을 확인하고 다시 써보세요.';}
  }
  const solved=engWriteState.filter(s=>s.solved).length;
  const tp=document.getElementById('tProg');const tb=document.getElementById('tProgBar');
  if(tp)tp.textContent='완료 '+solved+'/'+ENG_WRITE.length;
  if(tb)tb.style.width=Math.round(solved/ENG_WRITE.length*100)+'%';
  if(solved===ENG_WRITE.length)completed.add(2);
}
function showHint(i){
  engWriteState[i].hintShown=true;
  const hr=document.getElementById('hint_'+i);
  const hb=document.getElementById('hintBtn_'+i);
  if(hr)hr.style.display='flex';
  if(hb)hb.style.display='none';
}
function attachEngSnd(){
  ENG_WRITE.forEach((d,i)=>{
    const el=document.getElementById('ewsnd_'+i);

  const kr=document.getElementById('oxkr_'+i);
  const btn=document.querySelector('[data-oxkr="'+i+'"]');
  if(kr)kr.classList.toggle('show',oxKrShown[i]);
  if(btn)btn.textContent=oxKrShown[i]?'해석 숨기기':'해석 보기 👀';
}
function pickOX(i,v){
  oxAns[i]=v;
  const o=OX[i];const correct=v===o.a;
  const card=document.querySelector('[data-ox="'+i+'"]');
  if(!card)return;
  const btns=card.querySelectorAll('.ox');
  btns[0].className='ox'+(v===true?(o.a?' pickO':' pickX'):'');
  btns[1].className='ox'+(v===false?(!o.a?' pickO':' pickX'):'');
  let fb=card.querySelector('.ox-fb');
  if(!fb){fb=document.createElement('div');card.appendChild(fb);}
  fb.className='ox-fb '+(correct?'ok':'no');
  fb.textContent=(correct?'✅ 정답!':'❌ 오답')+(o.exp?' — '+o.exp:' (정답: '+(o.a?'O':'X')+')');
  const done=oxAns.filter(v=>v!==null).length;
  const okN=OX.filter((o,i)=>oxAns[i]===o.a).length;
  const op=document.getElementById('oxProg');const oo=document.getElementById('oxOk');const ob=document.getElementById('oxBar');
  if(op)op.textContent='완료 '+done+'/'+OX.length;
  if(oo)oo.textContent=okN+' 정답';
  if(ob)ob.style.width=Math.round(done/OX.length*100)+'%';
  if(done===OX.length){
    completed.add(3);
    let banner=document.getElementById('oxBanner');
    if(!banner){banner=document.createElement('div');banner.id='oxBanner';document.getElementById('app').appendChild(banner);}
    banner.className='complete-banner';
    banner.innerHTML=`<div class="cb-icon">🎉</div><div class="cb-title">${okN}/${OX.length} 정답</div><div class="cb-sub">${okN>=16?'훌륭해요! 단락 매칭으로 가세요 👏':okN>=12?'잘했어요! 틀린 것을 다시 확인해보세요':'본문을 한번 더 읽어보세요'}</div>`;
  }
}

/* ══════════════════════════════════════
   5단계: 단락 그림 + 내용 매칭
══════════════════════════════════════ */
const SHUFFLED_CONTENTS=()=>[...PARA_CONTENTS].sort(()=>Math.random()-.5);
let _shuffledContents=null;

function viewParaMatch(){
  if(!_shuffledContents)_shuffledContents=SHUFFLED_CONTENTS();
  const allMatched=pmMatched.length===PARA_CARDS.length;
  if(allMatched)completed.add(4);
  let h=`<div class="desc"><b>5단계 · 단락 매칭</b><br>그림 카드를 탭한 뒤 알맞은 내용 카드를 탭해 짝을 맞추세요.</div>`;
  if(allMatched){
    h+=`<div class="complete-banner"><div class="cb-icon">🎉</div><div class="cb-title">4쌍 모두 완성!</div><div class="cb-sub">종합시험으로 넘어가세요 👏</div></div>`;
  }
  // 그림 카드 2×2
  h+=`<div class="pm-section-label">🖼 그림 카드 — 어떤 단락일까요?</div>
  <div class="para-match-grid">`;
  PARA_CARDS.forEach(c=>{
    const matched=pmMatched.includes(c.id);
    const sel=pmSelPic===c.id;
    h+=`<div class="pm-card${matched?' matched':sel?' sel':''}" data-pic="${c.id}" onclick="selectPic(${c.id})">
      ${c.svg}
      <div class="pc-label">${matched?c.label:'?'}</div>
    </div>`;
  });
  h+=`</div>`;
  // 내용 카드 2×2
  h+=`<div class="pm-section-label">📝 내용 카드 — 그림과 짝을 맞추세요</div>
  <div class="para-match-grid">`;
  _shuffledContents.forEach(c=>{
    const matched=pmMatched.includes(c.id);
    const sel=pmSelTxt===c.id;
    h+=`<div class="pm-content-card${matched?' matched':sel?' sel':''}" data-txt="${c.id}" onclick="selectTxt(${c.id})">
      <div class="cc-title">${matched?c.title:'단락 ?'}</div>
      <div class="cc-body">${c.body.replace(/\n/g,'<br>')}</div>
    </div>`;
  });
  h+=`</div>`;
  if(pmMatched.length>0&&!allMatched){
    h+=`<div style="text-align:center;font-size:13px;color:var(--ok);font-weight:700;margin-top:6px;">${pmMatched.length}/4 완성 · 계속하세요!</div>`;
  }
  h+=`<button class="b b2" style="margin-top:12px;font-size:12px;" onclick="resetParaMatch()">처음부터 다시</button>`;
  return h;
}

function selectPic(id){
  if(pmMatched.includes(id))return;
  pmSelPic=id;
  // 그림 카드 sel 상태 업데이트
  document.querySelectorAll('[data-pic]').forEach(el=>{
    el.classList.toggle('sel',parseInt(el.dataset.pic)===id&&!pmMatched.includes(id));
  });
  if(pmSelTxt!==null)tryMatch();
}
function selectTxt(id){
  if(pmMatched.includes(id))return;
  pmSelTxt=id;
  document.querySelectorAll('[data-txt]').forEach(el=>{
    el.classList.toggle('sel',parseInt(el.dataset.txt)===id&&!pmMatched.includes(id));
  });
  if(pmSelPic!==null)tryMatch();
}
function tryMatch(){
  const ok=pmSelPic===pmSelTxt;
  if(ok){
    pmMatched.push(pmSelPic);
    // 매칭된 카드 업데이트
    const picCard=document.querySelector('[data-pic="'+pmSelPic+'"]');
    const txtCard=document.querySelector('[data-txt="'+pmSelTxt+'"]');
    const picData=PARA_CARDS.find(c=>c.id===pmSelPic);
    const txtData=PARA_CONTENTS.find(c=>c.id===pmSelTxt);
    if(picCard){picCard.classList.remove('sel');picCard.classList.add('matched');picCard.querySelector('.pc-label').textContent=picData?.label||'';}
    if(txtCard){txtCard.classList.remove('sel');txtCard.classList.add('matched');txtCard.querySelector('.cc-title').textContent=txtData?.title||'';}
    pmSelPic=null;pmSelTxt=null;
    if(pmMatched.length===PARA_CARDS.length){
      completed.add(4);
      setTimeout(()=>{
        const app=document.getElementById('app');
        let banner=document.createElement('div');banner.className='complete-banner';
        banner.innerHTML='<div class="cb-icon">🎉</div><div class="cb-title">4쌍 모두 완성!</div><div class="cb-sub">종합시험으로 넘어가세요 👏</div>';
        app.insertBefore(banner,app.firstChild);
      },200);
    }
  } else {
    // 오답 — 빨간 플래시 후 초기화
    const picCard=document.querySelector('[data-pic="'+pmSelPic+'"]');
    const txtCard=document.querySelector('[data-txt="'+pmSelTxt+'"]');
    if(picCard)picCard.classList.add('wrong-flash');
    if(txtCard)txtCard.classList.add('wrong-flash');
    setTimeout(()=>{
      if(picCard){picCard.classList.remove('wrong-flash','sel');}
      if(txtCard){txtCard.classList.remove('wrong-flash','sel');}
    },600);
    pmSelPic=null;pmSelTxt=null;
  }
}
function resetParaMatch(){pmSelPic=null;pmSelTxt=null;pmMatched=[];_shuffledContents=null;go(4);}

/* ══════════════════════════════════════
   6단계: 종합시험 — 본문 빈칸
══════════════════════════════════════ */
function viewExam(){
  examGraded=false;
  let totalBlanks=0;
  EXAM_SECTIONS.forEach(sec=>sec.sents.forEach(s=>{if(s.b)totalBlanks++;}));

  let h=`<div class="desc"><b>종합시험 · 본문 빈칸 채우기</b><br>본문 핵심 문구가 빠진 자리를 채우세요. 총 ${totalBlanks}개 빈칸.</div>
  <div class="exam-passage">`;

  EXAM_SECTIONS.forEach((sec,si)=>{
    h+=`<div class="ep-section"><div class="ep-section-title">${sec.title}</div>`;
    sec.sents.forEach((s,ii)=>{
      if(!s.b){
        h+=`<div class="ep-sent">${s.t}</div>`;
      } else {
        const displayed=s.t.replace(`[${s.b}]`,
          `<input class="ep-inp" data-sec="${si}" data-sent="${ii}" placeholder="${'_'.repeat(Math.min(s.b.length,12))}" autocomplete="off" spellcheck="false">`);
        h+=`<div class="ep-sent">${displayed}</div>`;
      }
    });
    h+=`</div>`;
  });

  h+=`</div>
  <div class="exam-ctrl">
    <button class="b b1" onclick="gradeExam()">전체 채점</button>
    <button class="b b2" onclick="resetExam()">다시 쓰기</button>
  </div>
  <div id="examResult"></div>`;
  return h;
}

function gradeExam(){
  let total=0,ok=0;
  EXAM_SECTIONS.forEach((sec,si)=>{
    sec.sents.forEach((s,ii)=>{
      if(!s.b)return;
      total++;
      const inp=document.querySelector(`[data-sec="${si}"][data-sent="${ii}"]`);
      if(!inp)return;
      const val=inp.value.trim().toLowerCase();
      const correct=s.b.toLowerCase();
      const isOk=val===correct;
      if(isOk)ok++;
      inp.classList.remove('ok','no');
      inp.classList.add(isOk?'ok':'no');
      if(!isOk)inp.title='정답: '+s.b;
    });
  });
  const pct=Math.round(ok/total*100);
  const res=document.getElementById('examResult');
  if(res){
    res.className='exam-result-bar '+(pct>=70?'ok':'bad');
    res.innerHTML=`<div class="er-score">${ok} / ${total}</div>
      <div class="er-msg">${pct}점 · ${pct>=90?'완벽해요! 🎉':pct>=70?'잘했어요! 👍':'틀린 칸 위에 마우스를 올리면 정답이 보여요 💪'}</div>`;
  }
  if(pct>=60)completed.add(5);
  examGraded=true;
}
function resetExam(){examGraded=false;go(5);}
function norm(s){return(s||'').toLowerCase().replace(/[^a-z0-9가-힣]/g,'').trim();}

/* 초기화 */
go(0);
</script>
