<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Be a Smart Shopper · 한글 이해 & 거꾸로 영작</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=Nunito:wght@700;900&display=swap');
:root{--c1:#f97316;--c2:#3b82f6;--c3:#10b981;--c4:#8b5cf6;--c5:#ec4899;--c6:#f59e0b;--bg:#f0f9ff;--card:#fffdf7;--ink:#1a1a2e;--muted:#666;--line:#e8e8e8;--ok:#10b981;--no:#ef4444;--shadow:rgba(0,0,0,.10);}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);font-family:'Noto Sans KR',sans-serif;color:var(--ink);padding-bottom:70px}
.page-title{text-align:center;padding:22px 16px 8px}
.page-title h1{font-family:'Nunito','Noto Sans KR',sans-serif;font-size:clamp(21px,5vw,32px);font-weight:900}
.subtitle{font-size:13px;color:var(--muted);margin-top:5px}
.deco-bar{width:90px;height:5px;background:linear-gradient(90deg,var(--c5),var(--c6),var(--c3));border-radius:10px;margin:8px auto 0}
.steps{position:sticky;top:0;z-index:30;background:var(--bg);max-width:980px;margin:14px auto 0;padding:8px 12px;display:flex;gap:6px;overflow-x:auto}
.step{flex:1;min-width:82px;font-family:inherit;font-size:11px;font-weight:800;padding:10px 6px;border-radius:22px;border:0;cursor:pointer;background:#fff;color:var(--muted);box-shadow:0 2px 8px var(--shadow);line-height:1.25;white-space:nowrap}
.step.on{background:var(--ink);color:white}
.step .sn{display:block;font-size:9px;opacity:.72}
.wrap{max-width:980px;margin:0 auto;padding:18px 16px}
.intro{background:#fffbeb;border:2px solid #fcd34d;border-radius:14px;padding:14px 18px;font-size:13px;color:#555;line-height:1.8;margin-bottom:18px}
.intro b{color:var(--ink)}
.kr-block,.qcard{background:var(--card);border-radius:16px;box-shadow:0 4px 18px var(--shadow);border:2px solid var(--line);padding:18px 20px;margin-bottom:16px}
.kr-sec{font-size:13px;font-weight:900;color:var(--c5);margin:8px 0 8px;padding-left:10px;border-left:4px solid var(--c5)}
.kr-line{font-size:15px;line-height:2;color:#222;padding:3px 0}
.num{display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;background:#fdf2f8;color:#be185d;border-radius:50%;font-size:12px;font-weight:900;margin-right:6px}
.speak{border:0;background:#e0f2fe;color:#0369a1;border-radius:999px;padding:4px 8px;font-size:12px;font-weight:900;cursor:pointer;margin-right:6px}
.flow{display:flex;flex-direction:column;gap:0;margin:10px 0}
.flow-item{background:#f0f7ff;border-radius:12px;padding:12px 16px;font-size:13.5px;font-weight:800;color:#0369a1;position:relative;margin-bottom:26px}
.flow-item:last-child{margin-bottom:0}
.flow-item::after{content:'▼';position:absolute;bottom:-22px;left:50%;transform:translateX(-50%);color:#93c5e8;font-size:14px}
.flow-item:last-child::after{display:none}
.flow-item .ft{font-size:11px;color:var(--c5);display:block;margin-bottom:2px}
.bar{height:8px;background:#dbeafe;border-radius:5px;overflow:hidden;margin-bottom:18px}
.bar>div{height:100%;background:linear-gradient(90deg,var(--c5),var(--c3));border-radius:5px;transition:.4s}
.qnum{font-size:11px;color:var(--muted);margin-bottom:8px;font-weight:800}
.qsent{font-size:15px;font-weight:800;line-height:1.6}
.ox-row{display:flex;gap:10px;margin-top:12px}
.ox{flex:1;padding:13px;border:2px solid var(--line);border-radius:12px;background:white;font-size:16px;font-weight:900;cursor:pointer;text-align:center}
.ox.pick{border-color:var(--c5);background:#fdf2f8;color:#be185d}
.fb{font-size:13px;min-height:18px;font-weight:800;margin-top:9px;line-height:1.6}
.ok{color:var(--ok)}.no{color:var(--no)}
.btns{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:15px 0}
.b{padding:10px 18px;border:0;border-radius:24px;font-family:inherit;font-size:13px;font-weight:900;cursor:pointer;box-shadow:0 2px 8px var(--shadow)}
.b1{background:var(--c5);color:white}.b2{background:#e5e7eb;color:var(--ink)}.b3{background:var(--c3);color:white}
.hidden{display:none}
.order-item{background:white;border:2px solid var(--line);border-radius:12px;padding:12px 14px;font-size:13.5px;font-weight:800;margin-bottom:8px;cursor:pointer;display:flex;align-items:center;gap:10px;box-shadow:0 2px 6px var(--shadow)}
.order-item .pick-no{width:27px;height:27px;border-radius:50%;background:#e5e7eb;color:#666;display:inline-flex;align-items:center;justify-content:center;font-size:12px;font-weight:900;flex-shrink:0}
.order-item.picked .pick-no{background:var(--c5);color:white}
.build{min-height:56px;background:#f0f7ff;border:2px dashed #93c5e8;border-radius:10px;padding:12px;font-size:15px;font-weight:800;line-height:1.9;margin:12px 0}
.bw{display:inline-block;background:white;border:1.5px solid var(--c5);border-radius:8px;padding:3px 10px;margin:3px;cursor:pointer}
.tokens{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 12px}
.token{padding:9px 13px;border:2px solid var(--line);border-radius:10px;background:white;font-size:14px;font-weight:800;cursor:pointer;box-shadow:0 2px 6px var(--shadow)}
.token.used{opacity:.28;pointer-events:none}
.ansbox{font-size:13px;color:#0369a1;background:#e0f2fe;padding:10px 12px;border-radius:9px;margin-top:8px;display:none;line-height:1.7;font-weight:800}
.hintrow{font-size:12.5px;color:var(--muted);margin-top:8px}
.ph{display:inline-block;background:#fdf2f8;color:#be185d;font-weight:800;padding:2px 9px;border-radius:8px;margin:2px}
.nav2{display:flex;justify-content:space-between;align-items:center;margin-top:16px}
.nav2 .b{background:white;color:var(--ink)}.nav2 .b:disabled{opacity:.35}
.cnt{font-size:13px;color:var(--muted);font-weight:800}
.result{text-align:center;padding:25px 14px}
.score{font-size:54px;font-weight:900;background:linear-gradient(90deg,var(--c5),var(--c3));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.answer-list{font-size:14px;line-height:2}
.cover{display:grid;grid-template-columns:48px 1fr 70px;gap:8px;align-items:center;border-bottom:1px solid #eee;padding:8px 0;font-size:13px}
.cover b{color:#be185d}
.small{font-size:12px;color:var(--muted);line-height:1.7;margin-top:8px}
</style>
</head>
<body>
<div class="page-title">
  <h1>🇰🇷 한글 이해 & 거꾸로 영작</h1>
  <p class="subtitle">Be a Smart Shopper · 전체 문장 음성 + 전체 문장 영작 + 정답 클릭 공개</p>

<script>
const DATA = {"sentences": [{"sec": "① 도입 — 현명한 소비자가 되려면", "en": "Do you think you are a smart shopper?", "ko": "너는 네가 현명한 구매자라고 생각하니?", "hint": ["Do you think", "smart shopper"]}, {"sec": "① 도입 — 현명한 소비자가 되려면", "en": "Well, you may think you are, but hold on!", "ko": "음, 너는 그렇다고 생각할 수도 있지만, 잠깐만!", "hint": ["may think", "hold on"]}, {"sec": "① 도입 — 현명한 소비자가 되려면", "en": "There are various marketing strategies which influence your decisions.", "ko": "너의 결정에 영향을 주는 다양한 마케팅 전략들이 있다.", "hint": ["There are", "various marketing strategies", "which influence"]}, {"sec": "① 도입 — 현명한 소비자가 되려면", "en": "Learning about them will make you a smarter shopper.", "ko": "그것들에 대해 배우는 것은 너를 더 현명한 구매자로 만들어 줄 것이다.", "hint": ["Learning about them", "will make", "smarter shopper"]}, {"sec": "② 헝거 마케팅 — 제한된 시간은 조급함을 만든다", "en": "What? The sale ends in two hours?", "ko": "뭐라고? 그 세일이 두 시간 후에 끝난다고?", "hint": ["sale ends", "in two hours"]}, {"sec": "② 헝거 마케팅 — 제한된 시간은 조급함을 만든다", "en": "If I don’t buy the sneakers now, I will have to buy them at a higher price.", "ko": "내가 지금 그 운동화를 사지 않으면, 나는 그것들을 더 비싼 가격에 사야 할 것이다.", "hint": ["If I don’t buy", "will have to", "at a higher price"]}, {"sec": "② 헝거 마케팅 — 제한된 시간은 조급함을 만든다", "en": "Stop, Junho! You’re buying the sneakers just because you don’t want to miss the sale.", "ko": "멈춰, 준호야! 너는 단지 세일을 놓치고 싶지 않아서 그 운동화를 사고 있는 거야.", "hint": ["just because", "don’t want to miss"]}, {"sec": "② 헝거 마케팅 — 제한된 시간은 조급함을 만든다", "en": "You’re falling for a hunger marketing strategy.", "ko": "너는 헝거 마케팅 전략에 속고 있는 거야.", "hint": ["fall for", "hunger marketing strategy"]}, {"sec": "② 헝거 마케팅 — 제한된 시간은 조급함을 만든다", "en": "If people can buy a product only for a limited time, they often feel “hungry” for it and want to buy it.", "ko": "사람들이 제한된 시간 동안만 제품을 살 수 있다면, 그들은 종종 그것에 대해 강한 욕구를 느끼고 그것을 사고 싶어 한다.", "hint": ["only for a limited time", "feel hungry for", "want to buy"]}, {"sec": "② 헝거 마케팅 — 제한된 시간은 조급함을 만든다", "en": "About missing the sale, don’t worry, Junho.", "ko": "세일을 놓치는 function esc(t){return String(t).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));}

function grouped(){let m={}; S.forEach((x,i)=>{(m[x.sec]||(m[x.sec]=[])).push([x,i]);}); return m;}

 h+=`</div>`;});
 return h;
}

function pickOX(i,v){if(!oxChecked){oxAns[i]=v;render();}}
function checkOX(){if(oxAns.some(x=>x===null)){alert('모든 O/X 문제를 먼저 풀어주세요.');return;} oxChecked=true; render();}
function revealOX(){if(!oxChecked){alert('먼저 채점하기를 눌러주세요.');return;} oxReveal=true; render();}
function resetOX(){oxAns=Array(OX.length).fill(null);oxChecked=false;oxReveal=false;render();}

function v3(){

 h+=`<div class="btns"><button class="b b1" onclick="checkOrder()">순서 확인</button><button class="b b3" onclick="showOrderAns()">정답 보기</button><button class="b b2" onclick="orderPick=[];orderChecked=false;render()">초기화</button></div><div id="orderFb" class="fb" style="text-align:center">`;

}
function pickOrder(oi){if(orderChecked)return; let i=orderPick.indexOf(oi); if(i>=0)orderPick.splice(i,1); else orderPick.push(oi); render();}
function checkOrder(){if(orderPick.length<FLOW.length){alert('모든 단락을 순서대로 선택하세요.');return;} orderChecked=true; render();}
function showOrderAns(){if(!orderChecked){alert('먼저 순서 확인을 눌러주세요.');return;} window.orderReveal=true; render();}

function v4(){

function addTok(i){if(!bBuilt.includes(i)){bBuilt.push(i);render();}}
function rmTok(i){bBuilt=bBuilt.filter(x=>x!==i);render();}
function checkB(){let q=S[bIdx], ans=words(q.en).join(' '), made=bBuilt.map(i=>words(q.en)[i]).join(' '); bChecked[bIdx]=true; bCorrect[bIdx]=norm(made)===norm(ans); render();}
function showB(){if(!bChecked[bIdx]){alert('먼저 확인을 눌러주세요.');return;} bReveal[bIdx]=true; render();}
function bNav(d){bIdx=Math.max(0,Math.min(S.length-1,bIdx+d)); bBuilt=[]; render();}

render();
</script>
