const ITEMS=DATA.items;
const colors=i=>'c'+((i%8)+1);
function esc(s){return String(s??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;')}
function openTab(id,btn){document.querySelectorAll('.section').forEach(s=>s.classList.remove('active'));document.getElementById(id).classList.add('active');document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));btn.classList.add('active')}

let voicesReady=false;
function initVoices(){
  if(!('speechSynthesis' in window)) return;
  speechSynthesis.getVoices();
  voicesReady=true;
}
document.addEventListener('click', initVoices, {once:true});
document.addEventListener('touchstart', initVoices, {once:true});
if('speechSynthesis' in window){
  speechSynthesis.onvoiceschanged = initVoices;
}
function getEnglishVoice(){
  const voices = speechSynthesis.getVoices();
  return voices.find(v=>v.lang==='en-US') ||
         voices.find(v=>v.lang && v.lang.toLowerCase().startsWith('en')) ||
         voices[0] || null;
}
function speak(text){
  if(!('speechSynthesis' in window)){
    alert('음성 기능을 지원하지 않는 브라우저입니다. Chrome으로 열어 주세요.');
    return;
  }
  const msg = String(text || '').trim();
  if(!msg) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(msg);
  u.lang = 'en-US';
  u.rate = 0.78;
  u.pitch = 1;
  u.volume = 1;
  const v = getEnglishVoice();
  if(v) u.voice = v;
  setTimeout(function(){
    speechSynthesis.resume();
    speechSynthesis.speak(u);
  }, 10);
}
function speakVisible(){
  if(!('speechSynthesis' in window)){
    alert('음성 기능을 지원하지 않는 브라우저입니다. Chrome으로 열어 주세요.');
    return;
  }
  const texts=[...document.querySelector('.section.active').querySelectorAll('[data-text]')]
    .map(x=>x.dataset.text).filter(Boolean);
  let i=0;
  speechSynthesis.cancel();
  function next(){
    if(i>=texts.length)return;
    const u=new SpeechSynthesisUtterance(texts[i++]);
    u.lang='en-US';
    u.rate=.78;
    u.volume=1;
    const v=getEnglishVoice();
    if(v)u.voice=v;
    u.onend=next;
    u.onerror=next;
    speechSynthesis.resume();
    speechSynthesis.speak(u);
  }
  next();
}
function revealAll(){document.querySelectorAll('.flip').forEach(c=>c.classList.add('open'))}
function hideAll(){document.querySelectorAll('.flip').forEach(c=>c.classList.remove('open'))}
function done(btn){btn.classList.toggle('done');btn.textContent=btn.classList.contains('done')?'완료됨':'완료'}
function sp(t){return `<button type="button" class="small speak" onclick="event.stopPropagation(); speak(decodeURIComponent('${encodeURIComponent(t)}'))">🔊 듣기</button>`}
function cardHTML(i,it){return `<div class="card flip ${colors(i)}" data-text="${esc(it.term+'. '+it.ex)}" onclick="if(event.target.tagName!=='BUTTON')this.classList.toggle('open')"><div class="head"><div class="num">${i+1}</div>${esc(it.cat)}<div class="tag">${esc(it.pos)}</div></div><div class="body"><div class="word">${esc(it.term)}</div><div class="meaning">${esc(it.ko)}</div><div class="ex">${sp(it.term)} ${sp(it.ex)}<br>${esc(it.ex)}</div><div class="meta"><b>영영풀이</b> ${esc(it.def)}<br><b>유의어</b> ${esc(it.syn||'-')}<br><b>반의어</b> ${esc(it.ant||'-')}</div><div class="row"><button class="small check" onclick="done(this)">완료</button></div></div></div>`}
function makeCards(){const g=document.getElementById('cardGrid');ITEMS.forEach((it,i)=>g.insertAdjacentHTML('beforeend',cardHTML(i,it)))}

function makeRecall(){const area=document.getElementById('recallArea');DATA.recall.forEach((r,i)=>{area.insertAdjacentHTML('beforeend',`<div class="quiz-box flip" data-text="${esc(r.a)}"><div class="q">${i+1}. ${esc(r.q)}<br><span style="font-size:12px;color:#777">영어를 떠올린 뒤 정답을 클릭하세요.</span></div><button class="btn pink" onclick="this.closest('.flip').classList.add('open')">정답 보기</button><div class="answer"><div class="meaning">${esc(r.a)}</div><div class="ex">${sp(r.a)} ${sp(r.ex)}<br>${esc(r.ex)}</div></div></div>`)})}

let lsel=null,rsel=null,matchDone=0;
function makeMatch(){
 const sample=[...ITEMS].sort((a,b)=>a.term.localeCompare(b.term));
 const left=document.getElementById('leftMatch'), right=document.getElementById('rightMatch');
 const rs=[...sample].sort(()=>Math.random()-.5);
 sample.forEach((it,i)=>left.insertAdjacentHTML('beforeend',`<div class="match" data-key="${esc(it.term)}" data-text="${esc(it.term)}" onclick="pickL(this)">${sp(it.term)} ${esc(it.term)}</div>`));
 rs.forEach((it,i)=>right.insertAdjacentHTML('beforeend',`<div class="match" data-key="${esc(it.term)}" onclick="pickR(this)">${esc(it.ko)}</div>`));
}
function pickL(el){if(el.classList.contains('done'))return; document.querySelectorAll('#leftMatch .match').forEach(x=>x.classList.remove('sel')); el.classList.add('sel'); lsel=el; tryMatch()}
function pickR(el){if(el.classList.contains('done'))return; document.querySelectorAll('#rightMatch .match').forEach(x=>x.classList.remove('sel')); el.classList.add('sel'); rsel=el; tryMatch()}
function tryMatch(){if(!lsel||!rsel)return; if(lsel.dataset.key===rsel.dataset.key){lsel.classList.add('done');rsel.classList.add('done');lsel.classList.remove('sel');rsel.classList.remove('sel');matchDone++;document.getElementById('matchScore').textContent='완료: '+matchDone+' / '+ITEMS.length;lsel=null;rsel=null}else{lsel.classList.add('bad');rsel.classList.add('bad');setTimeout(()=>{lsel&&lsel.classList.remove('bad','sel');rsel&&rsel.classList.remove('bad','sel');lsel=null;rsel=null},450)}}

function makeDefs(){const area=document.getElementById('defArea');DATA.defs.forEach((q,i)=>addQuiz(area,q,i,'def'))}
let testCorrect=0,testAnswered=0;
function addQuiz(area,q,i,kind){area.insertAdjacentHTML('beforeend',`<div class="quiz-box" data-ans="${q.ans}" data-done="0"><div class="q">${i+1}. ${esc(q.q)}</div>${q.opts.map((o,j)=>`<button class="opt" onclick="choose(this,${j},'${kind}')">${String.fromCharCode(9312+j)} ${esc(o)}</button>`).join('')}<button class="btn pink" style="margin-top:8px" onclick="showQuizAnswer(this)">정답 보기</button><div class="answer"></div></div>`)}
function choose(btn,idx,kind){const box=btn.closest('.quiz-box'); if(box.dataset.done==='1')return; box.dataset.done='1'; const ans=Number(box.dataset.ans); box.querySelectorAll('.opt').forEach((o,j)=>{if(j===ans)o.classList.add('correct')}); if(idx===ans){btn.classList.add('correct'); if(kind==='test')testCorrect++;} else btn.classList.add('wrong'); if(kind==='test'){testAnswered++;document.getElementById('score').textContent=`점수: ${testCorrect} / ${testAnswered}`}}
function showQuizAnswer(btn){const box=btn.closest('.quiz-box'); const ans=Number(box.dataset.ans); box.querySelectorAll('.opt').forEach((o,j)=>{if(j===ans)o.classList.add('correct')}); box.dataset.done='1'}
function makeTests(){const area=document.getElementById('testArea');DATA.tests.forEach((q,i)=>addQuiz(area,q,i,'test'))}
makeCards();makeRecall();makeMatch();makeDefs();makeTests();
