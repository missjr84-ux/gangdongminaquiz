function unlockTTS(){
  if(!SS||ttsReady)return;
  try{ var u=new SpeechSynthesisUtterance(' '); u.volume=0; SS.speak(u); SS.cancel(); }catch(e){}
  loadVoices(); ttsReady=true;
  var hint=document.getElementById('sndHint'); if(hint)hint.style.display='none';
}
document.addEventListener('touchstart',unlockTTS,{once:true,passive:true});
document.addEventListener('mousedown',unlockTTS,{once:true});
document.addEventListener('click',unlockTTS,{once:true});

function pickVoice(){
  if(!ttsVoices.length)loadVoices();
  return ttsVoices.filter(function(x){return x.lang==='en-US';})[0]
      || ttsVoices.filter(function(x){return x.lang&&x.lang.toLowerCase().indexOf('en')===0;})[0]
      || ttsVoices[0] || null;
}
function speak(t,btn){
  if(!SS){alert('이 브라우저는 음성을 지원하지 않습니다. Chrome으로 열어 주세요.');return;}
  unlockTTS();
  var msg=String(t==null?'':t).replace(/[\/~_]/g,' ').replace(/\s+/g,' ').trim();
  if(!msg)return;
  SS.cancel();
  var btns=document.querySelectorAll('.speak.playing');
  for(var i=0;i<btns.length;i++)btns[i].classList.remove('playing');
  function fire(){
    var u=new SpeechSynthesisUtterance(msg);
    u.lang='en-US'; u.rate=0.85; u.pitch=1; u.volume=1;
    var v=pickVoice(); if(v)u.voice=v;
    if(btn){btn.classList.add('playing');u.onend=u.onerror=function(){btn.classList.remove('playing');};}
    try{ SS.resume(); }catch(e){}
    SS.speak(u);
  }
  /* if voices not loaded yet, wait briefly then fire */
  if(!ttsVoices.length){
    loadVoices();
    if(!ttsVoices.length){ setTimeout(fire,180); return; }
  }
  setTimeout(fire,0);
}

/* ===== HELPERS ===== */
function esc(t){return String(t==null?'':t).replace(/[&<>"']/g,function(m){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m];});}
function sp(t,mini){return '<button type="button" class="speak'+(mini?' mini':'')+'" data-say="'+esc(t)+'" onclick="event.stopPropagation();speak(this.getAttribute(\'data-say\'),this)">🔊 듣기</button>';}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
function colors(i){return 'c'+((i%8)+1);}
function norm(s){return String(s||'').trim().toLowerCase().replace(/\s+/g,' ');}
function buildOpts(correct,pool){
  var set=[correct],sh=shuffle(pool),k;
  for(k=0;k<sh.length&&set.length<4;k++){if(sh[k]!=null&&set.indexOf(sh[k])<0)set.push(sh[k]);}
  if(set.length<4){var fill=shuffle(ITEMS.map(function(x){return x.term;}).concat(ITEMS.map(function(x){return x.ko;})));
    for(k=0;k<fill.length&&set.length<4;k++){if(set.indexOf(fill[k])<0)set.push(fill[k]);}}
  var opts=shuffle(set);
  return {opts:opts,ans:opts.indexOf(correct)};
}

/* ===== ③ MATCH ===== */
function V2(){
  var pages=Math.ceil(ITEMS.length/10);
  if(matchPairs.length===0)loadMatch(matchPage);
  var done=matchPairs.filter(function(p){return p.done;}).length;
  var h='<div class="intro">💡 <b>③ 매치 게임</b><br>영어와 뜻을 짝지으세요. 영어 옆 🔊로 발음을 들을 수 있습니다.</div>'+
    '<div class="seg">';
  for(var p=0;p<pages;p++)h+='<button class="'+(p===matchPage?'on':'')+'" onclick="matchPage='+p+';matchPairs=[];render()">'+(p*10+1)+'–'+Math.min((p+1)*10,ITEMS.length)+'</button>';
  h+='</div><div class="score">완료: '+done+' / '+matchPairs.length+'</div>'+
    '<div class="match-wrap"><div>';
  matchPairs.forEach(function(pr,i){
    h+='<div class="match '+(pr.done?'done':'')+(matchSel.l===i?' sel':'')+'" onclick="pickL('+i+')">'+sp(pr.term,true)+'<span>'+esc(pr.term)+'</span></div>';
  });
  h+='</div><div>';
  matchPairs.forEach(function(pr,i){
    var ri=matchRight[i];
    h+='<div class="match '+(matchPairs[ri].done?'done':'')+(matchSel.r===i?' sel':'')+'" onclick="pickR('+i+')"><span>'+esc(matchPairs[ri].ko)+'</span></div>';
  });
  h+='</div></div>';
  return h;
}
var matchRight=[];
function loadMatch(p){
  var slice=ITEMS.slice(p*10,p*10+10).map(function(it){return {term:it.term,ko:it.ko,done:false};});
  matchPairs=slice; matchSel={l:null,r:null};
  matchRight=shuffle(slice.map(function(_,i){return i;}));
}
function pickL(i){if(matchPairs[i].done)return;matchSel.l=i;tryMatch();render();}
function pickR(i){var ri=matchRight[i];if(matchPairs[ri].done)return;matchSel.r=i;tryMatch();render();}
function tryMatch(){
  if(matchSel.l===null||matchSel.r===null)return;
  var li=matchSel.l, ri=matchRight[matchSel.r];
  if(li===ri){matchPairs[li].done=true;matchSel={l:null,r:null};}
  else{matchSel={l:null,r:null};}
}

function V4(){
  if(!synState.qs){
    var pool=ITEMS.filter(function(it){return it.syn&&it.ant;});
    var qs=[];
    pool.forEach(function(it){
      var sFirst=it.syn.split(',')[0].trim();
      var aFirst=it.ant.split(',')[0].trim();
      var wp=ITEMS.filter(function(x){return x.term!==it.term;}).map(function(x){return x.term;});
      var a=buildOpts(sFirst, wp.filter(function(t){return t!==sFirst;}));
      qs.push({term:it.term,ko:it.ko,kind:'유의어',color:'#16a34a',opts:a.opts,ans:a.ans,say:sFirst,picked:-1,done:false});
      var sp2=ITEMS.filter(function(x){return x.term!==it.term&&x.syn;}).map(function(x){return x.syn.split(',')[0].trim();});
      var b=buildOpts(aFirst, sp2.filter(function(t){return t!==aFirst;}));
      qs.push({term:it.term,ko:it.ko,kind:'반의어',color:'#ef4444',opts:b.opts,ans:b.ans,say:aFirst,picked:-1,done:false});
    });
    synState.qs=qs;

    h+='<div class="qcard"><div class="qnum">문제 '+(i+1)+' / '+synState.qs.length+'</div>'+
      '<div class="qsent"><b>'+esc(q.term)+'</b> 의 <span style="color:'+q.color+'">'+q.kind+'</span>는? '+sp(q.term,true)+'<div class="qhint">'+esc(q.ko)+'</div></div>';
    q.opts.forEach(function(o,j){
      var cls='';
      if(q.done){if(j===q.ans)cls=' correct';else if(j===q.picked)cls=' wrong';}
      else if(j===q.picked)cls=' pick';
      h+='<button class="opt'+cls+'" onclick="pickSyn('+i+','+j+')"><span>'+String.fromCharCode(9312+j)+' '+esc(o)+'</span><span class="ospk">'+sp(o,true)+'</span></button>';
    });
    h+='<div class="ansbox'+(q.done?' show':'')+'">정답: '+esc(q.say)+' '+sp(q.say)+'</div></div>';
  });

}
function pickSyn(i,j){var q=synState.qs[i];if(q.done)return;q.picked=j;q.done=true;render();}

      '<div class="qsent">'+esc(it.ko)+' '+sp(it.term,true)+'<div class="qhint">첫 글자 <b>'+esc(it.term[0])+'</b> · '+it.term.length+'글자</div></div>'+
      '<input class="spell-in'+(st?' right':'')+'" id="sp'+i+'" value="'+(st?esc(it.term):'')+'" '+(st?'disabled':'')+' autocomplete="off" autocapitalize="none" spellcheck="false" placeholder="영어 입력" onkeydown="if(event.key===\'Enter\')checkSpell('+i+')">'+
      '<div class="btns"><button class="b b4" onclick="checkSpell('+i+')">확인</button><button class="b b2" onclick="revealSpell('+i+')">정답 보기</button></div>'+
      '<div class="ansbox" id="spa'+i+'"></div></div>';
  });
  return h;
}
function checkSpell(i){
  var it=spellState.pool[i], inp=document.getElementById('sp'+i), box=document.getElementById('spa'+i);
  if(norm(inp.value)===norm(it.term)){
    spellState.ok[i]=true; render();
  }else{
    inp.classList.add('bad');
    box.classList.add('show'); box.innerHTML='❌ 다시 시도! 첫 글자 <b>'+esc(it.term[0])+'</b>, '+it.term.length+'글자';
    setTimeout(function(){inp.classList.remove('bad');},500);
  }
}
function revealSpell(i){
  var it=spellState.pool[i], box=document.getElementById('spa'+i), inp=document.getElementById('sp'+i);
  inp.value=it.term; box.classList.add('show');
  box.innerHTML='정답: '+esc(it.term)+' '+sp(it.term)+'<br><span style="font-style:italic">'+esc(it.ex)+'</span>';
}

/* ===== ⑦ COMPREHENSIVE EXAM ===== */
var EXAM_N=25, PASS=0.8;
function makeExam(){
  var qs=[];
  shuffle(ITEMS).slice(0,8).forEach(function(it){
    var o=buildOpts(it.ko, ITEMS.filter(function(x){return x.ko!==it.ko;}).map(function(x){return x.ko;}));
    qs.push({kind:'영어→뜻',prompt:'<b>'+esc(it.term)+'</b> 의 뜻은?',say:it.term,opts:o.opts,ans:o.ans,ospk:false});
  });
  shuffle(ITEMS).slice(0,7).forEach(function(it){
    var o=buildOpts(it.term, ITEMS.filter(function(x){return x.term!==it.term;}).map(function(x){return x.term;}));
    qs.push({kind:'영영풀이',prompt:esc(it.def),say:null,opts:o.opts,ans:o.ans,ospk:true});
  });
  shuffle(ITEMS.filter(function(x){return x.syn&&x.ant;})).slice(0,5).forEach(function(it,idx){
    if(idx%2===0){
      var s=it.syn.split(',')[0].trim();
      var o=buildOpts(s, ITEMS.filter(function(x){return x.term!==it.term;}).map(function(x){return x.term;}).filter(function(t){return t!==s;}));
      qs.push({kind:'유의어',prompt:'<b>'+esc(it.term)+'</b> 의 유의어는?',say:it.term,opts:o.opts,ans:o.ans,ospk:true});
    }else{
      var a=it.ant.split(',')[0].trim();
      var o2=buildOpts(a, ITEMS.filter(function(x){return x.term!==it.term&&x.syn;}).map(function(x){return x.syn.split(',')[0].trim();}).filter(function(t){return t!==a;}));
      qs.push({kind:'반의어',prompt:'<b>'+esc(it.term)+'</b> 의 반의어는?',say:it.term,opts:o2.opts,ans:o2.ans,ospk:true});
    }
  });
  shuffle(ITEMS).slice(0,5).forEach(function(it){
    var o=buildOpts(it.term, ITEMS.filter(function(x){return x.term!==it.term;}).map(function(x){return x.term;}));
    qs.push({kind:'뜻→영어',prompt:'<b>'+esc(it.ko)+'</b> 에 해당하는 영어는?',say:null,opts:o.opts,ans:o.ans,ospk:true});
  });
  return shuffle(qs).slice(0,EXAM_N);
}

      '<div class="btns">'+
        (wrong.length?'<button class="b b4" onclick="retryWrong()">🔁 틀린 '+wrong.length+'문제 다시</button>':'')+

      '</div></div>';
    window._examWrong=wrong;
  }
  return h;
}
function startExam(){examQs=makeExam();examPick=examQs.map(function(){return -1;});examGraded=false;examActive=examQs.map(function(_,i){return i;});render();window.scrollTo({top:0,behavior:'smooth'});}
function pickExam(qi,j){if(examGraded)return;examPick[qi]=j;render();}
function gradeExam(){
  var un=examActive.filter(function(i){return examPick[i]<0;});
  if(un.length){alert('아직 안 푼 문제가 '+un.length+'개 있어요. 모두 풀고 채점하세요.');return;}
  examGraded=true;render();
}
function retryWrong(){
  var wrong=window._examWrong||[];
  wrong.forEach(function(i){examPick[i]=-1;});
  examActive=wrong; examGraded=false; render(); window.scrollTo({top:0,behavior:'smooth'});
}
function speakWrong(){
  if(!SS){alert('음성 미지원 브라우저입니다.');return;}
  unlockTTS();
  var wrong=window._examWrong||[];
  var words=wrong.map(function(i){return examQs[i].opts[examQs[i].ans];}).filter(function(w){return /[a-zA-Z]/.test(w);});
  var k=0, v=pickVoice();
  function next(){if(k>=words.length)return;var u=new SpeechSynthesisUtterance(words[k++]);u.lang='en-US';u.rate=.85;if(v)u.voice=v;u.onend=u.onerror=next;SS.speak(u);}
  SS.cancel();try{SS.resume();}catch(e){}next();
}

/* ===== INIT ===== */
buildSteps();
render();
</script>
