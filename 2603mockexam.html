<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>3월 고1 모의고사 변형 — 유형 공식 훈련</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#F4F5F7;--paper:#FFFFFF;--ink:#1E2330;--muted:#636A77;--line:#D8DCE3;--mark:#FFE07A;--ok:#17805A;--okbg:#E5F4EC;--bad:#C93C4A;--badbg:#FBE9EB;--hint:#9A6B00;--hintbg:#FFF5D6;
--t-어법:#2F7D46;--t-순서:#2B68C4;--t-삽입:#7550C4;--t-빈칸:#C23E5A;--t-요약:#B2700C;--t-함축:#0D878A}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Noto Sans KR',system-ui,sans-serif;font-size:17px;line-height:1.65;padding-bottom:env(safe-area-inset-bottom)}
.wrap{max-width:800px;margin:0 auto;padding:16px 16px 80px}
header.top{padding:18px 0 14px;border-bottom:2px solid var(--ink);margin-bottom:14px}
header.top h1{margin:0;font-size:24px;font-weight:900;letter-spacing:-.5px}
header.top p{margin:4px 0 0;color:var(--muted);font-size:15px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 6px}
.chip{border:2px solid var(--line);background:var(--paper);border-radius:999px;padding:6px 14px;font:inherit;font-size:15px;font-weight:700;color:var(--ink);cursor:pointer;display:flex;gap:6px;align-items:center;min-height:42px}
.chip .dot{width:9px;height:9px;border-radius:50%;background:var(--c)}
.chip.on{border-color:var(--c);box-shadow:inset 0 -3px 0 var(--c)}
.chip.done::after{content:'✓';color:var(--ok);font-weight:900}
.chip:disabled{opacity:.4;cursor:not-allowed}
.chip.res{--c:var(--ink)}
.progress{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin:6px 0 18px}
.progress i{display:block;height:100%;background:var(--ink);transition:width .4s}
.qhead{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin:6px 0 10px}
.qhead h2{margin:0;font-size:22px;font-weight:900}
.badge{display:inline-block;border-radius:6px;padding:2px 10px;font-size:14px;font-weight:700;color:#fff;background:var(--c)}
.src{color:var(--muted);font-size:14px}
.formula{border-left:5px solid var(--c);padding:6px 0 6px 14px;margin:0 0 16px}
.formula div{font-weight:700;font-size:16px}
.formula div::before{content:'공식 ';color:var(--c);font-weight:900}
.paper{background:var(--paper);border:1px solid var(--line);border-radius:4px;padding:20px 22px;margin-bottom:18px}
.blk{margin:0 0 12px;font-size:18px;line-height:2.05}
.blk:last-child{margin-bottom:0}
.blk .lab{font-weight:900;margin-right:6px}
.blk.given{border:1.5px solid var(--ink);padding:8px 14px;border-radius:3px}
.blk.given .lab{display:block;font-size:14px;color:var(--muted);font-weight:700;line-height:1.4;margin-bottom:2px}
.blk u{text-decoration-thickness:2px;text-underline-offset:4px}
.trbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:0 0 10px}
.trbar .btn{margin:0}
.trbar span{color:var(--muted);font-size:14.5px}
.blk2{margin:0 0 14px}
.blk2.given{border:1.5px solid var(--ink);padding:6px 14px;border-radius:3px}
.blk2 .lab{display:block;font-weight:900;margin:0 0 2px}
.pair{padding:10px 0;border-top:1px dashed var(--line)}
.blk2 .pair:first-of-type{border-top:0}
.en{font-size:18px;line-height:1.9}
.sn{display:inline-block;min-width:22px;font-size:13px;font-weight:900;color:var(--muted);vertical-align:2px}
.kr{font-size:16px;line-height:1.8;color:#3A4150;padding-left:22px}
.nt{font-size:14.5px;line-height:1.7;color:var(--c);font-weight:700;padding-left:22px;margin-top:2px}
.cue.on{text-decoration:underline wavy var(--c);text-decoration-thickness:2px;text-underline-offset:5px;font-weight:700;color:var(--c)}
.sen.scand{cursor:pointer;border-radius:3px}
.sen.scand:hover{background:#EDF0F4}
.sen.spick{background:#FFF0B3}
.sen[data-pick]::before,.sen[data-ord]::before{content:attr(data-pick);display:inline-block;font-size:12px;font-weight:900;line-height:1;padding:3px 6px;border-radius:9px;background:var(--ink);color:#fff;margin-right:4px;vertical-align:2px}
.sen[data-ord]::before{content:attr(data-ord);background:var(--c)}
.sen.sshow{outline:2px dashed var(--bad);outline-offset:2px}
.seqv{margin-top:6px;font-weight:700}
.tk{border-radius:3px;transition:background-color .25s}
.tk.cand{cursor:pointer;background-image:linear-gradient(transparent 88%,#B9BFCA 88%);padding:0 1px}
.tk.cand:hover{background-color:#F0F2F5}
.tk.sel{background-color:var(--mark)!important;background-image:none}
.tk.show{outline:2px dashed var(--bad);outline-offset:2px}
.tk.found{background-image:linear-gradient(transparent 82%,var(--c) 82%);font-weight:700}
.tk.wrong{background-color:var(--badbg)!important;text-decoration:line-through;text-decoration-color:var(--bad)}
.tk:focus-visible,.opt:focus-visible,.chip:focus-visible,.btn:focus-visible,.rchip:focus-visible{outline:3px solid #2B68C4;outline-offset:2px}
.step{background:var(--paper);border:1px solid var(--line);border-radius:4px;margin-bottom:12px;padding:16px 18px}
.step.lock{background:transparent;border-style:dashed;color:var(--muted);padding:12px 18px}
.step.ok{border-color:var(--ok)}
.shd{display:flex;gap:10px;align-items:flex-start}
.num{flex:none;width:30px;height:30px;border-radius:50%;border:2px solid var(--ink);display:grid;place-items:center;font-weight:900;font-size:15px}
.step.ok .num{background:var(--ok);border-color:var(--ok);color:#fff}
.step.lock .num{border-color:var(--line);color:var(--muted)}
.sq{font-weight:700;font-size:17px;padding-top:2px}
.sbody{margin:12px 0 0 40px}
.opts{display:grid;gap:8px}
.opt{text-align:left;font:inherit;font-size:16px;border:2px solid var(--line);background:#fff;border-radius:6px;padding:10px 14px;cursor:pointer;color:var(--ink);min-height:48px}
.opt:hover{border-color:#9AA2AF}
.opt.pick{border-color:var(--ok);background:var(--okbg);font-weight:700}
.opt.no{border-color:var(--bad);background:var(--badbg)}
.opt.show{border-style:dashed;border-color:var(--bad)}
.opt:disabled{cursor:default}
.mrow{border-top:1px solid var(--line);padding:10px 0}
.mrow:first-child{border-top:0;padding-top:0}
.mlab{font-weight:700;margin-bottom:6px}
.mlab.x::after{content:' — 다시';color:var(--bad);font-weight:700}
.rchips{display:flex;flex-wrap:wrap;gap:6px}
.rchip{font:inherit;font-size:15px;border:2px solid var(--line);background:#fff;border-radius:999px;padding:6px 12px;cursor:pointer;color:var(--ink);min-height:40px}
.rchip.sel{border-color:var(--ink);background:var(--ink);color:#fff}
.rchip.show{border-style:dashed;border-color:var(--bad)}
.rchip:disabled{cursor:default}
.btn{font:inherit;font-weight:700;font-size:16px;border:2px solid var(--ink);background:var(--ink);color:#fff;border-radius:6px;padding:10px 20px;cursor:pointer;margin-top:12px;min-height:46px}
.btn.ghost{background:#fff;color:var(--ink)}
.msg{margin-top:10px;padding:10px 12px;border-radius:6px;font-size:15.5px}
.msg.hint{background:var(--hintbg);color:#5E4300}
.msg.ok{background:var(--okbg);color:#0E5A3E}
.msg.rv{background:var(--badbg);color:#7D1F2A}
.pre{border-left:3px solid var(--c);padding:6px 0 6px 12px;margin:0 0 12px;font-size:15.5px;line-height:1.75}
.pre div:first-child{font-weight:700}
.tapnote{font-size:14.5px;color:var(--muted);margin:2px 0 0}
.after{background:var(--paper);border:2px solid var(--ok);border-radius:4px;padding:18px 20px;margin:6px 0 16px}
.after h3{margin:0 0 10px;font-size:19px}
.after h4{margin:16px 0 6px;font-size:16px}
.olist div{padding:6px 0;border-top:1px solid var(--line);font-size:15.5px}
.olist div:first-child{border-top:0}
.olist b{display:inline-block;min-width:0;margin-right:6px}
.ud{border-top:1px solid var(--line);padding:12px 0 4px}
.udh{display:flex;gap:10px;align-items:baseline;margin-bottom:6px;font-size:16.5px}
.udh .uo{color:var(--ok);font-weight:700}.udh .ux{color:var(--bad);font-weight:700}
.ud dl{display:grid;grid-template-columns:7.5em 1fr;gap:4px 12px;margin:0;font-size:15.5px;line-height:1.75}
.ud dt{font-weight:700;color:var(--c)}.ud dd{margin:0}
@media (max-width:560px){.ud dl{grid-template-columns:1fr}.ud dt{margin-top:6px}}
table.lk{width:100%;border-collapse:collapse;font-size:15px}
table.lk td{border:1px solid var(--line);padding:7px 9px;vertical-align:top}
table.lk td:first-child{width:50%}
details{margin-top:14px;border-top:1px solid var(--line);padding-top:10px}
summary{cursor:pointer;font-weight:700}
details p{font-size:15.5px;line-height:1.9}
.next{display:flex;justify-content:flex-end}
.sum{background:var(--paper);border:2px solid var(--ink);border-radius:4px;padding:20px}
.sum h2{margin:0 0 6px;font-size:22px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0}
.stats div{border:1px solid var(--line);border-radius:4px;padding:10px;text-align:center}
.stats b{display:block;font-size:26px;font-weight:900}
.code{font-size:26px;font-weight:900;letter-spacing:2px;border:2px dashed var(--ink);padding:10px 14px;text-align:center;margin:12px 0}
.qline{display:flex;justify-content:space-between;align-items:center;gap:8px;border-top:1px solid var(--line);padding:8px 0;font-size:15.5px;flex-wrap:wrap}
.qline .btn{margin:0;padding:6px 12px;min-height:38px;font-size:14.5px}
.foot{margin-top:24px;color:var(--muted);font-size:13.5px;text-align:center}
.flash{animation:fl .5s}
@keyframes fl{0%{transform:scale(1)}40%{transform:scale(1.02)}100%{transform:scale(1)}}
@media (max-width:560px){body{font-size:16px}.paper{padding:16px}.blk{font-size:17px}.sbody{margin-left:0}.step{padding:14px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<div class="wrap">
<header class="top"><h1>3월 고1 모의고사 변형 — 유형 공식 훈련</h1><p>단서를 먼저 찾고, 공식대로 정답을 고른다. 단계를 다 맞혀야 다음 단계가 열린다.</p></header>
<nav class="chips" id="chips" aria-label="문항"></nav>
<div class="progress"><i id="bar"></i></div>
<main id="main"></main>
<div class="foot">강동미나 뮤엠영어 · 진행 상황은 이 기기에 저장된다</div>
</div>
<script>
const BL={
q29:[{s:[
[`A mental map is a picture in our heads of how a place is arranged.`,`마음속 지도는 어떤 장소가 어떻게 배치되어 있는지에 대한 머릿속 그림이다.`,`how + 주어 + 동사 = ~가 어떻게 …하는지`],
[`It does not need to be detailed or even ① __correct__ as long as it helps us find our way.`,`길을 찾는 데 도움이 되기만 하면, 그것은 자세하거나 심지어 정확할 필요도 없다.`,`as long as = ~하는 한 / help O + 동사원형`],
[`{{s|The signs, arrows, and symbols}} that {{y|you}} {{nv|notice}} ② __{{pp|posted}}__ in {{st|a subway station}} ③ __{{gv|guides}}__ {{tr|travelers}} {{tb|to build}} such a map of tunnels and platforms.`,`지하철역에 게시된 것을 여러분이 보는 표지판, 화살표, 기호들은 여행자들이 터널과 승강장에 대한 그런 지도를 만들도록 이끈다.`,`주어 [The signs, arrows, and symbols (that you notice posted ~)] + 동사 / guide O to V`],
[`In reality, the lines on a subway map are rarely straight; they are simplified shapes designed to make the system easier to read.`,`실제로 지하철 노선도의 선은 거의 직선이 아니다. 그것들은 체계를 읽기 쉽게 만들도록 고안된 단순화된 모양이다.`,`rarely = 거의 ~않다 / make O easier to V`],
[`Sometimes, however, this simplicity can mislead ④ __those__ who depend on it.`,`그러나 때때로 이 단순함은 그것에 의존하는 사람들을 잘못 이끌 수 있다.`,`those who ~ = ~하는 사람들`],
[`Two stations that look far apart on the map may actually be a short walk from each other, because the map shows connections, not real distances.`,`노선도에서 멀리 떨어져 보이는 두 역이 실제로는 서로 걸어서 금방인 거리일 수도 있는데, 노선도는 실제 거리가 아니라 연결을 보여 주기 때문이다.`,`A, not B = B가 아니라 A`],
[`The mental map offers one neat picture, whereas the real city consists of streets and blocks ⑤ __that__ seldom follow such tidy lines.`,`마음속 지도는 하나의 깔끔한 그림을 제공하는 반면, 실제 도시는 그렇게 깔끔한 선을 거의 따르지 않는 거리와 블록들로 이루어져 있다.`,`whereas = 반면에 / seldom = 거의 ~않다`]]}],
q36:[{l:'주어진 글',g:1,s:[[`The motto “simple is best” once had a clear and modest meaning.`,`"단순한 것이 최고"라는 표어는 한때 분명하고 소박한 의미를 지녔다.`]]},
{l:'(A)',s:[[`{{a1|However}}, it is important to notice that the way of thinking behind {{a2|this motto}} gradually removes certain skills from {{a0|our everyday routines}}.`,`하지만 이 표어 이면의 사고방식이 우리의 일상에서 특정 기술들을 서서히 없앤다는 것을 알아차리는 것이 중요하다.`,`It is important to V (가주어) / 주어 the way (of thinking behind this motto) → removes / remove A from B`],
[`Consider, for instance, the bulky film cameras that people carried decades ago.`,`예를 들어, 수십 년 전 사람들이 들고 다니던 부피 큰 필름 카메라를 생각해 보라.`,`명령문 Consider ~ / for instance = for example`]]},
{l:'(B)',s:[[`Little by little, many of {{b1|their}} dials and switches were judged “unnecessary” and taken away, and with each change {{b2|these machines}} turned into the cameras built into {{b0|our phones}}.`,`조금씩 그것들의 많은 다이얼과 스위치가 "불필요하다"고 판단되어 없어졌고, 변화할 때마다 이 기계들은 우리 휴대 전화에 내장된 카메라로 바뀌었다.`,`were judged ~ and (were) taken away 수동 병렬 / turn into = ~로 바뀌다 / built into = ~에 내장된`],
[`The devices became lighter, and the skills of adjusting light and focus disappeared behind a single button.`,`기기는 더 가벼워졌고, 빛과 초점을 조절하는 기술은 버튼 하나 뒤로 사라졌다.`]]},
{l:'(C)',s:[[`Made popular by {{c0|designers}} in the early twentieth century, {{c1|it}} suggested that plain objects are more useful and more attractive than complicated ones.`,`20세기 초 디자이너들이 유행시킨 이 말은 평범한 물건이 복잡한 것보다 더 유용하고 더 매력적이라는 것을 암시했다.`,`분사구문 Made popular ~, it = It was made popular ~ / more A and more B than ~ / ones = objects`],
[`Today the motto appears everywhere — perhaps in too many places.`,`오늘날 이 표어는 어디에나, 어쩌면 너무 많은 곳에 등장한다.`]]}],
q37:[{l:'주어진 글',g:1,s:[[`To understand our closets today, we first need to look at the short but little-known history of the fast-fashion industry.`,`오늘날 우리의 옷장을 이해하려면, 먼저 패스트 패션 산업의 짧지만 잘 알려지지 않은 역사를 살펴볼 필요가 있다.`,`To V ~, = ~하기 위해 (목적)`],
[`Before it appeared, people bought fewer clothes and repaired them, producing far less textile waste than we do now.`,`그것이 등장하기 전, 사람들은 옷을 더 적게 사고 수선해 입었으며, 지금 우리보다 훨씬 적은 섬유 쓰레기를 만들었다.`,`far less ~ than = ~보다 훨씬 적은 (far = 비교급 강조) / do = produce textile waste (대동사)`]]},
{l:'(A)',s:[[`{{a1|However}}, fashion companies quickly responded to {{a2|these worries}} by advertising clothing-recycling bins as the answer to the waste problem.`,`그러나 패션 회사들은 의류 수거함을 쓰레기 문제의 해답으로 광고함으로써 이러한 우려에 재빨리 대응했다.`,`respond to = ~에 대응하다 / by V-ing = ~함으로써 / advertise A as B`],
[`They spread the message that waste was the responsibility of {{a0|shoppers}}, not of the brands producing endless new collections.`,`그들은 쓰레기가 끝없이 새 컬렉션을 내놓는 브랜드가 아니라 쇼핑객의 책임이라는 메시지를 퍼뜨렸다.`,`the message that ~ (동격 that) / A, not B`]]},
{l:'(B)',s:[[`{{b1|However}}, once cheap production methods spread and global shipping became fast, new clothes flooded every shopping street.`,`그러나 값싼 생산 방식이 퍼지고 세계 운송이 빨라지자, 새 옷이 모든 쇼핑 거리에 넘쳐났다.`,`once S V = 일단 ~하자`],
[`The industry came to symbolize the promise of always having something new and affordable to wear.`,`그 산업은 언제나 새롭고 저렴한 입을 거리를 갖는다는 약속을 상징하게 되었다.`,`come to V = ~하게 되다 / something + 형용사 + to V`]]},
{l:'(C)',s:[[`{{c1|This promise}} had a hidden cost.`,`이 약속에는 숨겨진 대가가 있었다.`],
[`Over time, people began to notice mountains of discarded clothing, and the first voices of today’s slow-fashion movement were heard.`,`시간이 흐르며 사람들은 버려진 옷 더미를 알아차리기 시작했고, 오늘날 슬로 패션 운동의 첫 목소리가 들려왔다.`,`over time = 시간이 흐르며 / mountains of = 산더미 같은`]]}],
q38:[{l:'주어진 문장',g:1,s:[[`Thus, the change from one art style to the next is not a climb from a less to a more skillful way of painting.`,`따라서 한 미술 양식에서 다음 양식으로의 변화는 덜 숙련된 그림 방식에서 더 숙련된 방식으로 올라가는 것이 아니다.`,`from a less to a more skillful way = from a less skillful way to a more skillful way (skillful way를 한 번만 씀) / from one ~ to the next = 하나에서 다음으로`]]},
{s:[[`Art historians point out that every painter works within a style, a shared set of beliefs about what a picture should show and how it should be made. ( ① )`,`미술사학자들은 모든 화가가 하나의 양식, 즉 그림이 무엇을 보여 주어야 하고 어떻게 만들어져야 하는지에 대한 공유된 믿음의 집합 안에서 작업한다고 지적한다.`,`point out = 지적하다 / a style, a shared set ~ (콤마 = 즉, 동격) / what ~ and how ~ 명사절 병렬`],
[`Even the most careful brushstroke makes sense only within that style. ( ② )`,`가장 신중한 붓질조차 그 양식 안에서만 의미가 있다.`,`Even + 최상급 = 가장 ~한 것조차 / make sense = 의미가 통하다 / only within = ~ 안에서만`],
[`{{f|For instance}}, a flat, golden medieval painting may look clumsy to us {{u|unless}} we know that its painters wanted to express spiritual importance, not physical reality. ( ③ )`,`예를 들어, 평평하고 금빛인 중세 그림은 그 화가들이 물리적 현실이 아니라 영적인 중요성을 표현하고자 했다는 것을 우리가 알지 못한다면 서툴러 보일 수 있다.`,`look + 형용사 = ~해 보이다 / unless = if ~ not / A, not B = B가 아니라 A`],
[`{{i|Instead}}, it is a sideways move from one way of seeing the world to another. ( ④ )`,`오히려 그것은 세상을 보는 한 방식에서 다른 방식으로의 옆걸음이다.`,`Instead = Rather (앞에 not A 필요) / from one ~ to another = 하나에서 다른 하나로`],
[`{{t|That is why}} a new style does not simply paint the world better. ( ⑤ )`,`그래서 새 양식은 세상을 그저 더 잘 그리는 것이 아니다.`,`That is why ~ = 그래서 ~이다 / better = well의 비교급 (더 잘)`],
[`It paints a different world.`,`그것은 다른 세상을 그린다.`]]}],
q32:[{s:[[`{{ml|Many learners}} confuse recognition with real understanding, falling into a trap called the “fluency illusion”: rereading notes makes the material feel easy, yet they cannot reproduce it on their own during a test.`,`많은 학습자가 알아보는 것을 진짜 이해로 착각하여 "유창성 착각"이라는 함정에 빠진다. 노트를 다시 읽으면 내용이 쉽게 느껴지지만, 시험 중에 혼자서는 그것을 다시 만들어 내지 못한다.`,`confuse A with B = A를 B로 착각하다 / falling ~ 분사구문 / make O + 동사원형 / on one’s own = 혼자서`],
[`{{fc|This false confidence}}, reinforced by highlighting and rereading, causes students to overrate what they know.`,`형광펜 긋기와 다시 읽기로 강화된 이 잘못된 자신감은 학생들이 자기가 아는 것을 과대평가하게 만든다.`,`주어 This false confidence (, reinforced ~,) → causes / cause O to V`],
[`{{ex|Explaining a topic to someone else}} (even an imaginary listener) {{!bt|breaks this illusion}} because it demands careful thinking, active retrieval, logical ordering, and the discovery of weak spots.`,`주제를 다른 사람에게(상상의 청자에게라도) 설명하는 것은 신중한 사고, 능동적 회상, 논리적 순서 정리, 약점 발견을 요구하기 때문에 이 착각을 깬다.`,`동명사 주어 Explaining ~ → breaks (단수)`],
[`{{us|Useful strategies}} include tutoring a younger student, leading a review session with classmates, or recording a short lesson on your phone.`,`유용한 전략으로는 어린 학생 가르치기, 반 친구들과 복습 시간 이끌기, 휴대 전화로 짧은 수업 녹화하기 등이 있다.`,`include + V-ing, V-ing, or V-ing (병렬)`],
[`In the end, ＿＿＿＿＿＿＿＿ turns shallow recognition into true understanding, uncovering and repairing weak spots and building firm, dependable knowledge.`,`결국 [빈칸]이 얕은 알아봄을 진정한 이해로 바꾸어, 약점을 드러내고 고치며 탄탄하고 믿을 만한 지식을 쌓는다.`,`turn A into B = A를 B로 바꾸다 / uncovering ~ and building ~ (분사구문 병렬)`]]}],
q34:[{s:[[`When we learn from our own group, we pay little attention to who the individual model is.`,`우리 집단에서 배울 때, 우리는 개별 본보기가 누구인지에 거의 주의를 기울이지 않는다.`,`pay attention to = ~에 주의를 기울이다 / little = 거의 ~않는 / who S V (간접의문문)`],
[`Surprisingly, even group members whom we dislike still serve as models.`,`놀랍게도, 우리가 싫어하는 집단 구성원조차 여전히 본보기 역할을 한다.`,`whom (목적격 관계대명사) / serve as = ~의 역할을 하다`],
[`In one study, researchers showed children how to assemble a simple toy tower.`,`한 연구에서 연구자들은 아이들에게 간단한 장난감 탑을 조립하는 법을 보여 주었다.`,`show O how to V = O에게 ~하는 법을 보여 주다`],
[`The children were divided into two teams in the simplest possible way: by the color of their T-shirts.`,`아이들은 가능한 가장 단순한 방법, 즉 티셔츠 색깔로 두 팀으로 나뉘었다.`,`divide A into B / the simplest possible = 가능한 가장 단순한`],
[`The children did not automatically like everyone on their own team; they disliked teammates who acted rudely.`,`아이들은 자기 팀의 모두를 자동으로 좋아하지는 않았다. 그들은 무례하게 행동하는 팀원을 싫어했다.`,`not ~ everyone = 모두 ~인 것은 아니다 (부분부정)`],
[`In fact, they rated {{rt|these rude teammates}} lower than polite children from the other team.`,`실제로 그들은 이 무례한 팀원들을 상대 팀의 예의 바른 아이들보다 낮게 평가했다.`,`rate A lower than B = A를 B보다 낮게 평가하다`],
[`Even so, this dislike did not change their tendency to copy {{ot|their own team’s actions}} more faithfully than the other team’s.`,`그렇다 해도, 이 반감은 상대 팀의 행동보다 자기 팀의 행동을 더 충실히 따라 하는 경향을 바꾸지 못했다.`,`Even so = 그렇다 해도 / the other team’s = the other team’s actions (반복 생략)`],
[`Such copying shows that we are {{!nt|not}} imitating in order {{fw|to find the fastest way to build the tower}}.`,`이러한 모방은 우리가 탑을 쌓는 가장 빠른 방법을 찾기 위해 모방하는 것이 아님을 보여 준다.`,`not ~ in order to V = ~하기 위해서가 아니다`],
[`We want to learn {{rw|the right way}} to do it — {{!ti|that is}}, ＿＿＿＿＿＿＿＿.`,`우리는 그것을 하는 올바른 방법, 즉 [빈칸]을 배우고 싶어 한다.`,`that is = 즉, 다시 말해 (= in other words)`],
[`Even rude teammates can show this perfectly well.`,`무례한 팀원들도 이것은 충분히 잘 보여 줄 수 있다.`]]}],
q40:[{s:[[`Child experts agree that young people need chances to solve problems and recover from small failures by themselves.`,`아동 전문가들은 아이들이 스스로 문제를 해결하고 작은 실패에서 회복할 기회가 필요하다는 데 동의한다.`,`chances to V ~ and (to) V / recover from = ~에서 회복하다 / by themselves = 스스로`],
[`Yet many neighborhoods {{ls|lack sidewalks safe enough for walking to school}}, parks post signs {{bn|banning unaccompanied children}}, and after-school hours are packed with scheduled lessons.`,`하지만 많은 동네에는 학교까지 걸어가기에 충분히 안전한 인도가 없고, 공원은 보호자 없는 아이를 금지하는 표지판을 걸어 두며, 방과 후 시간은 짜인 수업으로 꽉 차 있다.`,`lack = ~이 없다 (타동사, of 없음) / 형용사 + enough for / be packed with = ~로 꽉 차다`],
[`Because children cannot manage these situations alone, parents end up spending extra time and money {{ds|driving and supervising}}.`,`아이들이 이런 상황을 혼자 감당할 수 없기 때문에, 부모들은 결국 차로 데려다주고 감독하는 데 추가 시간과 돈을 쓰게 된다.`,`end up V-ing = 결국 ~하게 되다 / spend 시간·돈 (on) V-ing`],
[`As one family researcher argued, raising more self-reliant kids “is not only a matter of parenting style but of city design.”`,`한 가족 연구자가 주장했듯이, 더 자립적인 아이를 기르는 것은 "양육 방식만의 문제가 아니라 도시 설계의 문제"이다.`,`not only A but (also) B / 동명사 주어 raising ~ → is`],
[`She is not merely calling for financial support such as childcare subsidies.`,`그녀는 보육 보조금 같은 재정 지원만을 요구하는 것이 아니다.`,`call for = 요구하다 / not merely = ~만이 아니다`],
[`She means real changes in streets and parks, along with a change in attitude that {{wc|welcomes children in shared spaces}}.`,`그녀는 거리와 공원의 실제 변화, 그리고 공유 공간에서 아이들을 반기는 태도의 변화를 뜻한다.`,`along with = ~와 함께 / change in = ~의 변화`],
[`Communities should “{{bp|become more patient with kids in public}},” she says, “and build safe places where children, {{wd|watched only from a distance}}, can explore on their own.”`,`공동체는 "공공장소에서 아이들에게 더 인내심을 갖고, 멀리서만 지켜봐도 아이들이 스스로 탐험할 수 있는 안전한 장소를 지어야 한다"고 그녀는 말한다.`,`be patient with = ~에게 참을성 있다 / places where ~ (관계부사) / watched ~ (삽입된 분사)`]]},
{l:'요약문',g:1,s:[[`To raise self-reliant children, communities should provide {{!sa|(A) ＿＿＿＿ surroundings}} in which children are under {{!sb|(B) ＿＿＿＿ adult supervision}}, by changing both physical spaces and public attitudes.`,`자립적인 아이를 기르기 위해, 공동체는 물리적 공간과 대중의 태도를 모두 바꿈으로써 아이들이 (B) ＿＿ 어른의 감독 아래 있을 수 있는 (A) ＿＿ 환경을 제공해야 한다.`,`in which = where / under supervision = 감독 아래 / both A and B`]]}],
q21:[{s:[[`Humanity now holds unmatched power over {{cl|the planet’s climate}}, oceans, and living creatures, and our choices {{bd|travel across borders}} faster than ever.`,`인류는 이제 지구의 기후, 바다, 생물에 대해 비할 데 없는 힘을 가지고 있으며, 우리의 선택은 그 어느 때보다 빠르게 국경을 넘나든다.`,`power over = ~에 대한 힘 / faster than ever = 그 어느 때보다 빠르게`],
[`Each of us lives only a short life, yet we are also part of a long human story that stretches far beyond our own years.`,`우리 각자는 짧은 삶을 살 뿐이지만, 우리 자신의 세월을 훨씬 넘어 이어지는 긴 인류 이야기의 일부이기도 하다.`,`Each of us + 단수 동사 (lives) / far beyond = 훨씬 넘어`],
[`Because today’s decisions will shape the lives of billions who are not yet born, we carry a duty to act as wise ancestors — to think in centuries rather than seasons.`,`오늘의 결정이 아직 태어나지 않은 수십억 명의 삶을 만들어 갈 것이기 때문에, 우리는 현명한 조상으로 행동할, 즉 계절이 아니라 세기 단위로 생각할 의무를 진다.`,`a duty to V = ~할 의무 / A rather than B = B보다는 A`],
[`Some traditional farming communities kept a firm rule: no matter how hungry the winter became, {{sg|the seed grain for next year’s planting was never to be eaten}}.`,`일부 전통 농경 공동체는 엄격한 규칙을 지켰다. 겨울이 아무리 배고파지더라도, 이듬해 파종을 위한 씨앗 곡식은 절대 먹어서는 안 되었다.`,`no matter how + 형용사 + S V = 아무리 ~해도 / be to V = ~해야 한다 (의무)`],
[`In our brief time on Earth, while we {{hv|harvest the fields our grandparents planted}}, we must not __burn the seeds meant for our grandchildren__.`,`지구에서의 짧은 시간 동안, 조부모님이 심은 밭을 수확하는 동안, 우리는 손주들을 위한 씨앗을 태워서는 안 된다.`,`the fields (that) our grandparents planted / meant for = ~을 위해 정해진`]]}]
};

{k:'choice',q:'② posted 대입: 맞는 것은?',pre:['판별 기준 — 지각동사 + 목적어 + 목적격보어','① 지각동사인가: notice (see · hear · watch · notice)','② 목적어 찾기: notice의 목적어 = 관계사 that = 앞의 signs, arrows, and symbols','③ 목적어가 하나(원형 · -ing) / 당하나(p.p.)'],o:['you notice the signs posted in a station','you notice the signs posting in a station'],a:0,h:'표지판이 스스로 무언가를 게시할까요, 누군가에 의해 게시될까요?',w:'✔ 표지판은 \"게시된다\"(당함) → p.p. 확인: 동사는 notice · guides 2개로 이미 꽉 참 → posted는 동사가 아니다. 원 문항 you see displayed(화면에 표시된)와 같은 구조.'},
{k:'choice',q:'④ those 대입: 맞는 것은?',pre:['판별 기준 — 지시대명사 those','① 뒤에서 who 관계사절이 꾸미나: who depend on it','② \"~하는 사람들\" = those who (복수 → depend)','③ 인칭대명사 them은 who의 꾸밈을 받지 못한다'],o:['mislead those who depend on it','mislead them who depend on it','mislead that who depend on it'],a:0,h:'\"~하는 사람들\"을 뜻하는 짝 표현을 떠올려요.',w:'✔ 확인: who depend(복수 동사) → those = 복수 ✓. 시험 포인트: those who ~ / anyone who ~ ✓, them who ~ ✘'},
{k:'choice',q:'⑤ that 대입: 맞는 것은?',pre:['판별 기준 — 주격 관계대명사','① 선행사를 찾는다: streets and blocks','② 뒤 절에서 빠진 성분: (주어 없음) seldom follow ~','③ 주어 빠진 불완전 절 + 사물 선행사 → which / that (콤마·전치사 뒤 아니므로 that 가능)'],o:['streets and blocks that seldom follow','streets and blocks what seldom follow','streets and blocks that seldom follows'],a:0,h:'선행사가 있으면 what은 못 와요. 관계사절 동사는 선행사에 수를 맞춰요.',w:'✔ 뒤 절이 불완전 → 관계대명사. 시험 포인트: 관계사절 동사는 선행사에 수일치 — streets and blocks(복수) → follow ✓ / follows ✘'},
{k:'final',q:'밑줄 친 부분 중, 어법상 틀린 것은?',o:['① correct','② posted','③ guides','④ those','⑤ that'],a:2,h:'대입에서 ✘가 나온 밑줄을 다시 보세요.'}],

rules:[['1. 동사 개수 세기','접속사 · 관계사 수 = 동사 수 − 1. 동사가 없으면 밑줄이 동사 자리, 너무 많으면 하나는 준동사 자리.'],['2. 주어 찾기(괄호 치기)','주어 덩어리의 수식어(관계사절 · 분사 · of 전치사구)를 괄호 → 남은 진짜 주어로 수일치.'],['3. 지워 보기','지워도 문장 완전 → 부사 자리(부사 · 분사구문) / 지우면 깨짐 → 보어 · 목적어 자리(형용사 · 명사).'],['4. 하나 / 당하나','분사 · 수동태: 주어(꾸밈받는 명사)가 동작을 하면 -ing, 당하면 p.p. 타동사 뒤 목적어 있으면 능동.'],['5. 뒤가 완전한가','관계사: 뒤 불완전 → 관계대명사(which · that · what), 뒤 완전 → 관계부사(where · when · why).']],

{u:'① correct',v:'✓ 맞음',ask:'병렬 + be동사 보어 자리 → 형용사',crit:['① 등위접속사 or 앞뒤를 찾는다: detailed or (even) correct','② 병렬 A와 B는 같은 품사여야 한다','③ need to be 뒤 = 보어 자리 → 형용사'],sub:'It does not need to be [detailed] or even [correct] → be detailed / be correct 둘 다 형용사 ✓',ex:['need to be detailed or correct ✓','need to be detailed or correctly ✗ (부사는 보어 불가)','need to be detailed or corrected ✗ (수정된 — 뜻이 깨짐)'],chk:'지워 보기: need to be (correct) 지우면 be 뒤가 비어 깨짐 → 보어 자리 = 형용사',pt:'even이 끼어 있어도 병렬 짝은 detailed. -ed 모양이 아니라 품사를 맞춘다.'},
{u:'② posted',v:'✓ 맞음',ask:'지각동사 notice + 목적어 + 목적격보어 (원형 / -ing / p.p.)',crit:['① 지각동사인가: notice','② 목적어를 찾는다: 관계사 that = the signs, arrows, and symbols (목적어가 앞으로 나감)','③ 목적어가 하나(원형 · -ing) 당하나(p.p.): 표지판이 \"게시된다\" → p.p.'],sub:'you notice [the signs] posted in a subway station → 표지판이 게시됨(당함) ✓',ex:['notice the signs posted in a station ✓','notice the signs posting in a station ✗ (표지판이 게시하는 게 아님)','notice him cross the street ✓ (그가 건넘 = 능동 → 원형)'],chk:'동사 개수: that 1개 → 동사 2개(notice · guides)로 이미 꽉 참 → posted는 동사가 아니라 목적격보어',pt:'원 문항 you see displayed와 같은 구조. 지각·사역동사 + 목적어 + p.p. = 목적어가 당할 때.'},
{u:'③ guides',v:'✘ 틀림 → guide',ask:'수일치 — 진짜 주어 찾기',crit:['① 주어 덩어리에서 수식어를 괄호 친다 (관계사절 · 분사 · 전치사구)','② 남은 진짜 주어가 단수인지 복수인지 본다','③ 동사를 주어에 맞춘다'],sub:'The signs, arrows, and symbols [that you notice posted in a subway station] ③ guides → 주어 = signs, arrows, and symbols (A, B, and C = 복수) → guide',ex:['The signs and symbols [you notice] guide travelers ✓','The signs and symbols [you notice] guides travelers ✗','The sign [you notice] guides travelers ✓ (주어 단수)'],chk:'괄호 치기: that you notice posted in a subway station 괄호 → The signs, arrows, and symbols guide ~',pt:'바로 앞 station(단수)에 끌려 guides를 쓰는 게 함정. 원 문항 helps → help와 같은 포인트 — 이 시험 최다 출제.'},
{u:'④ those',v:'✓ 맞음',ask:'지시대명사 those — those who ~ (~하는 사람들)',crit:['① 뒤에서 who 관계사절이 꾸미나: who depend on it','② \"~하는 사람들\" = those who, 복수 취급','③ 인칭대명사 them · they는 who의 꾸밈을 받지 못한다'],sub:'this simplicity can mislead [those who depend on it] → 그것에 의존하는 사람들 ✓',ex:['mislead those who depend on it ✓','mislead them who depend on it ✗','mislead that who depend on it ✗'],chk:'수 확인: who depend(복수 동사) → those = 복수 ✓',pt:'those who ~ / anyone who ~ ✓, them who ~ ✗ — 짝으로 외우기'},
{u:'⑤ that',v:'✓ 맞음',ask:'주격 관계대명사 that',crit:['① 선행사를 찾는다: streets and blocks','② 뒤 절에서 빠진 성분: seldom follow ~ (주어가 없음)','③ 주어 빠진 불완전 절 + 사물 선행사 → which / that ✓ (콤마 · 전치사 뒤가 아니므로 that 가능)'],sub:'streets and blocks [that seldom follow such tidy lines] → streets and blocks가 follow의 주어 ✓',ex:['streets and blocks that seldom follow ✓','streets and blocks what seldom follow ✗ (선행사 있으면 what 불가)','streets and blocks that seldom follows ✗ (관계사절 동사도 선행사에 수일치)'],chk:'뒤 절: (주어 없음) seldom follow such tidy lines → 불완전 → 관계대명사',pt:'관계사절 동사의 수는 선행사가 정한다 — streets and blocks(복수) → follow'}],
link:[['원 문항 ① accurate (병렬 · 보어)','변형 ① correct — 같은 포인트'],['원 문항 ② helps → help (수일치)','변형 ③ guides → guide — 같은 함정 (긴 수식어 + 바로 앞 단수 명사)'],['원 문항 you see displayed (밑줄 없음)','변형 ② posted — 같은 구조에 밑줄'],['원 문항 ⑤ that (주격 관계대명사)','변형 ⑤ that — 같은 포인트 + 관계사절 수일치']],
note:'원 문항은 that이 생략돼 있고(The files … you see displayed), 변형 문제는 that이 보인다. 구조는 같다: 명사 + (that) 주어 + see/notice + p.p. + 본동사.',
tr:'마음속 지도는 어떤 장소가 어떻게 배치되어 있는지에 대한 머릿속 그림이다. 길을 찾는 데 도움이 되기만 하면, 그것은 자세하거나 심지어 정확할 필요도 없다. 지하철역에 게시된 것을 여러분이 보는 표지판, 화살표, 기호들은 여행자들이 터널과 승강장에 대한 그런 지도를 만들도록 이끈다. 실제로 지하철 노선도의 선은 거의 직선이 아니다. 그것들은 체계를 읽기 쉽게 만들도록 고안된 단순화된 모양이다. 그러나 때때로 이 단순함은 그것에 의존하는 사람들을 잘못 이끌 수 있다. 노선도에서 멀리 떨어져 보이는 두 역이 실제로는 서로 걸어서 금방인 거리일 수도 있는데, 노선도는 실제 거리가 아니라 연결을 보여 주기 때문이다. 마음속 지도는 하나의 깔끔한 그림을 제공하는 반면, 실제 도시는 그렇게 깔끔한 선을 거의 따르지 않는 거리와 블록들로 이루어져 있다.'}},

{id:'q36',src:'36',type:'순서',title:'글의 순서 — 지시어 추적',
formula:['각 단락 앞부분의 지시어·연결사부터 찾는다 (p.p.·V-ing로 시작하면 콤마 뒤 주어 확인)','강한 고리(대상이 하나뿐 — their, these + 명사)부터 덩어리로 묶는다','약한 고리(it, this motto)는 마지막에 남은 자리에 끼우고, 연결사(However) 방향으로 확인한다'],
blocks:BL.q36,
steps:[
{k:'choice',q:'순서 문제에서 가장 먼저 찾을 것은?',o:['각 단락 앞부분의 지시어·연결사','각 단락에서 가장 어려운 단어'],a:0,h:'단락끼리 이어 주는 "고리"가 무엇일까요?',w:'it, this, their, these, However 같은 말이 단락 사이의 고리다.'},
{k:'order',any:1,q:'순서 문제는 주어진 글 + 각 단락의 첫 문장부터 읽는다. 그 4문장을 탭하세요.',pre:['단락의 첫 문장에 고리(지시어·연결사)가 몰려 있다','단락 중간은 고리가 가리키는 대상을 확인할 때만 들어간다','(C)처럼 분사구문으로 시작하면 콤마 뒤까지가 첫 문장의 핵심'],seq:[1,2,4,6],h:'주어진 글 1문장, 그리고 (A)(B)(C)의 맨 첫 문장이에요.',w:'4문장만 먼저 읽고 고리를 찾는다. their가 가리키는 대상을 찾을 때만 (A)의 끝 문장으로 간다.'},
{k:'tap',q:'(A)(B)(C)에서 지시어·연결사를 모두 탭하세요. (5개)',c:['a1','a2','a0','b1','b2','b0','c0','c1'],a:['a1','a2','b1','b2','c1'],h:'it / this / their / these + 명사, 그리고 However. (C)는 Made(p.p.)로 시작하는 분사구문이라 지시어가 콤마 뒤에 숨어 있어요. "our"는 우리 자신이라 고리가 아니에요.',w:'(A) However, this motto  (B) their, these machines  (C) it — Made popular by ~, it … = It was made popular by ~, and it … (분사구문의 생략된 주어 = 콤마 뒤 it)'},
{k:'match',q:'고리의 세기를 나누세요.',pre:['판별법: 그 말이 가리킬 수 있는 후보가 지문에 몇 개인지 센다','후보가 딱 하나 → 강한 고리 (그 단락 바로 뒤에 붙어야 함) / 여러 개 → 약한 고리','① 주제어(motto)를 가리키면 약하다 — 주제어는 거의 모든 단락에 나온다','② 예시(cameras)를 가리키면 강하다 — 예시는 한 번만 나온다','③ it·this 단독은 약하고, their dials·these machines처럼 명사가 붙으면 강하다','However 같은 연결사는 방향만 알려 준다 → 마지막 확인용'],rows:[['(B) their dials',['강한 고리','약한 고리'],0],['(B) these machines',['강한 고리','약한 고리'],0],['(A) this motto',['강한 고리','약한 고리'],1],['(C) it',['강한 고리','약한 고리'],1]],h:'후보를 세어 보세요. motto는 주어진 글에도 (A)에도 (C)에도 나와요(주제어). 다이얼이 달린 기계는 몇 군데 나오나요(예시)?',w:'정리: this motto와 it은 둘 다 주어진 글의 motto를 가리킬 수 있어서 자리가 안 정해진다(약한 고리). their dials / these machines는 다이얼 달린 기계를 가리켜야 해서 대상이 딱 하나다(강한 고리).'},
{k:'choice',q:'강한 고리 their dials가 가리킬 수 있는 것은?',o:['(A) 마지막의 the bulky film cameras','(C)의 designers','주어진 글의 the motto'],a:0,h:'다이얼(dials)과 스위치가 달린 복수의 물건이에요.',w:'다이얼이 달린 복수의 물건 = film cameras. 지문 전체에서 이것 하나뿐.'},
{k:'choice',q:'그러면 반드시 붙어 있어야 하는 덩어리는?',o:['(A) 바로 뒤에 (B) → (A)(B) 덩어리','(B) 바로 뒤에 (A) → (B)(A) 덩어리','(C) 바로 뒤에 (B) → (C)(B) 덩어리'],a:0,h:'film cameras가 먼저 나와야 their가 그걸 가리킬 수 있어요.',w:'(A)가 카메라를 꺼내고 → 바로 (B)가 their dials로 받는다. 이 둘 사이에는 아무것도 끼어들 수 없다.'},
{k:'choice',q:'남은 (C)는 덩어리의 앞과 뒤 중 어디에 올까?',o:['주어진 글 → (C) → (A)(B)','주어진 글 → (A)(B) → (C)'],a:0,h:'(B)는 "a single button"으로 끝나요. 그 바로 뒤에 (C)의 it이 오면 it은 무엇이 될까요?',w:'(C)가 뒤로 가면 it = 버튼이 되어 "디자이너들이 유행시킨 버튼이 단순함을 암시했다"가 된다 ✘. 앞으로 와야 it = 주어진 글의 motto ✔'},
{k:'choice',q:'However로 최종 확인 — (A)의 However 바로 앞에 와야 할 내용은?',o:['단순함을 칭찬하는 말 — (C)','중립적인 설명 — 주어진 글'],a:0,h:'However는 앞 내용과 "반대 방향"이에요. 반박할 대상이 있어야 해요.',w:'(C) 단순한 게 더 유용하고 매력적이다 → (A) 하지만 그 생각이 기술을 없앤다. 방향이 정확히 뒤집힌다.'},
{k:'final',q:'주어진 글 다음에 이어질 순서로 가장 적절한 것은?',o:ORD,a:3,h:'주어진 글 → (C) → (A)(B) 덩어리'}],

note:'고리 세기 판별: 주제어를 가리키면 약하고, 예시를 가리키면 강하다. 명사가 붙어 있으면 더 강하다. 풀이 순서: ① 고리 찾기 → ② 강한 고리 their dials ↔ film cameras로 (A)(B) 고정 → ③ (C)를 덩어리 앞/뒤에 넣어 보기 → ④ However 방향 확인. 원 문항 36번과 같은 뼈대: 표어 → 뜻 → 하지만 습관을 없앤다 + 예시 → 예시의 변화. 분사구문 시작도 원 문항과 같다 — 원 문항 (B) First mentioned in Robert Browning’s poem, it suggests ~ / 변형 (C) Made popular by designers ~, it suggested ~. 두 문장 모두 콤마 뒤 it이 지시어다. Made는 "만들었다"(과거 동사)가 아니라 "만들어진"(과거분사)이고, be made popular = 유명해지다(make + O + 형용사의 수동).',
tr:'[주어진 글] "단순한 것이 최고"라는 표어는 한때 분명하고 소박한 의미를 지녔다. (C) 20세기 초 디자이너들이 유행시킨 이 말은 평범한 물건이 복잡한 것보다 더 유용하고 더 매력적이라는 것을 암시했다. 오늘날 이 표어는 어디에나, 어쩌면 너무 많은 곳에 등장한다. (A) 하지만 이 표어 이면의 사고방식이 우리의 일상에서 특정 기술들을 서서히 없앤다는 것을 알아차리는 것이 중요하다. 예를 들어, 수십 년 전 사람들이 들고 다니던 부피 큰 필름 카메라를 생각해 보라. (B) 조금씩 그것들의 많은 다이얼과 스위치가 "불필요하다"고 판단되어 없어졌고, 변화할 때마다 이 기계들은 우리 휴대 전화에 내장된 카메라로 바뀌었다. 기기는 더 가벼워졌고, 빛과 초점을 조절하는 기술은 버튼 하나 뒤로 사라졌다.'}},

note:'흐름 = 과거(좋았다) → 변화 → 문제(대가) → 업계의 반응. 원 문항 37번과 같은 뼈대.',
tr:'[주어진 글] 오늘날 우리의 옷장을 이해하려면, 먼저 패스트 패션 산업의 짧지만 잘 알려지지 않은 역사를 살펴볼 필요가 있다. 그것이 등장하기 전, 사람들은 옷을 더 적게 사고 수선해 입었으며, 지금 우리보다 훨씬 적은 섬유 쓰레기를 만들었다. (B) 그러나 값싼 생산 방식이 퍼지고 세계 운송이 빨라지자, 새 옷이 모든 쇼핑 거리에 넘쳐났다. 그 산업은 언제나 새롭고 저렴한 입을 거리를 갖는다는 약속을 상징하게 되었다. (C) 이 약속에는 숨겨진 대가가 있었다. 시간이 흐르며 사람들은 버려진 옷 더미를 알아차리기 시작했고, 오늘날 슬로 패션 운동의 첫 목소리가 들려왔다. (A) 그러나 패션 회사들은 의류 수거함을 쓰레기 문제의 해답으로 광고하며 이러한 우려에 재빨리 대응했다. 그들은 쓰레기가 끝없이 새 컬렉션을 내놓는 브랜드가 아니라 쇼핑객의 책임이라는 메시지를 퍼뜨렸다.'}},

tr:'미술사학자들은 모든 화가가 하나의 양식, 즉 그림이 무엇을 보여 주어야 하고 어떻게 만들어져야 하는지에 대한 공유된 믿음의 집합 안에서 작업한다고 지적한다. 가장 신중한 붓질조차 그 양식 안에서만 의미가 있다. 예를 들어, 평평하고 금빛인 중세 그림은 그 화가들이 물리적 현실이 아니라 영적인 중요성을 표현하고자 했다는 것을 우리가 알지 못한다면 서툴러 보일 수 있다. [따라서 한 미술 양식에서 다음 양식으로의 변화는 덜 숙련된 그림 방식에서 더 숙련된 방식으로 올라가는 것이 아니다.] 오히려 그것은 세상을 보는 한 방식에서 다른 방식으로의 옆걸음이다. 그래서 새 양식은 세상을 그저 더 잘 그리는 것이 아니다. 그것은 다른 세상을 그린다.'}},

tr:'많은 학습자가 알아보는 것을 진짜 이해로 착각하여 "유창성 착각"이라는 함정에 빠진다. 노트를 다시 읽으면 내용이 쉽게 느껴지지만, 시험 중에 혼자서는 그것을 다시 만들어 내지 못한다. 형광펜 긋기와 다시 읽기로 강화된 이 잘못된 자신감은 학생들이 자기가 아는 것을 과대평가하게 만든다. 주제를 다른 사람에게(상상의 청자에게라도) 설명하는 것은 신중한 사고, 능동적 회상, 논리적 순서 정리, 약점 발견을 요구하기 때문에 이 착각을 깬다. 유용한 전략으로는 어린 학생 가르치기, 반 친구들과 복습 시간 이끌기, 휴대 전화로 짧은 수업 녹화하기 등이 있다. 결국 [가르치는 사람의 역할을 맡는 것]이 얕은 알아봄을 진정한 이해로 바꾸어, 약점을 드러내고 고치며 탄탄하고 믿을 만한 지식을 쌓는다.'}},

{k:'order',cue:['nt','ti'],q:'빈칸 문제 읽는 순서대로 탭하세요: ① 빈칸 문장 → ② 바로 앞 문장 → ③ 첫 문장 → ④ 마지막 문장',pre:['10문장 중 4문장만 정확히 읽는다','빈칸 문장: that is가 있으면 빈칸 = 앞 표현의 재진술','바로 앞 문장: not으로 부정된 내용 = 오답 후보','첫 문장(주제)과 마지막 문장(확인)으로 정답 방향을 확정','중간 실험 설명(2~7번째)은 훑기만'],seq:[9,8,1,10],h:'빈칸 문장은 9번째, 그 앞 not 문장, 맨 첫 문장, 맨 마지막 문장이에요.',w:'실험 내용은 티셔츠 색으로 팀 → 무례한 팀원 싫어함 → 그래도 자기 팀을 따라 함, 이 정도만 잡으면 된다.'},
{k:'tap',cue:['nt'],q:'물결 밑줄 친 not이 부정하는 내용을 탭하세요. not 바로 뒤가 아니라, 무엇을 하기 위해서가 아닌지 찾아요.',c:['rt','ot','fw','rw'],a:['fw'],h:'we are not imitating in order to ~ = ~하기 위해 모방하는 게 아니다. not이 부정하는 건 imitating 자체가 아니라 in order to 뒤의 목적이에요.',w:'가장 빠른 방법을 찾기 위해서가 아니다 → "가장 빠른/효율적인" 선지는 오답'},

link:[['we pay little attention to who the individual model is','개인은 상관없다'],['not ~ to find the fastest way','① quickest method = 오답'],['the right way — that is, ＿＿','② customs and practices of one’s own group']],
note:'원 문항 34번: not ~ most efficiently → ④ most efficient가 함정. 변형도 fastest → ① quickest가 함정.',
tr:'우리 집단에서 배울 때, 우리는 개별 본보기가 누구인지에 거의 주의를 기울이지 않는다. 놀랍게도, 우리가 싫어하는 집단 구성원조차 여전히 본보기가 된다. 한 연구에서 연구자들은 아이들에게 간단한 장난감 탑 조립법을 보여 주었다. 아이들은 가능한 가장 단순한 방법, 즉 티셔츠 색깔로 두 팀으로 나뉘었다. 아이들은 자기 팀의 모두를 자동으로 좋아하지는 않았다. 그들은 무례하게 행동하는 팀원을 싫어했다. 실제로 그들은 이 무례한 팀원들을 상대 팀의 예의 바른 아이들보다 낮게 평가했다. 그렇다 해도, 이 반감은 상대 팀보다 자기 팀의 행동을 더 충실히 따라 하는 경향을 바꾸지 못했다. 이러한 모방은 우리가 탑을 쌓는 가장 빠른 방법을 찾기 위해 모방하는 것이 아님을 보여 준다. 우리는 그것을 하는 올바른 방법, 즉 [자기 집단의 관습과 관행을 따르는 것]을 배우고 싶어 한다. 무례한 팀원들도 이것은 충분히 잘 보여 줄 수 있다.'}},

tr:'아동 전문가들은 아이들이 스스로 문제를 해결하고 작은 실패에서 회복할 기회가 필요하다는 데 동의한다. 하지만 많은 동네에는 학교까지 걸어가기에 충분히 안전한 인도가 없고, 공원은 보호자 없는 아이를 금지하는 표지판을 걸어 두며, 방과 후 시간은 짜인 수업으로 꽉 차 있다. 아이들이 이런 상황을 혼자 감당할 수 없기 때문에, 부모들은 결국 차로 데려다주고 감독하는 데 추가 시간과 돈을 쓰게 된다. 한 가족 연구자가 주장했듯이, 더 자립적인 아이를 기르는 것은 "양육 방식만의 문제가 아니라 도시 설계의 문제"이다. 그녀는 보육 보조금 같은 재정 지원만을 요구하는 것이 아니다. 그녀는 거리와 공원의 실제 변화, 그리고 공유 공간에서 아이들을 반기는 태도의 변화를 뜻한다. 공동체는 "공공장소에서 아이들에게 더 인내심을 갖고, 멀리서만 지켜봐도 아이들이 스스로 탐험할 수 있는 안전한 장소를 지어야 한다"고 그녀는 말한다. [요약] 자립적인 아이를 기르기 위해, 공동체는 물리적 공간과 대중의 태도를 모두 바꿈으로써 아이들이 (B) 느슨한 어른의 감독 아래 있을 수 있는 (A) 받아 주는 환경을 제공해야 한다.'}},

link:[['harvest the fields our grandparents planted','받은 혜택 (괜찮음)'],['burn the seeds meant for our grandchildren','후손 몫을 없앰 (하지 말 것)'],['the seed grain … was never to be eaten','⑤ use up what future generations need']],
note:'원 문항 21번: gardens planted by our ancestors ↔ steal the shade from our descendants — 같은 대칭 구조.',
tr:'인류는 이제 지구의 기후, 바다, 생물에 대해 비할 데 없는 힘을 가지고 있으며, 우리의 선택은 그 어느 때보다 빠르게 국경을 넘나든다. 우리 각자는 짧은 삶을 살 뿐이지만, 우리 자신의 세월을 훨씬 넘어 이어지는 긴 인류 이야기의 일부이기도 하다. 오늘의 결정이 아직 태어나지 않은 수십억 명의 삶을 만들어 갈 것이기 때문에, 우리는 현명한 조상으로 행동할, 즉 계절이 아니라 세기 단위로 생각할 의무를 진다. 일부 전통 농경 공동체는 엄격한 규칙을 지켰다. 겨울이 아무리 배고파지더라도, 이듬해 파종을 위한 씨앗 곡식은 절대 먹어서는 안 되었다. 지구에서의 짧은 시간 동안, 조부모님이 심은 밭을 수확하는 동안, 우리는 손주들을 위한 씨앗을 태워서는 안 된다.'}}
];
const KEY='mg26_formula_v1';
// LOCK=true 로 바꾸면 앞 문항을 끝내야 다음 문항이 열린다 (학생 배포용)
const LOCK=false;
let MEM=null;
function load(){try{const s=localStorage.getItem(KEY);if(s)return JSON.parse(s)}catch(e){}return MEM?JSON.parse(MEM):null}
function save(){const s=JSON.stringify(ST);MEM=s;try{localStorage.setItem(KEY,s)}catch(e){}}
function fresh(){return{cur:0,view:'q',tr:false,q:DATA.map(d=>({steps:d.steps.map(s=>newStep(s))}))}}
function newStep(s){return{sel:(s.k==='tap'||s.k==='order')?[]:s.k==='match'?s.rows.map(()=>null):null,att:0,res:0,done:false,rv:false,msg:'',mt:'',bad:[]}}
let ST=load();
if(!ST||!ST.q||ST.q.length!==DATA.length||ST.q.some((q,i)=>q.steps.length!==DATA[i].steps.length))ST=fresh();
const $=s=>document.querySelector(s);
const esc=t=>String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
function mk(t){return esc(t).replace(/\{\{!(\w+)\|([^}]+)\}\}/g,'<span class="cue" data-cue="$1">$2</span>').replace(/\{\{(\w+)\|([^}]+)\}\}/g,'<span class="tk" data-id="$1">$2</span>').replace(/__([^_]+)__/g,'<u>$1</u>')}
const qDone=i=>ST.q[i].steps.every(s=>s.done);
const unlocked=i=>!LOCK||i===0||qDone(i-1);
const allDone=()=>DATA.every((d,i)=>qDone(i));
const active=i=>ST.q[i].steps.findIndex(s=>!s.done);
function color(d){return `var(--t-${d.type})`}

function chips(){
 const c=$('#chips');c.innerHTML='';
 DATA.forEach((d,i)=>{const b=document.createElement('button');b.className='chip'+(ST.view==='q'&&ST.cur===i?' on':'')+(qDone(i)?' done':'');b.style.setProperty('--c',color(d));b.disabled=!unlocked(i);b.innerHTML=`<span class="dot"></span>${d.src}번`;b.setAttribute('aria-label',`${d.src}번 ${d.type}`);b.onclick=()=>{ST.view='q';ST.cur=i;save();render();window.scrollTo({top:0})};c.appendChild(b)});
 const r=document.createElement('button');r.className='chip res'+(ST.view==='sum'?' on':'');r.textContent='결과';r.disabled=LOCK&&!allDone();r.onclick=()=>{ST.view='sum';save();render()};c.appendChild(r);
 const tot=DATA.reduce((a,d)=>a+d.steps.length,0),dn=ST.q.reduce((a,q)=>a+q.steps.filter(s=>s.done).length,0);
 $('#bar').style.width=(dn/tot*100)+'%';
}

function render(){chips();if(ST.view==='sum')return renderSum();renderQ(ST.cur)}

function renderQ(i){
 const d=DATA[i],q=ST.q[i],m=$('#main');const a=active(i);
 let h=`<section style="--c:${color(d)}"><div class="qhead"><span class="badge">${d.type}</span><h2>${esc(d.title)}</h2><span class="src">원 문항 ${d.src}번 변형</span></div>`;
 h+=`<div class="formula">${d.formula.map(f=>`<div>${esc(f)}</div>`).join('')}</div>`;
 if(qDone(i))h+=`<div class="trbar"><button class="btn ghost" id="trbtn">${ST.tr?'문장별 해석 끄기':'문장별 해석 켜기'}</button><span>영어 한 문장 ↔ 해석 한 줄 + 구문 포인트</span></div>`;
 const showTr=ST.tr&&qDone(i);let n=0;
 h+=`<div class="paper${showTr?' tron':''}" id="psg">${d.blocks.map(b=>showTr
  ?`<div class="blk2${b.g?' given':''}">${b.l?`<span class="lab">${esc(b.l)}</span>`:''}${b.s.map(x=>{n++;return `<div class="pair"><div class="en"><span class="sn">${n}</span>${mk(x[0])}</div><div class="kr">${esc(x[1])}</div>${x[2]?`<div class="nt">구문  ${esc(x[2])}</div>`:''}</div>`}).join('')}</div>`
  :`<p class="blk${b.g?' given':''}">${b.l?`<span class="lab">${esc(b.l)}</span>`:''}${b.s.map(x=>{n++;return `<span class="sen" data-sn="${n}">${mk(x[0])}</span>`}).join(' ')}</p>`).join('')}</div>`;
 d.steps.forEach((s,k)=>{h+=stepHTML(i,k,a)});
 if(qDone(i))h+=afterHTML(d);
 if(qDone(i)){h+=`<div class="next">${i<DATA.length-1?`<button class="btn" id="nx">다음 문제 (${DATA[i+1].src}번)</button>`:`<button class="btn" id="nx">결과 보기</button>`}</div>`}
 h+='</section>';m.innerHTML=h;
 paintPassage(i);bind(i);
}
function stepHTML(i,k,a){
 const d=DATA[i],s=d.steps[k],st=ST.q[i].steps[k];
 const lock=!st.done&&k!==a;
 const title=s.k==='final'?s.q:s.q;
 if(lock)return `<div class="step lock"><div class="shd"><span class="num">${k+1}</span><span class="sq">${s.k==='final'?'정답 고르기':'잠김'} — 앞 단계를 맞히면 열린다</span></div></div>`;
 let b='';
 if(s.k==='choice'||s.k==='final'){
  b=`<div class="opts">${s.o.map((o,j)=>{let c='opt';if(st.done&&j===s.a)c+=' pick';else if(!st.done&&st.bad.includes(j))c+=' no';if(!st.done&&st.rv&&j===s.a)c+=' show';return `<button class="${c}" data-s="${k}" data-o="${j}" ${st.done?'disabled':''}>${esc(o)}</button>`}).join('')}</div>`;
 }else if(s.k==='tap'){
  b=`<p class="tapnote">${st.done?'찾은 단서가 지문에 밑줄로 남아 있다.':'위 지문에서 해당 부분을 탭한 뒤 확인을 누르세요. 다시 탭하면 취소된다.'}</p>${st.done?'':`<button class="btn" data-chk="${k}">확인</button>`}`;
 }else if(s.k==='order'){
  const lab=st.sel.length?st.sel.map(n=>n+'번째').join(' → '):'아직 안 고름';
  b=st.done?`<p class="tapnote">지문에 읽는 순서 번호가 남아 있다.</p>`:`<p class="tapnote">위 지문에서 문장을 순서대로 탭하세요. 다시 탭하면 빠진다.</p><div class="seqv">선택: ${esc(lab)}</div><button class="btn" data-chk="${k}">확인</button> <button class="btn ghost" data-clr="${k}">다시 고르기</button>`;
 }else if(s.k==='match'){
  b=s.rows.map((r,ri)=>{const v=st.sel[ri];const x=!st.done&&st.bad.includes(ri);return `<div class="mrow"><div class="mlab${x?' x':''}">${esc(r[0])}</div><div class="rchips">${r[1].map((o,j)=>{let c='rchip';if(v===j)c+=' sel';if(!st.done&&st.rv&&j===r[2]&&v!==j)c+=' show';return `<button class="${c}" data-s="${k}" data-r="${ri}" data-o="${j}" ${st.done?'disabled':''}>${esc(o)}</button>`}).join('')}</div></div>`}).join('')+(st.done?'':`<button class="btn" data-chk="${k}">확인</button>`);
 }
 let msg='';
 if(st.done){msg=`<div class="msg ok">${st.res===1?'한 번에 정답!':st.res===2?'힌트 보고 정답.':'정답 확인 후 직접 해결.'}${s.w?' '+esc(s.w):''}</div>`}
 else if(st.msg){msg=`<div class="msg ${st.mt}">${esc(st.msg)}</div>`}
 const pre=s.pre?`<div class="pre">${s.pre.map(l=>`<div>${esc(l)}</div>`).join('')}</div>`:'';
 return `<div class="step${st.done?' ok':''}" id="st${k}"><div class="shd"><span class="num">${k+1}</span><span class="sq">${esc(title)}</span></div><div class="sbody">${pre}${b}${msg}</div></div>`;
}
function paintPassage(i){
 const d=DATA[i],q=ST.q[i],a=active(i);
 const found=new Set();d.steps.forEach((s,k)=>{if(s.k==='tap'&&q.steps[k].done)s.a.forEach(x=>found.add(x))});
 const s=a>=0?d.steps[a]:null,st=a>=0?q.steps[a]:null;
 document.querySelectorAll('#psg .sen').forEach(el=>{const n=+el.dataset.sn;el.className='sen';delete el.dataset.pick;delete el.dataset.ord;
  if(s&&s.k==='order'){el.classList.add('scand');const p=st.sel.indexOf(n);if(p>=0){el.classList.add('spick');el.dataset.pick=s.any?'✓':String(p+1)}if(st.rv&&!st.sel.includes(n)&&s.seq.includes(n))el.classList.add('sshow')}
  d.steps.forEach((s2,k2)=>{if(s2.k==='order'&&q.steps[k2].done&&s2.seq.includes(n)&&!(s&&s.k==='order')){el.classList.add('key');el.dataset.ord=s2.any?'읽기':String(s2.seq.indexOf(n)+1)}});
 });
 document.querySelectorAll('#psg .cue').forEach(el=>{el.classList.toggle('on',!!(s&&s.cue&&s.cue.includes(el.dataset.cue)))});
 document.querySelectorAll('#psg .tk').forEach(el=>{
  const id=el.dataset.id;el.className='tk';el.removeAttribute('tabindex');el.removeAttribute('role');
  if(found.has(id))el.classList.add('found');
  if(s&&s.k==='tap'&&s.c.includes(id)){el.classList.add('cand');el.tabIndex=0;el.setAttribute('role','button');
   if(st.sel.includes(id))el.classList.add('sel');
   if(st.rv&&s.a.includes(id)&&!st.sel.includes(id))el.classList.add('show');
   if(st.bad.includes(id)&&!st.sel.includes(id))el.classList.add('wrong');}
 });
}
function bind(i){
 const d=DATA[i],q=ST.q[i];
 document.querySelectorAll('#psg .tk').forEach(el=>{
  const f=()=>{const a=active(i);if(a<0)return;const s=d.steps[a];if(s.k!=='tap'||!s.c.includes(el.dataset.id))return;const st=q.steps[a];const id=el.dataset.id;st.bad=st.bad.filter(x=>x!==id);
   st.sel=st.sel.includes(id)?st.sel.filter(x=>x!==id):[...st.sel,id];paintPassage(i)};
  el.onclick=f;el.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();f()}};
 });
 document.querySelectorAll('#psg .sen').forEach(el=>{el.addEventListener('click',()=>{const a=active(i);if(a<0)return;const s=d.steps[a];if(s.k!=='order')return;const st=q.steps[a];const n=+el.dataset.sn;st.sel=st.sel.includes(n)?st.sel.filter(x=>x!==n):[...st.sel,n];st.msg='';renderKeep(i,a)})});
 document.querySelectorAll('[data-clr]').forEach(b=>b.onclick=()=>{const k=+b.dataset.clr;q.steps[k].sel=[];renderKeep(i,k)});
 document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{const k=+b.dataset.s,j=+b.dataset.o;const st=q.steps[k];st.sel=j;check(i,k)});
 document.querySelectorAll('.rchip').forEach(b=>b.onclick=()=>{const k=+b.dataset.s,r=+b.dataset.r,j=+b.dataset.o;const st=q.steps[k];st.sel[r]=j;st.bad=st.bad.filter(x=>x!==r);renderKeep(i,k)});
 document.querySelectorAll('[data-chk]').forEach(b=>b.onclick=()=>check(i,+b.dataset.chk));
 const tb=$('#trbtn');if(tb)tb.onclick=()=>{ST.tr=!ST.tr;save();renderKeep(i,0)};
 const nx=$('#nx');if(nx)nx.onclick=()=>{if(i<DATA.length-1){ST.cur=i+1;ST.view='q'}else ST.view='sum';save();render();window.scrollTo({top:0,behavior:'smooth'})};
}
function renderKeep(i,k){const y=window.scrollY;renderQ(i);chips();window.scrollTo(0,y)}
function check(i,k){
 const s=DATA[i].steps[k],st=ST.q[i].steps[k];let ok=false;
 if(s.k==='choice'||s.k==='final'){ok=st.sel===s.a;if(!ok&&!st.bad.includes(st.sel))st.bad.push(st.sel)}
 else if(s.k==='tap'){const A=new Set(s.a),S=new Set(st.sel);ok=A.size===S.size&&[...A].every(x=>S.has(x));if(!ok){st.bad=st.sel.filter(x=>!A.has(x));st.sel=st.sel.filter(x=>A.has(x))}}
 else if(s.k==='order'){if(s.any){const A=new Set(s.seq),S=new Set(st.sel);ok=A.size===S.size&&[...A].every(x=>S.has(x));if(!ok)st.sel=st.sel.filter(x=>A.has(x))}else{ok=st.sel.length===s.seq.length&&st.sel.every((x,j)=>x===s.seq[j]);if(!ok)st.sel=[]}}
 else if(s.k==='match'){if(st.sel.some(v=>v===null)){st.msg='모든 줄을 골라야 확인할 수 있어요.';st.mt='hint';return renderKeep(i,k)}st.bad=[];s.rows.forEach((r,ri)=>{if(st.sel[ri]!==r[2])st.bad.push(ri)});ok=st.bad.length===0;if(!ok)st.bad.forEach(ri=>st.sel[ri]=null)}
 if(ok){st.done=true;st.res=st.rv?3:(st.att===0?1:2);st.msg='';st.bad=[];save();renderKeep(i,k);
  const nxt=document.getElementById('st'+(k+1));const tgt=nxt||document.querySelector('.after');if(tgt){tgt.classList.add('flash');tgt.scrollIntoView({behavior:'smooth',block:'center'})}
  return}
 st.att++;
 if(st.att===1){st.msg='힌트: '+s.h;st.mt='hint'}
 else{st.rv=true;st.msg=s.k==='order'?'읽어야 할 문장을 빨간 점선으로 표시했어요. '+(s.any?'모두 탭하고':'순서대로 탭하고')+' 확인을 누르세요.':s.k==='tap'?'정답 위치를 빨간 점선으로 표시했어요. 직접 탭해서 확인을 누르세요.':s.k==='match'?'정답을 빨간 점선으로 표시했어요. 직접 골라서 확인을 누르세요.':'정답을 빨간 점선으로 표시했어요. 직접 눌러서 넘어가세요.';st.mt='rv'}
 save();renderKeep(i,k);
}
function afterHTML(d){
 const A=d.after;
 const rules=A.rules?`<h4>공통 공식 — 어법 푸는 순서</h4><div class="olist">${A.rules.map(r=>`<div><b>${esc(r[0])}</b>${esc(r[1])}</div>`).join('')}</div>`:'';
 const det=A.detail?`<h4>밑줄별 판별 과정</h4>${A.detail.map(x=>`<div class="ud"><div class="udh"><b>${esc(x.u)}</b><span class="${x.v.startsWith('✘')?'ux':'uo'}">${esc(x.v)}</span></div><dl><dt>무엇을 묻나</dt><dd>${esc(x.ask)}</dd><dt>판별 기준</dt><dd>${x.crit.map(c=>`<div>${esc(c)}</div>`).join('')}</dd><dt>이 문장에 대입</dt><dd>${esc(x.sub)}</dd><dt>✓ / ✗ 예문</dt><dd>${x.ex.map(e=>`<div>· ${esc(e)}</div>`).join('')}</dd><dt>확인</dt><dd>${esc(x.chk)}</dd><dt>시험 포인트</dt><dd>${esc(x.pt)}</dd></dl></div>`).join('')}`:'';
 return `<div class="after"><h3>정답 ${esc(d.steps[d.steps.length-1].o[d.steps[d.steps.length-1].a].split(' ')[0])} — 해설</h3>
 <h4>선지 판정</h4><div class="olist">${A.opts.map(o=>`<div><b>${esc(o[0])}</b>${esc(o[1])}</div>`).join('')}</div>
 ${rules}${det}
 <h4>연결구조</h4><table class="lk">${A.link.map(r=>`<tr><td>${esc(r[0])}</td><td>${esc(r[1])}</td></tr>`).join('')}</table>
 <p style="font-size:15.5px;margin:12px 0 0">${esc(A.note)}</p>
 <p style="font-size:14.5px;color:var(--muted);margin:10px 0 0">지문 위 "문장별 해석 켜기"를 누르면 문장마다 해석과 구문 포인트가 나온다.</p></div>`;
}
function stats(){let o=0,h=0,r=0;ST.q.forEach(q=>q.steps.forEach(s=>{if(s.res===1)o++;else if(s.res===2)h++;else if(s.res===3)r++}));return{o,h,r}}
function code(){const{o,h,r}=stats();const p=n=>String(n).padStart(2,'0');const c=String.fromCharCode(65+((o*3+h*5+r*7)%26));return `MG26-${p(o)}${p(h)}${p(r)}-${c}`}
function renderSum(){
 const{o,h,r}=stats();
 const fin=allDone();
 let x=`<div class="sum"><h2>${fin?'8문항 완료':'진행 상황'}</h2><p style="margin:0;color:var(--muted)">${fin?'완료 코드를 클래스룸 댓글로 제출하세요.':'8문항을 모두 끝내면 완료 코드가 나온다.'}</p>
 ${fin?`<div class="code">${code()}</div>`:''}
 <div class="stats"><div><b>${o}</b>한 번에 정답</div><div><b>${h}</b>힌트 후 정답</div><div><b>${r}</b>정답 공개</div></div>
 <h3 style="font-size:17px;margin:16px 0 4px">문항별</h3>`;
 DATA.forEach((d,i)=>{const q=ST.q[i];const rv=q.steps.filter(s=>s.res===3).length,hh=q.steps.filter(s=>s.res===2).length;
  const dn=qDone(i);x+=`<div class="qline"><span><span class="badge" style="--c:${color(d)}">${d.type}</span> ${d.src}번 변형 — ${dn?`힌트 ${hh} · 공개 ${rv}`:'아직 안 끝남'}</span>${dn?'':`<button class="btn ghost" data-go="${i}">풀러 가기</button>`}${rv?`<button class="btn ghost" data-redo="${i}">공개된 문제 다시 풀기</button>`:''}</div>`});
 x+=`<div style="margin-top:16px"><button class="btn ghost" id="reset">처음부터 전부 다시</button></div></div>`;
 $('#main').innerHTML=x;
 document.querySelectorAll('[data-redo]').forEach(b=>b.onclick=()=>{const i=+b.dataset.redo;ST.q[i]={steps:DATA[i].steps.map(s=>newStep(s))};ST.cur=i;ST.view='q';save();render();window.scrollTo({top:0})});
 document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{ST.cur=+b.dataset.go;ST.view='q';save();render();window.scrollTo({top:0})});
 $('#reset').onclick=()=>{if(confirm('모든 기록을 지우고 처음부터 시작할까요?')){ST=fresh();save();render()}};
}
render();
</script></body></html>
