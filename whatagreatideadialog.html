<script>
/* ===== DATA: 핵심표현 + 바꿔쓰기 (from photos) ===== */
const EXPR=[
{fn:"확신 여부 묻기",core:"Are you sure?",ko:"확신해? 확실해?",alts:["Are you certain?","Really?","Is that true?","Is that right?","Do you really think so?","(How) Can you be sure?"],
 note:"sure·certain은 you를 주어로, true·right는 it/that을 주어로 쓴다. Are you true?(✗) Is that sure?(✗)"},
{fn:"확신의 긍정 응답",core:"Yes, I'm quite sure.",ko:"응, 완전히 확신해.",alts:["Yes, I'm sure.","I know it for sure.","Of course.","I'm pretty sure."],
 note:"quite(pretty)를 넣으면 강조. 확신 100%일 때."},
{fn:"확신의 부정 응답",core:"I'm not sure.",ko:"확신하지 못해. 잘 모르겠어.",alts:["No, I'm not so sure.","I don't know for sure.","I'm not 100 percent sure.","I think so. (약한 긍정)","I guess so. (아마)","Probably. (아마도)"],
 note:"불확실할 때. I think so / I guess so / Probably는 '아마 그럴 것'이라는 약한 확신."},
{fn:"정보 묻기 (의문사)",core:"What will the weather be like tomorrow?",ko:"내일 날씨가 어떨 것 같나요?",alts:["How will the weather be tomorrow?"],
 note:"What ~ like? = How ~? 의문사 질문에는 Yes/No가 아닌 구체적 정보로 답해야 한다!"},
{fn:"제안하기",core:"How about Magic Island?",ko:"매직 아일랜드는 어때?",alts:["What about Magic Island?","Let's watch Magic Island."],
 note:"How about ~? = What about ~? / Let's+동사원형 = ~하자"},
{fn:"의견 묻기",core:"How about you, Somi?",ko:"너는 어때, 소미야?",alts:["What about you?"],
 note:"상대방의 의견을 묻는 표현."},
{fn:"기대 표현",core:"I can't wait.",ko:"너무 기대돼, 못 기다리겠어.",alts:["I'm looking forward to it.","I can't wait for it."],
 note:"can't wait (for) = look forward to: ~을 고대하다"},
{fn:"생각 바꾸기",core:"I changed my mind.",ko:"나는 생각을 바꿨어.",alts:["I've changed my mind."],
 note:"change one's mind = 생각을 바꾸다"},
{fn:"권유·의무",core:"We should hurry.",ko:"우리는 서둘러야 해.",alts:["We need to hurry.","We'd better hurry."],
 note:"should+동사원형: ~해야 한다 (권유·마땅한 의무)"}
];
/* 대화문 (from photos A-1~4, C, Review 1·2) */
const DIALOGS=[
{id:"Watch and Talk A-1",lines:[
 ["G","What will the weather be like tomorrow?","내일 날씨가 어떨 것 같아?",1],
 ["B","It's going to rain a lot.","비가 많이 올 거야.",0],
 ["G","Are you sure? It's quite sunny now.","확실해? 지금 꽤 화창한데.",1],
 ["B","Yes. Check the weather forecast here. It says it's going to rain on Monday.","응. 여기 일기예보를 봐. 월요일에 비가 올 거래.",0]],
 q:{prompt:"What day is it today?",hint:"월요일에 비가 온다고 했고, 지금 대화 중 — 본문 근거로 추론",opts:["It's Sunday.","It's Monday.","It's Friday."],ans:0,why:"내일(tomorrow) 비가 오는데 그것이 Monday이므로 오늘은 Sunday."}},
{id:"Watch and Talk A-2",lines:[
 ["G","What's your favorite pizza place, Tim?","팀, 가장 좋아하는 피자집이 어디야?",1],
 ["B","Little Italy. I think they have the best pizza in Seoul.","리틀 이탈리아. 서울 최고의 피자라고 생각해.",0],
 ["G","Are you sure? You said the same thing about Joe's Pizza last week. Remember?","확실해? 지난주엔 조스 피자에 대해 똑같이 말했잖아. 기억나?",1],
 ["B","Did I? Well, then, I'm not sure. Let's just say that they both have great pizza.","내가 그랬어? 음, 그럼 확신 못 하겠네. 둘 다 훌륭하다고 해 두자.",0]],
 q:{prompt:"Tim은 Little Italy의 피자가 서울에서 가장 맛있다고 확신한다. (T/F)",hint:"마지막 대사에 주목",opts:["T","F"],ans:1,why:"I'm not sure.라고 했으므로 확신하지 못한다 → F."}},
{id:"Watch and Talk A-3",lines:[
 ["G","Which team will win today, the Reds or the Blues?","오늘 어느 팀이 이길까, 레즈 아니면 블루스?",1],
 ["B","The Reds. They're the better team.","레즈. 그들이 더 나은 팀이야.",0],
 ["G","Are you sure? Yun Jihun, their star player, is not playing today.","확실해? 그들의 스타 선수인 윤지훈이 오늘 안 뛰는데.",1],
 ["B","I didn't know that. Then, I'm not sure.","그건 몰랐네. 그럼 확신 못 하겠다.",0]],
 q:{prompt:"남학생은 처음에 어떤 팀이 이길 것이라고 생각했는가?",hint:"첫 대답",opts:["The Reds","The Blues"],ans:0,why:"처음에 The Reds라고 답했다."}},
{id:"Watch and Talk A-4",lines:[
 ["G","I want to see a movie. What movie is playing at the Star Cinema?","영화 보고 싶어. 스타 시네마에서 무슨 영화 상영 중이야?",1],
 ["B","The Hero. The next show starts at 6:30. Let's leave right away. Then, we can catch it.","더 히어로. 다음 상영이 6시 30분이야. 당장 출발하자. 그러면 시간 맞춰 볼 수 있어.",0],
 ["G","Are you sure? It's already 6.","확실해? 벌써 6시인데.",1],
 ["B","Yes, I'm quite sure. The Star Cinema is only 1 km from here.","응, 완전히 확신해. 스타 시네마는 여기서 겨우 1km거든.",0]],
 q:{prompt:"What time does the next movie start?",hint:"두 번째 대사",opts:["It starts at 6:30.","It starts at 6:00.","It starts at 7:30."],ans:0,why:"The next show starts at 6:30."}},
{id:"Watch and Talk C",lines:[
 ["G","Look at this program, Liam. This Saturday is Science Day, and there are lots of interesting activities.","리암, 이 프로그램 봐. 이번 토요일이 과학의 날이고, 흥미로운 활동이 많아.",1],
 ["B","You mean April 21?","4월 21일 말이야?",0],
 ["G","Yes. All the activities look fun, and they're all free.","응. 모든 활동이 재밌어 보이고, 다 무료야.",1],
 ["B","All of them? Are you sure?","전부 다? 확실해?",0],
 ["G","Yes, I'm quite sure. I saw it on the poster. Anyway, which ones are you interested in?","응, 완전히 확실해. 포스터에서 봤어. 그나저나 어떤 것들에 관심 있어?",1],
 ["B","I want to go to the drone-flying class the most. How about you, Somi?","난 드론 비행 수업에 제일 가고 싶어. 너는 어때, 소미야?",0],
 ["G","Well, I want to go to Dr. Lee's lecture on AI.","음, 나는 이 박사님의 AI 강의에 가고 싶어.",1],
 ["B","Oh, I like that, too. Let's go to both classes.","오, 나도 그거 좋아. 둘 다 가자.",0],
 ["G","Let's see. The drone-flying class is on Saturday afternoon, and Dr. Lee's lecture is on Sunday morning.","어디 보자. 드론 수업은 토요일 오후고, 이 박사님 강의는 일요일 오전이야.",1],
 ["B","Perfect. I can't wait.","완벽해. 너무 기대된다.",0]],
 q:{prompt:"What day is Dr. Lee's lecture?",hint:"마지막 부분",opts:["It's on Sunday morning.","It's on Saturday afternoon.","It's on Saturday morning."],ans:0,why:"Dr. Lee's lecture is on Sunday morning."}},
{id:"Review-1",lines:[
 ["B","What movie will we watch tomorrow?","내일 무슨 영화 볼까?",0],
 ["G","How about Magic Island?","매직 아일랜드 어때?",1],
 ["B","Are you sure? You said you wanted to watch Love in Seoul.","확실해? 러브 인 서울 보고 싶다고 했잖아.",0],
 ["G","I changed my mind. Magic Island looks more fun.","생각 바꿨어. 매직 아일랜드가 더 재밌어 보여.",1],
 ["B","OK. Let's watch Magic Island, then.","좋아. 그럼 매직 아일랜드 보자.",0]],
 q:{prompt:"What will the girl and the boy watch?",hint:"마지막 합의",opts:["Magic Island","Love in Seoul"],ans:0,why:"Let's watch Magic Island, then."}},
{id:"Review-2",lines:[
 ["G","I know that the concert begins at 7, but what time does it end?","콘서트가 7시에 시작하는 건 아는데, 몇 시에 끝나?",1],
 ["B","At 9:30, I think.","9시 30분일 거야.",0],
 ["G","Are you sure?","확실해?",1],
 ["B","Yes, I'm quite sure. Anyway, it's already 6. We should hurry.","응, 완전히 확실해. 어쨌든 벌써 6시야. 서둘러야 해.",0]],
 q:{prompt:"How long will the concert last? — About for ___ minutes.",hint:"7시 시작, 9:30 끝",opts:["150","120","90"],ans:0,why:"7:00~9:30 = 2시간 30분 = 150분."}}
];

/* ===== STATE/SPEECH/HELPERS (same engine) ===== */
let view=0;
let parState={}, dlgState={}, fillState={};
let examQs=[], examPick=[], examGraded=false, examActive=[];
var SS=('speechSynthesis' in window)?window.speechSynthesis:null;
var ttsReady=false, ttsVoices=[];
function loadVoices(){if(!SS)return;ttsVoices=SS.getVoices()||[];}
if(SS){loadVoices();SS.onvoiceschanged=loadVoices;}
function unlockTTS(){
  if(!SS||ttsReady)return;
  try{var u=new SpeechSynthesisUtterance(' ');u.volume=0;SS.speak(u);SS.cancel();}catch(e){}
  loadVoices();ttsReady=true;
  var h=document.getElementById('sndHint');if(h)h.style.display='none';
}
document.addEventListener('touchstart',unlockTTS,{once:true,passive:true});
document.addEventListener('mousedown',unlockTTS,{once:true});
document.addEventListener('click',unlockTTS,{once:true});
function pickVoice(){
  if(!ttsVoices.length)loadVoices();
  return ttsVoices.filter(function(x){return x.lang==='en-US';})[0]
    ||ttsVoices.filter(function(x){return x.lang&&x.lang.toLowerCase().indexOf('en')===0;})[0]||ttsVoices[0]||null;}
function speak(t,btn){
  if(!SS){alert('Chrome으로 열어 주세요.');return;}
  unlockTTS();
  var msg=String(t==null?'':t).replace(/[\/~_]/g,' ').replace(/\s+/g,' ').trim();
  if(!msg)return;
  SS.cancel();
  var bs=document.querySelectorAll('.speak.playing');
  for(var i=0;i<bs.length;i++)bs[i].classList.remove('playing');
  function fire(){
    var u=new SpeechSynthesisUtterance(msg);
    u.lang='en-US';u.rate=0.85;u.pitch=1;u.volume=1;
    var v=pickVoice();if(v)u.voice=v;
    if(btn){btn.classList.add('playing');u.onend=u.onerror=function(){btn.classList.remove('playing');};}
    try{SS.resume();}catch(e){}
    SS.speak(u);
  }
  if(!ttsVoices.length){loadVoices();if(!ttsVoices.length){setTimeout(fire,180);return;}}
  setTimeout(fire,0);
}
function speakDialog(di){
  if(!SS)return;
  var lines=DIALOGS[di].lines.map(function(l){return l[1];});
  var k=0;SS.cancel();
  function next(){if(k>=lines.length)return;var u=new SpeechSynthesisUtterance(lines[k++]);u.lang='en-US';u.rate=.85;var v=pickVoice();if(v)u.voice=v;u.onend=next;SS.speak(u);}
  next();
}
function esc(t){return String(t==null?'':t).replace(/[&<>"']/g,function(m){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m];});}
function sp(t,mini){return '<button type="button" class="speak'+(mini?' mini':'')+'" data-say="'+esc(t)+'" onclick="event.stopPropagation();speak(this.getAttribute(\'data-say\'),this)">🔊 듣기</button>';}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
function buildOpts(correct,pool){
  var set=[correct],sh=shuffle(pool),k;
  for(k=0;k<sh.length&&set.length<4;k++){if(sh[k]!=null&&set.indexOf(sh[k])<0)set.push(sh[k]);}
  var opts=shuffle(set);return {opts:opts,ans:opts.indexOf(correct)};
}

/* ===== NAV ===== */
const STEPS=[['핵심표현','①'],['바꿔쓰기','②'],['대화문','③'],['빈칸채우기','④'],['종합시험','⑤']];
function buildSteps(){
  document.getElementById('steps').innerHTML=STEPS.map(function(s,i){
    return '<button class="step'+(i===0?' on':'')+'" id="st'+i+'" onclick="go('+i+')"><span class="sn">'+s[1]+'단계</span>'+s[0]+'</button>';}).join('');}
function go(v){view=v;if(SS)SS.cancel();
  for(var i=0;i<STEPS.length;i++)document.getElementById('st'+i).classList.toggle('on',i===v);
  render();window.scrollTo({top:0,behavior:'smooth'});}
function render(){
  document.getElementById('ctrl').innerHTML='';
  document.getElementById('app').innerHTML=[V0,V1,V2,V3,V4][view]();
}

/* ===== ① 핵심표현 카드 ===== */
function V0(){
  var h='<div class="intro">💡 <b>① 핵심표현 — 기능별 정리</b><br>이 과의 의사소통 기능은 <b>확신 묻고 답하기</b>와 <b>정보 묻기</b>입니다. 각 표현과 <b>바꿔 쓸 수 있는 표현들</b>을 함께 익히세요. 시험은 바꿔쓰기에서 나옵니다!</div>';
  EXPR.forEach(function(e,i){
    h+='<div class="qcard"><div class="qnum">'+esc(e.fn)+'</div>'+
      '<div class="qsent">'+esc(e.core)+' '+sp(e.core)+'</div>'+
      '<div class="qhint">'+esc(e.ko)+'</div>'+
      '<div class="meta" style="margin-top:10px"><b>≒ 바꿔쓰기</b><br>'+
      e.alts.map(function(a){return '<div class="line">'+esc(a)+' '+sp(a,true)+'</div>';}).join('')+
      '</div>'+
      '<div class="ansbox show" style="margin-top:10px">⚠️ '+esc(e.note)+'</div></div>';
  });
  return h;
}

/* ===== ② 바꿔쓰기 퀴즈 ===== */
function V1(){
  if(!parState.qs){
    var qs=[];
    EXPR.forEach(function(e){
      /* same-meaning pick */
      var others=[];
      EXPR.forEach(function(x){if(x.fn!==e.fn)others=others.concat(x.alts.slice(0,1));});
      var alt=e.alts[0];
      var o=buildOpts(alt,others);
      qs.push({prompt:'<b>'+esc(e.core)+'</b> 와 바꿔 쓸 수 있는 것은?',say:e.core,opts:o.opts,ans:o.ans,why:e.core+' = '+alt+' ('+e.fn+')',picked:-1,done:false});
    });
    /* odd-one-out: which is NOT a paraphrase */
    [["Are you sure?",["Are you certain?","Really?","Is that true?","How about you?"],3,"How about you?는 의견을 묻는 표현. 나머지는 모두 확신 여부 묻기."],
     ["I can't wait.",["I'm looking forward to it.","I can't wait for it.","I'm not sure."],2,"I'm not sure.는 불확신 응답. 나머지는 기대 표현."],
     ["How about Magic Island?",["What about Magic Island?","Let's watch Magic Island.","Is that right?"],2,"Is that right?은 확신 묻기. 나머지는 제안하기."]
    ].forEach(function(arr){
      qs.push({prompt:'<b>'+esc(arr[0])+'</b> 와 의미가 <span style="color:#ef4444">다른</span> 것은?',say:arr[0],opts:arr[1],ans:arr[2],why:arr[3],picked:-1,done:false});
    });
    parState.qs=qs;
  }
  var h='<div class="intro">💡 <b>② 바꿔쓰기 퀴즈</b><br>같은 의미의 표현 고르기 + 의미가 다른 표현 찾기. 보기 영어에 모두 🔊.</div>';
  parState.qs.forEach(function(q,i){
    h+='<div class="qcard"><div class="qnum">문제 '+(i+1)+' / '+parState.qs.length+'</div>'+
      '<div class="qsent">'+q.prompt+' '+sp(q.say,true)+'</div>';
    q.opts.forEach(function(o,j){
      var cls='';
      if(q.done){if(j===q.ans)cls=' correct';else if(j===q.picked)cls=' wrong';}
      h+='<button class="opt'+cls+'" onclick="pickPar('+i+','+j+')"><span>'+String.fromCharCode(9312+j)+' '+esc(o)+'</span><span class="ospk">'+sp(o,true)+'</span></button>';
    });
    h+='<div class="ansbox'+(q.done?' show':'')+'">'+esc(q.why)+'</div></div>';
  });
  return h;
}
function pickPar(i,j){var q=parState.qs[i];if(q.done)return;q.picked=j;q.done=true;render();}

/* ===== ③ 대화문 보기 + 이해 문제 ===== */
function V2(){
  var h='<div class="intro">💡 <b>③ 대화문 7편</b><br>핵심표현(주황 형광펜)에 주목하며 읽고 들으세요. 전체듣기 버튼으로 대화 흐름을 통째로 들을 수 있습니다.</div>';
  DIALOGS.forEach(function(d,di){
    h+='<div class="qcard"><div class="qnum" style="display:flex;align-items:center;gap:10px">'+esc(d.id)+
      ' <button class="b b5" style="padding:7px 14px;font-size:13px" onclick="speakDialog('+di+')">🔊 전체 듣기</button></div>';
    d.lines.forEach(function(l){
      var who=l[0]==='G'?'👧':'👦';
      h+='<div style="margin:9px 0;padding:11px 13px;background:'+(l[0]==='G'?'#fdf2f8':'#eff6ff')+';border-radius:12px">'+
        '<div style="display:flex;gap:8px;align-items:flex-start;flex-wrap:wrap"><span>'+who+'</span>'+sp(l[1],true)+
        '<span style="flex:1;font-weight:700;font-size:15px;line-height:1.6">'+esc(l[1])+'</span></div>'+
        '<div style="font-size:13px;color:#888;margin-top:4px;padding-left:30px">'+esc(l[2])+'</div></div>';
    });
    var q=d.q, st=dlgState[di]||{picked:-1,done:false};
    h+='<div style="margin-top:12px;border-top:2px dashed #e8e8e8;padding-top:12px">'+
      '<div class="qsent" style="font-size:16px">Q. '+esc(q.prompt)+'</div><div class="qhint">'+esc(q.hint)+'</div>';
    q.opts.forEach(function(o,j){
      var cls='';
      if(st.done){if(j===q.ans)cls=' correct';else if(j===st.picked)cls=' wrong';}
      h+='<button class="opt'+cls+'" onclick="pickDlg('+di+','+j+')"><span>'+String.fromCharCode(9312+j)+' '+esc(o)+'</span>'+(/[a-z]/i.test(o)?'<span class="ospk">'+sp(o,true)+'</span>':'')+'</button>';
    });
    h+='<div class="ansbox'+(st.done?' show':'')+'">'+esc(q.why)+'</div></div></div>';
  });
  return h;
}
function pickDlg(di,j){var st=dlgState[di]||{picked:-1,done:false};if(st.done)return;st.picked=j;st.done=true;dlgState[di]=st;render();}

/* ===== ④ 대화 빈칸 채우기 (핵심표현 자리) ===== */
function V3(){
  if(!fillState.qs){
    var qs=[];
    /* blank out the core expression line in each dialog */
    var targets=[
      [0,2,"Are you sure?"],[1,3,"I'm not sure."],[2,0,"Which team will win today"],
      [3,1,"Let's leave right away"],[4,9,"I can't wait."],[5,3,"I changed my mind."],[6,3,"We should hurry."]
    ];
    targets.forEach(function(t){
      var d=DIALOGS[t[0]], li=t[1], phrase=t[2];
      var line=d.lines[li][1];
      var blanked=line.replace(phrase,'______');
      if(blanked===line){blanked='______ '+line;}
      var pool=EXPR.map(function(e){return e.core;}).concat(["Let's leave right away","Which team will win today"]).filter(function(x){return x!==phrase;});
      var o=buildOpts(phrase,pool);
      qs.push({ctx:d.id,prompt:blanked,say:line,opts:o.opts,ans:o.ans,why:'완성 문장: '+line,picked:-1,done:false});
    });
    fillState.qs=qs;
  }
  var h='<div class="intro">💡 <b>④ 대화 빈칸 채우기</b><br>대화 속 핵심표현 자리를 비웠습니다. 문맥에 맞는 표현을 고르세요.</div>';
  fillState.qs.forEach(function(q,i){
    h+='<div class="qcard"><div class="qnum">문제 '+(i+1)+' / '+fillState.qs.length+' · '+esc(q.ctx)+'</div>'+
      '<div class="qsent" style="font-style:italic">'+esc(q.prompt)+'</div>';
    q.opts.forEach(function(o,j){
      var cls='';
      if(q.done){if(j===q.ans)cls=' correct';else if(j===q.picked)cls=' wrong';}
      h+='<button class="opt'+cls+'" onclick="pickFill('+i+','+j+')"><span>'+String.fromCharCode(9312+j)+' '+esc(o)+'</span><span class="ospk">'+sp(o,true)+'</span></button>';
    });
    h+='<div class="ansbox'+(q.done?' show':'')+'">'+esc(q.why)+' '+sp(q.say,true)+'</div></div>';
  });
  return h;
}
function pickFill(i,j){var q=fillState.qs[i];if(q.done)return;q.picked=j;q.done=true;render();}

/* ===== ⑤ 종합시험 ===== */
var EXAM_N=20, PASS=0.8;
function makeExam(){
  var qs=[];
  /* A. 바꿔쓰기 (7) */
  shuffle(EXPR).slice(0,7).forEach(function(e){
    var alt=e.alts[Math.floor(Math.random()*e.alts.length)].replace(/\s*\(.*\)$/,'');
    var others=[];EXPR.forEach(function(x){if(x.fn!==e.fn)others.push(x.alts[0]);});
    var o=buildOpts(alt,others);
    qs.push({kind:'바꿔쓰기',prompt:'<b>'+esc(e.core)+'</b> 와 같은 의미는?',say:e.core,opts:o.opts,ans:o.ans,why:e.core+' = '+alt});
  });
  /* B. 기능 판단 (4): 이 표현의 기능은? */
  shuffle(EXPR).slice(0,4).forEach(function(e){
    var fns=EXPR.map(function(x){return x.fn;}).filter(function(f,i,arr){return arr.indexOf(f)===i&&f!==e.fn;});
    var o=buildOpts(e.fn,fns);
    qs.push({kind:'기능',prompt:'<b>'+esc(e.core)+'</b> 는 무엇을 하는 표현인가?',say:e.core,opts:o.opts,ans:o.ans,why:e.core+' → '+e.fn});
  });
  /* C. 응답 적절성 (3): 의문사 질문엔 Yes/No 불가 등 */
  [
  {p:'"What time do you usually get up in the morning?"에 대한 응답으로 옳은 것은?',say:'What time do you usually get up in the morning?',
   opts:['Yes, I get up at 7.','I usually get up at 7.','No, I don\'t.'],ans:1,why:'의문사 질문에는 Yes/No가 아닌 구체적 정보로 답한다.'},
  {p:'"Are you sure?"에 대한 응답으로 어색한 것은?',say:'Are you sure?',
   opts:['Yes, I\'m quite sure.','I know it for sure.','It\'s going to be sunny.'],ans:2,why:'확신 여부를 묻는 말에는 확신/불확신 응답이 와야 한다. 날씨 답변은 동문서답.'},
  {p:'확신 여부를 물을 때 어법상 옳은 것은?',say:'Are you sure?',
   opts:['Are you sure?','Is that sure?','Are you true?'],ans:0,why:'sure·certain은 you 주어, true·right는 it/that 주어. Is that sure?(✗), Are you true?(✗)'}
  ].forEach(function(c){qs.push({kind:'응답 적절성',prompt:c.p,say:c.say,opts:c.opts,ans:c.ans,why:c.why});});
  /* D. 대화 이해 (4) */
  shuffle(DIALOGS).slice(0,4).forEach(function(d){
    qs.push({kind:'대화 이해 · '+d.id,prompt:esc(d.q.prompt),say:d.lines[0][1],opts:d.q.opts,ans:d.q.ans,why:d.q.why});
  });
  /* E. 빈칸 (3) */
  var targets=[[0,2,"Are you sure?"],[4,9,"I can't wait."],[6,3,"We should hurry."]];
  shuffle(targets).slice(0,3).forEach(function(t){
    var d=DIALOGS[t[0]],line=d.lines[t[1]][1],phrase=t[2];
    var blanked=line.replace(phrase,'______');if(blanked===line)blanked='______ '+line;
    var pool=EXPR.map(function(e){return e.core;}).filter(function(x){return x!==phrase;});
    var o=buildOpts(phrase,pool);
    qs.push({kind:'빈칸',prompt:'<span style="font-style:italic">'+esc(blanked)+'</span>',say:line,opts:o.opts,ans:o.ans,why:'완성: '+line});
  });
  return shuffle(qs).slice(0,EXAM_N);
}
function V4(){
  if(examQs.length===0){
    return '<div class="intro">💡 <b>⑤ 종합 시험</b><br>'+
      '• <b>'+EXAM_N+'문항</b>: 바꿔쓰기 · 기능 판단 · 응답 적절성 · 대화 이해 · 빈칸<br>'+
      '• 합격선 <b>'+(PASS*100)+'%</b>, 틀린 문제만 재시험</div>'+
      '<div class="btns"><button class="b b4" style="font-size:18px;padding:16px 32px" onclick="startExam()">🚀 시험 시작</button></div>';
  }
  var idxs=examActive;
  var answered=idxs.filter(function(i){return examPick[i]>=0;}).length;
  var h='<div class="intro">💡 <b>⑤ 종합 시험</b> '+(examActive.length<examQs.length?'(재시험)':'')+'</div>'+
    '<div class="bar"><div style="width:'+Math.round(answered/idxs.length*100)+'%"></div></div>'+
    '<div class="score">진행: '+answered+' / '+idxs.length+'</div>';
  idxs.forEach(function(qi){
    var q=examQs[qi];
    h+='<div class="qcard"><div class="qnum">문제 '+(qi+1)+' · '+esc(q.kind)+'</div>'+
      '<div class="qsent">'+q.prompt+' '+(q.say?sp(q.say,true):'')+'</div>';
    q.opts.forEach(function(o,j){
      var cls='';
      if(examGraded){if(j===q.ans)cls=' correct';else if(j===examPick[qi])cls=' wrong';}
      else if(j===examPick[qi])cls=' pick';
      h+='<button class="opt'+cls+'" onclick="pickExam('+qi+','+j+')"><span>'+String.fromCharCode(9312+j)+' '+esc(o)+'</span>'+(/[a-z]/i.test(o)?'<span class="ospk">'+sp(o,true)+'</span>':'')+'</button>';
    });
    if(examGraded)h+='<div class="ansbox show">'+esc(q.why)+'</div>';
    h+='</div>';
  });
  if(!examGraded){
    h+='<div class="btns"><button class="b b4" style="font-size:18px;padding:16px 36px" onclick="gradeExam()">📝 채점하기</button></div>';
  }else{
    var correct=idxs.filter(function(i){return examPick[i]===examQs[i].ans;}).length;
    var total=idxs.length,pct=Math.round(correct/total*100),passed=correct/total>=PASS;
    var wrong=idxs.filter(function(i){return examPick[i]!==examQs[i].ans;});
    h+='<div class="result"><div class="score-big">'+correct+' / '+total+'</div>'+
      '<div class="verdict '+(passed?'pass':'fail')+'">'+(passed?'🎉 합격!':'📚 불합격')+' · '+pct+'%</div>'+
      '<div class="btns">'+
        (wrong.length?'<button class="b b4" onclick="retryWrong()">🔁 틀린 '+wrong.length+'문제 다시</button>':'')+
        '<button class="b b1" onclick="startExam()">🆕 새 문제</button>'+
      '</div></div>';
    window._examWrong=wrong;
  }
  return h;
}
function startExam(){examQs=makeExam();examPick=examQs.map(function(){return -1;});examGraded=false;examActive=examQs.map(function(_,i){return i;});render();window.scrollTo({top:0,behavior:'smooth'});}
function pickExam(qi,j){if(examGraded)return;examPick[qi]=j;render();}
function gradeExam(){
  var un=examActive.filter(function(i){return examPick[i]<0;});
  if(un.length){alert('아직 안 푼 문제가 '+un.length+'개 있어요.');return;}
  examGraded=true;render();
}
function retryWrong(){
  var w=window._examWrong||[];
  w.forEach(function(i){examPick[i]=-1;});
  examActive=w;examGraded=false;render();window.scrollTo({top:0,behavior:'smooth'});
}

buildSteps();render();
</script>
