<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>뮤엠 학부모 상담 진단 콘솔</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gothic+A1:wght@600;700;800;900&family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#EBEEEA;--surface:#fff;--surface2:#F6F8F5;--ink:#1E2C34;--soft:#5C6B71;--line:#DDE3DD;--accent:#1F7A6B;--accent2:#E1F0EB;--gold:#B0831A;--gold2:#FBF1D9;--red:#C0392B;--red2:#FBE6E2;--blue:#2C5E8C;--blue2:#E3EDF6;--r:14px;--shadow:0 1px 3px rgba(30,44,52,.06),0 8px 24px rgba(30,44,52,.05)}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'IBM Plex Sans KR',sans-serif;background:var(--bg);color:var(--ink);line-height:1.55}
.app{max-width:920px;margin:0 auto;padding:20px 16px 80px}
.mono{font-family:'IBM Plex Mono',monospace}
header{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;margin-bottom:14px}
h1{font-family:'Gothic A1',sans-serif;font-weight:900;font-size:1.45rem}
.sub{font-size:.82rem;color:var(--soft);margin-top:4px}
.pill{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:7px 13px;font-weight:700;font-size:.8rem;box-shadow:var(--shadow);cursor:pointer}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 16px}
.tab{font-family:inherit;border:1px solid var(--line);background:#fff;color:var(--soft);border-radius:11px;padding:10px 14px;cursor:pointer;font-weight:800;font-size:.9rem}
.tab.active{background:var(--accent);border-color:var(--accent);color:#fff}
.btn{font-family:inherit;border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:11px;padding:11px 15px;cursor:pointer;font-weight:700;font-size:.9rem}
.btn:hover{border-color:var(--soft)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.gold{background:var(--gold);border-color:var(--gold);color:#fff}
.btn.ghost{background:var(--surface2)}
.btn.small{padding:6px 10px;font-size:.8rem;border-radius:9px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.view{display:none}.view.active{display:block}
/* wizard */
.wizWrap{padding:20px}
.progress{display:flex;gap:6px;margin-bottom:18px}
.pdot{flex:1;height:6px;border-radius:99px;background:var(--line)}
.pdot.on{background:var(--accent)}
.qtitle{font-family:'Gothic A1',sans-serif;font-weight:900;font-size:1.2rem;margin-bottom:4px}
.qhint{font-size:.84rem;color:var(--soft);margin-bottom:16px}
.opts{display:grid;gap:9px}
.opts.two{grid-template-columns:1fr 1fr}
.opts.grid{grid-template-columns:repeat(auto-fill,minmax(92px,1fr))}
.opt{font-family:inherit;text-align:left;border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:13px 15px;cursor:pointer;font-weight:700;font-size:.95rem;transition:.12s}
.opt:hover{border-color:var(--accent);background:var(--accent2)}
.opt.sel{border-color:var(--accent);background:var(--accent2);box-shadow:inset 0 0 0 1px var(--accent)}
.opt small{display:block;font-weight:500;color:var(--soft);font-size:.78rem;margin-top:3px}
.opt.center{text-align:center}
.wizNav{display:flex;justify-content:space-between;gap:8px;margin-top:20px}
/* result */
.resHead{padding:20px 20px 0}
.kicker{font-weight:800;color:var(--accent);font-size:.82rem;letter-spacing:.02em}
.resTitle{font-family:'Gothic A1',sans-serif;font-weight:900;font-size:1.45rem;margin:2px 0 14px;line-height:1.3}
.block{padding:0 20px 20px}
.sechead{font-family:'Gothic A1',sans-serif;font-weight:800;font-size:1.02rem;margin:18px 0 9px;display:flex;align-items:center;gap:7px}
.sechead .dot{width:8px;height:8px;border-radius:99px;background:var(--accent)}
.road{border-left:2px solid var(--accent2);margin-left:6px;padding-left:16px}
.stage{position:relative;padding:9px 0}
.stage::before{content:'';position:absolute;left:-23px;top:14px;width:11px;height:11px;border-radius:99px;background:#fff;border:2.5px solid var(--accent)}
.stage.now::before{background:var(--accent)}
.stage .nm{font-weight:800}
.stage .meta{font-size:.82rem;color:var(--soft);font-family:'IBM Plex Mono',monospace}
.stage.now .nm{color:var(--accent)}
.script{background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:14px 16px;font-size:.95rem;white-space:pre-wrap;line-height:1.7}
.script b{color:var(--accent)}
.tagrow{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.tag{background:var(--accent2);color:var(--accent);border-radius:99px;padding:3px 10px;font-size:.76rem;font-weight:800}
.tag.gold{background:var(--gold2);color:var(--gold)}
.tag.blue{background:var(--blue2);color:var(--blue)}
.note{font-size:.82rem;color:var(--soft);background:var(--gold2);border:1px solid #EBD9A8;border-radius:10px;padding:10px 12px;margin-top:10px}
.note b{color:var(--gold)}
/* demo */
.demoGrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:640px){.demoGrid{grid-template-columns:1fr}.opts.two{grid-template-columns:1fr}}
.demoCard{padding:16px;cursor:pointer;transition:.12s}
.demoCard:hover{border-color:var(--accent);transform:translateY(-1px)}
.demoCard .lv{font-family:'Gothic A1',sans-serif;font-weight:900;font-size:1.08rem}
.demoCard .ds{font-size:.83rem;color:var(--soft);margin-top:4px}
.swatch{width:26px;height:26px;border-radius:8px;display:inline-block;vertical-align:middle;margin-right:8px;border:1px solid rgba(0,0,0,.08)}
.qcard{padding:16px 18px;margin-bottom:11px}
.qcard . qn{}
.qn{font-weight:800;margin-bottom:11px;font-size:.97rem}
.qn .idx{display:inline-flex;width:24px;height:24px;border-radius:7px;background:var(--accent2);color:var(--accent);font-family:'IBM Plex Mono',monospace;font-weight:700;align-items:center;justify-content:center;margin-right:8px;font-size:.82rem}
.choices{display:grid;gap:7px}
.choice{font-family:inherit;text-align:left;border:1.5px solid var(--line);background:#fff;border-radius:10px;padding:11px 13px;cursor:pointer;font-weight:600;font-size:.93rem;display:flex;align-items:center;gap:8px}
.choice:hover{border-color:var(--accent)}
.choice.right{border-color:var(--accent);background:var(--accent2);color:var(--accent);font-weight:800}
.choice.wrong{border-color:var(--red);background:var(--red2);color:var(--red)}
.choice .em{font-size:1.4rem}
.fb{margin-top:9px;font-size:.86rem;border-radius:9px;padding:9px 12px;display:none}
.fb.show{display:block}
.fb.ok{background:var(--accent2);color:var(--accent)}
.fb.no{background:var(--red2);color:var(--red)}
.listen{display:inline-flex;align-items:center;gap:7px;border:1.5px solid var(--accent);background:var(--accent2);color:var(--accent);border-radius:11px;padding:9px 15px;font-weight:800;font-size:.95rem;cursor:pointer;margin-bottom:10px;font-family:inherit}
.listen:hover{background:var(--accent);color:#fff}
.blankword{font-family:'IBM Plex Mono',monospace;font-weight:700;font-size:1.5rem;letter-spacing:.06em;margin:6px 0 12px;text-align:center}
.blankword .bk{display:inline-block;min-width:42px;border-bottom:3px solid var(--gold);color:var(--gold)}
.vowelpick{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.vbtn{font-family:'IBM Plex Mono',monospace;font-weight:700;font-size:1.05rem;border:1.5px solid var(--line);background:#fff;border-radius:10px;padding:9px 16px;cursor:pointer}
.vbtn:hover{border-color:var(--accent)}
.vbtn.right{border-color:var(--accent);background:var(--accent2);color:var(--accent)}
.vbtn.wrong{border-color:var(--red);background:var(--red2);color:var(--red)}
.demoTop{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.demoTop h2{font-family:'Gothic A1',sans-serif;font-weight:900;font-size:1.25rem}
.audioWarn{font-size:.78rem;color:var(--soft);background:var(--surface2);border:1px solid var(--line);border-radius:9px;padding:8px 11px;margin-bottom:12px}
/* faq */
.faq{margin-bottom:9px;overflow:hidden}
.faqQ{padding:14px 16px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:10px;font-weight:800;font-size:.96rem}
.faqQ .star{color:var(--gold);font-size:.78rem;font-weight:800}
.faqA{display:none;padding:0 16px 16px;font-size:.93rem;line-height:1.7;color:var(--ink)}
.faq.open .faqA{display:block}
.faqA b{color:var(--accent)}
.bandlabel{font-family:'Gothic A1',sans-serif;font-weight:800;color:var(--soft);font-size:.85rem;margin:18px 0 8px}
/* ops */
.opsgrid{display:grid;grid-template-columns:1fr 1fr;gap:11px}
@media(max-width:640px){.opsgrid{grid-template-columns:1fr}}
.opsCard{padding:15px 17px}
.opsCard .t{font-family:'Gothic A1',sans-serif;font-weight:800;font-size:.95rem;margin-bottom:6px;color:var(--accent)}
.opsCard ul{list-style:none;font-size:.9rem}
.opsCard li{padding:4px 0;padding-left:16px;position:relative}
.opsCard li::before{content:'·';position:absolute;left:4px;color:var(--accent);font-weight:900}
.opsCard li b{color:var(--ink)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;border-radius:11px;padding:11px 18px;font-weight:800;font-size:.88rem;opacity:0;pointer-events:none;transition:.2s;z-index:80}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.foot{text-align:center;color:var(--soft);font-size:.76rem;margin-top:22px}
</style>
</head>
<body>
<div class="app">
<header>
  <div><h1 id="acName">뮤엠 영어</h1><div class="sub">학부모 상담 진단 콘솔 · 설명 → 진단 → 시연 · 초1~중3 학부모 맞춤</div></div>
  <span class="pill" onclick="editName()">학원명 수정</span>
</header>

<div class="tabs">
  <button class="tab active" data-v="diag" onclick="goTab('diag')">진단 상담</button>
  <button class="tab" data-v="demo" onclick="goTab('demo')">레벨 시연</button>
  <button class="tab" data-v="faq" onclick="goTab('faq')">걱정 Q&amp;A</button>
  <button class="tab" data-v="ops" onclick="goTab('ops')">운영 안내</button>
</div>

<!-- ============ 진단 상담 ============ -->
<section id="v-diag" class="view active">
  <div class="card" id="wizCard"></div>
</section>

<!-- ============ 레벨 시연 ============ -->
<section id="v-demo" class="view">
  <div id="demoHome"></div>
  <div id="demoDetail" style="display:none"></div>
</section>

<!-- ============ 걱정 Q&A ============ -->
<section id="v-faq" class="view"><div id="faqBox"></div></section>

<!-- ============ 운영 안내 ============ -->
<section id="v-ops" class="view"><div id="opsBox"></div></section>

<p class="foot">상담 흐름: ① 학부모 걱정을 듣고 → ② 진단(시작 레벨·로드맵) → ③ 그 걱정을 뮤엠 시스템으로 해소 → ④ 해당 레벨 수업 시연.</p>
</div>
<div id="toast" class="toast"></div>

<script>
/* ===================== 데이터 ===================== */
const LEVELS=[
 {id:'white',  nm:'화이트',     full:'화이트 (파닉스·그래마·커뮤니케이션 6권)', color:'#9aa0a6', months:12, demo:'phonics'},
 {id:'yellow', nm:'옐로우',     full:'옐로우 (2,000+ 프레이즈·청크)',           color:'#E8B91F', months:8,  demo:'yellow'},
 {id:'pink',   nm:'핑크',       full:'핑크 (전학년 교과 내용 스피킹)',          color:'#E27FA6', months:5,  demo:'pink'},
 {id:'greenblue',nm:'그린·블루',full:'그린·블루 (에세이 라이팅)',              color:'#3FA15C', months:12, demo:'greenblue'},
 {id:'redblack',nm:'레드·블랙', full:'레드·블랙 (사회 이슈 디베이트 라이팅)',   color:'#C0392B', months:12, demo:'redblack'},
 {id:'middle', nm:'중등 커리',  full:'중등 강동미나 내신 커리 (구글클래스+1:1직강+서술형 모의)', color:'#2C5E8C', months:null, demo:'middle'},
 {id:'grammar',nm:'문법 8권',   full:'문법 8권 (센텐스·프레이즈 빌드업)',        color:'#7A5BB0', months:null, demo:'grammar'},
];
function lv(id){return LEVELS.find(l=>l.id===id)}

// 학년 숫자화 (초1=1 ... 중3=9)
const GRADES=['초1','초2','초3','초4','초5','초6','중1','중2','중3'];
function gnum(g){return GRADES.indexOf(g)+1}
function gname(n){if(n<1)return '미취학';if(n<=9)return GRADES[n-1];return '고등 연계';}

/* ===================== 진단 위저드 상태 ===================== */
let wiz={step:0, grade:null, exp:null, phonics:null, worry:null, goal:null};
const STEPS=['grade','exp','phonics','worry','goal','result'];

function band(g){const n=gnum(g);if(n<=3)return 'low';if(n<=6)return 'mid';return 'high';}

const WORRIES={
 low:[
  ['fun','영어를 싫어하게 되지 않을까','거부감 없이 흥미부터'],
  ['phonics_time','파닉스 떼는 데 얼마나 걸리나','읽기 독립 시점'],
  ['exposure','집에서 노출이 부족한데 괜찮나','학원 내 노출량'],
  ['late','또래보다 늦게 시작한 건 아닌지','시작 시점 걱정'],
 ],
 mid:[
  ['toolate','지금 시작이 너무 늦지 않았나','초4~5 시작'],
  ['exam_prep','중등 내신·문법 대비가 되나','내신 연결'],
  ['reading','리딩·어휘가 제대로 늘까','읽기·단어'],
  ['speaking','회화도 같이 잡히나','말하기'],
 ],
 high:[
  ['naesin','내신·수행평가를 챙겨주나','내신·수행'],
  ['seosul','서술형·모의고사 대비가 되나','서술형·모의'],
  ['suneung','수능까지 연결되나','입시 연결'],
  ['homework','숙제량이 너무 버겁지 않을까','학습량'],
  ['weakbase','기초가 약한데 따라갈 수 있나','기초 보강'],
 ],
};

const GOALS=[
 ['interest','흥미·기초부터','즐겁게 영어와 친해지기'],
 ['balanced','회화·읽기·쓰기 균형','전반적 실력'],
 ['naesin','내신·서술형 대비','학교 시험 중심'],
 ['ipsi','수능·입시까지','장기 입시 로드맵'],
];

/* ===== 걱정별 상담 스크립트 (원장 말하기용) ===== */
const SCRIPT={
 fun:`처음 영어를 만나는 시기엔 "잘하느냐"보다 "싫어지지 않느냐"가 훨씬 중요하죠. 뮤엠 화이트는 파닉스를 그냥 음가만 외우게 하지 않아요. <b>듣기 버튼을 누르고 소리를 직접 고르고, 단어를 그림과 매칭</b>하는 식이라 아이가 게임처럼 참여합니다. 그래서 "공부"로 느끼기 전에 영어가 먼저 익숙해져요.`,
 phonics_time:`파닉스를 빨리 끝내는 게 목표가 아니라, <b>오래 가져가는 게 저희 전략</b>이에요. 화이트는 파닉스 6권에 그래마·커뮤니케이션을 엮어, 음가를 읽기·문법·말하기로 확장하면서 약 1년에 걸쳐 단단하게 굳힙니다. 빨리 떼고 무너지는 게 아니라, 다음 레벨(옐로우 청크, 라이팅)에서 흔들리지 않는 뿌리를 만드는 거예요.`,
 exposure:`집 노출이 적어도 괜찮습니다. 저희는 <b>주 4회·매일 같은 리듬</b>으로 오니까 노출이 학원 안에서 규칙적으로 쌓여요. 화이트의 듣기 기반 수업은 매 차시 귀로 영어를 흘려보내는 구조라, 가정 환경에 덜 의존합니다.`,
 late:`이 또래는 "늦었다"가 거의 없어요. 오히려 <b>저희가 추천하는 시작 시점이 초4~5</b>일 만큼, 이 나이대는 흡수가 빠릅니다. 빠른 친구는 초1에 시작해 잘 따라오지만, 늦게 와도 화이트부터 차근히 밟으면 충분히 자리 잡아요.`,

 toolate:`전혀 늦지 않았어요. <b>저희가 가장 추천하는 시작 시점이 바로 초4~5</b>입니다. 이 나이대는 이해력이 받쳐줘서 화이트~옐로우를 더 빠르게 흡수하고, 그대로 가면 중등 내신 타이밍에 정확히 맞아떨어집니다.`,
 exam_prep:`네, 색깔 레벨이 끝이 아니라 <b>문법 8권(센텐스·프레이즈 빌드업)</b>으로 문장을 직접 쌓는 훈련을 하고, 초5부터는 제가 직접 설계한 중등 내신 커리로 들어갑니다. 구글클래스로 교과를 6개 파트로 나눠 개념을 다지고 1:1 직강으로 이어지니, 중등 내신·문법이 자연스럽게 준비돼요.`,
 reading:`화이트부터 <b>리딩 시리즈를 함께</b> 가져가고, 옐로우에서 2,000개 이상의 프레이즈·청크를 쌓습니다. 단어를 낱개로 외우는 게 아니라 덩어리로 익히기 때문에 읽기 속도와 어휘가 같이 올라가요.`,
 speaking:`핑크 단계가 바로 <b>전학년 교과 내용을 영어 스피킹으로</b> 풀어내는 과정이에요. 읽고 쓰는 것과 따로 노는 회화가 아니라, 배운 내용을 말로 출력하는 구조라 회화가 실제 실력과 붙어서 늘어납니다.`,

 naesin:`초5부터 들어가는 <b>중등 내신 커리</b>가 핵심이에요. 구글클래스로 교과를 6개 파트로 나눠 개념을 잡고, 1:1 직강으로 개별 약점을 메우며, 문제집 2권을 교차로 풀어 학교 시험 유형에 적응시킵니다. 모의고사도 그 문법 수업을 바탕으로 제작돼 수행·내신과 결이 맞아요.`,
 seosul:`저희 <b>모든 모의고사는 서술형으로 제작</b>됩니다. 구글클래스에서 들은 문법 수업을 바탕으로 만든 시리즈라 한 달에 한 번 치르며 레벨을 진단하고, 서술형 약점을 매달 데이터로 잡아요. 요즘 내신이 서술형 비중이 큰데 거기에 정조준돼 있습니다.`,

 homework:`학습량은 적지 않지만 <b>혼자 떠안기지 않게</b> 설계돼 있어요. 오자마자 타이머로 단어를 끝내고(중1·2 통합교과 / 중3 교과+백백영), 개념은 구글클래스 영상으로 미리, 어려운 부분은 1:1 직강으로 그 자리에서 해결합니다. 집에서 끙끙대는 양을 학원이 가져가는 구조예요.`,

const GOAL_LINE={
 interest:'지금은 흥미와 기초가 1순위라, 화이트의 듣기·게임형 수업으로 "영어가 좋아지는" 경험부터 만들어 드릴게요.',
 balanced:'회화(핑크)·읽기(리딩·옐로우)·쓰기(그린~블랙)가 한 흐름으로 이어지는 구조라 균형 있게 성장합니다.',
 naesin:'내신·서술형이 목표시면 문법 8권 → 중등 커리 → 서술형 모의고사 라인이 정확히 그 지점을 겨냥합니다.',
 ipsi:'장기 입시까지 보시면, 디베이트 라이팅과 중등 커리·백백영단어가 수능 독해·어법으로 이어지는 로드맵을 그려 드릴 수 있어요.',
};

/* ===================== 위저드 렌더 ===================== */
function renderWiz(){
 const c=document.getElementById('wizCard');
 const cur=STEPS[wiz.step];
 if(cur==='result'){renderResult();return;}
 let prog='<div class="progress">'+STEPS.slice(0,5).map((s,i)=>`<div class="pdot ${i<=wiz.step?'on':''}"></div>`).join('')+'</div>';
 let body='';
 if(cur==='grade'){
  body=`<div class="qtitle">학생 학년이 어떻게 되나요?</div><div class="qhint">상담 첫 질문 — 학년이 진단의 기준이 됩니다.</div>
   <div class="opts grid">${GRADES.map(g=>`<button class="opt center ${wiz.grade===g?'sel':''}" onclick="pick('grade','${g}')">${g}</button>`).join('')}</div>`;
 }
 if(cur==='exp'){
  body=`<div class="qtitle">${wiz.grade} · 지금까지 영어 학습 경험은요?</div><div class="qhint">"어디서부터 시작하느냐"를 가르는 핵심 질문입니다.</div>
   <div class="opts">
    <button class="opt ${wiz.exp==='new'?'sel':''}" onclick="pick('exp','new')">처음이에요 / 거의 안 했어요<small>알파벳·파닉스 단계부터</small></button>
    <button class="opt ${wiz.exp==='other'?'sel':''}" onclick="pick('exp','other')">다른 학원·교습을 받았어요<small>기초가 어느 정도 있음 → 레벨 테스트로 배치</small></button>
    <button class="opt ${wiz.exp==='current'?'sel':''}" onclick="pick('exp','current')">우리 학원 재원생이에요<small>현재 레벨에서 이어가기</small></button>
   </div>`;
 }
 if(cur==='phonics'){
  if(wiz.exp!=='new'){wiz.step++;renderWiz();return;}
  body=`<div class="qtitle">파닉스(읽기)는 어느 정도인가요?</div><div class="qhint">처음 시작하는 학생의 출발선을 잡습니다.</div>
   <div class="opts">
    <button class="opt ${wiz.phonics==='none'?'sel':''}" onclick="pick('phonics','none')">거의 모름 (알파벳도 익히는 중)</button>
    <button class="opt ${wiz.phonics==='alpha'?'sel':''}" onclick="pick('phonics','alpha')">알파벳·소릿값은 좀 알아요</button>
    <button class="opt ${wiz.phonics==='some'?'sel':''}" onclick="pick('phonics','some')">간단한 단어는 읽어요</button>
   </div>`;
 }
 if(cur==='worry'){
  const ws=WORRIES[band(wiz.grade)];
  body=`<div class="qtitle">학원을 보내며 가장 큰 걱정·고민은요?</div><div class="qhint">이게 상담의 중심입니다. 듣고, 뮤엠 시스템으로 답해 드릴게요.</div>
   <div class="opts">${ws.map(w=>`<button class="opt ${wiz.worry===w[0]?'sel':''}" onclick="pick('worry','${w[0]}')">${w[1]}<small>${w[2]}</small></button>`).join('')}</div>`;
 }
 if(cur==='goal'){
  body=`<div class="qtitle">바라시는 목표에 가장 가까운 건요?</div><div class="qhint">진단 멘트의 방향을 맞춥니다.</div>
   <div class="opts">${GOALS.map(g=>`<button class="opt ${wiz.goal===g[0]?'sel':''}" onclick="pick('goal','${g[0]}')">${g[1]}<small>${g[2]}</small></button>`).join('')}</div>`;
 }
 const canNext=wiz[cur]!=null;
 const nav=`<div class="wizNav">
   <button class="btn ghost" onclick="wizBack()" ${wiz.step===0?'disabled':''}>← 이전</button>
   <button class="btn primary" onclick="wizNext()" ${canNext?'':'disabled'}>${wiz.step===4?'진단 결과 보기 →':'다음 →'}</button>
 </div>`;
 c.innerHTML=`<div class="wizWrap">${prog}${body}${nav}</div>`;
}
function pick(k,v){wiz[k]=v;renderWiz();}
function wizNext(){if(wiz.step<5){wiz.step++;renderWiz();}}
function wizBack(){if(wiz.step>0){wiz.step--;if(STEPS[wiz.step]==='phonics'&&wiz.exp!=='new')wiz.step--;renderWiz();}}
function wizReset(){wiz={step:0,grade:null,exp:null,phonics:null,worry:null,goal:null};renderWiz();}

/* ===== 배치 로직 ===== */
function place(){
 const n=gnum(wiz.grade);
 if(wiz.exp==='other'){
  // 레벨테스트 배치 추정
  let range = n<=3?'화이트 후반 ~ 옐로우':n<=6?'옐로우 ~ 그린·블루':'문법 8권 ~ 중등 커리';
  return {start:null, label:'레벨 테스트 후 배치', range, testFirst:true};
 }
 if(wiz.exp==='current'){
  return {start:null, label:'현재 레벨에서 이어가기', range:'재원 레벨 기준 다음 단계', testFirst:false, current:true};
 }
 // new
 return {start:'white', label:'화이트 (파닉스) 시작', testFirst:false};
}

/* ===== 로드맵 빌드 ===== */
function buildRoad(startId){
 const order=['white','yellow','pink','greenblue','redblack','middle'];
 let idx=order.indexOf(startId); if(idx<0)idx=0;
 let g=gnum(wiz.grade), acc=0, rows=[];
 for(let i=idx;i<order.length;i++){
  const L=lv(order[i]);
  const atGrade=gname(Math.round(g+acc/12));
  rows.push({L, when:acc===0?'지금 시작':`약 ${acc}개월 후`, grade:atGrade, now:i===idx});
  if(L.months)acc+=L.months;
 }
 return rows;
}

function renderResult(){
 const c=document.getElementById('wizCard');
 const p=place();
 const wkey=wiz.worry, script=SCRIPT[wkey]||'';
 const goalLine=GOAL_LINE[wiz.goal]||'';
 const n=gnum(wiz.grade);

 // 로드맵
 let roadHtml='';
 if(p.start){
  const rows=buildRoad(p.start);
  roadHtml=`<div class="road">${rows.map(r=>`<div class="stage ${r.now?'now':''}">
    <div class="nm"><span class="swatch" style="background:${r.L.color}"></span>${r.L.full}</div>
    <div class="meta">${r.when}${r.L.months?' · '+r.L.months+'개월':''} · 예상 ${r.grade}</div>
   </div>`).join('')}</div>
   <div class="note">기간은 평균 진도 기준 추정이에요. 빠른 친구는 초1에 시작해 더 앞서가고, 시작 시점·집중도에 따라 달라집니다. <b>정확한 배치는 레벨 테스트로 확정</b>합니다.</div>`;
 } else if(p.testFirst){
  roadHtml=`<div class="script"><b>레벨 테스트</b>로 정확한 출발선을 먼저 잡습니다. 리딩·문법·단어·인터뷰로 빈 곳을 진단해 배치해요.<br>현재 학년 기준 예상 배치 범위: <b>${p.range}</b></div>
  <div class="note">아래 <b>레벨 시연</b> 탭의 문항이 곧 미니 레벨 테스트예요. 학부모님께 직접 풀려보며 현재 수준을 함께 확인하실 수 있습니다.</div>`;
 } else {
  roadHtml=`<div class="script">재원생은 현재 레벨에서 다음 단계로 이어집니다. 체크업 시험과 월 1회 모의고사 데이터로 진급 시점을 판단해요.</div>`;
 }

 // 늦은 시작 보강 노트
 let lateNote='';
 if(wiz.exp==='new' && n>=7){
  lateNote=`<div class="note"><b>중등 늦은 시작:</b> 화이트부터 시작하되, 이해력이 받쳐주는 나이라 파닉스를 빠르게 통과합니다. 1:1 직강으로 진도를 압축해 또래 레벨까지 따라잡는 보강 트랙을 함께 운영해요. <i>(원장님 정책에 맞게 이 문구는 수정해 주세요.)</i></div>`;
 }

 // 운영 요약 (밴드)
 let opsLine='';
 if(n<=3){opsLine=`저학년은 한 반 최대 7~8명, 주 4회·1시간이에요. 초2는 3시부·4시부 가능하고, 2시부는 3명 이상 모이면 개강합니다.`;}
 else if(n<=6){opsLine=`주 4회·1시간 수업이고, 레벨이 올라가면 문법 8권과 중등 커리로 이어집니다.`;}
 else{opsLine=`주 4회·1시간, 오자마자 단어 타이머 → 구글클래스 개념 → 1:1 직강 → 월 1회 서술형 모의고사 흐름입니다.`;}

 const demoTarget = p.start||'white';
 const demoBtn = p.start
   ? `<button class="btn gold" onclick="openDemo('${lv(demoTarget).demo}')">▶ ${lv(demoTarget).nm} 수업 시연하기</button>`
   : `<button class="btn gold" onclick="goTab('demo')">▶ 레벨 시연으로 직접 확인</button>`;

 c.innerHTML=`
  <div class="resHead">
   <div class="kicker">진단 결과 · ${wiz.grade}</div>
   <div class="resTitle">${p.label}</div>
   <div class="tagrow">
     <span class="tag">${WORRIES[band(wiz.grade)].find(w=>w[0]===wkey)?.[2]||'걱정'}</span>
     <span class="tag gold">${GOALS.find(g=>g[0]===wiz.goal)?.[1]||'목표'}</span>
     ${p.start?`<span class="tag blue">시작: ${lv(p.start).nm}</span>`:''}
   </div>
  </div>
  <div class="block">
   <div class="sechead"><span class="dot"></span>예상 학습 로드맵</div>
   ${roadHtml}
   ${lateNote}

   <div class="sechead"><span class="dot"></span>이 걱정에 대한 답 (상담 멘트)</div>
   <div class="script">${script}${goalLine?'\n\n'+goalLine:''}</div>

   <div class="sechead"><span class="dot"></span>운영 안내</div>
   <div class="script">${opsLine}</div>

   <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:20px">
     ${demoBtn}
     <button class="btn" onclick="goTab('faq')">관련 걱정 Q&amp;A 더보기</button>
     <button class="btn ghost" onclick="wizReset()">새 상담 시작</button>
   </div>
  </div>`;
}

function speak(t){
 if(!('speechSynthesis'in window)){toast('이 브라우저는 음성 재생을 지원하지 않아요');return;}
 window.speechSynthesis.cancel();
 const u=new SpeechSynthesisUtterance(t);
 u.lang='en-US';u.rate=.82;u.pitch=1;
 const vs=window.speechSynthesis.getVoices();
 const en=vs.find(v=>/en-US/i.test(v.lang))||vs.find(v=>/^en/i.test(v.lang));
 if(en)u.voice=en;
 window.speechSynthesis.speak(u);
}

function answer(btn,correct,fbId){
 const box=btn.parentElement;
 [...box.children].forEach(b=>b.style.pointerEvents='none');
 if(correct){btn.classList.add('right');}
 else{btn.classList.add('wrong');[...box.children].forEach(b=>{if(b.onclick&&/,1,/.test(b.getAttribute('onclick')))b.classList.add('right');});}
 const fb=document.getElementById(fbId);fb.classList.add('show');fb.classList.add(correct?'ok':'no');
}
function vowel(btn,correct,fbId,word){
 const box=btn.parentElement;
 [...box.children].forEach(b=>b.style.pointerEvents='none');
 if(correct){btn.classList.add('right');
   const bk=box.parentElement.querySelector('.bk');if(bk){bk.textContent=btn.textContent;bk.style.color='var(--accent)';bk.style.borderColor='var(--accent)';}
   speak(word);
 }else{btn.classList.add('wrong');[...box.children].forEach(b=>{if(/,1,/.test(b.getAttribute('onclick')))b.classList.add('right');});}
 const fb=document.getElementById(fbId);fb.classList.add('show');fb.classList.add(correct?'ok':'no');
}

  {q:'기초가 약한데 따라갈 수 있나요?',a:`<b>레벨 테스트로 빈 곳부터 진단</b>합니다. 파닉스가 비면 화이트부터, 문법이 비면 문법 8권부터 맞춤으로 시작하고, 1:1 직강으로 반 진도와 별개 보강이 가능해요.`},
 ]},
];
function renderFaq(){
 const box=document.getElementById('faqBox');
 box.innerHTML=FAQ.map((g,gi)=>`<div class="bandlabel">${g.band}</div>`+g.items.map((it,ii)=>`
  <div class="card faq" id="faq-${gi}-${ii}">
   <div class="faqQ" onclick="toggleFaq('faq-${gi}-${ii}')"><span>${it.q}</span><span>${it.star?'<span class="star">자주 받는 반박</span> ':''}＋</span></div>
   <div class="faqA">${it.a}</div>
  </div>`).join('')).join('');
}
function toggleFaq(id){document.getElementById(id).classList.toggle('open');}
