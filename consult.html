<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>원장 관리 콘솔</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gothic+A1:wght@600;700;800;900&family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#EBEEEA;--surface:#fff;--surface2:#F6F8F5;--ink:#1E2C34;--soft:#5C6B71;--line:#DDE3DD;--accent:#1F7A6B;--accent2:#E1F0EB;--gold:#B0831A;--gold2:#FBF1D9;--red:#C0392B;--red2:#FBE6E2;--mid:#C2891B;--mid2:#FBF0D7;--r:14px;--shadow:0 1px 3px rgba(30,44,52,.06),0 8px 24px rgba(30,44,52,.05)}
*{box-sizing:border-box;margin:0;padding:0}body{font-family:'IBM Plex Sans KR',sans-serif;background:var(--bg);color:var(--ink);line-height:1.55}.app{max-width:1100px;margin:0 auto;padding:20px 16px 70px}.mono{font-family:'IBM Plex Mono',monospace}
header{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;margin-bottom:14px}h1{font-family:'Gothic A1',sans-serif;font-weight:900;font-size:1.45rem}.sub{font-size:.82rem;color:var(--soft);margin-top:4px}.topBtns{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.pill{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:8px 13px;font-weight:700;font-size:.82rem;box-shadow:var(--shadow)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}.toolbar{display:flex;gap:9px;flex-wrap:wrap;margin:13px 0}.toolbar input,.toolbar select{font-family:inherit;border:1px solid var(--line);border-radius:11px;padding:10px 12px;background:#fff;font-size:.9rem}.toolbar input{flex:1;min-width:170px}.btn{font-family:inherit;border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:11px;padding:10px 13px;cursor:pointer;font-weight:700;font-size:.88rem}.btn:hover{border-color:var(--soft)}.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}.btn.danger{color:var(--red)}.btn.small{padding:5px 8px;border-radius:8px;font-size:.76rem}.btn.gold{background:var(--gold);border-color:var(--gold);color:#fff}.btn.arch{background:var(--mid2);border-color:#e0c97a;color:var(--mid)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:14px 0}.stat{padding:13px 15px}.stat .k{font-size:.76rem;color:var(--soft);font-weight:700}.stat .v{font-family:'IBM Plex Mono',monospace;font-size:1.75rem;font-weight:700;line-height:1.1}.stat .v small{font-size:.8rem;color:var(--soft)}@media(max-width:720px){.stats{grid-template-columns:repeat(2,1fr)}}
.rhythm{padding:15px;margin-bottom:12px}.rhythmHead{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-bottom:10px}.rhythmHead b{color:var(--accent)}.strip{display:grid;grid-template-columns:repeat(31,1fr);gap:3px}.day{height:26px;border-radius:5px;background:var(--surface2);font-size:.55rem;display:flex;align-items:center;justify-content:center;color:var(--soft)}.day.cp{background:var(--gold2);color:var(--gold);box-shadow:inset 0 0 0 1.5px var(--gold);font-weight:700}.day.today{background:var(--accent);color:#fff;box-shadow:0 0 0 3px var(--accent2)}
.group{margin-bottom:12px;overflow:hidden}.groupHead{display:flex;align-items:center;justify-content:space-between;padding:12px 15px;background:var(--surface2);border-bottom:1px solid var(--line);cursor:pointer}.groupTitle{font-weight:900;font-family:'Gothic A1',sans-serif}.groupMeta{font-size:.8rem;color:var(--soft);font-weight:700}.rows{display:block}.group.closed .rows{display:none}.row{display:grid;grid-template-columns:1.35fr .7fr .7fr .8fr 1fr 92px;gap:8px;align-items:center;padding:12px 15px;border-bottom:1px solid var(--line);cursor:pointer}.row:last-child{border-bottom:0}.row:hover{background:var(--surface2)}.name{font-weight:800}.gradeBadge{font-size:.72rem;border:1px solid var(--line);background:#fff;border-radius:8px;padding:2px 7px;margin-left:6px;color:var(--soft)}.chip{display:inline-flex;align-items:center;justify-content:center;border-radius:999px;padding:3px 9px;font-size:.74rem;font-weight:900}.risk-low{background:var(--accent2);color:var(--accent)}.risk-mid{background:var(--mid2);color:var(--mid)}.risk-high{background:var(--red2);color:var(--red)}.todo{background:var(--gold2);color:var(--gold)}.done{background:var(--accent2);color:var(--accent)}.met{font-family:'IBM Plex Mono',monospace;font-weight:700}.moveBtns{display:flex;gap:4px;justify-content:flex-end}.empty{padding:35px 20px;text-align:center;color:var(--soft)}
@media(max-width:760px){.row{grid-template-columns:1fr auto;grid-template-areas:'name risk' 'info move';gap:8px}.row .nameCell{grid-area:name}.row .riskCell{grid-area:risk;text-align:right}.row .infoCell{grid-area:info;display:flex;gap:10px;font-size:.82rem;color:var(--soft);flex-wrap:wrap}.row .moveBtns{grid-area:move}.hideMobile{display:none}.strip{grid-template-columns:repeat(16,1fr)}}
.scrim{position:fixed;inset:0;background:rgba(20,30,36,.42);opacity:0;pointer-events:none;transition:.2s;z-index:40}.scrim.open{opacity:1;pointer-events:auto}.panel{position:fixed;right:0;top:0;height:100%;width:490px;max-width:94vw;background:#fff;box-shadow:-10px 0 40px rgba(20,30,36,.18);transform:translateX(100%);transition:.24s;z-index:50;display:flex;flex-direction:column}.panel.open{transform:translateX(0)}.panelHead{padding:17px 18px;border-bottom:1px solid var(--line);display:flex;gap:8px;justify-content:space-between}.panelBody{padding:16px 18px;overflow:auto;flex:1}.panelFoot{border-top:1px solid var(--line);padding:13px 18px;display:flex;gap:8px;flex-wrap:wrap}.x{border:0;background:var(--surface2);border-radius:9px;width:34px;height:34px;cursor:pointer;font-size:1rem}.field{margin-bottom:15px}.field label{display:block;font-weight:800;color:var(--soft);font-size:.8rem;margin-bottom:6px}.field input,.field select,.field textarea{width:100%;font-family:inherit;border:1px solid var(--line);border-radius:10px;padding:9px 11px;font-size:.92rem}.field textarea{min-height:78px;resize:vertical}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:9px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.history{border:1px solid var(--line);border-radius:12px;overflow:hidden;max-height:400px;overflow-y:auto}.hitem{padding:10px 12px;border-bottom:1px solid var(--line);background:#fff}.hitem:last-child{border-bottom:0}.hdate{font-family:'IBM Plex Mono',monospace;font-weight:800;color:var(--accent);font-size:.82rem}.hnote{font-size:.86rem;white-space:pre-wrap;color:var(--ink);margin-top:4px}
/* year banner */
.yearBanner{display:flex;align-items:center;gap:10px;background:var(--mid2);border:1px solid #e0c97a;border-radius:12px;padding:10px 14px;margin-bottom:12px;font-weight:700;font-size:.9rem;color:var(--mid)}
.yearBanner span{flex:1}
/* archive modal */
.modal{position:fixed;inset:0;background:rgba(20,30,36,.5);display:flex;align-items:center;justify-content:center;z-index:90;padding:20px}
.modalBox{background:#fff;border-radius:16px;max-width:560px;width:100%;padding:22px;box-shadow:0 20px 60px rgba(0,0,0,.22);max-height:80vh;overflow-y:auto}
.modalHead{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.archRow{display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--line)}
.archRow:last-child{border-bottom:0}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;border-radius:11px;padding:11px 18px;font-weight:800;font-size:.88rem;opacity:0;pointer-events:none;transition:.2s;z-index:80}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
/* 커스텀 다이얼로그 */
.cf-overlay{position:fixed;inset:0;background:rgba(20,30,36,.5);z-index:200;display:flex;align-items:center;justify-content:center;padding:20px}
.cf-box{background:#fff;border-radius:16px;padding:22px 24px;max-width:400px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,.28)}
.cf-msg{font-weight:700;font-size:1rem;margin-bottom:6px;line-height:1.5}
.cf-sub{font-size:.84rem;color:var(--soft);margin-bottom:16px}
.cf-inp{width:100%;font-family:inherit;border:1.5px solid var(--line);border-radius:10px;padding:9px 12px;font-size:.95rem;margin-bottom:14px;color:var(--ink)}
.cf-inp:focus{outline:none;border-color:var(--accent)}
.cf-btns{display:flex;gap:8px;justify-content:flex-end}
</style>
</head>
<body>
<div class="app">
<header>
  <div><h1 id="academyName">○○영어학원</h1><div class="sub">원장 관리 콘솔 · 학생별 날짜 기록 누적 · 연도별 아카이브</div></div>
  <div class="topBtns">
    <span class="pill">총 <b id="totalTop" class="mono">0</b>명</span>
    <button class="btn arch" onclick="openArchiveModal()">📁 연도별 아카이브</button>
    <button class="btn" onclick="editAcademy()">학원명 수정</button>
  </div>
</header>

<div id="yearBannerArea"></div>
<section class="card rhythm" id="rhythm"></section>
<section class="stats" id="stats"></section>

<div class="toolbar">
  <input id="search" placeholder="학생 이름 검색" oninput="render()">
  <select id="gradeFilter" onchange="render()"><option value="">전체 학년</option></select>
  <button class="btn primary" onclick="addStudent()">+ 학생 추가</button>
  <button class="btn" onclick="addGrade()">+ 학년/반 추가</button>
  <button class="btn" onclick="expandAllGroups()">전체 펼치기</button>
  <button class="btn" onclick="collapseAllGroups()">전체 접기</button>
  <button class="btn" onclick="exportBackup()">백업 다운로드</button>
  <label class="btn" for="importFile">백업 복원</label>
  <input id="importFile" type="file" accept=".json" style="display:none" onchange="importBackup(event)">
</div>

<div id="groups"></div>
</div>

<div id="scrim" class="scrim" onclick="closePanel()"></div>
<aside id="panel" class="panel"></aside>
<div id="toast" class="toast"></div>
<div id="modalArea"></div>

<script>

/* ──── 커스텀 다이얼로그 (confirm/prompt 대체 — iframe 환경에서 native dialog 막힘) ──── */
function cfConfirm(msg, sub, onYes){
  const el=document.createElement('div'); el.className='cf-overlay';
  el.innerHTML=`<div class="cf-box"><div class="cf-msg">${msg}</div>${sub?`<div class="cf-sub">${sub}</div>`:''}<div class="cf-btns"><button class="btn" id="cfNo">취소</button><button class="btn danger" id="cfYes" style="background:var(--red2);border-color:var(--red)">삭제 확인</button></div></div>`;
  document.body.appendChild(el);
  el.querySelector('#cfNo').onclick=()=>el.remove();
  el.querySelector('#cfYes').onclick=()=>{el.remove();onYes();};
  el.addEventListener('click',e=>{if(e.target===el)el.remove();});
}
function cfPrompt(msg, defaultVal, onOk, okLabel='확인'){
  const el=document.createElement('div'); el.className='cf-overlay';
  el.innerHTML=`<div class="cf-box"><div class="cf-msg">${msg}</div><input class="cf-inp" id="cfInp" value="${esc(defaultVal||'')}"><div class="cf-btns"><button class="btn" id="cfNo">취소</button><button class="btn primary" id="cfOk">${okLabel}</button></div></div>`;
  document.body.appendChild(el);
  const inp=el.querySelector('#cfInp'); inp.focus(); inp.select();
  const ok=()=>{const v=inp.value.trim();if(v){el.remove();onOk(v);}else{inp.style.borderColor='var(--red)';}};
  el.querySelector('#cfNo').onclick=()=>el.remove();
  el.querySelector('#cfOk').onclick=ok;
  inp.addEventListener('keydown',e=>{if(e.key==='Enter')ok();if(e.key==='Escape')el.remove();});
  el.addEventListener('click',e=>{if(e.target===el)el.remove();});
}
/* ═══════════════════════════════════════════════
   스토리지 키 설계
   mgr:meta      → 학원명, 반 목록, collapsed 상태, 사용된 연도 목록
   mgr:students  → 학생 프로필 배열 (history 없음)
   mgr:rec:YYYY  → 해당 연도 전체 기록 {studentId: {"YYYY-MM-DD": {note,att,hw,score}}}
   ─────────────────────────────────────────────
   연도별로 분리 → 현재 연도만 메모리에, 과거 연도는 아카이브 조회 시 on-demand 로드
   학생 프로필(소용량)과 기록(대용량)을 분리해 각각 5MB 한도 여유 확보
═══════════════════════════════════════════════ */

const K_META     = 'mgr:meta';
const K_STUDENTS = 'mgr:students';
const K_REC = y  => 'mgr:rec:' + y;

const DEFAULT_GRADES = ['초1','초2','초3','초4','초5','초6','중1','중2','중3'];
const CUR_YEAR = new Date().getFullYear();

let meta = { academy:'○○영어학원', grades:[...DEFAULT_GRADES], collapsed:{}, years:[CUR_YEAR] };
let students = [];       // profile only, no history
let yearRecords = {};    // {sid: {"YYYY-MM-DD": {note,att,hw,score}}}
let viewYear = CUR_YEAR; // 현재 보고 있는 연도
let openId = null;

/* ──── 초기 샘플 ──── */
const SAMPLE = [
  {name:'김서연',grade:'중2',att:96,hw:88,mock:84,level:90,vocab:95,risk:'하',memo:'성실하고 단어 암기 우수.',checked:''},
  {name:'이준호',grade:'중1',att:74,hw:55,mock:62,level:68,vocab:60,risk:'상',memo:'결석·과제 누락 관리 필요.',checked:''},
  {name:'박지민',grade:'초6',att:90,hw:80,mock:0,level:75,vocab:82,risk:'중',memo:'기초 문법 보강 중.',checked:''},
];

/* ──── 유틸 ──── */
function uid(){ return 's'+Date.now().toString(36)+Math.random().toString(36).slice(2,6) }
function today(){ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0') }
function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;') }
function escAttr(s){ return String(s==null?'':s).replace(/\\/g,'\\\\').replace(/'/g,"\\'").replace(/"/g,'&quot;') }

/* ──── 스토리지 헬퍼 ──── */
async function stGet(key){ try{ const r=await window.storage.get(key,false); return (r&&r.value)?JSON.parse(r.value):null; }catch(e){ return null; } }
async function stSet(key,val){ try{ await window.storage.set(key,JSON.stringify(val),false); return true; }catch(e){ toast('저장 실패: '+key); return false; } }
async function stDel(key){ try{ await window.storage.delete(key,false); return true; }catch(e){ return false; } }

/* ──── 로드 ──── */
async function loadAll(){
  // meta
  const m = await stGet(K_META);
  if(m){ meta = { academy:'○○영어학원', grades:[...DEFAULT_GRADES], collapsed:{}, years:[CUR_YEAR], ...m }; }
  if(!meta.years) meta.years = [CUR_YEAR];
  if(!meta.grades||!meta.grades.length) meta.grades = [...DEFAULT_GRADES];
  if(!meta.collapsed) meta.collapsed = {};

  // students
  const st = await stGet(K_STUDENTS);
  if(st && Array.isArray(st)){
    students = st;
    students.forEach((s,i)=>{ if(!s.id)s.id=uid(); if(s.order==null)s.order=i+1; if(!s.checked)s.checked=''; });
  } else {
    students = SAMPLE.map((s,i)=>({...s, id:uid(), order:i+1}));
    await stSet(K_STUDENTS, students);
  }

  // 현재 연도 기록
  await loadYearRecords(CUR_YEAR);
}

async function loadYearRecords(year){
  const r = await stGet(K_REC(year));
  yearRecords = r || {};
  viewYear = year;
}

/* ──── 저장 ──── */
async function saveMeta(){ await stSet(K_META, meta); }
async function saveStudents(){ await stSet(K_STUDENTS, students); }
async function saveRecords(){ await stSet(K_REC(viewYear), yearRecords); }
async function saveAll(){ await saveMeta(); await saveStudents(); await saveRecords(); }

/* ──── 연도에 기록 추가 (연도 목록 갱신) ──── */
async function ensureYearRegistered(year){
  if(!meta.years.includes(year)){ meta.years.push(year); meta.years.sort(); await saveMeta(); }
}

/* ──── 기록 헬퍼 ──── */
function getHistory(sid){ return yearRecords[sid] || {}; }
function setRecord(sid, date, data){
  if(!yearRecords[sid]) yearRecords[sid] = {};
  if(data === null){ delete yearRecords[sid][date]; }
  else { yearRecords[sid][date] = data; }
}

/* ──── 반 그룹 순서 ──── */
function gradeOrder(g){ let i=meta.grades.indexOf(g); return i<0?999:i; }

/* ──── 체크포인트 ──── */
function checkpointInfo(){
  const d=new Date(),y=d.getFullYear(),m=d.getMonth(),day=d.getDate(),ld=new Date(y,m+1,0).getDate();
  let active,next,alabel,nlabel;
  if(day<15){ active=new Date(y,m,1); next=new Date(y,m,15); alabel=(m+1)+'월 초~중순'; nlabel=(m+1)+'월 15일'; }
  else{ active=new Date(y,m,15); next=new Date(y,m,ld); alabel=(m+1)+'월 중순~말'; nlabel=(m+1)+'월 말일'; }
  return{y,m,day,ld,active,next,alabel,nlabel,dday:Math.max(0,Math.ceil((next-new Date(y,m,day))/86400000))};
}
function isChecked(s){ if(!s.checked)return false; return new Date(s.checked)>=checkpointInfo().active; }

/* ──── 연도 배너 ──── */
function renderYearBanner(){
  const area = document.getElementById('yearBannerArea');
  if(viewYear === CUR_YEAR){ area.innerHTML=''; return; }
  area.innerHTML=`<div class="yearBanner">📁 <span>${viewYear}년 기록을 보고 있어요 — 수정은 가능하나 현재 학생 프로필과 별개로 저장됩니다</span><button class="btn small primary" onclick="switchYear(${CUR_YEAR})">현재(${CUR_YEAR})로 돌아가기</button></div>`;
}

/* ──── 렌더 ──── */
function renderAll(){ renderYearBanner(); renderGradeFilter(); renderRhythm(); render(); }

function renderGradeFilter(){
  const sel=document.getElementById('gradeFilter'); const cur=sel.value;
  sel.innerHTML='<option value="">전체 학년</option>'+meta.grades.map(g=>`<option value="${esc(g)}">${esc(g)}</option>`).join('');
  if(meta.grades.includes(cur)) sel.value=cur;
}

function renderRhythm(){
  const ci=checkpointInfo(); let cells='';
  for(let i=1;i<=ci.ld;i++){ let cls='day'; if(i===15||i===ci.ld)cls+=' cp'; if(i===ci.day&&viewYear===CUR_YEAR)cls+=' today'; cells+=`<div class="${cls}">${i}</div>`; }
  document.getElementById('rhythm').innerHTML=`<div class="rhythmHead"><b>이번 회차: ${ci.alabel}</b><span>다음 점검 ${ci.nlabel}까지 <b>D-${ci.dday}</b></span></div><div class="strip">${cells}</div>`;
  document.getElementById('academyName').textContent=meta.academy;
}

function renderStats(){
  const total=students.length, due=students.filter(s=>!isChecked(s)).length, high=students.filter(s=>s.risk==='상').length;
  const avg=total?Math.round(students.reduce((a,s)=>a+(+s.att||0),0)/total):0;
  const recCount=Object.values(yearRecords).reduce((a,h)=>a+Object.keys(h||{}).length,0);
  document.getElementById('stats').innerHTML=`<div class="card stat"><div class="k">총 학생</div><div class="v">${total}<small> 명</small></div></div><div class="card stat"><div class="k">점검 대상</div><div class="v" style="color:var(--gold)">${due}<small> 명</small></div></div><div class="card stat"><div class="k">위험도 상</div><div class="v" style="color:var(--red)">${high}<small> 명</small></div></div><div class="card stat"><div class="k">${viewYear}년 기록</div><div class="v">${recCount}<small> 건</small></div></div>`;
  document.getElementById('totalTop').textContent=total;
}

function groupedStudents(){
  let q=document.getElementById('search')?.value.trim()||''; let gf=document.getElementById('gradeFilter')?.value||'';
  let arr=students.filter(s=>(!q||s.name.includes(q))&&(!gf||s.grade===gf));
  arr.sort((a,b)=>gradeOrder(a.grade)-gradeOrder(b.grade)||(a.order||0)-(b.order||0));
  let map={}; arr.forEach(s=>{ let g=meta.grades.includes(s.grade)?s.grade:(meta.grades[0]||'초1'); (map[g]||(map[g]=[])).push(s); }); return map;
}

function render(){
  renderStats();
  const map=groupedStudents(); let html='';
  meta.grades.forEach(g=>{
    const arr=map[g]||[]; const closed=!!meta.collapsed[g];
    const avg=arr.length?Math.round(arr.reduce((a,s)=>a+(+s.att||0),0)/arr.length):0;
    const high=arr.filter(s=>s.risk==='상').length;
    const recCnt=arr.reduce((a,s)=>a+Object.keys(getHistory(s.id)).length,0);
    html+=`<section class="card group ${closed?'closed':''}">
      <div class="groupHead" onclick="toggleGroup('${escAttr(g)}')">
        <div style="flex:1;cursor:pointer"><span class="groupTitle">${closed?'▶':'▼'} ${esc(g)}</span> <span class="groupMeta">${arr.length}명${arr.length?' · 평균출결 '+avg+'% · 위험 '+high+'명 · '+viewYear+'년 기록 '+recCnt+'건':' · 비어 있음'}</span></div>
        <div style="display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end">
          <button class="btn small" onclick="event.stopPropagation();renameGrade('${escAttr(g)}')">반명 변경</button>
          <button class="btn small primary" onclick="event.stopPropagation();addStudent('${escAttr(g)}')">+ 이 반에 추가</button>
        </div>
      </div>
      <div class="rows">${arr.length?arr.map(s=>rowHtml(s)).join(''):'<div class="empty">이 학년에 등록된 학생이 없어요.</div>'}</div>
    </section>`;
  });
  document.getElementById('groups').innerHTML=html;
}

function rowHtml(s){
  const risk=s.risk==='상'?'risk-high':s.risk==='중'?'risk-mid':'risk-low';
  const recCnt=Object.keys(getHistory(s.id)).length;
  return `<div class="row" onclick="openPanel('${s.id}')">
    <div class="nameCell"><span class="name">${esc(s.name)}</span><span class="gradeBadge">${esc(s.grade||'기타')}</span></div>
    <div class="riskCell"><span class="chip ${risk}">${s.risk||'하'}</span></div>
    <div class="infoCell met">출결 ${s.att||0}%</div>
    <div class="infoCell met hideMobile">과제 ${s.hw||0}%</div>
    <div class="infoCell">
      <span class="chip ${isChecked(s)?'done':'todo'}">${isChecked(s)?'점검완료':'점검필요'}</span>
      ${recCnt?`<span style="font-size:.72rem;color:var(--soft)">기록 ${recCnt}건</span>`:''}
    </div>
    <div class="moveBtns" onclick="event.stopPropagation()">
      <button class="btn small" onclick="moveStudent('${s.id}',-1)">↑</button>
      <button class="btn small" onclick="moveStudent('${s.id}',1)">↓</button>
    </div>
  </div>`;
}

/* ──── 그룹 토글 ──── */
function toggleGroup(g){ meta.collapsed[g]=!meta.collapsed[g]; saveMeta(); render(); }
function expandAllGroups(){ meta.grades.forEach(g=>meta.collapsed[g]=false); saveMeta(); render(); toast('전체 학년을 펼쳤어요'); }
function collapseAllGroups(){ meta.grades.forEach(g=>meta.collapsed[g]=true); saveMeta(); render(); toast('전체 학년을 접었어요'); }

/* ──── 학생 순서 ──── */
function moveStudent(id,dir){
  const s=students.find(x=>x.id===id); if(!s)return;
  let same=students.filter(x=>x.grade===s.grade).sort((a,b)=>(a.order||0)-(b.order||0));
  let idx=same.findIndex(x=>x.id===id), j=idx+dir;
  if(j<0||j>=same.length)return;
  let tmp=same[idx].order; same[idx].order=same[j].order; same[j].order=tmp;
  saveStudents(); render(); toast('순서를 저장했어요');
}

/* ──── 학생 추가 ──── */
function addStudent(grade){
  let g=grade||document.getElementById('gradeFilter')?.value||meta.grades[0]||'초1';
  if(!meta.grades.includes(g)){ meta.grades.push(g); }
  meta.collapsed[g]=false;
  let max=Math.max(0,...students.filter(x=>x.grade===g).map(s=>s.order||0));
  let s={id:uid(),order:max+1,name:'새 학생',grade:g,att:0,hw:0,mock:0,level:0,vocab:0,risk:'하',memo:'',checked:''};
  students.push(s); saveStudents(); renderAll(); openPanel(s.id);
  setTimeout(()=>{ const inp=document.querySelector('#panel input'); if(inp){inp.focus();inp.select();} },60);
}

/* ──── 반 관리 ──── */
function addGrade(){
  cfPrompt('추가할 학년/반 이름을 입력하세요','예: 초1A, 중2 내신반',v=>{
    if(meta.grades.includes(v)){toast('이미 있는 학년/반이에요');return;}
    meta.grades.push(v); meta.collapsed[v]=false; saveMeta(); renderAll(); toast(v+' 그룹을 추가했어요');
  });
}
function renameGrade(oldName){
  cfPrompt('바꿀 반 이름을 입력하세요',oldName,next=>{
    if(next===oldName)return; if(meta.grades.includes(next)){toast('이미 있는 반 이름이에요');return;}
    let idx=meta.grades.indexOf(oldName); if(idx<0)return;
    meta.grades[idx]=next; students.forEach(s=>{if(s.grade===oldName)s.grade=next;});
    meta.collapsed[next]=meta.collapsed[oldName]||false; delete meta.collapsed[oldName];
    const sel=document.getElementById('gradeFilter'); if(sel&&sel.value===oldName)sel.value=next;
    saveMeta(); saveStudents(); renderAll(); toast('반 이름을 변경했어요: '+oldName+' → '+next);
  });
}

/* ──── 패널 열기 ──── */
function openPanel(id){
  openId=id; const s=students.find(x=>x.id===id); if(!s)return;
  const isArchive = viewYear !== CUR_YEAR;
  document.getElementById('panel').innerHTML=`
    <div class="panelHead">
      <div><b style="font-size:1.15rem">${esc(s.name)} ${isArchive?'<span style="color:var(--mid);font-size:.8rem">('+viewYear+'년 기록 보기)</span>':''}</b><div style="font-size:.78rem;color:var(--soft)">수정하면 자동 저장됩니다</div></div>
      <button class="x" onclick="closePanel()">✕</button>
    </div>
    <div class="panelBody">
      ${isArchive ? '' : profileFields(s)}
      ${isArchive ? `<div style="margin-bottom:12px;font-size:.86rem;color:var(--soft)">현재 학생 프로필 편집은 현재 연도에서만 가능합니다. <button class="btn small" onclick="switchYear(${CUR_YEAR});closePanel();setTimeout(()=>openPanel('${s.id}'),200)">현재로 전환</button></div>` : ''}
      <div class="field"><label>${viewYear}년 날짜별 기록 추가</label>
        <div class="grid2" style="margin-bottom:8px"><input id="recDate" type="date" value="${today()}"><div></div></div>
        <div class="grid3" style="margin-bottom:8px">
          <div class="field" style="margin:0"><label style="font-size:.72rem">출결</label><select id="recAtt"><option value="">-</option><option value="출석">출석</option><option value="결석">결석</option><option value="지각">지각</option><option value="조퇴">조퇴</option></select></div>
          <div class="field" style="margin:0"><label style="font-size:.72rem">과제</label><select id="recHw"><option value="">-</option><option value="제출">제출</option><option value="미제출">미제출</option><option value="부분제출">부분제출</option></select></div>
          <div class="field" style="margin:0"><label style="font-size:.72rem">점수</label><input id="recScore" type="number" placeholder="예: 85"></div>
        </div>
        <textarea id="recNote" placeholder="추가 메모 (학부모 상담, 특이사항 등)" style="margin-bottom:8px"></textarea>
        <button class="btn primary" onclick="saveDayRecord()">이 날짜 기록 저장</button>
      </div>
      <div class="field"><label>${viewYear}년 날짜별 누적 기록 <span id="recCount" style="color:var(--accent);font-size:.8rem"></span></label><div class="history" id="historyBox">${historyHtml(s.id)}</div></div>
    </div>
    <div class="panelFoot">
      ${isArchive ? '' : `<button class="btn primary" onclick="markChecked()">이번 회차 점검 완료</button>`}
      <button class="btn gold" onclick="makeReport()">리포트 복사</button>
      ${isArchive ? '' : `<button class="btn danger" onclick="deleteStudent()">삭제</button>`}
    </div>`;
  updateRecCount();
  document.getElementById('scrim').classList.add('open');
  document.getElementById('panel').classList.add('open');
}

function profileFields(s){
  return `
    <div class="grid2">
      <div class="field"><label>이름</label><input value="${esc(s.name)}" oninput="setF('name',this.value)"></div>
      <div class="field"><label>학년/반 그룹</label><select onchange="setF('grade',this.value,true)">${meta.grades.map(g=>`<option ${s.grade===g?'selected':''}>${esc(g)}</option>`).join('')}</select></div>
    </div>
    <div class="grid2">
      <div class="field"><label>출결률 (%)</label><input type="number" min="0" max="100" value="${s.att||0}" oninput="setF('att',+this.value)"></div>
      <div class="field"><label>과제 제출률 (%)</label><input type="number" min="0" max="100" value="${s.hw||0}" oninput="setF('hw',+this.value)"></div>
    </div>
    <div class="grid3">
      <div class="field"><label>모의</label><input type="number" value="${s.mock||''}" oninput="setF('mock',+this.value)"></div>
      <div class="field"><label>레벨</label><input type="number" value="${s.level||''}" oninput="setF('level',+this.value)"></div>
      <div class="field"><label>단어</label><input type="number" value="${s.vocab||''}" oninput="setF('vocab',+this.value)"></div>
    </div>
    <div class="field"><label>위험도</label><select onchange="setF('risk',this.value)"><option ${s.risk==='하'?'selected':''}>하</option><option ${s.risk==='중'?'selected':''}>중</option><option ${s.risk==='상'?'selected':''}>상</option></select></div>
    <div class="field"><label>상담/지도 메모</label><textarea oninput="setF('memo',this.value)">${esc(s.memo||'')}</textarea></div>`;
}

function closePanel(){ openId=null; document.getElementById('scrim').classList.remove('open'); document.getElementById('panel').classList.remove('open'); }

/* ──── 날짜별 기록 저장 ──── */
async function saveDayRecord(){
  const s=students.find(x=>x.id===openId); if(!s)return;
  const date=document.getElementById('recDate').value||today();
  const att=document.getElementById('recAtt').value;
  const hw=document.getElementById('recHw').value;
  const score=document.getElementById('recScore').value;
  const note=document.getElementById('recNote').value.trim();
  if(!att&&!hw&&!score&&!note){ toast('기록할 내용을 하나 이상 입력해 주세요'); return; }
  const data = { note, att, hw, score };
  setRecord(s.id, date, data);
  // 현재 연도면 학생의 checked 갱신
  if(viewYear===CUR_YEAR){ s.checked=date; await saveStudents(); }
  await ensureYearRegistered(viewYear);
  await saveRecords();
  document.getElementById('recNote').value='';
  document.getElementById('recAtt').value='';
  document.getElementById('recHw').value='';
  document.getElementById('recScore').value='';
  document.getElementById('historyBox').innerHTML=historyHtml(s.id);
  updateRecCount(); render(); toast('기록을 저장했어요 — '+date);
}

function historyHtml(sid){
  const h=getHistory(sid); const keys=Object.keys(h).sort().reverse();
  if(!keys.length) return '<div class="hitem"><span style="color:var(--soft)">아직 날짜별 기록이 없어요.</span></div>';
  return keys.map(k=>{
    const d=h[k]; const tags=[];
    if(d.att) tags.push(`<span class="chip ${d.att==='결석'?'risk-high':d.att==='지각'||d.att==='조퇴'?'risk-mid':'risk-low'}" style="font-size:.7rem">${d.att}</span>`);
    if(d.hw) tags.push(`<span class="chip ${d.hw==='미제출'?'risk-high':d.hw==='부분제출'?'risk-mid':'risk-low'}" style="font-size:.7rem">과제:${d.hw}</span>`);
    if(d.score) tags.push(`<span class="chip risk-low" style="font-size:.7rem">점수:${d.score}</span>`);
    return `<div class="hitem">
      <div style="display:flex;align-items:center;justify-content:space-between;gap:8px">
        <div><span class="hdate">${k}</span>${tags.length?'&nbsp;'+tags.join(' '):''}</div>
        <button class="btn small danger" onclick="deleteDayRecord('${escAttr(k)}')">삭제</button>
      </div>
      ${d.note?`<div class="hnote">${esc(d.note)}</div>`:''}
    </div>`;
  }).join('');
}

function updateRecCount(){
  const el=document.getElementById('recCount'); if(!el)return;
  const cnt=openId?Object.keys(getHistory(openId)).length:0;
  el.textContent=cnt?cnt+'건':'';
}

async function deleteDayRecord(date){
  cfConfirm(date+' 기록을 삭제할까요?','되돌릴 수 없어요.',()=>_deleteDayRecordConfirmed(date)); return;
  setRecord(openId, date, null);
  await saveRecords();
  document.getElementById('historyBox').innerHTML=historyHtml(openId);
  updateRecCount(); render(); toast('삭제했어요');
}

/* ──── 프로필 필드 수정 ──── */
async function setF(f,v,reorder=false){
  const s=students.find(x=>x.id===openId); if(!s)return;
  s[f]=v;
  if(reorder){ meta.collapsed[v]=false; let max=Math.max(0,...students.filter(x=>x.grade===v).map(x=>x.order||0)); s.order=max+1; await saveMeta(); }
  await saveStudents(); render(); renderRhythm();
}

/* ──── 점검 완료 ──── */
async function markChecked(){
  const s=students.find(x=>x.id===openId); if(!s)return;
  s.checked=today(); await saveStudents(); render(); toast('점검 완료로 표시했어요');
}

/* ──── 학생 삭제 ──── */
async function deleteStudent(){
  const s=students.find(x=>x.id===openId); if(!s)return;
  cfConfirm('학생을 삭제할까요?','되돌릴 수 없어요.',_deleteStudentConfirmed); return;
  students=students.filter(x=>x.id!==openId);
  // 기록도 제거
  delete yearRecords[openId];
  await saveStudents(); await saveRecords(); closePanel(); render(); toast('삭제했어요');
}


/* ──── 삭제 확인 헬퍼 (cfConfirm 콜백에서 호출) ──── */
async function _deleteDayRecordConfirmed(date){
  setRecord(openId, date, null);
  await saveRecords();
  document.getElementById('historyBox').innerHTML=historyHtml(openId);
  updateRecCount(); render(); toast('삭제했어요');
}
async function _deleteStudentConfirmed(){
  students=students.filter(x=>x.id!==openId);
  delete yearRecords[openId];
  await saveStudents(); await saveRecords(); closePanel(); render(); toast('삭제했어요');
}
async function _deleteYearConfirmed(year){
  await stDel(K_REC(year));
  meta.years=meta.years.filter(y=>y!==year);
  await saveMeta();
  if(viewYear===year){ await switchYear(CUR_YEAR); }
  closeModal(); toast(year+'년 기록을 삭제했어요');
}

/* ──── 리포트 ──── */
function makeReport(){
  const s=students.find(x=>x.id===openId); if(!s)return;
  const h=getHistory(s.id); const last=Object.keys(h).sort().reverse()[0];
  let r=`[${meta.academy}] ${s.name} 학생 학습 리포트\n${today()}\n\n▸ 학년: ${s.grade}\n▸ 출결률: ${s.att||0}%\n▸ 과제 제출률: ${s.hw||0}%\n▸ 모의/레벨/단어: ${s.mock||'-'} / ${s.level||'-'} / ${s.vocab||'-'}\n\n[원장 코멘트]\n${s.memo||''}\n`;
  if(last){ const d=h[last]; r+=`\n[최근 기록 ${last}]\n${d.att?'출결: '+d.att+'  ':''}${d.hw?'과제: '+d.hw+'  ':''}${d.score?'점수: '+d.score:''}${d.note?'\n'+d.note:''}\n`; }
  navigator.clipboard?.writeText(r).then(()=>toast('리포트를 복사했어요')).catch(()=>toast('복사 실패 — 직접 선택해 복사하세요'));
}

/* ──── 연도 전환 ──── */
async function switchYear(year){
  year=+year;
  await loadYearRecords(year);
  renderAll();
  toast(year+'년 기록으로 전환했어요');
}

/* ──── 아카이브 모달 ──── */
function openArchiveModal(){
  const years=[...new Set([...meta.years, CUR_YEAR])].sort().reverse();
  const rows=years.map(y=>{
    const recs=Object.values(yearRecords).reduce((a,h)=>a+Object.keys(h).length,0); // rough
    const isCur=y===CUR_YEAR; const isView=y===viewYear;
    return `<div class="archRow">
      <div>
        <b>${y}년</b>${isCur?' <span style="color:var(--accent);font-size:.8rem">현재</span>':''}
        ${isView&&!isCur?' <span style="color:var(--mid);font-size:.8rem">보는 중</span>':''}
      </div>
      <div style="display:flex;gap:7px;align-items:center">
        ${isView?`<span style="color:var(--soft);font-size:.82rem">선택됨</span>`:`<button class="btn small" onclick="switchYear(${y});closeModal()">이 연도 보기</button>`}
        ${!isCur?`<button class="btn small danger" onclick="deleteYearConfirm(${y})">삭제</button>`:''}
      </div>
    </div>`;
  }).join('');
  document.getElementById('modalArea').innerHTML=`
    <div class="modal" onclick="if(event.target===this)closeModal()">
      <div class="modalBox">
        <div class="modalHead"><b style="font-size:1.1rem">연도별 아카이브</b><button class="x" onclick="closeModal()">✕</button></div>
        <p style="font-size:.84rem;color:var(--soft);margin-bottom:14px">연도별로 기록이 분리 저장됩니다. 각 연도의 기록을 열람하거나 불필요한 과거 기록을 삭제할 수 있어요.</p>
        ${rows}
        <div style="margin-top:16px;display:flex;gap:8px;flex-wrap:wrap">
          <button class="btn" onclick="exportYearCsv();closeModal()">이 연도 CSV 내보내기</button>
          <button class="btn" onclick="closeModal()">닫기</button>
        </div>
      </div>
    </div>`;
}
function closeModal(){ document.getElementById('modalArea').innerHTML=''; }
async function deleteYearConfirm(year){
  cfConfirm(year+'년 기록을 영구 삭제할까요?','되돌릴 수 없어요.',()=>_deleteYearConfirmed(year)); return;
  await stDel(K_REC(year));
  meta.years=meta.years.filter(y=>y!==year);
  await saveMeta();
  if(viewYear===year){ await switchYear(CUR_YEAR); }
  closeModal(); toast(year+'년 기록을 삭제했어요');
}

/* ──── CSV 내보내기 ──── */
function exportYearCsv(){
  const rows=[['날짜','학생이름','학년','출결','과제','점수','메모']];
  students.forEach(s=>{
    const h=getHistory(s.id);
    Object.keys(h).sort().forEach(date=>{
      const d=h[date];
      rows.push([date,s.name,s.grade,d.att||'',d.hw||'',d.score||'',d.note||'']);
    });
  });
  if(rows.length<=1){toast('내보낼 기록이 없어요');return;}
  const csv='\uFEFF'+rows.map(r=>r.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(',')).join('\n');
  const blob=new Blob([csv],{type:'text/csv;charset=utf-8'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=meta.academy+'_'+viewYear+'년_기록.csv';a.click();URL.revokeObjectURL(a.href);
}

/* ──── 전체 백업/복원 ──── */
async function exportBackup(){
  // 모든 연도 기록 수집
  const allRecs={};
  for(const y of meta.years){ const r=await stGet(K_REC(y)); allRecs[y]=r||{}; }
  const backup={meta, students, records:allRecs, exportedAt:new Date().toISOString()};
  const blob=new Blob([JSON.stringify(backup,null,2)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='학생관리_백업_'+today()+'.json';a.click();URL.revokeObjectURL(a.href);
  toast('전체 백업 다운로드 완료');
}
async function importBackup(e){
  const f=e.target.files[0]; if(!f)return;
  const rd=new FileReader();
  rd.onload=async()=>{
    try{
      const data=JSON.parse(rd.result);
      if(!data.students)throw new Error('bad');
      meta={...data.meta}; if(!meta.collapsed)meta.collapsed={}; if(!meta.years)meta.years=[CUR_YEAR];
      students=data.students;
      // 연도별 기록 복원
      if(data.records){ for(const [y,recs] of Object.entries(data.records)){ await stSet(K_REC(+y),recs); } }
      await saveMeta(); await saveStudents();
      await loadYearRecords(CUR_YEAR);
      renderAll(); toast('백업을 복원했어요');
    }catch(err){toast('백업 파일 형식이 맞지 않습니다.');}
  };
  rd.readAsText(f); e.target.value='';
}

/* ──── 학원명 ──── */
async function editAcademy(){
  cfPrompt('학원명을 입력하세요',meta.academy,async v=>{ meta.academy=v; await saveMeta(); renderRhythm(); });
}

/* ──── 토스트 / 키 ──── */
let tt; function toast(m){ const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('show'),1900); }
document.addEventListener('keydown',e=>{ if(e.key==='Escape')closePanel(); });

/* ──── 초기화 ──── */
(async function init(){
  await loadAll();
  renderAll();
})();
</script>
