<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>모의고사 변형 — 유형 공식 훈련</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#F4F5F7;--paper:#FFFFFF;--ink:#1E2330;--muted:#636A77;--line:#D8DCE3;--mark:#FFE07A;--ok:#17805A;--okbg:#E5F4EC;--bad:#C93C4A;--badbg:#FBE9EB;--hint:#9A6B00;--hintbg:#FFF5D6;}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Noto Sans KR',system-ui,sans-serif;font-size:17px;line-height:1.65;padding-bottom:env(safe-area-inset-bottom)}
.wrap{max-width:800px;margin:0 auto;padding:16px 16px 80px}
header.top{padding:18px 0 14px;border-bottom:2px solid var(--ink);margin-bottom:14px}
header.top h1{margin:0;font-size:24px;font-weight:900;letter-spacing:-.5px}
header.top p{margin:4px 0 0;color:var(--muted);font-size:15px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 6px}
.srow,.qrow{display:flex;flex-wrap:wrap;gap:8px;width:100%}
.srow{margin-bottom:6px}
.stab{font:inherit;border:2px solid var(--line);background:var(--paper);border-radius:8px;padding:6px 12px;cursor:pointer;color:var(--ink);display:flex;flex-direction:column;align-items:flex-start;line-height:1.35;min-height:46px;text-align:left}
.stab b{font-size:15px}
.stab span{font-size:12.5px;color:var(--muted)}
.stab.on{border-color:var(--ink);box-shadow:inset 0 -3px 0 var(--ink)}
.stab.done b::after{content:' ✓';color:var(--ok)}
.stab:disabled{opacity:.4;cursor:not-allowed}
.chip{border:2px solid var(--line);background:var(--paper);border-radius:999px;padding:6px 14px;font:inherit;font-size:15px;font-weight:700;color:var(--ink);cursor:pointer;display:flex;gap:6px;align-items:center;min-height:42px}
.chip .dot{width:9px;height:9px;border-radius:50%;background:var(--c)}
.chip.on{border-color:var(--c);box-shadow:inset 0 -3px 0 var(--c)}
.chip.done::after{content:'✓';color:var(--ok);font-weight:900}
.chip:disabled{opacity:.4;cursor:not-allowed}
.chip.res{--c:var(--ink)}
.progress{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin:6px 0 18px}
.progress i{display:block;height:100%;background:var(--ink);transition:width .4s}
.qhead{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin:6px 0 10px}
.btn.arm{background:var(--bad);border-color:var(--bad);color:#fff}
.qhead .redo1{margin:0 0 0 auto;min-height:36px;padding:4px 12px;font-size:14px}
.qhead h2{margin:0;font-size:22px;font-weight:900}
.badge{display:inline-block;border-radius:6px;padding:2px 10px;font-size:14px;font-weight:700;color:#fff;background:var(--c)}
.src{color:var(--muted);font-size:14px}
.formula{border-left:5px solid var(--c);padding:6px 0 6px 14px;margin:0 0 16px}
.formula div{font-weight:700;font-size:16px}
.formula div::before{content:'공식 ';color:var(--c);font-weight:900}
.paper{background:var(--paper);border:1px solid var(--line);border-radius:4px;padding:20px 22px;margin-bottom:18px}
.blk{margin:0 0 12px;font-size:18px;line-height:2.05}
.blk:last-child{margin-bottom:0}
.blk .lab{font-weight:900;margin-right:6px}
.blk.given{border:1.5px solid var(--ink);padding:8px 14px;border-radius:3px}
.blk.given .lab{display:block;font-size:14px;color:var(--muted);font-weight:700;line-height:1.4;margin-bottom:2px}
.blk u{text-decoration-thickness:2px;text-underline-offset:4px}
.trbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:0 0 10px}
.trbar .btn{margin:0}
.trbar span{color:var(--muted);font-size:14.5px}
.blk2{margin:0 0 14px}
.blk2.given{border:1.5px solid var(--ink);padding:6px 14px;border-radius:3px}
.blk2 .lab{display:block;font-weight:900;margin:0 0 2px}
.pair{padding:10px 0;border-top:1px dashed var(--line)}
.blk2 .pair:first-of-type{border-top:0}
.en{font-size:18px;line-height:1.9}
.sn{display:inline-block;min-width:22px;font-size:13px;font-weight:900;color:var(--muted);vertical-align:2px}
.kr{font-size:16px;line-height:1.8;color:#3A4150;padding-left:22px}
.nt{font-size:14.5px;line-height:1.7;color:var(--c);font-weight:700;padding-left:22px;margin-top:2px}
.cue.on{text-decoration:underline wavy var(--c);text-decoration-thickness:2px;text-underline-offset:5px;font-weight:700;color:var(--c)}
.sen.scand{cursor:pointer;border-radius:3px}
.sen.scand:hover{background:#EDF0F4}
.sen.spick{background:#FFF0B3}
.sen[data-pick]::before,.sen[data-ord]::before{content:attr(data-pick);display:inline-block;font-size:12px;font-weight:900;line-height:1;padding:3px 6px;border-radius:9px;background:var(--ink);color:#fff;margin-right:4px;vertical-align:2px}
.sen[data-ord]::before{content:attr(data-ord);background:var(--c)}
.sen.skip{color:#5F6672}
.sen.skip[data-ord]::before{background:#E1E4E9;color:#3F4550}
.pv{border:1px dashed #AEB4BF;border-radius:4px;padding:10px 14px;margin:-8px 0 18px;background:#FAFBFC}
.pvh{font-size:13.5px;font-weight:700;color:var(--muted);margin-bottom:4px}
.pvo{font-size:15px;line-height:1.7;padding:2px 0}
.sen.sshow{outline:2px dashed var(--bad);outline-offset:2px}
.seqv{margin-top:6px;font-weight:700}
.tk{border-radius:3px;transition:background-color .25s}
.tk.cand{cursor:pointer;background-image:linear-gradient(transparent 88%,#B9BFCA 88%);padding:0 1px}
.tk.cand:hover{background-color:#F0F2F5}
.tk.cand.box{outline:2px dashed #8A93A3;outline-offset:2px;background-color:#F1F3F6;background-image:none;border-radius:4px;padding:0 3px}
.tk.box[data-bn]::before{content:attr(data-bn);display:inline-block;font-size:11.5px;font-weight:900;line-height:1;padding:3px 6px;border-radius:9px;background:#5F6672;color:#fff;margin-right:4px;vertical-align:2px}
.tk.sel{background-color:var(--mark)!important;background-image:none}
.tk.show{outline:2px dashed var(--bad);outline-offset:2px}
.tk.found{background-image:linear-gradient(transparent 82%,var(--c) 82%);font-weight:700}
.tk.wrong{background-color:var(--badbg)!important;text-decoration:line-through;text-decoration-color:var(--bad)}
.tk:focus-visible,.opt:focus-visible,.chip:focus-visible,.btn:focus-visible,.rchip:focus-visible{outline:3px solid #2B68C4;outline-offset:2px}
.step{background:var(--paper);border:1px solid var(--line);border-radius:4px;margin-bottom:12px;padding:16px 18px}
.step.lock{background:transparent;border-style:dashed;color:var(--muted);padding:12px 18px}
.step.ok{border-color:var(--ok)}
.shd{display:flex;gap:10px;align-items:flex-start}
.num{flex:none;width:30px;height:30px;border-radius:50%;border:2px solid var(--ink);display:grid;place-items:center;font-weight:900;font-size:15px}
.step.ok .num{background:var(--ok);border-color:var(--ok);color:#fff}
.step.lock .num{border-color:var(--line);color:var(--muted)}
.sq{font-weight:700;font-size:17px;padding-top:2px}
.sbody{margin:12px 0 0 40px}
.opts{display:grid;gap:8px}
.opt{text-align:left;font:inherit;font-size:16px;border:2px solid var(--line);background:#fff;border-radius:6px;padding:10px 14px;cursor:pointer;color:var(--ink);min-height:48px}
.opt:hover{border-color:#9AA2AF}
.opt.pick{border-color:var(--ok);background:var(--okbg);font-weight:700}
.opt.no{border-color:var(--bad);background:var(--badbg)}
.opt.show{border-style:dashed;border-color:var(--bad)}
.opt:disabled{cursor:default}
.mrow{border-top:1px solid var(--line);padding:10px 0}
.mrow:first-child{border-top:0;padding-top:0}
.mlab{font-weight:700;margin-bottom:6px}
.mlab.x::after{content:' — 다시';color:var(--bad);font-weight:700}
.rchips{display:flex;flex-wrap:wrap;gap:6px}
.rchip{font:inherit;font-size:15px;border:2px solid var(--line);background:#fff;border-radius:999px;padding:6px 12px;cursor:pointer;color:var(--ink);min-height:40px}
.rchip.sel{border-color:var(--ink);background:var(--ink);color:#fff}
.rchip.show{border-style:dashed;border-color:var(--bad)}
.rchip:disabled{cursor:default}
.btn{font:inherit;font-weight:700;font-size:16px;border:2px solid var(--ink);background:var(--ink);color:#fff;border-radius:6px;padding:10px 20px;cursor:pointer;margin-top:12px;min-height:46px}
.btn.ghost{background:#fff;color:var(--ink)}
.msg{margin-top:10px;padding:10px 12px;border-radius:6px;font-size:15.5px}
.msg.hint{background:var(--hintbg);color:#5E4300}
.msg.ok{background:var(--okbg);color:#0E5A3E}
.msg.rv{background:var(--badbg);color:#7D1F2A}
.pre{border-left:3px solid var(--c);padding:6px 0 6px 12px;margin:0 0 12px;font-size:15.5px;line-height:1.75}
.pre div:first-child{font-weight:700}
.tapnote{font-size:14.5px;color:var(--muted);margin:2px 0 0}
.after{background:var(--paper);border:2px solid var(--ok);border-radius:4px;padding:18px 20px;margin:6px 0 16px}
.after h3{margin:0 0 10px;font-size:19px}
.after h4{margin:16px 0 6px;font-size:16px}
.mg{margin:8px 0 12px;border-left:3px solid var(--c);padding-left:12px}
.mgt{font-weight:900;font-size:15px;margin-bottom:2px}
.mgi{padding:4px 0;border-top:1px dashed var(--line);font-size:15px;line-height:1.6}
.mgi:first-of-type{border-top:0}
.mgi b{display:block}
.mgi span{color:var(--muted)}
.olist div{padding:6px 0;border-top:1px solid var(--line);font-size:15.5px}
.olist div:first-child{border-top:0}
.olist b{display:inline-block;min-width:0;margin-right:6px}
table.lk{width:100%;border-collapse:collapse;font-size:15px}
table.lk td{border:1px solid var(--line);padding:7px 9px;vertical-align:top}
table.lk td:first-child{width:50%}
details{margin-top:14px;border-top:1px solid var(--line);padding-top:10px}
summary{cursor:pointer;font-weight:700}
details p{font-size:15.5px;line-height:1.9}
.next{display:flex;justify-content:flex-end}
.sum{background:var(--paper);border:2px solid var(--ink);border-radius:4px;padding:20px}
.sum h2{margin:0 0 6px;font-size:22px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0}
.stats div{border:1px solid var(--line);border-radius:4px;padding:10px;text-align:center}
.stats b{display:block;font-size:26px;font-weight:900}
.code{font-size:26px;font-weight:900;letter-spacing:2px;border:2px dashed var(--ink);padding:10px 14px;text-align:center;margin:12px 0}
.qline{display:flex;justify-content:space-between;align-items:center;gap:8px;border-top:1px solid var(--line);padding:8px 0;font-size:15.5px;flex-wrap:wrap}
.qline .btn{margin:0;padding:6px 12px;min-height:38px;font-size:14.5px}
.foot{margin-top:24px;color:var(--muted);font-size:13.5px;text-align:center}
.flash{animation:fl .5s}
@keyframes fl{0%{transform:scale(1)}40%{transform:scale(1.02)}100%{transform:scale(1)}}
@media (max-width:560px){body{font-size:16px}.paper{padding:16px}.blk{font-size:17px}.sbody{margin-left:0}.step{padding:14px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<div class="wrap">

<script>
/* ============ ENGINE 상수 (수정 금지) ============ */
const CATS=['수일치','관계대명사','동사 vs 준동사','병렬','능동 / 수동','대명사','대동사'];
const ORD=['① (A)-(C)-(B)','② (B)-(A)-(C)','③ (B)-(C)-(A)','④ (C)-(A)-(B)','⑤ (C)-(B)-(A)'];
const POS=['①','②','③','④','⑤'];
const TYPE_COLOR={'목적':'#5B6B7F','심경':'#A0527A','주장':'#8A5A2B','함축':'#0D878A','요지':'#4E7A1F','주제':'#4E7A1F','제목':'#4E7A1F','도표':'#5B6B7F','일치':'#5B6B7F','어법':'#2F7D46','어휘':'#3D7A6E','빈칸':'#C23E5A','무관':'#6B5BA8','순서':'#2B68C4','삽입':'#7550C4','요약':'#B2700C','장문':'#9A4E1C'};
/* ============ DATA 구간 시작 — 이 아래부터 DATA 구간 끝까지만 바꾼다 ============ */
const EXAM={
 id:'2603',                                   // 연월 YYMM
 set:'2',                                     // 변형 2 (대의 파악·고난도)
 title:'3월 고1 모의고사 변형 2 — 대의 파악·고난도 유형',
 sub:'변형 1(8문항)을 끝낸 뒤 푼다. 핵심 문장을 찾고, 오답이 왜 틀렸는지 이름을 붙인다.',
 footer:'강동미나 뮤엠영어 · 진행 상황은 이 기기에 저장된다',
 key:'mg2603_2_formula_v1',                   // 저장 키: mg + YYMM + _2_formula_v1
 code:'MG2603-2',                             // 완료 코드 앞부분
 ver:'v1.9 (2026-10-01)',
 lock:false                                   // 검토 중 false / 학생 배포 true
};
const BL2={
q18:[{s:[
[`Dear Riverside Community Pool members,`,`Riverside 공립 수영장 회원 여러분께,`],
[`I am the director of the Riverside Community Pool.`,`저는 Riverside 공립 수영장의 관리 책임자입니다.`],
[`{{ap|We truly appreciate}} your excitement about the pool’s return after the winter repairs.`,`겨울 보수 공사 후 수영장이 다시 문을 여는 것을 기대해 주셔서 진심으로 감사드립니다.`,`appreciate + 명사 = ~에 감사하다`],
[`{{sd|Sadly}}, while replacing the old {{wp|water pipes}}, our workers found serious {{lk|leaks}} under the main tank, which made the project more complicated than expected.`,`안타깝게도, 낡은 수도관을 교체하던 중 작업자들이 주 수조 아래에서 심각한 누수를 발견했고, 그것이 공사를 예상보다 더 복잡하게 만들었습니다.`,`while V-ing = ~하는 동안 / , which = 앞 내용 전체 / more complicated than expected`],
[`{{sr|We are sorry to let you know}} that {{rp|the reopening of the pool}} has to be {{pp|postponed}}.`,`수영장의 재개장이 연기되어야 함을 알려 드리게 되어 유감입니다.`,`be sorry to V = ~하게 되어 유감이다 / let you know that ~ = ~을 알리다 / has to be p.p. (수동)`],
[`The pool was set to open its doors again on March 15th.`,`수영장은 원래 3월 15일에 다시 문을 열 예정이었습니다.`,`be set to V = ~할 예정이다`],
[`Instead, it will now reopen on April 12th so that every swimmer can enjoy a {{sf|safe environment}}.`,`대신, 모든 수영객이 안전한 환경을 누릴 수 있도록 이제 4월 12일에 재개장할 것입니다.`,`so that S can V = ~할 수 있도록 (목적)`],
[`{{cw|We can’t wait}} to welcome you back into the water.`,`여러분을 다시 물속으로 맞이할 날이 몹시 기다려집니다.`,`can’t wait to V = 몹시 ~하고 싶다`],
[`{{ty|Thank you}} for your kind patience.`,`너그럽게 기다려 주셔서 감사합니다.`],
[`Best regards, Director of Riverside Community Pool`,`Riverside 공립 수영장 관리 책임자 드림`]]}],
q20:[{s:[
[`{{nw|Nothing wins people over faster}} — or more sincerely — than sharing {{ps|a small, honest piece of yourself}}.`,`자기 자신의 작고 솔직한 한 조각을 나누는 것보다 사람들의 마음을 더 빠르게, 혹은 더 진심으로 얻는 것은 없다.`,`Nothing ~ 비교급 than A = A가 가장 ~하다 (최상급 의미) / win A over = A의 마음을 얻다`],
[`Let me be clear: {{dm|I don’t mean}} you should talk for ten minutes about your childhood or fill your {{sl|slides}} with family photos.`,`분명히 하자면, 나는 여러분이 어린 시절에 대해 10분 동안 이야기하거나 발표 자료를 가족사진으로 채워야 한다는 말이 아니다.`,`I don’t mean ~ (필자가 아니라고 하는 쪽 = 주장 아님)`],
[`{{im|I mean}} that you can mention one meaningful experience, a feeling you have right now, or a light joke about your own mistakes.`,`내 말은 여러분이 의미 있는 경험 하나, 지금 느끼는 감정, 또는 자신의 실수에 대한 가벼운 농담을 언급할 수 있다는 것이다.`,`I don’t mean A. I mean B. = not A but B → B가 주장`],
[`This is a proven way to connect with a room full of strangers — and to prepare the ground for convincing them later.`,`이것은 낯선 사람들로 가득한 공간과 연결되고, 나중에 그들을 설득할 바탕을 마련하는 검증된 방법이다.`,`prepare the ground for = ~의 바탕을 마련하다`],
[`{{ht|The hard truth is}} that listeners rarely warm up to {{ff|facts and figures}} alone, but they do warm up to the person presenting them.`,`냉정한 사실은, 청중이 사실과 수치만으로는 좀처럼 마음을 열지 않지만, 그것을 발표하는 사람에게는 정말로 마음을 연다는 것이다.`,`rarely = 거의 ~않다 / do + 동사원형 = 강조 (정말로) / warm up to = ~에게 마음을 열다`],
[`When you reveal a {{ps2|personal story}} or admit a weakness, you give your audience a reason to see themselves in you.`,`개인적인 이야기를 드러내거나 약점을 인정할 때, 여러분은 청중에게 여러분 안에서 자신을 볼 이유를 주게 된다.`,`give O a reason to V = O에게 ~할 이유를 주다`]]}],
q22:[{s:[
[`{{al|Although}} the music we grew up with and our natural differences shape what we enjoy, our musical taste can {{ch|keep changing throughout life}} thanks to the brain’s remarkable ability to adapt.`,`비록 우리가 들으며 자란 음악과 타고난 차이가 우리가 즐기는 것을 형성하지만, 우리의 음악 취향은 뇌의 놀라운 적응 능력 덕분에 평생 계속 바뀔 수 있다.`,`Although S V (통념), S V (주장) / thanks to = ~ 덕분에 / keep V-ing = 계속 ~하다`],
[`In fact, our listening habits are far more flexible than most people believe, even in old age.`,`실제로 우리의 듣는 습관은 대부분의 사람들이 믿는 것보다, 나이가 들어서도, 훨씬 더 유연하다.`,`far + 비교급 = 훨씬 더 ~한`],
[`This is good news for curious listeners who want to explore {{gr|new genres}}, but it is even better news for those who wish to escape a narrow playlist.`,`이것은 새로운 장르를 탐험하고 싶은 호기심 많은 청취자들에게는 좋은 소식이지만, 좁은 재생 목록에서 벗어나고 싶은 사람들에게는 훨씬 더 좋은 소식이다.`,`even + 비교급 = 훨씬 더 / those who = ~하는 사람들`],
[`{{ja|Just as}} children slowly come to love songs they once found strange, adults can also retrain their ears.`,`아이들이 한때 낯설게 여겼던 노래를 서서히 좋아하게 되는 것처럼, 어른들도 귀를 다시 훈련할 수 있다.`,`Just as A, B = A처럼 B도 / come to V = ~하게 되다 / find O + 형용사`],
[`{{fe|For example}}, many people who move from short pop songs to longer {{cl|classical pieces}} gradually begin to enjoy the rich harmonies and slow build-up.`,`예를 들어, 짧은 팝송에서 더 긴 클래식 곡으로 옮겨 간 많은 사람들이 점차 풍성한 화음과 느린 전개를 즐기기 시작한다.`,`주어 many people (who move ~) → begin / move from A to B`],
[`{{rp|Hearing something again and again}} — along with {{wc|a willingness to change}} — {{mk|makes the difference}}.`,`무언가를 반복해서 듣는 것이 변하려는 의지와 함께 차이를 만든다.`,`동명사 주어 Hearing ~ → makes (단수) / make the difference = 결정적 차이를 만들다 (= is the key)`]]}],
q23:[{s:[
[`Researchers have examined teenage risk-taking by asking young people to play {{dg|a driving game}}, sometimes alone and sometimes while friends watched.`,`연구자들은 젊은이들에게 운전 게임을 하게 하는 방법으로 십 대의 위험 감수 행동을 조사해 왔는데, 때로는 혼자, 때로는 친구들이 지켜보는 가운데 하게 했다.`,`by V-ing = ~함으로써 / ask O to V`],
[`What makes the results so interesting is that {{ef|the effect of an audience is not the same at every age}}.`,`그 결과를 아주 흥미롭게 만드는 것은 지켜보는 사람의 영향이 모든 나이에서 같지 않다는 점이다.`,`What ~ is that ~ (What 명사절 주어) / not the same at every age`],
[`The tendency to take bigger risks when {{fr|friends are watching}} is strongest around the age of 15.`,`친구들이 지켜볼 때 더 큰 위험을 감수하는 경향은 15세 무렵에 가장 강하다.`,`주어 The tendency (to ~ when ~) → is`],
[`{{at|After that}}, it gradually weakens, so that by the early twenties, people take almost the same risks whether or not their friends are present.`,`그 이후 그것은 점차 약해져서, 20대 초반이 되면 사람들은 친구들이 있든 없든 거의 같은 위험을 감수한다.`,`so that = 그래서 (결과) / whether or not = ~이든 아니든`],
[`{{ms|This is a meaningful discovery}}.`,`이것은 의미 있는 발견이다.`],
[`{{sh|It shows that}} {{pr|the pressure of being watched by peers changes as people grow older}}.`,`그것은 또래에게 지켜보아진다는 압박이 사람들이 나이가 들면서 변한다는 것을 보여 준다.`,`It shows that ~ = 주제 문장 신호 / being watched = 동명사 수동 / as = ~함에 따라`],
[`As young people mature, they become better at judging danger for themselves, regardless of who is looking.`,`젊은이들은 성숙해 감에 따라 누가 보고 있는지와 상관없이 스스로 위험을 판단하는 데 더 능숙해진다.`,`be good at V-ing (better = 비교급) / regardless of = ~와 상관없이`]]}],
q24:[{s:[
[`Habits are not the enemy.`,`습관은 적이 아니다.`],
[`We rely on them every day.`,`우리는 매일 습관에 의지한다.`,`rely on = ~에 의지하다`],
[`Knowing how the brain forms habits — and how to use them rather than fight them — matters in daily life and in business alike.`,`뇌가 습관을 어떻게 형성하는지, 그리고 습관과 싸우기보다 그것을 어떻게 이용하는지 아는 것은 일상생활에서도 비즈니스에서도 똑같이 중요하다.`,`동명사 주어 Knowing ~ → matters (단수) / A rather than B / alike = 똑같이`],
[`So ask yourself: do you really need to {{qt|quit a habit}}, or could you simply {{cn|connect it to another one}}?`,`그러니 스스로 물어보라. 정말 습관을 끊어야 하는가, 아니면 그것을 다른 습관에 그냥 연결할 수 있는가?`,`connect A to B = A를 B에 연결하다`],
[`In one experiment, a researcher allowed volunteers to listen to their favorite podcast only while {{ce|cleaning their rooms}}.`,`한 실험에서, 한 연구자는 자원자들이 방을 청소하는 동안에만 가장 좋아하는 팟캐스트를 들을 수 있게 했다.`,`allow O to V / only while V-ing = ~하는 동안에만`],
[`This {{lk|links an enjoyable habit}} — hearing the next episode of a gripping story — to a task people want to do but tend to delay, such as tidying up.`,`이것은 즐거운 습관, 즉 흥미진진한 이야기의 다음 회를 듣는 것을, 사람들이 하고 싶지만 미루는 경향이 있는 일, 예를 들어 정리하기에 연결한다.`,`link A to B = A를 B에 연결하다 (A와 to B 사이에 대시 삽입) / tend to V`],
[`Volunteers whose podcasts were “locked” to cleaning cleaned 40 percent more often.`,`팟캐스트가 청소에 "묶인" 자원자들은 40퍼센트 더 자주 청소했다.`,`whose (소유격 관계대명사) / 주어 Volunteers (whose ~) → cleaned`],
[`Even more surprising was what happened after the study ended: more than half chose to keep the rule on their own!`,`훨씬 더 놀라운 것은 연구가 끝난 뒤 일어난 일이었다. 절반 이상이 스스로 그 규칙을 지키기로 선택한 것이다!`,`보어 도치: Even more surprising was what ~ (= What ~ was even more surprising) / on one’s own = 스스로`]]}],
q41:[{s:[
[`It’s fair to say that boredom has a bad reputation.`,`지루함은 평판이 나쁘다고 말해도 무방하다.`,`It’s fair to say that ~ = ~라고 말해도 무방하다`],
[`{{fo|For one thing}}, the thought of spending an afternoon with nothing to do sounds unpleasant.`,`우선, 할 일 없이 오후를 보낸다는 생각은 불쾌하게 들린다.`,`spend 시간 with ~ / sound + 형용사`],
[`{{mi|More importantly}}, boredom seems {{ws|(a) __wasteful__}}.`,`더 중요하게는, 지루함은 (a) 낭비처럼 보인다.`],
[`It has long been treated as {{pb|a problem to be fixed}} — something that parents rush to cure with toys and screens, and that workers escape by checking their phones.`,`그것은 오랫동안 고쳐야 할 문제, 즉 부모들이 장난감과 화면으로 서둘러 치료하고 직장인들이 휴대 전화를 확인하며 벗어나는 것으로 여겨져 왔다.`,`has been treated as = ~로 여겨져 왔다 (현재완료 수동) / something that ~, and that ~ (관계사절 병렬)`],
[`The bored student staring out the window, we tend to think, is falling behind: she should be filling every minute with something (b) __useless__ instead.`,`창밖을 바라보는 지루한 학생은 뒤처지고 있다고 우리는 생각하는 경향이 있다. 그녀는 대신 매 순간을 (b) 쓸모없는 무언가로 채워야 한다는 것이다.`,`주어 The bored student (staring ~) + [we tend to think 삽입] + is`],
[`{{ia|In all these cases}}, boredom is seen as empty time, a (c) __costly__ gap to be filled as quickly as possible.`,`이 모든 경우에, 지루함은 빈 시간, 즉 가능한 한 빨리 채워야 할 (c) 대가가 큰 틈으로 여겨진다.`,`as quickly as possible = 가능한 한 빨리 / costly = 형용사 (비용·대가가 큰) — -ly로 끝나도 형용사`],
[`{{bu|But as}} daily life fills up with constant entertainment, {{sc|something (d) __changes__}}.`,`하지만 일상이 끊임없는 오락거리로 가득 차면서, 무언가가 (d) 바뀐다.`,`But as S V = 하지만 ~함에 따라 (전환점)`],
[`In more and more situations, boredom becomes {{ad|a kind of advantage}}.`,`점점 더 많은 상황에서 지루함은 일종의 이점이 된다.`,`비교급 and 비교급 = 점점 더 ~`],
[`In a world that never stops offering distractions, {{ab|the ability to (e) __stay with__ an empty moment}} — to let the mind wander where it wants — is a way to think deeply, to come up with original ideas, and to enjoy one’s own thoughts instead of always reaching for the next thing.`,`끊임없이 주의를 흩뜨리는 것을 제공하는 세상에서, 빈 순간과 (e) 함께 머무는 능력, 즉 마음이 원하는 곳으로 떠돌게 두는 능력은 깊이 생각하고, 독창적인 생각을 떠올리고, 늘 다음 것에 손을 뻗는 대신 자기 생각을 즐기는 방법이다.`,`주어 the ability (to ~ — to ~) → is / let O V / come up with = 떠올리다 / instead of V-ing`]]}]

[`In other words, they began to write the notes {{ow|on a set of lines of their own}}, {{sp|separately from the words below}}.`,`다시 말해, 그들은 음표를 아래의 가사와 분리하여 그것만의 줄 묶음 위에 적기 시작했다.`,`In other words = 빈칸의 쉬운 버전 / of one’s own = 자기만의 / separately from = ~와 분리되어`],
[`When they wanted to sing different words to the same tune, they realized they could keep the notes exactly as they were and simply change the text underneath.`,`같은 가락에 다른 가사를 붙여 부르고 싶을 때, 그들은 음표를 그대로 두고 아래의 가사만 바꾸면 된다는 것을 깨달았다.`,`keep O as they were = O를 그대로 두다`],
[`Music had developed into an independent language, existing in its own right and free from whatever words it was being used to carry.`,`음악은 그 자체로 존재하며 그것이 실어 나르는 데 쓰이는 어떤 가사로부터도 자유로운, 독립된 언어로 발전한 것이었다.`,`develop into = ~로 발전하다 / in its own right = 그 자체로 / free from = ~로부터 자유로운`],
[`We easily take this freedom for granted today, but for the earliest singers it was a new and remarkably powerful idea.`,`오늘날 우리는 이 자유를 쉽게 당연하게 여기지만, 최초의 가수들에게 그것은 새롭고 놀랍도록 강력한 생각이었다.`,`take ~ for granted = ~을 당연하게 여기다`]]}],
q31:[{s:[
[`Just as a crowded kitchen makes cooking stressful, a desk buried under books and supplies can make studying harder for teenagers.`,`붐비는 부엌이 요리를 스트레스받게 만드는 것처럼, 책과 학용품에 파묻힌 책상은 십 대들에게 공부를 더 어렵게 만들 수 있다.`,`Just as A, B = A인 것처럼 B도 / make O + 형용사`],
[`If every workbook, pen, and sticky note a student has {{bo|ever bought}} stays on the desk, the student may not complain, but they can feel weighed down by the mess.`,`학생이 지금까지 산 모든 문제집, 펜, 포스트잇이 책상 위에 그대로 있으면, 학생은 불평하지 않을 수도 있지만 그 어수선함에 짓눌린다고 느낄 수 있다.`,`주어 every workbook ~ (a student has ever bought) → stays (every = 단수) / be weighed down by = ~에 짓눌리다`],
[`It is like opening a refrigerator {{st|stuffed with food}} and still thinking, There’s nothing to eat.`,`그것은 음식으로 꽉 찬 냉장고를 열고도 "먹을 게 없네"라고 생각하는 것과 같다.`,`be like V-ing = ~하는 것과 같다 / stuffed with = ~로 꽉 찬`],
[`＿＿＿＿＿＿ helps people notice what they have and actually use what they own.`,`＿＿＿＿은(는) 사람들이 자신이 가진 것을 알아차리고 소유한 것을 실제로 사용하도록 돕는다.`,`help O V(원형) and V / what = ~하는 것`],
[`When there are {{tm|too many things}} to look at, move aside, and choose from, students struggle to decide where to begin.`,`볼 것, 치울 것, 고를 것이 너무 많으면, 학생들은 어디서부터 시작할지 정하는 데 애를 먹는다.`,`struggle to V = ~하는 데 애를 먹다 / where to V = 어디서 ~할지`],
[`That is why {{cl|clearing a study space}} matters so much.`,`그래서 공부 공간을 비우는 것이 그토록 중요하다.`,`That is why ~ = 그래서 ~이다 / 동명사 주어 clearing ~ → matters`],
[`You want your desk to invite focus and creativity — not leave you frozen by too many choices.`,`여러분은 책상이 너무 많은 선택지로 여러분을 얼어붙게 하는 것이 아니라 집중과 창의성을 불러오기를 원한다.`,`want O to V / leave O + p.p. = O를 ~한 상태로 두다`]]}],
q39:[{l:'주어진 문장',g:1,s:[[`Yet only a week after the first heavy rain, a second visit reveals an astonishing change.`,`그러나 첫 큰비가 내린 지 겨우 일주일 뒤, 두 번째 방문은 놀라운 변화를 보여 준다.`,`Yet = 그러나 (역접 — 분위기 반전) / a second visit = 두 번째 방문`]]},
{s:[[`Walking through the same desert valley twice — once in late summer and again after the spring rains — offers a dramatic lesson in how life waits. ( ① )`,`같은 사막 골짜기를 두 번, 즉 한 번은 늦여름에, 또 한 번은 봄비가 내린 후에 걸어 보는 것은 생명이 어떻게 기다리는지에 대한 극적인 교훈을 준다.`,`동명사 주어 Walking ~ → offers / how S V = ~가 어떻게 …하는지`],
[`During the summer walk, the ground is cracked and gray. ( ② )`,`여름 산책 동안 땅은 갈라지고 잿빛이다.`],
[`Kneeling to brush away the hot dust, which is hard because it is packed like stone, uncovers only dry seeds and dead stems, a scene {{lo|lonely}} enough to make anyone believe nothing could grow here. ( ③ )`,`무릎을 꿇고 뜨거운 먼지를 털어 내는 것은, 그것이 돌처럼 단단히 다져져 있어서 어려운데, 마른 씨앗과 죽은 줄기만 드러내며, 이곳에는 아무것도 자랄 수 없다고 누구라도 믿게 할 만큼 쓸쓸한 광경이다.`,`동명사 주어 Kneeling ~ → uncovers (단수) / 형용사 + enough to V / lonely = 형용사 (-ly로 끝나도 형용사)`],
[`Even the few animals that live there hide underground until evening. ( ④ )`,`그곳에 사는 몇 안 되는 동물들조차 저녁까지 땅속에 숨어 있다.`,`the few + 복수명사 = 몇 안 되는 ~`],
[`Beneath the thin crust, tiny green shoots have pushed up everywhere, covering the valley floor. ( ⑤ )`,`얇은 겉흙 아래에서 작은 초록 새싹들이 사방에서 솟아올라 골짜기 바닥을 덮고 있다.`,`have pushed up = 현재완료 / covering ~ = 분사구문 (결과)`],
[`Flowers in yellow, purple, and white stand out sharply against the red rocks.`,`노랑, 보라, 하양 꽃들이 붉은 바위를 배경으로 또렷이 두드러진다.`,`stand out against = ~을 배경으로 두드러지다`],
[`The valley looks like a garden someone planted overnight.`,`골짜기는 누군가 하룻밤 사이에 심어 놓은 정원처럼 보인다.`,`look like + 명사 / a garden (that) someone planted`]]}],
q30:[{s:[
[`In many rural parts of the developing world, people still get drinking water mainly by carrying it by hand, {{bc|because}} there is not enough money to build ① __large__ pipe systems.`,`개발도상국의 많은 시골 지역에서, 사람들은 대규모 수도관 시설을 지을 돈이 충분하지 않기 때문에 여전히 주로 손으로 날라서 마실 물을 얻는다.`,`by V-ing = ~함으로써 / enough + 명사 + to V`],
[`Family members walk long distances every day and spend energy they can ② __hardly__ spare.`,`가족들은 매일 먼 거리를 걷고, 거의 여유가 없는 에너지를 쓴다.`,`energy (that) they can hardly spare / hardly = 거의 ~않다 (부사)`],
[`Carrying water {{un|under these conditions}} is an exhausting task that ③ __steals__ time from school and work.`,`이런 조건에서 물을 나르는 것은 학교와 일로부터 시간을 빼앗는 지치는 일이다.`,`동명사 주어 Carrying ~ → is / steal A from B = B에게서 A를 빼앗다`],
[`In wealthy cities, {{hw|however}}, people’s attitude toward water is entirely ④ __similar__: water is cheap, clean, and always there when you turn on the tap.`,`그러나 부유한 도시에서는 물에 대한 사람들의 태도가 완전히 ④ __비슷하다__. 물은 싸고, 깨끗하며, 수도꼭지를 틀면 언제나 거기 있다.`,`however = 앞과 반대 방향 / attitude toward = ~에 대한 태도 / 콜론(:) 뒤 = 설명`],
[`Most city dwellers use far ⑤ __more__ of it than they truly need.`,`대부분의 도시 거주자들은 정말 필요한 것보다 훨씬 더 많은 물을 쓴다.`,`far + 비교급 = 훨씬 더`],
[`{{ir|Ironically}}, some fitness centers now sell “water-carrying” workouts that copy the very task many villagers would gladly give up.`,`아이러니하게도, 일부 피트니스 센터는 이제 많은 마을 사람들이 기꺼이 그만두고 싶어 할 바로 그 일을 흉내 낸 "물 나르기" 운동을 판다.`,`the very + 명사 = 바로 그 ~ / give up = 그만두다`]]}],
q35:[{s:[
[`The “happiness set point” theory suggests that every adult has {{sp|a fairly stable level of happiness}} that their mood usually {{rt|returns to}}.`,`'행복 설정값' 이론은 모든 성인에게 기분이 대개 되돌아가는 꽤 안정적인 행복 수준이 있다고 말한다.`,`a level (that their mood returns to) — 목적격 관계대명사 + 전치사 to가 끝에`],
[`{{gn|Our genes}} and early experiences largely decide where this level sits.`,`우리의 유전자와 어린 시절의 경험이 이 수준이 어디에 놓일지를 대체로 결정한다.`,`where S V = ~가 어디에 …하는지`],
[`① After a {{pr|pay raise}} or a breakup, people feel much happier or sadder for a while.`,`① 월급 인상이나 이별 후, 사람들은 한동안 훨씬 더 행복하거나 더 슬프게 느낀다.`,`much + 비교급 = 훨씬 더 / for a while = 한동안`],
[`② Many companies now offer pay raises to keep their best workers from leaving.`,`② 많은 회사들이 이제 최고의 직원들이 떠나지 않도록 월급 인상을 제공한다.`,`keep A from V-ing = A가 ~하지 못하게 하다`],
[`③ However, within a year or so, most of them drift back to the level they started from.`,`③ 그러나 1년 정도 안에, 그들 대부분은 처음 출발했던 수준으로 서서히 돌아간다.`,`drift back to = ~로 서서히 돌아가다 / the level (that) they started from`],
[`④ Researchers explain that the set point works like a {{th|thermostat}}, pulling feelings back toward a fixed range whenever they move too far.`,`④ 연구자들은 설정값이 온도 조절기처럼 작동해서, 감정이 너무 멀리 벗어날 때마다 정해진 범위 쪽으로 다시 끌어당긴다고 설명한다.`,`work like = ~처럼 작동하다 / pulling ~ = 분사구문 / whenever = ~할 때마다`],
[`⑤ {{tu|Thus}}, a person with a low set point may need to work harder than others to keep a positive mood.`,`⑤ 따라서 설정값이 낮은 사람은 긍정적인 기분을 유지하기 위해 다른 사람들보다 더 애써야 할 수도 있다.`,`Thus = 앞 내용의 결론 / harder than others = 다른 사람보다 더 열심히`]]}]
};

// 회차 묶음 (한 회차 최대 5지문, 시험지 번호 블록 순서) — 문제지 PDF·인터랙션 회차 표시에 사용
const SESSIONS=[{n:'3회차',t:'18~24번 — 대의 파악',q:['18','20','22','23','24']},{n:'4회차',t:'30번대 — 어휘·빈칸·무관·삽입',q:['30','31','33','35','39']},{n:'5회차',t:'41~42번 — 장문',q:['41','42']}];
/* ============ DATA 구간 끝 ============ */
/* ============ ENGINE (수정 금지) ============ */
const KEY=EXAM.key;
const LOCK=!!EXAM.lock;
let MEM=null;
function load(){try{const s=localStorage.getItem(KEY);if(s)return JSON.parse(s)}catch(e){}return MEM?JSON.parse(MEM):null}
function save(){const s=JSON.stringify(ST);MEM=s;try{localStorage.setItem(KEY,s)}catch(e){}}
function fresh(){return{cur:0,view:'q',tr:false,q:DATA.map(d=>({steps:d.steps.map(s=>newStep(s))}))}}
function newStep(s){return{sel:(s.k==='tap'||s.k==='order')?[]:s.k==='match'?s.rows.map(()=>null):null,att:0,res:0,done:false,rv:false,msg:'',mt:'',bad:[]}}
let ST=load();
if(!ST||!ST.q||ST.q.length!==DATA.length||ST.q.some((q,i)=>q.steps.length!==DATA[i].steps.length))ST=fresh();
const $=s=>document.querySelector(s);
const esc=t=>String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
function mk(t){return esc(t).replace(/\{\{!(\w+)\|([^}]+)\}\}/g,'<span class="cue" data-cue="$1">$2</span>').replace(/\{\{(\w+)\|([^}]+)\}\}/g,'<span class="tk" data-id="$1">$2</span>').replace(/__([^_]+)__/g,'<u>$1</u>')}
const qDone=i=>ST.q[i].steps.every(s=>s.done);
const unlocked=i=>!LOCK||i===0||qDone(i-1);
const allDone=()=>DATA.every((d,i)=>qDone(i));
const active=i=>ST.q[i].steps.findIndex(s=>!s.done);
function color(d){return TYPE_COLOR[d.type]||'#1E2330'}

const SS=(typeof SESSIONS!=='undefined'&&SESSIONS.length)?SESSIONS:[{n:'전체',t:'',q:DATA.map(d=>d.src)}];
const sessIdx=i=>Math.max(0,SS.findIndex(s=>s.q.includes(DATA[i].src)));
const sessQ=k=>SS[k].q.map(src=>DATA.findIndex(d=>d.src===src)).filter(x=>x>=0);
const sessDone=k=>sessQ(k).every(i=>qDone(i));
const sessNum=k=>(SS[k].n.match(/\d+/)||[String(k+1)])[0];
if(!ST.q.some(q=>q.steps.some(s=>s.done))&&ST.view==='q'&&!SS[0].q.includes(DATA[ST.cur].src))ST.cur=sessQ(0)[0];
if(ST.sess===undefined||ST.sess>=SS.length)ST.sess=sessIdx(ST.cur||0);
function chips(){
 const c=$('#chips');c.innerHTML='';
 if(SS.length>1){const row=document.createElement('div');row.className='srow';
  SS.forEach((s,k)=>{const b=document.createElement('button');b.className='stab'+(ST.sess===k?' on':'')+(sessDone(k)?' done':'');b.disabled=LOCK&&k>0&&!sessDone(k-1);b.innerHTML=`<b>${esc(s.n)}</b><span>${esc(s.t)}</span>`;b.onclick=()=>{ST.sess=k;const L=sessQ(k);const nd=L.find(i=>!qDone(i));ST.cur=nd===undefined?L[0]:nd;ST.view='q';save();render();window.scrollTo({top:0})};row.appendChild(b)});c.appendChild(row)}
 const row2=document.createElement('div');row2.className='qrow';const L=sessQ(ST.sess);
 L.forEach((i,j)=>{const d=DATA[i];const b=document.createElement('button');b.className='chip'+(ST.view==='q'&&ST.cur===i?' on':'')+(qDone(i)?' done':'');b.style.setProperty('--c',color(d));b.disabled=LOCK&&j>0&&!qDone(L[j-1]);b.innerHTML=`<span class="dot"></span>${d.src}번`;b.setAttribute('aria-label',`${d.src}번 ${d.type}`);b.onclick=()=>{ST.view='q';ST.cur=i;save();render();window.scrollTo({top:0})};row2.appendChild(b)});
 const r=document.createElement('button');r.className='chip res'+(ST.view==='sum'?' on':'');r.textContent=SS.length>1?SS[ST.sess].n+' 결과':'결과';r.disabled=LOCK&&!sessDone(ST.sess);r.onclick=()=>{ST.view='sum';save();render()};row2.appendChild(r);c.appendChild(row2);
 const tot=L.reduce((a,i)=>a+DATA[i].steps.length,0),dn=L.reduce((a,i)=>a+ST.q[i].steps.filter(s=>s.done).length,0);
 $('#bar').style.width=(tot?dn/tot*100:0)+'%';
}
function twoTap(b,msg,fn){if(!b)return;b.onclick=()=>{if(b.dataset.arm==='1'){fn();return}b.dataset.arm='1';const t=b.textContent;b.textContent=msg;b.classList.add('arm');setTimeout(()=>{if(b.isConnected&&b.dataset.arm==='1'){b.dataset.arm='';b.textContent=t;b.classList.remove('arm')}},4000)}}
function render(){if(ST.view==='q')ST.sess=sessIdx(ST.cur);chips();if(ST.view==='sum')return renderSum();renderQ(ST.cur)}

function renderQ(i){
 const d=DATA[i],q=ST.q[i],m=$('#main');const a=active(i);
 let h=`<section style="--c:${color(d)}"><div class="qhead"><span class="badge">${d.type}</span><h2>${esc(d.title)}</h2><span class="src">원 문항 ${d.src}번 변형</span>${q.steps.some(s=>s.done||s.att)?`<button class="btn ghost redo1" id="redo1">이 문제 처음부터 다시 풀기</button>`:''}</div>`;
 h+=`<div class="formula">${d.formula.map(f=>`<div>${esc(f)}</div>`).join('')}</div>`;
 const finDone=(()=>{const fk=d.steps.findIndex(x=>x.k==='final');return fk>=0&&q.steps[fk].done})();
 if(finDone)h+=`<div class="trbar"><button class="btn ghost" id="trbtn">${ST.tr?'문장별 해석 끄기':'문장별 해석 켜기'}</button><span>영어 한 문장 ↔ 해석 한 줄 + 구문 포인트</span></div>`;
 const showTr=ST.tr&&finDone;let n=0;
 h+=`<div class="paper${showTr?' tron':''}" id="psg">${d.blocks.map(b=>showTr
  ?`<div class="blk2${b.g?' given':''}">${b.l?`<span class="lab">${esc(b.l)}</span>`:''}${b.s.map(x=>{n++;return `<div class="pair"><div class="en"><span class="sn">${n}</span>${mk(x[0])}</div><div class="kr">${esc(x[1])}</div>${x[2]?`<div class="nt">구문  ${esc(x[2])}</div>`:''}</div>`}).join('')}</div>`
  :`<p class="blk${b.g?' given':''}">${b.l?`<span class="lab">${esc(b.l)}</span>`:''}${b.s.map(x=>{n++;return `<span class="sen" data-sn="${n}">${mk(x[0])}</span>`}).join(' ')}</p>`).join('')}</div>`;
 if(d.preview&&!qDone(i)){const fo=d.steps.find(x=>x.k==='final').o;h+=`<div class="pv"><div class="pvh">선지 미리 보기 — 고르기는 마지막 단계에서</div>${fo.map(o=>`<div class="pvo">${esc(o)}</div>`).join('')}</div>`}
 d.steps.forEach((s,k)=>{h+=stepHTML(i,k,a)});
 if(qDone(i))h+=afterHTML(d);
 if(qDone(i)){h+=`<div class="next">${(()=>{const L=sessQ(sessIdx(i)),j=L.indexOf(i);return j<L.length-1?`<button class="btn" id="nx">다음 문제 (${DATA[L[j+1]].src}번)</button>`:`<button class="btn" id="nx">${SS.length>1?esc(SS[sessIdx(i)].n)+' 결과 보기':'결과 보기'}</button>`})()}</div>`}
 h+='</section>';m.innerHTML=h;
 paintPassage(i);bind(i);
}
function stepHTML(i,k,a){
 const d=DATA[i],s=d.steps[k],st=ST.q[i].steps[k];
 const lock=!st.done&&k!==a;
 const title=s.k==='final'?s.q:s.q;
 if(lock)return `<div class="step lock"><div class="shd"><span class="num">${k+1}</span><span class="sq">${s.k==='final'?'정답 고르기':'잠김'} — 앞 단계를 맞히면 열린다</span></div></div>`;
 let b='';
 if(s.k==='choice'||s.k==='final'){
  b=`<div class="opts">${s.o.map((o,j)=>{let c='opt';if(st.done&&j===s.a)c+=' pick';else if(!st.done&&st.bad.includes(j))c+=' no';if(!st.done&&st.rv&&j===s.a)c+=' show';return `<button class="${c}" data-s="${k}" data-o="${j}" ${st.done?'disabled':''}>${esc(o)}</button>`}).join('')}</div>`;
 }else if(s.k==='tap'){
  b=`<p class="tapnote">${st.done?'찾은 단서가 지문에 밑줄로 남아 있다.':'위 지문에서 해당 부분을 탭한 뒤 확인을 누르세요. 다시 탭하면 취소된다.'}</p>${st.done?'':`<button class="btn" data-chk="${k}">확인</button>`}`;
 }else if(s.k==='order'){
  const lab=st.sel.length?st.sel.map(n=>n+'번째').join(' → '):'아직 안 고름';
  b=st.done?`<p class="tapnote">지문에 읽는 순서 번호가 남아 있다.</p>`:`<p class="tapnote">위 지문에서 문장을 순서대로 탭하세요. 다시 탭하면 빠진다.</p><div class="seqv">선택: ${esc(lab)}</div><button class="btn" data-chk="${k}">확인</button> <button class="btn ghost" data-clr="${k}">다시 고르기</button>`;
 }else if(s.k==='match'){
  b=s.rows.map((r,ri)=>{const v=st.sel[ri];const x=!st.done&&st.bad.includes(ri);return `<div class="mrow"><div class="mlab${x?' x':''}">${esc(r[0])}</div><div class="rchips">${r[1].map((o,j)=>{let c='rchip';if(v===j)c+=' sel';if(!st.done&&st.rv&&j===r[2]&&v!==j)c+=' show';return `<button class="${c}" data-s="${k}" data-r="${ri}" data-o="${j}" ${st.done?'disabled':''}>${esc(o)}</button>`}).join('')}</div></div>`}).join('')+(st.done?'':`<button class="btn" data-chk="${k}">확인</button>`);
 }
 let msg='';
 if(st.done){msg=`<div class="msg ok">${st.res===1?'한 번에 정답!':st.res===2?'힌트 보고 정답.':'정답 확인 후 직접 해결.'}${s.w?' '+esc(s.w):''}</div>`}
 else if(st.msg){msg=`<div class="msg ${st.mt}">${esc(st.msg)}</div>`}
 const pre=s.pre?`<div class="pre">${s.pre.map(l=>`<div>${esc(l)}</div>`).join('')}</div>`:'';
 return `<div class="step${st.done?' ok':''}" id="st${k}"><div class="shd"><span class="num">${k+1}</span><span class="sq">${esc(title)}</span></div><div class="sbody">${pre}${b}${msg}</div></div>`;
}
function paintPassage(i){
 const d=DATA[i],q=ST.q[i],a=active(i);
 const found=new Set();d.steps.forEach((s,k)=>{if(s.k==='tap'&&q.steps[k].done)s.a.forEach(x=>found.add(x))});
 const s=a>=0?d.steps[a]:null,st=a>=0?q.steps[a]:null;
 document.querySelectorAll('#psg .sen').forEach(el=>{const n=+el.dataset.sn;el.className='sen';delete el.dataset.pick;delete el.dataset.ord;
  if(s&&s.k==='order'){el.classList.add('scand');const p=st.sel.indexOf(n);if(p>=0){el.classList.add('spick');el.dataset.pick=s.any?'✓':String(p+1)}if(st.rv&&!st.sel.includes(n)&&s.seq.includes(n))el.classList.add('sshow')}
  if(!(s&&s.k==='order'))d.steps.forEach((s2,k2)=>{if(s2.k!=='order'||!q.steps[k2].done)return;const R={};(s2.roles||'').split('|').forEach(x=>{const p=x.indexOf(':');if(p>0)R[+x.slice(0,p)]=x.slice(p+1)});
   if(s2.seq.includes(n)){el.classList.add('key');el.dataset.ord=(s2.any?'':(s2.seq.indexOf(n)+1)+' ')+(R[n]||'읽기')}else if(R[n]){el.classList.add('skip');el.dataset.ord=R[n]}});
 });
 document.querySelectorAll('#psg .cue').forEach(el=>{el.classList.toggle('on',!!(s&&s.cue&&s.cue.includes(el.dataset.cue)))});
 document.querySelectorAll('#psg .tk').forEach(el=>{
  const id=el.dataset.id;el.className='tk';delete el.dataset.bn;el.removeAttribute('tabindex');el.removeAttribute('role');
  if(found.has(id))el.classList.add('found');
  if(s&&s.k==='tap'&&s.c.includes(id)){el.classList.add('cand');if(s.box){el.classList.add('box');el.dataset.bn=s.c.indexOf(id)+1}else delete el.dataset.bn;el.tabIndex=0;el.setAttribute('role','button');
   if(st.sel.includes(id))el.classList.add('sel');
   if(st.rv&&s.a.includes(id)&&!st.sel.includes(id))el.classList.add('show');
   if(st.bad.includes(id)&&!st.sel.includes(id))el.classList.add('wrong');}
 });
}
function bind(i){
 const d=DATA[i],q=ST.q[i];
 document.querySelectorAll('#psg .tk').forEach(el=>{
  const f=()=>{const a=active(i);if(a<0)return;const s=d.steps[a];if(s.k!=='tap'||!s.c.includes(el.dataset.id))return;const st=q.steps[a];const id=el.dataset.id;st.bad=st.bad.filter(x=>x!==id);
   st.sel=st.sel.includes(id)?st.sel.filter(x=>x!==id):[...st.sel,id];paintPassage(i)};
  el.onclick=f;el.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();f()}};
 });
 document.querySelectorAll('#psg .sen').forEach(el=>{el.addEventListener('click',()=>{const a=active(i);if(a<0)return;const s=d.steps[a];if(s.k!=='order')return;const st=q.steps[a];const n=+el.dataset.sn;st.sel=st.sel.includes(n)?st.sel.filter(x=>x!==n):[...st.sel,n];st.msg='';renderKeep(i,a)})});
 document.querySelectorAll('[data-clr]').forEach(b=>b.onclick=()=>{const k=+b.dataset.clr;q.steps[k].sel=[];renderKeep(i,k)});
 document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{const k=+b.dataset.s,j=+b.dataset.o;const st=q.steps[k];st.sel=j;check(i,k)});
 document.querySelectorAll('.rchip').forEach(b=>b.onclick=()=>{const k=+b.dataset.s,r=+b.dataset.r,j=+b.dataset.o;const st=q.steps[k];st.sel[r]=j;st.bad=st.bad.filter(x=>x!==r);renderKeep(i,k)});
 document.querySelectorAll('[data-chk]').forEach(b=>b.onclick=()=>check(i,+b.dataset.chk));
 const tb=$('#trbtn');if(tb)tb.onclick=()=>{ST.tr=!ST.tr;save();renderKeep(i,0)};
 twoTap($('#redo1'),'한 번 더 누르면 처음부터',()=>{ST.q[i]={steps:d.steps.map(s=>newStep(s))};ST.view='q';save();render();window.scrollTo({top:0,behavior:'smooth'})});
 const nx=$('#nx');if(nx)nx.onclick=()=>{const L=sessQ(sessIdx(i)),j=L.indexOf(i);if(j<L.length-1){ST.cur=L[j+1];ST.view='q'}else ST.view='sum';save();render();window.scrollTo({top:0,behavior:'smooth'})};
}
function renderKeep(i,k){const y=window.scrollY;renderQ(i);chips();window.scrollTo(0,y)}
function check(i,k){
 const s=DATA[i].steps[k],st=ST.q[i].steps[k];let ok=false;
 if(s.k==='choice'||s.k==='final'){ok=st.sel===s.a;if(!ok&&!st.bad.includes(st.sel))st.bad.push(st.sel)}
 else if(s.k==='tap'){const A=new Set(s.a),S=new Set(st.sel);ok=A.size===S.size&&[...A].every(x=>S.has(x));if(!ok){st.bad=st.sel.filter(x=>!A.has(x));st.sel=st.sel.filter(x=>A.has(x))}}
 else if(s.k==='order'){if(s.any){const A=new Set(s.seq),S=new Set(st.sel);ok=A.size===S.size&&[...A].every(x=>S.has(x));if(!ok)st.sel=st.sel.filter(x=>A.has(x))}else{ok=st.sel.length===s.seq.length&&st.sel.every((x,j)=>x===s.seq[j]);if(!ok)st.sel=[]}}
 else if(s.k==='match'){if(st.sel.some(v=>v===null)){st.msg='모든 줄을 골라야 확인할 수 있어요.';st.mt='hint';return renderKeep(i,k)}st.bad=[];s.rows.forEach((r,ri)=>{if(st.sel[ri]!==r[2])st.bad.push(ri)});ok=st.bad.length===0;if(!ok)st.bad.forEach(ri=>st.sel[ri]=null)}
 if(ok){st.done=true;st.res=st.rv?3:(st.att===0?1:2);st.msg='';st.bad=[];save();renderKeep(i,k);
  const nxt=document.getElementById('st'+(k+1));const tgt=nxt||document.querySelector('.after');if(tgt){tgt.classList.add('flash');tgt.scrollIntoView({behavior:'smooth',block:'center'})}
  return}
 st.att++;
 if(st.att===1){st.msg='힌트: '+s.h;st.mt='hint'}
 else{st.rv=true;st.msg=s.k==='order'?'읽어야 할 문장을 빨간 점선으로 표시했어요. '+(s.any?'모두 탭하고':'순서대로 탭하고')+' 확인을 누르세요.':s.k==='tap'?'정답 위치를 빨간 점선으로 표시했어요. 직접 탭해서 확인을 누르세요.':s.k==='match'?'정답을 빨간 점선으로 표시했어요. 직접 골라서 확인을 누르세요.':'정답을 빨간 점선으로 표시했어요. 직접 눌러서 넘어가세요.';st.mt='rv'}
 save();renderKeep(i,k);
}
function afterHTML(d){
 const A=d.after;
 return `<div class="after"><h3>정답 ${(()=>{const f=d.steps.find(x=>x.k==='final');return esc(f.o[f.a].split(' ')[0])})()} — 해설</h3>
 <h4>선지 판정</h4><div class="olist">${A.opts.map(o=>`<div><b>${esc(o[0])}</b>${esc(o[1])}</div>`).join('')}</div>
 <h4>연결구조</h4><table class="lk">${A.link.map(r=>`<tr><td>${esc(r[0])}</td><td>${esc(r[1])}</td></tr>`).join('')}</table>
 <p style="font-size:15.5px;margin:12px 0 0">${esc(A.note)}</p>
 ${A.more?`<h4>같이 알아두면 좋을 표현</h4>${A.more.map(g=>`<div class="mg"><div class="mgt">${esc(g.t)}</div>${g.i.map(x=>`<div class="mgi"><b>${esc(x[0])}</b><span>${esc(x[1])}</span></div>`).join('')}</div>`).join('')}`:''}
 <p style="font-size:14.5px;color:var(--muted);margin:10px 0 0">지문 위 "문장별 해석 켜기"를 누르면 문장마다 해석과 구문 포인트가 나온다.</p></div>`;
}
function stats(L){let o=0,h=0,r=0;L.forEach(i=>ST.q[i].steps.forEach(s=>{if(s.res===1)o++;else if(s.res===2)h++;else if(s.res===3)r++}));return{o,h,r}}
function code(L,k){const{o,h,r}=stats(L);const p=n=>String(n).padStart(2,'0');const c=String.fromCharCode(65+((o*3+h*5+r*7+k*11)%26));return `${EXAM.code}${SS.length>1?'-S'+sessNum(k):''}-${p(o)}${p(h)}${p(r)}-${c}`}
function renderSum(){
 const k=ST.sess,L=sessQ(k),S=SS[k];const{o,h,r}=stats(L);const fin=sessDone(k);const nm=SS.length>1?S.n:'';
 let x=`<div class="sum"><h2>${fin?(nm?nm+' 완료':L.length+'문항 완료'):(nm?nm+' 진행 상황':'진행 상황')}</h2>${S.t?`<p style="margin:0 0 4px;font-weight:700">${esc(S.t)}</p>`:''}<p style="margin:0;color:var(--muted)">${fin?'완료 코드를 클래스룸 댓글로 제출하세요.':L.length+'문항을 모두 끝내면 완료 코드가 나온다.'}</p>
 ${fin?`<div class="code">${code(L,k)}</div>`:''}
 <div class="stats"><div><b>${o}</b>한 번에 정답</div><div><b>${h}</b>힌트 후 정답</div><div><b>${r}</b>정답 공개</div></div>
 <h3 style="font-size:17px;margin:16px 0 4px">문항별</h3>`;
 L.forEach(i=>{const d=DATA[i],q=ST.q[i];const rv=q.steps.filter(s=>s.res===3).length,hh=q.steps.filter(s=>s.res===2).length;
  const dn=qDone(i);x+=`<div class="qline"><span><span class="badge" style="--c:${color(d)}">${d.type}</span> ${d.src}번 변형 — ${dn?`힌트 ${hh} · 공개 ${rv}`:'아직 안 끝남'}</span>${dn?'':`<button class="btn ghost" data-go="${i}">풀러 가기</button>`}${rv?`<button class="btn ghost" data-redo="${i}">공개된 문제 다시 풀기</button>`:''}</div>`});
 x+=`<div style="margin-top:16px;display:flex;gap:8px;flex-wrap:wrap">${fin&&k<SS.length-1?`<button class="btn" id="nsess">다음 회차로 (${esc(SS[k+1].n)})</button>`:''}<button class="btn ghost" id="redoS">${nm?esc(nm)+' ':''}전부 다시 풀기</button><button class="btn ghost" id="reset">모든 회차 기록 지우기</button></div></div>`;
 $('#main').innerHTML=x;
 document.querySelectorAll('[data-redo]').forEach(b=>b.onclick=()=>{const i=+b.dataset.redo;ST.q[i]={steps:DATA[i].steps.map(s=>newStep(s))};ST.cur=i;ST.view='q';save();render();window.scrollTo({top:0})});
 document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{ST.cur=+b.dataset.go;ST.view='q';save();render();window.scrollTo({top:0})});
 const ns=$('#nsess');if(ns)ns.onclick=()=>{ST.sess=k+1;ST.cur=sessQ(k+1)[0];ST.view='q';save();render();window.scrollTo({top:0})};
 twoTap($('#redoS'),'한 번 더 누르면 이 회차만 처음부터',()=>{L.forEach(i=>{ST.q[i]={steps:DATA[i].steps.map(s=>newStep(s))}});ST.cur=L[0];ST.view='q';save();render();window.scrollTo({top:0})});
 twoTap($('#reset'),'한 번 더 누르면 모든 기록 삭제',()=>{ST=fresh();ST.sess=0;save();render()});
}
/* 시작 */
document.title=EXAM.title;$('#ttl').textContent=EXAM.title;$('#sub').textContent=EXAM.sub;$('#foot').textContent=EXAM.footer+(EXAM.ver?' · '+EXAM.ver:'');
try{render()}catch(e){console.error(e);ST=fresh();ST.sess=0;try{save()}catch(_){}render()}
</script></body></html>
