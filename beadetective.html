<style>
:root{
  --bg:#f5f4fa; --card:#fff; --card2:#eeecf7; --card3:#f8f7fd;
  --primary:#5b4fa8; --primary-lt:#ece9f8; --primary-dk:#3b2f8a;
  --accent:#e8a020; --accent-lt:#fef3dc;
  --text:#1a1a2e; --muted:#6b6880; --border:#d8d4ee;
  --ok:#1a7a3c; --ok-bg:#e8f5ec; --no:#c0392b; --no-bg:#fdecea;
  --info:#3a5fa8; --info-bg:#e8f0fb; --r:12px;

*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Noto Sans KR',sans-serif;background:var(--bg);color:var(--text);padding:14px 10px 60px;}
.wrap{max-width:740px;margin:0 auto;}
header{background:linear-gradient(135deg,#3b2f8a,#7b6fd0);border-radius:16px;padding:20px 22px;color:#fff;margin-bottom:12px;}
header .brand{font-size:11px;font-weight:900;letter-spacing:2px;opacity:.85;}
header h1{font-size:20px;font-weight:900;margin-top:4px;}
header .sub{font-size:12px;opacity:.85;margin-top:4px;}
.tabs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px;}
.tab{flex:1;min-width:150px;background:var(--card);border:2px solid var(--border);border-radius:10px;padding:10px 6px;font-size:12.5px;font-weight:700;color:var(--muted);text-align:center;cursor:pointer;transition:.15s;}
.tab.on{background:var(--primary);border-color:var(--primary);color:#fff;}
.card{background:var(--card);border:1.5px solid var(--border);border-radius:var(--r);padding:16px;margin-bottom:12px;}
.sec-title{font-size:15px;font-weight:900;color:var(--primary-dk);margin-bottom:10px;display:flex;align-items:center;gap:6px;}
.check-bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;}
.cb-btn{flex:1;min-width:110px;border:none;border-radius:10px;padding:11px 8px;font-size:13px;font-weight:900;cursor:pointer;font-family:inherit;}
.cb-btn.main{background:var(--primary);color:#fff;}
.cb-btn.warn{background:var(--accent);color:#fff;}
.cb-btn.ghost{background:var(--card2);color:var(--muted);}
.score-line{font-size:14px;font-weight:900;color:var(--primary-dk);text-align:center;margin:8px 0;display:none;}
.score-line.show{display:block;}
/* vocab card */
.v-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
@media(max-width:560px){.v-grid{grid-template-columns:1fr;}}
.vc{background:var(--card3);border:1.5px solid var(--border);border-radius:10px;padding:11px 12px;}
.vc .vc-blank{font-family:'Lora',serif;font-size:16px;font-weight:600;letter-spacing:2px;color:var(--primary-dk);}
.vc .vc-kr{font-size:12px;color:var(--muted);margin:3px 0 7px;}
.vc input{width:100%;border:1.5px solid var(--border);border-radius:8px;padding:8px 10px;font-size:14px;font-family:'Lora',serif;}
.vc input.ok{border-color:var(--ok);background:var(--ok-bg);}
.vc input.no{border-color:var(--no);background:var(--no-bg);}
.vc-row{display:flex;gap:6px;margin-top:6px;}
.vc-row button{border:none;background:var(--primary-lt);color:var(--primary);border-radius:8px;padding:7px 12px;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit;}
.vc-fb{display:none;font-size:12px;font-weight:700;margin-top:6px;}
.vc-fb.ok{display:block;color:var(--ok);}
.vc-fb.no{display:block;color:var(--no);}
.poly{background:var(--accent-lt);border:1.5px solid #f0d090;border-radius:8px;padding:8px 10px;margin-top:8px;font-size:11.5px;}
.poly .p-title{font-weight:900;color:var(--accent);margin-bottom:4px;}
.poly .p-row{display:flex;gap:6px;line-height:1.7;}
.poly .p-row i{font-family:'Lora',serif;color:var(--muted);}
.poly .p-note{margin-top:4px;font-weight:700;color:var(--no);}
/* dict */
.dc{background:var(--card3);border:1.5px solid var(--border);border-radius:10px;padding:12px 14px;margin-bottom:10px;}
.dc .dc-def{font-family:'Lora',serif;font-size:14px;line-height:1.8;}
.dc .dc-kr{font-size:12px;color:var(--muted);margin:3px 0 7px;}
/* dialogue */
.dlg-head{background:var(--primary-lt);border-left:5px solid var(--primary);border-radius:10px;padding:12px 14px;margin-bottom:10px;}
.dlg-head .dh-t{font-size:14px;font-weight:900;color:var(--primary-dk);}
.key-box{background:var(--info-bg);border:1.5px solid #b0c8f0;border-radius:10px;padding:11px 14px;margin-bottom:10px;font-size:13px;}
.key-box .kb-e{font-family:'Lora',serif;font-weight:600;font-size:15px;color:var(--info);}
.key-box .kb-m{font-weight:700;margin-top:2px;}
.key-box .kb-u{font-size:12px;color:var(--muted);margin-top:4px;padding-top:4px;border-top:1px dashed var(--border);}
.sim-list{background:var(--ok-bg);border:1.5px solid #b2d8c2;border-radius:10px;padding:10px 14px;margin-bottom:10px;font-size:12.5px;}
.sim-list .sl-t{font-weight:900;color:var(--ok);margin-bottom:4px;font-size:12px;}
.sim-list .sl-r{line-height:1.9;}
.sim-list .sl-r i{color:var(--muted);font-style:normal;font-size:11.5px;}
.wrong-box{background:var(--no-bg);border:1.5px solid #e8b0c0;border-radius:10px;padding:10px 14px;margin-bottom:10px;font-size:12.5px;}
.wrong-box .wb-t{font-weight:900;color:var(--no);font-size:12px;margin-bottom:4px;}
.wrong-box .wb-e{font-family:'Lora',serif;text-decoration:line-through;}
.script-tg{width:100%;border:none;background:var(--card2);color:var(--primary-dk);border-radius:10px;padding:10px;font-size:13px;font-weight:900;cursor:pointer;font-family:inherit;margin-bottom:8px;}
.script{display:none;background:var(--card3);border:1.5px solid var(--border);border-radius:10px;padding:12px 14px;margin-bottom:10px;}
.script.open{display:block;}
.line{display:flex;gap:8px;margin-bottom:7px;font-size:13px;line-height:1.7;}
.line .sp{flex-shrink:0;width:26px;height:26px;border-radius:50%;background:var(--primary);color:#fff;font-size:11px;font-weight:900;display:flex;align-items:center;justify-content:center;}
.line .tx{font-family:'Lora',serif;padding-top:2px;}

.q-card{background:var(--card3);border:1.5px solid var(--border);border-radius:10px;padding:12px 14px;margin-bottom:10px;}
.q-num{display:inline-block;background:var(--primary);color:#fff;border-radius:6px;font-size:11px;font-weight:900;padding:2px 8px;margin-bottom:6px;}
.q-tag{display:inline-block;background:var(--accent-lt);color:var(--accent);border:1px solid #f0d090;border-radius:6px;font-size:11px;font-weight:700;padding:2px 8px;margin-left:4px;}
.q-t{font-size:13.5px;font-weight:700;line-height:1.7;margin-bottom:8px;}
.q-sent{font-family:'Lora',serif;font-size:14px;line-height:2;background:#fff;border:1px dashed var(--border);border-radius:8px;padding:8px 12px;margin-bottom:8px;}
.mc-opt{border:1.5px solid var(--border);background:#fff;border-radius:9px;padding:9px 12px;font-size:13px;margin-bottom:6px;cursor:pointer;line-height:1.6;transition:.12s;}
.mc-opt:hover{border-color:var(--primary);}
.mc-opt.ok{border-color:var(--ok);background:var(--ok-bg);font-weight:700;}
.mc-opt.no{border-color:var(--no);background:var(--no-bg);}
.mc-opt.rv{border-color:var(--ok);background:var(--ok-bg);}
.mc-opt.dis{pointer-events:none;opacity:.85;}
.fill-row{display:flex;gap:6px;}
.fill-row input{flex:1;border:1.5px solid var(--border);border-radius:8px;padding:9px 12px;font-size:14px;font-family:'Lora',serif;}
.fill-row input.ok{border-color:var(--ok);background:var(--ok-bg);}
.fill-row input.no{border-color:var(--no);background:var(--no-bg);}
.fill-row button{border:none;background:var(--primary);color:#fff;border-radius:8px;padding:0 16px;font-size:13px;font-weight:900;cursor:pointer;font-family:inherit;}
.q-fb{display:none;font-size:12.5px;font-weight:700;margin-top:7px;line-height:1.6;}
.q-fb.show{display:block;}
.q-fb.ok{color:var(--ok);}
.q-fb.no{color:var(--no);}
.ord-chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px;}
.ord-chip{border:1.5px solid var(--primary);color:var(--primary);background:#fff;border-radius:8px;padding:7px 11px;font-size:12.5px;font-family:'Lora',serif;cursor:pointer;}
.ord-chip.used{opacity:.3;pointer-events:none;}
.ord-slots{min-height:44px;border:2px dashed var(--border);border-radius:10px;padding:8px;display:flex;flex-direction:column;gap:5px;margin-bottom:8px;}
.ord-slots>span{font-size:12px;color:var(--muted);align-self:center;margin:auto;}
.ord-slot{background:var(--primary-lt);border:1.5px solid var(--border);border-radius:8px;padding:7px 11px;font-size:12.5px;font-family:'Lora',serif;cursor:pointer;}
.ord-btns{display:flex;gap:6px;}
.ord-btns button{border:none;border-radius:8px;padding:8px 14px;font-size:12.5px;font-weight:900;cursor:pointer;font-family:inherit;}
.ord-btns .ob-c{background:var(--primary);color:#fff;}
.ord-btns .ob-r{background:var(--card2);color:var(--muted);}
.ins-box{background:var(--accent-lt);border:1.5px solid #f0d090;border-radius:8px;padding:9px 12px;font-family:'Lora',serif;font-size:13.5px;margin-bottom:8px;}
.ins-lines{margin-bottom:8px;}
.ins-line{font-family:'Lora',serif;font-size:13px;line-height:1.8;padding:5px 10px;border-left:3px solid var(--border);margin-bottom:4px;background:#fff;border-radius:0 8px 8px 0;}
.ins-btns{display:flex;flex-wrap:wrap;gap:6px;}
.ins-btns button{border:1.5px solid var(--border);background:#fff;border-radius:8px;padding:7px 12px;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit;}
.ins-btns button.ok{border-color:var(--ok);background:var(--ok-bg);color:var(--ok);}
.ins-btns button.no{border-color:var(--no);background:var(--no-bg);color:var(--no);}
.ans-r{display:none;background:var(--ok-bg);border:1.5px solid #b2d8c2;border-radius:8px;padding:8px 12px;font-size:12.5px;margin-top:7px;line-height:1.7;}
.ans-r.open{display:block;}
.foot{text-align:center;font-size:11px;color:var(--muted);margin-top:20px;}
</style>
</head>

let audioCtx=null;
document.addEventListener('click',function(){if(!audioCtx){try{audioCtx=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}},{once:true});
function playPageTurn(){
  try{
    if(!audioCtx) return;
    const dur=0.12, buf=audioCtx.createBuffer(1,audioCtx.sampleRate*dur,audioCtx.sampleRate);
    const d=buf.getChannelData(0);
    for(let i=0;i<d.length;i++) d[i]=(Math.random()*2-1)*(1-i/d.length);
    const src=audioCtx.createBufferSource(); src.buffer=buf;
    const bp=audioCtx.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value=1600;
    const g=audioCtx.createGain(); g.gain.value=0.18;
    src.connect(bp); bp.connect(g); g.connect(audioCtx.destination); src.start();
  }catch(e){}
}
function norm(s){
  return (s||'').toLowerCase()
    .replace(/[^a-z0-9\-\s]/gi,'')
    .replace(/\s+/g,' ')
    .trim();
}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function makeBlank(en,mode){
  const chars=en.split('');
  const li=[]; chars.forEach((c,i)=>{if(/[a-zA-Z]/.test(c))li.push(i);});
  if(mode===0){
    let out=chars.map(c=>/[aeiouAEIOU]/.test(c)?'_':c);
    if(!out.includes('_')&&li.length>1) out[li[1]]='_';
    return out.join('');
  }
  if(mode===1){
    const keep=Math.max(1,Math.ceil(li.length*0.4));
    const cut=new Set(li.slice(keep));
    return chars.map((c,i)=>cut.has(i)?'_':c).join('');
  }
  const k=li.length<=5?1:2;
  const keepSet=new Set(li.slice(0,k).concat(li.slice(-k)));
  return chars.map((c,i)=>/[a-zA-Z]/.test(c)&&!keepSet.has(i)?'_':c).join('');
}
function go(v){
  playPageTurn();
  for(let i=0;i<5;i++){const t=document.getElementById('t'+i); if(t)t.classList.toggle('on',i===v);}
  window.scrollTo(0,0);
  const app=document.getElementById('app'); app.innerHTML='';

}

      if(q.type==='mc-wrong'||q.type==='mc-match'){
        q.opts.forEach((o,oi)=>{
          h+='<div class="mc-opt" id="mo_'+qid+'_'+oi+'" onclick="ansMC(\''+qid+'\','+oi+')">'+String.fromCharCode(9312+oi)+' '+esc(o)+'</div>';
        });
        h+='<div class="q-fb" id="fb_'+qid+'"></div>';
      }else if(q.type==='fill'){
        h+='<div class="q-sent">'+esc(q.sent)+'</div>';
        h+='<div class="fill-row"><input id="fi_'+qid+'" autocomplete="off" autocapitalize="off" placeholder="빈칸에 들어갈 말" onkeydown="if(event.key===\'Enter\')checkFill(\''+qid+'\')"><button onclick="checkFill(\''+qid+'\')">채점</button></div>';
        h+='<div class="q-fb" id="fb_'+qid+'"></div>';
      }else if(q.type==='order'){
        ordPlaced[qid]=[];
        h+='<div class="ord-chips">';
        q.chips.forEach((c,ci)=>{h+='<div class="ord-chip" id="oc_'+qid+'_'+ci+'" onclick="addOrdChip(\''+qid+'\','+ci+')">'+esc(c)+'</div>';});
        h+='</div><div class="ord-slots" id="os_'+qid+'"><span>여기에 순서대로 클릭하세요</span></div>';
        h+='<div class="ord-btns"><button class="ob-c" onclick="checkOrder(\''+qid+'\')">채점</button><button class="ob-r" onclick="resetOrder(\''+qid+'\','+q.chips.length+')">다시</button></div>';
        h+='<div class="q-fb" id="fb_'+qid+'"></div>';
        h+='<div class="ans-r" id="'+qid+'_rev"></div>';
      }else if(q.type==='insert'){
        h+='<div class="ins-box">👉 '+esc(q.ins)+'</div><div class="ins-lines">';
        q.lines.forEach((l,li)=>{h+='<div class="ins-line">'+(li+1)+'. '+esc(l)+'</div>';});
        h+='</div><div class="ins-btns">';
        for(let p=0;p<=q.lines.length;p++){
          h+='<button id="ib_'+qid+'_'+p+'" onclick="checkInsert(\''+qid+'\','+p+')">'+(p===0?'맨 앞':p+'번 뒤')+'</button>';
        }
        h+='</div><div class="q-fb" id="fb_'+qid+'"></div>';
      }
      h+='</div>';
    });
    h+='</div>';
  });
  app.innerHTML=h;
}
function toggleScript(id){
  const el=document.getElementById(id);
  if(el) el.classList.toggle('open');
}
function ansMC(qid,sel){
  const q=_qMap[qid]; if(!q)return;
  const correct=(q.type==='mc-wrong')?q.wrongIdx:q.ans;
  const fb=document.getElementById('fb_'+qid);
  q.opts.forEach((o,oi)=>{
    const el=document.getElementById('mo_'+qid+'_'+oi);
    if(!el)return;
    el.classList.add('dis');
    el.classList.remove('ok','no','rv');
    if(oi===sel) el.classList.add(oi===correct?'ok':'no');
    else if(oi===correct) el.classList.add('rv');
  });
  const ok=sel===correct;
  fb.className='q-fb show '+(ok?'ok':'no');
  fb.innerHTML=(ok?'✅ 정답! ':'❌ 오답! 정답: '+String.fromCharCode(9312+correct)+' ')+esc(q.fb||'');
}
function checkFill(qid){
  const q=_qMap[qid]; if(!q)return;
  const inp=document.getElementById('fi_'+qid), fb=document.getElementById('fb_'+qid);
  const ok=norm(inp.value)===norm(q.ans);
  inp.classList.remove('ok','no'); inp.classList.add(ok?'ok':'no');
  fb.className='q-fb show '+(ok?'ok':'no');
  fb.textContent=(ok?'✅ 정답! ':'❌ 정답: '+q.ans+' — ')+(q.fb||'');
}
function addOrdChip(qid,ci){
  const chip=document.getElementById('oc_'+qid+'_'+ci);
  if(!chip||chip.classList.contains('used'))return;
  chip.classList.add('used');
  ordPlaced[qid].push(ci);
  const slots=document.getElementById('os_'+qid);
  const hint=slots.querySelector('span');
  if(hint) hint.remove();
  const s=document.createElement('div');
  s.className='ord-slot';
  s.textContent=chip.textContent;
  s.onclick=function(){
    ordPlaced[qid].splice(ordPlaced[qid].indexOf(ci),1);
    s.remove();
    chip.classList.remove('used');
    if(slots.children.length===0)
      slots.innerHTML='<span>여기에 순서대로 클릭하세요</span>';
  };
  slots.appendChild(s);
}
function checkOrder(qid){
  const q=_qMap[qid]; if(!q)return;
  const fb=document.getElementById('fb_'+qid);
  const rev=document.getElementById(qid+'_rev');
  const ok=ordPlaced[qid].length===q.ans.length&&ordPlaced[qid].every((v,i)=>v===q.ans[i]);
  fb.className='q-fb show '+(ok?'ok':'no');
  fb.textContent=(ok?'✅ 정답! ':'❌ 오답! ')+(q.fb||'');
  if(!ok&&rev){
    rev.innerHTML='<b>정답 순서:</b><br>'+q.ans.map((ci,i)=>(i+1)+'. '+esc(q.chips[ci])).join('<br>');
    rev.classList.add('open');
  }
}
function resetOrder(qid,len){
  ordPlaced[qid]=[];
  for(let ci=0;ci<len;ci++){
    const chip=document.getElementById('oc_'+qid+'_'+ci);
    if(chip)chip.classList.remove('used');
  }
  const slots=document.getElementById('os_'+qid);
  slots.innerHTML='<span>여기에 순서대로 클릭하세요</span>';
  const fb=document.getElementById('fb_'+qid); fb.className='q-fb'; fb.textContent='';
  const rev=document.getElementById(qid+'_rev'); if(rev){rev.classList.remove('open');rev.innerHTML='';}
}
function checkInsert(qid,sel){
  const q=_qMap[qid]; if(!q)return;
  const fb=document.getElementById('fb_'+qid);
  for(let p=0;p<=q.lines.length;p++){
    const b=document.getElementById('ib_'+qid+'_'+p);
    if(!b)continue;
    b.classList.remove('ok','no');
    if(p===sel) b.classList.add(p===q.pos?'ok':'no');
    else if(p===q.pos&&sel!==q.pos) b.classList.add('ok');
  }
  const ok=sel===q.pos;
  fb.className='q-fb show '+(ok?'ok':'no');
  fb.textContent=(ok?'✅ 정답! ':'❌ 오답! 정답: '+(q.pos===0?'맨 앞':q.pos+'번 뒤')+' — ')+(q.exp||'');
}
function toggleAns(id){
  const el=document.getElementById(id);
  if(el) el.classList.toggle('open');
}

/* ---- 탭4 워드 플러스 ---- */

  let h='<div class="card"><div class="sec-title">🧩 워드 플러스 — 유의어 · 반의어 · 접두사/접미사 · 품사 동형</div>';
  h+='<div class="sim-list"><div class="sl-t">✨ 유의어 (= 같은 뜻)</div>';
  WP_SYN.forEach(p=>{h+='<div class="sl-r"><b>'+esc(p.w)+'</b> = '+esc(p.syn)+' <i>('+esc(p.kr)+')</i></div>';});
  h+='</div>';
  h+='<div class="wrong-box" style="margin-top:8px;"><div class="wb-t">↔ 반의어 (반대 뜻)</div>';
  WP_ANT.forEach(p=>{h+='<div class="wb-e" style="text-decoration:none;"><b>'+esc(p.w)+'</b> ↔ '+esc(p.ant)+' <span style="font-size:.85em;">('+esc(p.kr)+')</span></div>';});
  h+='</div>';
  h+='<div class="key-box" style="margin-top:8px;"><div class="kb-e">🔧 단어 만들기</div>'
    +'<div class="kb-m">접두사 <b>dis-</b> (반대): appear → disappear · like → dislike · agree → disagree</div>'
    +'<div class="kb-m">접미사 <b>-ache</b> (통증): stomachache · headache · toothache · backache</div>'
    +'<div class="kb-u">명사=동사 동형: <b>contact · cover · handle · lie · smell · guess</b> — 문장 속 위치로 품사 판별!</div></div>';
  h+='<div class="sec-title" style="margin-top:14px;">✔ 확인 문제 ('+WP_QS.length+'문항)</div>';
  WP_QS.forEach((q,i)=>{
    const qid='WP_'+i;
    h+='<div class="q-card"><span class="q-num">'+(i+1)+'</span><div class="q-t" style="margin-top:6px;">'+esc(q.q)+'</div>';
    if(q.type==='mc'){
      _qMap[qid]={type:'mc-match',opts:q.opts,ans:q.ans,fb:q.fb};
      q.opts.forEach((o,oi)=>{h+='<div class="mc-opt" id="mo_'+qid+'_'+oi+'" onclick="ansMC(\''+qid+'\','+oi+')">'+String.fromCharCode(9312+oi)+' '+esc(o)+'</div>';});
    }else{
      _qMap[qid]={type:'fill',ans:q.ans,fb:q.fb};
      h+='<div class="fill-row"><input id="fi_'+qid+'" autocomplete="off" autocapitalize="off" placeholder="단어 입력" onkeydown="if(event.key===\'Enter\')checkFill(\''+qid+'\')"><button onclick="checkFill(\''+qid+'\')">채점</button></div>';
    }
    h+='<div class="q-fb" id="fb_'+qid+'"></div></div>';
  });
  h+='</div>';
  document.getElementById('app').innerHTML=h;
}
go(0);
</script>
