<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>독해 3단원 — 심경 · 흐름</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#F4F5F7;--paper:#FFFFFF;--ink:#1E2330;--muted:#636A77;--line:#D8DCE3;--mark:#FFE07A;--ok:#17805A;--okbg:#E5F4EC;--bad:#C93C4A;--badbg:#FBE9EB;--hint:#9A6B00;--hintbg:#FFF5D6;}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Noto Sans KR',system-ui,sans-serif;font-size:17px;line-height:1.65;padding-bottom:env(safe-area-inset-bottom)}
.wrap{max-width:800px;margin:0 auto;padding:16px 16px 80px}
header.top{padding:18px 0 14px;border-bottom:2px solid var(--ink);margin-bottom:14px}
header.top h1{margin:0;font-size:24px;font-weight:900;letter-spacing:-.5px}
header.top p{margin:4px 0 0;color:var(--muted);font-size:15px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 6px}
.srow,.qrow{display:flex;flex-wrap:wrap;gap:8px;width:100%}
.srow{margin-bottom:6px}
.stab{font:inherit;border:2px solid var(--line);background:var(--paper);border-radius:8px;padding:6px 12px;cursor:pointer;color:var(--ink);display:flex;flex-direction:column;align-items:flex-start;line-height:1.35;min-height:46px;text-align:left}
.stab b{font-size:15px}
.stab span{font-size:12.5px;color:var(--muted)}
.stab.on{border-color:var(--ink);box-shadow:inset 0 -3px 0 var(--ink)}
.stab.done b::after{content:' ✓';color:var(--ok)}
.stab:disabled{opacity:.4;cursor:not-allowed}
.chip{border:2px solid var(--line);background:var(--paper);border-radius:999px;padding:6px 14px;font:inherit;font-size:15px;font-weight:700;color:var(--ink);cursor:pointer;display:flex;gap:6px;align-items:center;min-height:42px}
.chip .dot{width:9px;height:9px;border-radius:50%;background:var(--c)}
.chip.on{border-color:var(--c);box-shadow:inset 0 -3px 0 var(--c)}
.chip.done::after{content:'✓';color:var(--ok);font-weight:900}
.chip:disabled{opacity:.4;cursor:not-allowed}
.chip.res{--c:var(--ink)}
.progress{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin:6px 0 18px}
.progress i{display:block;height:100%;background:var(--ink);transition:width .4s}
.qhead{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin:6px 0 10px}
.btn.arm{background:var(--bad);border-color:var(--bad);color:#fff}
.qhead .redo1{margin:0 0 0 auto;min-height:36px;padding:4px 12px;font-size:14px}
.qhead h2{margin:0;font-size:22px;font-weight:900}
.badge{display:inline-block;border-radius:6px;padding:2px 10px;font-size:14px;font-weight:700;color:#fff;background:var(--c)}
.src{color:var(--muted);font-size:14px}
.formula{border-left:5px solid var(--c);padding:6px 0 6px 14px;margin:0 0 16px}
.formula div{font-weight:700;font-size:16px}
.formula div::before{content:'공식 ';color:var(--c);font-weight:900}
.paper{background:var(--paper);border:1px solid var(--line);border-radius:4px;padding:20px 22px;margin-bottom:18px}
.blk{margin:0 0 12px;font-size:18px;line-height:2.05}
.blk:last-child{margin-bottom:0}
.blk .lab{font-weight:900;margin-right:6px}
.blk.given{border:1.5px solid var(--ink);padding:8px 14px;border-radius:3px}
.blk.given .lab{display:block;font-size:14px;color:var(--muted);font-weight:700;line-height:1.4;margin-bottom:2px}
.blk u{text-decoration-thickness:2px;text-underline-offset:4px}
.trbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:0 0 10px}
.trbar .btn{margin:0}
.trbar span{color:var(--muted);font-size:14.5px}
.blk2{margin:0 0 14px}
.blk2.given{border:1.5px solid var(--ink);padding:6px 14px;border-radius:3px}
.blk2 .lab{display:block;font-weight:900;margin:0 0 2px}
.pair{padding:10px 0;border-top:1px dashed var(--line)}
.blk2 .pair:first-of-type{border-top:0}
.en{font-size:18px;line-height:1.9}
.sn{display:inline-block;min-width:22px;font-size:13px;font-weight:900;color:var(--muted);vertical-align:2px}
.kr{font-size:16px;line-height:1.8;color:#3A4150;padding-left:22px}
.nt{font-size:14.5px;line-height:1.7;color:var(--c);font-weight:700;padding-left:22px;margin-top:2px}
.cue.on{text-decoration:underline wavy var(--c);text-decoration-thickness:2px;text-underline-offset:5px;font-weight:700;color:var(--c)}
.sen.scand{cursor:pointer;border-radius:3px}
.sen.scand:hover{background:#EDF0F4}
.sen.spick{background:#FFF0B3}
.sen[data-pick]::before,.sen[data-ord]::before{content:attr(data-pick);display:inline-block;font-size:12px;font-weight:900;line-height:1;padding:3px 6px;border-radius:9px;background:var(--ink);color:#fff;margin-right:4px;vertical-align:2px}
.sen[data-ord]::before{content:attr(data-ord);background:var(--c)}
.sen.skip{color:#5F6672}
.sen.skip[data-ord]::before{background:#E1E4E9;color:#3F4550}
.tblw{margin:4px 0 14px;overflow-x:auto}
.tblt{font-weight:900;text-align:center;margin-bottom:6px}
.dt{border-collapse:collapse;width:100%;font-size:16px}
.dt th,.dt td{border:1px solid #9AA1AD;padding:6px 10px;text-align:left}
.dt th{background:#F1F3F6}
.dt td.n{text-align:center}
.tblu{font-size:13.5px;color:var(--muted);text-align:right;margin-top:4px}
.pv{border:1px dashed #AEB4BF;border-radius:4px;padding:10px 14px;margin:-8px 0 18px;background:#FAFBFC}
.pvh{font-size:13.5px;font-weight:700;color:var(--muted);margin-bottom:4px}
.pvo{font-size:15px;line-height:1.7;padding:2px 0}
.sen.sshow{outline:2px dashed var(--bad);outline-offset:2px}
.seqv{margin-top:6px;font-weight:700}
.tk{border-radius:3px;transition:background-color .25s}
.tk.cand{cursor:pointer;background-image:linear-gradient(transparent 88%,#B9BFCA 88%);padding:0 1px}
.tk.cand:hover{background-color:#F0F2F5}
.tk.cand.box{outline:2px dashed #8A93A3;outline-offset:2px;background-color:#F1F3F6;background-image:none;border-radius:4px;padding:0 3px}
.tk.box[data-bn]::before{content:attr(data-bn);display:inline-block;font-size:11.5px;font-weight:900;line-height:1;padding:3px 6px;border-radius:9px;background:#5F6672;color:#fff;margin-right:4px;vertical-align:2px}
.tk.sel{background-color:var(--mark)!important;background-image:none}
.tk.show{outline:2px dashed var(--bad);outline-offset:2px}
.tk.found{background-image:linear-gradient(transparent 82%,var(--c) 82%);font-weight:700}
.tk.wrong{background-color:var(--badbg)!important;text-decoration:line-through;text-decoration-color:var(--bad)}
.tk:focus-visible,.opt:focus-visible,.chip:focus-visible,.btn:focus-visible,.rchip:focus-visible{outline:3px solid #2B68C4;outline-offset:2px}
.step{background:var(--paper);border:1px solid var(--line);border-radius:4px;margin-bottom:12px;padding:16px 18px}
.step.lock{background:transparent;border-style:dashed;color:var(--muted);padding:12px 18px}
.step.ok{border-color:var(--ok)}
.shd{display:flex;gap:10px;align-items:flex-start}
.num{flex:none;width:30px;height:30px;border-radius:50%;border:2px solid var(--ink);display:grid;place-items:center;font-weight:900;font-size:15px}
.step.ok .num{background:var(--ok);border-color:var(--ok);color:#fff}
.step.lock .num{border-color:var(--line);color:var(--muted)}
.sq{font-weight:700;font-size:17px;padding-top:2px}
.sbody{margin:12px 0 0 40px}
.opts{display:grid;gap:8px}
.opt{text-align:left;font:inherit;font-size:16px;border:2px solid var(--line);background:#fff;border-radius:6px;padding:10px 14px;cursor:pointer;color:var(--ink);min-height:48px}
.opt:hover{border-color:#9AA2AF}
.opt.pick{border-color:var(--ok);background:var(--okbg);font-weight:700}
.opt.no{border-color:var(--bad);background:var(--badbg)}
.opt.show{border-style:dashed;border-color:var(--bad)}
.opt:disabled{cursor:default}
.mrow{border-top:1px solid var(--line);padding:10px 0}
.mrow:first-child{border-top:0;padding-top:0}
.mlab{font-weight:700;margin-bottom:6px}
.mlab.x::after{content:' — 다시';color:var(--bad);font-weight:700}
.rchips{display:flex;flex-wrap:wrap;gap:6px}
.rchip{font:inherit;font-size:15px;border:2px solid var(--line);background:#fff;border-radius:999px;padding:6px 12px;cursor:pointer;color:var(--ink);min-height:40px}
.rchip.sel{border-color:var(--ink);background:var(--ink);color:#fff}
.rchip.show{border-style:dashed;border-color:var(--bad)}
.rchip:disabled{cursor:default}
.btn{font:inherit;font-weight:700;font-size:16px;border:2px solid var(--ink);background:var(--ink);color:#fff;border-radius:6px;padding:10px 20px;cursor:pointer;margin-top:12px;min-height:46px}
.btn.ghost{background:#fff;color:var(--ink)}
.msg{margin-top:10px;padding:10px 12px;border-radius:6px;font-size:15.5px}
.msg.hint{background:var(--hintbg);color:#5E4300}
.msg.ok{background:var(--okbg);color:#0E5A3E}
.msg.rv{background:var(--badbg);color:#7D1F2A}
.pre{border-left:3px solid var(--c);padding:6px 0 6px 12px;margin:0 0 12px;font-size:15.5px;line-height:1.75}
.pre div:first-child{font-weight:700}
.tapnote{font-size:14.5px;color:var(--muted);margin:2px 0 0}
.after{background:var(--paper);border:2px solid var(--ok);border-radius:4px;padding:18px 20px;margin:6px 0 16px}
.after h3{margin:0 0 10px;font-size:19px}
.after h4{margin:16px 0 6px;font-size:16px}
.mg{margin:8px 0 12px;border-left:3px solid var(--c);padding-left:12px}
.mgt{font-weight:900;font-size:15px;margin-bottom:2px}
.mgi{padding:4px 0;border-top:1px dashed var(--line);font-size:15px;line-height:1.6}
.mgi:first-of-type{border-top:0}
.mgi b{display:block}
.mgi span{color:var(--muted)}
.olist div{padding:6px 0;border-top:1px solid var(--line);font-size:15.5px}
.olist div:first-child{border-top:0}
.olist b{display:inline-block;min-width:0;margin-right:6px}
table.lk{width:100%;border-collapse:collapse;font-size:15px}
table.lk td{border:1px solid var(--line);padding:7px 9px;vertical-align:top}
table.lk td:first-child{width:50%}
details{margin-top:14px;border-top:1px solid var(--line);padding-top:10px}
summary{cursor:pointer;font-weight:700}
details p{font-size:15.5px;line-height:1.9}
.next{display:flex;justify-content:flex-end}
.sum{background:var(--paper);border:2px solid var(--ink);border-radius:4px;padding:20px}
.sum h2{margin:0 0 6px;font-size:22px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0}
.stats div{border:1px solid var(--line);border-radius:4px;padding:10px;text-align:center}
.stats b{display:block;font-size:26px;font-weight:900}
.code{font-size:26px;font-weight:900;letter-spacing:2px;border:2px dashed var(--ink);padding:10px 14px;text-align:center;margin:12px 0}
.qline{display:flex;justify-content:space-between;align-items:center;gap:8px;border-top:1px solid var(--line);padding:8px 0;font-size:15.5px;flex-wrap:wrap}
.qline .btn{margin:0;padding:6px 12px;min-height:38px;font-size:14.5px}
.foot{margin-top:24px;color:var(--muted);font-size:13.5px;text-align:center}
.flash{animation:fl .5s}
@keyframes fl{0%{transform:scale(1)}40%{transform:scale(1.02)}100%{transform:scale(1)}}
@media (max-width:560px){body{font-size:16px}.paper{padding:16px}.blk{font-size:17px}.sbody{margin-left:0}.step{padding:14px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;scroll-behavior:auto!important}}
</style>
</head>

<script>
/* ============ ENGINE 상수 (수정 금지) ============ */
const CATS=['수일치','관계대명사','동사 vs 준동사','병렬','능동 / 수동','대명사','대동사'];
const ORD=['① (A)-(C)-(B)','② (B)-(A)-(C)','③ (B)-(C)-(A)','④ (C)-(A)-(B)','⑤ (C)-(B)-(A)'];
const POS=['①','②','③','④','⑤'];
const TYPE_COLOR={'지칭':'#5B6B7F','목적':'#5B6B7F','심경':'#A0527A','분위기':'#A0527A','주장':'#8A5A2B','함축':'#0D878A','요지':'#4E7A1F','주제':'#4E7A1F','제목':'#4E7A1F','도표':'#5B6B7F','일치':'#5B6B7F','어법':'#2F7D46','어휘':'#3D7A6E','빈칸':'#C23E5A','무관':'#6B5BA8','순서':'#2B68C4','삽입':'#7550C4','요약':'#B2700C','장문':'#9A4E1C'};
/* ============ DATA 구간 시작 — 이 아래부터 DATA 구간 끝까지만 바꾼다 ============ */

const DATA=[{"id":"k1","src":"k1","chip":"기초 심경 1","tag":"19번형 · 심경 변화 (기초)","type":"심경","title":"기초 — but이라고 다 전환점은 아니다","formula":["전환점(감정이 뒤집히는 곳)에서 글을 앞 / 뒤로 자른다","앞 감정 근거 → 선지 앞 단어, 뒤 감정 근거 → 선지 뒤 단어"],"preview":1,"blocks":[{"s":[["Emma had practiced the piece for months, {{t0|but}} as she waited backstage, {{a1|her fingers felt stiff and cold}}.","엠마는 몇 달 동안 그 곡을 연습했지만, 무대 뒤에서 기다리는 동안 손가락이 뻣뻣하고 차갑게 느껴졌다.","had practiced = 과거완료(그 전부터 쭉) / as = ~하는 동안"],["She peeked through the curtain at the crowded hall and {{a2|quickly stepped back}}.","그녀는 커튼 사이로 사람이 가득 찬 강당을 살짝 내다보고는 재빨리 뒤로 물러섰다.","peek = 살짝 엿보다"],["“{{a3|What if I forget the notes?}}” she whispered to herself.","\"음을 잊어버리면 어떡하지?\" 그녀는 혼잣말로 속삭였다.","What if ~? = ~하면 어떡하지? (걱정)"],["{{t2|When her name was called}}, she walked to the piano and began to play.","이름이 불리자 그녀는 피아노로 걸어가 연주를 시작했다.","was called = 수동태(불렸다)"],["{{t1|To her surprise}}, {{b1|her hands moved smoothly over the keys}}.","놀랍게도 그녀의 손은 건반 위를 부드럽게 움직였다.","To one's surprise = 놀랍게도 → 예상이 뒤집히는 신호"],["As the last note faded, the audience burst into applause.","마지막 음이 잦아들자 청중은 박수를 터뜨렸다.","burst into + 명사 = 갑자기 ~을 터뜨리다"],["Emma {{b2|let out a long breath}} and {{b3|bowed with a wide smile}}.","엠마는 긴 숨을 내쉬고 활짝 웃으며 인사했다.","let out a breath = 숨을 내쉬다 (긴장이 풀림)"]]}],"steps":[{"k":"choice","q":"심경 변화 문제, 글을 어떻게 자를까?","o":["감정이 바뀌는 전환점에서 앞 / 뒤로","첫 문장과 마지막 문장만 읽기"],"a":0,"h":"선지가 A → B 모양이에요. 지문도 두 덩어리로 나눠야 맞춰 볼 수 있어요.","w":"전환점 앞 = 선지 앞 단어 / 전환점 뒤 = 선지 뒤 단어"},{"k":"order","any":1,"roles":"1:but — 아직 긴장|2:엿보고 물러섬 — 앞 감정|3:What if — 앞 감정|4:연주 시작 — 훑기|5:To her surprise — 전환점|6:박수 — 청중 반응|7:긴 숨·미소 — 뒤 감정","q":"읽을 문장 2개를 탭하세요: 전환점 문장 + 마지막 문장","pre":["감정이 어디서 바뀌는지 먼저 찾고, 마지막 문장으로 뒤 감정을 확인한다"],"seq":[5,7],"h":"감정이 뒤집히는 문장(To her surprise)과 맨 마지막 문장이에요.","w":"전환점 + 마지막 문장 = 뒤 감정이 바로 보인다"},{"k":"tap","q":"감정이 실제로 바뀌는 전환 신호를 탭하세요.","c":["t0","t2","t1"],"a":["t1"],"h":"첫 문장의 but 뒤에도 엠마는 아직 긴장해 있어요. 긴장이 풀리기 시작하는 곳은?","w":"To her surprise = 예상과 달리 → 여기서 감정이 뒤집힌다"},{"k":" t as one could = 최대한 빨리 / keep -ing = 계속 ~하다"],["{{d6|The engine coughed twice and then stopped}}.","엔진이 두 번 콜록거리더니 멈췄다.","cough = 기침하다 → 엔진이 털털거리다"],["{{x1|In the darkness}}, the crew searched desperately for the lighthouse, but there was no light anywhere.","어둠 속에서 선원들은 필사적으로 등대를 찾았지만, 어디에도 불빛은 없었다.","desperately = 필사적으로"],["Every time the boat tipped to one side, {{d7|someone screamed}}.","배가 한쪽으로 기울 때마다 누군가 비명을 질렀다.","Every time + 주어 + 동사 = ~할 때마다"],["{{d8|No one knew how long the old boat could hold out}}.","그 낡은 배가 얼마나 오래 버틸 수 있을지 아무도 몰랐다.","hold out = 버티다"]]}],"steps":[{"k":"choice","q":"분위기 문제는 무엇을 근거로 고를까?","o":["소리 · 움직임 · 속도를 나타내는 표현","등장인물의 이름과 장소"],"a":0,"h":"분위기 = 장면이 주는 느낌. 들리는 것, 움직이는 것, 빠르기를 모아요.","w":"소리·움직임·속도 표현을 모은다"},{"k":"match","q":"지문 읽기 전에 선지부터 훑으세요. (지문 아래 선지 미리 보기)","pre":["분위기 선지는 비슷한 뜻의 형용사 두 개가 한 짝","둘 중 하나만 맞으면 오답"],"rows":[["선지 모양",["형용사 두 개 = 한 분위기","감정 변화 A → B"],0],["두 형용사의 관계",["비슷한 뜻끼리 짝","반대 뜻끼리 짝"],0]],"h":"calm and peaceful처럼 비슷한 말 두 개가 묶여 있어요.","w":"두 단어가 모두 지문과 맞아야 한다"},{"k":"order","roles":"1:폭풍 — 장면 시작|2:파도 — 위험|3:외침 — 급박|4:퍼내기 — 급박|5:엔진 멈춤 — 위험|6:어둠 — 배경|7:비명 — 위험|8:버틸 수 있을까 — 마지막","q":"읽는 순서대로 탭하세요: ① 첫 문장 → ② 사람의 말이 나오는 문장 → ③ 마지막 문장","pre":["첫 문장 = 장면의 시작 / 사람의 말·외침 = 장면의 속도 / 마지막 문장 = 장면이 남기는 느낌"],"seq":[1,3,8],"h":"폭풍 문장, 선장이 외치는 문장, 맨 마지막 문장이에요.","w":"폭풍 + 외침 + 버틸 수 있을지 모름 = 긴박"},{"k":"tap","q":"급박함(빨리, 서둘러)을 보여 주는 표현 2개를 탭하세요.","c":["d3","d5","x1","d6"],"a":["d3","d5"],"h":"외치는 말과 '최대한 빨리'를 찾아요.","w":"Hold on! + as fast as he could = urgent"},{"k":"tap","q":"긴장(위험, 불안)을 보여 주는 표현 3개를 탭하세요.","c":["x1","d6","d7","d8"],"a":["d6","d7","d8"],"h":"In the darkness는 장소·시간 배경이에요. 사람들이 위험을 느끼는 표현은?","w":"엔진 멈춤 + 비명 + 버틸지 모름 = tense"},{"k":"match","q":"선지를 지문 단서와 대조하세요.","pre":["같은 분위기 = 정답 후보 / 반대 분위기 · 지문에 없는 분위기 = 지운다"],"rows":[["① calm and peaceful",["같은 분위기","반대 분위기","지문에 없는 분위기"],1],["② festive and lively",["같은 분위기","반대 분위기","지문에 없는 분위기"],2],["③ tense and urgent",["같은 분위기","반대 분위기","지문에 없는 분위기"],0],["④ mysterious and quiet",["같은 분위기","반대 분위기","지문에 없는 분위기"],2],["⑤ boring and monotonous",["같은 분위기","반대 분위기","지문에 없는 분위기"],1]],"h":"조용하고 평화로움, 지루하고 단조로움은 폭풍 장면과 정반대예요. 축제·신비로움은 지문에 없어요.","w":"남은 하나 = tense and urgent"},{"k":"final","q":"다음 글의 분위기로 가장 적절한 것은?","o":["① calm and peaceful","② festive and lively","③ tense and urgent","④ mysterious and quiet","⑤ boring and monotonous"],"a":2,"h":"긴장되고 급박한"},{"k":"match","review":1,"q":"오답에 이름 붙이기 — 이제 지문 전체를 봐도 된다. (지문 위 [문장별 해석 켜기])","pre":["정답 = 두 형용사 모두 지문 단서와 맞음","반대 분위기 = 지문과 정반대","단어 하나만 보고 착각 = 지문 단어 하나(darkness)만 보고 고름","지문에 없는 분위기 = 단서가 아예 없음"],"rows":[["① calm and peaceful",["정답","반대 분위기","단어 하나만 보고 착각","지문에 없는 분위기"],1],["② festive and lively",["정답","반대 분위기","단어 하나만 보고 착각","지문에 없는 분위기"],3],["③ tense and urgent",["정답","반대 분위기","단어 하나만 보고 착각","지문에 없는 분위기"],0],["④ mysterious and quiet",["정답","반대 분위기","단어 하나만 보고 착각","지문에 없는 분위기"],2],["⑤ boring and monotonous",["정답","반대 분위기","단어 하나만 보고 착각","지문에 없는 분위기"],1]],"h":"④는 darkness 하나만 보고 신비롭다고 착각한 거예요. 게다가 바람이 으르렁거려서 quiet도 틀려요.","w":"분위기 단골 오답: 배경 단어 하나로 착각"}],"after":{"opts":[["① calm and peaceful","✘ 반대 분위기"],["② festive and lively","✘ 지문에 없는 분위기 (축제)"],["③ tense and urgent","✔ 외침·최대한 빨리 + 엔진 멈춤·비명"],["④ mysterious and quiet","✘ 단어 하나만 보고 착각 — darkness는 배경, roaring wind라 quiet도 X"],["⑤ boring and monotonous","✘ 반대 분위기"]],"link":[["Hold on to the rope! / as fast as he could","urgent"],["engine ~ stopped / someone screamed / how long ~ hold out","tense"]],"note":"분위기 문제는 감정 단어가 아니라 장면 묘사로 판단한다. 어둠·밤 같은 배경 단어 하나에 끌려가지 않는다.","more":[{"t":"긴장 · 급박","i":[["tense","긴장된"],["urgent","급박한"],["dangerous","위험한"],["frightening","무서운"]]},{"t":"평화 · 고요","i":[["calm","고요한"],["peaceful","평화로운"],["quiet","조용한"],["relaxing","편안한"]]},{"t":"축제 · 활기","i":[["festive","축제 분위기의"],["lively","활기찬"],["cheerful","쾌활한"]]},{"t":"신비 · 음울","i":[["mysterious","신비로운"],["gloomy","우울한, 음침한"],["monotonous","단조로운"]]}],"tr":""}},{"id":"k35","src":"k35","chip":"기초 무관","tag":"35번형 · 무관한 문장 (기초)","type":"무관","title":"기초 — 같은 단어, 다른 논점","formula":["첫 문장의 논점을 정한다 (잠자는 동안 뇌가 정보를 정리한다)","같은 단어를 쓰면서 이야기를 딴 데로 돌리는 문장 = 정답 / 새 정보(실험·숫자) ≠ 정답"],"blocks":[{"s":[["Sleep is not just a time for the body to rest; it is also when {{bp|the brain reorganizes the information}} it took in during the day.","잠은 단지 몸이 쉬는 시간이 아니라, 뇌가 낮 동안 받아들인 정보를 다시 정리하는 시간이기도 하다.","not just A; also B = A일 뿐 아니라 B이기도 / it took in = information을 꾸미는 관계사절(that 생략)"],["① While we sleep, the brain replays new memories and moves them from short-term storage into {{lt|long-term memory}}.","① 우리가 자는 동안 뇌는 새 기억을 다시 재생하고 그것을 단기 저장소에서 장기 기억으로 옮긴다.","move A from B into C = A를 B에서 C로 옮기다"],["② This is why students who get enough sleep after studying often {{rm|remember more}} than those who stay up all night.","② 이것이 공부한 뒤 충분히 자는 학생들이 밤을 새우는 학생들보다 흔히 더 많이 기억하는 이유다.","This is why ~ = 그래서 ~이다 / those who ~ = ~하는 사람들"],["③ In one study, participants who slept after learning a list of words recalled about {{pc|20 percent}} more of them the next morning.","③ 한 연구에서 단어 목록을 익힌 뒤 잠을 잔 참가자들은 다음 날 아침 그 단어들을 약 20퍼센트 더 많이 기억해 냈다.","주어 = participants (who ~ words) / 동사 = recalled"],["④ Some people {{ts|talk in their sleep}}, and most of them have no {{nm|memory}} of it when they wake up.","④ 어떤 사람들은 잠꼬대를 하는데, 그들 대부분은 깨어났을 때 그것을 전혀 기억하지 못한다.","talk in one's sleep = 잠꼬대하다"],["⑤ Giving up sleep to study longer, {{tf|therefore}}, may actually make your study time less effective.","⑤ 따라서 더 오래 공부하려고 잠을 포기하는 것은 실제로는 공부 시간을 덜 효과적으로 만들 수 있다.","Giving up ~ = 동명사 주어(단수) / make + 목적어 + 형용사"]]}],"steps":[{"k":"choice","q":"무관한 문장을 찾는 공식은?","o":["첫 문장의 논점을 정하고, 같은 단어를 쓰지만 논점이 다른 문장을 찾는다","처음 보는 정보(실험·숫자)가 나온 문장을 고른다"],"a":0,"h":"새 정보가 나와도 논점을 뒷받침하면 관계있는 문장이에요.","w":"기준은 \"논점\". 단어가 아니다."},{"k":"order","any":1,"roles":"1:첫 문장 — 논점|2:① — 판정|3:② — 판정|4:③ 실험 — 논점의 근거|5:④ — 판정|6:⑤ therefore — 결론","q":"먼저 읽을 문장 2개를 탭하세요: 첫 문장(논점) + 결론 문장","pre":["첫 문장으로 논점을 정한다","therefore(따라서) 결론 문장도 논점과 같은 말을 한다 — 둘 사이에서 벗어나는 문장을 찾는다"],"seq":[1,6],"h":"Sleep is not just ~ 첫 문장과 therefore가 있는 ⑤예요.","w":"첫 문장과 결론이 같은 말 = 잠이 공부(기억)를 돕는다"},{"k":"tap","q":"첫 문장에서 논점 핵심어를 탭하세요.","c":["bp","lt","pc","ts"],"a":["bp"],"h":"첫 문장 안에 있어요. 잠자는 동안 뇌가 하는 일.","w":"논점 = 잠자는 동안 뇌가 정보를 정리한다 → 기억에 도움"},{"k":"match","q":"①~⑤ 문장마다 판정하세요.","pre":["논점 유지 = 잠이 기억·공부를 돕는다는 이야기","소재만 같고 이탈 = sleep · memory 단어를 쓰지만 다른 이야기"],"rows":[["① 자는 동안 뇌가 기억을 장기 기억으로 옮김",["논점 유지","소재만 같고 이탈"],0],["② 잘 잔 학생이 더 많이 기억함",["논점 유지","소재만 같고 이탈"],0],["③ 잔 참가자가 20% 더 기억함 (실험)",["논점 유지","소재만 같고 이탈"],0],["④ 잠꼬대를 하고 기억하지 못함",["논점 유지","소재만 같고 이탈"],1],["⑤ 따라서 잠을 줄이면 공부가 덜 효과적",["논점 유지","소재만 같고 이탈"],0]],"h":"④의 memory는 '잠꼬대를 기억 못 한다'예요. 공부한 것을 기억하는 이야기인가요?","w":"④ sleep · memory 단어만 빌려 잠꼬대 이야기로 샌다"},{"k":"choice","q":"③에 실험과 숫자(20 percent)라는 새 정보가 나와요. 무관한 문장일까?","o":["아니다 — 잠이 기억을 돕는다는 논점의 근거다","맞다 — 처음 나온 정보라서 흐름과 관계없다"],"a":0,"h":"그 실험은 무엇을 보여 주나요? 잔 사람이 더 기억했다.","w":"실험·숫자 = 논점의 근거. 새 정보 ≠ 무관"},{"k":"final","q":"다음 글에서 전체 흐름과 관계 없는 문장은?","o":["①","②","③","④","⑤"],"a":3,"h":"sleep · memory 단어를 쓰지만 잠꼬대 이야기"}],"after":{"opts":[["①","✔ 관계있음 — 자는 동안 기억을 옮김"],["②","✔ 관계있음 — This is why로 ①을 받음"],["③","✔ 관계있음 — 실험 근거 (매력적 오답: 새 정보)"],["④","✘ 무관 — 잠꼬대 (sleep · memory 단어만 빌림)"],["⑤","✔ 관계있음 — therefore 결론"]],"link":[["the brain reorganizes the information","논점"],["① 옮김 → ② 그래서 더 기억 → ③ 실험 → ⑤ therefore","흐름"],["④ talk in their sleep ~ no memory of it","소재만 같고 이탈"]],"note":"3월 35번과 같은 뼈대: 논점(set point) → 같은 단어로 딴 이야기(호르몬·질병). 무관 문장은 '모르는 단어'가 아니라 '아는 단어로 딴 얘기'다.","tr":""}},{"id":"k36","src":"k36","chip":"기초 순서","tag":"36번형 · 글의 순서 (기초)","type":"순서","title":"기초 — Instead · This dance · In this way","formula":["각 단락 첫 문장의 고리(지시어·연결사)부터 찾는다","Instead 앞 = not A / This + 명사 앞 = 그 명사 / In this way = 결론 → 맨 뒤"],"blocks":[{"l":"주어진 글","g":1,"s":[["When a honeybee finds a field full of flowers, it {{g1|cannot simply tell}} the other bees where the food is.","꿀벌은 꽃이 가득한 들판을 발견해도 다른 벌들에게 먹이가 어디 있는지 그냥 말해 줄 수는 없다.","tell + 사람 + where ~ = ~에게 어디인지 알려 주다"]]},{"l":"(A)","s":[["{{a1|This dance}} comes in two types.","이 춤에는 두 가지 종류가 있다.","come in + 종류 = ~으로 나뉘다"],["When the bee moves in a small circle, the flowers are close to the hive.","벌이 작은 원을 그리며 움직이면 꽃은 벌집 가까이에 있다.","When ~ = ~하면(조건) / close to = ~에 가까운"],["When it moves in a figure eight while shaking its body, the food is far away, and the direction of the dance shows which way to fly.","몸을 흔들면서 8자 모양으로 움직이면 먹이는 멀리 있고, 춤의 방향이 어느 쪽으로 날아갈지 보여 준다.","while shaking = 흔들면서 / which way to fly = 어느 쪽으로 날지"]]},{"l":"(B)","s":[["{{b1|Instead}}, it flies back to the hive and performs {{b3|a special dance}} on the wall of the hive.","대신, 그 벌은 벌집으로 날아 돌아가 벌집 벽에서 특별한 춤을 춘다.","Instead = 그 대신 (앞에 not A가 필요)"],["The other bees gather around and carefully follow {{b2|its movements}}.","다른 벌들은 주위에 모여 그 움직임을 주의 깊게 따라간다.","its = 그 벌의"]]},{"l":"(C)","s":[["{{c1|Thanks to these movements}}, the other bees can fly straight to the flowers without wasting energy.","이러한 움직임 덕분에 다른 벌들은 에너지를 낭비하지 않고 꽃으로 곧장 날아갈 수 있다.","thanks to = ~ 덕분에 / without -ing = ~하지 않고"],["{{c2|In this way}}, a single bee’s discovery soon becomes food for the whole colony.","이런 식으로 한 마리 벌의 발견이 곧 무리 전체의 먹이가 된다.","In this way = 이렇게 해서 (정리·결론)"]]}],"steps":[{"k":"choice","q":"순서 문제에서 가장 먼저 찾을 것은?","o":["각 단락 앞부분의 지시어·연결사","각 단락에서 가장 어려운 단어"],"a":0,"h":"단락끼리 이어 주는 \"고리\"가 무엇일까요?","w":"Instead, This, these, In this way 같은 말이 단락 사이의 고리다."},{"k":"order","any":1,"roles":"1:주어진 글 — cannot simply tell|2:(A) 첫 문장 — This dance|3:(A) 설명 — 훑기|4:(A) 설명 — 훑기|5:(B) 첫 문장 — Instead|6:(B) 설명 — 훑기|7:(C) 첫 문장 — these movements|8:(C) 마지막 — In this way","q":"주어진 글 + 각 단락의 첫 문장을 탭하세요. (4문장)","pre":["단락의 첫 문장에 고리(지시어·연결사)가 몰려 있다","단락 중간은 고리가 가리키는 대상을 확인할 때만 들어간다"],"seq":[1,2,5,7],"h":"주어진 글 1문장, 그리고 (A)(B)(C)의 맨 첫 문장이에요.","w":"4문장만 먼저 읽고 고리를 찾는다."},{"k":"tap","q":"(A)(B)(C) 첫 문장의 고리 3개를 탭하세요.","c":["a1","b1","b3","c1","c2"],"a":["a1","b1","c1"],"h":"단락 맨 앞에 있는 연결사 · this / these + 명사예요. In this way는 (C)의 마지막 문장이에요.","w":"(A) This dance  (B) Instead  (C) these movements"},{"k":"match","q":"각 고리가 무엇과 이어지는지 고르세요.","pre":["Instead 앞에는 반드시 not A가 있다","This + 명사 앞에는 그 명사가 먼저 나온다","In this way = 지금까지를 정리하는 말 → 맨 뒤"],"rows":[["(B) Instead",["주어진 글의 cannot simply tell (not A)","(A)의 two types"],0],["(A) This dance",["(B)의 a special dance","주어진 글의 flowers"],0],["(C) In this way",["글 전체를 정리 → 맨 뒤","새 이야기를 시작 → 맨 앞"],0]],"h":"말로 못 한다 → 대신 춤춘다 → 이 춤은 두 종류 → 덕분에 → 이렇게 해서","w":"주어진 글 → (B) → (A) → (C)"},{"k":"choice","q":"(B)의 its movements 다음에 (C)의 these movements가 와도 될 것 같은데?","o":["안 된다 — (C)는 In this way로 끝나는 결론이라 (A)의 춤 설명보다 뒤","된다 — (B)-(C)-(A)도 가능하다"],"a":0,"h":"(C) 뒤에 (A) This dance comes in two types가 오면, 결론을 낸 다음에 다시 설명을 시작하는 셈이에요.","w":"약한 고리(these movements)보다 결론 신호(In this way)가 자리를 정한다"},{"k":"final","q":"주어진 글 다음에 이어질 글의 순서로 가장 적절한 것은?","o":["① (A)-(C)-(B)","② (B)-(A)-(C)","③ (B)-(C)-(A)","④ (C)-(A)-(B)","⑤ (C)-(B)-(A)"],"a":1,"h":"말 못 함 → Instead 춤 → This dance 두 종류 → 덕분에, 이렇게 해서"}],"after":{"opts":[["① (A)-(C)-(B)","✘ (A)의 This dance — 춤이 아직 안 나옴"],["② (B)-(A)-(C)","✔ not A → Instead → This dance → these movements, In this way"],["③ (B)-(C)-(A)","✘ (C) 결론 뒤에 (A) 설명이 다시 나옴 (약한 고리 함정)"],["④ (C)-(A)-(B)","✘ (C)의 these movements — 움직임이 아직 안 나옴"],["⑤ (C)-(B)-(A)","✘ 위와 같음"]],"link":[["cannot simply tell (not A)","(B) Instead (B)"],["(B) a special dance","(A) This dance"],["(A) 원 / 8자 움직임","(C) these movements → In this way 결론"]],"note":"강한 고리: Instead(앞에 not A가 하나뿐), This dance(춤이 처음 나오는 곳 하나뿐). 약한 고리: these movements는 (A)도 (B)도 가리킬 수 있다 → 결론 신호 In this way로 확정.","tr":""}},{"id":"k38","src":"k38","chip":"기초 삽입","tag":"38번형 · 문장 삽입 (기초)","type":"삽입","title":"기초 — Rather 앞에 not A, they는 누구?","formula":["Instead / Rather 앞에는 반드시 not A가 있어야 한다","주어진 문장의 대명사(they)가 누구인지 확인 → 앞 문장 주어와 맞아야 한다"],"blocks":[{"l":"주어진 문장","g":1,"s":[["{{r1|Rather}}, {{r2|they}} see it as useful information that tells them what to try next.","오히려 그들은 그것을 다음에 무엇을 시도할지 알려 주는 유용한 정보로 본다.","see A as B = A를 B로 여기다 / Rather = 오히려 (앞에 not A)"]]},{"s":[["Every inventor faces failure at some point. ( ① )","모든 발명가는 언젠가 실패를 겪는다.","face = 직면하다, 겪다 / at some point = 언젠가"],["Most people feel upset when an experiment does not work. ( ② )","대부분의 사람들은 실험이 잘 안 되면 속상해한다.","work = (계획·실험이) 잘 되다"],["{{th|They}} think that all the time and effort they put into it has been wasted. ( ③ )","그들은 자신이 거기에 들인 모든 시간과 노력이 낭비되었다고 생각한다.","주어 = all the time and effort (they put into it) / 동사 = has been wasted"],["Successful inventors, {{hw|however}}, {{nt|do not think of a failed experiment in this way}}. ( ④ )","그러나 성공한 발명가들은 실패한 실험을 이런 식으로 생각하지 않는다.","think of A in this way = A를 이런 식으로 생각하다"],["Thomas Edison, {{fe|for example}}, tested thousands of materials before he found the right one for his light bulb. ( ⑤ )","예를 들어 토머스 에디슨은 전구에 맞는 재료를 찾기 전까지 수천 가지 재료를 시험했다.","the right one = the right material"],["When someone asked him about his many failures, he answered that he had simply found ways that would not work.","누군가 그에게 수많은 실패에 대해 묻자, 그는 그저 안 되는 방법들을 찾았을 뿐이라고 대답했다.","had found = 과거완료(대답한 때보다 앞)"],["For him, each failure brought him one step closer to success.","그에게 각각의 실패는 그를 성공에 한 걸음 더 가까이 데려다주었다.","bring A closer to B = A를 B에 더 가까이 가게 하다"],["This attitude is what kept him working long after others would have given up.","이런 태도가 다른 사람들이라면 포기했을 한참 뒤에도 그가 계속 일하게 한 것이다.","what = ~하는 것 / keep + 목적어 + -ing / would have p.p. = ~했을 것이다"]]}],"steps":[{"k":"choice","q":"Instead / Rather 앞에 반드시 있어야 하는 것은?","o":["not A — 무엇이 \"아닌지\" 말하는 문장","For example — 예시 문장"],"a":0,"h":"\"짜장면이 싫은 게 아니야. 오히려 짬뽕이 좋아.\" 오히려 앞에 뭐가 있죠?","w":"not A. Rather, B — A가 아니라 오히려 B"},{"k":"order","roles":"1:주어진 문장 — Rather, they|2:도입 — 훑기|3:대부분의 사람 — 속상함|4:They — 낭비라고 생각|5:however + do not — not A|6:예시 Edison — 훑기|7:예시 — 훑기|8:결론 — 훑기|9:마무리 — 훑기","q":"읽는 순서대로 탭하세요: ① 주어진 문장 → ② not A가 있는 문장","pre":["주어진 문장에서 단서(Rather, they)를 잡는다","본문에서 '~하지 않는다(not)'를 말하는 문장을 찾는다"],"seq":[1,5],"h":"주어진 문장, 그리고 do not think ~ in this way가 있는 문장이에요.","w":"not A(이런 식으로 생각하지 않는다) → Rather, B(오히려 유용한 정보로 본다)"},{"k":"tap","q":"본문에서 not A 표현을 탭하세요.","c":["hw","nt","fe"],"a":["nt"],"h":"however는 연결사, for example은 예시 신호예요. '~하지 않는다'는?","w":"do not think of a failed experiment in this way = not A"},{"k":"choice","q":"주어진 문장의 they는 누구일까?","o":["Successful inventors — 실패를 유용한 정보로 보는 사람들","Most people — 실패하면 속상해하는 사람들"],"a":0,"h":"they see it as useful information — 실패를 좋게 보는 사람들이에요.","w":"they = successful inventors → 바로 앞 문장 주어여야 한다"},{"k":"choice","q":"③ 자리(They think ~ wasted 뒤)에 넣으면?","o":["안 된다 — they가 most people이 되어 '낭비라고 생각한다 / 오히려 유용하다'가 한 사람의 모순이 된다","된다 — 낭비 다음에 오히려가 자연스럽다"],"a":0,"h":"③ 바로 앞 They는 누구죠? 같은 사람이 낭비라면서 유용하다고 할 수 있을까요?","w":"대명사 확인: 앞 문장 주어와 주어진 문장의 they가 같은 사람이어야 한다"},{"k":"final","q":"글의 흐름으로 보아, 주어진 문장이 들어가기에 가장 적절한 곳은?","o":["①","②","③","④","⑤"],"a":3,"h":"not A(do not think ~ in this way) 바로 뒤"}],"after":{"opts":[["①","✘ 아직 실패를 어떻게 보는지 나오지 않음"],["②","✘ 뒤에 They think ~ wasted가 이어져야 함"],["③","✘ they = most people → 모순 (대명사 함정)"],["④","✔ do not think ~ in this way → Rather, they see it as useful"],["⑤","✘ 예시(Edison) 뒤 — 이미 B를 보여 준 다음"]],"link":[["Successful inventors do not think ~ in this way (not A)","Rather, they see it as useful information (B)"],["they","= successful inventors"],["useful information","→ Edison: 안 되는 방법을 찾았을 뿐"]],"note":"Rather / Instead가 주어진 문장 맨 앞에 있으면, 본문에서 not A 문장을 찾아 바로 뒤에 넣는다. 그다음 대명사(they)가 앞 문장 주어와 맞는지 확인.","tr":""}},{"id":"m35","src":"m35","type":"무관","title":"무관한 문장 — 소재는 같고 논점은 다른 문장","formula":["첫 문장의 논점을 정한다 (행복 수준은 원래대로 돌아온다)","앞 문장 단어를 그대로 쓰면서 이야기를 딴 데로 돌리는 문장 = 정답 / 처음 보는 단어 ≠ 정답"],"blocks":[{"s":[["The “happiness set point” theory suggests that every adult has {{sp|a fairly stable level of happiness}} that their mood usually {{rt|returns to}}.","'행복 설정값' 이론은 모든 성인에게 기분이 대개 되돌아가는 꽤 안정적인 행복 수준이 있다고 말한다.","a level (that their mood returns to) — 목적격 관계대명사 + 전치사 to가 끝에"],["{{gn|Our genes}} and early experiences largely decide where this level sits.","우리의 유전자와 어린 시절의 경험이 이 수준이 어디에 놓일지를 대체로 결정한다.","where S V = ~가 어디에 …하는지"],["① After a {{pr|pay raise}} or a breakup, people feel much happier or sadder for a while.","① 월급 인상이나 이별 후, 사람들은 한동안 훨씬 더 행복하거나 더 슬프게 느낀다.","much + 비교급 = 훨씬 더 / for a while = 한동안"],["② Many companies now offer pay raises to keep their best workers from leaving.","② 많은 회사들이 이제 최고의 직원들이 떠나지 않도록 월급 인상을 제공한다.","keep A from V-ing = A가 ~하지 못하게 하다"],["③ However, within a year or so, most of them drift back to the level they started from.","③ 그러나 1년 정도 안에, 그들 대부분은 처음 출발했던 수준으로 서서히 돌아간다.","drift back to = ~로 서서히 돌아가다 / the level (that) they started from"],["④ Researchers explain that the set point works like a {{th|thermostat}}, pulling feelings back toward a fixed range whenever they move too far.","④ 연구자들은 설정값이 온도 조절기처럼 작동해서, 감정이 너무 멀리 벗어날 때마다 정해진 범위 쪽으로 다시 끌어당긴다고 설명한다.","work like = ~처럼 작동하다 / pulling ~ = 분사구문 / whenever = ~할 때마다"],["⑤ {{tu|Thus}}, a person with a low set point may need to work harder than others to keep a positive mood.","⑤ 따라서 설정값이 낮은 사람은 긍정적인 기분을 유지하기 위해 다른 사람들보다 더 애써야 할 수도 있다.","Thus = 앞 내용의 결론 / harder than others = 다른 사람보다 더 열심히"]]}],"steps":[{"k":"choice","q":"무관한 문장을 찾는 공식은?","o":["첫 문장의 논점을 정하고, 소재는 같지만 논점이 다른 문장을 찾는다","처음 보는 새로운 단어가 나온 문장을 고른다"],"a":0,"h":"새 단어가 나와도 논점을 이어 가면 관계있는 문장이에요.","w":"기준은 \"논점\". 단어가 아니다."},{"k":"order","roles":"1:첫 문장 — 논점|2:부연 — 훑기|3:① — 판정|4:② — 판정|5:③ — 판정|6:④ — Thus의 근거|7:⑤ Thus — 결론","q":"무관한 문장 읽는 순서대로 탭하세요: ① 첫 문장(논점) → ② Thus 문장(결론) → ③ 그 바로 앞 문장","pre":["첫 문장으로 논점을 정한다","Thus(따라서) 문장은 바로 앞 문장을 근거로 한다","결론과 그 근거가 이어지면 둘 다 관계있는 문장"],"seq":[1,7,6],"h":"happiness set point 첫 문장, Thus로 시작하는 ⑤, 그 앞 ④ thermostat 문장이에요.","w":"④ 온도 조절기처럼 끌어당긴다 → ⑤ 따라서 설정값이 낮으면 더 애써야 한다. 이어진다."},{"k":"tap","q":"첫 문장에서 논점 핵심어 2개를 탭하세요.","c":["sp","rt","gn","pr","th","tu"],"a":["sp","rt"],"h":"\"안정적인 행복 수준\"과 \"되돌아간다\"","w":"논점 = 행복 수준은 정해져 있고, 기분은 결국 거기로 돌아온다."},{"k":"match","q":"①~⑤ 문장마다 판정하세요.","pre":["논점 유지 = 행복 수준이 변했다가 돌아온다는 이야기","논점 이탈 = 앞 문장 단어(pay raise)를 빌려 딴 이야기"],"rows":[["① 월급 인상·이별 후 한동안 더 행복/슬픔",["논점 유지","소재만 같고 이탈"],0],["② 회사들이 직원을 붙잡으려 월급 인상 제공",["논점 유지","소재만 ","명령문 Consider ~ / for instance = for example"]]},{"l":"(B)","s":[["Little by little, many of {{b1|their}} dials and switches were judged “unnecessary” and taken away, and with each change {{b2|these machines}} turned into the cameras built into {{b0|our phones}}.","조금씩 그것들의 많은 다이얼과 스위치가 \"불필요하다\"고 판단되어 없어졌고, 변화할 때마다 이 기계들은 우리 휴대 전화에 내장된 카메라로 바뀌었다.","were judged ~ and (were) taken away 수동 병렬 / turn into = ~로 바뀌다 / built into = ~에 내장된"],["The devices became lighter, and the skills of adjusting light and focus disappeared behind a single button.","기기는 더 가벼워졌고, 빛과 초점을 조절하는 기술은 버튼 하나 뒤로 사라졌다."]]},{"l":"(C)","s":[["Made popular by {{c0|designers}} in the early twentieth century, {{c1|it}} suggested that plain objects are more useful and more attractive than complicated ones.","20세기 초 디자이너들이 유행시킨 이 말은 평범한 물건이 복잡한 것보다 더 유용하고 더 매력적이라는 것을 암시했다.","분사구문 Made popular ~, it = It was made popular ~ / more A and more B than ~ / ones = objects"],["Today the motto appears everywhere — perhaps in too many places.","오늘날 이 표어는 어디에나, 어쩌면 너무 많은 곳에 등장한다."]]}],"steps":[{"k":"choice","q":"순서 문제에서 가장 먼저 찾을 것은?","o":["각 단락 앞부분의 지시어·연결사","각 단락에서 가장 어려운 단어"],"a":0,"h":"단락끼리 이어 주는 \"고리\"가 무엇일까요?","w":"it, this, their, these, However 같은 말이 단락 사이의 고리다."},{"k":"order","roles":"1:주어진 글 — 출발점|2:(A) 첫 문장 — However · this motto|3:(A) 예시 — 고리 대상 찾을 때만|4:(B) 첫 문장 — their · these|5:(B) 설명 — 훑기|6:(C) 첫 문장 — 콤마 뒤 it|7:(C) 덧붙임 — 훑기","any":1,"q":"순서 문제는 주어진 글 + 각 단락의 첫 문장부터 읽는다. 그 4문장을 탭하세요.","pre":["단락의 첫 문장에 고리(지시어·연결사)가 몰려 있다","단락 중간은 고리가 가리키는 대상을 확인할 때만 들어간다","(C)처럼 분사구문으로 시작하면 콤마 뒤까지가 첫 문장의 핵심"],"seq":[1,2,4,6],"h":"주어진 글 1문장, 그리고 (A)(B)(C)의 맨 첫 문장이에요.","w":"4문장만 먼저 읽고 고리를 찾는다. their가 가리키는 대상을 찾을 때만 (A)의 끝 문장으로 간다."},{"k":"tap","q":"(A)(B)(C)에서 지시어·연결사를 모두 탭하세요. (5개)","c":["a1","a2","a0","b1","b2","b0","c0","c1"],"a":["a1","a2","b1","b2","c1"],"h":"it / this / their / these + 명사, 그리고 However. (C)는 Made(p.p.)로 시작하는 분사구문이라 지시어가 콤마 뒤에 숨어 있어요. \"our\"는 우리 자신이라 고리가 아니에요.","w":"(A) However, this motto  (B) th "opts":[["① (A)-(C)-(B)","✘ (C)의 it이 (A)의 카메라 뒤에 오면 가리킬 대상이 어긋남"],["② (B)-(A)-(C)","✘ (B)의 their가 가리킬 카메라가 아직 없음"],["③ (B)-(C)-(A)","✘ 위와 같음"],["④ (C)-(A)-(B)","✔ it → However + cameras → their dials"],["⑤ (C)-(B)-(A)","✘ (B)의 their가 (A)의 카메라보다 먼저 나옴"]],"link":[["(C) Made popular by ~, it","콤마 뒤 it = 주어진 글의 motto “simple is best”"],["(A) However","(C)의 칭찬과 반대 방향"],["(B) their / these machines","= (A)의 film cameras"]],"note":"고리 세기 판별: 주제어를 가리키면 약하고, 예시를 가리키면 강하다. 명사가 붙어 있으면 더 강하다. 풀이 순서: ① 고리 찾기 → ② 강한 고리 their dials ↔ film cameras로 (A)(B) 고정 → ③ (C)를 덩어리 앞/뒤에 넣어 보기 → ④ However 방향 확인. 원 문항 36번과 같은 뼈대: 표어 → 뜻 → 하지만 습관을 없앤다 + 예시 → 예시의 변화. 분사구문 시작도 원 문항과 같다 — 원 문항 (B) First mentioned in Robert Browning’s poem, it suggests ~ / 변형 (C) Made popular by designers ~, it suggested ~. 두 문장 모두 콤마 뒤 it이 지시어다. Made는 \"만들었다\"(과거 동사)가 아니라 \"만들어진\"(과거분사)이고, be made popular = 유명해지다(make + O + 형용사의 수동).","tr":"[주어진 글] \"단순한 것이 최고\"라는 표어는 한때 분명하고 소박한 의미를 지녔다. (C) 20세기 초 디자이너들이 유행시킨 이 말은 평범한 물건이 복잡한 것보다 더 유용하고 더 매력적이라는 것을 암시했다. 오늘날 이 표어는 어디에나, 어쩌면 너무 많은 곳에 등장한다. (A) 하지만 이 표어 이면의 사고방식이 우리의 일상에서 특정 기술들을 서서히 없앤다는 것을 알아차리는 것이 중요하다. 예를 들어, 수십 년 전 사람들이 들고 다니던 부피 큰 필름 카메라를 생각해 보라. (B) 조금씩 그것들의 많은 다이얼과 스위치가 \"불필요하다\"고 판단되어 없어졌고, 변화할 때마다 이 기계들은 우리 휴대 전화에 내장된 카메라로 바뀌었다. 기기는 더 가벼워졌고, 빛과 초점을 조절하는 기술은 버튼 하나 뒤로 사라졌다."},"chip":"3월 36","tag":"36번 · 순서 (3월 변형)"},{"id":"m37","src":"m37","type":"순서","title":"글의 순서 — this + 명사","formula":["this / these + 명사 = 앞 단락에 그 명사(또는 같은 뜻)가 있다","같은 연결사가 두 개면 지시어로 판별한다"],"blocks":[{"l":"주어진 글","g":1,"s":[["To understand our closets today, we first need to look at the short but little-known history of the fast-fashion industry.","오늘날 우리의 옷장을 이해하려면, 먼저 패스트 패션 산업의 짧지만 잘 알려지지 않은 역사를 살펴볼 필요가 있다.","To V ~, = ~하기 위해 (목적)"],["Before it appeared, people bought fewer clothes and repaired them, producing far less textile waste than we do now.","그것이 등장하기 전, 사람들은 옷을 더 적게 사고 수선해 입었으며, 지금 우리보다 훨씬 적은 섬유 쓰레기를 만들었다.","far less ~ than = ~보다 훨씬 적은 (far = 비교급 강조) / do = produce textile waste (대동사)"]]},{"l":"(A)","s":[["{{a1|However}}, fashion companies quickly responded to {{a2|these worries}} by advertising clothing-recycling bins as the answer to the waste problem.","그러나 패션 회사들은 의류 수거함을 쓰레기 문제의 해답으로 광고함으로써 이러한 우려에 재빨리 대응했다.","respond to = ~에 대응하다 / by V-ing = ~함으로써 / advertise A as B"],["They spread the message that waste was the responsibility of {{a0|shoppers}}, not of the brands producing endless new collections.","그들은 쓰레기가 끝없이 새 컬렉션을 내놓는 브랜드가 아니라 쇼핑객의 책임이라는 메시지를 퍼뜨렸다.","the message that ~ (동격 that) / A, not B"]]},{"l":"(B)","s":[["{{b1|However}}, once cheap production methods spread and global shipping became fast, new clothes flooded every shopping street.","그러나 값싼 생산 방식이 퍼지고 세계 운송이 빨라지자, 새 옷이 모든 쇼핑 거리에 넘쳐났다.","once S V = 일단 ~하자"],["The industry came to symbolize the promise of always having something new and affordable to wear.","그 산업은 언제나 새롭고 저렴한 입을 거리를 갖는다는 약속을 상징하게 되었다.","come to V = ~하게 되다 / something + 형용사 + to V"]]},{"l":"(C)","s":[["{{c1|This promise}} had a hidden cost.","이 약속에는 숨겨진 대가가 있었다."],["Over time, people began to notice mountains of discarded clothing, and the first voices of today’s slow-fashion movement were heard.","시간이 흐르며 사람들은 버려진 옷 더미를 알아차리기 시작했고, 오늘날 슬로 패션 운동의 첫 목소리가 들려왔다.","over time = 시간이 흐르며 / mountains of = 산더미 같은"]]}],"steps":[{"k":"choice","q":"this / these + 명사가 보이면?","o":["앞 단락에 그 명사(또는 같은 뜻)가 있다","그 단락이 맨 앞에 온다"],"a":0,"h":"\"이 약속\"이라고 하려면 약속 이야기가 먼저 나와야 해요.","w":"this/these + 명사는 앞 단락으로 화살표를 그린다."},{"k":"order","roles":"1:주어진 글 도입 — 훑기|2:주어진 글 끝 — Before (시간 고리)|3:(A) 첫 문장 — these worries|4:(A) 설명 — 훑기|5:(B) 첫 문장 — However, once|6:(B) 설명 — promise 찾을 때만|7:(C) 첫 문장 — This promise|8:(C) 설명 — 훑기","any":1,"q":"주어진 글의 마지막 문장 + 각 단락의 첫 문장을 탭하세요.","pre":["주어진 글은 마지막 문장이 다음 단락과 이어진다","각 단락의 첫 문장에 this / these + 명사, However가 있다","4문장만 먼저 읽고 고리를 잇는다"],"seq":[2,3,5,7],"h":"주어진 글은 두 문장이에요. 그중 뒤 문장(Before it appeared ~)이 다음 단락과 이어져요.","w":"주어진 글 끝 Before → (B) However, once ~ / (B)(C)(A) 첫 문장의 고리로 연결."},{"k":"tap","q":"지시어(this / these + 명사)만 탭하세요. (2개)","c":["a1","a2","a0","b1","c1"],"a":["a2","c1"],"h":"However는 연결사예요. 이번에는 this/these가 붙은 명사만!","w":"(A) these worries / (C) This promise"},{"k":"match","q":"각 고리가 가리키는 것을 고르세요.","pre":["판별법: 가리킬 수 있는 후보가 하나뿐이면 강한 고리","This promise, these worries — 명사가 붙어 있고 후보가 하나 → 강한 고리","However, However — 둘 다 똑같이 반대 방향이라 구별이 안 됨 → 확인용"],"rows":[["This promise",["(B)의 the promise of always having something new","주어진 글의 Before it appeared"],0],["these worries",["(C)의 mountains of discarded clothing (환경 걱정)","(B)의 cheap production methods"],0],["(A)와 (B)가 둘 다 However일 때 판단 기준",["지시어(this / these + 명사)","연결사(However)"],0]],"h":"같은 However 두 개는 구별이 안 돼요. 지시어가 결정타!","w":"주어진 글(Before) → (B) However, 그 후 → (C) This promise → (A) these worries"},{"k":"final","q":"주어진 글 다음에 이어질 순서로 가장 적절한 것은?","o":["① (A)-(C)-(B)","② (B)-(A)-(C)","③ (B)-(C)-(A)","④ (C)-(A)-(B)","⑤ (C)-(B)-(A)"],"a":2,"h":"\"약속\"이 처음 나오는 단락, \"걱정\"이 처음 나오는 단락을 찾아보세요."}],"after":{"opts":[["① (A)-(C)-(B)","✘ (A)의 these worries — 걱정이 아직 안 나옴"],["② (B)-(A)-(C)","✘ (A)가 (C)의 걱정보다 먼저 나옴"],["③ (B)-(C)-(A)","✔ 등장 → 이 약속의 대가 → 이 걱정에 대응"],["④ (C)-(A)-(B)","✘ (C)의 This promise가 가리킬 약속이 없음"],["⑤ (C)-(B)-(A)","✘ 위와 같음"]],"link":[["주어진 글 Before it appeared","(B) However, once cheap production … — 시간 대조"],["(B) the promise of always having something new","(C) This promise"],["(C) mountains of discarded clothing","(A) these worries"]],"note":"흐름 = 과거(좋았다) → 변화 → 문제(대가) → 업계의 반응. 원 문항 37번과 같은 뼈대.","tr":"[주어진 글] 오늘날 우리의 옷장을 이해하려면, 먼저 패스트 패션 산업의 짧지만 잘 알려지지 않은 역사를 살펴볼 필요가 있다. 그것이 등장하기 전, 사람들은 옷을 더 적게 사고 수선해 입었으며, 지금 우리보다 훨씬 적은 섬유 쓰레기를 만들었다. (B) 그러나 값싼 생산 방식이 퍼지고 세계 운송이 빨라지자, 새 옷이 모든 쇼핑 거리에 넘쳐났다. 그 산업은 언제나 새롭고 저렴한 입을 거리를 갖는다는 약속을 상징하게 되었다. (C) 이 약속에는 숨겨진 대가가 있었다. 시간이 흐르며 사람들은 버려진 옷 더미를 알아차리기 시작했고, 오늘날 슬로 패션 운동의 첫 목소리가 들려왔다. (A) 그러나 패션 회사들은 의류 수거함을 쓰레기 문제의 해답으로 광고하며 이러한 우려에 재빨리 대응했다. 그들은 쓰레기가 끝없이 새 컬렉션을 내놓는 브랜드가 아니라 쇼핑객의 책임이라는 메시지를 퍼뜨렸다."},"chip":"3월 37","tag":"37번 · 순서 (3월 변형)"},{"id":"m38","src":"m38","type":"삽입","title":"문장 삽입 — not A. Instead, B","formula":["Instead / Rather 앞에는 반드시 not A가 있어야 한다","not A가 빠진 자리 = 주어진 문장이 들어갈 곳"],"blocks":[{"l":"주어진 문장","g":1,"s":[["Thus, the change from one art style to the next is not a climb from a less to a more skillful way of painting.","따라서 한 미술 양식에서 다음 양식으로의 변화는 덜 숙련된 그림 방식에서 더 숙련된 방식으로 올라가는 것이 아니다.","from a less to a more skillful way = from a less skillful way to a more skillful way (skillful way를 한 번만 씀) / from one ~ to the next = 하나에서 다음으로"]]},{"s":[["Art historians point out that every painter works within a style, a shared set of beliefs about what a picture should show and how it should be made. ( ① )","미술사학자들은 모든 화가가 하나의 양식, 즉 그림이 무엇을 보여 주어야 하고 어떻게 만들어져야 하는지에 대한 공유된 믿음의 집합 안에서 작업한다고 지적한다.","point out = 지적하다 / a style, a shared set ~ (콤마 = 즉, 동격) / what ~ and how ~ 명사절 병렬"],["Even the most careful brushstroke makes sense only within that style. ( ② )","가장 신중한 붓질조차 그 양식 안에서만 의미가 있다.","Even + 최상급 = 가장 ~한 것조차 / make sense = 의미가 통하다 / only within = ~ 안에서만"],["{{f|For instance}}, a flat, golden medieval painting may look clumsy to us {{u|unless}} we know that its painters wanted to express spiritual importance, not physical reality. ( ③ )","예를 들어, 평평하고 금빛인 중세 그림은 그 화가들이 물리적 현실이 아니라 영적인 중요성을 표현하고자 했다는 것을 우리가 알지 못한다면 서툴러 보일 수 있다.","look + 형용사 = ~해 보이다 / unless = if ~ not / A, not B = B가 아니라 A"],["{{i|Instead}}, it is a sideways move from one way of seeing the world to another. ( ④ )","오히려 그것은 세상을 보는 한 방식에서 다른 방식으로의 옆걸음이다.","Instead = Rather (앞에 not A 필요) / from one ~ to another = 하나에서 다른 하나로"],["{{t|That is why}} a new style does not simply paint the world better. ( ⑤ )","그래서 새 양식은 세상을 그저 더 잘 그리는 것이 아니다.","That is why ~ = 그래서 ~이다 / better = well의 비교급 (더 잘)"],["It paints a different world.","그것은 다른 세상을 그린다."]]}],"steps":[{"k":"choice","q":"Instead / Rather 앞에 반드시 있어야 하는 것은?","o":["not A — 무엇이 \"아닌지\" 말하는 문장","For example — 예시 문장"],"a":0,"h":"\"짜장면이 싫은 게 아니야. 오히려 짬뽕이 좋아.\" 오히려 앞에 뭐가 있죠?","w":"not A. Instead, B — A가 아니라 오히려 B"},{"k":"order","roles":"1:주어진 문장 — not a climb|2:정의 — 훑기|3:부연 — 훑기|4:예시 — Instead 바로 앞|5:신호어 Instead — 앞에 not A?|6:결론 — 훑기|7:마무리 — 훑기","q":"삽입 문제 읽는 순서대로 탭하세요: ① 주어진 문장 → ② 논리가 끊기는 신호가 있는 문장 → ③ 그 바로 앞 문장","pre":["주어진 문장을 먼저 읽고 단서(Thus, not A)를 잡는다","본문에서 Instead / Rather / However 같은 신호를 찾는다","신호 문장과 그 앞 문장이 자연스럽게 이어지는지만 확인한다"],"seq":[1,5,4],"h":"신호 = Instead. Instead가 있는 문장, 그리고 그 바로 앞 문장(중세 그림 예시)이에요.","w":"3문장만 보면 된다: not a climb(주어진 문장) → 예시 문장 → Instead 문장. 예시와 Instead 사이에 not A가 빠져 있다."},{"k":"tap","q":"본문에서 Instead를 찾아 탭하세요.","c":["f","u","i","t"],"a":["i"],"h":"\"대신에, 오히려\"라는 뜻의 단어예요.","w":"Instead = Rather"},{"k":"choice","q":"Instead 바로 앞 문장에 not A가 있나요?","o":["있다","없다 — 여기서 논리가 끊긴다"],"a":1,"h":"앞 문장은 중세 그림 \"예시\"예요. \"~가 아니다\"라는 말이 있나요?","w":"예시 다음에 바로 Instead가 오면 무엇이 아닌지가 빠진다 → 주어진 문장의 not a climb이 그 자리."},{"k":"choice","q":"주어진 문장을 쉬운 말로 바꾸면?","o":["새 스타일은 더 잘 그리는 쪽으로 \"계단을 오르는\" 것이 아니다","새 스타일은 옛 스타일보다 항상 더 정교하다"],"a":0,"h":"not a climb — \"올라가는 것이 아니다\"","w":"계단(위로, 더 잘) ✘ → 옆 방(다르게) ✔"},{"k":"final","q":"주어진 문장이 들어가기에 가장 적절한 곳은?","o":["①","②","③","④","⑤"],"a":2,"h":"Instead 바로 앞 칸이에요."}],"after":{"opts":[["①","✘ 아직 결론(Thus)을 낼 근거가 없음"],["②","✘ 뒤에 For instance 예시가 자연스럽게 이어짐"],["③","✔ 예시 → Thus, not A → Instead, B"],["④","✘ Instead 문장 뒤 — 이미 논리가 끊긴 뒤"],["⑤","✘ That is why ~ / It paints a different world 사이는 끊김 없음"]],"link":[["예시: 중세 그림은 의도를 알아야 이해된다","Thus → 결론"],["not a climb (더 잘 그리기로 올라감 ✘)","Instead, a sideways move (옆으로 이동 ✔)"],["sideways move","= paints a different world"]],"note":"내용 연결: 모든 그림이 각자의 스타일 안에서만 의미가 있다면, 스타일끼리 누가 더 잘 그렸는지 잴 바깥 기준이 없다 → 그래서 변화는 위로가 아니라 옆으로.","tr":"미술사학자들은 모든 화가가 하나의 양식, 즉 그림이 무엇을 보여 주어야 하고 어떻게 만들어져야 하는지에 대한 공유된 믿음의 집합 안에서 작업한다고 지적한다. 가장 신중한 붓질조차 그 양식 안에서만 의미가 있다. 예를 들어, 평평하고 금빛인 중세 그림은 그 화가들이 물리적 현실이 아니라 영적인 중요성을 표현하고자 했다는 것을 우리가 알지 못한다면 서툴러 보일 수 있다. [따라서 한 미술 양식에서 다음 양식으로의 변화는 덜 숙련된 그림 방식에서 더 숙련된 방식으로 올라가는 것이 아니다.] 오히려 그것은 세상을 보는 한 방식에서 다른 방식으로의 옆걸음이다. 그래서 새 양식은 세상을 그저 더 잘 그리는 것이 아니다. 그것은 다른 세상을 그린다."},"chip":"3월 38","tag":"38번 · 삽입 (3월 변형)"},{"id":"m39","src":"m39","type":"삽입","title":"문장 삽입 — Yet + 분위기 반전 경계","formula":["주어진 문장의 Yet(역접) + second visit = 분위기가 정반대로 바뀌는 경계","본문에서 (−) 묘사와 (+) 묘사가 연결어 없이 붙은 곳 = 정답"],"blocks":[{"l":"주어진 문장","g":1,"s":[["Yet only a week after the first heavy rain, a second visit reveals an astonishing change.","그러나 첫 큰비가 내린 지 겨우 일주일 뒤, 두 번째 방문은 놀라운 변화를 보여 준다.","Yet = 그러나 (역접 — 분위기 반전) / a second visit = 두 번째 방문"]]},{"s":[["Walking through the same desert valley twice — once in late summer and again after the spring rains — offers a dramatic lesson in how life waits. ( ① )","같은 사막 골짜기를 두 번, 즉 한 번은 늦여름에, 또 한 번은 봄비가 내린 후에 걸어 보는 것은 생명이 어떻게 기다리는지에 대한 극적인 교훈을 준다.","동명사 주어 Walking ~ → offers / how S V = ~가 어떻게 …하는지"],["During the summer walk, the ground is cracked and gray. ( ② )","여름 산책 동안 땅은 갈라지고 잿빛이다."],["Kneeling to brush away the hot dust, which is hard because it is packed like stone, uncovers only dry seeds and dead stems, a scene {{lo|lonely}} enough to make anyone believe nothing could grow here. ( ③ )","무릎을 꿇고 뜨거운 먼지를 털어 내는 것은, 그것이 돌처럼 단단히 다져져 있어서 어려운데, 마른 씨앗과 죽은 줄기만 드러내며, 이곳에는 아무것도 자랄 수 없다고 누구라도 믿게 할 만큼 쓸쓸한 광경이다.","동명사 주어 Kneeling ~ → uncovers (단수) / 형용사 + enough to V / lonely = 형용사 (-ly로 끝나도 형용사)"],["Even the few animals that live there hide underground until evening. ( ④ )","그곳에 사는 몇 안 되는 동물들조차 저녁까지 땅속에 숨어 있다.","the few + 복수명사 = 몇 안 되는 ~"],["Beneath the thin crust, tiny green shoots have pushed up everywhere, covering the valley floor. ( ⑤ )","얇은 겉흙 아래에서 작은 초록 새싹들이 사방에서 솟아올라 골짜기 바닥을 덮고 있다.","have pushed up = 현재완료 / covering ~ = 분사구문 (결과)"],["Flowers in yellow, purple, and white stand out sharply against the red rocks.","노랑, 보라, 하양 꽃들이 붉은 바위를 배경으로 또렷이 두드러진다.","stand out against = ~을 배경으로 두드러지다"],["The valley looks like a garden someone planted overnight.","골짜기는 누군가 하룻밤 사이에 심어 놓은 정원처럼 보인다.","look like + 명사 / a garden (that) someone planted"]]}],"steps":[{"k":"choice","q":"주어진 문장의 Yet + a second visit이 들어갈 곳은?","o":["분위기가 정반대로 바뀌는 경계","첫 번째 방문이 시작되  const c=$('#chips');c.innerHTML='';

 L.forEach((i,j)=>{const d=DATA[i];const b=document.createElement('button');b.className='chip'+(ST.view==='q'&&ST.cur===i?' on':'')+(qDone(i)?' done':'');b.style.setProperty('--c',color(d));b.disabled=LOCK&&j>0&&!qDone(L[j-1]);b.innerHTML=`<span class="dot"></span>${d.chip?esc(d.chip):d.src+'번'}`;b.setAttribute('aria-label',`${d.src}번 ${d.type}`);b.onclick=()=>{ST.view='q';ST.cur=i;save();render();window.scrollTo({top:0})};row2.appendChild(b)});
 const r=document.createElement('button');r.className='chip res'+(ST.view==='sum'?' on':'');r.textContent=SS.length>1?SS[ST.sess].n+' 결과':'결과';r.disabled=LOCK&&!sessDone(ST.sess);r.onclick=()=>{ST.view='sum';save();render()};row2.appendChild(r);c.appendChild(row2);
 const tot=L.reduce((a,i)=>a+DATA[i].steps.length,0),dn=L.reduce((a,i)=>a+ST.q[i].steps.filter(s=>s.done).length,0);
 $('#bar').style.width=(tot?dn/tot*100:0)+'%';
}

function tblHTML(b){const t=b.tbl;return `<div class="tblw">${b.l?`<div class="tblt">${esc(b.l)}</div>`:''}<table class="dt"><thead><tr>${t.head.map(x=>`<th>${esc(x)}</th>`).join('')}</tr></thead><tbody>${t.rows.map(r=>`<tr>${r.map((x,ci)=>`<td${ci?' class="n"':''}>${esc(x)}</td>`).join('')}</tr>`).join('')}</tbody></table>${t.unit?`<div class="tblu">${esc(t.unit)}</div>`:''}</div>`}
function renderQ(i){
 const d=DATA[i],q=ST.q[i],m=$('#main');const a=active(i);
 let h=`<section style="--c:${color(d)}"><div class="qhead"><span class="badge">${d.type}</span><h2>${esc(d.title)}</h2><span class="src">${d.tag?esc(d.tag):'원 문항 '+d.src+'번 변형'}</span>${q.steps.some(s=>s.done||s.att)?`<button class="btn ghost redo1" id="redo1">이 문제 처음부터 다시 풀기</button>`:''}</div>`;
 h+=`<div class="formula">${d.formula.map(f=>`<div>${esc(f)}</div>`).join('')}</div>`;
 const finDone=(()=>{const fk=d.steps.findIndex(x=>x.k==='final');return fk>=0&&q.steps[fk].done})();
 if(finDone)h+=`<div class="trbar"><button class="btn ghost" id="trbtn">${ST.tr?'문장별 해석 끄기':'문장별 해석 켜기'}</button><span>영어 한 문장 ↔ 해석 한 줄 + 구문 포인트</span></div>`;
 const showTr=ST.tr&&finDone;let n=0;
 h+=`<div class="paper${showTr?' tron':''}" id="psg">${d.blocks.map(b=>showTr
  ?(b.tbl?tblHTML(b):`<div class="blk2${b.g?' given':''}">${b.l?`<span class="lab">${esc(b.l)}</span>`:''}${b.s.map(x=>{n++;return `<div class="pair"><div class="en"><span class="sn">${n}</span>${mk(x[0])}</div><div class="kr">${esc(x[1])}</div>${x[2]?`<div class="nt">구문  ${esc(x[2])}</div>`:''}</div>`}).join('')}</div>`)
  :(b.tbl?tblHTML(b):`<p class="blk${b.g?' given':''}">${b.l?`<span class="lab">${esc(b.l)}</span>`:''}${b.s.map(x=>{n++;return `<span class="sen" data-sn="${n}">${mk(x[0])}</span>`}).join(' ')}</p>`)).join('')}</div>`;
 if(d.preview&&!qDone(i)){const fo=d.steps.find(x=>x.k==='final').o;h+=`<div class="pv"><div class="pvh">선지 미리 보기 — 고르기는 마지막 단계에서</div>${fo.map(o=>`<div class="pvo">${esc(o)}</div>`).join('')}</div>`}
 d.steps.forEach((s,k)=>{h+=stepHTML(i,k,a)});
 if(qDone(i))h+=afterHTML(d);
 if(qDone(i)){h+=`<div class="next">${(()=>{const L=sessQ(sessIdx(i)),j=L.indexOf(i);return j<L.length-1?`<button class="btn" id="nx">다음 문제 (${DATA[L[j+1]].src}번)</button>`:`<button class="btn" id="nx">${SS.length>1?esc(SS[sessIdx(i)].n)+' 결과 보기':'결과 보기'}</button>`})()}</div>`}
 h+='</section>';m.innerHTML=h;
 paintPassage(i);bind(i);
}
function stepHTML(i,k,a){
 const d=DATA[i],s=d.steps[k],st=ST.q[i].steps[k];
 const lock=!st.done&&k!==a;
 const title=s.k==='final'?s.q:s.q;
 if(lock)return `<div class="step lock"><div class="shd"><span class="num">${k+1}</span><span class="sq">${s.k==='final'?'정답 고르기':'잠김'} — 앞 단계를 맞히면 열린다</span></div></div>`;
 let b='';
 if(s.k==='choice'||s.k==='final'){
  b=`<div class="opts">${s.o.map((o,j)=>{let c='opt';if(st.done&&j===s.a)c+=' pick';else if(!st.done&&st.bad.includes(j))c+=' no';if(!st.done&&st.rv&&j===s.a)c+=' show';return `<button class="${c}" data-s="${k}" data-o="${j}" ${st.done?'disabled':''}>${esc(o)}</button>`}).join('')}</div>`;
 }else if(s.k==='tap'){
  b=`<p class="tapnote">${st.done?'찾은 단서가 지문에 밑줄로 남아 있다.':'위 지문에서 해당 부분을 탭한 뒤 확인을 누르세요. 다시 탭하면 취소된다.'}</p>${st.done?'':`<button class="btn" data-chk="${k}">확인</button>`}`;
 }else if(s.k==='order'){
  const lab=st.sel.length?st.sel.map(n=>n+'번째').join(' → '):'아직 안 고름';
  b=st.done?`<p class="tapnote">지문에 읽는 순서 번호가 남아 있다.</p>`:`<p class="tapnote">위 지문에서 문장을 순서대로 탭하세요. 다시 탭하면 빠진다.</p><div class="seqv">선택: ${esc(lab)}</div><button class="btn" data-chk="${k}">확인</button> <button class="btn ghost" data-clr="${k}">다시 고르기</button>`;
 }else if(s.k==='match'){
  b=s.rows.map((r,ri)=>{const v=st.sel[ri];const x=!st.done&&st.bad.includes(ri);return `<div class="mrow"><div class="mlab${x?' x':''}">${esc(r[0])}</div><div class="rchips">${r[1].map((o,j)=>{let c='rchip';if(v===j)c+=' sel';if(!st.done&&st.rv&&j===r[2]&&v!==j)c+=' show';return `<button class="${c}" data-s="${k}" data-r="${ri}" data-o="${j}" ${st.done?'disabled':''}>${esc(o)}</button>`}).join('')}</div></div>`}).join('')+(st.done?'':`<button class="btn" data-chk="${k}">확인</button>`);
 }
 let msg='';
 if(st.done){msg=`<div class="msg ok">${st.res===1?'한 번에 정답!':st.res===2?'힌트 보고 정답.':'정답 확인 후 직접 해결.'}${s.w?' '+esc(s.w):''}</div>`}
 else if(st.msg){msg=`<div class="msg ${st.mt}">${esc(st.msg)}</div>`}
 const pre=s.pre?`<div class="pre">${s.pre.map(l=>`<div>${esc(l)}</div>`).join('')}</div>`:'';
 return `<div class="step${st.done?' ok':''}" id="st${k}"><div class="shd"><span class="num">${k+1}</span><span class="sq">${esc(title)}</span></div><div class="sbody">${pre}${b}${msg}</div></div>`;
}
function paintPassage(i){
 const d=DATA[i],q=ST.q[i],a=active(i);
 const found=new Set();d.steps.forEach((s,k)=>{if(s.k==='tap'&&q.steps[k].done)s.a.forEach(x=>found.add(x))});
 const s=a>=0?d.steps[a]:null,st=a>=0?q.steps[a]:null;
 document.querySelectorAll('#psg .sen').forEach(el=>{const n=+el.dataset.sn;el.className='sen';delete el.dataset.pick;delete el.dataset.ord;
  if(s&&s.k==='order'){el.classList.add('scand');const p=st.sel.indexOf(n);if(p>=0){el.classList.add('spick');el.dataset.pick=s.any?'✓':String(p+1)}if(st.rv&&!st.sel.includes(n)&&s.seq.includes(n))el.classList.add('sshow')}
  if(!(s&&s.k==='order'))d.steps.forEach((s2,k2)=>{if(s2.k!=='order'||!q.steps[k2].done)return;const R={};(s2.roles||'').split('|').forEach(x=>{const p=x.indexOf(':');if(p>0)R[+x.slice(0,p)]=x.slice(p+1)});
   if(s2.seq.includes(n)){el.classList.add('key');el.dataset.ord=(s2.any?'':(s2.seq.indexOf(n)+1)+' ')+(R[n]||'읽기')}else if(R[n]){el.classList.add('skip');el.dataset.ord=R[n]}});
 });
 document.querySelectorAll('#psg .cue').forEach(el=>{el.classList.toggle('on',!!(s&&s.cue&&s.cue.includes(el.dataset.cue)))});
 document.querySelectorAll('#psg .tk').forEach(el=>{
  const id=el.dataset.id;el.className='tk';delete el.dataset.bn;el.removeAttribute('tabindex');el.removeAttribute('role');
  if(found.has(id))el.classList.add('found');
  if(s&&s.k==='tap'&&s.c.includes(id)){el.classList.add('cand');if(s.box){el.classList.add('box');el.dataset.bn=s.c.indexOf(id)+1}else delete el.dataset.bn;el.tabIndex=0;el.setAttribute('role','button');
   if(st.sel.includes(id))el.classList.add('sel');
   if(st.rv&&s.a.includes(id)&&!st.sel.includes(id))el.classList.add('show');
   if(st.bad.includes(id)&&!st.sel.includes(id))el.classList.add('wrong');}
 });
}
function bind(i){
 const d=DATA[i],q=ST.q[i];
 document.querySelectorAll('#psg .tk').forEach(el=>{
  const f=()=>{const a=active(i);if(a<0)return;const s=d.steps[a];if(s.k!=='tap'||!s.c.includes(el.dataset.id))return;const st=q.steps[a];const id=el.dataset.id;st.bad=st.bad.filter(x=>x!==id);
   st.sel=st.sel.includes(id)?st.sel.filter(x=>x!==id):[...st.sel,id];paintPassage(i)};
  el.onclick=f;el.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();f()}};
 });
 document.querySelectorAll('#psg .sen').forEach(el=>{el.addEventListener('click',()=>{const a=active(i);if(a<0)return;const s=d.steps[a];if(s.k!=='order')return;const st=q.steps[a];const n=+el.dataset.sn;st.sel=st.sel.includes(n)?st.sel.filter(x=>x!==n):[...st.sel,n];st.msg='';renderKeep(i,a)})});
 document.querySelectorAll('[data-clr]').forEach(b=>b.onclick=()=>{const k=+b.dataset.clr;q.steps[k].sel=[];renderKeep(i,k)});
 document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{const k=+b.dataset.s,j=+b.dataset.o;const st=q.steps[k];st.sel=j;check(i,k)});
 document.querySelectorAll('.rchip').forEach(b=>b.onclick=()=>{const k=+b.dataset.s,r=+b.dataset.r,j=+b.dataset.o;const st=q.steps[k];st.sel[r]=j;st.bad=st.bad.filter(x=>x!==r);renderKeep(i,k)});
 document.querySelectorAll('[data-chk]').forEach(b=>b.onclick=()=>check(i,+b.dataset.chk));
 const tb=$('#trbtn');if(tb)tb.onclick=()=>{ST.tr=!ST.tr;save();renderKeep(i,0)};
 twoTap($('#redo1'),'한 번 더 누르면 처음부터',()=>{ST.q[i]={steps:d.steps.map(s=>newStep(s))};ST.view='q';save();render();window.scrollTo({top:0,behavior:'smooth'})});
 const nx=$('#nx');if(nx)nx.onclick=()=>{const L=sessQ(sessIdx(i)),j=L.indexOf(i);if(j<L.length-1){ST.cur=L[j+1];ST.view='q'}else ST.view='sum';save();render();window.scrollTo({top:0,behavior:'smooth'})};
}
function renderKeep(i,k){const y=window.scrollY;renderQ(i);chips();window.scrollTo(0,y)}
function check(i,k){
 const s=DATA[i].steps[k],st=ST.q[i].steps[k];let ok=false;
 if(s.k==='choice'||s.k==='final'){ok=st.sel===s.a;if(!ok&&!st.bad.includes(st.sel))st.bad.push(st.sel)}
 else if(s.k==='tap'){const A=new Set(s.a),S=new Set(st.sel);ok=A.size===S.size&&[...A].every(x=>S.has(x));if(!ok){st.bad=st.sel.filter(x=>!A.has(x));st.sel=st.sel.filter(x=>A.has(x))}}
 else if(s.k==='order'){if(s.any){const A=new Set(s.seq),S=new Set(st.sel);ok=A.size===S.size&&[...A].every(x=>S.has(x));if(!ok)st.sel=st.sel.filter(x=>A.has(x))}else{ok=st.sel.length===s.seq.length&&st.sel.every((x,j)=>x===s.seq[j]);if(!ok)st.sel=[]}}
 else if(s.k==='match'){if(st.sel.some(v=>v===null)){st.msg='모든 줄을 골라야 확인할 수 있어요.';st.mt='hint';return renderKeep(i,k)}st.bad=[];s.rows.forEach((r,ri)=>{if(st.sel[ri]!==r[2])st.bad.push(ri)});ok=st.bad.length===0;if(!ok)st.bad.forEach(ri=>st.sel[ri]=null)}
 if(ok){st.done=true;st.res=st.rv?3:(st.att===0?1:2);st.msg='';st.bad=[];save();renderKeep(i,k);
  const nxt=document.getElementById('st'+(k+1));const tgt=nxt||document.querySelector('.after');if(tgt){tgt.classList.add('flash');tgt.scrollIntoView({behavior:'smooth',block:'center'})}
  return}
 st.att++;
 if(st.att===1){st.msg='힌트: '+s.h;st.mt='hint'}
 else{st.rv=true;st.msg=s.k==='order'?'읽어야 할 문장을 빨간 점선으로 표시했어요. '+(s.any?'모두 탭하고':'순서대로 탭하고')+' 확인을 누르세요.':s.k==='tap'?'정답 위치를 빨간 점선으로 표시했어요. 직접 탭해서 확인을 누르세요.':s.k==='match'?'정답을 빨간 점선으로 표시했어요. 직접 골라서 확인을 누르세요.':'정답을 빨간 점선으로 표시했어요. 직접 눌러서 넘어가세요.';st.mt='rv'}
 save();renderKeep(i,k);
}
function afterHTML(d){
 const A=d.after;
 return `<div class="after"><h3>정답 ${(()=>{const f=d.steps.find(x=>x.k==='final');return esc(f.o[f.a].split(' ')[0])})()} — 해설</h3>
 <h4>선지 판정</h4><div class="olist">${A.opts.map(o=>`<div><b>${esc(o[0])}</b>${esc(o[1])}</div>`).join('')}</div>
 <h4>연결구조</h4><table class="lk">${A.link.map(r=>`<tr><td>${esc(r[0])}</td><td>${esc(r[1])}</td></tr>`).join('')}</table>
 <p style="font-size:15.5px;margin:12px 0 0">${esc(A.note)}</p>
 ${A.more?`<h4>같이 알아두면 좋을 표현</h4>${A.more.map(g=>`<div class="mg"><div class="mgt">${esc(g.t)}</div>${g.i.map(x=>`<div class="mgi"><b>${esc(x[0])}</b><span>${esc(x[1])}</span></div>`).join('')}</div>`).join('')}`:''}
 <p style="font-size:14.5px;color:var(--muted);margin:10px 0 0">지문 위 "문장별 해석 켜기"를 누르면 문장마다 해석과 구문 포인트가 나온다.</p></div>`;
}
function stats(L){let o=0,h=0,r=0;L.forEach(i=>ST.q[i].steps.forEach(s=>{if(s.res===1)o++;else if(s.res===2)h++;else if(s.res===3)r++}));return{o,h,r}}
function code(L,k){const{o,h,r}=stats(L);const p=n=>String(n).padStart(2,'0');const c=String.fromCharCode(65+((o*3+h*5+r*7+k*11)%26));return `${EXAM.code}${SS.length>1?'-S'+sessNum(k):''}-${p(o)}${p(h)}${p(r)}-${c}`}
function renderSum(){
 const k=ST.sess,L=sessQ(k),S=SS[k];const{o,h,r}=stats(L);const fin=sessDone(k);const nm=SS.length>1?S.n:'';
 let x=`<div class="sum"><h2>${fin?(nm?nm+' 완료':L.length+'문항 완료'):(nm?nm+' 진행 상황':'진행 상황')}</h2>${S.t?`<p style="margin:0 0 4px;font-weight:700">${esc(S.t)}</p>`:''}<p style="margin:0;color:var(--muted)">${fin?'완료 코드를 클래스룸 댓글로 제출하세요.':L.length+'문항을 모두 끝내면 완료 코드가 나온다.'}</p>
 ${fin?`<div class="code">${code(L,k)}</div>`:''}
 <div class="stats"><div><b>${o}</b>한 번에 정답</div><div><b>${h}</b>힌트 후 정답</div><div><b>${r}</b>정답 공개</div></div>
 <h3 style="font-size:17px;margin:16px 0 4px">문항별</h3>`;
 L.forEach(i=>{const d=DATA[i],q=ST.q[i];const rv=q.steps.filter(s=>s.res===3).length,hh=q.steps.filter(s=>s.res===2).length;
  const dn=qDone(i);x+=`<div class="qline"><span><span class="badge" style="--c:${color(d)}">${d.type}</span> ${d.src}번 변형 — ${dn?`힌트 ${hh} · 공개 ${rv}`:'아직 안 끝남'}</span>${dn?'':`<button class="btn ghost" data-go="${i}">풀러 가기</button>`}${rv?`<button class="btn ghost" data-redo="${i}">공개된 문제 다시 풀기</button>`:''}</div>`});
 x+=`<div style="margin-top:16px;display:flex;gap:8px;flex-wrap:wrap">${fin&&k<SS.length-1?`<button class="btn" id="nsess">다음 회차로 (${esc(SS[k+1].n)})</button>`:''}<button class="btn ghost" id="redoS">${nm?esc(nm)+' ':''}전부 다시 풀기</button><button class="btn ghost" id="reset">모든 회차 기록 지우기</button></div></div>`;
 $('#main').innerHTML=x;
 document.querySelectorAll('[data-redo]').forEach(b=>b.onclick=()=>{const i=+b.dataset.redo;ST.q[i]={steps:DATA[i].steps.map(s=>newStep(s))};ST.cur=i;ST.view='q';save();render();window.scrollTo({top:0})});
 document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{ST.cur=+b.dataset.go;ST.view='q';save();render();window.scrollTo({top:0})});
 const ns=$('#nsess');if(ns)ns.onclick=()=>{ST.sess=k+1;ST.cur=sessQ(k+1)[0];ST.view='q';save();render();window.scrollTo({top:0})};
 twoTap($('#redoS'),'한 번 더 누르면 이 회차만 처음부터',()=>{L.forEach(i=>{ST.q[i]={steps:DATA[i].steps.map(s=>newStep(s))}});ST.cur=L[0];ST.view='q';save();render();window.scrollTo({top:0})});
 twoTap($('#reset'),'한 번 더 누르면 모든 기록 삭제',()=>{ST=fresh();ST.sess=0;save();render()});
}
/* 시작 */
document.title=EXAM.title;$('#ttl').textContent=EXAM.title;$('#sub').textContent=EXAM.sub;$('#foot').textContent=EXAM.footer+(EXAM.ver?' · '+EXAM.ver:'');
try{render()}catch(e){console.error(e);ST=fresh();ST.sess=0;try{save()}catch(_){}render()}
</script></body></html>
