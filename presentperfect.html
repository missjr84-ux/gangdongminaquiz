<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>현재완료 완전 정복 (차세대) — 고1 시험 대비</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Lora:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#FAF7F0;--card:#FFFFFF;--ink:#23272F;--sub:#727784;--line:#E7E2D6;
  --root:#1F3A5F;--root-bg:#E8EEF6;--b:#B8860B;--b-bg:#FEF8E1;--c:#1E7A5A;--c-bg:#E2F3EB;
  --d:#C84F2F;--d-bg:#FBE8E0;--e:#5D4FA3;--e-bg:#EBE7F8;
  --hl:#FFE45C;--ok:#1E7A5A;--bad:#C0392B;--r:14px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{animation:none!important;transition:none!important}}
body{font-family:'IBM Plex Sans KR',sans-serif;background:var(--paper);color:var(--ink);line-height:1.65;
  background-image:radial-gradient(#e9e4d6 1px,transparent 1px);background-size:26px 26px;}
.wrap{max-width:780px;margin:0 auto;padding:0 16px 90px}
header{padding:38px 0 10px;text-align:center}
.eyebrow{display:inline-block;font-size:.78rem;font-weight:700;letter-spacing:.1em;color:var(--e);
  border:1.5px solid var(--e);border-radius:999px;padding:3px 14px;margin-bottom:14px;background:#fff}
h1{font-family:'Black Han Sans',sans-serif;font-size:clamp(1.7rem,5.5vw,2.5rem);line-height:1.25;font-weight:400}
h1 .mark{background:linear-gradient(transparent 58%,var(--hl) 58%);padding:0 4px}
.tagline{color:var(--sub);margin-top:10px;font-size:.95rem}
.feat{display:flex;justify-content:center;gap:8px;margin-top:12px;flex-wrap:wrap}
.feat .f{font-size:.72rem;font-weight:700;padding:4px 12px;border-radius:999px;background:#fff;border:1.5px solid var(--e);color:var(--e)}
.levelbar{display:flex;justify-content:center;gap:6px;margin-top:12px;flex-wrap:wrap}
.lv{font-size:.72rem;font-weight:700;padding:3px 12px;border-radius:999px;border:1.5px solid}
.lv.l1{color:var(--c);border-color:var(--c);background:var(--c-bg)}
.lv.l2{color:var(--b);border-color:var(--b);background:var(--b-bg)}
.lv.l3{color:var(--e);border-color:var(--e);background:var(--e-bg)}
.lv.l4{color:var(--d);border-color:var(--d);background:var(--d-bg)}
.stepper{position:sticky;top:0;z-index:50;background:rgba(250,247,240,.94);backdrop-filter:blur(6px);
  border-bottom:1px solid var(--line);margin:22px -16px 0;padding:10px 8px}
.steps{display:flex;justify-content:center;gap:3px;max-width:780px;margin:0 auto;flex-wrap:wrap}
.step{flex:1;max-width:96px;min-width:56px;border:none;background:transparent;cursor:pointer;font-family:inherit;
  display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 2px;border-radius:10px}
.step .dot{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-size:.92rem;background:#fff;border:2px solid var(--line);transition:.25s}
.step .lb{font-size:.6rem;font-weight:600;color:var(--sub);white-space:nowrap}
.step.cur .dot{border-color:var(--ink);box-shadow:0 0 0 3px rgba(35,39,47,.12)}
.step.cur .lb{color:var(--ink)}
.step.done .dot{background:var(--ink);border-color:var(--ink);color:#fff}
.step.locked{opacity:.42;cursor:not-allowed}
.step:not(.locked):hover .dot{transform:translateY(-2px)}
.stage{display:none;animation:fadeUp .4s ease}.stage.show{display:block}
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.path{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin:24px 0 6px;font-size:.8rem;font-weight:700}
.path .crumb{padding:2px 10px;border-radius:999px;background:#fff;border:1.5px solid var(--line)}
.path .crumb.on-root{border-color:var(--root);color:var(--root);background:var(--root-bg)}
.path .crumb.on-b{border-color:var(--b);color:var(--b);background:var(--b-bg)}
.path .crumb.on-c{border-color:var(--c);color:var(--c);background:var(--c-bg)}
.path .crumb.on-d{border-color:var(--d);color:var(--d);background:var(--d-bg)}
.path .crumb.on-e{border-color:var(--e);color:var(--e);background:var(--e-bg)}
.path .sep{color:var(--sub)}
.lvchip{font-size:.66rem;font-weight:800;padding:2px 9px;border-radius:999px;margin-left:4px}
.lvchip.l1{color:var(--c);background:var(--c-bg)}.lvchip.l2{color:var(--b);background:var(--b-bg)}
.lvchip.l3{color:var(--e);background:var(--e-bg)}.lvchip.l4{color:var(--d);background:var(--d-bg)}
h2.stitle{font-family:'Black Han Sans',sans-serif;font-weight:400;font-size:1.5rem;margin:4px 0 4px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.ssub{color:var(--sub);font-size:.93rem;margin-bottom:18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:20px 22px;margin:14px 0;box-shadow:0 1px 3px rgba(40,35,20,.05)}
.card h3{font-size:1.05rem;margin-bottom:10px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.card h3 .chip{font-size:.7rem;font-weight:700;padding:2px 9px;border-radius:999px}
.chip.c-root{background:var(--root-bg);color:var(--root)}.chip.c-b{background:var(--b-bg);color:var(--b)}
.chip.c-c{background:var(--c-bg);color:var(--c)}.chip.c-d{background:var(--d-bg);color:var(--d)}.chip.c-e{background:var(--e-bg);color:var(--e)}
.card p{margin:6px 0}.card ul{margin:6px 0 6px 20px}.card li{margin:4px 0}
.card table{border-collapse:collapse;width:100%;margin:8px 0;font-size:.9rem}
.card th,.card td{border:1px solid var(--line);padding:5px 8px;text-align:center}
.card th{background:#F7F5EE;font-weight:700}.card td.lf{text-align:left}
.kw{font-weight:700}.kw.b{color:var(--b)}.kw.c{color:var(--c)}.kw.d{color:var(--d)}.kw.e{color:var(--e)}.kw.root{color:var(--root)}
.diff-box{margin-top:12px;border:2px solid var(--d);border-radius:12px;padding:12px 14px;background:#FDF1EC}
.diff-box .dh{font-weight:800;color:var(--d);margin-bottom:4px;display:flex;align-items:center;gap:6px}
.tip-box{margin-top:12px;border:1.5px dashed var(--ink);border-radius:10px;padding:11px 14px;background:#FFFDF4;font-size:.92rem}
.tip-box b{display:block;margin-bottom:2px}
.formula{background:var(--root-bg);border:1.5px solid var(--root);border-radius:10px;padding:10px 14px;margin:10px 0;font-weight:700;text-align:center;font-size:1.02rem;color:var(--root)}
.formula .pill{background:#fff;border:1px solid var(--root);border-radius:6px;padding:1px 8px;margin:0 2px;display:inline-block}
.use-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0}
.use-card{border:1.8px solid;border-radius:12px;padding:11px 13px}
.use-card .ut{font-weight:800;font-size:.92rem;margin-bottom:3px}
.use-card .us{font-size:.78rem;color:var(--sub);margin-bottom:5px}
.use-card.u1{border-color:var(--c);background:var(--c-bg)}
.use-card.u2{border-color:var(--b);background:var(--b-bg)}
.use-card.u3{border-color:var(--e);background:var(--e-bg)}
.use-card.u4{border-color:var(--d);background:var(--d-bg)}
@media(max-width:520px){.use-grid{grid-template-columns:1fr}}
.enline{display:flex;align-items:flex-start;gap:10px;flex-wrap:wrap}
.en{font-family:'Lora',serif;font-size:1.1rem;line-height:1.7}
.hl{padding:1px 3px;border-radius:3px;font-weight:600;background:linear-gradient(180deg,transparent 30%,var(--hl) 30%)}
.hl.b{box-shadow:inset 0 -2.5px 0 var(--b)}.hl.c{box-shadow:inset 0 -2.5px 0 var(--c)}.hl.d{box-shadow:inset 0 -2.5px 0 var(--d)}.hl.e{box-shadow:inset 0 -2.5px 0 var(--e)}.hl.root{box-shadow:inset 0 -2.5px 0 var(--root)}
.spk{flex:none;border:1.5px solid var(--line);background:#fff;border-radius:999px;width:34px;height:34px;cursor:pointer;font-size:.95rem;display:inline-flex;align-items:center;justify-content:center;transition:.2s}
.spk:hover{border-color:var(--ink)}.spk.playing{background:var(--hl);border-color:var(--ink);animation:pulse 1s infinite}
@keyframes pulse{50%{transform:scale(1.12)}}
.exc{border-left:4px solid var(--line);padding:12px 16px;margin:12px 0;background:#fff;border-radius:0 10px 10px 0;border-top:1px solid var(--line);border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
.exc.b{border-left-color:var(--b)}.exc.c{border-left-color:var(--c)}.exc.d{border-left-color:var(--d)}.exc.e{border-left-color:var(--e)}.exc.root{border-left-color:var(--root)}
.tgl{margin-top:8px;border:1.5px solid var(--line);background:#fff;border-radius:8px;padding:4px 12px;font-family:inherit;font-size:.8rem;font-weight:600;cursor:pointer;color:var(--sub)}
.tgl:hover{border-color:var(--ink);color:var(--ink)}.tgl[aria-expanded="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
.trans{display:none;margin-top:9px;font-size:.9rem;background:#F7F5EE;border-radius:8px;padding:9px 12px}
.trans.open{display:block}.trans .ko{font-weight:600}.trans .note{color:var(--sub);font-size:.85rem;margin-top:3px}
.tree{padding:6px 0 6px 4px}.tree ul{list-style:none;padding-left:26px;position:relative}.tree>ul{padding-left:0}
.tree ul ul::before{content:"";position:absolute;left:8px;top:-8px;bottom:14px;border-left:2px solid var(--line)}
.tree li{position:relative;padding:5px 0}.tree ul ul li::before{content:"";position:absolute;left:-18px;top:21px;width:16px;border-top:2px solid var(--line)}
.node{display:inline-flex;align-items:center;gap:7px;background:#fff;border:1.8px solid var(--line);border-radius:10px;padding:5px 12px;font-weight:600;font-size:.9rem;cursor:pointer;transition:.18s;font-family:inherit}
.node .e{font-family:'Lora',serif;font-weight:400;font-style:italic;color:var(--sub);font-size:.82rem}
.node:hover{transform:translateX(2px)}
.node.nd-root{border-color:var(--root);background:var(--root-bg)}.node.nd-b{border-color:var(--b);background:var(--b-bg)}
.node.nd-c{border-color:var(--c);background:var(--c-bg)}.node.nd-d{border-color:var(--d);background:var(--d-bg)}.node.nd-e{border-color:var(--e);background:var(--e-bg)}
.node.leaf{border-style:dashed;font-family:'Lora',serif;font-style:italic;font-weight:600}
.qz{background:var(--card);border:1.5px solid var(--ink);border-radius:var(--r);padding:20px 22px;margin:26px 0;box-shadow:4px 4px 0 rgba(35,39,47,.9)}
.qz-head{display:flex;align-items:center;gap:10px;margin-bottom:6px;flex-wrap:wrap}
.qz-head .badge{background:var(--ink);color:#fff;font-size:.72rem;font-weight:700;padding:3px 11px;border-radius:999px}
.q{margin:18px 0;padding-top:16px;border-top:1px dashed var(--line)}.q:first-of-type{border-top:none}
.qno{font-weight:700;font-size:.8rem;color:var(--sub);margin-bottom:4px}.qtext{font-weight:600;margin-bottom:10px}
.qsent{margin:8px 0 12px;padding:10px 14px;background:#F7F5EE;border-radius:10px}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{text-align:left;font-family:inherit;font-size:.92rem;background:#fff;border:1.5px solid var(--line);border-radius:10px;padding:9px 13px;cursor:pointer;transition:.15s;line-height:1.55}
.opt:hover:not(:disabled){border-color:var(--ink)}.opt.sel{border-color:var(--ink);background:#F2F0E8;box-shadow:inset 0 0 0 1px var(--ink)}
.opt.right{border-color:var(--ok);background:var(--c-bg);box-shadow:inset 0 0 0 1px var(--ok)}
.opt.wrong{border-color:var(--bad);background:#FBE5E1;box-shadow:inset 0 0 0 1px var(--bad);animation:shake .3s}
.opt:disabled{cursor:default}@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.fb{display:none;margin-top:9px;font-size:.87rem;border-radius:8px;padding:9px 12px}.fb.show{display:block}
.fb.good{background:var(--c-bg);border:1px solid var(--ok)}.fb.badf{background:#FBE5E1;border:1px solid var(--bad)}
.selrow{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:9px 0;padding:9px 12px;background:#fff;border:1.5px solid var(--line);border-radius:10px}
.selrow select{font-family:inherit;font-size:.88rem;padding:5px 8px;border-radius:8px;border:1.5px solid var(--line);background:#fff}
.selrow .mark{font-weight:700;min-width:22px;text-align:center}
.walkstep{margin:12px 0;padding:11px 13px;border:1.5px solid var(--line);border-radius:10px;background:#fff}
.walkstep .wp{font-weight:600;font-size:.9rem;margin-bottom:8px}.walkstep.lockedw{opacity:.45;pointer-events:none}
.btn{font-family:inherit;font-weight:700;font-size:.95rem;border:none;border-radius:12px;padding:12px 26px;cursor:pointer;transition:.2s}
.btn.primary{background:var(--ink);color:#fff;box-shadow:3px 3px 0 rgba(35,39,47,.35)}
.btn.primary:hover{transform:translate(-1px,-1px);box-shadow:4px 4px 0 rgba(35,39,47,.35)}
.btn.primary:disabled{opacity:.4;cursor:not-allowed;transform:none;box-shadow:none}
.btn.ghost{background:#fff;border:1.5px solid var(--ink);color:var(--ink)}
.navrow{display:flex;justify-content:space-between;align-items:center;margin:28px 0 10px;gap:10px}
.unlock-banner{display:none;align-items:center;gap:10px;margin-top:16px;background:var(--c-bg);border:1.5px solid var(--ok);border-radius:12px;padding:12px 16px;font-weight:600;animation:fadeUp .4s ease}
.unlock-banner.show{display:flex}
.score-wrap{text-align:center;padding:10px 0 4px}.score-big{font-family:'Black Han Sans',sans-serif;font-size:3.2rem;line-height:1.1}
.grade{font-weight:700;margin-top:2px}.branchbars{margin:18px 0 6px;text-align:left}.bb{margin:10px 0}
.bb .bl{display:flex;justify-content:space-between;font-size:.83rem;font-weight:700;margin-bottom:4px}
.bb .track{height:12px;background:#EFEBDF;border-radius:99px;overflow:hidden}.bb .fill{height:100%;border-radius:99px;width:0;transition:width .8s ease}
.dict{background:var(--e-bg);border:2px solid var(--e);border-radius:14px;padding:18px 20px;margin:20px 0}
.dict-h{display:flex;align-items:center;gap:8px;font-weight:800;color:var(--e);margin-bottom:4px}
.dict-h .pb{background:var(--e);color:#fff;font-size:.7rem;padding:2px 10px;border-radius:999px}
.dict-sub{font-size:.85rem;color:var(--sub);margin-bottom:10px}
.dict-item{background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:10px 0}
.dict-controls{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.dict-controls .pbtn{border:1.5px solid var(--e);background:#fff;color:var(--e);border-radius:9px;padding:7px 14px;font-family:inherit;font-weight:700;font-size:.85rem;cursor:pointer}
.dict-controls .pbtn:hover{background:var(--e);color:#fff}
.dict-controls .hint{font-size:.8rem;color:var(--sub)}
.dict-input{width:100%;font-family:'Lora',serif;font-size:1rem;padding:9px 12px;border:1.5px solid var(--line);border-radius:9px;background:#fff}
.dict-input:focus{outline:none;border-color:var(--e)}
.dict-check{margin-top:8px;border:none;background:var(--ink);color:#fff;border-radius:9px;padding:8px 18px;font-family:inherit;font-weight:700;font-size:.85rem;cursor:pointer}
.dict-result{display:none;margin-top:10px;font-size:.95rem;line-height:1.9}.dict-result.show{display:block}
.dict-result .tok{padding:1px 5px;border-radius:5px;margin:0 1px;font-family:'Lora',serif}
.dict-result .tok.ok{background:var(--c-bg);color:var(--ok)}.dict-result .tok.no{background:#FBE5E1;color:var(--bad);text-decoration:line-through}
.dict-result .ans{margin-top:6px;font-size:.88rem;color:var(--sub)}.dict-result .ans b{color:var(--ink);font-family:'Lora',serif}
.dict-score{font-weight:800;margin-top:6px}
.review-box{background:#FFF7E8;border:2px solid var(--b);border-radius:14px;padding:18px 20px;margin:20px 0}
.review-box .rh{display:flex;align-items:center;gap:8px;font-weight:800;color:#8a6608;margin-bottom:6px}
.review-box .rh .pb{background:var(--b);color:#fff;font-size:.7rem;padding:2px 10px;border-radius:999px}
.empty-review{background:var(--c-bg);border:2px solid var(--ok);border-radius:14px;padding:18px;text-align:center;font-weight:700;color:var(--ok)}
footer{text-align:center;color:var(--sub);font-size:.78rem;margin-top:46px}
@media(max-width:520px){.card,.qz{padding:16px 14px}.step .lb{font-size:.54rem}.en{font-size:1rem}}
</style>
</head>
<body>
<div class="wrap">
<header>
  <div class="eyebrow">PRESENT PERFECT · 차세대 · 기초 → 고1</div>
  <h1>현재완료 <span class="mark">완전 정복</span></h1>
  <p class="tagline">have/has + 과거분사. 4용법부터 과거와의 구별, 현재완료진행까지 — 고1 시험 범위 완전 대비.</p>
  <div class="feat"><span class="f">🔁 적응형 오답 복습</span><span class="f">✍️ 받아쓰기</span><span class="f">🔊 전체 듣기</span></div>
  <div class="levelbar">
    <span class="lv l1">🌱 초급</span><span class="lv l2">🌿 중급</span><span class="lv l3">🌳 중상급</span><span class="lv l4">🏔️ 고1 심화</span>
  </div>
</header>
<nav class="stepper"><div class="steps" id="steps"></div></nav>
<main id="main"></main>
<footer>현재완료 완전 정복 (차세대) · 적응형 복습 + 받아쓰기 + 듣기</footer>
</div>
<script>
/* ===== TREE ===== */
const TREE={k:'현재완료',e:'Present Perfect',c:'root',kids:[
  {k:'형태',e:'have/has + p.p.',c:'c',kids:[
    {leaf:'긍정: have done',say:'I have done it.'},
    {leaf:'부정: have not done',say:'I have not done it.'},
    {leaf:'의문: Have you done?',say:'Have you done it?'}
  ]},
  {k:'4용법',e:'Four Uses',c:'b',kids:[
    {leaf:'경험: ever/never',say:'I have never seen snow.'},
    {leaf:'완료: just/already/yet',say:'I have just finished.'},
    {leaf:'계속: for/since',say:'I have lived here for years.'},
    {leaf:'결과: gone/lost',say:'He has gone to Seoul.'}
  ]},
  {k:'vs 과거단순',e:'vs Simple Past',c:'d',kids:[
    {leaf:'특정 시점 → 과거',say:'I saw him yesterday.'},
    {leaf:'시점 없음 → 완료',say:'I have seen him before.'}
  ]},
  {k:'현재완료진행',e:'have been -ing',c:'e',kids:[
    {leaf:'동작의 계속·강조',say:'I have been studying for hours.'}
  ]}
]};

/* ===== STAGES ===== */
const STAGES=[

/* 0 큰 그림 */
{id:'map',icon:'🌉',lv:'l1',label:'큰 그림',pathArr:[['현재완료','root']],
 title:'1단계 · 현재완료란? 과거와 현재를 잇는 다리',titleLv:'l1',
 sub:'현재완료는 "과거에 일어난 일이 지금까지 이어지거나 영향을 미칠 때" 써요. 단순 과거(끝난 일)와 가장 큰 차이가 바로 이 "현재와의 연결"입니다.',
 cards:[
  {t:'h',chip:['개념','root'],title:'과거 ─────▶ 지금 (연결)',html:
   `<p>단순 과거는 과거에 <b>딱 끝난 일</b>이지만, 현재완료는 그 일이 <b>지금까지 연결</b>돼요.</p>
    <table>

 title:'최종 관문 · 현재완료 종합 시험 (10문항)',titleLv:'l4',

/* ===== EXAM ===== */
const CLS_LB=['경험','완료','계속','결과'];
const EXAM=[
{type:'mc',tags:['form'],q:'[초급] "She ___ already eaten lunch." 빈칸은?',
 opts:['have','has','had','is'],
 ans:1,ex:'3인칭 단수 → has + p.p. (has eaten).'},

{type:'mc',tags:['form'],q:'[초급] "Have you ever ___ a famous person?" (만나다) 빈칸은?',
 opts:['meet','met','meeting','meets'],
 ans:1,ex:'meet의 p.p.는 met. 경험 용법 의문문.'},

{type:'mc',tags:['uses'],q:'[중급] "I haven\'t finished my report ___ ." (아직) 빈칸은?',
 opts:['already','yet','just','ever'],
 ans:1,ex:'부정문에서 "아직" → yet (문장 끝).'},

{type:'mc',tags:['uses'],q:'[중급] "He has lived in Seoul ___ 2015." 빈칸은?',
 opts:['for','since','ago','during'],
 ans:1,ex:'시점 2015 → since (계속 용법).'},

{type:'mc',tags:['vspast'],q:'[중상급] "I ___ him at the party last night." 빈칸은?',
 opts:['have seen','saw','have met','has seen'],
 ans:1,ex:'last night(특정 과거 시점) → 과거단순 saw. 현재완료 불가!'},

{type:'mc',tags:['vspast'],q:'[중상급] "My sister has ___ to Canada, so she isn\'t home." 빈칸은?',
 opts:['been','gone','went','being'],
 ans:1,ex:'지금 없음(결과) → has gone to.'},

{type:'walk',tags:['adv'],sent:'I have been [[reading]] this book for two hours.',say:'I have been reading this book for two hours.',
 q:'[고1] 이 문장의 시제를 분석하시오.',
 steps:[
  {p:'STEP 1 · have been reading의 시제는?',opts:['현재완료','현재완료진행','과거진행'],ans:1},
  {p:'STEP 2 · 무엇을 강조하나?',opts:['이미 끝남','두 시간째 계속 읽는 중(진행)','미래에 읽을 것'],ans:1},
  {p:'STEP 3 · for two hours는 무엇을 나타내나?',opts:['시점','기간(얼마 동안)','횟수'],ans:1}],
 ex:'현재완료진행(have been + -ing): 과거부터 지금까지 계속 진행 중인 동작 강조. for + 기간.'},

{type:'mc',tags:['adv'],q:'[고1] "I have known her ___ we were children." 빈칸은?',
 opts:['for','since','ago','when'],
 ans:1,ex:'뒤에 과거절(we were children) → since.'},

{type:'mc',tags:['adv'],q:'[고1] 다음 중 어법상 틀린 문장은?',
 opts:['It has been raining since noon.','I have been knowing him for years.','She has been working hard.','They have been waiting.'],
 ans:1,ex:'know는 상태동사 → 진행형 불가. have known (○), have been knowing (✗).'},

{type:'classify',tags:['uses'],q:'[종합] 각 문장의 현재완료 용법을 고르시오.',
 items:[
  {en:'I have [[just]] finished my homework.',ans:1,why:'just → 완료 용법(막 ~했다)'},
  {en:'She has [[lived]] here for ten years.',ans:2,why:'for + 기간 → 계속 용법'},
  {en:'Have you [[ever]] been to Europe?',ans:0,why:'ever → 경험 용법(~해 본 적)'}]},
];

/* ===== DICTATION ===== */
const DICT=[
  {en:'I have never been abroad.',ko:'나는 해외에 가 본 적이 없다.'},
  {en:'She has just finished her homework.',ko:'그녀는 막 숙제를 끝냈다.'},
  {en:'We have lived here since 2015.',ko:'우리는 2015년부터 여기 살아왔다.'},
  {en:'He has gone to Busan.',ko:'그는 부산으로 가 버렸다.'},
  {en:'It has been raining all day.',ko:'하루 종일 비가 오고 있다.'}
];

/* ===== ENGINE ===== */
let cur=0,maxUnlocked=0;
const cpState=STAGES.map(()=>({done:false}));
const LVNAME={l1:'🌱 초급',l2:'🌿 중급',l3:'🌳 중상급',l4:'🏔️ 고1'};
const wrongLog=[];
let voice=null;
function pickVoice(){const vs=speechSynthesis.getVoices();voice=vs.find(v=>v.lang==='en-US'&&/female|samantha|aria|zira|jenny/i.test(v.name))||vs.find(v=>v.lang==='en-US')||vs.find(v=>v.lang.startsWith('en'))||null;}
if('speechSynthesis' in window){pickVoice();speechSynthesis.onvoiceschanged=pickVoice;}
function speak(text,btn){
  if(!('speechSynthesis' in window)){alert('Chrome 브라우저를 권장합니다.');return;}
  speechSynthesis.cancel();document.querySelectorAll('.playing').forEach(b=>b.classList.remove('playing'));
  const u=new SpeechSynthesisUtterance(text);u.lang='en-US';if(voice)u.voice=voice;u.rate=0.85;
  if(btn){btn.classList.add('playing');u.onend=u.onerror=()=>btn.classList.remove('playing');}
  speechSynthesis.speak(u);}
function spkBtn(text){return `<button class="spk" title="듣기" aria-label="영어 듣기" onclick="speak(this.dataset.say,this)" data-say="${text.replace(/"/g,'&quot;')}">🔊</button>`;}
function plain(s){return s.replace(/\[\[|\]\]|\{\{|\}\}/g,'').replace(/<[^>]+>/g,'');}
function renderEn(s,cls){return s.replace(/\[\[(.+?)\]\]/g,`<span class="hl ${cls||'root'}">$1</span>`);}
function tgl(btn){const t=btn.nextElementSibling;const open=t.classList.toggle('open');btn.setAttribute('aria-expanded',open);btn.textContent=open?'해석 닫기 ▲':'해석 + 풀이 보기 ▼';}
function renderSteps(){
  document.getElementById('steps').innerHTML=STAGES.map((s,i)=>{
    const lock=i>maxUnlocked,done=cpState[i].done;
    return `<button class="step ${i===cur?'cur':''} ${done?'done':''} ${lock?'locked':''}" onclick="go(${i})" ${lock?'aria-disabled="true"':''}>
      <span class="dot">${lock?'🔒':done?'✓':s.icon}</span><span class="lb">${s.label}</span></button>`;}).join('');}
function go(i){
  if(i>maxUnlocked){alert('🔒 이전 단계의 체크포인트를 통과하면 열립니다!');return;}
  window.speechSynthesis&&speechSynthesis.cancel();cur=i;renderSteps();
  document.querySelectorAll('.stage').forEach((s,k)=>s.classList.toggle('show',k===i));window.scrollTo({top:0});}
function treeHTML(node){
  if(node.leaf!==undefined){const say=node.say||node.leaf;
    return `<li><button class="node leaf" onclick="speak(this.dataset.say,this)" data-say="${say}">${node.leaf} 🔉</button></li>`;}
  const kids=node.kids&&node.kids.length?`<ul>${node.kids.map(treeHTML).join('')}</ul>`:'';
  return `<li><button class="node nd-${node.c}" onclick="speak(this.dataset.say,this)" data-say="${node.e.replace(/=.+$/,'').trim()}">${node.k} <span class="e">${node.e} 🔉</span></button>${kids}</li>`;}
function cardHTML(c){
  if(c.t==='tree')return `<div class="card"><h3><span class="chip c-root">전체 지도</span>로직 트리 — 노드를 누르면 예문을 읽어 줍니다</h3><div class="tree"><ul>${treeHTML(TREE)}</ul></div></div>`;
  if(c.t==='h')return `<div class="card"><h3><span class="chip c-${c.chip[1]}">${c.chip[0]}</span>${c.title}</h3>${c.html}</div>`;
  if(c.t==='ex'){const say=plain(c.en);return `<div class="exc ${c.cls}"><div class="enline"><span class="en">${renderEn(c.en,c.cls)}</span>${spkBtn(say)}</div><button class="tgl" aria-expanded="false" onclick="tgl(this)">해석 + 풀이 보기 ▼</button><div class="trans"><div class="ko">${c.ko}</div><div class="note">${c.note}</div></div></div>`;}
  return '';}
function cpHTML(i,qs){
  return `<div class="qz" id="cp${i}"><div class="qz-head"><span class="badge">CHECKPOINT</span><b>체크포인트 — 모두 맞히면 다음 단계가 열립니다</b></div>
  ${qs.map((q,k)=>`<div class="q"><div class="qno">Q${k+1} / ${qs.length}</div><div class="qtext">${q.q}</div>
    <div class="opts">${q.opts.map((o,oi)=>`<button class="opt" onclick="cpPick(${i},${k},${oi},this)">${String.fromCharCode(9312+oi)} ${o}</button>`).join('')}</div>
    <div class="fb" id="fb-${i}-${k}"></div></div>`).join('')}
  <div class="unlock-banner" id="ub${i}">🎉 통과! 다음 단계가 열렸습니다. <button class="btn primary" onclick="go(${i+1})">다음 단계로 →</button></div></div>`;}
const cpOK=STAGES.map(s=>s.cp?s.cp.map(()=>false):[]);
function logWrong(q){ if(!wrongLog.some(w=>w.q===q.q)) wrongLog.push({q:q.q,opts:q.opts,ans:q.ans,ex:q.ex}); }
function cpPick(si,qi,oi,btn){
  const q=STAGES[si].cp[qi],fb=document.getElementById(`fb-${si}-${qi}`);
  const opts=btn.parentElement.querySelectorAll('.opt');
  if(oi===q.ans){opts.forEach((o,k)=>{o.disabled=true;if(k===oi)o.classList.add('right');});
    fb.className='fb show good';fb.innerHTML='✅ 정답! '+q.ex;cpOK[si][qi]=true;
    if(cpOK[si].every(v=>v))unlockNext(si);
  }else{logWrong(q);btn.classList.add('wrong');fb.className='fb show badf';fb.innerHTML='🤔 다시! (이 문항은 마지막 <b>오답 복습</b>에 자동 저장됩니다)';setTimeout(()=>btn.classList.remove('wrong'),500);}}
function unlockNext(si){cpState[si].done=true;if(si+1>maxUnlocked)maxUnlocked=si+1;renderSteps();const ub=document.getElementById('ub'+si);if(ub)ub.classList.add('show');}
const exAns=EXAM.map(q=>q.type==='walk'?q.steps.map(()=>-1):q.type==='classify'?q.items.map(()=>-1):-1);
let graded=false;
function examHTML(){
  return `<div class="card" style="border:1.5px solid var(--ink)"><h3><span class="chip c-root">시험 안내</span>응시 전 확인</h3>
    <ul><li>문항 앞 [초급]~[고1]은 난이도입니다.</li>
    <li>채점 후, 틀린 문항만 모은 <b>🔁 오답 복습</b>과 <b>✍️ 받아쓰기</b>가 아래에 나타나요.</li></ul></div>
  ${EXAM.map((q,qi)=>{
    let body='';
    const sent=q.sent?`<div class="qsent"><div class="enline"><span class="en">${renderEn(q.sent,'root')}</span>${spkBtn(q.say||plain(q.sent))}</div></div>`:'';
    if(q.type==='mc'){body=`<div class="opts">${q.opts.map((o,oi)=>`<button class="opt" id="e-${qi}-${oi}" onclick="exPick(${qi},${oi})">${String.fromCharCode(9312+oi)} ${o}</button>`).join('')}</div>`;}
    else if(q.type==='walk'){body=q.steps.map((st,si)=>`<div class="walkstep ${si>0?'lockedw':''}" id="ws-${qi}-${si}"><div class="wp">${st.p}</div><div class="opts">${st.opts.map((o,oi)=>`<button class="opt" id="e-${qi}-${si}-${oi}" onclick="exWalk(${qi},${si},${oi})">${String.fromCharCode(9312+oi)} ${o}</button>`).join('')}</div></div>`).join('');}
    else{body=q.items.map((it,k)=>`<div class="selrow"><span class="mark" id="em-${qi}-${k}">·</span>
        <span class="en" style="flex:1;min-width:200px">${renderEn(it.en,'root')}</span>${spkBtn(plain(it.en))}
        <select id="es-${qi}-${k}" onchange="exAns[${qi}][${k}]=+this.value"><option value="-1">— 용법 선택 —</option>${CLS_LB.map((l,li)=>`<option value="${li}">${l}</option>`).join('')}</select>
        <div class="fb" id="ef-${qi}-${k}" style="flex-basis:100%"></div></div>`).join('');}
    return `<div class="qz" id="eq${qi}"><div class="qz-head"><span class="badge">${q.type==='walk'?'WALK · 단계 분석':q.type==='classify'?'SORT · 용법 분류':'CHOICE · 어법'}</span><b>문항 ${qi+1} / ${EXAM.length}</b></div>
      <div class="qtext">${q.q}</div>${sent}${body}<div class="fb" id="exfb${qi}"></div></div>`;}).join('')}
  <div style="text-align:center;margin:30px 0"><button class="btn primary" id="gradeBtn" onclick="grade()" style="font-size:1.05rem;padding:15px 40px">📝 최종 채점하기</button></div>
  <div id="result"></div><div id="reviewArea"></div><div id="dictArea"></div>`;}
function exPick(qi,oi){if(graded)return;exAns[qi]=oi;EXAM[qi].opts.forEach((_,k)=>document.getElementById(`e-${qi}-${k}`).classList.toggle('sel',k===oi));}
function exWalk(qi,si,oi){if(graded)return;exAns[qi][si]=oi;EXAM[qi].steps[si].opts.forEach((_,k)=>document.getElementById(`e-${qi}-${si}-${k}`).classList.toggle('sel',k===oi));const next=document.getElementById(`ws-${qi}-${si+1}`);if(next)next.classList.remove('lockedw');}
function grade(){
  for(let qi=0;qi<EXAM.length;qi++){const a=exAns[qi];const empty=Array.isArray(a)?a.some(v=>v<0):a<0;
    if(empty){document.getElementById('eq'+qi).scrollIntoView({block:'center'});const f=document.getElementById('exfb'+qi);f.className='fb show badf';f.textContent='⚠️ 답하지 않은 부분이 있어요.';return;}}
  graded=true;document.getElementById('gradeBtn').disabled=true;
  let score=0;
  EXAM.forEach((q,qi)=>{
    let ok;
    if(q.type==='mc'){ok=exAns[qi]===q.ans;q.opts.forEach((_,k)=>{const el=document.getElementById(`e-${qi}-${k}`);el.disabled=true;if(k===q.ans)el.classList.add('right');else if(k===exAns[qi])el.classList.add('wrong');});const f=document.getElementById('exfb'+qi);f.className='fb show '+(ok?'good':'badf');f.innerHTML=(ok?'✅ 정답! ':'❌ 오답. ')+q.ex; if(!ok)logWrong(q);}
    else if(q.type==='walk'){ok=q.steps.every((st,si)=>exAns[qi][si]===st.ans);q.steps.forEach((st,si)=>st.opts.forEach((_,k)=>{const el=document.getElementById(`e-${qi}-${si}-${k}`);el.disabled=true;if(k===st.ans)el.classList.add('right');else if(k===exAns[qi][si])el.classList.add('wrong');}));const f=document.getElementById('exfb'+qi);f.className='fb show '+(ok?'good':'badf');f.innerHTML=(ok?'✅ 완벽한 분석! ':'❌ 분석 오류. ')+q.ex; if(!ok)logWrong({q:q.q,opts:q.steps[0].opts,ans:q.steps[0].ans,ex:q.ex});}
    else{ok=q.items.every((it,k)=>exAns[qi][k]===it.ans);q.items.forEach((it,k)=>{const f=document.getElementById(`ef-${qi}-${k}`),m=document.getElementById(`em-${qi}-${k}`);document.getElementById(`es-${qi}-${k}`).disabled=true;const good=exAns[qi][k]===it.ans;m.textContent=good?'✅':'❌';f.className='fb show '+(good?'good':'badf');f.innerHTML=`<b>${CLS_LB[it.ans]}</b> — ${it.why}`;});const f=document.getElementById('exfb'+qi);f.className='fb show '+(ok?'good':'badf');f.innerHTML=ok?'✅ 용법을 완벽히 분류!':'❌ 위 해설을 확인하세요.'; if(!ok)logWrong({q:q.q,opts:CLS_LB,ans:q.items[0].ans,ex:'4용법(경험·완료·계속·결과)의 신호 단어를 다시 확인하세요.'});}
    if(ok)score++;});
  const gr=score>=9?['🥇 현재완료 마스터','고1 시험 완벽 대비!']:score>=7?['🥈 거의 완성','과거 비교와 현재완료진행을 한 번 더!']:score>=5?['🥉 성장 중','4용법과 vs 과거단순을 복습하세요.']:['🌱 다시 도전','1단계부터 차근차근!'];
  const bars=[['형태·p.p.','form','var(--c)'],['4용법','uses','var(--b)'],['vs 과거단순','vspast','var(--d)'],['고1 심화(진행)','adv','var(--e)']].map(([lb,t,col])=>{
    const rel=EXAM.map((q,qi)=>[q,qi]).filter(([q])=>q.tags.includes(t));
    const tot=rel.length;
    const ok2=rel.filter(([q,qi])=>q.type==='mc'?exAns[qi]===q.ans:q.type==='walk'?q.steps.every((st,si)=>exAns[qi][si]===st.ans):q.items.every((it,k)=>exAns[qi][k]===it.ans)).length;
    const p=tot?Math.round(ok2/tot*100):100;
    return `<div class="bb"><div class="bl"><span>${lb}</span><span>${ok2} / ${tot}</span></div><div class="track"><div class="fill" style="background:${col}" data-w="${p}%"></div></div></div>`;}).join('');
  document.getElementById('result').innerHTML=`<div class="qz"><div class="score-wrap"><div class="score-big">${score} / 10</div><div class="grade">${gr[0]}</div><p style="font-size:.9rem;margin-top:6px">${gr[1]}</p><div class="branchbars">${bars}</div><div style="margin-top:18px"><button class="btn ghost" onclick="resetExam()">처음부터 다시 풀기</button></div></div></div>`;
  renderReview(); renderDictation();
  document.getElementById('result').scrollIntoView({behavior:'smooth',block:'start'});
  requestAnimationFrame(()=>setTimeout(()=>document.querySelectorAll('.fill').forEach(f=>f.style.width=f.dataset.w),60));}

/* ===== 적응형 오답 복습 ===== */
let reviewQueue=[];
function renderReview(){
  const area=document.getElementById('reviewArea');
  if(wrongLog.length===0){area.innerHTML=`<div class="empty-review">🎉 틀린 문항이 없어요! 복습할 게 없습니다. 완벽해요.</div>`;return;}
  reviewQueue=wrongLog.map((w,i)=>i);
  area.innerHTML=`<div class="review-box"><div class="rh"><span class="pb">🔁 ADAPTIVE</span>오답 집중 복습 — 학습·시험에서 틀린 ${wrongLog.length}문항</div>
    <p style="font-size:.86rem;color:var(--sub);margin-bottom:8px">틀렸던 문제만 모았어요. 모두 맞히면 복습이 끝납니다. (틀리면 큐 뒤로 다시 들어가요.)</p>
    <div id="reviewSlot"></div></div>`;
  showReview();
}
function showReview(){
  const slot=document.getElementById('reviewSlot');
  if(reviewQueue.length===0){slot.innerHTML=`<div class="empty-review">✅ 오답 복습 완료! 약점을 모두 극복했어요. 👏</div>`;return;}
  const wi=reviewQueue[0];const w=wrongLog[wi];
  slot.innerHTML=`<div class="q" style="border:none"><div class="qno">남은 복습 ${reviewQueue.length}문항</div><div class="qtext">${w.q}</div>
    <div class="opts">${w.opts.map((o,oi)=>`<button class="opt" id="rv-${oi}" onclick="reviewPick(${oi})">${String.fromCharCode(9312+oi)} ${o}</button>`).join('')}</div>
    <div class="fb" id="rvfb"></div></div>`;
}
function reviewPick(oi){
  const wi=reviewQueue[0];const w=wrongLog[wi];const fb=document.getElementById('rvfb');
  const opts=document.querySelectorAll('#reviewSlot .opt');
  if(oi===w.ans){opts.forEach((o,k)=>{o.disabled=true;if(k===w.ans)o.classList.add('right');});
    fb.className='fb show good';fb.innerHTML='✅ 정답! '+w.ex+'<br><button class="btn primary" style="margin-top:10px;padding:8px 18px" onclick="reviewNext(true)">다음 →</button>';
  }else{opts[oi].classList.add('wrong');fb.className='fb show badf';fb.innerHTML='❌ 다시. 이 문제는 큐 뒤로 갑니다.<br><button class="btn ghost" style="margin-top:10px;padding:8px 18px" onclick="reviewNext(false)">계속 →</button>';}
}
function reviewNext(correct){const wi=reviewQueue.shift();if(!correct)reviewQueue.push(wi);showReview();}

/* ===== 받아쓰기 ===== */
function renderDictation(){
  const area=document.getElementById('dictArea');
  area.innerHTML=`<div class="dict"><div class="dict-h"><span class="pb">✍️ DICTATION</span>받아쓰기 — 듣고 그대로 입력하세요</div>
    <div class="dict-sub">🔊를 눌러 문장을 듣고, 빈칸에 영어로 정확히 타이핑한 뒤 [채점]을 누르세요. 단어별로 맞고 틀림을 보여줍니다.</div>
    ${DICT.map((d,i)=>`<div class="dict-item">
      <div class="dict-controls">
        <button class="pbtn" onclick="speak(this.dataset.say,null)" data-say="${d.en.replace(/"/g,'&quot;')}">🔊 듣기</button>
        <button class="pbtn" onclick="speakSlow(this.dataset.say)" data-say="${d.en.replace(/"/g,'&quot;')}">🐢 천천히</button>
        <span class="hint">힌트: ${d.ko}</span>
      </div>
      <input class="dict-input" id="di-${i}" type="text" placeholder="여기에 들은 문장을 입력..." autocomplete="off" spellcheck="false">
      <button class="dict-check" onclick="checkDict(${i})">채점하기</button>
      <div class="dict-result" id="dr-${i}"></div>
    </div>`).join('')}
  </div>`;
}
function speakSlow(text){if(!('speechSynthesis' in window))return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang='en-US';if(voice)u.voice=voice;u.rate=0.55;speechSynthesis.speak(u);}
function normWord(w){return w.toLowerCase().replace(/[.,!?;:'"]/g,'');}
function checkDict(i){
  const d=DICT[i];const input=document.getElementById('di-'+i).value.trim();
  const res=document.getElementById('dr-'+i);
  const ansWords=d.en.split(/\s+/);
  const inWords=input.split(/\s+/).filter(x=>x);
  let correct=0;
  const toks=ansWords.map((aw,k)=>{
    const iw=inWords[k]||'';
    const ok=normWord(iw)===normWord(aw);
    if(ok)correct++;
    return `<span class="tok ${ok?'ok':'no'}">${iw||'∅'}</span>`;
  }).join(' ');
  const pct=Math.round(correct/ansWords.length*100);
  res.className='dict-result show';
  res.innerHTML=`<div>${toks}</div>
    <div class="dict-score" style="color:${pct===100?'var(--ok)':pct>=60?'var(--b)':'var(--bad)'}">${pct===100?'🎉 완벽!':'정확도 '+pct+'%'} (${correct}/${ansWords.length} 단어)</div>
    <div class="ans">정답: <b>${d.en}</b></div>`;
}
function resetExam(){graded=false;wrongLog.length=0;EXAM.forEach((q,qi)=>{exAns[qi]=q.type==='walk'?q.steps.map(()=>-1):q.type==='classify'?q.items.map(()=>-1):-1;});renderAll();go(STAGES.length-1);}
function pathHTML(arr){return `<div class="path">${arr.map(([t,c],i)=>(i?'<span class="sep">▸</span>':'')+`<span class="crumb on-${c}">${t}</span>`).join('')}</div>`;}
function renderAll(){
  document.getElementById('main').innerHTML=STAGES.map((s,i)=>{
    let inner=s.exam?examHTML():(s.cards||[]).map(cardHTML).join('')+(s.cp?cpHTML(i,s.cp):'');
    const lvtag=s.titleLv?`<span class="lvchip ${s.titleLv}">${LVNAME[s.titleLv]}</span>`:'';
    return `<section class="stage ${i===cur?'show':''}" id="st${i}">${pathHTML(s.pathArr)}<h2 class="stitle">${s.title}${lvtag}</h2><p class="ssub">${s.sub}</p>${inner}<div class="navrow">${i>0?`<button class="btn ghost" onclick="go(${i-1})">← 이전 단계</button>`:'<span></span>'}<span style="font-size:.78rem;color:var(--sub)">${i+1} / ${STAGES.length}</span></div></section>`;}).join('');
  renderSteps();}
renderAll();
</script>
</body>
