<script>
/* ══ Web Audio 책 넘기는 소리 ══ */
const _ac=new(window.AudioContext||window.webkitAudioContext)();
function playPageTurn(){
  try{
    if(_ac.state==='suspended')_ac.resume();
    const now=_ac.currentTime;
    const make=(len,vol,delay,hp)=>{
      const buf=_ac.createBuffer(1,Math.floor(_ac.sampleRate*len),_ac.sampleRate);
      const d=buf.getChannelData(0);
      for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*(1-i/d.length);
      const src=_ac.createBufferSource();src.buffer=buf;
      const f=_ac.createBiquadFilter();f.type='highpass';f.frequency.value=hp;
      const g=_ac.createGain();
      g.gain.setValueAtTime(0,now+delay);
      g.gain.linearRampToValueAtTime(vol,now+delay+0.02);
      g.gain.exponentialRampToValueAtTime(0.001,now+delay+len);
      src.connect(f);f.connect(g);g.connect(_ac.destination);
      src.start(now+delay);src.stop(now+delay+len);
    };
    make(0.16,0.32,0,1800);make(0.07,0.14,0.09,3200);
  }catch(e){}
}

/* ══ TTS ══ */
let voice=null,ttsOk=false;
function loadVoices(){
  const vs=speechSynthesis.getVoices();
  const p=['Google US English','Samantha','Microsoft Aria','Microsoft Jenny','Karen','Alex'];
  for(const n of p){const v=vs.find(x=>x.name===n);if(v){voice=v;return;}}
  voice=vs.find(v=>v.lang==='en-US')||null;
}
if('speechSynthesis' in window){loadVoices();speechSynthesis.onvoiceschanged=loadVoices;}
function unlockTTS(){if(ttsOk||!('speechSynthesis' in window))return;const u=new SpeechSynthesisUtterance('');u.volume=0;speechSynthesis.speak(u);ttsOk=true;}
document.addEventListener('touchstart',unlockTTS,{once:true});
document.addEventListener('click',unlockTTS,{once:true});
function speak(t,b){
  if(!('speechSynthesis' in window))return;
  unlockTTS();speechSynthesis.cancel();
  document.querySelectorAll('.snd.playing').forEach(x=>x.classList.remove('playing'));
  const u=new SpeechSynthesisUtterance(t);
  if(voice)u.voice=voice;u.lang='en-US';u.rate=.9;
  if(b){b.classList.add('playing');u.onend=()=>b.classList.remove('playing');}
  speechSynthesis.speak(u);
}
function mkSnd(t){const b=document.createElement('button');b.className='snd';b.innerHTML='🔊';b.onclick=()=>speak(t,b);return b;}

/* ══ 타이머 ══ */
let timerSec=0,timerInt=null;
function startTimer(){if(timerInt)return;timerInt=setInterval(()=>{timerSec++;const m=String(Math.floor(timerSec/60)).padStart(2,'0'),s=String(timerSec%60).padStart(2,'0');document.getElementById('timerDisplay').textContent=m+':'+s;},1000);}
document.addEventListener('click',startTimer,{once:true});

/* ══ 유틸 ══ */
function mk(t,c){const b=document.createElement('button');b.className=c;b.type='button';b.textContent=t;return b;}
function norm(s){return(s||'').toLowerCase().replace(/[^a-z0-9 ]/gi,'').replace(/\s+/g,' ').trim();}
function ansBtn(el){const b=mk('정답 보기','mini-btn');b.onclick=()=>{const o=el.classList.toggle('open');b.textContent=o?'정답 숨기기':'정답 보기';};return b;}
function attachBar(wrap,items){
  const bar=document.createElement('div');bar.className='check-bar';
  const pill=document.createElement('span');pill.className='result-pill';pill.style.display='none';
  const gb=mk('전체 채점','cb cb-g');
  const rb=mk('❌ 틀린 것만 다시','cb cb-r');rb.disabled=true;
  const sb=mk('전체 보기','cb cb-s');sb.style.display='none';
  function refresh(){
    const ok=items.filter(x=>x._ok).length;
    pill.style.display='inline-block';
    pill.className='result-pill '+(ok===items.length?'pill-ok':'pill-bad');
    pill.textContent=ok+' / '+items.length+' 정답';
    rb.disabled=ok===items.length;
  }
  gb.onclick=()=>{items.forEach(it=>{if(!it.row.classList.contains('hide'))it._ok=it.grade();});refresh();};
  rb.onclick=()=>{items.forEach(it=>{it._ok?it.row.classList.add('hide'):(it.row.classList.remove('hide'),it.reset());});sb.style.display='inline-block';};
  sb.onclick=()=>{items.forEach(it=>it.row.classList.remove('hide'));pill.style.display='none';};
  bar.append(gb,rb,sb,pill);wrap.appendChild(bar);
}

function go(v){
  playPageTurn();view=v;
  for(let i=0;i<6;i++){
    const t=document.getElementById('t'+i);if(!t)return;
    t.classList.toggle('on',i===v);
    if(completed.has(i))t.classList.add('completed');else t.classList.remove('completed');
  }
  const app=document.getElementById('app');app.innerHTML='';
  setTimeout(()=>{
    app.classList.add('page-enter');
    const builders=[viewWord,viewPhrase,viewText,viewOX,viewParaMatch,viewExam];
    app.innerHTML=builders[v]();
    attachDynamic(v);
    setTimeout(()=>app.classList.remove('page-enter'),300);
  },80);
}
function attachDynamic(v){
  if(v===0)VOCAB.forEach(voc=>{const el=document.getElementById('vsnd_'+voc.en.replace(/\s/g,'_'));if(el){el.innerHTML='';el.appendChild(mkSnd(voc.en));}});

}

function makeDefQuiz(){
  return VOCAB.map((v,i)=>{
    const wrongs=VOCAB.filter((_,j)=>j!==i).sort(()=>Math.random()-.5).slice(0,3).map(x=>x.en);
    const opts=[v.en,...wrongs].sort(()=>Math.random()-.5);
    return{def:v.def,ans:v.en,kr:v.kr,opts};
  });
}

/* ══ 1단계: 단어 ══ */
function viewWord(){
  if(!defQuiz){defQuiz=makeDefQuiz();defQuiz.forEach(()=>defState.push({answered:false,correct:false}));}
  const doneN=defState.filter(s=>s.answered).length;
  const okN=defState.filter(s=>s.correct).length;
  if(doneN===VOCAB.length)completed.add(0);
  let h=`<div class="desc"><b>1단계 · 단어 학습</b><br>영영풀이를 읽고 해당 단어를 고르세요.</div>
  <div class="prog-wrap"><div class="prog-label"><span>완료 ${doneN}/${VOCAB.length}</span><span>${okN} 정답</span></div>
  <div class="prog-track"><div class="prog-fill" id="wordProg" style="width:${Math.round(doneN/VOCAB.length*100)}%"></div></div></div>
  <div class="glabel">🧠 영영풀이 퀴즈 (20문제)</div>`;
  defQuiz.forEach((q,i)=>{
    const st=defState[i];
    h+=`<div class="def-quiz-card" data-dq="${i}"><div class="dq-num">Q${i+1} / ${VOCAB.length}</div>
    <div class="dq-def">${q.def}</div><div class="dq-opts">`;
    q.opts.forEach(opt=>{
      let cls='dq-opt';if(st.answered){if(opt===q.ans)cls+=' dq-ok';else cls+=' dq-dim';}
      h+=`<div class="${cls}" onclick="answerDef(${i},'${opt.replace(/'/g,"\\'")}')">${opt}</div>`;
    });
    h+=`</div>`;
    if(st.answered)h+=`<div class="dq-fb show ${st.correct?'ok':'no'}">${st.correct?'✅ 정답! — '+q.kr:'❌ 정답: '+q.ans+' ('+q.kr+')'}</div>`;
    h+=`</div>`;
  });
  h+=`<div class="glabel">📖 전체 단어 카드 (20개)</div>`;
  VOCAB.forEach(voc=>{
    h+=`<div class="vcard"><div class="vhead"><span class="ven">${voc.en}</span><span class="vkr">${voc.kr}</span><span id="vsnd_${voc.en.replace(/\s/g,'_')}"></span></div>
    <div class="vrow"><span class="vlab syn">유의어</span>${voc.syn}</div>
    <div class="vrow"><span class="vlab ant">반의어</span>${voc.ant}</div>
    <div class="vdef">💬 ${voc.def}</div></div>`;
  });
  return h;
}
function answerDef(i,opt){
  if(defState[i].answered)return;
  const q=defQuiz[i];const ok=opt===q.ans;
  defState[i]={answered:true,correct:ok};
  const card=document.querySelector('[data-dq="'+i+'"]');if(!card)return;
  [...card.querySelectorAll('.dq-opt')].forEach(b=>{b.classList.remove('dq-ok','dq-no','dq-dim');if(b.textContent.trim()===q.ans)b.classList.add('dq-ok');else b.classList.add('dq-dim');b.onclick=null;});
  let fb=card.querySelector('.dq-fb');if(!fb){fb=document.createElement('div');card.appendChild(fb);}
  fb.className='dq-fb show '+(ok?'ok':'no');fb.textContent=ok?'✅ 정답! — '+q.kr:'❌ 정답: '+q.ans+' ('+q.kr+')';
  const doneN=defState.filter(s=>s.answered).length,okN=defState.filter(s=>s.correct).length;
  const prog=document.getElementById('wordProg');if(prog)prog.style.width=Math.round(doneN/VOCAB.length*100)+'%';
  const pl=document.querySelector('.prog-label');if(pl){pl.children[0].textContent='완료 '+doneN+'/'+VOCAB.length;pl.children[1].textContent=okN+' 정답';}
  if(doneN===VOCAB.length)completed.add(0);
}

/* ══ 2단계: 프레이즈 ══ */
function viewPhrase(){
  const done=phraseState.filter(s=>s.ok).length;
  if(done===PHRASE_FILL.length)completed.add(1);
  let h=`<div class="desc"><b>2단계 · 핵심 프레이즈</b><br>노란 빈칸을 탭해 확인하고, 직접 입력해서 채점도 해보세요.</div>
  <div class="prog-wrap"><div class="prog-label"><span id="pProg">완료 ${done}/${PHRASE_FILL.length}</span></div>
  <div class="prog-track"><div class="prog-fill" id="pProgBar" style="width:${Math.round(done/PHRASE_FILL.length*100)}%"></div></div></div>`;
  PHRASE_FILL.forEach((f,i)=>{
    const st=phraseState[i];
    const displayed=f.sent.replace(`[${f.b}]`,`<span class="blank-tap${st.shown?' show':''}" onclick="togglePhrase(${i})">${f.b}</span>`);
    h+=`<div class="qcard" data-phrase="${i}"><div class="qnum">표현 ${i+1} / ${PHRASE_FILL.length}</div>
    <div class="qkr">${f.kr}</div><div class="qsent">${displayed}</div>
    <input class="phrase-inp${st.graded?(st.ok?' ok':' no'):''}" data-pi="${i}" placeholder="직접 입력해서 채점" value="${st.inputVal}"
      oninput="phraseState[${i}].inputVal=this.value" onkeydown="if(event.key==='Enter')phraseGrade(${i})">
    <div class="phrase-fb${st.graded?(st.ok?' ok':' no'):''}">${st.graded?(st.ok?'✅ 정답!':'❌ 정답: '+f.b):'&nbsp;'}</div>
    <button class="b b1" style="padding:6px 14px;font-size:12px;margin-top:4px;" onclick="phraseGrade(${i})">채점</button></div>`;
  });
  return h;
}
function togglePhrase(i){phraseState[i].shown=!phraseState[i].shown;const card=document.querySelector('[data-phrase="'+i+'"]');if(!card)return;const span=card.querySelector('.blank-tap');if(span)span.classList.toggle('show',phraseState[i].shown);}
function phraseGrade(i){
  const f=PHRASE_FILL[i];const inp=document.querySelector('[data-pi="'+i+'"]');if(!inp)return;
  const ok=inp.value.trim().toLowerCase()===f.b.toLowerCase();
  phraseState[i].graded=true;phraseState[i].ok=ok;
  inp.className='phrase-inp '+(ok?'ok':'no');
  const fb=inp.nextElementSibling;if(fb){fb.className='phrase-fb '+(ok?'ok':'no');fb.textContent=ok?'✅ 정답!':'❌ 정답: '+f.b;}
  const done=phraseState.filter(s=>s.ok).length;
  const pp=document.getElementById('pProg');const pb=document.getElementById('pProgBar');
  if(pp)pp.textContent='완료 '+done+'/'+PHRASE_FILL.length;
  if(pb)pb.style.width=Math.round(done/PHRASE_FILL.length*100)+'%';
  if(done===PHRASE_FILL.length)completed.add(1);
}

/* ══ 3단계: 본문 영작 ══ */
function viewText(){
  const solved=engWriteState.filter(s=>s.solved).length;
  if(solved===ENG_WRITE.length)completed.add(2);
  let h=`<div class="desc"><b>3단계 · 본문 영작 (핵심 12문장)</b><br>한글을 보고 영어 문장을 써보세요. 막히면 힌트를 활용하세요.</div>
  <div class="prog-wrap"><div class="prog-label"><span id="tProg">완료 ${solved}/${ENG_WRITE.length}</span></div>
  <div class="prog-track"><div class="prog-fill" id="tProgBar" style="width:${Math.round(solved/ENG_WRITE.length*100)}%"></div></div></div>`;
  ENG_WRITE.forEach((d,i)=>{
    const st=engWriteState[i];
    h+=`<div class="eng-item" data-ew="${i}">
    <div class="eng-num">문장 ${d.n}</div><div class="eng-kr">${d.kr}</div>
    <div class="hint-row" id="hint_${i}" style="${st.hintShown?'display:flex;':'display:none;'}">
      ${d.hints.map(h=>`<span class="hint-chip">${h}</span>`).join('')}
    </div>
    <textarea class="eng-ta" data-ew-ta="${i}" rows="2" placeholder="영어로 써보세요..."
      onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();gradeEngWrite(${i});}"
    >${st.inputVal}</textarea>
    <div class="eng-fb${st.solved?' ok':''}" id="ewfb_${i}" style="${st.solved||st.attempts>0?'display:block;':'display:none;'}">
      ${st.solved?'✅ 정답!':st.attempts===1?'❌ 힌트를 보고 다시 도전!':st.attempts>=2?'❌ 정답을 확인하세요.':''}
    </div>
    <div class="ans-reveal${st.attempts>=2||st.solved?' open':''}" id="ewans_${i}">정답: ${d.ans}</div>
    <div style="display:flex;gap:6px;margin-top:8px;flex-wrap:wrap;">
      <button class="b b1" style="padding:6px 14px;font-size:12px;" onclick="gradeEngWrite(${i})">채점</button>
      <button class="b b2" style="padding:6px 14px;font-size:12px;" id="hintBtn_${i}" ${st.hintShown?'style="display:none;"':''} onclick="showHint(${i})">힌트 보기</button>
      <span id="ewsnd_${i}"></span>
    </div></div>`;
  });
  return h;
}
function gradeEngWrite(i){
  const d=ENG_WRITE[i];const st=engWriteState[i];
  const ta=document.querySelector('[data-ew-ta="'+i+'"]');if(!ta)return;
  st.inputVal=ta.value;
  const val=ta.value.trim().toLowerCase().replace(/[^a-z0-9 ]/gi,'');
  const ans=d.ans.toLowerCase().replace(/[^a-z0-9 ]/gi,'');
  const ok=val===ans;st.attempts++;
  if(ok)st.solved=true;
  else if(st.attempts===1)showHint(i);
  else{const ansEl=document.getElementById('ewans_'+i);if(ansEl)ansEl.classList.add('open');}
  const fb=document.getElementById('ewfb_'+i);
  if(fb){fb.style.display='block';if(ok){fb.className='eng-fb ok';fb.textContent='✅ 정답!';}else if(st.attempts===1){fb.className='eng-fb no';fb.textContent='❌ 힌트를 보고 다시 도전!';}else{fb.className='eng-fb no';fb.textContent='❌ 정답을 확인하고 다시 써보세요.';}}
  const solvedN=engWriteState.filter(s=>s.solved).length;
  const tp=document.getElementById('tProg');const tb=document.getElementById('tProgBar');
  if(tp)tp.textContent='완료 '+solvedN+'/'+ENG_WRITE.length;
  if(tb)tb.style.width=Math.round(solvedN/ENG_WRITE.length*100)+'%';
  if(solvedN===ENG_WRITE.length)completed.add(2);
}
function showHint(i){engWriteState[i].hintShown=true;const hr=document.getElementById('hint_'+i);const hb=document.getElementById('hintBtn_'+i);if(hr)hr.style.display='flex';if(hb)hb.style.display='none';}

/* ══ 4단계: OX ══ */
function viewOX(){
  const done=oxAns.filter(v=>v!==null).length;
  const ok=OX.filter((o,i)=>oxAns[i]===o.a).length;
  if(done===OX.length)completed.add(3);
  let h=`<div class="desc"><b>4단계 · 내용 일치 O/X</b><br>영어 문장을 읽고 True/False를 선택하세요.</div>
  <div class="prog-wrap"><div class="prog-label"><span id="oxProg">완료 ${done}/${OX.length}</span><span id="oxOk">${ok} 정답</span></div>
  <div class="prog-track"><div class="prog-fill" id="oxBar" style="width:${Math.round(done/OX.length*100)}%"></div></div></div>`;
  OX.forEach((o,i)=>{
    const picked=oxAns[i];const graded=picked!==null;
    h+=`<div class="ox-q" data-ox="${i}"><div class="qnum">문제 ${i+1} / ${OX.length}</div>
    <div class="ox-en">${o.q}</div>
    <button class="ox-kr-btn" data-oxkr="${i}" onclick="toggleOxKr(${i})">${oxKrShown[i]?'해석 숨기기':'해석 보기 👀'}</button>
    <div class="ox-kr${oxKrShown[i]?' show':''}" id="oxkr_${i}">${o.kr}</div>
    <div class="ox-row">
      <button class="ox-btn${picked===true?(o.a?' pickT':' pickF'):''}" onclick="pickOX(${i},true)">⭕ True</button>
      <button class="ox-btn${picked===false?(!o.a?' pickT':' pickF'):''}" onclick="pickOX(${i},false)">❌ False</button>
    </div>`;
    if(graded){const correct=picked===o.a;h+=`<div class="ox-fb ${correct?'ok':'no'}">${correct?'✅ Correct!':'❌ Wrong'}${o.exp?' — '+o.exp:' (Answer: '+(o.a?'True':'False')+')'}</div>`;}
    h+=`</div>`;
  });
  if(done===OX.length){h+=`<div class="complete-banner"><div style="font-size:28px;margin-bottom:5px;">🎉</div><div style="font-size:16px;font-weight:900;">${ok}/${OX.length} 정답</div><div style="font-size:12px;opacity:.85;margin-top:3px;">${ok>=16?'훌륭해요! 단락 매칭으로 가세요 👏':'본문을 한번 더 읽어보세요'}</div></div>`;}
  return h;
}
function toggleOxKr(i){oxKrShown[i]=!oxKrShown[i];const kr=document.getElementById('oxkr_'+i);const btn=document.querySelector('[data-oxkr="'+i+'"]');if(kr)kr.classList.toggle('show',oxKrShown[i]);if(btn)btn.textContent=oxKrShown[i]?'해석 숨기기':'해석 보기 👀';}
function pickOX(i,v){
  oxAns[i]=v;const o=OX[i];const correct=v===o.a;
  const card=document.querySelector('[data-ox="'+i+'"]');if(!card)return;
  const btns=card.querySelectorAll('.ox-btn');
  btns[0].className='ox-btn'+(v===true?(o.a?' pickT':' pickF'):'');
  btns[1].className='ox-btn'+(v===false?(!o.a?' pickT':' pickF'):'');
  let fb=card.querySelector('.ox-fb');if(!fb){fb=document.createElement('div');card.appendChild(fb);}
  fb.className='ox-fb '+(correct?'ok':'no');
  fb.textContent=(correct?'✅ Correct!':'❌ Wrong')+(o.exp?' — '+o.exp:' (Answer: '+(o.a?'True':'False')+')');
  const done=oxAns.filter(v=>v!==null).length;const okN=OX.filter((o,i)=>oxAns[i]===o.a).length;
  const op=document.getElementById('oxProg');const oo=document.getElementById('oxOk');const ob=document.getElementById('oxBar');
  if(op)op.textContent='완료 '+done+'/'+OX.length;if(oo)oo.textContent=okN+' 정답';if(ob)ob.style.width=Math.round(done/OX.length*100)+'%';
  if(done===OX.length){completed.add(3);let banner=document.getElementById('oxBanner');if(!banner){banner=document.createElement('div');banner.id='oxBanner';document.getElementById('app').appendChild(banner);}banner.className='complete-banner';banner.innerHTML=`<div style="font-size:28px;margin-bottom:5px;">🎉</div><div style="font-size:16px;font-weight:900;">${okN}/${OX.length} 정답</div><div style="font-size:12px;opacity:.85;margin-top:3px;">${okN>=16?'훌륭해요!':'본문을 한번 더 읽어보세요'}</div>`;}
}

/* ══ 5단계: 단락 매칭 ══ */
function viewParaMatch(){
  if(!_shuffledContents)_shuffledContents=[...PARA_CONTENTS].sort(()=>Math.random()-.5);
  const allMatched=pmMatched.length===PARA_CARDS.length;
  if(allMatched)completed.add(4);
  let h=`<div class="desc"><b>5단계 · 단락 매칭</b><br>번호가 붙은 그림카드를 탭 → 알맞은 내용카드를 탭해서 짝을 맞추세요.</div>`;
  if(allMatched)h+=`<div class="complete-banner"><div style="font-size:28px;margin-bottom:5px;">🎉</div><div style="font-size:16px;font-weight:900;">5쌍 모두 완성!</div></div>`;
  h+=`<div class="pm-section-label">🖼 그림 카드</div><div class="para-match-grid">`;
  PARA_CARDS.forEach(c=>{
    const matched=pmMatched.includes(c.id);const sel=pmSelPic===c.id;
    h+=`<div class="pm-card${matched?' matched':sel?' sel':''}" data-pic="${c.id}" onclick="selectPic(${c.id})">${c.svg}<div class="pc-label">${c.label}</div></div>`;
  });
  h+=`</div><div class="pm-section-label">📝 내용 카드</div><div class="para-match-grid">`;
  _shuffledContents.forEach(c=>{
    const matched=pmMatched.includes(c.id);const sel=pmSelTxt===c.id;
    h+=`<div class="pm-content-card${matched?' matched':sel?' sel':''}" data-txt="${c.id}" onclick="selectTxt(${c.id})">
    <div class="cc-title">${matched?c.title:'단락 ?'}</div><div class="cc-body">${c.body}</div></div>`;
  });
  h+=`</div>`;
  // 순서 쓰기
  h+=`<div class="order-write-wrap">
  <div style="font-size:12px;font-weight:700;color:var(--text);margin-bottom:4px;">📋 단락 순서 직접 쓰기</div>
  <div style="font-size:11px;color:var(--muted);margin-bottom:10px;">번호 순서대로 각 단락의 핵심 내용을 직접 써보세요.</div>`;
  for(let i=0;i<5;i++){
    const graded=paraOrderGraded[i];
    const ok=graded&&paraOrderInputs[i].replace(/\s/g,'').toLowerCase()===ORDER_ANSS[i].replace(/\s/g,'').toLowerCase();
    h+=`<div class="order-row" style="background:${graded?(ok?'var(--ok-bg)':'var(--no-bg)'):'var(--card2)'};border-color:${graded?(ok?'var(--ok)':'var(--no)'):'var(--border)'};">
    <span class="order-num">${i+1}</span>
    <input class="order-inp" placeholder="이 단락의 핵심은?" value="${paraOrderInputs[i]}" data-oi="${i}"
      oninput="paraOrderInputs[${i}]=this.value" onkeydown="if(event.key==='Enter')gradeOrderAll()">
    <span class="order-fb">${graded?(ok?'✅':'❌ '+ORDER_ANSS[i]):'&nbsp;'}</span>
    </div>`;
  }
  h+=`<div style="display:flex;gap:7px;margin-top:10px;flex-wrap:wrap;">
  <button class="b b1" style="padding:7px 16px;font-size:12px;" onclick="gradeOrderAll()">전체 채점</button>
  <button class="b b2" style="padding:7px 16px;font-size:12px;" onclick="resetOrderWrite()">다시 쓰기</button>
  <button class="b b2" style="padding:7px 16px;font-size:12px;" onclick="resetParaMatch()">매칭 처음부터</button>
  </div></div>`;
  if(pmMatched.length>0&&!allMatched)h+=`<div style="text-align:center;font-size:13px;color:var(--ok);font-weight:700;margin-top:6px;">${pmMatched.length}/5 완성 · 계속하세요!</div>`;
  return h;
}
function selectPic(id){if(pmMatched.includes(id))return;pmSelPic=id;document.querySelectorAll('[data-pic]').forEach(el=>el.classList.toggle('sel',parseInt(el.dataset.pic)===id&&!pmMatched.includes(id)));if(pmSelTxt!==null)tryMatch();}
function selectTxt(id){if(pmMatched.includes(id))return;pmSelTxt=id;document.querySelectorAll('[data-txt]').forEach(el=>el.classList.toggle('sel',parseInt(el.dataset.txt)===id&&!pmMatched.includes(id)));if(pmSelPic!==null)tryMatch();}
function tryMatch(){
  const ok=pmSelPic===pmSelTxt;
  if(ok){
    pmMatched.push(pmSelPic);
    const picCard=document.querySelector('[data-pic="'+pmSelPic+'"]');
    const txtCard=document.querySelector('[data-txt="'+pmSelTxt+'"]');
    const tData=PARA_CONTENTS.find(c=>c.id===pmSelTxt);
    if(picCard){picCard.classList.remove('sel');picCard.classList.add('matched');}
    if(txtCard){txtCard.classList.remove('sel');txtCard.classList.add('matched');const ct=txtCard.querySelector('.cc-title');if(ct)ct.textContent=tData?.title||'';}
    pmSelPic=null;pmSelTxt=null;
    if(pmMatched.length===PARA_CARDS.length){completed.add(4);setTimeout(()=>{const app=document.getElementById('app');const banner=document.createElement('div');banner.className='complete-banner';banner.innerHTML='<div style="font-size:28px;margin-bottom:5px;">🎉</div><div style="font-size:16px;font-weight:900;">5쌍 모두 완성!</div>';app.insertBefore(banner,app.firstChild);},200);}
  } else {
    const picCard=document.querySelector('[data-pic="'+pmSelPic+'"]');
    const txtCard=document.querySelector('[data-txt="'+pmSelTxt+'"]');
    if(picCard)picCard.classList.add('wrong-flash');if(txtCard)txtCard.classList.add('wrong-flash');
    setTimeout(()=>{if(picCard){picCard.classList.remove('wrong-flash','sel');}if(txtCard){txtCard.classList.remove('wrong-flash','sel');}},600);
    pmSelPic=null;pmSelTxt=null;
  }
}
function gradeOrderAll(){
  document.querySelectorAll('[data-oi]').forEach(inp=>{
    const i=parseInt(inp.dataset.oi);paraOrderInputs[i]=inp.value;paraOrderGraded[i]=true;
    const ok=inp.value.replace(/\s/g,'').toLowerCase()===ORDER_ANSS[i].replace(/\s/g,'').toLowerCase();
    const row=inp.closest('.order-row');
    if(row){row.style.background=ok?'var(--ok-bg)':'var(--no-bg)';row.style.borderColor=ok?'var(--ok)':'var(--no)';const fb=row.querySelector('.order-fb');if(fb)fb.textContent=ok?'✅':'❌ '+ORDER_ANSS[i];}
  });
}
function resetOrderWrite(){
  for(let i=0;i<5;i++){paraOrderInputs[i]='';paraOrderGraded[i]=false;}
  document.querySelectorAll('[data-oi]').forEach(inp=>{inp.value='';const row=inp.closest('.order-row');if(row){row.style.background='var(--card2)';row.style.borderColor='var(--border)';const fb=row.querySelector('.order-fb');if(fb)fb.innerHTML='&nbsp;';}});
}
function resetParaMatch(){pmSelPic=null;pmSelTxt=null;pmMatched=[];_shuffledContents=null;go(4);}

/* ══ 6단계: 종합시험 ══ */
function viewExam(){
  let totalBlanks=0;EXAM_SECTIONS.forEach(sec=>sec.sents.forEach(s=>{if(s.b)totalBlanks++;}));
  let h=`<div class="desc"><b>종합시험 · 본문 빈칸 채우기</b><br>핵심 문구가 빠진 자리를 채우세요. 총 ${totalBlanks}개 빈칸.</div><div class="exam-passage">`;
  EXAM_SECTIONS.forEach((sec,si)=>{
    h+=`<div class="ep-section"><div class="ep-title">${sec.title}</div>`;
    sec.sents.forEach((s,ii)=>{
      if(!s.b)h+=`<div class="ep-sent">${s.t}</div>`;
      else{const disp=s.t.replace(`[${s.b}]`,`<input class="ep-inp" data-sec="${si}" data-sent="${ii}" placeholder="${'_'.repeat(Math.min(s.b.length,10))}" autocomplete="off" spellcheck="false">`);h+=`<div class="ep-sent">${disp}</div>`;}
    });
    h+=`</div>`;
  });
  h+=`</div><div style="display:flex;gap:9px;flex-wrap:wrap;margin-top:14px;">
  <button class="b b1" onclick="gradeExam()">전체 채점</button>
  <button class="b b2" onclick="resetExam()">다시 쓰기</button>
  </div><div id="examResult"></div>`;
  return h;
}
function gradeExam(){
  let total=0,ok=0;
  EXAM_SECTIONS.forEach((sec,si)=>{sec.sents.forEach((s,ii)=>{if(!s.b)return;total++;const inp=document.querySelector(`[data-sec="${si}"][data-sent="${ii}"]`);if(!inp)return;const val=inp.value.trim().toLowerCase().replace(/[^a-z0-9 ]/gi,'');const correct=s.b.toLowerCase().replace(/[^a-z0-9 ]/gi,'');const isOk=val===correct;if(isOk)ok++;inp.classList.remove('ok','no');inp.classList.add(isOk?'ok':'no');if(!isOk)inp.title='정답: '+s.b;});});
  const pct=Math.round(ok/total*100);const res=document.getElementById('examResult');
  if(res){res.className='exam-result-bar '+(pct>=70?'ok':'bad');res.innerHTML=`<div class="er-score">${ok} / ${total}</div><div style="font-size:13px;margin-top:4px;">${pct}점 · ${pct>=90?'완벽해요! 🎉':pct>=70?'잘했어요! 👍':'틀린 칸에 마우스를 올리면 정답이 보여요 💪'}</div>`;}
  if(pct>=60)completed.add(5);
}
function resetExam(){go(5);}

/* 초기화 */
go(0);
</script>
