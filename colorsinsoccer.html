<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Lesson 3 · Colors in Soccer — 심화 학습 & 시험</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap');
:root{--bg:#0f1729;--card:#1a2438;--card2:#222e47;--line:#33415c;--text:#e8eef7;--muted:#8a9bb8;
--green:#22c55e;--green-bg:#16331f;--red:#ef4444;--red-bg:#3a1a1c;--blue:#3b82f6;--blue-bg:#16294d;
--amber:#f59e0b;--accent:#06b6d4;--purple:#a78bfa;}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
body{background:var(--bg);font-family:'Noto Sans KR',sans-serif;color:var(--text);min-height:100vh;padding-bottom:60px;}
.top{background:linear-gradient(135deg,#0b3d2e,#0e7c5a);padding:18px 18px 14px;position:sticky;top:0;z-index:20;}
.top h1{font-size:18px;font-weight:900;}
.top p{font-size:12px;color:#bdf0dd;margin-top:3px;}
.nav{display:flex;gap:6px;margin-top:12px;}
.nav button{flex:1;background:rgba(255,255,255,.12);border:none;color:#cfe9df;font-family:inherit;
font-size:12px;font-weight:700;padding:9px 4px;border-radius:9px;cursor:pointer;transition:.2s;}
.nav button.on{background:#fff;color:#0e7c5a;}
.wrap{max-width:760px;margin:0 auto;padding:16px;}
.desc{background:var(--card);border-left:3px solid var(--accent);border-radius:0 9px 9px 0;
padding:11px 14px;font-size:13px;color:var(--muted);line-height:1.6;margin-bottom:16px;}
.desc b{color:var(--text);}
.bar{height:7px;background:var(--card);border-radius:4px;overflow:hidden;margin-bottom:16px;}
.bar>div{height:100%;background:linear-gradient(90deg,var(--accent),var(--green));width:0;transition:.4s;}
.glabel{font-size:11px;font-weight:700;color:var(--accent);letter-spacing:.5px;margin:18px 0 10px;
text-transform:uppercase;border-bottom:1px solid var(--line);padding-bottom:6px;}
/* ===== 단어 매치 ===== */
.match-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.mcol{display:flex;flex-direction:column;gap:8px;}
.chip{background:var(--card);border:1.5px solid var(--line);border-radius:10px;padding:12px 10px;
font-size:14px;font-weight:700;text-align:center;cursor:pointer;transition:.15s;}
.chip.sel{border-color:var(--accent);background:var(--blue-bg);}
.chip.done{border-color:var(--green);background:var(--green-bg);color:var(--green);opacity:.65;pointer-events:none;}
.chip.kr{font-weight:500;}
.match-msg{text-align:center;font-size:13px;color:var(--muted);margin-top:14px;min-height:20px;}
/* ===== 단어 카드(유의어/반의어) ===== */
.vcard{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:10px;}
.vhead{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;}
.ven{font-size:17px;font-weight:900;}
.vkr{font-size:14px;color:var(--accent);font-weight:700;}
.vrow{font-size:12.5px;margin-top:8px;line-height:1.6;}
.vrow .lab{display:inline-block;width:54px;font-weight:700;}
.syn .lab{color:var(--green);} .ant .lab{color:var(--red);}
.def{font-size:12px;color:var(--muted);margin-top:7px;font-style:italic;line-height:1.5;}
/* ===== 빈칸/해석 카드 ===== */
.qcard{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:12px;}
.qnum{font-size:11px;color:var(--muted);margin-bottom:7px;}
.qkr{font-size:14px;color:var(--muted);background:var(--card2);padding:8px 11px;border-radius:8px;margin-bottom:10px;line-height:1.5;}
.qsent{font-size:15px;line-height:1.9;font-weight:500;}
.blank{display:inline-block;background:#3a2f12;border-bottom:2px solid var(--amber);min-width:60px;
padding:0 6px;border-radius:5px 5px 0 0;color:transparent;cursor:pointer;transition:.2s;font-weight:700;}
.blank.show{color:var(--amber);}
.inp{width:100%;padding:10px 12px;border:1.5px solid var(--line);border-radius:8px;background:var(--card2);
color:var(--text);font-size:14px;font-family:inherit;margin:10px 0 8px;}
.inp:focus{outline:none;border-color:var(--accent);}
.inp.ok{border-color:var(--green);background:var(--green-bg);}
.inp.no{border-color:var(--red);background:var(--red-bg);}
.fb{font-size:13px;min-height:18px;}
.fb.ok{color:var(--green);} .fb.no{color:var(--red);}
.ansbox{font-size:13px;color:var(--accent);background:var(--blue-bg);padding:8px 11px;border-radius:8px;margin-top:6px;display:none;}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px;}
.b{padding:8px 18px;border:none;border-radius:20px;font-family:inherit;font-size:13px;font-weight:700;cursor:pointer;}
.b1{background:var(--accent);color:#04222a;} .b2{background:var(--card2);color:var(--muted);border:1px solid var(--line);}
.b3{background:var(--green);color:#04220f;}
.nav2{display:flex;justify-content:space-between;align-items:center;margin-top:14px;}
.nav2 .b{background:var(--card);color:var(--text);border:1px solid var(--line);}
.nav2 .b:disabled{opacity:.3;}
.cnt{font-size:13px;color:var(--muted);}
/* ===== 시험 ===== */
.gate{text-align:center;padding:40px 16px;}
.gate h2{font-size:20px;font-weight:900;margin-bottom:8px;}
.gate p{font-size:13px;color:var(--muted);margin-bottom:20px;}
.gate input{width:100%;max-width:280px;padding:12px;border-radius:10px;border:1.5px solid var(--line);
background:var(--card2);color:var(--text);font-size:15px;font-family:inherit;text-align:center;margin-bottom:14px;}
.exq{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:12px;}
.exq .qtxt{font-size:14.5px;font-weight:500;line-height:1.6;margin-bottom:12px;}
.exq .qtxt b{color:var(--amber);}
.opts{display:flex;flex-direction:column;gap:7px;}
.opt{padding:10px 13px;border:1.5px solid var(--line);border-radius:9px;background:var(--card2);
font-size:14px;cursor:pointer;transition:.12s;}
.opt.pick{border-color:var(--accent);background:var(--blue-bg);}
.exinp{width:100%;padding:10px 12px;border:1.5px solid var(--line);border-radius:8px;background:var(--card2);color:var(--text);font-size:14px;font-family:inherit;}
.result{text-align:center;padding:30px 16px;}
.score{font-size:56px;font-weight:900;background:linear-gradient(90deg,var(--accent),var(--green));-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
.rmsg{font-size:15px;color:var(--muted);margin:6px 0 22px;}
.review{text-align:left;margin-top:20px;}
.rev{background:var(--card);border-radius:9px;padding:11px 13px;margin-bottom:8px;font-size:13px;line-height:1.6;border-left:3px solid var(--line);}
.rev.ok{border-left-color:var(--green);} .rev.no{border-left-color:var(--red);}
.rev .ic{font-weight:900;} .rev.ok .ic{color:var(--green);} .rev.no .ic{color:var(--red);}
.rev .corr{color:var(--accent);}
.board{margin-top:24px;}
.board table{width:100%;border-collapse:collapse;font-size:13px;}
.board th,.board td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;}
.board th{color:var(--muted);font-weight:700;font-size:11px;}
.board tr.me td{background:var(--blue-bg);}
.rank{font-weight:900;color:var(--amber);}
</style>
</head>
<body>
<div class="top">
  <h1>⚽ Colors in Soccer · Lesson 3</h1>
  <p>심화 학습 3단계 + 종합시험 자동채점</p>
  <div class="nav">
    <button id="n1" class="on" onclick="go('w')">📝 단어</button>
    <button id="n2" onclick="go('b')">✏️ 빈칸</button>
    <button id="n3" onclick="go('t')">🔁 해석</button>
    <button id="n4" onclick="go('e')">🏆 시험</button>
  </div>
</div>
<div class="wrap" id="app"></div>

<script>
/* ================= DATA ================= */
const VOCAB = [
  {en:"popular",kr:"인기 있는",syn:"well-liked, favorite",ant:"unpopular",def:"liked or enjoyed by many people"},
  {en:"simple",kr:"단순한",syn:"easy, plain",ant:"complex, complicated",def:"not complicated; easy to understand"},
  {en:"common",kr:"흔한",syn:"usual, ordinary",ant:"rare, uncommon",def:"happening often or existing in large numbers"},
  {en:"various",kr:"다양한",syn:"diverse, different",ant:"identical, same",def:"many different types of something"},
  {en:"origin",kr:"기원, 유래",syn:"source, beginning",ant:"end, result",def:"the beginning, cause, or source of something"},
  {en:"spot",kr:"발견하다",syn:"notice, find, see",ant:"miss, overlook",def:"to see or notice something or someone"},
  {en:"powerful",kr:"강력한",syn:"strong, mighty",ant:"weak",def:"able to control and influence people and events"},
  {en:"unique",kr:"고유한, 독특한",syn:"special, distinctive",ant:"common, ordinary",def:"different from anything else; unusual and special"},
  {en:"unite",kr:"통합하다",syn:"combine, join",ant:"divide, separate",def:"to make people join together as a group"},
  {en:"useful",kr:"유용한",syn:"helpful, handy",ant:"useless",def:"helpful for a purpose"},
  {en:"importance",kr:"중요성",syn:"significance",ant:"insignificance",def:"the quality of being important"},
  {en:"decision",kr:"결정",syn:"choice, conclusion",ant:"hesitation",def:"the act of making up one's mind"},
  {en:"desire",kr:"욕구, 바람",syn:"wish, want",ant:"dislike",def:"a strong wish to have or do something"},
  {en:"referee",kr:"심판",syn:"umpire, official",ant:"player",def:"someone who makes sure players follow the rules"},
  {en:"foul",kr:"반칙",syn:"violation, offense",ant:"fair play",def:"an action that is against the rules of a sport"},
  {en:"argue",kr:"논쟁하다",syn:"dispute, debate",ant:"agree",def:"to speak angrily because you disagree"},
  {en:"several",kr:"몇몇의",syn:"some, a few",ant:"none, single",def:"more than two but not very many"},
  {en:"spirit",kr:"정신",syn:"soul, mind",ant:"body",def:"the part of a person that includes mind and feelings"},
  {en:"classic",kr:"고전적인",syn:"traditional, timeless",ant:"modern",def:"judged to be of high quality over a long time"},
  {en:"safely",kr:"안전하게",syn:"securely",ant:"dangerously",def:"in a way that is not dangerous"}
];

const FILL = [
  {kr:"축구는 전 세계에서 인기 있는 스포츠이다.",sent:"Soccer is a [popular] sport [all over the world].",b:["popular","all over the world"]},
  {kr:"당신은 색의 중요성을 이해할 필요가 있다!",sent:"You need [to understand] the [importance] of colors!",b:["to understand","importance"]},
  {kr:"검은색과 흰색 공은 멕시코의 1970년 월드컵 동안 나왔다.",sent:"Black and white balls [came out] [during] the 1970 World Cup in Mexico.",b:["came out","during"]},
  {kr:"사람들은 흑백 TV에서 그것들을 쉽게 발견할 수 있었다.",sent:"People [could] [spot] them easily on their black and white TVs.",b:["could","spot"]},
  {kr:"유니폼 색은 같은 정신 아래 팀을 하나로 묶는 힘을 가진다.",sent:"Uniform colors have the power [to unite] the team under the same [spirit].",b:["to unite","spirit"]},
  {kr:"심판들은 선수들과 눈에 띄어야 하기 때문에 특별한 색을 입는다.",sent:"Referees wear special colors [because] they need to [stand out].",b:["because","stand out"]},
  {kr:"검은색이 그들이 가장 좋아하는 색이었다.",sent:"[Among] several colors, black [has been] their favorite.",b:["Among","has been"]},
  {kr:"심판들은 1970년 이래로 노란색과 빨간색 카드를 사용해 왔다.",sent:"Referees [have used] yellow and red cards [since] 1970.",b:["have used","since"]},
  {kr:"우리 같이 배구 경기 보는 게 어때?",sent:"[Why don't we] watch the volleyball match together?",b:["Why don't we"]},
  {kr:"미안, 안 돼. 동아리 모임에 가야 해.",sent:"[Sorry, I can't]. I have to go to a club meeting.",b:["Sorry, I can't"]},
  {kr:"민지 너는 어때?",sent:"[How about] you, Minji?",b:["How about"]},
  {kr:"1시까지 올 수 있어?",sent:"Can you [make it] at 1 p.m.?",b:["make it"]}
];

const TRANS = [
  {en:"Soccer balls today come in various colors, but black and white balls are quite common.",kr:"오늘날 축구공은 다양한 색으로 나오지만, 검은색과 흰색 공은 꽤 흔하다."},
  {en:"Have you heard about the origin of this popular design?",kr:"당신은 이 인기 있는 디자인의 유래에 대해 들어본 적 있는가?"},
  {en:"Players can spot each other and make quick decisions thanks to their unique colors.",kr:"선수들은 고유한 색 덕분에 서로를 발견하고 빠른 결정을 내릴 수 있다."},
  {en:"Black looks powerful, and it sends a strong message.",kr:"검은색은 강력해 보이며, 강한 메시지를 전달한다."},
  {en:"Different color cards send different messages to players.",kr:"다른 색의 카드들은 선수들에게 다른 메시지를 전달한다."},
  {en:"All players from different countries clearly understand the meaning of these cards.",kr:"다른 나라의 모든 선수들이 이 카드들의 의미를 명확히 이해한다."},
  {en:"I'm going to go to a basketball game this Saturday.",kr:"나는 이번 토요일에 농구 경기를 보러 갈 것이다."},
  {en:"I hope you have a good time.",kr:"즐거운 시간 보내길 바라."}
];

const EXAM = [
  {type:"mc",cat:"단어",q:"'spot'의 의미로 알맞은 것은?",opts:["통합하다","발견하다","논쟁하다","결정하다"],ans:1},
  {type:"mc",cat:"단어",q:"'unique'의 유의어로 알맞은 것은?",opts:["common","special","weak","simple"],ans:1},
  {type:"mc",cat:"단어",q:"'powerful'의 반의어는?",opts:["strong","mighty","weak","useful"],ans:2},
  {type:"mc",cat:"단어",q:"영영풀이 'an action that is against the rules of a sport'에 맞는 단어는?",opts:["referee","foul","match","spirit"],ans:1},
  {type:"mc",cat:"단어",q:"'common'의 반의어로 알맞은 것은?",opts:["usual","rare","ordinary","diverse"],ans:1},
  {type:"mc",cat:"문법",q:"빈칸에 알맞은 것은? You need ____ the importance of colors.",opts:["understand","understanding","to understand","understood"],ans:2},
  {type:"mc",cat:"문법",q:"could의 의미가 다른 하나는?",opts:["He could run fast when young.","People could spot them easily.","The story could be true.","She could swim at age 5."],ans:2},
  {type:"mc",cat:"문법",q:"빈칸에 알맞은 부가의문문은? Soccer is popular, ____?",opts:["is it","isn't it","does it","doesn't it"],ans:1},
  {type:"mc",cat:"문법",q:"빈칸에 알맞은 것은? Referees ____ red cards since 1970.",opts:["use","used","have used","will use"],ans:2},
  {type:"mc",cat:"문법",q:"'because of' 다음에 올 수 있는 것은?",opts:["주어+동사","명사(구)","문장 전체","접속사"],ans:1},
  {type:"mc",cat:"본문",q:"검은색과 흰색 공이 처음 나온 대회는?",opts:["2002 월드컵","1970 멕시코 월드컵","올림픽","유로컵"],ans:1},
  {type:"mc",cat:"본문",q:"심판이 특별한 색 유니폼을 입는 이유는?",opts:["더 멋있어서","선수들과 눈에 띄려고","규칙 때문에","전통이라서"],ans:1},
  {type:"mc",cat:"대화문",q:"제안을 거절할 때 쓰는 표현은?",opts:["I'd love to!","Sorry, I can't.","That sounds great!","Sure, see you."],ans:1},
  {type:"fill",cat:"대화문",q:"'1시까지 올 수 있어?' → Can you ____ at 1 p.m.?  (두 단어)",ans:"make it"},
  {type:"fill",cat:"본문",q:"빈칸을 영어로: 'Among several colors, black has ____ their favorite.' (한 단어)",ans:"been"}
];

/* ================= STATE ================= */
let view='w';
let mState={sel:null,done:0};
let bIdx=0, bDone=Array(FILL.length).fill(false);
let tIdx=0, tDone=Array(TRANS.length).fill(null);
let exName='', exIdx=0, exAns=Array(EXAM.length).fill(null), exSubmitted=false;

/* ================= NAV ================= */
function go(v){view=v;['n1','n2','n3','n4'].forEach((id,i)=>document.getElementById(id).classList.toggle('on',['w','b','t','e'][i]===v));render();}
function render(){const a=document.getElementById('app');
 if(view==='w')a.innerHTML=viewWord();
 else if(view==='b')a.innerHTML=viewBlank();
 else if(view==='t')a.innerHTML=viewTrans();
 else a.innerHTML=viewExam();
 if(view==='b')focusNone();
}
function norm(s){return (s||'').toLowerCase().replace(/[^a-z0-9가-힣\s]/g,'').replace(/\s+/g,' ').trim();}

/* ================= 1. 단어 매치 + 카드 ================= */
let matchPairs=[];
function buildMatch(){
  const pick=VOCAB.slice(0,8);
  const left=pick.map((v,i)=>({k:i,t:v.en,type:'en'}));
  const right=pick.map((v,i)=>({k:i,t:v.kr,type:'kr'})).sort(()=>Math.random()-.5);
  matchPairs={left,right,matched:[]};
}
function viewWord(){
  if(!matchPairs.left)buildMatch();
  const m=matchPairs;
  let html=`<div class="desc"><b>1단계 · 단어 학습</b><br>먼저 영어 단어와 뜻을 짝지어 보세요. 그다음 유의어·반의어 카드로 정리합니다.</div>
  <div class="glabel">🎯 단어 매치 게임 (영어 ↔ 뜻)</div>
  <div class="match-grid"><div class="mcol">`;
  m.left.forEach(x=>{const done=m.matched.includes(x.k);html+=`<div class="chip${done?' done':''}${mState.sel&&mState.sel.side==='L'&&mState.sel.k===x.k?' sel':''}" onclick="pick('L',${x.k})">${x.t}</div>`;});
  html+=`</div><div class="mcol">`;
  m.right.forEach(x=>{const done=m.matched.includes(x.k);html+=`<div class="chip kr${done?' done':''}${mState.sel&&mState.sel.side==='R'&&mState.sel.k===x.k?' sel':''}" onclick="pick('R',${x.k})">${x.t}</div>`;});
  html+=`</div></div><div class="match-msg" id="mmsg">${m.matched.length}/8 짝 완성</div>`;
  html+=`<div class="glabel">📖 유의어 · 반의어 정리</div>`;
  VOCAB.forEach(v=>{html+=`<div class="vcard"><div class="vhead"><span class="ven">${v.en}</span><span class="vkr">${v.kr}</span></div>
   <div class="vrow syn"><span class="lab">유의어</span>${v.syn}</div>
   <div class="vrow ant"><span class="lab">반의어</span>${v.ant||'—'}</div>
   <div class="def">💬 ${v.def}</div></div>`;});
  return html;
}
function pick(side,k){
  const sel=mState.sel;
  if(!sel){mState.sel={side,k};render();return;}
  if(sel.side===side){mState.sel={side,k};render();return;}
  if(sel.k===k){matchPairs.matched.push(k);mState.sel=null;}
  else{mState.sel=null;}
  render();
  const msg=document.getElementById('mmsg');
  if(msg&&matchPairs.matched.length===8)msg.innerHTML='✅ 모두 완성! 빈칸 단계로 넘어가세요.';
}

/* ================= 2. 빈칸 채우기 ================= */
function viewBlank(){
  const done=bDone.filter(Boolean).length;
  let html=`<div class="desc"><b>2단계 · 빈칸 채우기</b><br>한국어 뜻을 보고, 노란 빈칸을 탭하면 정답이 나옵니다. 본문·대화문 핵심 표현을 익히세요.</div>
  <div class="bar"><div style="width:${Math.round(done/FILL.length*100)}%"></div></div>`;
  FILL.forEach((f,i)=>{
    let s=f.sent;
    f.b.forEach((w,j)=>{s=s.replace('['+w+']',`<span class="blank" onclick="this.classList.toggle('show');markBlank(${i})">${w}</span>`);});
    html+=`<div class="qcard"><div class="qnum">문장 ${i+1} / ${FILL.length}</div>
     <div class="qkr">${f.kr}</div><div class="qsent">${s}</div></div>`;
  });
  return html;
}
function markBlank(i){if(!bDone[i]){bDone[i]=true;}}

/* ================= 3. 해석하기 ================= */
function viewTrans(){
  const done=tDone.filter(v=>v!==null).length;
  if(done===TRANS.length){
    const ok=tDone.filter(v=>v==='ok').length;
    return `<div class="desc"><b>3단계 · 해석하기</b></div>
     <div class="result"><div class="score">${ok}/${TRANS.length}</div>
     <div class="rmsg">${ok>=6?'훌륭해요! 시험 단계로 가세요 🏆':'틀린 문장을 다시 확인해보세요'}</div>
     <button class="b b1" onclick="tIdx=0;tDone=Array(${TRANS.length}).fill(null);render()">다시 풀기</button>
     <button class="b b3" onclick="go('e')" style="margin-left:8px">시험 보러 가기 →</button></div>`;
  }
  const t=TRANS[tIdx], st=tDone[tIdx];
  return `<div class="desc"><b>3단계 · 해석하기</b><br>영어 문장을 읽고 한국어로 해석을 입력하세요. (핵심 단어만 맞아도 정답 처리)</div>
  <div class="bar"><div style="width:${Math.round(done/TRANS.length*100)}%"></div></div>
  <div class="qcard"><div class="qnum">${tIdx+1} / ${TRANS.length}</div>
   <div class="qsent" style="margin-bottom:10px">${t.en}</div>
   <input class="inp${st==='ok'?' ok':st==='no'?' no':''}" id="tin" placeholder="한국어 해석을 입력하세요..." onkeydown="if(event.key==='Enter')checkT()">
   <div class="fb${st==='ok'?' ok':st==='no'?' no':''}" id="tfb">${st==='ok'?'✓ 좋아요!':st==='no'?'✗ 모범답안을 확인하세요':'&nbsp;'}</div>
   <div class="ansbox" id="tans" style="${st?'display:block':''}">모범 해석: ${t.kr}</div>
   <div class="btns"><button class="b b1" onclick="checkT()">확인</button>
    <button class="b b2" onclick="showT()">해석 보기</button></div></div>
  <div class="nav2"><button class="b" onclick="tNav(-1)" ${tIdx===0?'disabled':''}>← 이전</button>
   <span class="cnt">${done}/${TRANS.length} 완료</span>
   <button class="b" onclick="tNav(1)">다음 →</button></div>`;
}
function checkT(){const v=document.getElementById('tin').value;const t=TRANS[tIdx];
 const keys=t.kr.replace(/[.,!?]/g,'').split(' ').filter(w=>w.length>1);
 const hit=keys.filter(k=>norm(v).includes(norm(k))).length;
 const ok=hit>=Math.ceil(keys.length*0.4)&&v.trim().length>3;
 tDone[tIdx]=ok?'ok':'no';
 document.getElementById('tans').style.display='block';render();}
function showT(){tDone[tIdx]=tDone[tIdx]||'no';document.getElementById('tans')&&(document.getElementById('tans').style.display='block');render();}
function tNav(d){tIdx=Math.max(0,Math.min(TRANS.length-1,tIdx+d));render();}

/* ================= 4. 시험 ================= */
function viewExam(){
  if(!exName)return `<div class="gate"><h2>🏆 종합 시험</h2>
   <p>단어 · 문법 · 본문 · 대화문 ${EXAM.length}문항 · 자동채점<br>이름을 입력하면 시작합니다.</p>
   <input id="nameIn" placeholder="이름을 입력하세요" maxlength="12">
   <br><button class="b b1" style="padding:12px 36px" onclick="startExam()">시험 시작</button>
   ${boardHTML()}</div>`;
  if(exSubmitted)return examResult();
  const q=EXAM[exIdx];
  let body=`<div class="exq"><div class="qnum">${q.cat} · 문제 ${exIdx+1}/${EXAM.length}</div>
   <div class="qtxt">${q.q}</div>`;
  if(q.type==='mc'){body+=`<div class="opts">`;
    q.opts.forEach((o,i)=>{body+=`<div class="opt${exAns[exIdx]===i?' pick':''}" onclick="exAns[${exIdx}]=${i};render()">${String.fromCharCode(9312+i)} ${o}</div>`;});
    body+=`</div>`;
  }else{body+=`<input class="exinp" id="exin" value="${exAns[exIdx]||''}" placeholder="답을 입력하세요" oninput="exAns[${exIdx}]=this.value">`;}
  body+=`</div>`;
  const answered=exAns.filter(v=>v!==null&&v!=='').length;
  return `<div class="desc"><b>${exName}</b>님의 시험 · 진행 ${answered}/${EXAM.length}</div>
   <div class="bar"><div style="width:${Math.round(answered/EXAM.length*100)}%"></div></div>${body}
   <div class="nav2"><button class="b" onclick="exNav(-1)" ${exIdx===0?'disabled':''}>← 이전</button>
    <span class="cnt">${exIdx+1}/${EXAM.length}</span>
    ${exIdx<EXAM.length-1?`<button class="b" onclick="exNav(1)">다음 →</button>`:`<button class="b b3" onclick="submitExam()">제출하고 채점 🎯</button>`}</div>`;
}
function startExam(){const v=document.getElementById('nameIn').value.trim();if(!v){alert('이름을 입력해주세요');return;}exName=v;exIdx=0;render();}
function exNav(d){if(EXAM[exIdx].type==='fill'){const el=document.getElementById('exin');if(el)exAns[exIdx]=el.value;}exIdx=Math.max(0,Math.min(EXAM.length-1,exIdx+d));render();}
function submitExam(){
  if(EXAM[exIdx].type==='fill'){const el=document.getElementById('exin');if(el)exAns[exIdx]=el.value;}
  let score=0;
  EXAM.forEach((q,i)=>{
    if(q.type==='mc'){if(exAns[i]===q.ans)score++;}
    else{if(norm(exAns[i])===norm(q.ans))score++;}
  });
  saveScore(exName,score,EXAM.length);
  exSubmitted=true;render();
}
function examResult(){
  let score=0;
  EXAM.forEach((q,i)=>{const c=q.type==='mc'?exAns[i]===q.ans:norm(exAns[i])===norm(q.ans);if(c)score++;});
  const pct=Math.round(score/EXAM.length*100);
  let rev='';
  EXAM.forEach((q,i)=>{const c=q.type==='mc'?exAns[i]===q.ans:norm(exAns[i])===norm(q.ans);
   const my=q.type==='mc'?(exAns[i]!=null?q.opts[exAns[i]]:'(무응답)'):(exAns[i]||'(무응답)');
   const corr=q.type==='mc'?q.opts[q.ans]:q.ans;
   rev+=`<div class="rev ${c?'ok':'no'}"><span class="ic">${c?'✓':'✗'}</span> ${i+1}. ${q.cat} — 내 답: ${my}${c?'':` · <span class="corr">정답: ${corr}</span>`}</div>`;});
  return `<div class="result"><div class="score">${score}/${EXAM.length}</div>
   <div class="rmsg"><b>${exName}</b>님 · ${pct}점 · ${pct>=80?'최고예요! 🎉':pct>=60?'잘했어요! 👍':'조금 더 복습해요 💪'}</div>
   <button class="b b1" onclick="resetExam()">다시 보기</button>
   <div class="review"><div class="glabel">📋 문항별 채점 결과</div>${rev}</div>
   ${boardHTML()}</div>`;
}
function resetExam(){exName='';exIdx=0;exAns=Array(EXAM.length).fill(null);exSubmitted=false;render();}

/* ===== 점수 저장 (이 기기) ===== */
function saveScore(name,score,total){
  try{const k='lesson3_scores';const arr=JSON.parse(localStorage.getItem(k)||'[]');
   arr.push({name,score,total,date:new Date().toLocaleString('ko-KR')});
   localStorage.setItem(k,JSON.stringify(arr));}catch(e){}
}
function boardHTML(){
  let arr=[];try{arr=JSON.parse(localStorage.getItem('lesson3_scores')||'[]');}catch(e){}
  if(!arr.length)return '';
  arr.sort((a,b)=>b.score-a.score);
  let rows=arr.slice(0,20).map((r,i)=>`<tr class="${r.name===exName?'me':''}"><td class="rank">${i+1}</td><td>${r.name}</td><td>${r.score}/${r.total}</td><td style="color:var(--muted);font-size:11px">${r.date}</td></tr>`).join('');
  return `<div class="board"><div class="glabel">🏅 이 기기의 점수 기록 (높은 순)</div>
   <table><tr><th>순위</th><th>이름</th><th>점수</th><th>일시</th></tr>${rows}</table>
   <div style="margin-top:10px"><button class="b b2" onclick="if(confirm('이 기기의 모든 점수 기록을 지울까요?')){localStorage.removeItem('lesson3_scores');render();}">기록 전체 삭제</button></div></div>`;
}
function focusNone(){}
render();
</script>
</body>
</html>
