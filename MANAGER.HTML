<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>원장 관리 콘솔 — 학생 관리</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gothic+A1:wght@500;700;800;900&family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EBEEEA; --surface:#FFFFFF; --surface-2:#F6F8F5;
  --ink:#1E2C34; --ink-soft:#5C6B71; --line:#DDE3DD;
  --accent:#1F7A6B; --accent-soft:#E1F0EB; --accent-ink:#155A4F;
  --gold:#B0831A; --gold-soft:#FBF1D9;
  --low:#1F7A6B; --low-soft:#E1F0EB;
  --mid:#C2891B; --mid-soft:#FBF0D7;
  --high:#C0392B; --high-soft:#FbE6E2;
  --r:14px; --shadow:0 1px 3px rgba(30,44,52,.06),0 8px 24px rgba(30,44,52,.05);
}
*{box-sizing:border-box;margin:0;padding:0}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
body{font-family:'IBM Plex Sans KR',sans-serif;background:var(--bg);color:var(--ink);line-height:1.55;
  -webkit-font-smoothing:antialiased;}
.num{font-family:'IBM Plex Mono',monospace;font-variant-numeric:tabular-nums;}
.app{max-width:1080px;margin:0 auto;padding:20px 18px 80px}

/* ===== header ===== */
header.top{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;flex-wrap:wrap;margin-bottom:16px}
.brand{display:flex;flex-direction:column;gap:4px}
.brand .name{display:flex;align-items:center;gap:8px}
.brand h1{font-family:'Gothic A1',sans-serif;font-weight:900;font-size:1.5rem;letter-spacing:-.01em}
.brand .edit-name{border:none;background:none;cursor:pointer;color:var(--ink-soft);font-size:.85rem;padding:2px 4px;border-radius:6px}
.brand .edit-name:hover{background:var(--surface-2);color:var(--ink)}
.brand .sub{font-size:.82rem;color:var(--ink-soft)}
.solo{display:inline-flex;align-items:center;gap:7px;background:var(--surface);border:1px solid var(--line);
  border-radius:999px;padding:7px 14px;font-size:.82rem;font-weight:600;box-shadow:var(--shadow)}
.solo .dot{width:8px;height:8px;border-radius:50%;background:var(--accent)}
.solo b{font-family:'IBM Plex Mono',monospace;color:var(--accent-ink)}

/* ===== rhythm strip (signature) ===== */
.rhythm{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;
  margin-bottom:14px;box-shadow:var(--shadow)}
.rhythm-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.rhythm-head .label{font-size:.78rem;font-weight:700;letter-spacing:.04em;color:var(--accent-ink);
  text-transform:uppercase}
.rhythm-head .status{font-size:.92rem;font-weight:600}
.rhythm-head .status b{font-family:'IBM Plex Mono',monospace;color:var(--accent)}
.strip{display:grid;grid-template-columns:repeat(31,1fr);gap:3px}
.cell{height:30px;border-radius:5px;background:var(--surface-2);position:relative;display:flex;align-items:center;
  justify-content:center;font-size:.6rem;color:var(--ink-soft);font-family:'IBM Plex Mono',monospace}
.cell.cp{background:var(--gold-soft);color:var(--gold);font-weight:700;box-shadow:inset 0 0 0 1.5px var(--gold)}
.cell.today{background:var(--accent);color:#fff;font-weight:700;box-shadow:0 0 0 3px var(--accent-soft)}
.cell.past{opacity:.5}
.rhythm-foot{margin-top:10px;font-size:.78rem;color:var(--ink-soft);display:flex;gap:16px;flex-wrap:wrap}
.rhythm-foot .lg{display:inline-flex;align-items:center;gap:5px}
.rhythm-foot .sw{width:11px;height:11px;border-radius:3px}

/* ===== stat cards ===== */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;box-shadow:var(--shadow)}
.stat .k{font-size:.78rem;color:var(--ink-soft);font-weight:600;margin-bottom:4px}
.stat .v{font-family:'IBM Plex Mono',monospace;font-weight:700;font-size:1.9rem;line-height:1}
.stat .v small{font-size:.9rem;color:var(--ink-soft);font-weight:500}
.stat.warn .v{color:var(--high)}
.stat.due .v{color:var(--gold)}
@media(max-width:680px){.stats{grid-template-columns:repeat(2,1fr)}}

/* ===== toolbar ===== */
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.search{flex:1;min-width:160px;position:relative}
.search input{width:100%;font-family:inherit;font-size:.92rem;padding:10px 14px 10px 36px;border:1px solid var(--line);
  border-radius:11px;background:var(--surface)}
.search input:focus{outline:none;border-color:var(--accent)}
.search .ic{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--ink-soft);font-size:.9rem}
.tbtn{font-family:inherit;font-weight:600;font-size:.88rem;border:1px solid var(--line);background:var(--surface);
  color:var(--ink);border-radius:11px;padding:10px 14px;cursor:pointer;white-space:nowrap}
.tbtn:hover{border-color:var(--ink-soft)}
.tbtn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.tbtn.primary:hover{background:var(--accent-ink)}
.sortsel{font-family:inherit;font-size:.88rem;padding:10px 12px;border:1px solid var(--line);border-radius:11px;background:var(--surface);cursor:pointer}

/* ===== list ===== */
.list{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow)}
.list-head{display:grid;grid-template-columns:1.6fr .7fr .7fr .8fr .9fr 28px;gap:10px;padding:11px 18px;
  font-size:.74rem;font-weight:700;color:var(--ink-soft);background:var(--surface-2);border-bottom:1px solid var(--line);
  letter-spacing:.02em}
.row{display:grid;grid-template-columns:1.6fr .7fr .7fr .8fr .9fr 28px;gap:10px;padding:13px 18px;align-items:center;
  border-bottom:1px solid var(--line);cursor:pointer;transition:background .12s}
.row:last-child{border-bottom:none}
.row:hover{background:var(--surface-2)}
.row .nm{font-weight:600;display:flex;align-items:center;gap:8px}
.row .nm .grade{font-size:.74rem;color:var(--ink-soft);font-weight:500;background:var(--surface-2);
  border:1px solid var(--line);border-radius:6px;padding:1px 7px}
.row:hover .nm .grade{background:#fff}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:.76rem;font-weight:700;padding:3px 10px;border-radius:999px}
.chip .d{width:7px;height:7px;border-radius:50%}
.chip.low{background:var(--low-soft);color:var(--low)} .chip.low .d{background:var(--low)}
.chip.mid{background:var(--mid-soft);color:var(--mid)} .chip.mid .d{background:var(--mid)}
.chip.high{background:var(--high-soft);color:var(--high)} .chip.high .d{background:var(--high)}
.row .met{font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:.9rem}
.row .met.bad{color:var(--high)}
.check-pill{font-size:.72rem;font-weight:700;padding:3px 9px;border-radius:999px;text-align:center;white-space:nowrap}
.check-pill.done{background:var(--accent-soft);color:var(--accent-ink)}
.check-pill.todo{background:var(--gold-soft);color:var(--gold)}
.row .arrow{color:var(--ink-soft);text-align:right}
.empty{padding:50px 20px;text-align:center;color:var(--ink-soft)}
.empty b{display:block;color:var(--ink);font-weight:700;margin-bottom:6px;font-size:1.05rem}

/* mobile list → cards */
@media(max-width:680px){
  .list-head{display:none}
  .row{grid-template-columns:1fr auto;grid-template-areas:"nm chip" "mets mets";gap:8px 10px;padding:14px 16px}
  .row .nm{grid-area:nm} .row .chipcell{grid-area:chip;text-align:right}
  .row .metcell{grid-area:mets;display:flex;gap:14px;font-size:.82rem;color:var(--ink-soft)}
  .row .metcell .lab{font-weight:500}
  .row .arrow{display:none}
  .row .check-pill{grid-area:chip}
}

/* ===== detail panel ===== */
.scrim{position:fixed;inset:0;background:rgba(20,30,36,.42);opacity:0;pointer-events:none;transition:opacity .22s;z-index:40}
.scrim.open{opacity:1;pointer-events:auto}
.panel{position:fixed;top:0;right:0;height:100%;width:440px;max-width:92vw;background:var(--surface);
  box-shadow:-10px 0 40px rgba(20,30,36,.18);transform:translateX(100%);transition:transform .26s cubic-bezier(.4,0,.2,1);
  z-index:50;display:flex;flex-direction:column}
.panel.open{transform:translateX(0)}
.panel-head{padding:18px 20px 14px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.panel-head .nm-edit{font-family:'Gothic A1',sans-serif;font-weight:800;font-size:1.3rem;border:none;background:none;
  width:100%;color:var(--ink);padding:2px 0}
.panel-head .nm-edit:focus{outline:none;background:var(--surface-2);border-radius:6px;padding:2px 6px}
.panel-head .grade-edit{font-family:inherit;font-size:.85rem;color:var(--ink-soft);border:1px solid var(--line);
  border-radius:8px;padding:4px 8px;margin-top:6px;width:120px}
.panel-head .grade-edit:focus{outline:none;border-color:var(--accent)}
.xbtn{border:none;background:var(--surface-2);width:34px;height:34px;border-radius:9px;cursor:pointer;font-size:1.1rem;color:var(--ink-soft);flex:none}
.xbtn:hover{background:var(--line)}
.panel-body{flex:1;overflow-y:auto;padding:18px 20px}
.field{margin-bottom:18px}
.field>label{display:block;font-size:.8rem;font-weight:700;color:var(--ink-soft);margin-bottom:7px}
.slider-row{display:flex;align-items:center;gap:12px}
.slider-row input[type=range]{flex:1;accent-color:var(--accent)}
.slider-row .pct{font-family:'IBM Plex Mono',monospace;font-weight:700;font-size:1rem;min-width:48px;text-align:right}
.score-row{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.score-cell label{display:block;font-size:.74rem;color:var(--ink-soft);margin-bottom:4px;font-weight:500}
.score-cell input{width:100%;font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:1rem;padding:8px 10px;
  border:1px solid var(--line);border-radius:9px;text-align:center}
.score-cell input:focus{outline:none;border-color:var(--accent)}
.risk-toggle{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.risk-opt{font-family:inherit;font-weight:700;font-size:.88rem;padding:10px;border-radius:10px;border:1.5px solid var(--line);
  background:var(--surface);cursor:pointer;color:var(--ink-soft)}
.risk-opt[data-r="하"].on{border-color:var(--low);background:var(--low-soft);color:var(--low)}
.risk-opt[data-r="중"].on{border-color:var(--mid);background:var(--mid-soft);color:var(--mid)}
.risk-opt[data-r="상"].on{border-color:var(--high);background:var(--high-soft);color:var(--high)}
.field textarea{width:100%;font-family:inherit;font-size:.92rem;padding:10px 12px;border:1px solid var(--line);
  border-radius:10px;resize:vertical;min-height:80px;line-height:1.55}
.field textarea:focus{outline:none;border-color:var(--accent)}
.field input[type=date]{font-family:inherit;font-size:.92rem;padding:9px 12px;border:1px solid var(--line);border-radius:10px}
.field input[type=date]:focus{outline:none;border-color:var(--accent)}
.checkstat{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--surface-2);
  border:1px solid var(--line);border-radius:11px;padding:12px 14px;margin-bottom:18px}
.checkstat .t{font-size:.82rem}
.checkstat .t b{display:block;font-size:.74rem;color:var(--ink-soft);font-weight:600}
.checkstat .last{font-family:'IBM Plex Mono',monospace;font-weight:600}
.panel-foot{padding:14px 20px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:9px;background:var(--surface)}
.foot-row{display:flex;gap:9px}
.pbtn{flex:1;font-family:inherit;font-weight:700;font-size:.92rem;border:none;border-radius:11px;padding:12px;cursor:pointer}
.pbtn.check{background:var(--accent);color:#fff}
.pbtn.check:hover{background:var(--accent-ink)}
.pbtn.check.done{background:var(--accent-soft);color:var(--accent-ink)}
.pbtn.report{background:var(--gold);color:#fff}
.pbtn.report:hover{filter:brightness(.95)}
.pbtn.ghost{background:var(--surface);border:1px solid var(--line);color:var(--ink-soft);flex:none;padding:12px 16px}
.pbtn.ghost:hover{border-color:var(--high);color:var(--high)}


/* ===== history ===== */
.history-tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:var(--surface-2);border:1px solid var(--line);border-radius:11px;padding:12px 14px;margin-bottom:14px}
.history-tools label{font-size:.8rem;font-weight:700;color:var(--ink-soft)}
.history-tools input[type=date]{font-family:inherit;font-size:.9rem;padding:8px 10px;border:1px solid var(--line);border-radius:9px;background:#fff}
.history-list{display:flex;flex-direction:column;gap:9px;margin-top:8px}
.history-item{border:1px solid var(--line);border-radius:11px;background:var(--surface-2);padding:11px 12px}
.history-item .hdate{font-family:'IBM Plex Mono',monospace;font-weight:700;color:var(--accent-ink);font-size:.86rem;margin-bottom:5px}
.history-item .hmeta{font-size:.82rem;color:var(--ink);display:flex;flex-wrap:wrap;gap:6px 12px;margin-bottom:5px}
.history-item .hmemo{font-size:.84rem;color:var(--ink-soft);white-space:pre-wrap;line-height:1.5}
.history-empty{font-size:.84rem;color:var(--ink-soft);background:var(--surface-2);border:1px dashed var(--line);border-radius:11px;padding:14px;text-align:center}

/* ===== report modal ===== */
.modal-scrim{position:fixed;inset:0;background:rgba(20,30,36,.5);display:none;align-items:center;justify-content:center;
  z-index:60;padding:18px}
.modal-scrim.open{display:flex}
.modal{background:var(--surface);border-radius:16px;width:100%;max-width:440px;max-height:88vh;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.modal-head{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
.modal-head h3{font-family:'Gothic A1',sans-serif;font-weight:800;font-size:1.05rem}
.modal-body{padding:16px 20px;overflow-y:auto}
.modal-body .hint{font-size:.82rem;color:var(--ink-soft);margin-bottom:10px}
.modal-body textarea{width:100%;font-family:'IBM Plex Sans KR',sans-serif;font-size:.9rem;line-height:1.7;
  padding:14px;border:1px solid var(--line);border-radius:11px;min-height:230px;background:var(--surface-2);resize:vertical}
.modal-foot{padding:14px 20px;border-top:1px solid var(--line);display:flex;gap:9px}
.copied{font-size:.82rem;color:var(--accent);font-weight:700;align-self:center;margin-right:auto;opacity:0;transition:opacity .2s}
.copied.show{opacity:1}

/* ===== toast ===== */
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;
  padding:11px 20px;border-radius:11px;font-size:.88rem;font-weight:600;opacity:0;pointer-events:none;transition:.25s;z-index:80}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.loading{padding:60px 20px;text-align:center;color:var(--ink-soft)}
.savenote{font-size:.74rem;color:var(--ink-soft);text-align:center;margin-top:18px}
.savenote b{color:var(--accent-ink)}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand">
      <div class="name"><h1 id="acaName">○○영어학원</h1><button class="edit-name" onclick="editAcademy()">이름 수정</button></div>
      <span class="sub">원장 관리 콘솔 · 학생 학습 관리</span>
    </div>
    <div class="solo">
      <span class="dot"></span>원장님이 <b id="soloCount">0</b>명을 혼자 관리하고 있어요
    </div>
  </header>

  <section class="rhythm" id="rhythm"><div class="loading">불러오는 중…</div></section>

  <section class="stats" id="stats"></section>

  <div class="toolbar">
    <div class="search"><span class="ic">🔍</span><input id="search" type="text" placeholder="학생 이름 검색" oninput="render()"></div>
    <select class="sortsel" id="sort" onchange="render()">
      <option value="risk">정렬: 위험도순</option>
      <option value="check">정렬: 점검 필요순</option>
      <option value="name">정렬: 이름순</option>
      <option value="grade">정렬: 학년순</option>
      <option value="att">정렬: 출결 낮은순</option>
    </select>
    <button class="tbtn primary" onclick="addStudent()">+ 학생 추가</button>
  </div>

  <div class="list" id="list"></div>
  <p class="savenote">💾 모든 정보는 <b>이 기기에만</b> 안전하게 저장됩니다. 다시 열어도 그대로 남아 있어요.</p>
</div>

<!-- detail panel -->
<div class="scrim" id="scrim" onclick="closeDetail()"></div>
<aside class="panel" id="panel" aria-hidden="true"></aside>

<!-- report modal -->
<div class="modal-scrim" id="reportScrim">
  <div class="modal">
    <div class="modal-head"><h3>학부모 전달용 리포트</h3><button class="xbtn" onclick="closeReport()">✕</button></div>
    <div class="modal-body">
      <p class="hint">아래 내용을 복사해 카카오톡 채팅창에 붙여넣어 보내세요. (직접 수정도 가능합니다)</p>
      <textarea id="reportText"></textarea>
    </div>
    <div class="modal-foot">
      <span class="copied" id="copiedMsg">✓ 복사됐어요</span>
      <button class="pbtn report" style="flex:none;padding:11px 20px" onclick="copyReport()">📋 복사하기</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ============ state & storage ============ */
const KEY='crm-data-v1';
let state={academy:'○○영어학원',students:[]};
let hasStore=!!(window.storage&&window.storage.get);
let openId=null;

function uid(){return 's'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);}
function todayStr(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}

const SAMPLE=[
  {id:uid(),name:'김서연',grade:'중2',att:96,hw:88,mock:84,level:90,vocab:95,risk:'하',memo:'성실하고 단어 암기 우수. 독해 속도만 더 끌어올리면 좋음.',next:'',checked:''},
  {id:uid(),name:'이준호',grade:'중1',att:74,hw:55,mock:62,level:68,vocab:60,risk:'상',memo:'최근 결석·과제 누락 잦음. 어머니 상담 필요. 흥미 떨어진 듯.',next:'',checked:''},
  {id:uid(),name:'박지민',grade:'초6',att:90,hw:80,mock:0,level:75,vocab:82,risk:'중',memo:'기초 문법 보강 중. 진행형/시제 더 연습 필요.',next:'',checked:''},
  {id:uid(),name:'최예나',grade:'고1',att:98,hw:95,mock:91,level:94,vocab:97,risk:'하',memo:'상위권. 내신 대비 서술형 집중 지도 중.',next:'',checked:''},
  {id:uid(),name:'정우진',grade:'초5',att:82,hw:70,mock:0,level:66,vocab:72,risk:'중',memo:'활발하지만 집중 시간 짧음. 단어시험 재시 자주 발생.',next:'',checked:''},
];

async function load(){
  if(hasStore){
    try{const r=await window.storage.get(KEY); if(r&&r.value){state=JSON.parse(r.value);} else {state={academy:'○○영어학원',students:SAMPLE}; await save();}}
    catch(e){state={academy:'○○영어학원',students:SAMPLE};}
  } else {state={academy:'○○영어학원',students:SAMPLE};}
  if(!state.students)state.students=[];
  state.students.forEach(s=>{if(!Array.isArray(s.history))s.history=[];});
  renderAll();
}
async function save(){
  if(!hasStore)return;
  try{await window.storage.set(KEY,JSON.stringify(state));}catch(e){console.error('save failed',e);}
}

/* ============ checkpoint logic ============ */
function lastDayOfMonth(y,m){return new Date(y,m+1,0).getDate();}
function checkpointInfo(){
  const d=new Date(); const y=d.getFullYear(),m=d.getMonth(),day=d.getDate();
  const ld=lastDayOfMonth(y,m);
  // checkpoints: 15th and last day
  let activeDate, activeLabel, nextDate, nextLabel, isToday=false;
  const mid=new Date(y,m,15), end=new Date(y,m,ld);
  const t=new Date(y,m,day);
  if(day<15){
    // active = previous month end
    const pm=new Date(y,m,0); activeDate=pm; activeLabel=(pm.getMonth()+1)+'월 말일';
    nextDate=mid; nextLabel=(m+1)+'월 중순(15일)';
  } else if(day<ld){
    activeDate=mid; activeLabel=(m+1)+'월 중순(15일)';
    nextDate=end; nextLabel=(m+1)+'월 말일';
  } else { // day==ld
    activeDate=end; activeLabel=(m+1)+'월 말일'; isToday=true;
    const nm=new Date(y,m+1,15); nextDate=nm; nextLabel=(nm.getMonth()+1)+'월 중순(15일)';
  }
  if(day===15){isToday=true;}
  const dday=Math.ceil((nextDate-t)/(1000*60*60*24));
  return {activeDate,activeLabel,nextDate,nextLabel,isToday,dday,y,m,ld,day};
}
function isChecked(s){
  const ci=checkpointInfo();
  if(Array.isArray(s.history) && s.history.some(h=>new Date(h.date) >= ci.activeDate)) return true;
  if(!s.checked)return false;
  return new Date(s.checked) >= ci.activeDate;
}

/* ============ render ============ */
function renderAll(){renderRhythm();render();}

function renderRhythm(){
  document.getElementById('acaName').textContent=state.academy;
  const ci=checkpointInfo();
  const due=state.students.filter(s=>!isChecked(s)).length;
  let cells='';
  for(let i=1;i<=ci.ld;i++){
    let cls='cell';
    if(i===15||i===ci.ld)cls+=' cp';
    if(i<ci.day)cls+=' past';
    if(i===ci.day)cls+=' today';
    cells+=`<div class="${cls}" title="${ci.m+1}월 ${i}일">${i}</div>`;
  }
  const statusTxt = ci.isToday
    ? `<span style="color:var(--accent)">오늘이 점검일입니다!</span> 점검 대상 <b>${due}</b>명`
    : `다음 점검 <b>${ci.nextLabel}</b>까지 <b>D-${ci.dday}</b> · 점검 대상 <b>${due}</b>명`;
  document.getElementById('rhythm').innerHTML=`
    <div class="rhythm-head">
      <span class="label">📅 이번 달 점검 리듬</span>
      <span class="status">${statusTxt}</span>
    </div>
    <div class="strip">${cells}</div>
    <div class="rhythm-foot">
      <span class="lg"><span class="sw" style="background:var(--gold-soft);box-shadow:inset 0 0 0 1.5px var(--gold)"></span>점검일 (중순 15일 · 말일)</span>
      <span class="lg"><span class="sw" style="background:var(--accent)"></span>오늘</span>
      <span class="lg">이번 회차: <b style="font-family:'IBM Plex Mono'">${ci.activeLabel}</b></span>
    </div>`;
}

function riskRank(r){return r==='상'?0:r==='중'?1:2;}
function gradeRank(g){const o=['초3','초4','초5','초6','중1','중2','중3','고1','고2','고3'];const i=o.indexOf(g);return i<0?99:i;}

function renderStats(){
  const st=state.students;
  const total=st.length;
  const due=st.filter(s=>!isChecked(s)).length;
  const high=st.filter(s=>s.risk==='상').length;
  const avgAtt=total?Math.round(st.reduce((a,s)=>a+(+s.att||0),0)/total):0;
  document.getElementById('stats').innerHTML=`
    <div class="stat"><div class="k">총 학생</div><div class="v num">${total}<small> 명</small></div></div>
    <div class="stat due"><div class="k">이번 회차 점검 대상</div><div class="v num">${due}<small> 명</small></div></div>
    <div class="stat warn"><div class="k">퇴원위험 ‘상’</div><div class="v num">${high}<small> 명</small></div></div>
    <div class="stat"><div class="k">평균 출결률</div><div class="v num">${avgAtt}<small>%</small></div></div>`;
  document.getElementById('soloCount').textContent=total;
}

function render(){
  renderStats();
  const q=(document.getElementById('search').value||'').trim();
  const sort=document.getElementById('sort').value;
  let arr=state.students.filter(s=>!q||s.name.includes(q));
  arr.sort((a,b)=>{
    if(sort==='risk')return riskRank(a.risk)-riskRank(b.risk)||a.name.localeCompare(b.name,'ko');
    if(sort==='check')return (isChecked(a)?1:0)-(isChecked(b)?1:0)||riskRank(a.risk)-riskRank(b.risk);
    if(sort==='name')return a.name.localeCompare(b.name,'ko');
    if(sort==='grade')return gradeRank(a.grade)-gradeRank(b.grade)||a.name.localeCompare(b.name,'ko');
    if(sort==='att')return (+a.att||0)-(+b.att||0);
    return 0;
  });
  const list=document.getElementById('list');
  if(state.students.length===0){
    list.innerHTML=`<div class="empty"><b>아직 등록된 학생이 없어요</b>‘+ 학생 추가’를 눌러 첫 학생을 등록해 보세요.</div>`;return;
  }
  if(arr.length===0){list.innerHTML=`<div class="empty"><b>‘${q}’ 검색 결과가 없어요</b>다른 이름으로 검색해 보세요.</div>`;return;}
  const riskCls={'하':'low','중':'mid','상':'high'};
  let html=`<div class="list-head"><span>이름 · 학년</span><span>위험도</span><span>출결</span><span>과제</span><span>점검</span><span></span></div>`;
  arr.forEach(s=>{
    const ck=isChecked(s);
    html+=`<div class="row" onclick="openDetail('${s.id}')">
      <span class="nm">${s.name}<span class="grade">${s.grade||'-'}</span></span>
      <span class="chipcell"><span class="chip ${riskCls[s.risk]||'low'}"><span class="d"></span>${s.risk||'하'}</span></span>
      <span class="metcell met ${(+s.att<80)?'bad':''}"><span class="lab" style="display:none">출결 </span>${s.att||0}%</span>
      <span class="met ${(+s.hw<70)?'bad':''}">${s.hw||0}%</span>
      <span><span class="check-pill ${ck?'done':'todo'}">${ck?'점검완료':'점검필요'}</span></span>
      <span class="arrow">›</span>
    </div>`;
  });
  list.innerHTML=html;
}


function historyHTML(s){
  const hist=Array.isArray(s.history)?[...s.history]:[];
  hist.sort((a,b)=>String(b.date).localeCompare(String(a.date)) || String(b.created||'').localeCompare(String(a.created||'')));
  if(hist.length===0) return `<div class="history-empty">아직 누적 기록이 없어요. 날짜를 선택하고 ‘점검 기록 저장’을 누르면 여기에 쌓입니다.</div>`;
  return `<div class="history-list">`+hist.map((h,i)=>`
    <div class="history-item">
      <div class="hdate">${esc(h.date||'날짜 없음')}</div>
      <div class="hmeta">
        <span>출결 ${h.att||0}%</span><span>과제 ${h.hw||0}%</span><span>단어 ${h.vocab||0}점</span><span>레벨 ${h.level||0}점</span><span>모의 ${h.mock||0}점</span><span>위험도 ${esc(h.risk||'-')}</span>
      </div>
      ${h.memo?`<div class="hmemo">${esc(h.memo)}</div>`:''}
      <button class="tbtn" style="margin-top:8px;padding:6px 10px;font-size:.78rem" onclick="deleteHistory('${s.id}',${i});event.stopPropagation();">이 기록 삭제</button>
    </div>`).join('')+`</div>`;
}
function deleteHistory(studentId, sortedIndex){
  const s=state.students.find(x=>x.id===studentId); if(!s||!Array.isArray(s.history))return;
  const sorted=[...s.history].sort((a,b)=>String(b.date).localeCompare(String(a.date)) || String(b.created||'').localeCompare(String(a.created||'')));
  const target=sorted[sortedIndex];
  const idx=s.history.indexOf(target);
  if(idx>=0){s.history.splice(idx,1); save(); openDetail(studentId); render(); renderRhythm(); toast('누적 기록을 삭제했어요');}
}

/* ============ detail panel ============ */
function openDetail(id){
  openId=id; const s=state.students.find(x=>x.id===id); if(!s)return;
  const ci=checkpointInfo(); const ck=isChecked(s);
  const rOpt=r=>`<button class="risk-opt ${s.risk===r?'on':''}" data-r="${r}" onclick="setRisk('${r}')">${r}</button>`;
  document.getElementById('panel').innerHTML=`
    <div class="panel-head">
      <div style="flex:1">
        <input class="nm-edit" value="${esc(s.name)}" oninput="setField('name',this.value)" aria-label="학생 이름">
        <input class="grade-edit" value="${esc(s.grade||'')}" placeholder="학년 (예: 중2)" oninput="setField('grade',this.value)" aria-label="학년">
      </div>
      <button class="xbtn" onclick="closeDetail()">✕</button>
    </div>
    <div class="panel-body">
      <div class="checkstat">
        <div class="t"><b>이번 회차 (${ci.activeLabel})</b>${ck?'점검을 완료했어요':'아직 점검 전이에요'}</div>
        <div class="last">${s.checked?('최근 '+s.checked):'기록 없음'}</div>
      </div>
      <div class="field"><label>출결률</label>
        <div class="slider-row"><input type="range" min="0" max="100" value="${+s.att||0}" oninput="setField('att',+this.value);document.getElementById('attPct').textContent=this.value+'%'">
        <span class="pct" id="attPct">${+s.att||0}%</span></div></div>
      <div class="field"><label>과제 제출률</label>
        <div class="slider-row"><input type="range" min="0" max="100" value="${+s.hw||0}" oninput="setField('hw',+this.value);document.getElementById('hwPct').textContent=this.value+'%'">
        <span class="pct" id="hwPct">${+s.hw||0}%</span></div></div>
      <div class="field"><label>점수 기록</label>
        <div class="score-row">
          <div class="score-cell"><label>모의고사</label><input type="number" min="0" max="100" value="${s.mock||''}" placeholder="–" oninput="setField('mock',this.value)"></div>
          <div class="score-cell"><label>레벨테스트</label><input type="number" min="0" max="100" value="${s.level||''}" placeholder="–" oninput="setField('level',this.value)"></div>
          <div class="score-cell"><label>단어시험</label><input type="number" min="0" max="100" value="${s.vocab||''}" placeholder="–" oninput="setField('vocab',this.value)"></div>
        </div></div>
      <div class="field"><label>퇴원위험도 <span style="font-weight:500;color:var(--ink-soft)">(원장님만 보는 내부 표시)</span></label>
        <div class="risk-toggle">${rOpt('하')}${rOpt('중')}${rOpt('상')}</div></div>
      <div class="field"><label>상담 메모</label>
        <textarea placeholder="상담 내용, 특이사항, 지도 방향 등을 적어두세요" oninput="setField('memo',this.value)">${esc(s.memo||'')}</textarea></div>
      <div class="field"><label>다음 상담 예정일</label>
        <input type="date" value="${s.next||''}" oninput="setField('next',this.value)"></div>
      <div class="field"><label>누적 기록 날짜</label>
        <div class="history-tools">
          <label for="histDate">기록일</label>
          <input type="date" id="histDate" value="${todayStr()}">
          <span style="font-size:.78rem;color:var(--ink-soft)">중순/월말 외 날짜도 선택 가능</span>
        </div>
      </div>
      <div class="field"><label>점검 이력</label>
        ${historyHTML(s)}
      </div>
    </div>
    <div class="panel-foot">
      <div class="foot-row">
        <button class="pbtn check ${ck?'done':''}" onclick="toggleCheck()">${ck?'✓ 이번 회차 점검 완료됨':'선택 날짜로 점검 기록 저장'}</button>
      </div>
      <div class="foot-row">
        <button class="pbtn report" onclick="makeReport()">📋 학부모 리포트 만들기</button>
        <button class="pbtn ghost" onclick="removeStudent()" title="학생 삭제">🗑</button>
      </div>
    </div>`;
  document.getElementById('panel').classList.add('open');
  document.getElementById('panel').setAttribute('aria-hidden','false');
  document.getElementById('scrim').classList.add('open');
}
function closeDetail(){openId=null;document.getElementById('panel').classList.remove('open');document.getElementById('scrim').classList.remove('open');document.getElementById('panel').setAttribute('aria-hidden','true');}
function setField(f,v){const s=state.students.find(x=>x.id===openId);if(!s)return;s[f]=v;save();render();renderRhythm();}
function setRisk(r){const s=state.students.find(x=>x.id===openId);if(!s)return;s.risk=r;save();openDetail(openId);render();}
function toggleCheck(){
  const s=state.students.find(x=>x.id===openId);if(!s)return;
  if(!Array.isArray(s.history))s.history=[];
  const dateInput=document.getElementById('histDate');
  const d=(dateInput&&dateInput.value)||todayStr();
  s.history.push({
    date:d, created:new Date().toISOString(),
    att:+s.att||0, hw:+s.hw||0, mock:+s.mock||0, level:+s.level||0, vocab:+s.vocab||0,
    risk:s.risk||'하', memo:s.memo||''
  });
  s.checked=d;
  save();openDetail(openId);render();renderRhythm();toast(d+' 기록을 누적 저장했어요');
}

function addStudent(){
  const s={id:uid(),name:'새 학생',grade:'',att:0,hw:0,mock:0,level:0,vocab:0,risk:'하',memo:'',next:'',checked:'',history:[]};
  state.students.push(s);save();render();renderRhythm();openDetail(s.id);
  setTimeout(()=>{const inp=document.querySelector('.nm-edit');if(inp){inp.focus();inp.select();}},80);
}
function removeStudent(){
  const s=state.students.find(x=>x.id===openId);if(!s)return;
  if(!confirm(`‘${s.name}’ 학생을 삭제할까요? 되돌릴 수 없습니다.`))return;
  state.students=state.students.filter(x=>x.id!==openId);save();closeDetail();render();renderRhythm();toast('학생을 삭제했어요');
}

/* ============ report ============ */
function makeReport(){
  const s=state.students.find(x=>x.id===openId);if(!s)return;
  const line=(label,val,suffix='')=> (val!==''&&val!==undefined&&val!==null&&val!==0)||val===0&&false ? `▸ ${label}: ${val}${suffix}\n` : '';
  let r=`[${state.academy}] ${s.name} 학생 학습 리포트\n(${todayStr()})\n\n`;
  if(s.grade)r+=`▸ 학년: ${s.grade}\n`;
  r+=`▸ 출결률: ${s.att||0}%\n`;
  r+=`▸ 과제 제출률: ${s.hw||0}%\n`;
  if(s.mock)r+=`▸ 최근 모의고사: ${s.mock}점\n`;
  if(s.level)r+=`▸ 레벨테스트: ${s.level}점\n`;
  if(s.vocab)r+=`▸ 단어시험: ${s.vocab}점\n`;
  if(s.next)r+=`▸ 다음 상담 예정: ${s.next}\n`;
  if(s.memo)r+=`\n[원장 코멘트]\n${s.memo}\n`;
  r+=`\n늘 관심 갖고 지도하겠습니다. 감사합니다. 🙏`;
  document.getElementById('reportText').value=r;
  document.getElementById('reportScrim').classList.add('open');
  document.getElementById('copiedMsg').classList.remove('show');
}
function closeReport(){document.getElementById('reportScrim').classList.remove('open');}
function copyReport(){
  const ta=document.getElementById('reportText');
  ta.select();
  let ok=false;
  try{ navigator.clipboard.writeText(ta.value); ok=true; }catch(e){ try{ok=document.execCommand('copy');}catch(_){} }
  if(ok){document.getElementById('copiedMsg').classList.add('show');toast('리포트를 복사했어요. 카톡에 붙여넣으세요!');}
  else{toast('복사가 안 되면 직접 선택해 복사해 주세요');}
}

/* ============ misc ============ */
function editAcademy(){
  const v=prompt('학원 이름을 입력하세요',state.academy);
  if(v&&v.trim()){state.academy=v.trim();save();renderRhythm();}
}
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
let toastT;
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),2200);}
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeReport();closeDetail();}});

load();
</script>
</body>
</html>
