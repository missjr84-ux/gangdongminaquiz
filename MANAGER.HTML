<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>원장 관리 콘솔 v3 — 날짜별 누적 저장</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gothic+A1:wght@700;800;900&family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#EBEEEA;--surface:#fff;--surface2:#F6F8F5;--ink:#1E2C34;--soft:#5C6B71;--line:#DDE3DD;--accent:#1F7A6B;--accent2:#E1F0EB;--gold:#B0831A;--gold2:#FBF1D9;--red:#C0392B;--red2:#FBE6E2;--r:15px;--shadow:0 1px 3px rgba(30,44,52,.06),0 8px 24px rgba(30,44,52,.05)}
*{box-sizing:border-box;margin:0;padding:0}body{font-family:'IBM Plex Sans KR',sans-serif;background:var(--bg);color:var(--ink);line-height:1.55}.mono{font-family:'IBM Plex Mono',monospace}.app{max-width:1120px;margin:0 auto;padding:20px 16px 70px}header{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;flex-wrap:wrap;margin-bottom:14px}.brand h1{font-family:'Gothic A1',sans-serif;font-size:1.45rem;font-weight:900}.brand p{color:var(--soft);font-size:.86rem}.badge{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:8px 14px;font-weight:700;box-shadow:var(--shadow);font-size:.86rem}.badge b{color:var(--accent)}.notice{background:#fff;border:1px solid var(--line);border-left:5px solid var(--accent);border-radius:var(--r);padding:13px 15px;margin-bottom:14px;box-shadow:var(--shadow);font-size:.9rem}.notice b{color:var(--accent)}.grid{display:grid;grid-template-columns:340px 1fr;gap:14px}.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}.card-h{padding:14px 16px;background:var(--surface2);border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:8px}.card-h h2{font-size:.95rem;font-weight:800}.body{padding:14px 16px}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}.input,.select,textarea{font-family:inherit;width:100%;border:1px solid var(--line);border-radius:11px;background:#fff;padding:10px 12px;font-size:.92rem}.input:focus,.select:focus,textarea:focus{outline:none;border-color:var(--accent)}.btn{font-family:inherit;font-weight:800;border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:11px;padding:10px 12px;cursor:pointer;white-space:nowrap}.btn:hover{border-color:var(--soft)}.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}.btn.gold{background:var(--gold);border-color:var(--gold);color:#fff}.btn.red{background:var(--red2);border-color:var(--red2);color:var(--red)}.btn.small{font-size:.8rem;padding:7px 9px}.student-list{display:flex;flex-direction:column;gap:7px;max-height:68vh;overflow:auto}.stu{border:1px solid var(--line);border-radius:12px;padding:10px 11px;cursor:pointer;background:#fff}.stu:hover,.stu.on{border-color:var(--accent);background:var(--accent2)}.stu .top{display:flex;justify-content:space-between;gap:8px}.stu .name{font-weight:800}.stu .meta{font-size:.78rem;color:var(--soft);margin-top:3px}.pill{display:inline-flex;align-items:center;border-radius:999px;padding:2px 8px;font-size:.72rem;font-weight:800}.pill.low{background:var(--accent2);color:var(--accent)}.pill.mid{background:var(--gold2);color:var(--gold)}.pill.high{background:var(--red2);color:var(--red)}.formgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.field{margin-bottom:13px}.field label{display:block;color:var(--soft);font-size:.78rem;font-weight:800;margin-bottom:5px}.scoregrid{display:grid;grid-template-columns:repeat(5,1fr);gap:9px}.riskrow{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.riskrow button.on[data-r="하"]{background:var(--accent2);border-color:var(--accent);color:var(--accent)}.riskrow button.on[data-r="중"]{background:var(--gold2);border-color:var(--gold);color:var(--gold)}.riskrow button.on[data-r="상"]{background:var(--red2);border-color:var(--red);color:var(--red)}.split{display:grid;grid-template-columns:1fr 1fr;gap:12px}.history{width:100%;border-collapse:collapse;font-size:.86rem}.history th,.history td{border-bottom:1px solid var(--line);padding:8px 6px;text-align:left;vertical-align:top}.history th{color:var(--soft);font-size:.76rem;background:var(--surface2)}.empty{padding:28px 10px;text-align:center;color:var(--soft)}.foot{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;border-radius:12px;padding:11px 17px;font-weight:800;opacity:0;transition:.2s;z-index:99}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}.modal{position:fixed;inset:0;background:rgba(20,30,36,.5);display:none;align-items:center;justify-content:center;padding:16px;z-index:50}.modal.open{display:flex}.box{background:#fff;border-radius:16px;max-width:560px;width:100%;box-shadow:0 18px 60px rgba(0,0,0,.25);overflow:hidden}.box-h{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between}.box-b{padding:16px}.box textarea{min-height:260px;line-height:1.65}@media(max-width:820px){.grid{grid-template-columns:1fr}.student-list{max-height:none}.scoregrid,.formgrid{grid-template-columns:repeat(2,1fr)}.split{grid-template-columns:1fr}}@media(max-width:520px){.scoregrid{grid-template-columns:1fr 1fr}.foot .btn{flex:1}.card-h{align-items:flex-start;flex-direction:column}}
</style>
</head>
<body>
<div class="app">
<header><div class="brand"><h1 id="academyTitle">○○영어학원</h1><p>원장 관리 콘솔 v3 · 학생별 날짜 기록이 누적 저장됩니다</p></div><div class="badge">저장 방식: <b>브라우저 localStorage</b></div></header>
<div class="notice"><b>중요:</b> 이 버전은 GitHub Pages에서 작동하는 localStorage 저장 방식입니다. 같은 기기·같은 브라우저에서는 계속 누적됩니다. 기기 변경 대비로 반드시 <b>백업 다운로드</b>를 눌러 보관하세요.</div>
<div class="grid">
<section class="card"><div class="card-h"><h2>학생 목록</h2><button class="btn small primary" onclick="addStudent()">+ 학생</button></div><div class="body"><div class="toolbar"><input class="input" id="search" placeholder="이름 검색" oninput="renderList()"><button class="btn small" onclick="editAcademy()">학원명</button></div><div class="student-list" id="studentList"></div><div class="foot"><button class="btn" onclick="downloadBackup()">백업 다운로드</button><label class="btn" for="restoreFile">복원 업로드</label><input id="restoreFile" type="file" accept="application/json" style="display:none" onchange="restoreBackup(event)"></div></div></section>
<section class="card"><div class="card-h"><h2 id="detailTitle">학생을 선택하세요</h2><div><button class="btn small gold" onclick="makeReport()">학부모 리포트</button> <button class="btn small red" onclick="deleteStudent()">삭제</button></div></div><div class="body" id="detailBody"><div class="empty">왼쪽에서 학생을 누르거나 + 학생을 추가하세요.</div></div></section>
</div>
</div>
<div class="modal" id="reportModal"><div class="box"><div class="box-h"><b>학부모 전달용 문구</b><button class="btn small" onclick="closeReport()">닫기</button></div><div class="box-b"><textarea id="reportText"></textarea><div class="foot"><button class="btn primary" onclick="copyReport()">복사하기</button></div></div></div></div>
<div class="toast" id="toast"></div>
<script>
const KEY='gangdongmina-manager-v3-local-history';
let state={academy:'○○영어학원',students:[]};
let selectedId=null;
let selectedDate=today();
function today(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function uid(){return 's_'+Date.now().toString(36)+'_'+Math.random().toString(36).slice(2,7)}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1700)}
function load(){try{const raw=localStorage.getItem(KEY); if(raw) state=JSON.parse(raw)}catch(e){console.error(e)} if(!state.students.length){state.students=[sample('김서연','중2'),sample('이준호','중1'),sample('박지민','초6')]; save()} document.getElementById('academyTitle').textContent=state.academy; renderList();}
function save(){localStorage.setItem(KEY,JSON.stringify(state));}
function sample(name,grade){return {id:uid(),name,grade,phone:'',school:'',risk:'하',memo:'',next:'',records:{}}}
function getStudent(){return state.students.find(s=>s.id===selectedId)}
function getRecord(s,date=selectedDate){if(!s.records) s.records={}; if(!s.records[date]) s.records[date]={att:'',hw:'',vocab:'',level:'',mock:'',note:'',savedAt:''}; return s.records[date]}
function latestRecord(s){const dates=Object.keys(s.records||{}).sort().reverse();return dates.length?s.records[dates[0]]:{} }
function renderList(){const q=document.getElementById('search').value.trim();const box=document.getElementById('studentList');let arr=state.students.filter(s=>!q||s.name.includes(q));arr.sort((a,b)=>a.name.localeCompare(b.name,'ko')); if(!arr.length){box.innerHTML='<div class="empty">학생이 없습니다.</div>';return} box.innerHTML=arr.map(s=>{const r=latestRecord(s);const cls=s.risk==='상'?'high':s.risk==='중'?'mid':'low';return `<div class="stu ${s.id===selectedId?'on':''}" onclick="selectStudent('${s.id}')"><div class="top"><span class="name">${esc(s.name)}</span><span class="pill ${cls}">${s.risk}</span></div><div class="meta">${esc(s.grade||'-')} · 최근 출결 ${r.att||'-'} · 최근 숙제 ${r.hw||'-'}</div></div>`}).join('')}
function selectStudent(id){selectedId=id;selectedDate=today();renderList();renderDetail()}
function addStudent(){const s={id:uid(),name:'새 학생',grade:'',phone:'',school:'',risk:'하',memo:'',next:'',records:{}};state.students.push(s);selectedId=s.id;selectedDate=today();save();renderList();renderDetail();setTimeout(()=>document.getElementById('name')?.select(),80)}
function setStudentField(k,v){const s=getStudent(); if(!s)return; s[k]=v; save(); renderList(); if(k==='name') document.getElementById('detailTitle').textContent=v||'새 학생'}
function setRecordField(k,v){const s=getStudent(); if(!s)return; const r=getRecord(s); r[k]=v; save(); renderList();}
function setRisk(r){const s=getStudent(); if(!s)return; s.risk=r; save(); renderList(); renderDetail()}
function saveDateRecord(){const s=getStudent(); if(!s)return; const r=getRecord(s); r.savedAt=new Date().toLocaleString('ko-KR'); save(); renderDetail(); renderList(); toast(selectedDate+' 기록 저장 완료')}
function renderDetail(){const s=getStudent(); if(!s){document.getElementById('detailBody').innerHTML='<div class="empty">학생을 선택하세요.</div>';return} document.getElementById('detailTitle').textContent=s.name||'새 학생'; const r=getRecord(s); const riskBtn=x=>`<button class="btn ${s.risk===x?'on':''}" data-r="${x}" onclick="setRisk('${x}')">${x}</button>`; const dates=Object.keys(s.records||{}).sort().reverse(); document.getElementById('detailBody').innerHTML=`
<div class="split"><div><div class="field"><label>학생 이름</label><input class="input" id="name" value="${esc(s.name)}" oninput="setStudentField('name',this.value)"></div></div><div><div class="field"><label>학년</label><input class="input" value="${esc(s.grade)}" placeholder="예: 중2" oninput="setStudentField('grade',this.value)"></div></div></div>
<div class="split"><div class="field"><label>학교</label><input class="input" value="${esc(s.school)}" placeholder="예: 천일중" oninput="setStudentField('school',this.value)"></div><div class="field"><label>연락처/메모용</label><input class="input" value="${esc(s.phone)}" oninput="setStudentField('phone',this.value)"></div></div>
<div class="field"><label>퇴원위험도</label><div class="riskrow">${riskBtn('하')}${riskBtn('중')}${riskBtn('상')}</div></div>
<hr style="border:none;border-top:1px solid var(--line);margin:14px 0">
<div class="field"><label>기록 날짜 — 과거/미래 날짜 모두 선택 가능</label><input class="input mono" type="date" value="${selectedDate}" onchange="selectedDate=this.value;renderDetail()"></div>
<div class="scoregrid"><div class="field"><label>출결</label><input class="input mono" value="${esc(r.att)}" placeholder="예: 출석/결석/96%" oninput="setRecordField('att',this.value)"></div><div class="field"><label>숙제</label><input class="input mono" value="${esc(r.hw)}" placeholder="예: 완료/70%" oninput="setRecordField('hw',this.value)"></div><div class="field"><label>단어</label><input class="input mono" value="${esc(r.vocab)}" placeholder="점수" oninput="setRecordField('vocab',this.value)"></div><div class="field"><label>레벨</label><input class="input mono" value="${esc(r.level)}" placeholder="점수" oninput="setRecordField('level',this.value)"></div><div class="field"><label>내신/모고</label><input class="input mono" value="${esc(r.mock)}" placeholder="점수" oninput="setRecordField('mock',this.value)"></div></div>
<div class="field"><label>이 날짜 수업/상담 기록</label><textarea rows="4" placeholder="오늘 수업 내용, 숙제 미제출 사유, 상담 메모 등" oninput="setRecordField('note',this.value)">${esc(r.note)}</textarea></div>
<div class="field"><label>다음 상담 예정일</label><input class="input mono" type="date" value="${esc(s.next)}" oninput="setStudentField('next',this.value)"></div>
<div class="field"><label>학생 고정 메모</label><textarea rows="3" placeholder="성향, 학부모 특이사항, 장기 지도 방향" oninput="setStudentField('memo',this.value)">${esc(s.memo)}</textarea></div>
<div class="foot"><button class="btn primary" onclick="saveDateRecord()">오늘/선택 날짜 기록 저장</button><button class="btn" onclick="clearDateRecord()">선택 날짜 기록 삭제</button></div>
<h3 style="font-size:.95rem;margin:20px 0 8px">날짜별 누적 기록</h3>
${dates.length?`<table class="history"><thead><tr><th>날짜</th><th>출결</th><th>숙제</th><th>점수</th><th>기록</th><th></th></tr></thead><tbody>${dates.map(d=>{const x=s.records[d];return `<tr><td class="mono">${d}</td><td>${esc(x.att||'-')}</td><td>${esc(x.hw||'-')}</td><td>단어 ${esc(x.vocab||'-')} / 레벨 ${esc(x.level||'-')} / 내신 ${esc(x.mock||'-')}</td><td>${esc(x.note||'')}</td><td><button class="btn small" onclick="selectedDate='${d}';renderDetail()">열기</button></td></tr>`}).join('')}</tbody></table>`:'<div class="empty">아직 저장된 날짜 기록이 없습니다.</div>'}`}
function clearDateRecord(){const s=getStudent(); if(!s)return; if(!s.records||!s.records[selectedDate]){toast('삭제할 기록이 없어요');return} if(confirm(selectedDate+' 기록을 삭제할까요?')){delete s.records[selectedDate]; save(); renderDetail(); renderList(); toast('삭제 완료')}}
function deleteStudent(){const s=getStudent(); if(!s)return; if(confirm('학생 '+s.name+' 을/를 삭제할까요?')){state.students=state.students.filter(x=>x.id!==s.id);selectedId=null;save();renderList();document.getElementById('detailTitle').textContent='학생을 선택하세요';document.getElementById('detailBody').innerHTML='<div class="empty">학생을 선택하세요.</div>';}}
function editAcademy(){const v=prompt('학원 이름',state.academy); if(v&&v.trim()){state.academy=v.trim();document.getElementById('academyTitle').textContent=state.academy;save()}}
function downloadBackup(){const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='manager-backup-'+today()+'.json';a.click();URL.revokeObjectURL(a.href);toast('백업 파일 다운로드')}
function restoreBackup(e){const f=e.target.files[0]; if(!f)return; const reader=new FileReader(); reader.onload=()=>{try{const data=JSON.parse(reader.result); if(!data.students) throw new Error('bad'); if(confirm('현재 데이터를 백업 파일 내용으로 교체할까요?')){state=data;selectedId=null;save();document.getElementById('academyTitle').textContent=state.academy||'○○영어학원';renderList();document.getElementById('detailBody').innerHTML='<div class="empty">복원 완료. 학생을 선택하세요.</div>';toast('복원 완료')}}catch(err){alert('백업 파일 형식이 맞지 않습니다.')}};reader.readAsText(f);e.target.value=''}
function makeReport(){const s=getStudent(); if(!s){toast('학생을 먼저 선택하세요');return} const dates=Object.keys(s.records||{}).sort().reverse(); const recent=dates.slice(0,5); let txt=`[${state.academy}] ${s.name} 학생 학습 리포트\n작성일: ${today()}\n\n`; if(s.grade)txt+=`학년: ${s.grade}\n`; if(s.school)txt+=`학교: ${s.school}\n`; if(s.next)txt+=`다음 상담 예정: ${s.next}\n`; txt+='\n[최근 기록]\n'; if(!recent.length)txt+='아직 저장된 기록이 없습니다.\n'; recent.forEach(d=>{const r=s.records[d];txt+=`- ${d}: 출결 ${r.att||'-'}, 숙제 ${r.hw||'-'}, 단어 ${r.vocab||'-'}, 레벨 ${r.level||'-'}, 내신/모고 ${r.mock||'-'}\n`; if(r.note)txt+=`  코멘트: ${r.note}\n`}); if(s.memo)txt+=`\n[지도 메모]\n${s.memo}\n`; txt+='\n늘 관심 갖고 지도하겠습니다. 감사합니다.'; document.getElementById('reportText').value=txt; document.getElementById('reportModal').classList.add('open')}
function closeReport(){document.getElementById('reportModal').classList.remove('open')}
function copyReport(){const t=document.getElementById('reportText');t.select();navigator.clipboard?.writeText(t.value).then(()=>toast('복사 완료')).catch(()=>{document.execCommand('copy');toast('복사 완료')})}
load();
</script>
</body>
</html>
