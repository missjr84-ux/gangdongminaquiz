<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>원장 관리 콘솔 — 학년별 학생 관리</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gothic+A1:wght@600;700;800;900&family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#EBEEEA;--surface:#fff;--surface2:#F6F8F5;--ink:#1E2C34;--soft:#5C6B71;--line:#DDE3DD;--accent:#1F7A6B;--accent2:#E1F0EB;--gold:#B0831A;--gold2:#FBF1D9;--red:#C0392B;--red2:#FBE6E2;--mid:#C2891B;--mid2:#FBF0D7;--r:14px;--shadow:0 1px 3px rgba(30,44,52,.06),0 8px 24px rgba(30,44,52,.05)}
*{box-sizing:border-box;margin:0;padding:0}body{font-family:'IBM Plex Sans KR',sans-serif;background:var(--bg);color:var(--ink);line-height:1.55}.app{max-width:1100px;margin:0 auto;padding:20px 16px 70px}.mono{font-family:'IBM Plex Mono',monospace}
header{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;margin-bottom:14px}h1{font-family:'Gothic A1',sans-serif;font-weight:900;font-size:1.45rem}.sub{font-size:.82rem;color:var(--soft);margin-top:4px}.topBtns{display:flex;gap:8px;flex-wrap:wrap}.pill{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:8px 13px;font-weight:700;font-size:.82rem;box-shadow:var(--shadow)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}.toolbar{display:flex;gap:9px;flex-wrap:wrap;margin:13px 0}.toolbar input,.toolbar select{font-family:inherit;border:1px solid var(--line);border-radius:11px;padding:10px 12px;background:#fff;font-size:.9rem}.toolbar input{flex:1;min-width:170px}.btn{font-family:inherit;border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:11px;padding:10px 13px;cursor:pointer;font-weight:700;font-size:.88rem}.btn:hover{border-color:var(--soft)}.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}.btn.danger{color:var(--red)}.btn.small{padding:5px 8px;border-radius:8px;font-size:.76rem}.btn.gold{background:var(--gold);border-color:var(--gold);color:#fff}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:14px 0}.stat{padding:13px 15px}.stat .k{font-size:.76rem;color:var(--soft);font-weight:700}.stat .v{font-family:'IBM Plex Mono',monospace;font-size:1.75rem;font-weight:700;line-height:1.1}.stat .v small{font-size:.8rem;color:var(--soft)}@media(max-width:720px){.stats{grid-template-columns:repeat(2,1fr)}}
.rhythm{padding:15px;margin-bottom:12px}.rhythmHead{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-bottom:10px}.rhythmHead b{color:var(--accent)}.strip{display:grid;grid-template-columns:repeat(31,1fr);gap:3px}.day{height:26px;border-radius:5px;background:var(--surface2);font-size:.55rem;display:flex;align-items:center;justify-content:center;color:var(--soft)}.day.cp{background:var(--gold2);color:var(--gold);box-shadow:inset 0 0 0 1.5px var(--gold);font-weight:700}.day.today{background:var(--accent);color:#fff;box-shadow:0 0 0 3px var(--accent2)}
.group{margin-bottom:12px;overflow:hidden}.groupHead{display:flex;align-items:center;justify-content:space-between;padding:12px 15px;background:var(--surface2);border-bottom:1px solid var(--line);cursor:pointer}.groupTitle{font-weight:900;font-family:'Gothic A1',sans-serif}.groupMeta{font-size:.8rem;color:var(--soft);font-weight:700}.rows{display:block}.group.closed .rows{display:none}.row{display:grid;grid-template-columns:1.35fr .7fr .7fr .8fr 1fr 92px;gap:8px;align-items:center;padding:12px 15px;border-bottom:1px solid var(--line);cursor:pointer}.row:last-child{border-bottom:0}.row:hover{background:var(--surface2)}.name{font-weight:800}.gradeBadge{font-size:.72rem;border:1px solid var(--line);background:#fff;border-radius:8px;padding:2px 7px;margin-left:6px;color:var(--soft)}.chip{display:inline-flex;align-items:center;justify-content:center;border-radius:999px;padding:3px 9px;font-size:.74rem;font-weight:900}.risk-low{background:var(--accent2);color:var(--accent)}.risk-mid{background:var(--mid2);color:var(--mid)}.risk-high{background:var(--red2);color:var(--red)}.todo{background:var(--gold2);color:var(--gold)}.done{background:var(--accent2);color:var(--accent)}.met{font-family:'IBM Plex Mono',monospace;font-weight:700}.moveBtns{display:flex;gap:4px;justify-content:flex-end}.empty{padding:35px 20px;text-align:center;color:var(--soft)}
@media(max-width:760px){.row{grid-template-columns:1fr auto;grid-template-areas:'name risk' 'info move';gap:8px}.row .nameCell{grid-area:name}.row .riskCell{grid-area:risk;text-align:right}.row .infoCell{grid-area:info;display:flex;gap:10px;font-size:.82rem;color:var(--soft);flex-wrap:wrap}.row .moveBtns{grid-area:move}.hideMobile{display:none}.strip{grid-template-columns:repeat(16,1fr)}}
.scrim{position:fixed;inset:0;background:rgba(20,30,36,.42);opacity:0;pointer-events:none;transition:.2s;z-index:40}.scrim.open{opacity:1;pointer-events:auto}.panel{position:fixed;right:0;top:0;height:100%;width:470px;max-width:94vw;background:#fff;box-shadow:-10px 0 40px rgba(20,30,36,.18);transform:translateX(100%);transition:.24s;z-index:50;display:flex;flex-direction:column}.panel.open{transform:translateX(0)}.panelHead{padding:17px 18px;border-bottom:1px solid var(--line);display:flex;gap:8px;justify-content:space-between}.panelBody{padding:16px 18px;overflow:auto;flex:1}.panelFoot{border-top:1px solid var(--line);padding:13px 18px;display:flex;gap:8px;flex-wrap:wrap}.x{border:0;background:var(--surface2);border-radius:9px;width:34px;height:34px;cursor:pointer}.field{margin-bottom:15px}.field label{display:block;font-weight:800;color:var(--soft);font-size:.8rem;margin-bottom:6px}.field input,.field select,.field textarea{width:100%;font-family:inherit;border:1px solid var(--line);border-radius:10px;padding:9px 11px;font-size:.92rem}.field textarea{min-height:78px;resize:vertical}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:9px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.history{border:1px solid var(--line);border-radius:12px;overflow:hidden}.hitem{padding:10px 12px;border-bottom:1px solid var(--line);background:#fff}.hitem:last-child{border-bottom:0}.hdate{font-family:'IBM Plex Mono',monospace;font-weight:800;color:var(--accent);font-size:.82rem}.hnote{font-size:.86rem;white-space:pre-wrap;color:var(--ink);margin-top:4px}.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;border-radius:11px;padding:11px 18px;font-weight:800;font-size:.88rem;opacity:0;pointer-events:none;transition:.2s;z-index:80}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.savenote{text-align:center;color:var(--soft);font-size:.75rem;margin-top:14px}.savenote b{color:var(--accent)}
</style>
</head>
<body>
<div class="app">
<header><div><h1 id="academyName">○○영어학원</h1><div class="sub">원장 관리 콘솔 · 학년별/반별 학생 관리 · 초1~중3 · 날짜별 누적 기록</div></div><div class="topBtns"><span class="pill">총 <b id="totalTop" class="mono">0</b>명</span><button class="btn" onclick="editAcademy()">학원명 수정</button></div></header>
<section class="card rhythm" id="rhythm"></section>
<section class="stats" id="stats"></section>
<div class="toolbar"><input id="search" placeholder="학생 이름 검색" oninput="render()"><select id="gradeFilter" onchange="render()"><option value="">전체 학년</option></select><button class="btn primary" onclick="addStudent()">+ 학생 추가</button><button class="btn" onclick="addGrade()">+ 학년/반 추가</button><button class="btn" onclick="exportBackup()">백업 다운로드</button><label class="btn" for="importFile">백업 복원</label><input id="importFile" type="file" accept=".json" style="display:none" onchange="importBackup(event)"></div>
<div id="groups"></div><p class="savenote">💾 이 버전은 GitHub Pages에서도 동작하는 <b>localStorage</b> 저장 방식입니다. 중요한 데이터는 주기적으로 백업 다운로드하세요.</p>
</div>
<div id="scrim" class="scrim" onclick="closePanel()"></div><aside id="panel" class="panel"></aside><div id="toast" class="toast"></div>
<script>
const KEY='manager-v6-custom-grade-groups-local';
const DEFAULT_GRADES=['초1','초2','초3','초4','초5','초6','중1','중2','중3'];
let state={academy:'○○영어학원',grades:[...DEFAULT_GRADES],collapsed:{},students:[]};let openId=null;
function getGrades(){if(!state.grades||!Array.isArray(state.grades)||state.grades.length===0)state.grades=[...DEFAULT_GRADES];return state.grades;}
const sample=[
{name:'김서연',grade:'중2',att:96,hw:88,mock:84,level:90,vocab:95,risk:'하',memo:'성실하고 단어 암기 우수.',history:{}},
{name:'이준호',grade:'중1',att:74,hw:55,mock:62,level:68,vocab:60,risk:'상',memo:'결석·과제 누락 관리 필요.',history:{}},
{name:'박지민',grade:'초6',att:90,hw:80,mock:0,level:75,vocab:82,risk:'중',memo:'기초 문법 보강 중.',history:{}}
];
function uid(){return 's'+Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function today(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function save(){localStorage.setItem(KEY,JSON.stringify(state))}
function load(){try{const raw=localStorage.getItem(KEY);if(raw){state=JSON.parse(raw)}else{state={academy:'○○영어학원',collapsed:{},students:sample.map((s,i)=>({...s,id:uid(),order:i+1,checked:''}))};save()}}catch(e){alert('저장 데이터 읽기 오류. 백업 파일이 있으면 복원하세요.');}
 if(!state.collapsed)state.collapsed={}; if(!state.students)state.students=[]; if(!state.grades||!Array.isArray(state.grades))state.grades=[...DEFAULT_GRADES]; DEFAULT_GRADES.forEach(g=>{if(!state.grades.includes(g))state.grades.push(g)}); state.students.forEach((s,i)=>{if(s.order==null)s.order=i+1;if(!s.history)s.history={};if(!s.grade)s.grade=state.grades[0]||'초1'; if(!state.grades.includes(s.grade))state.grades.push(s.grade)}); renderAll()}
function gradeOrder(g){let i=getGrades().indexOf(g);return i<0?999:i}
function groupedStudents(){let q=document.getElementById('search')?.value.trim()||'';let gf=document.getElementById('gradeFilter')?.value||'';let arr=state.students.filter(s=>(!q||s.name.includes(q))&&(!gf||s.grade===gf));arr.sort((a,b)=>gradeOrder(a.grade)-gradeOrder(b.grade)||(a.order||0)-(b.order||0));let map={};arr.forEach(s=>{let g=getGrades().includes(s.grade)?s.grade:(getGrades()[0]||'초1');(map[g]||(map[g]=[])).push(s)});return map}
function checkpointInfo(){const d=new Date(),y=d.getFullYear(),m=d.getMonth(),day=d.getDate(),ld=new Date(y,m+1,0).getDate();let active,next,alabel,nlabel;if(day<15){active=new Date(y,m,1);next=new Date(y,m,15);alabel=(m+1)+'월 초~중순';nlabel=(m+1)+'월 15일'}else{active=new Date(y,m,15);next=new Date(y,m,ld);alabel=(m+1)+'월 중순~말';nlabel=(m+1)+'월 말일'}return{y,m,day,ld,active,next,alabel,nlabel,dday:Math.max(0,Math.ceil((next-new Date(y,m,day))/(86400000)))}}
function isChecked(s){if(!s.checked)return false;return new Date(s.checked)>=checkpointInfo().active}
function renderAll(){renderGradeFilter();renderRhythm();render()}
function renderGradeFilter(){const sel=document.getElementById('gradeFilter');const cur=sel.value;sel.innerHTML='<option value="">전체 학년</option>'+getGrades().map(g=>`<option value="${esc(g)}">${esc(g)}</option>`).join('');if(getGrades().includes(cur))sel.value=cur}
function renderRhythm(){const ci=checkpointInfo();let cells='';for(let i=1;i<=ci.ld;i++){let cls='day';if(i===15||i===ci.ld)cls+=' cp';if(i===ci.day)cls+=' today';cells+=`<div class="${cls}">${i}</div>`}document.getElementById('rhythm').innerHTML=`<div class="rhythmHead"><b>이번 회차: ${ci.alabel}</b><span>다음 점검 ${ci.nlabel}까지 <b>D-${ci.dday}</b></span></div><div class="strip">${cells}</div>`;document.getElementById('academyName').textContent=state.academy}
function renderStats(){const st=state.students,total=st.length,due=st.filter(s=>!isChecked(s)).length,high=st.filter(s=>s.risk==='상').length,avg=total?Math.round(st.reduce((a,s)=>a+(+s.att||0),0)/total):0;document.getElementById('stats').innerHTML=`<div class="card stat"><div class="k">총 학생</div><div class="v">${total}<small> 명</small></div></div><div class="card stat"><div class="k">점검 대상</div><div class="v" style="color:var(--gold)">${due}<small> 명</small></div></div><div class="card stat"><div class="k">위험도 상</div><div class="v" style="color:var(--red)">${high}<small> 명</small></div></div><div class="card stat"><div class="k">평균 출결</div><div class="v">${avg}<small>%</small></div></div>`;document.getElementById('totalTop').textContent=total}
function render(){renderStats();const map=groupedStudents();let html='';getGrades().forEach(g=>{const arr=map[g]||[];const closed=!!state.collapsed[g];const avg=arr.length?Math.round(arr.reduce((a,s)=>a+(+s.att||0),0)/arr.length):0;const high=arr.filter(s=>s.risk==='상').length;html+=`<section class="card group ${closed?'closed':''}"><div class="groupHead"><div onclick="toggleGroup('${escAttr(g)}')" style="flex:1;cursor:pointer"><span class="groupTitle">${closed?'▶':'▼'} ${esc(g)}</span> <span class="groupMeta">${arr.length}명${arr.length?' · 평균출결 '+avg+'% · 위험 '+high+'명':' · 비어 있음'}</span></div><button class="btn small primary" onclick="event.stopPropagation();addStudent('${escAttr(g)}')">+ 이 학년에 추가</button></div><div class="rows">${arr.length?arr.map(s=>rowHtml(s)).join(''):'<div class="empty">이 학년에 등록된 학생이 없어요.</div>'}</div></section>`});document.getElementById('groups').innerHTML=html}
function rowHtml(s){const risk=s.risk==='상'?'risk-high':s.risk==='중'?'risk-mid':'risk-low';return `<div class="row" onclick="openPanel('${s.id}')"><div class="nameCell"><span class="name">${esc(s.name)}</span><span class="gradeBadge">${esc(s.grade||'기타')}</span></div><div class="riskCell"><span class="chip ${risk}">${s.risk||'하'}</span></div><div class="infoCell met">출결 ${s.att||0}%</div><div class="infoCell met hideMobile">과제 ${s.hw||0}%</div><div class="infoCell"><span class="chip ${isChecked(s)?'done':'todo'}">${isChecked(s)?'점검완료':'점검필요'}</span></div><div class="moveBtns" onclick="event.stopPropagation()"><button class="btn small" onclick="moveStudent('${s.id}',-1)">↑</button><button class="btn small" onclick="moveStudent('${s.id}',1)">↓</button></div></div>`}
function toggleGroup(g){state.collapsed[g]=!state.collapsed[g];save();render()}
function moveStudent(id,dir){const s=state.students.find(x=>x.id===id);if(!s)return;let same=state.students.filter(x=>(x.grade||'기타')===(s.grade||'기타')).sort((a,b)=>(a.order||0)-(b.order||0));let idx=same.findIndex(x=>x.id===id),j=idx+dir;if(j<0||j>=same.length)return;let tmp=same[idx].order;same[idx].order=same[j].order;same[j].order=tmp;save();render();toast('순서를 저장했어요')}
function addStudent(grade){const grades=getGrades();let g=grade||document.getElementById('gradeFilter')?.value||grades[0]||'초1';if(!grades.includes(g)){state.grades.push(g)}let max=Math.max(0,...state.students.filter(x=>x.grade===g).map(s=>s.order||0));let s={id:uid(),order:max+1,name:'새 학생',grade:g,att:0,hw:0,mock:0,level:0,vocab:0,risk:'하',memo:'',checked:'',history:{}};state.students.push(s);save();renderAll();openPanel(s.id);setTimeout(()=>{const inp=document.querySelector('#panel input');if(inp){inp.focus();inp.select();}},60)}
function addGrade(){let v=prompt('추가할 학년/반 이름을 입력하세요. 예: 초1A, 중2 내신반, 예비중');if(!v||!v.trim())return;v=v.trim();if(state.grades.includes(v)){toast('이미 있는 학년/반이에요');return}state.grades.push(v);state.collapsed[v]=false;save();renderAll();toast(v+' 그룹을 추가했어요')}
function openPanel(id){openId=id;const s=state.students.find(x=>x.id===id);if(!s)return;document.getElementById('panel').innerHTML=`<div class="panelHead"><div><b style="font-size:1.15rem">학생 상세</b><div style="font-size:.78rem;color:var(--soft)">수정하면 자동 저장됩니다</div></div><button class="x" onclick="closePanel()">✕</button></div><div class="panelBody"><div class="grid2"><div class="field"><label>이름</label><input value="${esc(s.name)}" oninput="setF('name',this.value)"></div><div class="field"><label>학년/반 그룹</label><select onchange="setF('grade',this.value,true)">${getGrades().map(g=>`<option ${s.grade===g?'selected':''}>${esc(g)}</option>`).join('')}</select></div></div><div class="grid2"><div class="field"><label>출결률</label><input type="number" min="0" max="100" value="${s.att||0}" oninput="setF('att',+this.value)"></div><div class="field"><label>과제 제출률</label><input type="number" min="0" max="100" value="${s.hw||0}" oninput="setF('hw',+this.value)"></div></div><div class="grid3"><div class="field"><label>모의</label><input type="number" value="${s.mock||''}" oninput="setF('mock',+this.value)"></div><div class="field"><label>레벨</label><input type="number" value="${s.level||''}" oninput="setF('level',+this.value)"></div><div class="field"><label>단어</label><input type="number" value="${s.vocab||''}" oninput="setF('vocab',+this.value)"></div></div><div class="field"><label>위험도</label><select onchange="setF('risk',this.value)"><option ${s.risk==='하'?'selected':''}>하</option><option ${s.risk==='중'?'selected':''}>중</option><option ${s.risk==='상'?'selected':''}>상</option></select></div><div class="field"><label>상담/지도 메모</label><textarea oninput="setF('memo',this.value)">${esc(s.memo||'')}</textarea></div><div class="field"><label>날짜별 기록 추가/수정</label><div class="grid2"><input id="recDate" type="date" value="${today()}"><button class="btn primary" onclick="saveDayRecord()">오늘/선택 날짜 기록 저장</button></div></div><div class="field"><textarea id="recNote" placeholder="예: 결석, 숙제 미제출, 단어 80점, 학부모 상담 필요"></textarea></div><div class="field"><label>날짜별 누적 기록</label><div class="history" id="historyBox">${historyHtml(s)}</div></div></div><div class="panelFoot"><button class="btn primary" onclick="markChecked()">이번 회차 점검 완료</button><button class="btn gold" onclick="makeReport()">리포트 복사</button><button class="btn danger" onclick="deleteStudent()">삭제</button></div>`;document.getElementById('scrim').classList.add('open');document.getElementById('panel').classList.add('open')}
function closePanel(){openId=null;document.getElementById('scrim').classList.remove('open');document.getElementById('panel').classList.remove('open')}
function setF(f,v,reorder=false){const s=state.students.find(x=>x.id===openId);if(!s)return;s[f]=v;if(reorder){let max=Math.max(0,...state.students.filter(x=>x.grade===v).map(x=>x.order||0));s.order=max+1}save();render();renderRhythm()}
function saveDayRecord(){const s=state.students.find(x=>x.id===openId);if(!s)return;const d=document.getElementById('recDate').value||today();const note=document.getElementById('recNote').value.trim();if(!note){toast('기록 내용을 입력해 주세요');return}if(!s.history)s.history={};s.history[d]=note;s.checked=d;save();document.getElementById('recNote').value='';document.getElementById('historyBox').innerHTML=historyHtml(s);render();toast('날짜별 기록을 저장했어요')}
function historyHtml(s){const h=s.history||{};const keys=Object.keys(h).sort().reverse();if(keys.length===0)return '<div class="hitem"><span style="color:var(--soft)">아직 날짜별 기록이 없어요.</span></div>';return keys.map(k=>`<div class="hitem"><div class="hdate">${k}</div><div class="hnote">${esc(h[k])}</div><button class="btn small danger" onclick="deleteRecord('${k}')">기록 삭제</button></div>`).join('')}
function deleteRecord(d){const s=state.students.find(x=>x.id===openId);if(!s)return;if(!confirm(d+' 기록을 삭제할까요?'))return;delete s.history[d];save();document.getElementById('historyBox').innerHTML=historyHtml(s);render()}
function markChecked(){const s=state.students.find(x=>x.id===openId);if(!s)return;s.checked=today();save();render();toast('점검 완료로 표시했어요')}
function deleteStudent(){const s=state.students.find(x=>x.id===openId);if(!s)return;if(!confirm('삭제하면 되돌릴 수 없어요. 삭제할까요?'))return;state.students=state.students.filter(x=>x.id!==openId);save();closePanel();render();toast('삭제했어요')}
function makeReport(){const s=state.students.find(x=>x.id===openId);if(!s)return;let last=Object.keys(s.history||{}).sort().reverse()[0];let r=`[${state.academy}] ${s.name} 학생 학습 리포트\n${today()}\n\n▸ 학년: ${s.grade}\n▸ 출결률: ${s.att||0}%\n▸ 과제 제출률: ${s.hw||0}%\n▸ 모의/레벨/단어: ${s.mock||'-'} / ${s.level||'-'} / ${s.vocab||'-'}\n\n[원장 코멘트]\n${s.memo||''}\n`;if(last)r+=`\n[최근 기록 ${last}]\n${s.history[last]}\n`;navigator.clipboard?.writeText(r).then(()=>toast('리포트를 복사했어요')).catch(()=>{prompt('복사해서 카톡에 붙여넣으세요',r)})}
function editAcademy(){let v=prompt('학원명을 입력하세요',state.academy);if(v&&v.trim()){state.academy=v.trim();save();renderRhythm()}}
function exportBackup(){const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='student-manager-backup-'+today()+'.json';a.click();URL.revokeObjectURL(a.href)}
function importBackup(e){const f=e.target.files[0];if(!f)return;const rd=new FileReader();rd.onload=()=>{try{const data=JSON.parse(rd.result);if(!data.students)throw new Error('bad');state=data;if(!state.collapsed)state.collapsed={};save();renderAll();toast('백업을 복원했어요')}catch(err){alert('백업 파일 형식이 맞지 않습니다.')}};rd.readAsText(f);e.target.value=''}
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function escAttr(s){return String(s==null?'':s).replace(/\\/g,'\\\\').replace(/'/g,"\\'").replace(/"/g,'&quot;')}
let tt;function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('show'),1800)}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closePanel()});load();
</script>
</body>
