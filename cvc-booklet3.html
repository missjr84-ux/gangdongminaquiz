<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CVC Booklet 3 · 준티숏북롱북</title>
<link href="https://fonts.googleapis.com/css2?family=Lora:wght@500;700&family=Noto+Sans+KR:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#2b2b2b;--pink:#f5306f;--blue:#5b8def;--red:#f0245b;--gray:#bdbdbd;--line:#c4c4c4;--paper:#fff;--soft:#fff0f4;--softblue:#eef4ff}
*{box-sizing:border-box}
html,body{margin:0;background:#f6f6f6;color:var(--ink);font-family:"Noto Sans KR",sans-serif;-webkit-tap-highlight-color:transparent}
.serif{font-family:Lora,Georgia,serif}
.page{max-width:760px;margin:0 auto;background:var(--paper);min-height:100vh;box-shadow:0 0 0 1px #e8e8e8}
header{padding:22px 20px 12px;text-align:center;border-bottom:1px dotted var(--line)}
.dots{display:flex;justify-content:center;gap:14px;margin-bottom:6px}
.dots i{width:9px;height:9px;border-radius:50%;border:2px solid var(--blue);display:block}.dots i:nth-child(2){border-color:var(--pink)}
h1{margin:0;font-family:Lora,serif;font-weight:700;font-size:34px;line-height:1.05}
h1 b{color:var(--blue)}h1 b.v{color:var(--pink)}h1 span{display:block;font-weight:500;font-size:26px}
.brand{font-size:11px;color:#777;margin-top:6px}
nav{display:flex;border-bottom:1px dotted var(--line);position:sticky;top:0;background:#fff;z-index:5}
nav button{flex:1;border:0;background:none;padding:12px 4px;font:700 13px "Noto Sans KR";color:#888;border-bottom:3px solid transparent;cursor:pointer}
nav button.on{color:var(--ink);border-color:var(--pink)}
section{display:none;padding:14px 16px 40px}section.on{display:block}
.fams{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.fams button{border:2px solid var(--pink);background:#fff;color:var(--pink);border-radius:999px;padding:6px 14px;font:700 15px Lora,serif;cursor:pointer}
.fams button.on{background:var(--pink);color:#fff}
.tools{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px;align-items:center}
.tools .lab{font-size:12px;color:#777;margin-right:2px}
.tg{border:1.5px solid #ccc;background:#fff;border-radius:8px;padding:6px 10px;font:700 12px "Noto Sans KR";cursor:pointer;color:#666}
.tg.on{border-color:var(--ink);color:var(--ink);background:#f3f3f3}
.hero{display:flex;align-items:center;gap:14px;padding:10px 6px 14px}
.hero .ic{width:110px;height:110px}.hero .w{font:700 30px Lora,serif}
.hero button{margin-left:auto}
.spk{border:0;background:var(--softblue);color:var(--blue);border-radius:50%;width:40px;height:40px;font-size:18px;cursor:pointer;flex:none}
.spk:active{transform:scale(.92)}
.pinkbox{background:var(--pink);color:#fff;text-align:center;font:500 26px Lora,serif;padding:14px 8px;letter-spacing:.5px;margin:0 -16px 12px}
.rows{margin-bottom:14px}
.row{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px dotted var(--line)}
.num{width:26px;height:26px;border-radius:50%;background:var(--ink);color:#fff;font:700 13px Arial;display:flex;align-items:center;justify-content:center;flex:none}
.row .ws{display:flex;gap:6px;flex-wrap:wrap;flex:1}
.wchip{border:0;background:none;font:700 17px Lora,serif;color:var(--ink);cursor:pointer;padding:4px 6px;border-radius:6px}
.wchip:hover,.wchip:active{background:var(--soft)}
.vowel{color:var(--red)}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media(min-width:520px){.grid{grid-template-columns:repeat(4,1fr)}}
.card{position:relative;border:1px dotted var(--line);border-radius:6px;padding:12px 8px 10px;text-align:center;cursor:pointer;background:#fff;user-select:none;min-height:190px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px}
.card .num{position:absolute;left:8px;top:8px;width:22px;height:22px;font-size:11px}
.card .ic{width:100px;height:100px}
.card .word{font:700 26px Lora,serif;letter-spacing:.22em;white-space:nowrap}
.card .word .l{display:inline-block;position:relative;padding:0 1px}
.card.trace .word{color:var(--gray)}.card.trace .word .vowel{color:#e9b3c1}
.card.hidepic .ic{display:none}.card.hideword .word{display:none}
.card.circles .l::before{content:"";position:absolute;left:-2px;right:-2px;top:-4px;bottom:-4px;border:2px solid var(--blue);border-radius:50%}
.card.circles .l.vowel::before{border-color:var(--red)}
.card.circles .l.pair::before{border-radius:14px}
.card .ic.blank{background:var(--soft);border-radius:8px}
.card.speaking{box-shadow:0 0 0 3px var(--pink) inset}
.help{font-size:12.5px;color:#666;line-height:1.55;margin:4px 0 12px}
/* games */
.gbar{display:flex;align-items:center;gap:10px;margin-bottom:12px;font-size:13px}
.gbar .score{margin-left:auto;font:700 16px Lora,serif}
.big{border:0;background:var(--ink);color:#fff;border-radius:10px;padding:12px 18px;font:700 15px "Noto Sans KR";cursor:pointer}
.big.pink{background:var(--pink)}.big.ghost{background:#fff;color:var(--ink);border:2px solid var(--ink)}
.choices{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.choice{border:2px dotted var(--line);border-radius:8px;padding:12px;text-align:center;cursor:pointer;background:#fff}
.choice .ic{width:110px;height:110px;margin:0 auto}
.choice.ok{border:3px solid #3cb371;background:#f0fff4}.choice.no{border:3px solid var(--red);background:#fff4f6;animation:shake .3s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.boxes{display:flex;justify-content:center;gap:12px;margin:12px 0 16px}
.box{width:64px;height:64px;border:2px dotted var(--blue);border-radius:10px;display:flex;align-items:center;justify-content:center;font:700 30px Lora,serif}
.box.v{border-color:var(--pink)}.box.empty{background:var(--softblue)}
.box.filled{border-style:solid}
.letters{display:flex;justify-content:center;gap:12px;flex-wrap:wrap}
.letter{width:58px;height:58px;border-radius:50%;border:2px dotted var(--blue);background:#fff;font:700 26px Lora,serif;cursor:pointer;color:var(--ink)}
.letter.no{border-color:var(--red);color:var(--red)}.letter.ok{background:var(--blue);color:#fff;border-style:solid}
.mem{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.mem .m{aspect-ratio:1;border:1px dotted var(--line);border-radius:8px;display:flex;align-items:center;justify-content:center;background:#fff;cursor:pointer;font:700 20px Lora,serif;letter-spacing:.1em}
.mem .m.down{background:var(--pink);border-color:var(--pink);color:transparent}.mem .m.down *{color:transparent}.mem .m.down svg{visibility:hidden}
.mem .m.done{opacity:.35;pointer-events:none}
.mem .m svg{width:80%;height:80%}
.done{text-align:center;padding:30px 10px;font:700 24px Lora,serif}
.done small{display:block;font:500 14px "Noto Sans KR";color:#777;margin-top:8px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:999px;font-size:13px;opacity:0;transition:.3s;pointer-events:none}
.toast.on{opacity:1}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="page">
<header>
  <div class="dots"><i></i><i></i><i></i></div>
  <h1><b>C</b><b class="v">V</b><b>C</b><span>Booklet 3</span></h1>
  <div class="brand">준티숏북롱북 · 그림이나 단어를 누르면 소리가 나요 🔊</div>
</header>
<nav>
  <button class="on" data-s="learn">카드 학습</button>
  <button data-s="listen">듣고 찾기</button>
  <button data-s="fill">빈칸 채우기</button>
  <button data-s="match">짝 맞추기</button>
</nav>

<section id="learn" class="on">
  <div class="fams" id="famBtns"></div>
  <div class="hero" id="hero"></div>
  <div class="pinkbox" id="pinkbox"></div>
  <div class="rows" id="rows"></div>
  <div class="tools">
    <span class="lab">카드 보기</span>
    <button class="tg on" data-mode="both">그림+글자</button>
    <button class="tg" data-mode="pic">그림만</button>
    <button class="tg" data-mode="trace">연한 글자</button>
    <button class="tg" data-mode="word">글자만</button>
    <span class="lab" style="margin-left:6px">표시</span>
    <button class="tg on" id="tgVowel">모음 빨강</button>
    <button class="tg" id="tgCircle">자음○모음○</button>
    <button class="tg" id="tgSlow">천천히</button>
  </div>
  <div class="grid" id="cards"></div>
  <p class="help">카드를 누르면 단어를 읽어줘요. 그림만 보고 이름을 말한 뒤 "그림+글자"로 확인해 보세요.</p>
</section>

<section id="listen">
  <div class="gbar"><button class="big pink" id="lsPlay">🔊 다시 듣기</button><span>소리를 듣고 맞는 그림을 고르세요</span><span class="score" id="lsScore">0 / 0</span></div>
  <div id="lsArea"></div>
</section>

<section id="fill">
  <div class="gbar"><span>그림을 보고 빈칸에 들어갈 첫 글자를 고르세요</span><span class="score" id="flScore">0 / 0</span></div>
  <div id="flArea"></div>
</section>

<section id="match">
  <div class="gbar"><span>같은 짝(그림 ↔ 단어)을 찾으세요</span><button class="big ghost" id="mmNew" style="margin-left:auto">새 판</button></div>
  <div class="mem" id="mmArea"></div>
</section>
</div>
<div class="toast" id="toast"></div>

const GROUPS = [{"rep":"dog","repWord":"Dog","fam":["-og","-ock","-ob","-op"],"lists":[["Dog","Log","Fog","Jog"],["Sock","Rock","Lock","Clock"],["Cob","Job","Mob","Sob"],["Mop","Top","Hop","Pop"]],"pw":[["log","Log"],["sock","Sock"],["cob","Cob"],["mop","Mop"]]},{"rep":"bug","repWord":"Bug","fam":["-ug","-un","-um","-ut"],"lists":[["Bug","Mug","Hug","Rug"],["Sun","Run","Fun","Bun"],["Drum","Gum","Hum","Sum"],["Nut","Cut","Hut","Shut"]],"pw":[["mug","Mug"],["sun","Sun"],["drum","Drum"],["nut","Nut"]]},{"rep":"hen","repWord":"Hen","fam":["-ed","-en","-et","-eg"],"lists":[["Bed","Red","Fed","Wed"],["Hen","Pen","Ten","Men"],["Jet","Net","Pet","Wet"],["Leg","Peg","Beg","Keg"]],"pw":[["bed","Bed"],["ten","Ten"],["jet","Jet"],["leg","Leg"]]},{"rep":"duck","repWord":"Duck","fam":["-ub","-ud","-uck","-ust"],"lists":[["Tub","Cub","Sub","Rub"],["Mud","Bud","Dud"],["Duck","Truck","Luck","Buck"],["Dust","Must","Rust","Just"]],"pw":[["tub","Tub"],["mud","Mud"],["truck","Truck"],["dust","Dust"]]}];
const $ = s => document.querySelector(s);
const isV = c => 'aeiou'.includes(c.toLowerCase());
const PAIRS = ['ck','ll','ss'];
let gi = 0, mode = 'both', showV = true, circles = false, slow = false;

/* ---- speech ---- */
let voice = null, unlocked = false;
function pickVoice(){ const vs = speechSynthesis.getVoices(); voice = vs.find(v=>/en[-_]US/i.test(v.lang) && /Google|Samantha|Aria|Jenny|Zira/i.test(v.name)) || vs.find(v=>/^en/i.test(v.lang)) || null; }
if ('speechSynthesis' in window){ pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }
function unlock(){ if(unlocked||!('speechSynthesis' in window)) return; unlocked=true; const u=new SpeechSynthesisUtterance(' '); u.volume=0; speechSynthesis.speak(u); }
document.addEventListener('pointerdown', unlock, {once:true});
function speak(text, rate){
  if(!('speechSynthesis' in window)){ toast('이 브라우저는 소리 읽기를 지원하지 않아요'); return; }
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text); u.lang='en-US'; if(voice) u.voice=voice; u.rate = rate ?? (slow?0.6:0.85); u.pitch=1.05;
  speechSynthesis.speak(u);
}
function toast(m){ const t=$('#toast'); t.textContent=m; t.classList.add('on'); clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove('on'),1600); }

/* ---- helpers ---- */
function icon(n, cls='ic'){ return '<div class="'+cls+'">'+(ICONS[n]||'')+'</div>'; }
function vowelHTML(w){ return [...w].map(c=>isV(c)&&showV?'<span class="vowel">'+c+'</span>':c).join(''); }
function spacedHTML(w){
  const parts = w.match(/ck|ll|ss|./g);
  return parts.map(p=>'<span class="l'+(isV(p[0])?' vowel':'')+(p.length>1?' pair':'')+'">'+p+'</span>').join('');
}
const shuffle = a => a.map(x=>[Math.random(),x]).sort((a,b)=>a[0]-b[0]).map(x=>x[1]);
const allPics = GROUPS.flatMap(g=>[[g.rep,g.repWord],...g.pw]);

/* ---- learn ---- */
function renderFam(){
  $('#famBtns').innerHTML = GROUPS.map((g,i)=>'<button class="'+(i===gi?'on':'')+'" data-i="'+i+'">'+g.fam.join(' ')+'</button>').join('');
  const g = GROUPS[gi];
  $('#hero').innerHTML = icon(g.rep)+'<div class="w">'+vowelHTML(g.repWord)+'</div><button class="spk" aria-label="듣기">🔊</button>';
  $('#hero').querySelector('.spk').onclick = ()=>speak(g.repWord);
  $('#hero').querySelector('.ic').onclick = ()=>speak(g.repWord);
  $('#pinkbox').textContent = g.fam.slice(0,2).join(' / ')+'   ·   '+g.fam.slice(2).join(' / ');
  $('#rows').innerHTML = g.lists.map((ws,i)=>'<div class="row"><span class="num">'+(i+1)+'</span><div class="ws">'+ws.map(w=>'<button class="wchip" data-w="'+w+'">'+vowelHTML(w)+'</button>').join('')+'</div><button class="spk" data-all="'+ws.join(',')+'">🔊</button></div>').join('');
  renderCards();
}
function renderCards(){
  const g = GROUPS[gi];
  const cls = {both:'',pic:'hideword',trace:'trace',word:'hidepic'}[mode] + (circles?' circles':'');
  $('#cards').innerHTML = g.pw.map(([ic,w],i)=>'<div class="card '+cls+'" data-w="'+w+'"><span class="num">'+(i+1)+'</span>'+icon(ic)+'<div class="word">'+(showV?spacedHTML(w):spacedHTML(w).replace(/ vowel/g,''))+'</div></div>').join('');
}
$('#famBtns').onclick = e=>{ const b=e.target.closest('button'); if(!b) return; gi=+b.dataset.i; renderFam(); };
$('#rows').onclick = e=>{ const c=e.target.closest('.wchip'); if(c){ speak(c.dataset.w); return; } const s=e.target.closest('.spk'); if(s){ speak(s.dataset.all.replace(/,/g,'. '), slow?0.6:0.8); } };
$('#cards').onclick = e=>{ const c=e.target.closest('.card'); if(!c) return; speak(c.dataset.w); c.classList.add('speaking'); setTimeout(()=>c.classList.remove('speaking'),700); };
document.querySelectorAll('.tg[data-mode]').forEach(b=>b.onclick=()=>{ document.querySelectorAll('.tg[data-mode]').forEach(x=>x.classList.remove('on')); b.classList.add('on'); mode=b.dataset.mode; renderCards(); });
$('#tgVowel').onclick = e=>{ showV=!showV; e.target.classList.toggle('on',showV); renderFam(); };
$('#tgCircle').onclick = e=>{ circles=!circles; e.target.classList.toggle('on',circles); renderCards(); };
$('#tgSlow').onclick = e=>{ slow=!slow; e.target.classList.toggle('on',slow); };

/* ---- nav ---- */
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('nav button').forEach(x=>x.classList.remove('on')); b.classList.add('on');
  document.querySelectorAll('section').forEach(s=>s.classList.toggle('on', s.id===b.dataset.s));
  if(b.dataset.s==='listen'&&!LS.started) lsStart(); if(b.dataset.s==='fill'&&!FL.started) flStart(); if(b.dataset.s==='match'&&!MM.started) mmNew();
});

/* ---- game 1: listen & find ---- */
const LS = {started:false, q:[], i:0, score:0, cur:null, wrong:[]};
function lsStart(retry){ LS.started=true; LS.q = retry ? shuffle(LS.wrong) : shuffle(allPics); LS.wrong=[]; LS.i=0; LS.score=0; lsNext(); }
function lsNext(){
  if(LS.i>=LS.q.length){ $('#lsArea').innerHTML='<div class="done">'+LS.score+' / '+LS.q.length+'<small>'+(LS.wrong.length?'틀린 것만 다시 해볼까요?':'다 맞았어요! 🎉')+'</small><p><button class="big pink" onclick="lsStart('+(LS.wrong.length?'true':'false')+')">'+(LS.wrong.length?'틀린 것만 다시':'처음부터')+'</button></p></div>'; return; }
  LS.cur = LS.q[LS.i]; const [ic,w]=LS.cur;
  const others = shuffle(allPics.filter(p=>p[1]!==w)).slice(0,3);
  const opts = shuffle([LS.cur,...others]);
  $('#lsArea').innerHTML = '<div class="choices">'+opts.map(o=>'<div class="choice" data-w="'+o[1]+'">'+icon(o[0])+'</div>').join('')+'</div>';
  $('#lsScore').textContent = LS.score+' / '+LS.q.length;
  setTimeout(()=>speak(w),250);
  $('#lsArea').querySelectorAll('.choice').forEach(c=>c.onclick=()=>{
    if(c.classList.contains('ok')||c.classList.contains('no')) return;
    if(c.dataset.w===w){ c.classList.add('ok'); LS.score++; speak(w); c.insertAdjacentHTML('beforeend','<div class="serif" style="font-weight:700;font-size:22px;margin-top:6px">'+vowelHTML(w)+'</div>'); $('#lsScore').textContent=LS.score+' / '+LS.q.length; LS.i++; setTimeout(lsNext,1100); }
    else { c.classList.add('no'); if(!LS.wrong.includes(LS.cur)) LS.wrong.push(LS.cur); speak(w); }
  });
}
$('#lsPlay').onclick = ()=>{ if(LS.cur) speak(LS.cur[1]); };

/* ---- game 2: fill onset ---- */
const FL = {started:false,q:[],i:0,score:0,wrong:[]};
function flStart(retry){ FL.started=true; FL.q = retry? shuffle(FL.wrong):shuffle(allPics); FL.wrong=[]; FL.i=0; FL.score=0; flNext(); }
function onsetSplit(w){ const m = w.toLowerCase().match(/^([^aeiou]+)([aeiou])(.*)$/); return m?[m[1],m[2],m[3]]:['',w[0],w.slice(1)]; }
function flNext(){
  if(FL.i>=FL.q.length){ $('#flArea').innerHTML='<div class="done">'+FL.score+' / '+FL.q.length+'<small>'+(FL.wrong.length?'틀린 것만 다시 해볼까요?':'다 맞았어요! 🎉')+'</small><p><button class="big pink" onclick="flStart('+(FL.wrong.length?'true':'false')+')">'+(FL.wrong.length?'틀린 것만 다시':'처음부터')+'</button></p></div>'; return; }
  const cur = FL.q[FL.i], [ic,w]=cur, [on,v,end]=onsetSplit(w);
  const pool = ['b','c','d','f','g','h','j','l','m','n','p','r','s','t','w','dr','tr','sh'].filter(x=>x!==on);
  const opts = shuffle([on,...shuffle(pool).slice(0,3)]);
  $('#flArea').innerHTML = '<div style="text-align:center">'+icon(ic,'ic')+'<button class="spk" style="margin-top:4px">🔊</button></div><div class="boxes"><div class="box empty" id="flBox"></div><div class="box v">'+v+'</div><div class="box">'+end+'</div></div><div class="letters">'+opts.map(o=>'<button class="letter" data-o="'+o+'">'+o.toUpperCase()+'</button>').join('')+'</div>';
  $('#flArea .ic').style.cssText='width:120px;height:120px;margin:0 auto';
  $('#flArea .spk').onclick=()=>speak(w); $('#flScore').textContent=FL.score+' / '+FL.q.length;
  speak(w);
  let missed=false;
  $('#flArea').querySelectorAll('.letter').forEach(b=>b.onclick=()=>{
    if(b.dataset.o===on){ b.classList.add('ok'); const bx=$('#flBox'); bx.textContent=on.charAt(0).toUpperCase()+on.slice(1); bx.classList.remove('empty'); bx.classList.add('filled'); if(!missed) FL.score++; $('#flScore').textContent=FL.score+' / '+FL.q.length; speak(w); FL.i++; setTimeout(flNext,1100); }
    else { b.classList.add('no'); if(!missed){ missed=true; FL.wrong.push(cur); } speak(w); }
  });
}

/* ---- game 3: memory match ---- */
const MM = {started:false, first:null, lock:false, left:0};
function mmNew(){
  MM.started=true; MM.first=null; MM.lock=false;
  const picks = shuffle(allPics).slice(0,6); MM.left=6;
  const tiles = shuffle(picks.flatMap(p=>[{k:p[1],t:'p',ic:p[0]},{k:p[1],t:'w'}]));
  $('#mmArea').innerHTML = tiles.map(t=>'<div class="m down" data-k="'+t.k+'">'+(t.t==='p'?ICONS[t.ic]:vowelHTML(t.k))+'</div>').join('');
  $('#mmArea').querySelectorAll('.m').forEach(m=>m.onclick=()=>{
    if(MM.lock||!m.classList.contains('down')) return;
    m.classList.remove('down'); speak(m.dataset.k);
    if(!MM.first){ MM.first=m; return; }
    const a=MM.first; MM.first=null;
    if(a.dataset.k===m.dataset.k && a!==m){ a.classList.add('done'); m.classList.add('done'); MM.left--; if(MM.left===0) setTimeout(()=>{ toast('다 찾았어요! 🎉'); },300); }
    else { MM.lock=true; setTimeout(()=>{ a.classList.add('down'); m.classList.add('down'); MM.lock=false; },800); }
  });
}
$('#mmNew').onclick = mmNew;

renderFam();
</script>
