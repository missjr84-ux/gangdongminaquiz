<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate">
<title>Lesson 2+4 · 단어 & 대화문</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=Lora:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f7f6f2;--card:#fff;--card2:#f0eee7;
  --primary:#1a5c38;--primary-lt:#e8f4ed;--primary-dk:#0f3d25;
  --accent:#e8a020;--accent-lt:#fef3dc;
  --text:#1a1a1a;--muted:#6b6b6b;--border:#e0ddd5;
  --ok:#1a7a3c;--ok-bg:#e8f5ec;--no:#c0392b;--no-bg:#fdecea;
  --info:#1a5c9e;--info-bg:#e8f0fb;--r:12px;--shadow:0 2px 10px rgba(0,0,0,.08);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{background:var(--bg);color:var(--text);font-family:'Noto Sans KR',sans-serif;font-size:14px;line-height:1.7;padding-bottom:80px;}
.header{background:linear-gradient(135deg,var(--primary-dk),var(--primary));color:#fff;padding:16px 20px 0;position:sticky;top:0;z-index:30;box-shadow:0 2px 12px rgba(0,0,0,.2);}
.header-top{display:flex;align-items:center;gap:10px;margin-bottom:4px;}
.header h1{font-size:16px;font-weight:900;flex:1;}
.timer{background:rgba(255,255,255,.18);border-radius:20px;padding:4px 12px;font-size:12px;font-weight:700;white-space:nowrap;}
.header-sub{font-size:11px;opacity:.75;margin-bottom:8px;}
.tabs{display:flex;gap:4px;overflow-x:auto;padding-bottom:0;}
.tab{flex:1;min-width:64px;background:rgba(255,255,255,.12);border:none;color:rgba(255,255,255,.75);font-family:inherit;font-size:10px;font-weight:700;padding:10px 4px 12px;cursor:pointer;border-radius:10px 10px 0 0;text-align:center;white-space:nowrap;position:relative;}
.tab .sn{display:block;font-size:8px;opacity:.7;margin-bottom:2px;}
.tab.on{background:#fff;color:var(--primary);}
.tab .dot{position:absolute;top:6px;right:5px;width:7px;height:7px;background:var(--accent);border-radius:50%;display:none;}
.tab.done .dot{display:block;}
.wrap{max-width:760px;margin:0 auto;padding:16px;}
.page-enter{animation:pgIn .25s ease;}
@keyframes pgIn{from{opacity:0;transform:translateX(12px)}to{opacity:1;transform:none}}
.desc{background:var(--primary-lt);border-left:3px solid var(--primary);border-radius:0 var(--r) var(--r) 0;padding:11px 14px;font-size:13px;color:var(--primary);line-height:1.6;margin-bottom:14px;}
.desc b{color:var(--text);}
.prog-wrap{margin-bottom:14px;}
.prog-label{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-bottom:4px;font-weight:700;}
.prog-track{height:7px;background:var(--card2);border-radius:5px;overflow:hidden;}
.prog-fill{height:100%;background:linear-gradient(90deg,var(--primary),#2d9e5f);border-radius:5px;transition:width .4s;}
.glabel{font-size:11px;font-weight:900;color:var(--muted);letter-spacing:.05em;margin:18px 0 10px;padding-bottom:5px;border-bottom:1px solid var(--border);}
.l2b{display:inline-block;font-size:10px;font-weight:700;padding:2px 8px;border-radius:99px;background:#e8f0fb;color:var(--info);margin-right:5px;}
.l4b{display:inline-block;font-size:10px;font-weight:700;padding:2px 8px;border-radius:99px;background:var(--accent-lt);color:var(--accent);margin-right:5px;}
/* 단어 카드 */
.vocab-card{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:14px 16px;margin-bottom:9px;box-shadow:var(--shadow);}
.vc-top{display:flex;align-items:center;gap:8px;margin-bottom:7px;flex-wrap:wrap;}
.vc-num{font-size:10px;font-weight:700;color:var(--muted);}
.vc-blank{font-family:'Lora',serif;font-size:18px;font-weight:700;color:var(--primary);letter-spacing:2px;}
.vc-kr{font-size:13px;color:var(--muted);}
.mt0{font-size:9px;font-weight:700;padding:1px 6px;border-radius:4px;background:#e8f0fb;color:var(--info);}
.mt1{font-size:9px;font-weight:700;padding:1px 6px;border-radius:4px;background:var(--accent-lt);color:var(--accent);}
.mt2{font-size:9px;font-weight:700;padding:1px 6px;border-radius:4px;background:#f0eee7;color:var(--muted);}
/* 다의어 박스 */
.poly-box{background:var(--info-bg);border:1.5px solid #b0c8f0;border-radius:9px;padding:9px 13px;margin-bottom:8px;}
.poly-title{font-size:11px;font-weight:900;color:var(--info);margin-bottom:5px;}
.poly-row{font-size:12px;margin:2px 0;display:flex;gap:6px;}
.poly-num{font-weight:700;color:var(--info);flex-shrink:0;}
.poly-ex{font-family:'Lora',serif;font-size:12px;color:var(--text);}
.poly-note{font-size:11px;color:var(--no);font-weight:700;margin-top:4px;padding:4px 8px;background:var(--no-bg);border-radius:6px;}
/* 예외 경고 박스 */
.warn-box{background:#fff8dc;border:1.5px solid #f0c040;border-radius:9px;padding:8px 12px;margin-bottom:8px;font-size:12px;}
.warn-box .wt{font-weight:900;color:#8a5200;margin-bottom:3px;}
.warn-box .wr{font-family:'Lora',serif;}
.warn-box .wbad{color:var(--no);text-decoration:line-through;}
.warn-box .wgood{color:var(--ok);font-weight:700;}
/* 본문 문장 빈칸 */
.sent-box{background:var(--card2);border-radius:8px;padding:8px 12px;margin-bottom:8px;font-family:'Lora',serif;font-size:14px;line-height:2;}
.sent-box .sk{font-size:11px;color:var(--muted);font-family:'Noto Sans KR',sans-serif;display:block;margin-top:2px;}
.vc-inp{flex:1;padding:7px 11px;border:1.5px solid var(--border);border-radius:8px;font-family:'Lora',serif;font-size:14px;background:var(--card2);color:var(--text);outline:none;}
.vc-inp:focus{border-color:var(--primary);background:#fff;}
.vc-inp.ok{border-color:var(--ok);background:var(--ok-bg);color:var(--ok);}
.vc-inp.no{border-color:var(--no);background:var(--no-bg);}
.vc-inp-row{display:flex;gap:7px;align-items:center;margin-top:6px;}
.vc-fb{font-size:11px;margin-top:5px;padding:4px 9px;border-radius:6px;display:none;}
.vc-fb.ok{display:block;background:var(--ok-bg);color:var(--ok);}
.vc-fb.no{display:block;background:var(--no-bg);color:var(--no);}
/* 대화문 */
.dlg-sec{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:16px;margin-bottom:14px;box-shadow:var(--shadow);}
.dlg-title{font-size:13px;font-weight:900;color:var(--primary);margin-bottom:10px;}
.key-box{background:var(--primary-lt);border:1.5px solid var(--ok);border-radius:10px;padding:11px 14px;margin-bottom:12px;}
.key-main{font-family:'Lora',serif;font-size:16px;font-weight:700;color:var(--primary);margin-bottom:4px;}
.key-meaning{font-size:13px;font-weight:700;margin-bottom:3px;}
.key-usage{font-size:12px;color:var(--muted);}
.key-similar{margin-top:8px;padding-top:8px;border-top:1px solid #b2d8c2;}
.key-similar .ks-title{font-size:11px;font-weight:700;color:var(--ok);margin-bottom:5px;}
.key-similar .ks-item{font-family:'Lora',serif;font-size:13px;padding:3px 0;border-bottom:1px dashed var(--border);}
.key-similar .ks-item:last-child{border-bottom:none;}
.key-similar .ks-kr{font-size:11px;color:var(--muted);}
.dlg-lines{margin-bottom:12px;}
.dlg-line{display:flex;gap:8px;margin-bottom:5px;align-items:flex-start;}
.sp{font-size:11px;font-weight:700;color:#fff;border-radius:5px;padding:2px 7px;flex-shrink:0;margin-top:2px;white-space:nowrap;}
.spW{background:var(--primary);}.spB{background:var(--info);}.spG{background:#8e44ad;}
.spAlex{background:#e67e22;}.spKate{background:var(--no);}.spMinji{background:var(--ok);}
.spMsKim{background:#7f8c8d;}.spA{background:var(--primary);}
.dl-text{font-family:'Lora',serif;font-size:13px;line-height:1.7;}
/* 문제 */
.q-card{background:var(--card2);border-radius:10px;padding:13px;margin-bottom:10px;border:1px solid var(--border);}
.q-tag{font-size:10px;font-weight:700;padding:2px 8px;border-radius:99px;background:var(--info-bg);color:var(--info);margin-bottom:6px;display:inline-block;}
.q-tag.warn{background:#fff8dc;color:#8a5200;}
.q-text{font-size:13px;font-weight:700;margin-bottom:9px;line-height:1.6;}
.mc-opts{display:flex;flex-direction:column;gap:7px;}
.mc-opt{padding:9px 13px;border:1.5px solid var(--border);border-radius:9px;background:var(--card);font-size:13px;cursor:pointer;font-family:'Lora',serif;display:flex;gap:8px;align-items:flex-start;transition:.13s;line-height:1.6;}
.mc-opt:hover{border-color:var(--accent);}
.mc-opt .on{font-weight:900;color:var(--muted);min-width:18px;flex-shrink:0;}
.mc-opt.ok{border-color:var(--ok);background:var(--ok-bg);color:var(--ok);font-weight:700;}
.mc-opt.no{border-color:var(--no);background:var(--no-bg);color:var(--no);}
.mc-opt.rv{border-color:var(--ok);background:var(--ok-bg);opacity:.5;}
.q-fb{font-size:12px;margin-top:7px;padding:6px 10px;border-radius:7px;display:none;}
.q-fb.show.ok{display:block;background:var(--ok-bg);color:var(--ok);}
.q-fb.show.no{display:block;background:var(--no-bg);color:var(--no);}
/* 빈칸 인라인 */
.inline-inp{border:none;border-bottom:2px solid var(--accent);padding:0 4px;font-size:13px;font-family:'Lora',serif;background:transparent;color:var(--text);outline:none;vertical-align:bottom;min-width:80px;}
.inline-inp:focus{border-bottom-color:var(--primary);}
.inline-inp.ok{border-bottom-color:var(--ok);color:var(--ok);}
.inline-inp.no{border-bottom-color:var(--no);color:var(--no);}
/* 순서 맞추기 */
.chip-pool{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px;}
.ord-chip{padding:5px 10px;border:1.5px solid var(--border);border-radius:8px;font-size:12px;cursor:pointer;background:var(--card);font-family:'Lora',serif;transition:.13s;line-height:1.4;}
.ord-chip:hover{border-color:var(--accent);}
.ord-chip.used{opacity:.3;pointer-events:none;}
.ord-slots{display:flex;gap:5px;flex-wrap:wrap;min-height:36px;border:1.5px dashed var(--border);border-radius:9px;padding:5px 8px;background:var(--card);align-items:center;margin-bottom:7px;}
.ord-slot{padding:4px 10px;border:1.5px solid var(--primary);border-radius:6px;font-size:12px;background:var(--primary-lt);color:var(--primary);cursor:pointer;font-family:'Lora',serif;}
/* 삽입 위치 */
.ins-box{background:var(--accent-lt);border:1.5px solid var(--accent);border-radius:9px;padding:9px 13px;margin-bottom:10px;}
.ins-box .ilab{font-size:10px;font-weight:700;color:var(--accent);margin-bottom:3px;}
.ins-box .itext{font-family:'Lora',serif;font-size:13px;}
.ins-slot{display:flex;align-items:center;gap:7px;padding:3px 6px;border-radius:7px;cursor:pointer;margin-bottom:3px;transition:.13s;}
.ins-slot:hover{background:var(--accent-lt);}
.ins-slot.sel{background:var(--accent-lt);border:1.5px solid var(--accent);border-radius:7px;}
.ins-slot .arr{font-size:14px;color:var(--accent);opacity:.4;}
.ins-slot:hover .arr{opacity:1;}
.ins-slot .ilab2{font-size:11px;color:var(--muted);}
/* 버튼 */
.b{padding:8px 18px;border:none;border-radius:20px;font-family:inherit;font-size:12px;font-weight:700;cursor:pointer;}
.b1{background:var(--primary);color:#fff;}
.b2{background:var(--card2);color:var(--muted);border:1px solid var(--border);}
.mini-btn{padding:4px 11px;border:1px solid var(--border);border-radius:99px;font-size:11px;cursor:pointer;font-family:inherit;background:var(--card);color:var(--muted);}
.btn-row{display:flex;gap:7px;margin-top:9px;flex-wrap:wrap;align-items:center;}
.ans-r{display:none;margin-top:6px;padding:6px 10px;background:var(--ok-bg);border-radius:7px;font-size:12px;color:var(--ok);font-family:'Lora',serif;}
.ans-r.open{display:block;}
.check-bar{display:flex;gap:7px;flex-wrap:wrap;align-items:center;margin-top:14px;padding-top:10px;border-top:1px dashed var(--border);}
.cb{padding:7px 15px;border-radius:99px;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit;border:none;}
.cb-g{background:var(--primary);color:#fff;}
.cb-r{background:var(--card);border:1.5px solid var(--no);color:var(--no);}
.cb-r:disabled{opacity:.35;cursor:not-allowed;}
.cb-s{background:var(--card);border:1.5px solid var(--border);color:var(--muted);}
.result-pill{font-size:12px;font-weight:700;padding:5px 12px;border-radius:99px;display:none;}
.pill-ok{background:var(--ok-bg);color:var(--ok);}
.pill-bad{background:var(--accent-lt);color:var(--accent);}
.snd{display:inline-flex;align-items:center;background:none;border:1px solid var(--border);border-radius:99px;padding:3px 9px;font-size:11px;color:var(--muted);cursor:pointer;font-family:inherit;}
.snd:hover,.snd.playing{background:var(--primary-lt);border-color:var(--primary);color:var(--primary);}
.tag-line{font-size:11px;color:var(--muted);text-align:center;margin-top:20px;}
@media(max-width:480px){.mc-opt{font-size:12px;}.dlg-sec{padding:13px;}}
</style>
</head>
<body>
<div class="header">
  <div class="header-top">
    <h1>📚 Lesson 2+4 · 단어 &amp; 대화문</h1>
    <div class="timer">⏱ <span id="td">00:00</span></div>
  </div>
  <div class="header-sub">천재(이상기) 중2 · 준티 잉글리쉬</div>
  <div class="tabs">
    <button class="tab on" id="t0" onclick="go(0)"><span class="sn">단어</span>📝 부분빈칸<div class="dot"></div></button>
    <button class="tab"   id="t1" onclick="go(1)"><span class="sn">단어</span>📖 본문빈칸<div class="dot"></div></button>
    <button class="tab"   id="t2" onclick="go(2)"><span class="sn">L2</span>💬 대화문<div class="dot"></div></button>
    <button class="tab"   id="t3" onclick="go(3)"><span class="sn">L4</span>💬 대화문<div class="dot"></div></button>
  </div>
</div>
<div class="wrap" id="app"></div>
<div class="tag-line">준티 잉글리쉬 · 자체 제작 학습 콘텐츠</div>
<script>
/* ══ Audio/TTS/Timer ══ */
const _ac=new(window.AudioContext||window.webkitAudioContext)();
function playPageTurn(){try{if(_ac.state==='suspended')_ac.resume();const now=_ac.currentTime;const mk=(len,vol,delay,hp)=>{const buf=_ac.createBuffer(1,Math.floor(_ac.sampleRate*len),_ac.sampleRate);const d=buf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*(1-i/d.length);const src=_ac.createBufferSource();src.buffer=buf;const f=_ac.createBiquadFilter();f.type='highpass';f.frequency.value=hp;const g=_ac.createGain();g.gain.setValueAtTime(0,now+delay);g.gain.linearRampToValueAtTime(vol,now+delay+0.02);g.gain.exponentialRampToValueAtTime(0.001,now+delay+len);src.connect(f);f.connect(g);g.connect(_ac.destination);src.start(now+delay);src.stop(now+delay+len);};mk(0.16,0.32,0,1800);mk(0.07,0.14,0.09,3200);}catch(e){}}
let voice=null,ttsOk=false;
function lv(){const vs=speechSynthesis.getVoices();const p=['Google US English','Samantha','Microsoft Aria','Karen'];for(const n of p){const v=vs.find(x=>x.name===n);if(v){voice=v;return;}}voice=vs.find(v=>v.lang==='en-US')||null;}
if('speechSynthesis' in window){lv();speechSynthesis.onvoiceschanged=lv;}
function unlockTTS(){if(ttsOk||!('speechSynthesis' in window))return;const u=new SpeechSynthesisUtterance('');u.volume=0;speechSynthesis.speak(u);ttsOk=true;}
document.addEventListener('touchstart',unlockTTS,{once:true});document.addEventListener('click',unlockTTS,{once:true});
function speak(t,b){if(!('speechSynthesis' in window))return;unlockTTS();speechSynthesis.cancel();document.querySelectorAll('.snd.playing').forEach(x=>x.classList.remove('playing'));const u=new SpeechSynthesisUtterance(t);if(voice)u.voice=voice;u.lang='en-US';u.rate=.9;if(b){b.classList.add('playing');u.onend=()=>b.classList.remove('playing');}speechSynthesis.speak(u);}
function mkSnd(t){const b=document.createElement('button');b.className='snd';b.innerHTML='🔊';b.onclick=()=>speak(t,b);return b;}
let tSec=0,tInt=null;
function startT(){if(tInt)return;tInt=setInterval(()=>{tSec++;const m=String(Math.floor(tSec/60)).padStart(2,'0'),s=String(tSec%60).padStart(2,'0');document.getElementById('td').textContent=m+':'+s;},1000);}
document.addEventListener('click',startT,{once:true});
function norm(s){return(s||'').toLowerCase().replace(/[^a-z]/gi,'').trim();}
const completed=new Set();
function toggleAns(id){const el=document.getElementById(id);if(el)el.classList.toggle('open');}
function go(v){
  playPageTurn();
  for(let i=0;i<4;i++){const t=document.getElementById('t'+i);if(t){t.classList.toggle('on',i===v);if(completed.has(i))t.classList.add('done');else t.classList.remove('done');}}
  const app=document.getElementById('app');app.innerHTML='';
  setTimeout(()=>{app.classList.add('page-enter');[buildBlank,buildSent,buildL2,buildL4][v]();setTimeout(()=>app.classList.remove('page-enter'),250);},80);
}

/* ══════════════════════════════════════
   VOCAB 데이터 (106개 — 누락 4개 추가)
══════════════════════════════════════ */
const VOCAB=[
/* L2 */

 ],note:"⚠️ speak clear (X) → speak clearly (O)"},

const vSt=VOCAB.map(()=>({val:'',graded:false,ok:false}));
const sentSt=VOCAB.map(()=>({val:'',graded:false,ok:false}));
const dlgSt={L2:L2_DLG.map(d=>({qSt:d.qs.map(()=>({done:false,ok:false,sel:null,val:''})),ordSel:[],insSel:null})),

/* ══ 1단계: 부분빈칸 ══ */
function buildBlank(){
  const done=vSt.filter(s=>s.ok).length;
  const app=document.getElementById('app');
  let h=`<div class="desc"><b>단어 부분빈칸 (L2+L4 · ${VOCAB.length}개)</b><br>빈칸을 채워 단어를 완성하세요. 다의어·예외는 카드에서 확인하세요.</div>
  <div class="prog-wrap"><div class="prog-label"><span id="vp">완료 ${done}/${VOCAB.length}</span><span>L2: ${vSt.slice(0,52).filter(s=>s.ok).length}/52 · L4: ${vSt.slice(52).filter(s=>s.ok).length}/54</span></div>
  <div class="prog-track"><div class="prog-fill" id="vpb" style="width:${Math.round(done/VOCAB.length*100)}%"></div></div></div>
  <div class="glabel">Lesson 2 단어 (52개)</div>`;
  VOCAB.forEach((v,i)=>{
    if(i===52)h+=`<div class="glabel">Lesson 4 단어 (54개)</div>`;
    const st=vSt[i];
    const mt=['mt0','mt1','mt2'][v.mode];
    const mtLabel=['모음숨김','뒷부분','가운데'][v.mode];
    h+=`<div class="vocab-card" id="vc_${i}">
      <div class="vc-top">
        <span class="vc-num">${i+1}</span>
        <span class="${v.lesson==='L2'?'l2b':'l4b'}">${v.lesson}</span>
        <span class="vc-blank">${v.blank}</span>
        <span class="vc-kr">${v.kr}</span>
        <span class="${mt}">${mtLabel}</span>
      </div>`;
    if(v.poly){
      h+=`<div class="poly-box"><div class="poly-title">📌 ${v.poly.title}</div>`;
      v.poly.rows.forEach(r=>{h+=`<div class="poly-row"><span class="poly-num">${r.n}</span><span class="poly-ex">${r.m} — ${r.ex}</span></div>`;});
      if(v.poly.note)h+=`<div class="poly-note">${v.poly.note}</div>`;
      h+=`</div>`;
    }
    h+=`<div class="vc-inp-row">
      <input class="vc-inp${st.graded?(st.ok?' ok':' no'):''}" data-vi="${i}" type="text"
        placeholder="단어 전체 입력" value="${st.val}" autocomplete="off" spellcheck="false"
        oninput="vSt[${i}].val=this.value"
        onkeydown="if(event.key==='Enter')gradeV(${i})">
      <button class="b b1" style="padding:6px 13px;font-size:12px;" onclick="gradeV(${i})">확인</button>
    </div>
    <div class="vc-fb${st.graded?(st.ok?' ok':' no'):''}" id="vfb_${i}">${st.graded?(st.ok?'✅ '+v.en:'❌ 정답: '+v.en+' ('+v.kr+')'):''}
    </div></div>`;
  });
  h+=`<div class="check-bar">
    <button class="cb cb-g" onclick="gradeVAll()">전체 채점</button>
    <button class="cb cb-r" id="vRetry" onclick="retryWrong()" disabled>❌ 틀린 것 다시</button>
    <span class="result-pill" id="vPill"></span>
  </div>`;
  app.innerHTML=h;
}
function gradeV(i){
  const v=VOCAB[i];const st=vSt[i];const inp=document.querySelector(`[data-vi="${i}"]`);if(!inp)return;
  st.val=inp.value;const ok=norm(inp.value)===norm(v.en);st.graded=true;st.ok=ok;
  inp.className='vc-inp '+(ok?'ok':'no');
  const fb=document.getElementById('vfb_'+i);if(fb){fb.className='vc-fb '+(ok?'ok':'no');fb.textContent=ok?'✅ '+v.en:'❌ 정답: '+v.en+' ('+v.kr+')';}
  updateVP();
}
function gradeVAll(){
  VOCAB.forEach((_,i)=>{const inp=document.querySelector(`[data-vi="${i}"]`);if(inp){vSt[i].val=inp.value;const ok=norm(inp.value)===norm(VOCAB[i].en);vSt[i].graded=true;vSt[i].ok=ok;inp.className='vc-inp '+(ok?'ok':'no');const fb=document.getElementById('vfb_'+i);if(fb){fb.className='vc-fb '+(ok?'ok':'no');fb.textContent=ok?'✅ '+VOCAB[i].en:'❌ 정답: '+VOCAB[i].en+' ('+VOCAB[i].kr+')';}}});
  updateVP();
}
function retryWrong(){VOCAB.forEach((_,i)=>{if(vSt[i].graded&&!vSt[i].ok){vSt[i].val='';vSt[i].graded=false;const inp=document.querySelector(`[data-vi="${i}"]`);if(inp){inp.value='';inp.className='vc-inp';}const fb=document.getElementById('vfb_'+i);if(fb){fb.className='vc-fb';fb.textContent='';}}}); updateVP();}
function updateVP(){
  const done=vSt.filter(s=>s.ok).length;const p=document.getElementById('vp');if(p)p.textContent=`완료 ${done}/${VOCAB.length}`;const pb=document.getElementById('vpb');if(pb)pb.style.width=Math.round(done/VOCAB.length*100)+'%';
  const pill=document.getElementById('vPill');const retry=document.getElementById('vRetry');
  if(vSt.every(s=>s.graded)){if(pill){pill.style.display='inline-block';pill.className='result-pill '+(done===VOCAB.length?'pill-ok':'pill-bad');pill.textContent=done+' / '+VOCAB.length+' 정답';}if(retry)retry.disabled=done===VOCAB.length;}
  if(done===VOCAB.length)completed.add(0);
}

      <div class="btn-row">

        <button class="mini-btn" onclick="toggleAns('sr_'+this.dataset.idx)" data-idx="${i}">정답 보기</button>
      </div>
      <div class="ans-r" id="sr_${i}">정답: ${v.en} (${v.kr})</div>

      </div></div>`;
  });
  h+=`<div class="check-bar">
    <button class="cb cb-g" onclick="gradeSAll()">전체 채점</button>
    <button class="cb cb-r" id="sRetry" onclick="retrySWrong()" disabled>❌ 틀린 것 다시</button>

}
function gradeS(i){

function retrySWrong(){VOCAB.forEach((_,i)=>{if(sentSt[i].graded&&!sentSt[i].ok){sentSt[i].val='';sentSt[i].graded=false;const inp=document.getElementById('si_'+i);if(inp){inp.value='';inp.className='inline-inp';}const fb=document.getElementById('sfb_'+i);if(fb){fb.className='vc-fb';fb.textContent='';}}}); updateSP();}

/* ══ 대화문 공통 렌더 ══ */
const spCls={W:'spW',B:'spB',G:'spG',A:'spA',Alex:'spAlex',Kate:'spKate',Minji:'spMinji',MsKim:'spMsKim'};
function dlgLine(l){return `<div class="dlg-line"><span class="sp ${spCls[l.sp]||'spW'}">${l.sp}</span><span class="dl-text">${l.text}</span></div>`;}

function renderDlg(dlg,key,di){
  const st=dlgSt[key][di];
  let h=`<div class="dlg-sec">
  <div class="dlg-title">${dlg.title}</div>
  <div class="key-box">
    <div class="key-main">${dlg.keyExpr}</div>
    <div class="key-meaning">→ ${dlg.keyMeaning}</div>
    <div class="key-usage">💡 ${dlg.keyUsage}</div>
    <div class="key-similar">
      <div class="ks-title">📌 비슷한 표현 모두 익히기</div>`;
  dlg.similar.forEach(s=>{h+=`<div class="ks-item">${s.en} <span class="ks-kr">→ ${s.kr}</span></div>`;});
  h+=`</div></div>
  <div class="dlg-lines">${dlg.lines.map(dlgLine).join('')}</div>`;

  dlg.qs.forEach((q,qi)=>{
    const qSt=st.qSt[qi];
    const qid=`${key}_${di}_q${qi}`;
    h+=`<div class="q-card" id="${qid}">`;
    if(q.tag)h+=`<span class="q-tag warn">${q.tag}</span> `;
    else h+=`<span class="q-tag">Q${qi+1}</span> `;
    h+=`<div class="q-text">Q${qi+1}. ${q.q}</div>`;

    if(q.type==='mc-wrong'){
      // 틀린 문장 고르기: similar 4개 + wrong 1개 섞기
      const opts=[...dlg.similar.map(s=>s.en),dlg.wrong.en].sort(()=>Math.random()-.5);
      h+=`<div class="mc-opts">`;
      opts.forEach((opt,oi)=>{
        let cls='mc-opt';
        if(qSt.done){if(opt===dlg.wrong.en)cls+=' ok';else if(oi===qSt.sel&&opt!==dlg.wrong.en)cls+=' no';}
        h+=`<div class="${cls}" data-val="${opt.replace(/"/g,'&quot;')}" onclick="ansMC('${key}',${di},${qi},${oi},'wrong','${dlg.wrong.en.replace(/'/g,"\\'")}')"><span class="on">${'①②③④⑤'[oi]}</span>${opt}</div>`;
      });
      h+=`</div>`;
      if(qSt.done)h+=`<div class="q-fb show ${qSt.ok?'ok':'no'}">${qSt.ok?'✅ 정답! — '+dlg.wrong.exp:'❌ 틀린 문장: '+dlg.wrong.en+' — '+dlg.wrong.exp}</div>`;
    }
    else if(q.type==='mc-match'||q.type==='mc-similar'){
      h+=`<div class="mc-opts">`;
      q.opts.forEach((opt,oi)=>{
        let cls='mc-opt';
        if(qSt.done){if(oi===q.ans)cls+=' ok';else if(oi===qSt.sel)cls+=' no';}
        h+=`<div class="${cls}" onclick="ansMC('${key}',${di},${qi},${oi},'match',${q.ans})"><span class="on">${'①②③④'[oi]}</span>${opt}</div>`;
      });
      h+=`</div>`;
      if(qSt.done)h+=`<div class="q-fb show ${qSt.ok?'ok':'no'}">${qSt.ok?'✅ 정답!':'❌'} ${q.fb||''}</div>`;
    }
    else if(q.type==='fill'){
      const disp=q.sent.replace('________',`<input class="inline-inp${qSt.done?(qSt.ok?' ok':' no'):''}" id="${qid}_inp" type="text" placeholder="___" value="${qSt.val||''}" autocomplete="off" spellcheck="false" onkeydown="if(event.key==='Enter')ansFill('${key}',${di},${qi},'${q.ans.replace(/'/g,"\\'")}','${qid}')" style="min-width:${Math.max(60,(q.ans||'').length*9)}px;">`);
      h+=`<div class="sent-box">${disp}</div>
      <div class="btn-row"><button class="b b1" style="padding:5px 12px;font-size:12px;" onclick="ansFill('${key}',${di},${qi},'${q.ans.replace(/'/g,"\\'")}','${qid}')">확인</button>
      <button class="mini-btn" onclick="toggleAns('${qid}_rev')">정답 보기</button></div>
      <div class="ans-r" id="${qid}_rev">정답: ${q.ans}</div>`;
      if(qSt.done)h+=`<div class="q-fb show ${qSt.ok?'ok':'no'}">${qSt.ok?'✅ 정답!':'❌'} ${q.fb||''}</div>`;
    }
    else if(q.type==='order'){
      const shuffled=[...dlg.lines.map((l,li)=>({...l,oi:li}))].sort(()=>Math.random()-.5);
      h+=`<div class="chip-pool" id="${qid}_pool">`;
      shuffled.forEach(l=>{h+=`<div class="ord-chip${st.ordSel.includes(l.oi)?' used':''}" data-oi="${l.oi}" onclick="pickOrd('${key}',${di},'${qid}',this)">${l.sp}: ${l.text.substring(0,28)}${l.text.length>28?'...':''}</div>`;});
      h+=`</div><div class="ord-slots" id="${qid}_slots">`;
      st.ordSel.forEach(oi=>{const l=dlg.lines[oi];h+=`<div class="ord-slot" data-oi="${oi}" onclick="removeOrd('${key}',${di},'${qid}',${oi},this)">${l.sp}: ${l.text.substring(0,20)}...</div>`;});
      h+=`</div><div class="btn-row">
        <button class="b b1" style="padding:5px 12px;font-size:12px;" onclick="checkOrd('${key}',${di},'${qid}',${dlg.lines.length})">순서 확인</button>
        <button class="b b2" style="padding:5px 12px;font-size:12px;" onclick="resetOrd('${key}',${di},'${qid}')">초기화</button>
      </div>
      <div class="q-fb" id="${qid}_fb"></div>`;
    }
    else if(q.type==='insert'){
      h+=`<div class="ins-box"><div class="ilab">삽입할 문장</div><div class="itext">${q.ins}</div></div>`;
      dlg.lines.forEach((l,li)=>{
        h+=dlgLine(l);
        const isSel=st.insSel===li;
        h+=`<div class="ins-slot${isSel?' sel':''}" data-pos="${li}" onclick="pickIns('${key}',${di},${li},'${qid}')"><span class="arr">▼</span><span class="ilab2">여기에 삽입</span></div>`;
      });
      h+=`<div class="btn-row"><button class="b b1" style="padding:5px 12px;font-size:12px;" onclick="checkIns('${key}',${di},${q.pos},'${qid}','${q.exp.replace(/'/g,"\\'")}')">위치 확인</button></div>
      <div class="q-fb" id="${qid}_ins_fb"></div>`;
      if(qSt.done)h+=`<div class="ans-r open">${q.pos+1}번째 줄 다음 — ${q.exp}</div>`;
    }
    h+=`</div>`;
  });
  h+=`</div>`;
  return h;
}

function ansMC(key,di,qi,sel,type,ans){
  const st=dlgSt[key][di].qSt[qi];if(st.done)return;
  st.sel=sel;st.done=true;
  let ok=false;
  if(type==='wrong'){
    const dlg=(key==='L2'?L2_DLG:L4_DLG)[di];
    const opts=[...dlg.similar.map(s=>s.en),dlg.wrong.en].sort(()=>Math.random()-.5);
    // 실제 wrong 위치를 찾아서 비교
    const allOpts=document.querySelectorAll(`#${key}_${di}_q${qi} .mc-opt`);
    const selVal=allOpts[sel]?.dataset.val;
    ok=selVal===dlg.wrong.en;
    allOpts.forEach((el,i)=>{el.onclick=null;if(el.dataset.val===dlg.wrong.en)el.classList.add('ok');else if(i===sel&&!ok)el.classList.add('no');});
    const fb=document.querySelector(`#${key}_${di}_q${qi} .q-fb`)||document.createElement('div');
    fb.className='q-fb show '+(ok?'ok':'no');fb.textContent=(ok?'✅ 정답! — ':'❌ 틀린 문장: '+dlg.wrong.en+' — ')+dlg.wrong.exp;
    if(!document.querySelector(`#${key}_${di}_q${qi} .q-fb`))document.getElementById(`${key}_${di}_q${qi}`).appendChild(fb);
  } else {
    const ansIdx=parseInt(ans);ok=sel===ansIdx;
    const allOpts=document.querySelectorAll(`#${key}_${di}_q${qi} .mc-opt`);
    allOpts.forEach((el,i)=>{el.onclick=null;if(i===ansIdx)el.classList.add('ok');else if(i===sel&&!ok)el.classList.add('no');});
    const dlg=(key==='L2'?L2_DLG:L4_DLG)[di];const q=dlg.qs[qi];
    const fb=document.querySelector(`#${key}_${di}_q${qi} .q-fb`)||document.createElement('div');
    fb.className='q-fb show '+(ok?'ok':'no');fb.textContent=(ok?'✅ 정답!':'❌')+' '+(q.fb||'');
    if(!document.querySelector(`#${key}_${di}_q${qi} .q-fb`))document.getElementById(`${key}_${di}_q${qi}`).appendChild(fb);
  }
  st.ok=ok;
}
function ansFill(key,di,qi,ans,qid){
  const st=dlgSt[key][di].qSt[qi];const inp=document.getElementById(qid+'_inp');if(!inp)return;
  const val=inp.value.trim();const ok=norm(val)===norm(ans);st.done=true;st.ok=ok;st.val=val;
  inp.className='inline-inp '+(ok?'ok':'no');
  const dlg=(key==='L2'?L2_DLG:L4_DLG)[di];const q=dlg.qs[qi];
  let fb=document.querySelector(`#${qid} .q-fb`);if(!fb){fb=document.createElement('div');document.getElementById(qid).appendChild(fb);}
  fb.className='q-fb show '+(ok?'ok':'no');fb.textContent=(ok?'✅ 정답!':'❌')+' '+(q.fb||'');
}
function pickOrd(key,di,qid,chip){if(chip.classList.contains('used'))return;chip.classList.add('used');const oi=parseInt(chip.dataset.oi);dlgSt[key][di].ordSel.push(oi);const dlg=(key==='L2'?L2_DLG:L4_DLG)[di];const l=dlg.lines[oi];const slots=document.getElementById(qid+'_slots');const sc=document.createElement('div');sc.className='ord-slot';sc.dataset.oi=oi;sc.textContent=l.sp+': '+l.text.substring(0,20)+'...';sc.onclick=()=>removeOrd(key,di,qid,oi,sc);slots.appendChild(sc);}
function removeOrd(key,di,qid,oi,slot){slot.remove();const idx=dlgSt[key][di].ordSel.indexOf(oi);if(idx>-1)dlgSt[key][di].ordSel.splice(idx,1);const chip=document.querySelector(`#${qid}_pool [data-oi="${oi}"]`);if(chip)chip.classList.remove('used');}
function checkOrd(key,di,qid,len){const sel=dlgSt[key][di].ordSel;const ok=sel.length===len&&sel.every((v,i)=>v===i);const fb=document.getElementById(qid+'_fb');if(fb){fb.className='q-fb show '+(ok?'ok':'no');fb.textContent=ok?'✅ 순서가 정확해요!':'❌ 순서가 맞지 않아요. 다시 시도해보세요.';}}
function resetOrd(key,di,qid){dlgSt[key][di].ordSel=[];const slots=document.getElementById(qid+'_slots');if(slots)slots.innerHTML='';const pool=document.getElementById(qid+'_pool');if(pool)pool.querySelectorAll('.ord-chip').forEach(c=>c.classList.remove('used'));const fb=document.getElementById(qid+'_fb');if(fb)fb.className='q-fb';}
function pickIns(key,di,pos,qid){dlgSt[key][di].insSel=pos;document.querySelectorAll(`#${qid} .ins-slot`).forEach(el=>el.classList.toggle('sel',parseInt(el.dataset.pos)===pos));}
function checkIns(key,di,ans,qid,exp){const sel=dlgSt[key][di].insSel;if(sel===null){alert('위치를 먼저 선택해주세요.');return;}const ok=sel===ans;dlgSt[key][di].qSt[dlgSt[key][di].qSt.findIndex(q=>false)||0];const fb=document.getElementById(qid+'_ins_fb');if(fb){fb.className='q-fb show '+(ok?'ok':'no');fb.textContent=(ok?'✅ 정답! — ':'❌ 위치가 맞지 않아요 — ')+exp;}}

function buildL2(){
  const app=document.getElementById('app');
  app.innerHTML=`<div class="desc"><b>Lesson 2 · 대화문 (5개 × 10문제)</b><br>핵심표현 확인 → 객관식 → 빈칸 → 순서 → 삽입 위치. 예외·함정 포인트 집중!</div>`+L2_DLG.map((d,i)=>renderDlg(d,'L2',i)).join('');
}
function buildL4(){
  const app=document.getElementById('app');
  app.innerHTML=`<div class="desc"><b>Lesson 4 · 대화문 (5개 × 10문제)</b><br>핵심표현 확인 → 객관식 → 빈칸 → 순서 → 삽입 위치. 예외·함정 포인트 집중!</div>`+L4_DLG.map((d,i)=>renderDlg(d,'L4',i)).join('');
}
