<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>4과 Opening a Window to the World — 독해 심화</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=Lora:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FAFAF7;--card:#FFFFFF;--border:#C4BAF5;--border-lt:#EAE7F8;
  --ink:#2D2860;--ink2:#4A4299;--sub:#6B6789;--muted:#9B97D3;
  --purple:#7B6FD4;--purple-lt:#F0EEFF;--purple-bg:#EAE7F8;
  --ok:#2E7A45;--ok-bg:#E8F4EB;--no:#A03060;--no-bg:#F9E8EE;
  --amber:#8A5200;--amber-bg:#FFF3DC;
  --shadow:0 2px 8px rgba(123,111,212,.10),0 0 0 1px #C4BAF5;
  --r:14px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{background:var(--bg);color:var(--ink);font-family:'Noto Sans KR',sans-serif;font-size:14px;line-height:1.7;-webkit-font-smoothing:antialiased;}
.page{max-width:760px;margin:0 auto;padding:18px 16px 80px;}

/* 헤더 */
.doc-head{background:var(--card);border-radius:var(--r);border:1px solid var(--border);box-shadow:var(--shadow);padding:20px 22px 16px;margin-bottom:10px;}
.doc-head h1{font-size:18px;font-weight:900;color:var(--ink);margin-bottom:2px;}
.doc-head .sub{font-size:12px;color:var(--sub);}
.meta-row{display:flex;gap:18px;margin-top:12px;flex-wrap:wrap;}
.meta-item{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--sub);}
.meta-line{border-bottom:1.5px solid var(--ink2);width:100px;height:18px;}

/* 단계 진행바 */
.step-rail{display:flex;gap:0;margin:14px 0 0;border-radius:10px;overflow:hidden;border:1px solid var(--border-lt);}
.step-pip{flex:1;padding:7px 4px;text-align:center;font-size:11px;font-weight:700;color:var(--muted);background:var(--bg);border-right:1px solid var(--border-lt);cursor:default;transition:.2s;line-height:1.3;}
.step-pip:last-child{border-right:none;}
.step-pip.unlocked{cursor:pointer;color:var(--ink2);}
.step-pip.unlocked:hover{background:var(--purple-lt);}
.step-pip.active{background:var(--purple);color:#fff;}
.step-pip.done{background:var(--ok-bg);color:var(--ok);}
.step-lv{font-size:9px;display:block;opacity:.8;margin-top:2px;}

/* 섹션 */
.sec{background:var(--card);border-radius:var(--r);border:1px solid var(--border);box-shadow:var(--shadow);padding:20px 22px;margin-bottom:10px;}
.sec-head{display:flex;align-items:center;gap:9px;padding-bottom:11px;border-bottom:1.5px solid var(--border-lt);margin-bottom:14px;flex-wrap:wrap;}
.sec-badge{font-size:11px;font-weight:700;padding:3px 11px;border-radius:99px;color:#fff;flex-shrink:0;}
.b1{background:#7B6FD4;}.b2{background:#5B9E72;}.b3{background:#4A4299;}
.b4{background:#8A5200;}.b4{background:#8A5200;}.b5{background:#A03060;}.b5r{background:#1A6A9A;}.b6{background:#2D7A6F;}
.sec-title{font-size:14px;font-weight:700;color:var(--ink);}
.sec-desc{font-size:12px;color:var(--muted);margin:-8px 0 12px;}
.level-tag{font-size:10px;font-weight:700;padding:2px 8px;border-radius:99px;margin-left:auto;flex-shrink:0;}
.lv-kr{background:#EAE7F8;color:var(--purple);}
.lv-en{background:#E8F4EB;color:var(--ok);}
.lv-write{background:#FFF3DC;color:var(--amber);}.lv-inf{background:#E8F4FB;color:#1A6A9A;}

/* 잠금 카드 */
.lock-card{background:var(--card);border-radius:var(--r);border:1px solid var(--border-lt);padding:28px 22px;text-align:center;color:var(--muted);margin-bottom:10px;}
.lock-card .lock-icon{font-size:26px;margin-bottom:7px;}
.lock-card .lock-msg{font-weight:700;color:var(--sub);margin-bottom:3px;}

/* 단락 그룹 */
.para-group{margin-bottom:20px;}
.para-tag{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:700;padding:3px 12px;border-radius:6px;margin-bottom:10px;}
.pt-intro{background:#EAE7F8;color:var(--purple);}
.pt-turkey{background:#FFF3DC;color:var(--amber);}
.pt-thai{background:#E8F4EB;color:var(--ok);}
.pt-nl{background:#E8F4FB;color:#1A6A9A;}

/* 흐름 정리 테이블 */
.flow-tbl{width:100%;border-collapse:collapse;margin-bottom:6px;}
.flow-tbl td{padding:6px 8px;border-bottom:1px solid var(--border-lt);vertical-align:top;font-size:13px;}
.flow-tbl tr:last-child td{border-bottom:none;}
.flow-tbl .fnum{width:28px;font-weight:700;color:var(--muted);text-align:center;font-family:'Lora',serif;}
.flow-tbl .fkr{line-height:1.65;}
.flow-summary{background:var(--purple-lt);border-radius:8px;padding:8px 12px;font-size:12px;color:var(--ink2);margin-top:6px;border:1px solid var(--border-lt);}
.flow-summary b{color:var(--purple);}

/* 소리 버튼 */
.snd{display:inline-flex;align-items:center;background:none;border:1px solid var(--border-lt);border-radius:99px;padding:3px 9px;font-size:11px;color:var(--sub);cursor:pointer;font-family:inherit;transition:.12s;gap:3px;white-space:nowrap;flex-shrink:0;}
.snd:hover,.snd.playing{background:var(--purple-lt);border-color:var(--border);color:var(--purple);}

/* 정답 reveal */
.ans-reveal{display:none;margin-top:7px;padding:7px 11px;background:var(--ok-bg);border-radius:8px;border:1px solid #b2e8d0;font-size:12px;color:var(--ok);line-height:1.65;}
.ans-reveal.open{display:block;}

/* 연결어/주제문 분석 */
.analysis-item{margin-bottom:12px;padding-bottom:12px;border-bottom:1px solid var(--border-lt);}
.analysis-item:last-child{border-bottom:none;margin-bottom:0;}
.a-label{font-size:10px;font-weight:700;padding:2px 8px;border-radius:99px;display:inline-block;margin-bottom:6px;}
.a-conn{background:#FFF3DC;color:var(--amber);}
.a-topic{background:var(--purple-lt);color:var(--purple);}
.a-intent{background:#E8F4EB;color:var(--ok);}
.a-q{font-size:13px;color:var(--ink);margin-bottom:7px;line-height:1.65;}
.a-q b{color:var(--purple);}

/* 선택형 */
.choice-opts{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px;}
.choice-opt{font-size:12px;font-weight:700;padding:5px 13px;border-radius:99px;border:1.5px solid var(--border-lt);background:var(--bg);color:var(--sub);cursor:pointer;transition:.12s;}
.choice-opt:hover{border-color:var(--border);color:var(--purple);}
.choice-opt.ch-ok{background:var(--ok-bg);border-color:var(--ok);color:var(--ok);}
.choice-opt.ch-no{background:var(--no-bg);border-color:var(--no);color:var(--no);}
.choice-opt.ch-reveal{background:var(--ok-bg);border-color:var(--ok);color:var(--ok);opacity:.55;}
.choice-opt:disabled{cursor:default;}
.choice-fb{font-size:12px;margin-top:5px;display:none;}
.choice-fb.show{display:block;}
.choice-fb.ok{color:var(--ok);}
.choice-fb.no{color:var(--no);}

/* 입력형 */
.q-input{border:none;border-bottom:1.5px solid var(--ink2);padding:3px 5px;font-size:13px;font-family:inherit;background:transparent;color:var(--ink);outline:none;min-width:200px;width:100%;max-width:480px;}
.q-input:focus{border-bottom-color:var(--purple);}
.q-input.correct{border-bottom-color:var(--ok);color:var(--ok);}
.q-input.wrong{border-bottom-color:var(--no);color:var(--no);}
.q-btns{display:flex;gap:6px;margin-top:7px;flex-wrap:wrap;align-items:center;}
.mini-btn{padding:5px 12px;border:1px solid var(--border-lt);border-radius:99px;font-size:12px;cursor:pointer;font-family:inherit;background:var(--card);color:var(--sub);}
.mini-btn:hover{background:var(--purple-lt);border-color:var(--border);color:var(--purple);}

/* 빈칸 채우기 */
.blank-sent{font-family:'Lora',serif;font-size:14px;line-height:2.1;color:var(--ink);margin-bottom:5px;}
.blank-sent .b-inp{border:none;border-bottom:1.5px solid var(--ink2);padding:0 4px;font-size:13px;font-family:'Lora',serif;background:transparent;color:var(--ink);outline:none;vertical-align:bottom;}
.blank-sent .b-inp:focus{border-bottom-color:var(--purple);}
.blank-sent .b-inp.ok{border-bottom-color:var(--ok);color:var(--ok);}
.blank-sent .b-inp.no{border-bottom-color:var(--no);color:var(--no);}
.blank-num{font-size:11px;font-weight:700;color:var(--purple);margin-bottom:4px;}
.blank-kr{font-size:12px;color:var(--muted);margin-bottom:5px;}
.blank-item{margin-bottom:13px;padding-bottom:13px;border-bottom:1px solid var(--border-lt);}
.blank-item:last-child{border-bottom:none;margin-bottom:0;}

/* 문장 순서 맞추기 */
.sort-area{display:flex;flex-direction:column;gap:6px;margin:10px 0;}
.sort-item{display:flex;align-items:flex-start;gap:8px;padding:9px 12px;border:1.5px solid var(--border-lt);border-radius:10px;background:var(--bg);cursor:grab;user-select:none;transition:.12s;}
.sort-item:hover{border-color:var(--border);background:var(--purple-lt);}
.sort-item.dragging{opacity:.4;}
.sort-item.drag-over{border-color:var(--purple);background:var(--purple-lt);}
.sort-handle{color:var(--muted);font-size:14px;flex-shrink:0;margin-top:1px;}
.sort-text{font-family:'Lora',serif;font-size:13px;line-height:1.65;flex:1;}
.sort-num{font-size:11px;font-weight:700;color:var(--purple);flex-shrink:0;min-width:22px;}
.sort-result{font-size:12px;margin-top:5px;padding:6px 10px;border-radius:7px;display:none;}
.sort-result.show{display:block;}
.sort-result.ok{background:var(--ok-bg);color:var(--ok);}
.sort-result.no{background:var(--no-bg);color:var(--no);}

/* 영작 */
.eng-item{margin-bottom:13px;padding-bottom:13px;border-bottom:1px solid var(--border-lt);}
.eng-item:last-child{border-bottom:none;margin-bottom:0;}
.eng-num{font-size:11px;font-weight:700;color:var(--purple);margin-bottom:4px;}
.eng-kr{font-size:14px;font-weight:700;line-height:1.7;margin-bottom:7px;color:var(--ink);}
.hint-row{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:8px;}
.hint-chip{font-size:11px;font-weight:700;padding:3px 10px;border-radius:99px;background:var(--purple-lt);color:var(--purple);border:1px solid var(--border-lt);}
.eng-ta{width:100%;min-height:44px;padding:8px 12px;border:1.5px solid var(--border-lt);border-radius:10px;font-size:13px;font-family:'Lora',serif;line-height:1.65;resize:none;color:var(--ink);background:var(--bg);outline:none;}
.eng-ta:focus{border-color:var(--purple);background:#fff;}

/* 점검바 */
.check-bar{display:flex;gap:7px;flex-wrap:wrap;align-items:center;margin-top:14px;padding-top:11px;border-top:1px dashed var(--border-lt);}
.check-btn{padding:8px 16px;border-radius:99px;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit;border:none;}
.cb-grade{background:var(--purple);color:#fff;}
.cb-grade:hover{background:var(--ink2);}
.cb-retry{background:var(--card);border:1.5px solid var(--no);color:var(--no);}
.cb-retry:disabled{opacity:.35;cursor:not-allowed;}
.cb-reset{background:var(--card);border:1.5px solid var(--border-lt);color:var(--sub);}
.cb-next{background:var(--ok);color:#fff;}
.cb-next:hover{background:#245e36;}
.result-pill{font-size:12px;font-weight:700;padding:5px 13px;border-radius:99px;display:none;}
.pill-ok{background:var(--ok-bg);color:var(--ok);}
.pill-bad{background:var(--amber-bg);color:var(--amber);}

.tag-line{font-size:11px;color:var(--muted);text-align:center;margin-top:20px;}
@media(max-width:480px){.choice-opts{gap:5px;}.sort-text{font-size:12px;}}
</style>
</head>

  <div class="step-rail" id="stepRail"></div>

</div>

/* ══════════════════════════════════════
   TTS (표준 블록)
══════════════════════════════════════ */
let voice=null,ttsOk=false;
function loadVoices(){
  const vs=speechSynthesis.getVoices();
  const prefer=['Google US English','Google UK English Female','Samantha','Microsoft Aria','Microsoft Jenny','Microsoft Zira','Karen','Alex'];
  for(const n of prefer){const v=vs.find(x=>x.name===n);if(v){voice=v;return;}}
  voice=vs.find(v=>v.lang==='en-US')||vs.find(v=>v.lang&&v.lang.startsWith('en'))||null;
}
if('speechSynthesis' in window){loadVoices();speechSynthesis.onvoiceschanged=loadVoices;}
function unlockTTS(){if(ttsOk||!('speechSynthesis' in window))return;const u=new SpeechSynthesisUtterance('');u.volume=0;speechSynthesis.speak(u);ttsOk=true;}
document.addEventListener('touchstart',unlockTTS,{once:true});
document.addEventListener('click',unlockTTS,{once:true});
function speak(text,btn,slow){
  if(!('speechSynthesis' in window))return;
  unlockTTS();speechSynthesis.cancel();
  document.querySelectorAll('.snd.playing').forEach(b=>b.classList.remove('playing'));
  const u=new SpeechSynthesisUtterance(String(text).trim());
  if(voice)u.voice=voice;u.lang='en-US';u.rate=slow?.55:.92;u.pitch=1.0;
  if(btn){btn.classList.add('playing');u.onend=u.onerror=()=>btn.classList.remove('playing');}
  speechSynthesis.speak(u);
}
function sndBtn(text){
  const b=document.createElement('button');b.className='snd';b.innerHTML='🔊';b.title='듣기';
  b.onclick=()=>speak(text,b,false);return b;
}

function renderRail(){
  const rail=document.getElementById('stepRail');rail.innerHTML='';
  STAGE_META.forEach((s,i)=>{
    const pip=document.createElement('div');
    const st=i===curStage?'active':unlocked.has(i)&&i<curStage?'done':!unlocked.has(i)?'locked':'unlocked';
    pip.className='step-pip '+st;
    pip.innerHTML=s.label+'<span class="step-lv">'+s.lv+'</span>';
    if(unlocked.has(i))pip.onclick=()=>goStage(i);
    rail.appendChild(pip);
  });

function goStage(i){
  if(!unlocked.has(i))return;
  curStage=i;renderRail();renderCurrentStage();

}

}

/* 점검바 */
function attachBar(container,items,onComplete){
  const bar=document.createElement('div');bar.className='check-bar';
  const pill=document.createElement('span');pill.className='result-pill';pill.style.display='none';
  const gb=mk('전체 채점','check-btn cb-grade');
  const rb=mk('❌ 틀린 것만 다시','check-btn cb-retry');rb.disabled=true;
  const sb=mk('전체 보기','check-btn cb-reset');sb.style.display='none';
  const nb=mk('다음 단계로 →','check-btn cb-next');nb.style.display='none';
  function refresh(){
    const ok=items.filter(x=>x._ok).length;
    pill.style.display='inline-block';
    pill.className='result-pill '+(ok===items.length?'pill-ok':'pill-bad');
    pill.textContent=`${ok} / ${items.length} 정답`;
    rb.disabled=(ok===items.length);
    nb.style.display='inline-block';
    unlockNext();
    if(onComplete)onComplete(ok,items.length);
  }
  gb.onclick=()=>{items.forEach(it=>{if(!it.row.classList.contains('hide'))it._ok=it.grade();});refresh();};
  rb.onclick=()=>{
    items.forEach(it=>{it._ok?it.row.classList.add('hide'):(it.row.classList.remove('hide'),it.reset());});
    sb.style.display='inline-block';
    const left=items.filter(x=>!x._ok).length;
    pill.style.display='inline-block';pill.className='result-pill pill-bad';pill.textContent=`틀린 ${left}문제만 다시`;
  };
  sb.onclick=()=>{items.forEach(it=>it.row.classList.remove('hide'));pill.style.display='none';};
  nb.onclick=()=>{if(curStage+1<STAGE_META.length)goStage(curStage+1);else showFinish();};
  bar.append(gb,rb,sb,nb,pill);
  container.appendChild(bar);
}

function showFinish(){
  const wrap=document.getElementById('stageWrap');wrap.innerHTML='';
  const sec=document.createElement('div');sec.className='sec';
  sec.innerHTML=`<div style="text-align:center;padding:28px 16px;">
    <div style="font-size:40px;margin-bottom:10px;">🎉</div>
    <div style="font-size:20px;font-weight:900;color:var(--ink);margin-bottom:8px;">모든 단계 완료!</div>

    <button class="check-btn cb-grade" style="padding:12px 28px;font-size:14px;" onclick="resetAll()">처음부터 다시</button>
  </div>`;
  wrap.appendChild(sec);renderRail();
}

function buildSort(wrap){
  const sec=document.createElement('div');sec.className='sec';
  const head=document.createElement('div');head.className='sec-head';
  head.innerHTML='<span class="sec-badge b3">③</span><span class="sec-title">문장 순서 맞추기 — 단락별 35문장</span><span class="level-tag lv-en">심화</span>';
  const desc=document.createElement('div');desc.className='sec-desc';desc.textContent='섞인 문장들을 드래그해서 올바른 순서로 배열하세요';
  sec.append(head,desc);

  let allDone=0;

  PARAS.forEach((para,pi)=>{
    const pg=document.createElement('div');pg.className='para-group';
    const ptag=document.createElement('div');ptag.className='para-tag '+para.cls;ptag.innerHTML='📌 '+para.tag;
    pg.appendChild(ptag);

    const sents=SENTENCES.filter(s=>s.para===pi);
    const shuffled=[...sents].sort(()=>Math.random()-.5);
    const correctOrder=sents.map(s=>s.n);

    const area=document.createElement('div');area.className='sort-area';
    let dragSrc=null;

    shuffled.forEach((s,i)=>{
      const item=document.createElement('div');item.className='sort-item';item.draggable=true;
      item.dataset.n=s.n;
      item.innerHTML=`<span class="sort-handle">⠿</span><span class="sort-text">${s.en}</span>`;
      item.addEventListener('dragstart',e=>{dragSrc=item;item.classList.add('dragging');e.dataTransfer.effectAllowed='move';});
      item.addEventListener('dragend',()=>{item.classList.remove('dragging');document.querySelectorAll('.drag-over').forEach(x=>x.classList.remove('drag-over'));});
      item.addEventListener('dragover',e=>{e.preventDefault();item.classList.add('drag-over');});
      item.addEventListener('dragleave',()=>item.classList.remove('drag-over'));
      item.addEventListener('drop',e=>{e.preventDefault();item.classList.remove('drag-over');if(dragSrc&&dragSrc!==item){const items=[...area.children];const si=items.indexOf(dragSrc),di=items.indexOf(item);if(si<di)area.insertBefore(dragSrc,item.nextSibling);else area.insertBefore(dragSrc,item);}});
      area.appendChild(item);
    });

    const fb=document.createElement('div');fb.className='sort-result';
    const chk=mk('순서 확인','check-btn cb-grade');
    chk.style.marginTop='10px';
    chk.onclick=()=>{
      const cur=[...area.children].map(x=>x.dataset.n);
      const ok=JSON.stringify(cur)===JSON.stringify(correctOrder);
      fb.className='sort-result show '+(ok?'ok':'no');
      if(ok){
        fb.textContent='✅ 완벽한 순서예요!';
        allDone++;if(allDone===PARAS.length)unlockNext();
      } else {
        // 틀린 위치 표시
        cur.forEach((n,i)=>{
          const el=[...area.children][i];
          el.style.background=n===correctOrder[i]?'var(--ok-bg)':'var(--no-bg)';
          el.style.borderColor=n===correctOrder[i]?'var(--ok)':'var(--no)';
        });
        fb.innerHTML='❌ 다시 해보세요. <button class="mini-btn" onclick="this.closest(\'.para-group\').querySelector(\'.sort-result\').className=\'sort-result\';[...this.closest(\'.para-group\').querySelector(\'.sort-area\').children].forEach(x=>{x.style.background=\'\';x.style.borderColor=\'\';});">초기화</button>';
      }
    };
    const revBtn=mk('정답 순서 보기','mini-btn');revBtn.style.marginTop='6px';
    const revDiv=document.createElement('div');revDiv.className='ans-reveal';
    revDiv.innerHTML=sents.map((s,i)=>`<b>${i+1}.</b> [${s.n}] ${s.en}`).join('<br>');
    revBtn.onclick=()=>{revDiv.classList.toggle('open');revBtn.textContent=revDiv.classList.contains('open')?'정답 숨기기':'정답 순서 보기';unlockNext();};

    pg.append(area,chk,fb,revBtn,revDiv);
    sec.appendChild(pg);
  });

  // 다음 단계 버튼
  const bar=document.createElement('div');bar.className='check-bar';
  const nb=mk('다음 단계로 →','check-btn cb-next');nb.style.display='inline-block';
  nb.onclick=()=>{unlockNext();if(curStage+1<STAGE_META.length)goStage(curStage+1);else showFinish();};
  bar.appendChild(nb);sec.appendChild(bar);
  wrap.appendChild(sec);
}


function buildBlanks(wrap){
  const sec=document.createElement('div');sec.className='sec';
  const head=document.createElement('div');head.className='sec-head';
  head.innerHTML='<span class="sec-badge b2">②</span><span class="sec-title">영어 빈칸 채우기 — 35문장 전체</span><span class="level-tag lv-en">적용</span>';
  const desc=document.createElement('div');desc.className='sec-desc';desc.textContent='빈칸에 알맞은 단어를 넣으세요 · Enter로 즉각 채점';
  sec.append(head,desc);
  const gradable=[];

  PARAS.forEach((para,pi)=>{
    const pg=document.createElement('div');pg.className='para-group';
    const ptag=document.createElement('div');ptag.className='para-tag '+para.cls;ptag.innerHTML='📌 '+para.tag;
    pg.appendChild(ptag);
    const sents=SENTENCES.filter(s=>s.para===pi);
    sents.forEach(s=>{
      const row=document.createElement('div');row.className='blank-item';
      const num=document.createElement('div');num.className='blank-num';num.textContent='문장 '+s.n;
      const kr=document.createElement('div');kr.className='blank-kr';kr.textContent=s.kr;
      const sentDiv=document.createElement('div');sentDiv.className='blank-sent';
      row.append(num,kr);
      if(s.blank.length===0){
        sentDiv.style.cssText="font-family:'Lora',serif;font-size:13px;color:var(--sub);";
        sentDiv.textContent=s.en;
        const sb=sndBtn(s.en);
        row.append(sentDiv,sb);
      } else {
        const inputs=[],answers=[];
        let remaining=s.en;
        s.blank.forEach(([ans,w])=>{
          const idx=remaining.indexOf(ans);
          if(idx>0)sentDiv.appendChild(document.createTextNode(remaining.slice(0,idx)));
          const inp=document.createElement('input');
          inp.className='b-inp';inp.type='text';inp.autocomplete='off';inp.spellcheck=false;
          inp.style.width=w+'px';inp.placeholder='___';
          inputs.push(inp);answers.push(ans.toLowerCase());
          sentDiv.appendChild(inp);
          remaining=remaining.slice(idx+ans.length);
        });
        if(remaining)sentDiv.appendChild(document.createTextNode(remaining));
        const reveal=document.createElement('div');reveal.className='ans-reveal';reveal.textContent=s.en;
        const chk=mk('채점','mini-btn');
        const item={row,_ok:false,
          grade(){let a=true;inputs.forEach((inp,i)=>{const ok=inp.value.trim().toLowerCase()===answers[i];inp.classList.remove('ok','no');inp.classList.add(ok?'ok':'no');if(!ok)a=false;});return a;},
          reset(){inputs.forEach(inp=>{inp.value='';inp.classList.remove('ok','no');});}};
        chk.onclick=()=>{item._ok=item.grade();};
        inputs.forEach(inp=>inp.addEventListener('keydown',e=>{if(e.key==='Enter')item._ok=item.grade();}));
        const btns=document.createElement('div');btns.className='q-btns';
        btns.append(chk,sndBtn(s.en),ansBtn(reveal));
        row.append(sentDiv,btns,reveal);
        gradable.push(item);
      }
      pg.appendChild(row);
    });
    sec.appendChild(pg);
  });
  attachBar(sec,gradable,null);
  wrap.appendChild(sec);
}

    const btns=document.createElement('div');btns.className='q-btns';
    btns.append(chk,sndBtn(d.en),ansBtn(reveal));
    row.append(num,sentDiv,inpWrap,btns,reveal);
    sec.appendChild(row);items.push(item);
  });
  attachBar(sec,items,null);
  wrap.appendChild(sec);
}

/* ══════════════════════════════════════
   ⑤ 빈칸 추론 (수능형)
══════════════════════════════════════ */
function buildInfer(wrap){
  const sec=document.createElement('div');sec.className='sec';
  const head=document.createElement('div');head.className='sec-head';
  head.innerHTML='<span class="sec-badge b5r">⑤</span><span class="sec-title">빈칸 추론 — 문맥으로 단어 찾기</span><span class="level-tag lv-inf">수능형</span>';
  const desc=document.createElement('div');desc.className='sec-desc';desc.textContent='앞뒤 문맥을 읽고 빈칸에 가장 알맞은 표현을 고르세요';
  sec.append(head,desc);

  const nums=['①','②','③','④'];
  let doneCount=0;

  INFER_DATA.forEach((d,i)=>{
    const row=document.createElement('div');row.className='blank-item';
    const num=document.createElement('div');num.className='blank-num';num.textContent='Q'+(i+1);

    // 문맥 박스
    const ctx=document.createElement('div');
    ctx.style.cssText="font-family:'Lora',serif;font-style:italic;font-size:13px;background:#F7F5FF;border-radius:9px;padding:10px 14px;border-left:3px solid var(--border);margin-bottom:8px;color:var(--sub);line-height:1.75;";
    ctx.textContent='📖 '+d.context;

    // 질문
    const q=document.createElement('div');
    q.style.cssText='font-size:14px;font-weight:700;color:var(--ink);margin-bottom:10px;line-height:1.65;';
    q.innerHTML=d.q.replace('______','<span style="color:var(--purple);border-bottom:2px solid var(--purple);padding:0 4px;">______</span>');

    // 보기
    const og=document.createElement('div');og.className='choice-opts';og.style.flexDirection='column';og.style.gap='6px';
    const fb=document.createElement('div');fb.className='choice-fb';
    let done=false;

    d.opts.forEach((o,oi)=>{
      const b=document.createElement('button');
      b.style.cssText='padding:10px 14px;border:1.5px solid var(--border-lt);background:var(--bg);border-radius:10px;font-size:13px;font-family:inherit;cursor:pointer;text-align:left;color:var(--ink);transition:.13s;display:flex;align-items:center;gap:8px;';
      b.innerHTML=`<span style="font-weight:700;color:var(--muted);min-width:20px;">${nums[oi]}</span>${o}`;
      b.onmouseover=()=>{if(!done)b.style.background='var(--purple-lt)';};
      b.onmouseout=()=>{if(!done&&!b.classList.contains('ch-ok')&&!b.classList.contains('ch-no'))b.style.background='var(--bg)';};
      b.onclick=()=>{
        if(done)return;done=true;
        const ok=oi===d.ans;
        b.style.background=ok?'var(--ok-bg)':'var(--no-bg)';
        b.style.borderColor=ok?'var(--ok)':'var(--no)';
        b.style.color=ok?'var(--ok)':'var(--no)';
        if(!ok){
          const correct=[...og.children][d.ans];
          correct.style.background='var(--ok-bg)';correct.style.borderColor='var(--ok)';correct.style.color='var(--ok)';
        }
        [...og.children].forEach(x=>{x.style.cursor='default';});
        fb.className='choice-fb show '+(ok?'ok':'no');
        fb.textContent=(ok?'✅ ':'❌ ')+d.explain;
        doneCount++;
        if(doneCount===INFER_DATA.length)unlockNext();
      };
      og.appendChild(b);
    });

    row.append(num,ctx,q,og,fb);
    sec.appendChild(row);
  });

  const bar=document.createElement('div');bar.className='check-bar';
  const nb=mk('다음 단계로 →','check-btn cb-next');nb.style.display='inline-block';
  nb.onclick=()=>{unlockNext();if(curStage+1<STAGE_META.length)goStage(curStage+1);else showFinish();};
  bar.appendChild(nb);sec.appendChild(bar);
  wrap.appendChild(sec);
}

/* ══════════════════════════════════════
   ⑥ 핵심 영작 (힌트 단계 조절)
══════════════════════════════════════ */
function buildEng(wrap){
  const sec=document.createElement('div');sec.className='sec';
  const head=document.createElement('div');head.className='sec-head';
  head.innerHTML='<span class="sec-badge b6">⑥</span><span class="sec-title">핵심 문장 영작 — 10문장</span><span class="level-tag lv-write">추론</span>';
  const desc=document.createElement('div');desc.className='sec-desc';desc.textContent='한글을 보고 영어 문장을 써보세요 · 힌트는 막혔을 때만 사용하세요';
  sec.append(head,desc);

  const items=[];

  ENG_DATA.forEach((d,i)=>{
    const row=document.createElement('div');row.className='eng-item';
    const num=document.createElement('div');num.className='eng-num';num.textContent='문장 '+d.n;
    const kr=document.createElement('div');kr.className='eng-kr';kr.textContent=d.kr;

    // 힌트 칩 (기본 숨김)
    const hrow=document.createElement('div');hrow.className='hint-row';hrow.style.display='none';
    d.hints.forEach(h=>{const c=document.createElement('span');c.className='hint-chip';c.textContent=h;hrow.appendChild(c);});

    // 입력
    const ta=document.createElement('textarea');ta.className='eng-ta';ta.rows=2;
    ta.placeholder='영어로 써보세요...';

    // 채점 결과
    const fb=document.createElement('div');
    fb.style.cssText='font-size:12px;margin-top:6px;padding:7px 11px;border-radius:8px;display:none;';

    // 정답 reveal
    const reveal=document.createElement('div');reveal.className='ans-reveal';reveal.textContent=d.ans;

    let attempts=0;

    function gradeEng(){
      const val=ta.value.trim().toLowerCase().replace(/[.,!?]/g,'');
      const ans=d.ans.toLowerCase().replace(/[.,!?]/g,'');
      const ok=val===ans;
      attempts++;
      fb.style.display='block';
      if(ok){
        fb.style.background='var(--ok-bg)';fb.style.color='var(--ok)';
        fb.textContent='✅ 정확해요!';
        reveal.classList.add('open');
        return true;
      } else {
        fb.style.background='var(--no-bg)';fb.style.color='var(--no)';
        if(attempts===1){
          // 1회 오답 → 힌트 공개
          hrow.style.display='flex';
          fb.textContent='❌ 힌트를 보고 다시 도전해보세요!';
          hintBtn.style.display='none';
        } else {
          // 2회 이상 오답 → 정답 공개
          reveal.classList.add('open');
          fb.textContent='❌ 정답을 확인하고 다시 써보세요.';
        }
        return false;
      }
    }

    const chk=mk('채점','mini-btn');
    const hintBtn=mk('힌트 보기','mini-btn');
    const item={row,_ok:false,
      grade(){const ok=gradeEng();this._ok=ok;return ok;},
      reset(){ta.value='';fb.style.display='none';reveal.classList.remove('open');hrow.style.display='none';hintBtn.style.display='inline-block';attempts=0;this._ok=false;}};

    chk.onclick=()=>{item._ok=item.grade();};
    ta.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();item._ok=item.grade();}});
    hintBtn.onclick=()=>{hrow.style.display='flex';hintBtn.style.display='none';};

    const btns=document.createElement('div');btns.className='q-btns';
    btns.append(chk,hintBtn,sndBtn(d.ans),ansBtn(reveal));
    row.append(num,kr,hrow,ta,fb,btns,reveal);
    sec.appendChild(row);items.push(item);
  });

  attachBar(sec,items,null);
  wrap.appendChild(sec);
}

/* ══════════════════════════════════════
   초기화
══════════════════════════════════════ */
renderRail();
renderCurrentStage();
</script>
