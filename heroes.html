<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Exploring Greatness — 본문</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f5f4fa;--card:#fff;--card2:#eeecf7;
  --primary:#5b4fa8;--primary-lt:#ece9f8;--primary-dk:#3b2f8a;
  --accent:#e8a020;--accent-lt:#fef3dc;
  --text:#1a1a2e;--muted:#6b6880;--border:#d8d4ee;
  --ok:#1a7a3c;--ok-bg:#e8f5ec;--no:#c0392b;--no-bg:#fdecea;
  --info:#3a5fa8;--info-bg:#e8eef8;
  --mint:#dff5ec;--mint-t:#1d7a55;--sky:#e1effc;--sky-t:#2a64a8;
  --peach:#fde9df;--peach-t:#b5532a;--lav:#ece9f8;--lav-t:#5b4fa8;
  --r:12px;--shadow:0 2px 10px rgba(91,79,168,.10);
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:'Noto Sans KR',system-ui,sans-serif;background:var(--bg);color:var(--text);font-size:16px;line-height:1.65;-webkit-tap-highlight-color:transparent}
.en{font-family:'Noto Sans KR',system-ui,sans-serif}
header.top{background:linear-gradient(135deg,#3b2f8a,#7b6fd0);color:#fff;padding:16px 16px 0}
.top .brand{font-size:12px;opacity:.85;letter-spacing:.04em}
.top h1{font-size:21px;font-weight:800;margin:2px 0 2px}
.top .sub{font-size:13px;opacity:.9;margin-bottom:12px}
nav.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:12px;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;border:1.5px solid rgba(255,255,255,.45);background:rgba(255,255,255,.12);color:#fff;border-radius:999px;padding:7px 13px;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit;white-space:nowrap}
.tab.on{background:#fff;color:var(--primary-dk);border-color:#fff}
.tab .pg{font-size:11px;font-weight:700;margin-left:5px;opacity:.85}
main{max-width:780px;margin:0 auto;padding:16px 14px 80px}
.panel{display:none;animation:pin .25s ease}
.panel.on{display:block}
@keyframes pin{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.intro{background:var(--card);border:1px solid var(--border);border-left:4px solid var(--primary);border-radius:var(--r);padding:12px 14px;margin-bottom:14px;font-size:15px}
.intro b{color:var(--primary-dk)}
h2.sec{font-size:18px;font-weight:800;color:var(--primary-dk);margin:22px 2px 10px;display:flex;align-items:center;gap:8px}
h2.sec:first-child{margin-top:4px}
h3.sub{font-size:15.5px;font-weight:700;margin:14px 2px 8px;color:var(--primary)}
.box{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:14px;margin-bottom:12px;box-shadow:var(--shadow)}
.tip{background:var(--accent-lt);border:1px solid #f3d99a;border-radius:10px;padding:10px 12px;margin:10px 0;font-size:14.5px}
.tip b{color:#9a5b00}
.warn{background:var(--no-bg);border:1px solid #f2c4bd;border-radius:10px;padding:10px 12px;margin:10px 0;font-size:14.5px}
.warn b{color:var(--no)}
table.t{width:100%;border-collapse:collapse;font-size:14.5px;background:var(--card)}
table.t th{background:var(--primary-lt);color:var(--primary-dk);font-weight:700;padding:7px 6px;border:1px solid var(--border);text-align:left}
table.t td{padding:7px 6px;border:1px solid var(--border);vertical-align:top}
.tw{overflow-x:auto;border-radius:10px;margin-bottom:12px}
.badge{display:inline-block;font-size:11.5px;font-weight:700;border-radius:6px;padding:1px 7px;vertical-align:middle}
.b-mint{background:var(--mint);color:var(--mint-t)}.b-sky{background:var(--sky);color:var(--sky-t)}
.b-peach{background:var(--peach);color:var(--peach-t)}.b-lav{background:var(--lav);color:var(--lav-t)}
.b-amb{background:var(--accent-lt);color:#9a5b00}
.spk{border:none;background:var(--primary-lt);color:var(--primary);border-radius:8px;width:30px;height:30px;font-size:15px;cursor:pointer;flex:0 0 auto;line-height:30px;text-align:center}
.spk.playing{background:var(--primary);color:#fff}
.btn{border:1.5px solid var(--primary);background:#fff;color:var(--primary);border-radius:9px;padding:7px 13px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit}
.btn.fill{background:var(--primary);color:#fff}
.btn.sm{padding:4px 10px;font-size:13px}
.btn.ghost{border-color:var(--border);color:var(--muted)}
.btn:disabled{opacity:.45;cursor:default}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
/* word chips */
.wgrid{display:flex;flex-wrap:wrap;gap:6px}
.wchip{border:1px solid var(--border);background:var(--card);border-radius:9px;padding:5px 10px;font-size:14px;cursor:pointer}
.wchip b{color:var(--primary-dk)}
.wchip span{color:var(--muted);font-size:13px;margin-left:4px}
/* qset */
.qset{margin-bottom:18px}
.qhead{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;margin:18px 2px 10px}
.qhead h3{font-size:16.5px;font-weight:800;color:var(--primary-dk)}
.score{font-size:13px;font-weight:700;color:var(--primary);background:var(--primary-lt);border-radius:999px;padding:3px 10px}
.q{background:var(--card);border:1.5px solid var(--border);border-radius:var(--r);padding:13px 14px;margin-bottom:10px;box-shadow:var(--shadow)}
.q.ok{border-color:#8fd0a7;background:#fbfffc}
.q.no{border-color:#eba59c;background:#fffafa}
.qn{display:flex;gap:8px;align-items:flex-start;margin-bottom:8px}
.qn .num{flex:0 0 auto;background:var(--primary);color:#fff;font-weight:800;font-size:13px;border-radius:7px;min-width:26px;height:24px;line-height:24px;text-align:center;padding:0 5px;margin-top:2px}
.qn .qt{flex:1;font-weight:600;font-size:15.5px}
.qt u{text-decoration-thickness:2px;text-underline-offset:3px;text-decoration-color:var(--primary)}
.pass{background:var(--card2);border-radius:10px;padding:10px 12px;margin:6px 0 10px;font-size:15px;line-height:1.75}
.pass .ln{display:block}
.pass .sp{font-weight:800;color:var(--primary);margin-right:4px}
.pass u{text-decoration-thickness:2px;text-underline-offset:3px}
.mark{color:var(--primary);font-weight:800}
.opts{display:flex;flex-direction:column;gap:6px}
.opts.inline{flex-direction:row;flex-wrap:wrap}
.opt{text-align:left;border:1.5px solid var(--border);background:#fff;border-radius:10px;padding:8px 11px;font-size:15px;cursor:pointer;font-family:inherit;color:var(--text);line-height:1.5}
.opts.inline .opt{flex:0 0 auto}
.opt.sel{border-color:var(--primary);background:var(--primary-lt);font-weight:600}
.opt.right{border-color:var(--ok);background:var(--ok-bg)}
.opt.wrong{border-color:var(--no);background:var(--no-bg)}
.opt:disabled{cursor:default;color:var(--text)}
.blank{display:inline-block;min-width:70px;border:none;border-bottom:2px solid var(--primary);background:var(--primary-lt);border-radius:6px 6px 0 0;padding:2px 6px;margin:2px 2px;font-size:15px;font-family:inherit;color:var(--text);text-align:center}
.blank.wide{display:block;width:100%;text-align:left;margin:6px 0;padding:8px 10px;border-radius:8px;border:1.5px solid var(--border);border-bottom:2px solid var(--primary)}
.blank.right{background:var(--ok-bg);border-bottom-color:var(--ok)}
.blank.wrong{background:var(--no-bg);border-bottom-color:var(--no)}
.tmpl{font-size:15.5px;line-height:2.1}
.ordwrap{display:flex;flex-direction:column;gap:8px}
.slots{min-height:48px;border:2px dashed var(--border);border-radius:10px;padding:7px;display:flex;flex-wrap:wrap;gap:6px;background:#fcfbff}
.slots.block{flex-direction:column}
.slots .hint{color:var(--muted);font-size:13px;align-self:center;padding:4px}
.pool{display:flex;flex-wrap:wrap;gap:6px}
.pool.block{flex-direction:column}
.chip{border:1.5px solid var(--primary);background:#fff;color:var(--primary-dk);border-radius:9px;padding:6px 11px;font-size:15px;cursor:pointer;font-family:inherit;text-align:left;line-height:1.45}
.chip.used{visibility:hidden}
.slots .chip{background:var(--primary-lt)}
.chip:disabled{cursor:default}
.qfoot{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:10px}
.fb{margin-top:9px;border-radius:9px;padding:9px 11px;font-size:14.5px;display:none}
.fb.show{display:block}
.fb.ok{background:var(--ok-bg);color:#145c2e}
.fb.no{background:var(--no-bg);color:#8e2a1f}
.fb.ans{background:var(--info-bg);color:#24406f}
.fb b{font-weight:800}
.qbar{display:flex;gap:6px;flex-wrap:wrap;margin:4px 0 6px}
.sticky{position:sticky;bottom:10px;display:flex;justify-content:center;gap:8px;margin-top:6px;z-index:5}
.sticky .btn{box-shadow:0 4px 14px rgba(59,47,138,.25)}
/* analysis cards */
.acard{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:12px 13px;margin-bottom:9px;box-shadow:var(--shadow)}
.acard .kr{font-size:16px;font-weight:600}
.acard .kr .no{color:var(--primary);font-weight:800;margin-right:6px}
.chunks{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}
.ck{border:1.5px solid var(--border);border-radius:9px;padding:5px 9px;background:#fcfbff;cursor:pointer;font-size:14px;text-align:left;font-family:inherit;color:var(--text)}
.ck small{display:block;color:var(--primary);font-weight:800;font-size:11px}
.ck .ce{display:none;color:var(--primary-dk);font-weight:700}
.ck.open .ce{display:block}
.ck.open{border-color:var(--primary);background:var(--primary-lt)}
.aen{display:none;margin-top:9px;background:var(--card2);border-radius:9px;padding:8px 10px}
.aen.show{display:block}
.aen .s{font-size:16px;font-weight:700;color:var(--primary-dk)}
.aen .tp{font-size:14px;color:#6a4a00;margin-top:5px}
.parahead{background:var(--primary-lt);border-radius:10px;padding:9px 12px;margin:18px 0 9px;font-size:14.5px}
.parahead b{color:var(--primary-dk);font-size:15.5px}
/* dialogue script */
.script{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:12px 13px;margin-bottom:10px;box-shadow:var(--shadow)}
.script .shead{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px;flex-wrap:wrap}
.script .shead b{color:var(--primary-dk);font-size:15.5px}
.line{display:flex;gap:8px;align-items:flex-start;padding:5px 0;border-bottom:1px dashed #ebe8f5}
.line:last-child{border-bottom:none}
.line .who{flex:0 0 auto;min-width:24px;font-weight:800;color:var(--primary)}
.line .tx{flex:1}
.line .ko{display:none;color:var(--muted);font-size:14px}
.script.kr .line .ko{display:block}
/* tapfill */
.tf{font-size:16px;line-height:2.2}
.tfb{display:inline-block;min-width:56px;border-bottom:2px solid var(--primary);background:var(--primary-lt);border-radius:6px 6px 0 0;padding:0 7px;text-align:center;cursor:pointer;color:transparent;font-weight:700;user-select:none}
.tfb.next{animation:pulse 1.4s infinite}
.tfb.open{color:var(--primary-dk);background:#fff3c9;border-bottom-color:var(--accent);cursor:default}
.tfb.shake{animation:shake .3s}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(91,79,168,.35)}50%{box-shadow:0 0 0 5px rgba(91,79,168,0)}}
@keyframes shake{0%,100%{transform:none}25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.formula{background:var(--card);border:2px solid var(--primary);border-radius:var(--r);padding:14px;margin-bottom:12px;text-align:center;font-size:18px;font-weight:800;color:var(--primary-dk);line-height:1.8}
.formula .f{display:inline-block;border-radius:8px;padding:2px 8px;margin:2px}
.steps{counter-reset:st}
.step{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:11px 13px;margin-bottom:8px;box-shadow:var(--shadow)}
.step .h{font-weight:800;color:var(--primary-dk)}
.step .h .n{display:inline-block;background:var(--primary);color:#fff;border-radius:6px;font-size:12px;padding:1px 7px;margin-right:6px}
.foot{text-align:center;color:var(--muted);font-size:12px;margin-top:30px}
@media (max-width:480px){
  .top h1{font-size:19px}
  main{padding:12px 12px 80px}
  .opt,.chip{font-size:14.5px}
}
/* v2 additions */
.spk.mini{width:24px;height:24px;line-height:24px;font-size:12px;border-radius:6px;vertical-align:middle;margin-left:4px}
.wl .wrow{border-bottom:1px dashed #e4e0f3;padding:8px 2px}
.wl .wrow:last-child{border-bottom:none}
.wtop{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.wn{font-size:12px;color:var(--muted);min-width:20px}
.ww{font-size:16.5px;color:var(--primary-dk)}
.wm{color:var(--text);font-size:15px;border-radius:6px;padding:0 4px}
.wl.hidem .wm{background:var(--card2);color:transparent;cursor:pointer;min-width:90px;display:inline-block}
.wl.hidem .wm.on{background:#fff3c9;color:var(--text)}
.wex{margin:4px 0 0 28px}
.wen{display:flex;align-items:center;gap:6px;font-size:15px;cursor:pointer}
.wen .spk{width:26px;height:26px;line-height:26px;font-size:13px}
.wk{display:none;color:var(--muted);font-size:14px}
.wl.showk .wk,.wrow.kon .wk{display:block}
.flip .frow{border-bottom:1px dashed #e4e0f3;padding:7px 2px}
.flip .frow:last-child{border-bottom:none}
.fen{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:15.5px}
.fen .en{flex:1;min-width:180px}
.fkr{display:none;margin-top:4px;background:#fff8e6;border-radius:8px;padding:6px 9px;font-size:14.5px}
.frow.on .fkr{display:block}
.fnote{color:#8a5a00;font-size:13.5px;margin-top:2px}
.rv{background:var(--card2);color:transparent;border-radius:5px;cursor:pointer;padding:0 4px;user-select:none}
.rv.on{background:#fff3c9;color:inherit}
.fam{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.fam .fc{border:1px solid var(--border);border-radius:8px;padding:3px 8px;background:#fff;font-size:14px}
.fam .fc i{font-style:normal;color:var(--muted);font-size:12px;margin-right:3px}
.anal{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:13px 14px;margin-bottom:12px;box-shadow:var(--shadow);font-size:15px}
.anal h4{font-size:15.5px;color:var(--primary-dk);margin:10px 0 4px}
.anal h4:first-child{margin-top:0}
.anal ol,.anal ul{padding-left:20px}
.anal li{margin:3px 0}
details>summary{list-style:none;display:inline-block;cursor:pointer}
details>summary::-webkit-details-marker{display:none}
.pass.big{background:#fff;border:1.5px solid var(--border);font-size:15.5px;line-height:1.9;padding:12px 14px;position:sticky;top:0;z-index:3;max-height:42vh;overflow:auto;box-shadow:var(--shadow)}
.ref{color:var(--primary);font-weight:700;text-decoration:underline;text-decoration-style:dotted;text-underline-offset:3px;cursor:pointer;background:var(--primary-lt);border-radius:4px;padding:0 3px}
.refsheet{position:fixed;left:0;right:0;bottom:0;z-index:50;background:#fff;border-top:2px solid var(--primary);box-shadow:0 -6px 24px rgba(59,47,138,.18);max-height:55vh;display:none;flex-direction:column;border-radius:14px 14px 0 0}
.refsheet.show{display:flex}
.refsheet .rhead{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;border-bottom:1px solid var(--border)}
.refsheet .rhead b{color:var(--primary-dk)}
.refsheet .rclose{border:none;background:var(--primary-lt);color:var(--primary);border-radius:8px;width:32px;height:32px;font-size:16px;cursor:pointer}
.refsheet .rbody{overflow:auto;padding:8px 14px 16px;max-width:780px;width:100%;margin:0 auto}
.refsheet .rrow{padding:7px 0;border-bottom:1px dashed #e4e0f3}
.refsheet .rtop{display:flex;gap:8px;align-items:flex-start}
.refsheet .rn{flex:0 0 auto;background:var(--primary);color:#fff;font-weight:800;font-size:12px;border-radius:6px;padding:1px 7px;margin-top:3px}
.refsheet .ren{flex:1;font-weight:700;color:var(--primary-dk);font-size:15.5px}
.refsheet .rkr{color:var(--muted);font-size:14px;margin-left:34px}
.ref{white-space:nowrap}
.drill .dact{font-size:16px;font-weight:700;display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.drill .dno{background:var(--primary);color:#fff;border-radius:7px;font-size:13px;padding:1px 8px}
.drill .dkr{flex-basis:100%;color:var(--muted);font-size:14px;font-weight:400}
.drill .dlabel{margin:10px 0 6px;font-size:14px;color:var(--muted)}
.dslots{display:flex;flex-wrap:wrap;gap:6px}
.dslot{border:2px dashed var(--border);border-radius:10px;padding:4px 10px;min-width:70px;text-align:center;background:#fcfbff}
.dslot small{display:block;font-size:11px;color:var(--muted);font-weight:700}
.dslot b{font-size:16px;color:#b9b3d6}
.dslot.on{border-style:solid;border-color:var(--primary);background:var(--primary-lt)}
.dslot.on b{color:var(--primary-dk)}
.dtags{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0 2px}
.dstep{margin-top:8px;border-top:1px dashed var(--border);padding-top:10px}
.dq{font-weight:600;margin-bottom:8px;font-size:15.5px}
.dq .dn{display:inline-block;background:var(--accent-lt);color:#9a5b00;border-radius:6px;font-size:12px;font-weight:800;padding:1px 7px;margin-right:4px}
.dfinal{background:var(--ok-bg);border-radius:10px;padding:10px 12px;color:#145c2e}
.dfinal .tp{color:#6a4a00;font-size:14px;margin-top:5px}
.rv{display:inline-block;min-width:56px;min-height:1.5em;vertical-align:middle}
input.blank:not(.wide){width:7.5em;max-width:60vw}

.scene{border-left:4px solid var(--primary);background:var(--primary-lt);border-radius:0 10px 10px 0;padding:10px 12px;margin:10px 0}
.scene .sch{font-weight:800;color:var(--primary-dk);font-size:15.5px;margin-bottom:4px}
.scene .sno{display:inline-block;background:var(--primary);color:#fff;border-radius:50%;width:22px;height:22px;line-height:22px;text-align:center;font-size:12.5px;margin-right:6px}
.scene .srng{font-weight:500;font-size:13px;color:var(--muted)}
.scene p{font-size:15.5px;line-height:1.85}
.scene .skw{margin-top:6px;display:flex;flex-wrap:wrap;gap:4px}
.scene .kw{font-size:12.5px;color:var(--muted);background:#fff;border:1px solid var(--border);border-radius:999px;padding:1px 8px}

</style>
</head>

<script>
window.DATA={"file":"exploringgreatnesswriting.html","brand":"강동미나 중고등부 · 중2 Lesson 6 (천재 이상기)","title":"Exploring Greatness — 본문","sub":"위대함 탐험하기 · 한글 분석 → 중요 표현 → 거꾸로 영작 → 문법 · 지시어 · 순서 · 내용확인","sents":{"1":["One day, Emily received an invitation from a museum.","어느 날, Emily는 박물관으로부터 초대장을 받았습니다."],"2":["This museum wasn't any ordinary museum.","이 박물관은 평범한 박물관이 아니었습니다."],"3":["It had rooms that celebrated great people.","그곳에는 위대한 사람들을 기념하는 방들이 있었습니다."],"4":["She was excited to begin her exploration.","그녀는 그녀의 탐험을 시작하게 되어 들떠 있었습니다."],"5":["Her first stop was a room that looked like an old airplane garage.","그녀의 첫 방문지는 오래된 비행기 격납고처럼 보이는 방이었습니다."],"6":["Model airplanes were hanging from the ceiling.","모형 비행기들이 천장에 매달려 있었습니다."],"7":["A leather pilot jacket and goggles were displayed.","가죽 비행사 재킷과 고글이 전시되어 있었습니다."],"8":["When Emily put them on, she could hear the sounds of airplane engines.","Emily가 그것들을 착용했을 때, 그녀는 비행기 엔진 소리를 들을 수 있었습니다."],"9":["She looked around the room in surprise.","그녀는 놀라서 방을 둘러보았습니다."],"10":["On the wall, there was a picture of a woman.","벽에는 한 여성의 사진이 있었습니다."],"11":["She looked brave and strong.","그녀는 용감하고 강해 보였습니다."],"12":["Her name was Kwon Ki-ok.","그녀의 이름은 권기옥이었습니다."],"13":["She was the first female pilot in Korea.","그녀는 한국 최초의 여성 비행사였습니다."],"14":["Emily also found an old newspaper on the desk.","Emily는 책상 위에서 오래된 신문도 발견했습니다."],"15":["It read, \"At that time, women couldn't enter flight schools.\"","그것에는 이렇게 쓰여 있었습니다. \"당시에 여성들은 비행 학교에 들어갈 수 없었다.\""],"16":["\"However, Kwon Ki-ok didn't give up and worked hard to achieve her dream.\"","\"하지만 권기옥은 포기하지 않았고 꿈을 이루기 위해 열심히 노력했다.\""],"17":["Kwon Ki-ok did not just fly airplanes.","권기옥은 단지 비행기만 조종한 것이 아니었습니다."],"18":["She also fought against Japan for Korea's independence.","그녀는 한국의 독립을 위해 일본에 맞서 싸우기도 했습니다."],"19":["Emily was moved by the great life story of Kwon Ki-ok.","Emily는 권기옥의 위대한 삶의 이야기에 감동을 받았습니다."],"20":["Emily stepped into the next room.","Emily는 다음 방으로 들어갔습니다."],"21":["The room was filled with many books and drawings of insects and plants.","그 방은 많은 책들과 곤충과 식물의 그림들로 가득 차 있었습니다."],"22":["It looked like a small forest.","그곳은 작은 숲처럼 보였습니다."],"23":["When she closed the door, drawings on the desk suddenly started to fly around the room.","그녀가 문을 닫았을 때, 책상 위의 그림들이 갑자기 방 안 여기저기를 날아다니기 시작했습니다."],"24":["She caught one of them.","그녀는 그것들 중 하나를 잡았습니다."],"25":["It was a drawing of a honeybee.","그것은 꿀벌의 그림이었습니다."],"26":["It was so detailed that the honeybee looked alive.","그것은 너무 자세해서 꿀벌이 살아 있는 것처럼 보였습니다."],"27":["From one of the bookshelves, Emily found a shining book.","책장 중 하나에서, Emily는 빛나는 책을 발견했습니다."],"28":["She picked it up.","그녀는 그것을 집어 들었습니다."],"29":["She saw the name Jean-Henri Fabre on its cover.","그녀는 표지에서 Jean-Henri Fabre라는 이름을 보았습니다."],"30":["When she opened the book, she found an old letter from Charles Darwin.","그녀는 책을 열었을 때, Charles Darwin에게서 온 오래된 편지를 발견했습니다."],"31":["It said, \"Thank you for sending me your book.\"","그것에는 이렇게 쓰여 있었습니다. \"저에게 당신의 책을 보내 주셔서 감사합니다.\""],"32":["\"I truly love your work about insects.\"","\"저는 곤충에 관한 당신의 연구를 진심으로 사랑합니다.\""],"33":["Emily learned that Fabre wrote many books about insects for more than thirty years.","Emily는 Fabre가 30년 넘게 곤충에 관한 많은 책들을 썼다는 것을 알게 되었습니다."],"34":["His true love for nature was shown clearly in every corner of the room.","자연에 대한 그의 진정한 사랑은 방의 모든 구석에서 분명하게 보여졌습니다."],"35":["Emily stepped out of the last room.","Emily는 마지막 방에서 나왔습니다."],"36":["She was so excited that she could not wait to tell her friends about her adventure.","그녀는 너무 신이 나서 친구들에게 자신의 모험에 대해 빨리 이야기하고 싶었습니다."]},"tabs":[{"name":"🔍 한글 분석","intro":"<b>먼저 📖 이야기로 쭉 읽고</b>, 국어 독해하듯이 분석해요. ① 글의 구조(서론·본론·결론) → ② 주제 찾기 → ③ 근거 문장 → ④ 두 방 비교와 대비 → ⑤ Emily의 감정 변화 → ⑥ 연결어 → ⑦ 핵심 문법 → ⑧ 문장별 한글 분석. <b>번호(예: 19번)를 누르면 영어 원문이 아래에 떠요.</b>","blocks":[{"k":"h","html":"📖 먼저 이야기로 읽기 — 장면 6개"},{"k":"html","html":"<div class=\"anal\"><div class=\"tip\" style=\"margin-top:0\"><b>한 줄로 말하면</b> — Emily가 신기한 박물관에서 <b>권기옥</b>과 <b>파브르</b>를 만나, 위대한 사람이 어떤 사람인지 느끼는 이야기예요.</div><div class=\"scene\"><div class=\"sch\"><span class=\"sno\">1</span>🎟️ 초대장 한 장 <span class=\"srng\">1~4번</span></div><p>어느 날 Emily에게 박물관 초대장이 날아와요. 그런데 이곳은 <b>그냥 박물관이 아니에요.</b> 위대한 사람들을 기념하는 방들이 있는 특별한 곳이거든요. Emily는 어떤 사람을 만나게 될지 <b>설레는 마음</b>으로 탐험을 시작해요.</p><div class=\"skw\"><span class=\"kw\">invitation</span><span class=\"kw\">ordinary</span><span class=\"kw\">celebrate</span><span class=\"kw\">excited</span></div></div><div class=\"scene\"><div class=\"sch\"><span class=\"sno\">2</span>✈️ 첫 번째 방 — 비행기 격납고 <span class=\"srng\">5~13번</span></div><p>첫 번째 방에 들어서니 오래된 비행기 격납고 같아요. 천장에는 모형 비행기가 매달려 있고, 가죽 비행사 재킷과 고글이 전시되어 있어요. Emily가 그걸 입고 쓰는 순간, <b>부웅— 비행기 엔진 소리</b>가 들려요! 깜짝 놀라 둘러보니 벽에 용감하고 강해 보이는 여성의 사진이 있어요. 바로 <b>한국 최초의 여성 비행사, 권기옥</b>이에요.</p><div class=\"skw\"><span class=\"kw\">stop</span><span class=\"kw\">garage</span><span class=\"kw\">display</span><span class=\"kw\">put on</span><span class=\"kw\">in surprise</span><span class=\"kw\">female pilot</span></div></div><div class=\"scene\"><div class=\"sch\"><span class=\"sno\">3</span>📰 권기옥은 왜 위대할까? <span class=\"srng\">14~19번</span></div><p>책상 위 오래된 신문에 이렇게 쓰여 있어요. \"그 시절 여성은 비행 학교에 들어갈 수조차 없었다.\" <b>하지만</b> 권기옥은 포기하지 않고 열심히 노력해서 꿈을 이뤘어요. 게다가 비행기만 몬 게 아니라 한국의 독립을 위해 일본에 맞서 싸우기<b>까지</b> 했어요. Emily는 그녀의 삶에 <b>깊이 감동</b>해요.</p><div class=\"skw\"><span class=\"kw\">read</span><span class=\"kw\">enter</span><span class=\"kw\">However</span><span class=\"kw\">give up</span><span class=\"kw\">achieve</span><span class=\"kw\">independence</span><span class=\"kw\">be moved by</span></div></div><div class=\"scene\"><div class=\"sch\"><span class=\"sno\">4</span>🌳 두 번째 방 — 작은 숲 <span class=\"srng\">20~29번</span></div><p>다음 방은 책과 곤충·식물 그림으로 가득해서 <b>작은 숲</b> 같아요. Emily가 문을 닫자, 책상 위 그림들이 <b>갑자기 방 안을 날아다녀요!</b> 하나를 잡아 보니 꿀벌 그림인데, 너무 자세해서 진짜 살아 있는 벌 같아요. 책장에서 반짝이는 책 한 권을 꺼내 보니, 표지에 <b>Fabre(파브르)</b>라는 이름이 있어요.</p><div class=\"skw\"><span class=\"kw\">step into</span><span class=\"kw\">be filled with</span><span class=\"kw\">look like</span><span class=\"kw\">suddenly</span><span class=\"kw\">so ~ that</span><span class=\"kw\">shining</span><span class=\"kw\">pick up</span></div></div><div class=\"scene\"><div class=\"sch\"><span class=\"sno\">5</span>✉️ 파브르는 왜 위대할까? <span class=\"srng\">30~34번</span></div><p>책을 펼치자 <b>다윈이 보낸 편지</b>가 나와요. \"책을 보내 줘서 고마워요. 곤충에 관한 당신의 연구를 정말 좋아해요.\" 그 유명한 다윈도 인정한 사람이었던 거예요. 파브르는 <b>30년 넘게</b> 곤충 책을 썼고, 자연을 사랑하는 그의 마음이 방 구석구석에 그대로 보여요.</p><div class=\"skw\"><span class=\"kw\">letter from</span><span class=\"kw\">Thank you for -ing</span><span class=\"kw\">truly</span><span class=\"kw\">more than</span><span class=\"kw\">be shown</span></div></div><div class=\"scene\"><div class=\"sch\"><span class=\"sno\">6</span>🚪 다시 현실로 <span class=\"srng\">35~36번</span></div><p>마지막 방에서 나온 Emily는 <b>너무 신이 나서</b>, 오늘의 모험을 친구들에게 빨리 이야기하고 싶어 못 견딜 지경이에요. 처음(4번)의 설렘이 끝에서 더 큰 신남으로 돌아온 거예요.</p><div class=\"skw\"><span class=\"kw\">step out of</span><span class=\"kw\">so excited that</span><span class=\"kw\">can't wait to</span><span class=\"kw\">adventure</span></div></div><div class=\"tip\"><b>두 방은 똑같은 순서로 흘러가요.</b> 방에 들어가면 신기한 일이 생기고, 물건(사진·신문 / 책·편지)을 통해 인물을 알게 되고, 마지막에 그 사람의 위대함을 느껴요. 이 순서만 기억하면 문장 순서 문제가 쉬워져요.</div><div style=\"font-size:13px;color:var(--muted);margin-top:6px\">회색 글씨 = 그 장면에 나오는 영어 표현 · 번호를 누르면 영어 원문</div></div>"},{"k":"h","html":"① 글의 구조 — 서론 · 본론 · 결론"},{"k":"html","html":"<div class=\"anal\">\n<div class=\"tw\"><table class=\"t\">\n<tr><th style=\"white-space:nowrap\">구분</th><th style=\"white-space:nowrap\">문장</th><th>내용</th><th>역할</th></tr>\n<tr><td><b>서론</b></td><td>1~4번</td><td>Emily가 특별한 박물관의 초대장을 받고, 설레는 마음으로 탐험을 시작한다.</td><td><b>소재 제시</b> (위대한 사람들) + 기대감</td></tr>\n<tr><td rowspan=\"2\"><b>본론 1</b><br>첫 번째 방</td><td>5~13번</td><td>비행기 격납고 같은 방에서 재킷과 고글을 착용하자 엔진 소리가 들리고, 사진 속 권기옥을 만난다.</td><td>인물을 <b>신기한 체험</b>으로 만남</td></tr>\n<tr><td>14~19번</td><td>신문을 보고 권기옥이 여성은 비행 학교에 갈 수 없던 시대에도 포기하지 않았고, 독립운동까지 했다는 것을 알게 되어 감동한다.</td><td>권기옥의 <b>위대함</b></td></tr>\n<tr><td rowspan=\"2\"><b>본론 2</b><br>두 번째 방</td><td>20~26번</td><td>작은 숲 같은 방에서 문을 닫자 그림들이 날아다니고, 살아 있는 것 같은 꿀벌 그림을 잡는다.</td><td>인물을 <b>신기한 체험</b>으로 만남</td></tr>\n<tr><td>27~34번</td><td>빛나는 책과 다윈의 편지를 통해 파브르가 30년 넘게 곤충을 연구했고 자연을 진심으로 사랑했다는 것을 안다.</td><td>파브르의 <b>위대함</b></td></tr>\n<tr><td><b>결론</b></td><td>35~36번</td><td>마지막 방에서 나온 Emily는 너무 신이 나서 친구들에게 빨리 이야기하고 싶어 한다.</td><td>탐험의 <b>감동</b>으로 마무리 (4번과 수미상관)</td></tr>\n</table></div>\n<div class=\"tip\"><b>이 글은 판타지 이야기(fantasy story)</b> — 주인공 Emily + 현실에서 불가능한 일(재킷을 입자 엔진 소리 8번, 그림이 날아다님 23번). 실제 위인 두 명의 이야기가 들어 있지만, 글 전체는 전기문(biography)이 아니에요.<br><b>본론 1과 본론 2가 똑같은 틀</b>로 되어 있어요 → ④ 두 방 비교 표 참고!</div>\n</div>"},{"k":"h","html":"② 주제 찾기"},{"k":"html","html":"<div class=\"anal\">\n<h4>📌 이야기 글은 주제문이 \"딱 한 문장\"으로 없을 수 있어요</h4>\n설명문처럼 \"교훈은 ~이다\"라고 직접 말하지 않아요. 그래서 <b>제목 + 각 방의 마지막 문장 + 결말</b>을 보고 주제를 찾아요.\n<div class=\"tw\"><table class=\"t\">\n<tr><th style=\"white-space:nowrap\">단서</th><th style=\"white-space:nowrap\">문장</th><th>알 수 있는 것</th></tr>\n<tr><td>제목</td><td>Exploring Greatness</td><td>위대함을 <b>탐험하는</b> 이야기</td></tr>\n<tr><td>소재 제시</td><td>3번</td><td>위대한 사람들을 <b>기념하는</b> 방들</td></tr>\n<tr><td>첫 번째 방의 마무리</td><td>19번</td><td>Emily는 권기옥의 위대한 삶에 <b>감동</b>받았다</td></tr>\n<tr><td>두 번째 방의 마무리</td><td>34번</td><td>파브르의 자연에 대한 <b>진정한 사랑</b>이 분명하게 보였다</td></tr>\n<tr><td>결말</td><td>36번</td><td>너무 신나서 친구들에게 모험을 <b>빨리 이야기하고 싶었다</b></td></tr>\n</table></div>\n<h4>📌 주제</h4>\nEmily가 특별한 박물관을 탐험하며 <b>위인들의 삶에서 위대함을 발견하고 감동받는 경험</b>.<br>\n위대함이란? → 권기옥: 어려움 속에서도 <b>포기하지 않은 용기</b> / 파브르: 자연을 <b>진심으로 사랑하고 오래 연구한 열정</b>\n</div>"},{"k":"flip","title":"주제 영어로 바꿔 쓰기 — 시험에 이렇게 나와요","note":"주제·제목 선택지는 본문 문장 그대로가 아니라 <b>다른 표현으로 바꿔서</b> 나와요. 🔊 듣고 뜻 떠올리기!","rows":[["Emily discovers the greatness of famous people by exploring a special museum.","Emily는 특별한 박물관을 탐험하며 위인들의 위대함을 발견한다.","글 전체 요약"],["Great people never give up and truly love their work.","위대한 사람들은 포기하지 않고 자신의 일을 진심으로 사랑한다.","두 인물의 공통점"],["Kwon Ki-ok didn't give up her dream even in hard times.","권기옥은 어려운 시기에도 꿈을 포기하지 않았다.","첫 번째 방의 핵심"],["Fabre's true love for nature can be seen in his work.","파브르의 자연에 대한 진정한 사랑은 그의 연구에서 볼 수 있다.","두 번째 방의 핵심 (34번 바꿔 쓰기)"],["Emily was moved by the stories of great people.","Emily는 위인들의 이야기에 감동받았다.","19번 확장"],["Exploring Greatness","위대함 탐험하기","원래 제목"],["Emily's Amazing Adventure in a Special Museum","특별한 박물관에서의 Emily의 놀라운 모험","제목 후보"],["Meeting Great People in a Museum","박물관에서 위인을 만나다","제목 후보"]]},{"k":"h","html":"③ 근거 문장 찾기 — 왜 \"위대한\" 사람일까?"},{"k":"html","html":"<div class=\"anal\">\n<div class=\"tw\"><table class=\"t\">\n<tr><th style=\"white-space:nowrap\">인물</th><th>위대함의 근거</th><th style=\"white-space:nowrap\">문장</th></tr>\n<tr><td rowspan=\"3\"><b>권기옥</b></td><td>한국 <b>최초의</b> 여성 비행사</td><td>13번</td></tr>\n<tr><td>여성은 비행 학교에 들어갈 수 없던 시대에 <b>포기하지 않고</b> 열심히 노력함</td><td>15, 16번</td></tr>\n<tr><td>비행기만 조종한 게 아니라 한국의 <b>독립</b>을 위해 일본에 맞서 싸움</td><td>17, 18번</td></tr>\n<tr><td rowspan=\"3\"><b>파브르</b></td><td>그림이 살아 있는 듯 <b>자세함</b> (관찰력)</td><td>26번</td></tr>\n<tr><td>유명한 과학자 <b>다윈</b>도 그의 곤충 연구를 사랑함 (인정받음)</td><td>30, 31, 32번</td></tr>\n<tr><td><b>30년 넘게</b> 곤충 책을 씀 + 자연에 대한 진정한 사랑</td><td>33, 34번</td></tr>\n</table></div>\n<div class=\"warn\"><b>함정!</b> 30년 넘게 곤충 책을 쓴 사람은 <b>파브르</b>예요. 다윈은 편지를 쓴 사람(30번). 또 그림이 날아다닌 건 문을 <b>열었을 때</b>가 아니라 <b>닫았을 때</b>(23번)!</div>\n</div>"},{"k":"h","html":"④ 두 방 비교 — 같은 틀, 다른 인물"},{"k":"html","html":"<div class=\"anal\">\n<div class=\"tw\"><table class=\"t\">\n<tr><th>틀</th><th>첫 번째 방 (권기옥)</th><th>두 번째 방 (파브르)</th></tr>\n<tr><td>방에 들어감</td><td>5번 Her <b>first stop</b></td><td>20번 stepped into the <b>next room</b></td></tr>\n<tr><td>방의 모습</td><td>5번 격납고처럼 <b>보이는</b> 방 (look like)</td><td>22번 작은 숲처럼 <b>보임</b> (look like)</td></tr>\n<tr><td>신기한 일</td><td>8번 재킷·고글을 <b>착용했을 때</b> → 엔진 소리</td><td>23번 문을 <b>닫았을 때</b> → 그림이 날아다님</td></tr>\n<tr><td>발견한 물건</td><td>10번 사진, 14번 오래된 신문</td><td>27번 빛나는 책, 30번 다윈의 편지</td></tr>\n<tr><td>\"~라고 쓰여 있었다\"</td><td>15번 It <b>read</b>, \"...\"</td><td>31번 It <b>said</b>, \"...\"</td></tr>\n<tr><td>인물의 위대함</td><td>16~18번 포기 X + 독립운동</td><td>33, 34번 30년 연구 + 자연 사랑</td></tr>\n<tr><td>방의 마무리</td><td>19번 Emily가 <b>감동</b>받음 (수동태)</td><td>34번 사랑이 <b>보여짐</b> (수동태)</td></tr>\n</table></div>\n<h4>📌 대비되는 표현</h4>\n<div class=\"tw\"><table class=\"t\">\n<tr><th>앞</th><th>뒤</th><th>무엇이 대비되나</th></tr>\n<tr><td>15번 여성들은 비행 학교에 <b>들어갈 수 없었다</b></td><td>16번 <b>However</b>, 포기하지 않고 노력했다</td><td>어려운 상황 ↔ 포기하지 않음</td></tr>\n<tr><td>17번 <b>not just</b> 비행기만 조종</td><td>18번 <b>also</b> 독립운동</td><td>하나만이 아니라 하나 더</td></tr>\n<tr><td>2번 <b>평범한</b> 박물관이 아니었다</td><td>8, 23번 엔진 소리, 날아다니는 그림</td><td>평범 ↔ 신기함</td></tr>\n<tr><td>20번 step <b>into</b> (들어감)</td><td>35번 step <b>out of</b> (나옴)</td><td>탐험의 시작 ↔ 끝</td></tr>\n<tr><td>4번 탐험을 시작하게 되어 <b>들뜸</b></td><td>36번 <b>너무 신나서</b> 빨리 말하고 싶음</td><td>수미상관 (설렘 → 감동)</td></tr>\n</table></div>\n</div>"},{"k":"h","html":"⑤ Emily의 감정 변화"},{"k":"html","html":"<div class=\"anal\">\n<div class=\"tw\"><table class=\"t\">\n<tr><th style=\"white-space:nowrap\">문장</th><th>감정</th><th>표현</th><th>이유</th></tr>\n<tr><td>4번</td><td>설렘</td><td>was <b>excited</b> to begin</td><td>탐험을 시작하게 되어</td></tr>\n<tr><td>9번</td><td>놀람</td><td>in <b>surprise</b></td><td>재킷을 입자 엔진 소리가 들려서</td></tr>\n<tr><td>19번</td><td>감동</td><td>was <b>moved</b> by</td><td>권기옥의 위대한 삶의 이야기</td></tr>\n<tr><td>36번</td><td>매우 신남</td><td><b>so excited</b> that ~ could not wait to</td><td>모험을 친구들에게 빨리 말하고 싶어서</td></tr>\n</table></div>\n<div class=\"tip\"><b>감정 형용사는 -ed</b> — Emily(사람)가 감정을 <b>느끼면</b> excited, moved. exciting ✗. 심경 변화 문제: <b>excited → surprised → moved → excited</b></div>\n</div>"},{"k":"h","html":"⑥ 연결어 — 앞 문장과 뒤 문장을 어떻게 잇나"},{"k":"html","html":"<div class=\"anal\">\n<div class=\"tw\"><table class=\"t\">\n<tr><th style=\"white-space:nowrap\">연결어</th><th style=\"white-space:nowrap\">문장</th><th>앞 내용</th><th>뒤 내용</th><th style=\"white-space:nowrap\">관계</th></tr>\n<tr><td>One day 어느 날</td><td>1번</td><td>—</td><td>초대장을 받음</td><td>이야기 시작</td></tr>\n<tr><td>When ~했을 때</td><td>8번</td><td>재킷과 고글을 착용</td><td>엔진 소리가 들림</td><td>시간 → 신기한 일</td></tr>\n<tr><td>also ~도</td><td>14번</td><td>벽의 사진을 봄</td><td>오래된 신문도 발견</td><td>추가</td></tr>\n<tr><td>However 하지만</td><td>16번</td><td>여성은 비행 학교 입학 불가</td><td>포기하지 않고 노력</td><td><b>대조</b></td></tr>\n<tr><td>not just ~ also</td><td>17, 18번</td><td>비행기만 조종한 게 아니라</td><td>독립운동도 함</td><td>추가</td></tr>\n<tr><td>When / suddenly</td><td>23번</td><td>문을 닫음</td><td>갑자기 그림이 날아다님</td><td>시간 → 신기한 일</td></tr>\n<tr><td>so ~ that 너무 ~해서</td><td>26번</td><td>그림이 너무 자세함</td><td>꿀벌이 살아 있는 듯</td><td>원인 → 결과</td></tr>\n<tr><td>When ~했을 때</td><td>30번</td><td>책을 엶</td><td>다윈의 편지 발견</td><td>시간 → 발견</td></tr>\n<tr><td>so ~ that 너무 ~해서</td><td>36번</td><td>너무 신남</td><td>빨리 말하고 싶음</td><td>원인 → 결과</td></tr>\n</table></div>\n<div class=\"tip\"><b>순서·삽입 문제 푸는 법</b> — also가 있으면 앞에 비슷한 일이 먼저(14번 also ← 10번 사진), However 앞에는 반대 상황(16번 ← 15번), not just 다음에는 also(17번 → 18번)!</div>\n</div>"},{"k":"h","html":"⑦ 핵심 문법이 들어간 표현"},{"k":"html","html":"<div class=\"anal\">\n<div class=\"tw\"><table class=\"t\">\n<tr><th>문법</th><th style=\"white-space:nowrap\">문장</th><th>표현</th><th>포인트</th></tr>\n<tr><td>수동태</td><td>7, 19, 21, 34번</td><td><b>were displayed</b> / <b>was moved by</b> / <b>was filled with</b> / <b>was shown</b></td><td>be동사는 진짜 주어의 수·시제에 맞추기 (A and B → were)</td></tr>\n<tr><td>so ~ that</td><td>26, 36번</td><td><b>so</b> detailed <b>that</b> ~ / <b>so</b> excited <b>that</b> she could not wait to ~</td><td>과거라 could not</td></tr>\n<tr><td>주격 관계대명사 that</td><td>3, 5번</td><td>rooms <b>that</b> celebrated / a room <b>that</b> looked like</td><td>명사 뒤에서 꾸밈</td></tr>\n<tr><td>look + 형용사 / look like + 명사</td><td>5, 11, 22, 26번</td><td>looked <b>brave</b> / looked <b>alive</b> / looked <b>like</b> a garage / a forest</td><td>형용사면 like ✗, 명사면 like ✓</td></tr>\n<tr><td>감정 + to부정사</td><td>4번</td><td>excited <b>to begin</b></td><td>감정의 원인</td></tr>\n<tr><td>과거진행</td><td>6번</td><td><b>were hanging</b> from</td><td>복수 주어 + were + -ing</td></tr>\n<tr><td>대명사 + 동사구</td><td>8, 28번</td><td>put <b>them</b> on / picked <b>it</b> up</td><td>대명사는 가운데</td></tr>\n<tr><td>read / say (쓰여 있다)</td><td>15, 31번</td><td>It <b>read</b>, \"...\" / It <b>said</b>, \"...\"</td><td>사물 주어</td></tr>\n<tr><td>enter + 목적어</td><td>15번</td><td>couldn't <b>enter</b> flight schools</td><td>enter into ✗</td></tr>\n<tr><td>목적의 to부정사</td><td>16번</td><td>worked hard <b>to achieve</b></td><td>~하기 위해</td></tr>\n<tr><td>one of + 복수 명사</td><td>24, 27번</td><td><b>one of</b> them / <b>one of</b> the bookshelves</td><td>복수 명사!</td></tr>\n<tr><td>Thank you for + -ing / send A B</td><td>31번</td><td>Thank you for <b>sending me your book</b></td><td>= sending your book <b>to</b> me</td></tr>\n<tr><td>접속사 that</td><td>33번</td><td>learned <b>that</b> Fabre wrote ~</td><td>생략 가능</td></tr>\n<tr><td>every + 단수</td><td>34번</td><td>in <b>every corner</b></td><td>corners ✗</td></tr>\n</table></div>\n</div>"},{"k":"qset","title":"분석 확인 문제","note":"위 분석을 읽었으면 바로 확인! 번호를 눌러 원문을 다시 봐도 돼요.","qs":[{"t":"mc","q":"이 글의 본론은 어떻게 나뉘는가?","o":["시간 순서로 4단계","두 개의 방(권기옥 / 파브르)","장점과 단점","문제와 해결책","질문과 대답"],"a":1,"e":"첫 번째 방(5~19번)과 두 번째 방(20~34번)이 같은 틀로 이어져요."},{"t":"mc","q":"글의 주제와 가장 가까운 것은?","o":["How to become a pilot","Insects are dangerous.","Museums are boring places.","Emily discovers the greatness of famous people by exploring a special museum.","Darwin wrote many books about insects."],"a":3,"e":"제목·19번·34번·36번을 종합한 주제."},{"t":"mc","q":"권기옥이 위대한 이유로 본문에 나오지 <b>않은</b> 것은?","o":["한국 최초의 여성 비행사였다.","어려움 속에서도 포기하지 않았다.","한국의 독립을 위해 싸웠다.","비행 학교를 직접 세웠다.","꿈을 이루기 위해 열심히 노력했다."],"a":3,"e":"비행 학교를 세웠다는 말은 없어요."},{"t":"mc","q":"첫 번째 방의 \"재킷·고글을 착용하자 엔진 소리\"와 같은 역할을 하는 두 번째 방의 장면은?","o":["책장에서 빛나는 책을 발견했다.","문을 닫자 그림들이 날아다녔다.","표지에서 파브르의 이름을 보았다.","다윈의 편지를 읽었다.","마지막 방에서 나왔다."],"a":1,"e":"둘 다 \"When ~\"으로 시작하는 신기한 일(판타지 장면)."},{"t":"mc","q":"Emily의 감정 변화로 알맞은 것은?","o":["bored → scared → angry","sad → happy → sad","excited → surprised → moved → excited","angry → calm → bored","scared → excited → tired"],"a":2,"e":"4번 → 9번 → 19번 → 36번."},{"t":"mc","q":"30년 넘게 곤충에 관한 책을 쓴 사람은?","o":["Emily","권기옥","Charles Darwin","Jean-Henri Fabre","박물관 관장"],"a":3,"tag":"함정","e":"33번. 다윈은 편지를 쓴 사람."}]},{"k":"h","html":"⑧ 문단별 흐름 · 문장별 한글 분석"},{"k":"analysis","paras":[{"title":"도입 (1~4) — 초대장과 탐험의 시작","flow":"Emily가 위인들을 기념하는 특별한 박물관에 초대받고, 설레며 탐험을 시작해요.<br>💡 4번의 \"들떠 있었다(excited)\"가 36번 마무리와 이어져요.","items":[{"n":1,"kr":"어느 날, Emily는 박물관으로부터 초대장을 받았습니다.","en":"One day, Emily received an invitation from a museum.","ch":[["One day,","어느 날"],["Emily received","Emily는 받았다"],["an invitation","초대장을"],["from a museum.","박물관으로부터"]],"tip":"한글 끝 \"받았다\"가 영어에선 주어 바로 뒤."},{"n":2,"kr":"이 박물관은 평범한 박물관이 아니었습니다.","en":"This museum wasn't any ordinary museum.","ch":[["This museum","이 박물관은"],["wasn't","~이 아니었다"],["any ordinary museum.","평범한 박물관"]],"tip":"not any = 전혀 ~아닌. ordinary = 평범한."},{"n":3,"kr":"그곳에는 위대한 사람들을 기념하는 방들이 있었습니다.","en":"It had rooms that celebrated great people.","ch":[["It had rooms","그곳에는 방들이 있었다"],["that celebrated great people.","위대한 사람들을 기념하는"]],"tip":"주격 관계대명사 <b>that</b>: 한글 \"기념하는 방\"(꾸밈이 앞) → 영어는 rooms <b>뒤</b>."},{"n":4,"kr":"그녀는 그녀의 탐험을 시작하게 되어 들떠 있었습니다.","en":"She was excited to begin her exploration.","ch":[["She was excited","그녀는 들떠 있었다"],["to begin her exploration.","그녀의 탐험을 시작하게 되어"]],"tip":"감정 형용사 + to부정사(감정의 원인). 사람이 느끼는 감정 → excit<b>ed</b>."}]},{"title":"첫 번째 방 (5~13) — 비행기 격납고 같은 방","flow":"격납고 같은 방에서 재킷과 고글을 <b>착용했을 때</b> 엔진 소리가 들려 깜짝 놀라요. 벽의 사진 속 용감해 보이는 여성이 바로 한국 최초의 여성 비행사 권기옥이에요.","items":[{"n":5,"kr":"그녀의 첫 방문지는 오래된 비행기 격납고처럼 보이는 방이었습니다.","en":"Her first stop was a room that looked like an old airplane garage.","ch":[["Her first stop","그녀의 첫 방문지는"],["was a room","방이었다"],["that looked like","~처럼 보이는"],["an old airplane garage.","오래된 비행기 격납고"]],"tip":"stop = 방문지(다의어). look <b>like</b> + 명사."},{"n":6,"kr":"모형 비행기들이 천장에 매달려 있었습니다.","en":"Model airplanes were hanging from the ceiling.","ch":[["Model airplanes","모형 비행기들이"],["were hanging","매달려 있었다"],["from the ceiling.","천장에"]],"tip":"과거진행 were + -ing. hang <b>from</b>: ~에 매달리다."},{"n":7,"kr":"가죽 비행사 재킷과 고글이 전시되어 있었습니다.","en":"A leather pilot jacket and goggles were displayed.","ch":[["A leather pilot jacket and goggles","가죽 비행사 재킷과 고글이"],["were displayed.","전시되어 있었다"]],"tip":"<b>수동태</b> be + p.p. A and B = 복수 → were."},{"n":8,"kr":"Emily가 그것들을 착용했을 때, 그녀는 비행기 엔진 소리를 들을 수 있었습니다.","en":"When Emily put them on, she could hear the sounds of airplane engines.","ch":[["When Emily put them on,","Emily가 그것들을 착용했을 때"],["she could hear","그녀는 들을 수 있었다"],["the sounds of airplane engines.","비행기 엔진 소리를"]],"tip":"them = 재킷과 고글. 대명사는 put과 on <b>사이</b> (put on them ✗)."},{"n":9,"kr":"그녀는 놀라서 방을 둘러보았습니다.","en":"She looked around the room in surprise.","ch":[["She looked around","그녀는 둘러보았다"],["the room","방을"],["in surprise.","놀라서"]],"tip":"한글 \"놀라서\"(앞) → 영어 in surprise(맨 뒤)."},{"n":10,"kr":"벽에는 한 여성의 사진이 있었습니다.","en":"On the wall, there was a picture of a woman.","ch":[["On the wall,","벽에는"],["there was","~이 있었다"],["a picture of a woman.","한 여성의 사진"]],"tip":"There was + 단수 명사. \"한 여성의 사진\" → a picture <b>of</b> a woman (순서 뒤집힘)."},{"n":11,"kr":"그녀는 용감하고 강해 보였습니다.","en":"She looked brave and strong.","ch":[["She","그녀는"],["looked","보였다"],["brave and strong.","용감하고 강해"]],"tip":"look + <b>형용사</b> (bravely ✗)."},{"n":12,"kr":"그녀의 이름은 권기옥이었습니다.","en":"Her name was Kwon Ki-ok.","ch":[["Her name","그녀의 이름은"],["was Kwon Ki-ok.","권기옥이었다"]],"tip":""},{"n":13,"kr":"그녀는 한국 최초의 여성 비행사였습니다.","en":"She was the first female pilot in Korea.","ch":[["She was","그녀는 ~였다"],["the first female pilot","최초의 여성 비행사"],["in Korea.","한국의"]],"tip":"\"한국 최초의\" → 영어는 in Korea가 맨 뒤."}]},{"title":"권기옥의 삶 (14~19) — 포기하지 않은 꿈","flow":"신문에는 여성은 비행 학교에 들어갈 수 없던 시절 이야기가 있어요. <b>하지만</b> 권기옥은 포기하지 않았고, 비행기 조종<b>뿐 아니라</b> 독립운동<b>까지</b> 해서 Emily를 감동시켜요.<br>💡 15번 It read = 신문에 ~라고 쓰여 있었다.","items":[{"n":14,"kr":"Emily는 책상 위에서 오래된 신문도 발견했습니다.","en":"Emily also found an old newspaper on the desk.","ch":[["Emily also found","Emily는 또한 발견했다"],["an old newspaper","오래된 신문을"],["on the desk.","책상 위에서"]],"tip":"also(~도)는 일반동사 앞. find-found-found."},{"n":15,"kr":"그것에는 이렇게 쓰여 있었습니다. \"당시에 여성들은 비행 학교에 들어갈 수 없었다.\"","en":"It read, \"At that time, women couldn't enter flight schools.\"","ch":[["It read,","그것에는 ~라고 쓰여 있었다"],["\"At that time,","당시에"],["women couldn't enter","여성들은 들어갈 수 없었다"],["flight schools.\"","비행 학교에"]],"tip":"read = <b>~라고 쓰여 있다</b>(사물 주어). enter는 전치사 없이 바로 목적어 (enter <s>into</s> ✗)."},{"n":16,"kr":"\"하지만 권기옥은 포기하지 않았고 꿈을 이루기 위해 열심히 노력했다.\"","en":"\"However, Kwon Ki-ok didn't give up and worked hard to achieve her dream.\"","ch":[["\"However,","하지만"],["Kwon Ki-ok didn't give up","권기옥은 포기하지 않았다"],["and worked hard","그리고 열심히 노력했다"],["to achieve her dream.\"","꿈을 이루기 위해"]],"tip":"연결어 However: 앞(입학 불가) ↔ 뒤(포기 안 함). to achieve = 목적(~하기 위해). hard = 열심히."},{"n":17,"kr":"권기옥은 단지 비행기만 조종한 것이 아니었습니다.","en":"Kwon Ki-ok did not just fly airplanes.","ch":[["Kwon Ki-ok did not just fly","권기옥은 단지 조종한 것이 아니었다"],["airplanes.","비행기를"]],"tip":"fly = (비행기를) <b>조종하다</b>. not just ~ = 단지 ~만 한 게 아니다 → 다음 문장에 \"또 다른 일\"이 나와요."},{"n":18,"kr":"그녀는 한국의 독립을 위해 일본에 맞서 싸우기도 했습니다.","en":"She also fought against Japan for Korea's independence.","ch":[["She also fought against Japan","그녀는 일본에 맞서 싸우기도 했다"],["for Korea's independence.","한국의 독립을 위해"]],"tip":"also = 17번 not just와 짝. fight-fought-fought / fight against."},{"n":19,"kr":"Emily는 권기옥의 위대한 삶의 이야기에 감동을 받았습니다.","en":"Emily was moved by the great life story of Kwon Ki-ok.","ch":[["Emily was moved","Emily는 감동을 받았다"],["by the great life story","위대한 삶의 이야기에"],["of Kwon Ki-ok.","권기옥의"]],"tip":"<b>수동태</b> be moved by. 한글 \"권기옥의\"(앞) → of Kwon Ki-ok(뒤)."}]},{"title":"두 번째 방 (20~30) — 작은 숲 같은 방","flow":"작은 숲 같은 방에서 문을 <b>닫았을 때 갑자기</b> 그림들이 날아다녀요. 꿀벌 그림이 <b>너무 자세해서</b> 살아 있는 것 같고, 빛나는 책에서 파브르의 이름과 다윈의 편지를 발견해요.","items":[{"n":20,"kr":"Emily는 다음 방으로 들어갔습니다.","en":"Emily stepped into the next room.","ch":[["Emily stepped into","Emily는 ~로 들어갔다"],["the next room.","다음 방"]],"tip":"step into ↔ step out of (35번)."},{"n":21,"kr":"그 방은 많은 책들과 곤충과 식물의 그림들로 가득 차 있었습니다.","en":"The room was filled with many books and drawings of insects and plants.","ch":[["The room","그 방은"],["was filled with","~로 가득 차 있었다"],["many books and drawings","많은 책들과 그림들"],["of insects and plants.","곤충과 식물의"]],"tip":"<b>수동태</b> be filled with (= be full of). 주어 The room(단수) → was."},{"n":22,"kr":"그곳은 작은 숲처럼 보였습니다.","en":"It looked like a small forest.","ch":[["It","그곳은"],["looked like","~처럼 보였다"],["a small forest.","작은 숲"]],"tip":"look like + <b>명사</b> / look + 형용사 (11번과 비교!)."},{"n":23,"kr":"그녀가 문을 닫았을 때, 책상 위의 그림들이 갑자기 방 안 여기저기를 날아다니기 시작했습니다.","en":"When she closed the door, drawings on the desk suddenly started to fly around the room.","ch":[["When she closed the door,","그녀가 문을 닫았을 때"],["drawings on the desk","책상 위의 그림들이"],["suddenly started","갑자기 시작했다"],["to fly around the room.","방 안 여기저기를 날아다니기"]],"tip":"start + to부정사 = start + -ing. 주어는 drawings(복수)."},{"n":24,"kr":"그녀는 그것들 중 하나를 잡았습니다.","en":"She caught one of them.","ch":[["She caught","그녀는 잡았다"],["one of them.","그것들 중 하나를"]],"tip":"them = drawings. catch-caught-caught. one of + 복수."},{"n":25,"kr":"그것은 꿀벌의 그림이었습니다.","en":"It was a drawing of a honeybee.","ch":[["It was","그것은 ~이었다"],["a drawing of a honeybee.","꿀벌의 그림"]],"tip":"It = 잡은 그림 하나."},{"n":26,"kr":"그것은 너무 자세해서 꿀벌이 살아 있는 것처럼 보였습니다.","en":"It was so detailed that the honeybee looked alive.","ch":[["It was so detailed","그것은 너무 자세했다"],["that the honeybee looked alive.","그래서 꿀벌이 살아 있는 것처럼 보였다"]],"tip":"<b>so + 형용사 + that</b>: 원인(자세함) → 결과(살아 보임). look + 형용사 alive."},{"n":27,"kr":"책장 중 하나에서, Emily는 빛나는 책을 발견했습니다.","en":"From one of the bookshelves, Emily found a shining book.","ch":[["From one of the bookshelves,","책장 중 하나에서"],["Emily found","Emily는 발견했다"],["a shining book.","빛나는 책을"]],"tip":"one of + 복수 명사(bookshelves). shining: 형용사."},{"n":28,"kr":"그녀는 그것을 집어 들었습니다.","en":"She picked div class=\"wen\"><span class=\"dno\" style=\"background:var(--primary);color:#fff;border-radius:6px;font-size:12px;padding:1px 7px;margin-right:4px\">1</span><span class=\"en\">One day, Emily received an invitation from a museum.</span><button class=\"spk mini\" data-say=\"One day, Emily received an invitation from a museum.\">🔊</button></div><div class=\"wk\" style=\"display:block;margin-left:34px\">어느 날, Emily는 박물관으로부터 초대장을 받았습니다.</div></div><div class=\"wrow\"><div class=\"wen\"><span class=\"dno\" style=\"background:var(--primary);color:#fff;border-radius:6px;font-size:12px;padding:1px 7px;margin-right:4px\">6</span><span class=\"en\">Model airplanes were hanging from the ceiling.</span><button class=\"spk mini\" data-say=\"Model airplanes were hanging from the ceiling.\">🔊</button></div><div class=\"wk\" style=\"display:block;margin-left:34px\">모형 비행기들이 천장에 매달려 있었습니다.</div></div><div class=\"wrow\"><div class=\"wen\"><span class=\"dno\" style=\"background:var(--primary);color:#fff;border-radius:6px;font-size:12px;padding:1px 7px;margin-right:4px\">9</span><span class=\"en\">She looked around the room in surprise.</span><button class=\"spk mini\" data-say=\"She looked around the room in surprise.\">🔊</button></div><div class=\"wk\" style=\"display:block;margin-left:34px\">그녀는 놀라서 방을 둘러보았습니다.</div></div><div class=\"wrow\"><div class=\"wen\"><span class=\"dno\" style=\"background:var(--primary);color:#fff;border-radius:6px;font-size:12px;padding:1px 7px;margin-right:4px\">10</span><span class=\"en\">On the wall, there was a picture of a woman.</span><button class=\"spk mini\" data-say=\"On the wall, there was a picture of a woman.\">🔊</button></div><div class=\"wk\" style=\"display:block;margin-left:34px\">벽에는 한 여성의 사진이 있었습니다.</div></div><div class=\"wrow\"><div class=\"wen\"><span class=\"dno\" style=\"background:var(--primary);color:#fff;border-radius:6px;font-size:12px;padding:1px 7px;margin-right:4px\">30</span><span class=\"en\">When she opened the book, she found an old letter from Charles Darwin.</span><button class=\"spk mini\" data-say=\"When she opened the book, she found an old letter from Charles Darwin.\">🔊</button></div><div class=\"wk\" style=\"display:block;margin-left:34px\">그녀는 책을 열었을 때, Charles Darwin에게서 온 오래된 편지를 발견했습니다.</div></div><div class=\"wrow\"><div class=\"wen\"><span class=\"dno\" style=\"background:var(--primary);color:#fff;border-radius:6px;font-size:12px;padding:1px 7px;margin-right:4px\">32</span><span class=\"en\">\"I truly love your work about insects.\"</span><button class=\"spk mini\" data-say=\"&quot;I truly love your work about insects.&quot;\">🔊</button></div><div class=\"wk\" style=\"display:block;margin-left:34px\">\"저는 곤충에 관한 당신의 연구를 진심으로 사랑합니다.\"</div></div><div class=\"wrow\"><div class=\"wen\"><span class=\"dno\" style=\"background:var(--primary);color:#fff;border-radius:6px;font-size:12px;padding:1px 7px;margin-right:4px\">33</span><span class=\"en\">Emily learned that Fabre wrote many books about insects for more than thirty years.</span><button class=\"spk mini\" data-say=\"Emily learned that Fabre wrote many books about insects for more than thirty years.\">🔊</button></div><div class=\"wk\" style=\"display:block;margin-left:34px\">Emily는 Fabre가 30년 넘게 곤충에 관한 많은 책들을 썼다는 것을 알게 되었습니다.</div></div></div>"}]},{"name":"🧱 어순 배열","intro":"<b>한글 순서 그대로 놓으면 틀려요.</b> 누가 → 한다(당했다) → 무엇을 → 어디서·왜. 꾸밈말(관계사·of·from)은 명사 뒤!","blocks":[{"k":"qset","title":"영어 덩어리 순서대로 놓기","qs":[{"t":"ord","q":"[1] 어느 날, Emily는 박물관으로부터 초대장을 받았습니다.","c":["One day","Emily received","an invitation","from a museum"],"e":"한글 끝 \"받았다\"가 영어에선 주어 바로 뒤."},{"t":"ord","q":"[3] 그곳에는 위대한 사람들을 기념하는 방들이 있었습니다.","c":["It had rooms","that celebrated great people"],"e":"주격 관계대명사 <b>that</b>: 한글 \"기념하는 방\"(꾸밈이 앞) → 영어는 rooms <b>뒤</b>."},{"t":"ord","q":"[4] 그녀는 그녀의 탐험을 시작하게 되어 들떠 있었습니다.","c":["She was excited","to begin her exploration"],"e":"감정 형용사 + to부정사(감정의 원인). 사람이 느끼는 감정 → excit<b>ed</b>."},{"t":"ord","q":"[5] 그녀의 첫 방문지는 오래된 비행기 격납고처럼 보이는 방이었습니다.","c":["Her first stop","was a room","that looked like","an old airplane garage"],"e":"stop = 방문지(다의어). look <b>like</b> + 명사."},{"t":"ord","q":"[6] 모형 비행기들이 천장에 매달려 있었습니다.","c":["Model airplanes","were hanging","from the ceiling"],"e":"과거진행 were + -ing. hang <b>from</b>: ~에 매달리다."},{"t":"ord","q":"[8] Emily가 그것들을 착용했을 때, 그녀는 비행기 엔진 소리를 들을 수 있었습니다.","c":["When Emily put them on","she could hear","the sounds of airplane engines"],"e":"them = 재킷과 고글. 대명사는 put과 on <b>사이</b> (put on them ✗)."},{"t":"ord","q":"[9] 그녀는 놀라서 방을 둘러보았습니다.","c":["She looked around","the room","in surprise"],"e":"한글 \"놀라서\"(앞) → 영어 in surprise(맨 뒤)."},{"t":"ord","q":"[10] 벽에는 한 여성의 사진이 있었습니다.","c":["On the wall","there was","a picture of a woman"],"e":"There was + 단수 명사. \"한 여성의 사진\" → a picture <b>of</b> a woman (순서 뒤집힘)."},{"t":"ord","q":"[13] 그녀는 한국 최초의 여성 비행사였습니다.","c":["She was","the first female pilot","in Korea"],"e":"\"한국 최초의\" → 영어는 in Korea가 맨 뒤."},{"t":"ord","q":"[15] 그것에는 이렇게 쓰여 있었습니다. \"당시에 여성들은 비행 학교에 들어갈 수 없었다.\"","c":["It read","At that time","women couldn't enter","flight schools"],"e":"read = <b>~라고 쓰여 있다</b>(사물 주어). enter는 전치사 없이 바로 목적어 (enter <s>into</s> ✗)."},{"t":"ord","q":"[16] \"하지만 권기옥은 포기하지 않았고 꿈을 이루기 위해 열심히 노력했다.\"","c":["However","Kwon Ki-ok didn't give up","and worked hard","to achieve her dream"],"e":"연결어 However: 앞(입학 불가) ↔ 뒤(포기 안 함). to achieve = 목적(~하기 위해). hard = 열심히."},{"t":"ord","q":"[18] 그녀는 한국의 독립을 위해 일본에 맞서 싸우기도 했습니다.","c":["She also fought against Japan","for Korea's independence"],"e":"also = 17번 not just와 짝. fight-fought-fought / fight against."},{"t":"ord","q":"[19] Emily는 권기옥의 위대한 삶의 이야기에 감동을 받았습니다.","c":["Emily was moved","by the great life story","of Kwon Ki-ok"],"e":"<b>수동태</b> be moved by. 한글 \"권기옥의\"(앞) → of Kwon Ki-ok(뒤)."},{"t":"ord","q":"[21] 그 방은 많은 책들과 곤충과 식물의 그림들로 가득 차 있었습니다.","c":["The room","was filled with","many books and drawings","of insects and plants"],"e":"<b>수동태</b> be filled with (= be full of). 주어 The room function el(tag, cls, html){var e=document.createElement(tag); if(cls)e.className=cls; if(html!=null)e.innerHTML=html; return e;}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function hash(s){var h=2166136261;for(var i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619);}return h>>>0;}
function rng(seed){return function(){seed=(Math.imul(seed^(seed>>>15),2246822507)+0x6D2B79F5)>>>0;return (seed%100000)/100000;};}
function shuffleIdx(n, seedStr){
  var idx=[];for(var i=0;i<n;i++)idx.push(i);
  if(n<2)return idx;
  var r=rng(hash(seedStr));
  for(var k=0;k<6;k++){
    for(var j=n-1;j>0;j--){var x=Math.floor(r()*(j+1));var t=idx[j];idx[j]=idx[x];idx[x]=t;}
    var same=idx.every(function(v,i){return v===i;});
    if(!same)return idx;
  }

}

}
function variants(str){ // "(that) " optional words

}

function Q(def, num, tabIdx, setObj){
  var self=this;

  var card=el('div','q'); this.card=card;

  top.appendChild(el('span','num',String(num)));

  var tcls={mc:'b-sky',multi:'b-peach',in:'b-mint',ord:'b-lav',ex:'b-amb'}[def.t];
  var qt=el('div','qt',(def.tag?'<span class="badge b-amb">'+def.tag+'</span> ':'')+'<span class="badge '+tcls+'">'+tt+'</span> '+def.q);
  top.appendChild(qt); card.appendChild(top);
  // 소리: 정답 문장 자동 생성(빈칸·괄호 고르기) 또는 영어 문장 문제엔 바로 듣기
  var HAN=/[가-힣ⓐ-ⓩ①-⑩]/;
  this.say=def.say||null;
  if(!this.say&&def.t==='mc'&&def.o&&!HAN.test(def.o[def.a])&&def.o[def.a]!=='×(없음)'){
    var segs=def.q.split('<br>');var last=segs[segs.length-1].replace(/<[^>]+>/g,'');
    var ans=def.o[def.a].replace(/<[^>]+>/g,'');
    if(/______/.test(last)&&(def.q.match(/______/g)||[]).length===1){var s1=last.replace(/^\s*(?:[A-Z]:|•)\s*/,'').replace('______',ans).replace(/\([^)]*[가-힣][^)]*\)/g,'').trim();if(!HAN.test(s1))this.say=s1;}
    else if(/\([^()]*\/[^()]*\)/.test(last)){var s2=last.replace(/\([^()]*\/[^()]*\)/,ans).trim();if(!HAN.test(s2))this.say=s2;}
  }
  var plain=def.q.replace(/<[^>]+>/g,'');
  if(!HAN.test(plain)&&!/______|\[|\//.test(plain)&&def.t!=='ord'){
    var qs=spkBtn(plain);qs.className='spk mini';qt.appendChild(qs);
  }
  if(def.p){var p=el('div','pass',def.p);card.appendChild(p);}
  var body=el('div','qbody'); card.appendChild(body);
  this.body=body;
  this['build_'+def.t]();
  var foot=el('div','qfoot');
  this.gBtn=el('button','btn fill sm','채점');this.gBtn.type='button';
  this.rBtn=el('button','btn sm','다시 풀기');this.rBtn.type='button';this.rBtn.style.display='none';
  this.aBtn=el('button','btn ghost sm','정답 보기');this.aBtn.type='button';this.aBtn.style.display='none';
  this.gBtn.addEventListener('click',function(){self.grade(true);});
  this.rBtn.addEventListener('click',function(){self.reset();});
  this.aBtn.addEventListener('click',function(){self.showAns();});
  foot.appendChild(this.gBtn);foot.appendChild(this.rBtn);foot.appendChild(this.aBtn);
  card.appendChild(foot);
  this.fb=el('div','fb');card.appendChild(this.fb);
  REG.push(this);
}

function fullEx(d){var A=Array.isArray(d.a)?d.a:[d.a];var i=0;return d.s.replace(/\[\]/g,function(){return firstShow(A[i++]);}).replace(/<[^>]+>/g,'');}
function krNorm(s){return String(s).toLowerCase().replace(/[\s.,!?~'"“”‘’·…()\-]/g,'');}
function dice(a,b){if(a.length<2||b.length<2)return a===b?1:0;var m={},n=0,i;for(i=0;i<a.length-1;i++){var g=a.substr(i,2);m[g]=(m[g]||0)+1;}for(i=0;i<b.length-1;i++){var h=b.substr(i,2);if(m[h]>0){m[h]--;n++;}}return 2*n/(a.length+b.length-2);}
function krOK(ans,d){
  var x=krNorm(ans);if(!x)return false;
  var keys=d.keys||[];var hit=0;
  keys.forEach(function(k){if(String(k).split('|').some(function(v){return x.indexOf(krNorm(v))>=0;}))hit++;});
  var need=Math.max(1,Math.ceil(keys.length*0.6));
  if(keys.length&&hit>=need)return true;
  return dice(x,krNorm(d.kr||''))>=0.5;
}
Q.prototype.build_ord=function(){
  var self=this,d=this.def; this.placed=[];
  var w=el('div','ordwrap');
  this.slots=el('div','slots'+(d.blk?' block':''));
  this.hint=el('span','hint','↓ 아래 조각을 순서대로 누르세요 (다시 누르면 빠짐)');
  this.slots.appendChild(this.hint);
  this.pool=el('div','pool'+(d.blk?' block':''));
  var order=shuffleIdx(d.c.length,d.q+'|'+d.c.join('/'));
  this.poolBtns=[];
  order.forEach(function(ci){
    var b=el('button','chip',esc(d.c[ci]));b.type='button';b.dataset.ci=ci;
    b.addEventListener('click',function(){

  w.appendChild(this.slots);w.appendChild(this.pool);this.body.appendChild(w);
};
Q.prototype.place=function(ci,src){
  var self=this,d=this.def;
  if(this.hint.parentNode)this.hint.remove();
  var b=el('button','chip',esc(d.c[ci]));b.type='button';
  var item={ci:ci,el:b,src:src};
  b.addEventListener('click',function(){

Q.prototype.answered=function(){
  var d=this.def;
  if(d.t==='mc')return this.sel!=null;
  if(d.t==='multi')return Object.keys(this.sels).length>0;
  if(d.t==='in')return this.inputs.every(function(i){return i.value.trim()!=='';});
  if(d.t==='ord')return this.placed.length===d.c.length;
  if(d.t==='ex')return this.inputs.every(function(i){return i.value.trim()!=='';})&&this.krInput.value.trim()!=='';
};
Q.prototype.check=function(){
  var d=this.def,self=this;
  if(d.t==='mc')return this.sel===d.a;
  if(d.t==='multi'){var k=Object.keys(this.sels).map(Number).sort();var a=d.a.slice().sort();return k.length===a.length&&k.every(function(v,i){return v===a[i];});}
  if(d.t==='in'){
    var A=Array.isArray(d.a)?d.a:[d.a];
    var ok=true;
    this.inputs.forEach(function(inp,i){
      var good=alts(A[i]).indexOf(norm(inp.value))>=0;
      inp.classList.toggle('right',good);inp.classList.toggle('wrong',!good);
      if(!good)ok=false;
    });
    return ok;
  }
  if(d.t==='ex'){
    var A2=Array.isArray(d.a)?d.a:[d.a];var okb=true;
    this.inputs.forEach(function(inp,i){var g=alts(A2[i]).indexOf(norm(inp.value))>=0;inp.classList.toggle('right',g);inp.classList.toggle('wrong',!g);if(!g)okb=false;});
    var okk=krOK(this.krInput.value,d);this.krInput.classList.toggle('right',okk);this.krInput.classList.toggle('wrong',!okk);
    this.partMsg=okb&&!okk?'빈칸은 맞았어요. <b>해석</b>을 다시 써 보세요.':(!okb&&okk?'해석은 좋아요. <b>빈칸</b>을 다시 확인하세요.':'');
    return okb&&okk;
  }
  if(d.t==='ord'){
    var got=this.placed.map(function(p){return norm(d.c[p.ci]);}).join(' ');
    var want=d.c.map(norm).join(' ');
    return got===want;
  }
};
Q.prototype.lock=function(v){
  this.locked=v;
  (this.optEls||[]).forEach(function(b){b.disabled=v;});
  (this.inputs||[]).forEach(function(i){i.readOnly=v;});
  if(this.krInput)this.krInput.readOnly=v;
};
Q.prototype.grade=function(manual){
  if(this.state==='ok')return true;
  if(!this.answered()){
    if(manual){this.fb.className='fb show no';this.fb.innerHTML='먼저 답을 고르거나 써 주세요.';}
    return null;
  }
  var ok=this.check();
  var d=this.def;
  this.lock(true);
  this.gBtn.style.display='none';
  if(ok){
    this.state='ok';this.card.className='q ok';
    if(d.t==='mc'){this.optEls[d.a].classList.add('right');}
    if(d.t==='multi'){var s=this;d.a.forEach(function(i){s.optEls[i].classList.add('right');});}
    this.fb.className='fb show ok';this.fb.innerHTML='<b>정답!</b> '+(d.e||'')+this.sayHtml();
    this.rBtn.style.display='none';this.aBtn.style.display='none';
  }else{
    this.state='no';this.card.className='q no';
    if(d.t==='mc'){this.optEls[this.sel].classList.add('wrong');}
    if(d.t==='multi'){var s2=this;Object.keys(this.sels).forEach(function(i){if(d.a.indexOf(+i)<0)s2.optEls[i].classList.add('wrong');});}
    this.fb.className='fb show no';this.fb.innerHTML='<b>틀렸어요.</b> '+(this.partMsg||'다시 풀어 보거나 정답을 확인하세요.');
    this.rBtn.style.display='';this.aBtn.style.display='';
  }
  updateScores();
  return ok;
};
Q.prototype.sayHtml=function(){
  var s=this.say;
  if(!s&&this.def.t==='ex')s=fullEx(this.def);
  if(!s&&this.def.t==='in'&&!this.def.s){var a=Array.isArray(this.def.a)?this.def.a[0]:this.def.a;a=firstShow(a).replace(/[()]/g,'');if(a.split(' ').length>=3)s=a;}
  if(!s&&this.def.t==='ord'&&!/[가-힣]/.test(this.def.c.join('')))s=this.def.c.join(' ');
  if(!s)return '';
  return '<div style="margin-top:6px" class="row"><button class="spk mini" data-say="'+esc(s).replace(/"/g,'&quot;')+'">🔊</button><span class="en">'+esc(s)+'</span></div>';

Q.prototype.ansText=function(){
  var d=this.def;
  if(d.t==='mc')return NUMS[d.a]+' '+d.o[d.a];
  if(d.t==='multi')return d.a.map(function(i){return NUMS[i]+' '+d.o[i];}).join(' / ');

  if(d.t==='ord')return d.c.join(d.blk?'<br>→ ':' ');
  if(d.t==='ex')return (Array.isArray(d.a)?d.a:[d.a]).map(firstShow).join(' / ')+'<br><b>해석 예시:</b> '+esc(d.kr||'');
};

Q.prototype.reset=function(){

  this.state='idle';this.card.className='q';this.lock(false);

/* 단계별 전환 훈련 (drill): 한 단계씩 맞혀야 다음 단계, 슬롯에 문장이 조립됨 */
var DRILLS=[];
function bDrill(blk){
  var w=el('div','');
  if(blk.note)w.appendChild(el('div','tip',blk.note));
  blk.items.forEach(function(it,ii){
    var c=el('div','drill box');
    c.appendChild(el('div','dact','<span class="dno">'+(ii+1)+'</span><span class="badge b-sky">능동</span> <span class="en">'+it.act+'</span>'+(it.kr?'<div class="dkr">'+esc(it.kr)+'</div>':'')));
    var labels=blk.labels||['주어','be동사','과거분사','by + 행위자'];
    var sw=el('div','dslots');
    var slotEls=labels.map(function(l){var s=el('span','dslot','<small>'+l+'</small><b>?</b>');sw.appendChild(s);return s;});
    c.appendChild(el('div','dlabel','<span class="badge b-mint">수동</span> 문장 만들기'));
    c.appendChild(sw);
    var tw=el('div','dtags');c.appendChild(tw);
    var box=el('div','dstep');c.appendChild(box);
    var st={idx:0,done:false,miss:0};
    function reset(){st.idx=0;st.done=false;st.miss=0;slotEls.forEach(function(s){s.classList.remove('on');s.querySelector('b').textContent='?';});tw.innerHTML='';render();}
    function render(){
      box.innerHTML='';
      if(st.idx>=it.steps.length){finish();return;}
      var sp=it.steps[st.idx];
      box.appendChild(el('div','dq','<span class="dn">STEP '+(st.idx+1)+' / '+it.steps.length+'</span> '+sp.q));
      var ob=el('div','opts inline');var fb=el('div','fb');
      sp.o.forEach(function(o,oi){
        var b=el('button','opt',o);b.type='button';
        b.addEventListener('click',function(){
          if(st.done)return;
          if(oi===sp.a){
            b.classList.add('right');ob.querySelectorAll('.opt').forEach(function(x){x.disabled=true;});
            if(sp.slot!=null){var s=slotEls[sp.slot];s.querySelector('b').textContent=sp.fill||o.replace(/<[^>]+>/g,'');s.classList.add('on');}
            if(sp.tag)tw.appendChild(el('span','badge b-amb',sp.tag));
            fb.className='fb show ok';fb.innerHTML='<b>맞아요!</b> '+(sp.why||'');
            st.idx++;setTimeout(render,sp.why?900:450);
          }else{
            st.miss++;b.classList.add('wrong');b.disabled=true;
            fb.className='fb show no';fb.innerHTML='<b>다시!</b> '+(sp.h||'');
          }
        });
        ob.appendChild(b);
      });
      box.appendChild(ob);box.appendChild(fb);
    }
    function finish(){
      st.done=true;
      var r=el('div','dfinal');
      var line=el('div','row');line.appendChild(el('span','en','<b>'+esc(it.pass)+'</b>'));line.appendChild(spkBtn(it.pass));
      r.appendChild(el('div','',st.miss?'<b>완성!</b> (틀린 단계 '+st.miss+'번 — 한 번 더 해 보면 좋아요)':'<b>완성! 한 번에 성공 👏</b>'));
      r.appendChild(line);
      if(it.note)r.appendChild(el('div','tp','💡 '+it.note));
      var rb=el('button','btn sm ghost','다시 하기');rb.type='button';rb.style.marginTop='8px';rb.addEventListener('click',reset);
      r.appendChild(rb);box.appendChild(r);
    }
    render();
    DRILLS.push({it:it,st:st,el:c,reset:reset});
    w.appendChild(c);
  });
  return w;
}
document.addEventListener('click',function(e){
  var s=e.target.closest&&e.target.closest('[data-say]');
  if(s){speak(s.getAttribute('data-say'),s);return;}

});

/* ---------- page ---------- */
function build(){
  document.title=D.title;
  var hd=el('header','top');
  hd.appendChild(el('div','brand',D.brand));
  hd.appendChild(el('h1','',D.title));
  hd.appendChild(el('div','sub',D.sub));
  var nav=el('nav','tabs');hd.appendChild(nav);
  document.body.appendChild(hd);
  var main=el('main');document.body.appendChild(main);
  D.tabs.forEach(function(tb,ti){
    TABQ.push([]);
    var t=el('button','tab'+(ti===0?' on':''),esc(tb.name)+'<span class="pg"></span>');t.type='button';t.dataset.i=ti;
    t.addEventListener('click',function(){go(ti);});
    nav.appendChild(t);
    var pn=el('section','panel'+(ti===0?' on':''));pn.dataset.i=ti;
    if(tb.intro)pn.appendChild(el('div','intro',tb.intro));
    tb.blocks.forEach(function(b){
      var node;
      if(b.k==='html')node=el('div','',b.html);
      else if(b.k==='h')node=el('h2','sec',b.html);
      else if(b.k==='words')node=bWords(b);
      else if(b.k==='qset')node=new QSet(b,ti).el;
      else if(b.k==='analysis')node=bAnalysis(b);
      else if(b.k==='script')node=bScript(b);
      else if(b.k==='tapfill')node=bTapfill(b);
      else if(b.k==='wordlist')node=bWordlist(b);
      else if(b.k==='flip')node=bFlip(b);
      else if(b.k==='drill')node=bDrill(b);
      if(node)pn.appendChild(node);
    });
    if(ti<D.tabs.length-1){
      var nx=el('div','row');nx.style.justifyContent='center';nx.style.marginTop='20px';
      var nb=el('button','btn','다음: '+esc(D.tabs[ti+1].name)+' →');nb.type='button';
      nb.addEventListener('click',function(){go(ti+1);});nx.appendChild(nb);pn.appendChild(nx);
    }
    main.appendChild(pn);
  });
  main.appendChild(el('div','foot',D.brand+' · '+D.title));
  updateScores();
}
function go(i){
  document.querySelectorAll('.tab').forEach(function(t){t.classList.toggle('on',+t.dataset.i===i);});
  document.querySelectorAll('.panel').forEach(function(p){p.classList.toggle('on',+p.dataset.i===i);});
  var t=document.querySelector('.tab[data-i="'+i+'"]');if(t&&t.scrollIntoView)try{t.scrollIntoView({inline:'center',block:'nearest'});}catch(e){}
  window.scrollTo(0,0);pageSound();
}
/* ---------- 문장 번호 → 실제 문장 보기 ---------- */
var sheet=null;
function openRef(a,b){
  var S=D.sents;if(!S)return;
  if(!sheet){
    sheet=el('div','refsheet');
    sheet.innerHTML='<div class="rhead"><b></b><button type="button" class="rclose" aria-label="닫기">✕</button></div><div class="rbody"></div>';
    sheet.querySelector('.rclose').addEventListener('click',function(){sheet.classList.remove('show');});
    document.body.appendChild(sheet);
  }
  var body=sheet.querySelector('.rbody');body.innerHTML='';
  for(var n=a;n<=b;n++){
    var s=S[n];if(!s)continue;
    var r=el('div','rrow');
    var top=el('div','rtop','<span class="rn">'+n+'</span><span class="ren en">'+esc(s[0])+'</span>');
    top.appendChild(spkBtn(s[0]));
    r.appendChild(top);r.appendChild(el('div','rkr',esc(s[1])));
    body.appendChild(r);
  }
  sheet.querySelector('.rhead b').textContent='본문 '+(a===b?a+'번':a+'~'+b+'번');
  sheet.classList.add('show');body.scrollTop=0;
}
function linkRefs(root){
  var S=D.sents;if(!S)return;
  var max=Object.keys(S).length;
  var re=/(^|[^\d])(\((\d{1,2}(?:\s*~\s*\d{1,2})?)\)|(\d{1,2}(?:\s*~\s*\d{1,2})?(?:\s*[,·]\s*\d{1,2}(?:\s*~\s*\d{1,2})?)*)\s*번)/g;
  function mk(tok){
    var m=tok.match(/(\d{1,2})(?:\s*~\s*(\d{1,2}))?/);var a=+m[1],b=m[2]?+m[2]:a;
    if(a<1||b>max||b<a)return document.createTextNode(tok);
    var s=el('span','ref',esc(tok));s.dataset.a=a;s.dataset.b=b;return s;
  }
  root.querySelectorAll('.anal, .parahead').forEach(function(box){
    var walker=document.createTreeWalker(box,NodeFilter.SHOW_TEXT,null);
    var nodes=[];while(walker.nextNode())nodes.push(walker.currentNode);
    nodes.forEach(function(tn){
      if(tn.parentNode.closest('.ref'))return;
      var t=tn.nodeValue;re.lastIndex=0;if(!re.test(t))return;re.lastIndex=0;
      var frag=document.createDocumentFragment(),last=0,m;
      while((m=re.exec(t))){
        var start=m.index+m[1].length;
        frag.appendChild(document.createTextNode(t.slice(last,start)));
        if(m[3]!==undefined){ // (N) or (N~M)
          frag.appendChild(document.createTextNode('('));frag.appendChild(mk(m[3]));frag.appendChild(document.createTextNode(')'));
        }else{
          var parts=m[4].split(/(\s*[,·]\s*)/);var lastEl=null;
          parts.forEach(function(p){if(/^\s*[,·]\s*$/.test(p))frag.appendChild(document.createTextNode(p));else{lastEl=mk(p);frag.appendChild(lastEl);}});
          var suf=m[2].slice(m[4].length);
          if(lastEl&&lastEl.nodeType===1)lastEl.textContent+=suf;else frag.appendChild(document.createTextNode(suf));
        }
        last=start+m[2].length;
      }
      frag.appendChild(document.createTextNode(t.slice(last)));
      tn.parentNode.replaceChild(frag,tn);
    });
  });
  root.addEventListener('click',function(e){var r=e.target.closest&&e.target.closest('.ref');if(r){e.stopPropagation();openRef(+r.dataset.a,+r.dataset.b);}});
}
window.__L7={REG:REG,SETS:SETS,DRILLS:DRILLS,go:go,norm:norm,alts:alts,openRef:openRef};
build();
linkRefs(document);
})();
