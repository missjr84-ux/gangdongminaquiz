var SS=('speechSynthesis' in window)?window.speechSynthesis:null;
var ttsReady=false, ttsVoices=[];
function loadVoices(){if(!SS)return;ttsVoices=SS.getVoices()||[];}
if(SS){loadVoices();SS.onvoiceschanged=loadVoices;}
function unlockTTS(){
  if(!SS||ttsReady)return;
  try{var u=new SpeechSynthesisUtterance(' ');u.volume=0;SS.speak(u);SS.cancel();}catch(e){}
  loadVoices();ttsReady=true;
  var h=document.getElementById('sndHint');if(h)h.style.display='none';
}
document.addEventListener('touchstart',unlockTTS,{once:true,passive:true});
document.addEventListener('mousedown',unlockTTS,{once:true});
document.addEventListener('click',unlockTTS,{once:true});
function pickVoice(){
  if(!ttsVoices.length)loadVoices();
  return ttsVoices.filter(function(x){return x.lang==='en-US';})[0]
    ||ttsVoices.filter(function(x){return x.lang&&x.lang.toLowerCase().indexOf('en')===0;})[0]
    ||ttsVoices[0]||null;
}
function speak(t,btn){
  if(!SS){alert('이 브라우저는 음성을 지원하지 않습니다. Chrome으로 열어 주세요.');return;}
  unlockTTS();
  var msg=String(t==null?'':t).replace(/[\/~_]/g,' ').replace(/\s+/g,' ').trim();
  if(!msg)return;
  SS.cancel();
  var bs=document.querySelectorAll('.speak.playing');
  for(var i=0;i<bs.length;i++)bs[i].classList.remove('playing');
  function fire(){
    var u=new SpeechSynthesisUtterance(msg);
    u.lang='en-US';u.rate=0.85;u.pitch=1;u.volume=1;
    var v=pickVoice();if(v)u.voice=v;
    if(btn){btn.classList.add('playing');u.onend=u.onerror=function(){btn.classList.remove('playing');};}
    try{SS.resume();}catch(e){}
    SS.speak(u);
  }
  if(!ttsVoices.length){loadVoices();if(!ttsVoices.length){setTimeout(fire,180);return;}}
  setTimeout(fire,0);
}

/* ===== HELPERS ===== */
function esc(t){return String(t==null?'':t).replace(/[&<>"']/g,function(m){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m];});}
function sp(t,mini){return '<button type="button" class="speak'+(mini?' mini':'')+'" data-say="'+esc(t)+'" onclick="event.stopPropagation();speak(this.getAttribute(\'data-say\'),this)">🔊 듣기</button>';}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
function colors(i){return 'c'+((i%8)+1);}
function buildOpts(correct,pool){
  var set=[correct],sh=shuffle(pool),k;
  for(k=0;k<sh.length&&set.length<4;k++){if(sh[k]!=null&&set.indexOf(sh[k])<0)set.push(sh[k]);}
  if(set.length<4){var fill=shuffle(ITEMS.map(function(x){return x.term;}).concat(ITEMS.map(function(x){return x.ko;})));
    for(k=0;k<fill.length&&set.length<4;k++){if(set.indexOf(fill[k])<0)set.push(fill[k]);}}
  var opts=shuffle(set);return {opts:opts,ans:opts.indexOf(correct)};
}

const STEPS=[['카드','①'],['다의어','②'],['행위자','③'],['영영풀이','④'],['종합시험','⑤']];
function buildSteps(){
  document.getElementById('steps').innerHTML=STEPS.map(function(s,i){
    return '<button class="step'+(i===0?' on':'')+'" id="st'+i+'" onclick="go('+i+')"><span class="sn">'+s[1]+'단계</span>'+s[0]+'</button>';}).join('');
}
function go(v){view=v;if(SS)SS.cancel();
  for(var i=0;i<STEPS.length;i++)document.getElementById('st'+i).classList.toggle('on',i===v);
  render();window.scrollTo({top:0,behavior:'smooth'});}
function render(){
  document.getElementById('ctrl').innerHTML=(view===0)?
    '<button class="b b4" onclick="cardHidden=false;render()">✅ 답 전체 보기</button>'+
    '<button class="b b2" onclick="cardHidden=true;render()">🙈 답 숨기기</button>':'';
  document.getElementById('app').innerHTML=[V0,V1,V2,V3,V4][view]();
}

/* ===== ② 다의어 (catch / once) ===== */
function V1(){
  if(!polyState.qs){
    var qs=[];
    POLY.forEach(function(p){
      p.senses.forEach(function(s){
        var others=p.senses.filter(function(x){return x.ko!==s.ko;}).map(function(x){return x.ko;});
        var o=buildOpts(s.ko,others.concat(shuffle(ITEMS).slice(0,4).map(function(x){return x.ko.split(';')[0].split(',')[0];})));
        qs.push({term:p.term,ex:s.ex,exko:s.exko,opts:o.opts,ans:o.ans,picked:-1,done:false});
      });
    });
    polyState.qs=qs;
  }
  var h='<div class="intro">💡 <b>② 다의어 — 같은 단어, 다른 뜻</b><br><span class="kw">catch</span>는 4가지, <span class="kw">once</span>는 2가지 뜻! 문장 속에서 어떤 뜻으로 쓰였는지 골라야 합니다. 단어 암기가 아닌 <b>문맥 판단</b> 훈련입니다.</div>';
  /* concept cards first */
  POLY.forEach(function(p){
    h+='<div class="qcard"><div class="qsent">'+esc(p.term)+' '+sp(p.term)+' — 뜻 '+p.senses.length+'가지</div>';
    p.senses.forEach(function(s,k){
      h+='<div class="meta" style="margin-top:8px"><b>'+(k+1)+'. '+esc(s.ko)+'</b><br>'+sp(s.ex,true)+' <span style="font-style:italic">'+esc(s.ex)+'</span><br><span style="color:#888">'+esc(s.exko)+'</span></div>';
    });
    h+='</div>';
  });
  h+='<div class="intro" style="background:#fdf2f8;border-color:#f9a8d4">⛳ <b>문맥 판단 퀴즈</b> — 각 문장에서 단어가 어떤 뜻으로 쓰였나요?</div>';
  polyState.qs.forEach(function(q,i){
    h+='<div class="qcard"><div class="qnum">문제 '+(i+1)+' / '+polyState.qs.length+'</div>'+
      '<div class="qsent">'+sp(q.ex,true)+'<span style="font-style:italic">'+esc(q.ex)+'</span></div>'+
      '<div class="qhint">밑줄 친 <b>'+esc(q.term)+'</b>의 뜻은?</div>';
    q.opts.forEach(function(o,j){
      var cls='';
      if(q.done){if(j===q.ans)cls=' correct';else if(j===q.picked)cls=' wrong';}
      h+='<button class="opt'+cls+'" onclick="pickPoly('+i+','+j+')"><span>'+String.fromCharCode(9312+j)+' '+esc(o)+'</span></button>';
    });

  });
  return h;
}
function pickPoly(i,j){var q=polyState.qs[i];if(q.done)return;q.picked=j;q.done=true;render();}

/* ===== ③ 동사 → 행위자/도구 (-er/-or) ===== */
function V2(){
  if(!derState.qs){
    var qs=[];
    DERIV.forEach(function(d){
      /* Q-A: base verb -> derived noun */
      var pool=DERIV.filter(function(x){return x.der!==d.der;}).map(function(x){return x.der;});
      var o=buildOpts(d.der,pool);
      qs.push({type:'어형',prompt:'<b>'+esc(d.base)+'</b>('+esc(d.baseko)+')에 -er(-or)을 붙인 단어는?',say:d.base,opts:o.opts,ans:o.ans,why:d.der+' = '+d.derko+' ('+d.kind+')',picked:-1,done:false});
    });
    /* Q-B: classify 행위자 vs 도구 */
    shuffle(DERIV).slice(0,6).forEach(function(d){
      qs.push({type:'분류',prompt:'<b>'+esc(d.der)+'</b>('+esc(d.derko)+')의 -er은 무엇을 나타내는가?',say:d.der,opts:['행위자 (사람)','도구 (기계·물건)'],ans:d.kind==='행위자'?0:1,why:d.der+' = '+d.derko+' → '+d.kind,picked:-1,done:false});
    });
    derState.qs=qs;
  }
  var h='<div class="intro">💡 <b>③ 동사 + -er(-or) = 행위자 또는 도구</b><br>'+
    '<span class="kw">행위자(사람)</span>: invent→inventor(발명가), research→researcher(연구원)...<br>'+
    '<span class="kw">도구(기계)</span>: open→opener(따개), toast→toaster(토스터)...<br>같은 -er이라도 <b>사람</b>인지 <b>도구</b>인지 구별해야 합니다!</div>';
  derState.qs.forEach(function(q,i){
    h+='<div class="qcard"><div class="qnum">문제 '+(i+1)+' / '+derState.qs.length+' · '+esc(q.type)+'</div>'+
      '<div class="qsent">'+q.prompt+' '+sp(q.say,true)+'</div>';
    q.opts.forEach(function(o,j){
      var cls='';
      if(q.done){if(j===q.ans)cls=' correct';else if(j===q.picked)cls=' wrong';}
      h+='<button class="opt'+cls+'" onclick="pickDer('+i+','+j+')"><span>'+String.fromCharCode(9312+j)+' '+esc(o)+'</span>'+(/^[a-z]/i.test(o)?'<span class="ospk">'+sp(o,true)+'</span>':'')+'</button>';
    });
    h+='<div class="ansbox'+(q.done?' show':'')+'">'+esc(q.why)+' '+sp(q.why.split('=')[0].trim())+'</div></div>';
  });

function pickDer(i,j){var q=derState.qs[i];if(q.done)return;q.picked=j;q.done=true;render();}

/* ===== ⑤ 종합시험 — 단어+유의/반의+예문+다의어+행위자 전부 포함 ===== */
var EXAM_N=30, PASS=0.8;
function makeExam(){
  var qs=[];
  /* A. 영어→뜻 (6) */
  shuffle(ITEMS).slice(0,6).forEach(function(it){
    var o=buildOpts(it.ko,ITEMS.filter(function(x){return x.ko!==it.ko;}).map(function(x){return x.ko;}));
    qs.push({kind:'영어→뜻',prompt:'<b>'+esc(it.term)+'</b> 의 뜻은?',say:it.term,opts:o.opts,ans:o.ans,why:it.term+' = '+it.ko,ospk:false});
  });
  /* B. 뜻→영어 (4) */
  shuffle(ITEMS).slice(0,4).forEach(function(it){
    var o=buildOpts(it.term,ITEMS.filter(function(x){return x.term!==it.term;}).map(function(x){return x.term;}));
    qs.push({kind:'뜻→영어',prompt:'<b>'+esc(it.ko)+'</b> 에 해당하는 영어는?',say:null,opts:o.opts,ans:o.ans,why:it.ko+' = '+it.term,ospk:true});
  });
  /* C. 영영풀이 (4) */
  shuffle(ITEMS.filter(function(x){return x.def;})).slice(0,4).forEach(function(it){
    var o=buildOpts(it.term,ITEMS.filter(function(x){return x.term!==it.term;}).map(function(x){return x.term;}));
    qs.push({kind:'영영풀이',prompt:esc(it.def),say:it.def,opts:o.opts,ans:o.ans,why:it.term+' = '+it.ko,ospk:true});
  });
  /* D. 유의어 (3) */
  shuffle(ITEMS.filter(function(x){return x.syn;})).slice(0,3).forEach(function(it){
    var s=it.syn.split(',')[0].trim();
    var o=buildOpts(s,ITEMS.filter(function(x){return x.term!==it.term;}).map(function(x){return x.term;}).filter(function(t){return t!==s;}));
    qs.push({kind:'유의어',prompt:'<b>'+esc(it.term)+'</b> 의 유의어는?',say:it.term,opts:o.opts,ans:o.ans,why:it.term+' ≒ '+s,ospk:true});
  });
  /* E. 반의어 (3) */
  shuffle(ITEMS.filter(function(x){return x.ant;})).slice(0,3).forEach(function(it){
    var a=it.ant.split(',')[0].trim();
    var pool=ITEMS.filter(function(x){return x.term!==it.term&&x.syn;}).map(function(x){return x.syn.split(',')[0].trim();}).filter(function(t){return t!==a;});
    var o=buildOpts(a,pool);
    qs.push({kind:'반의어',prompt:'<b>'+esc(it.term)+'</b> 의 반의어는?',say:it.term,opts:o.opts,ans:o.ans,why:it.term+' ↔ '+a,ospk:true});
  });
  /* F. 본문 예문 빈칸 (4) — 예문에서 단어 가리고 고르기 */
  shuffle(ITEMS.filter(function(x){return x.ex&&x.ex.toLowerCase().indexOf(x.term.split(' ')[0].toLowerCase())>=0&&/^[a-z]+$/i.test(x.term);})).slice(0,4).forEach(function(it){
    var re=new RegExp(it.term.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'i');
    var blanked=it.ex.replace(re,'______');
    var o=buildOpts(it.term,ITEMS.filter(function(x){return x.term!==it.term&&/^[a-z]+$/i.test(x.term);}).map(function(x){return x.term;}));
    qs.push({kind:'본문 예문',prompt:esc(blanked)+'<div class="qhint">빈칸에 알맞은 단어는? (본문 문장)</div>',say:it.ex,opts:o.opts,ans:o.ans,why:'정답 문장: '+it.ex,ospk:true});
  });
  /* G. 다의어 (3) */
  var polyAll=[];
  POLY.forEach(function(p){p.senses.forEach(function(s){polyAll.push({term:p.term,s:s,others:p.senses.filter(function(x){return x.ko!==s.ko;}).map(function(x){return x.ko;})});});});
  shuffle(polyAll).slice(0,3).forEach(function(pa){
    var o=buildOpts(pa.s.ko,pa.others.concat(shuffle(ITEMS).slice(0,3).map(function(x){return x.ko.split(';')[0].split(',')[0];})));
    qs.push({kind:'다의어',prompt:'<span style="font-style:italic">'+esc(pa.s.ex)+'</span><div class="qhint">이 문장에서 <b>'+esc(pa.term)+'</b>의 뜻은?</div>',say:pa.s.ex,opts:o.opts,ans:o.ans,why:pa.s.exko,ospk:false});
  });
  /* H. 행위자/도구 (3) */
  shuffle(DERIV).slice(0,3).forEach(function(d){
    var o=buildOpts(d.der,DERIV.filter(function(x){return x.der!==d.der;}).map(function(x){return x.der;}));
    qs.push({kind:'어형변화',prompt:'<b>'+esc(d.base)+'</b>('+esc(d.baseko)+')의 명사형(-er/-or)은?',say:d.base,opts:o.opts,ans:o.ans,why:d.der+' = '+d.derko+' ('+d.kind+')',ospk:true});
  });
  return shuffle(qs).slice(0,EXAM_N);
}

      '<div class="qsent">'+q.prompt+' '+(q.say?sp(q.say,true):'')+'</div>';
    q.opts.forEach(function(o,j){
      var cls='';
      if(examGraded){if(j===q.ans)cls=' correct';else if(j===examPick[qi])cls=' wrong';}

    });
    if(examGraded)h+='<div class="ansbox show">'+esc(q.why)+'</div>';
    h+='</div>';

  if(!examGraded){

    h+='<div class="result"><div class="score-big">'+correct+' / '+total+'</div>'+
      '<div class="verdict '+(passed?'pass':'fail')+'">'+(passed?'🎉 합격!':'📚 불합격')+' · '+pct+'%</div>'+
      '<div class="small">'+(passed?'합격선 '+(PASS*100)+'%를 넘었습니다!':'합격선 '+(PASS*100)+'% ('+Math.ceil(total*PASS)+'개)에 미달입니다.')+'</div>'+
      '<div class="btns">'+
        (wrong.length?'<button class="b b4" onclick="retryWrong()">🔁 틀린 '+wrong.length+'문제 다시</button>':'')+
        '<button class="b b1" onclick="startExam()">🆕 새 문제</button>'+
        (wrong.length?'<button class="b b5" onclick="speakWrong()">🔊 틀린 단어 듣기</button>':'')+
      '</div></div>';
    window._examWrong=wrong;
  }
  return h;
}
function startExam(){examQs=makeExam();examPick=examQs.map(function(){return -1;});examGraded=false;examActive=examQs.map(function(_,i){return i;});render();window.scrollTo({top:0,behavior:'smooth'});}
function pickExam(qi,j){if(examGraded)return;examPick[qi]=j;render();}
function gradeExam(){
  var un=examActive.filter(function(i){return examPick[i]<0;});
  if(un.length){alert('아직 안 푼 문제가 '+un.length+'개 있어요. 모두 풀고 채점하세요.');return;}
  examGraded=true;render();
}
function retryWrong(){
  var w=window._examWrong||[];
  w.forEach(function(i){examPick[i]=-1;});
  examActive=w;examGraded=false;render();window.scrollTo({top:0,behavior:'smooth'});
}
function speakWrong(){
  var w=window._examWrong||[];
  var words=w.map(function(i){var q=examQs[i];return q.say||q.opts[q.ans];}).filter(function(x){return /[a-z]/i.test(x);});
  var k=0;
  function next(){if(k>=words.length)return;var u=new SpeechSynthesisUtterance(words[k++]);u.lang='en-US';u.rate=.85;u.onend=next;SS.speak(u);}
  if(SS){SS.cancel();next();}
}

buildSteps();render();
</script>
</body>
</html>
