<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>본문 학습 · 중1 능률 4과</title>
<style>
:root{
  --navy:#1a2744; --navy2:#27375c; --pink:#e8607a; --pink-d:#c93a5a;
  --l2:#2f8f6b; --ink:#22262f; --sub:#6b7280; --line:#e3e6ec; --bg:#f4f6f9;
  --ok:#2e7d32; --ok-bg:#e8f5e9; --no:#c62828; --no-bg:#fdecea;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);font-family:'Noto Sans KR',-apple-system,sans-serif;}
.eng{font-family:'Georgia',serif;}
.wrap{max-width:760px;margin:0 auto;padding:16px 14px 60px;}
.head{background:linear-gradient(160deg,var(--navy),var(--navy2));color:#fff;border-radius:16px;padding:20px 18px;margin-bottom:14px;}
.head .kick{font-size:13px;color:#ffc2cf;font-weight:700;letter-spacing:1px;}
.head h1{font-size:22px;margin:6px 0 0;}
.head .sub{font-size:14px;color:#cfd6e6;margin-top:4px;}
.prog{height:10px;background:#e0e4ea;border-radius:6px;overflow:hidden;margin:12px 0;}
.prog > i{display:block;height:100%;background:linear-gradient(90deg,var(--l2),#3fa34d);width:0;transition:width .3s;}
.tabs{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap;}
.tab{flex:1;min-width:90px;padding:13px 6px;border:2px solid var(--line);background:#fff;border-radius:12px;font-size:14px;font-weight:700;color:var(--sub);cursor:pointer;text-align:center;}
.tab.on{background:var(--navy);color:#fff;border-color:var(--navy);}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:14px 20px;border:none;border-radius:12px;font-size:17px;font-weight:700;cursor:pointer;background:var(--navy);color:#fff;}
.btn:active{transform:scale(.97);}
.btn.lg{width:100%;padding:16px;font-size:18px;margin-top:10px;}
.btn.ghost{background:#fff;color:var(--navy);border:2px solid var(--navy);}
.btn.sound{background:var(--l2);padding:8px 12px;font-size:14px;}
.btn.slow{background:#5a7a9a;padding:8px 12px;font-size:14px;}
.btn.sm{padding:9px 13px;font-size:14px;}
.card{background:#fff;border-radius:16px;padding:18px 15px;box-shadow:0 2px 10px rgba(0,0,0,.05);margin-bottom:14px;}
.hidden{display:none;}

/* 공통 문장 네비 */
.snav{display:flex;gap:8px;align-items:center;justify-content:space-between;margin-top:12px;}
.snav .btn{flex:1;}
.counter{font-size:14px;color:var(--sub);text-align:center;margin-top:8px;}
.para-tag{display:inline-block;font-size:12px;color:var(--sub);background:#eef0f3;padding:3px 9px;border-radius:10px;margin-bottom:8px;}

/* 구문분석 */
.toolbar{display:flex;gap:8px;justify-content:center;margin-bottom:14px;flex-wrap:wrap;}
.chunks{font-size:20px;line-height:2.5;text-align:center;}
.chunk{display:inline-block;position:relative;padding:3px 7px;margin:2px;border-radius:7px;cursor:pointer;border-bottom:2.5px solid transparent;}
.chunk:active{transform:scale(.96);}
.chunk.show{color:#fff;}
.role-label{font-size:11px;display:block;line-height:1;margin-top:2px;font-family:'Noto Sans KR';}
.legend{display:flex;flex-wrap:wrap;gap:7px;justify-content:center;margin-top:14px;}
.leg{font-size:12px;padding:3px 9px;border-radius:10px;color:#fff;font-weight:700;}
.chunk-ko{font-size:15px;color:var(--sub);text-align:center;margin-top:14px;padding-top:12px;border-top:1px solid var(--line);}

/* 해석 모드 */
.interp .en{font-size:19px;color:var(--navy2);line-height:1.6;cursor:pointer;}
.interp .ko{font-size:16px;color:var(--ink);margin-top:10px;padding-top:10px;border-top:1px solid var(--line);}
.interp .ko.off{display:none;color:var(--sub);}

/* 거꾸로 영작 */
.rev-ko{font-size:18px;font-weight:700;margin-bottom:6px;}
.rev-hint{font-size:13px;color:var(--sub);margin-bottom:10px;}
.rev-input{width:100%;min-height:64px;padding:13px;border:2px solid var(--line);border-radius:12px;font-size:17px;font-family:'Georgia',serif;resize:vertical;}
.rev-input:focus{outline:none;border-color:var(--navy);}
.rev-result{margin-top:12px;font-size:16px;line-height:1.7;}
.tok-ok{color:var(--ok);font-weight:700;}
.tok-no{color:var(--no);font-weight:700;text-decoration:line-through;}
.rev-answer{margin-top:10px;padding:11px 13px;background:#f7f8fa;border-radius:10px;font-size:16px;}
.result{text-align:center;padding:26px 16px;}
.result .big{font-size:42px;font-weight:800;color:var(--navy);}
.result .msg{font-size:17px;color:var(--sub);margin:12px 0;}
.tag-line{font-size:13px;color:var(--sub);text-align:center;margin-top:6px;}
</style>
</head>
<body>
<div class="wrap">
  <div class="head">
    <div class="kick">중1 능률(김기택) · 4과</div>
    <h1 id="ptitle">Stay Safe at School</h1>
    <div class="sub">구문분석 · 해석 · 거꾸로 영작 (31문장)</div>
  </div>

  <div class="tabs">
    <div class="tab on" data-mode="syntax" onclick="switchMode('syntax')">🔍 구문분석</div>
    <div class="tab" data-mode="interp" onclick="switchMode('interp')">📖 해석</div>
    <div class="tab" data-mode="rev" onclick="switchMode('rev')">✍️ 거꾸로 영작</div>
  </div>
  <div class="prog"><i id="progBar"></i></div>

  <!-- 구문분석 -->
  <div id="syntaxPane">
    <div class="card">
      <span class="para-tag" id="sxPara"></span>
      <div class="toolbar">
        <button class="btn sound sm" onclick="speakCur()">🔊 듣기</button>
        <button class="btn slow sm" onclick="speakCur(true)">🐢 천천히</button>
        <button class="btn ghost sm" onclick="toggleAllRoles()">🏷️ 역할 전체보기</button>
      </div>
      <div class="chunks eng" id="sxChunks"></div>
      <div class="legend" id="sxLegend"></div>
      <div class="chunk-ko" id="sxKo"></div>
      <div class="snav">
        <button class="btn ghost" onclick="prevS()">← 이전</button>
        <button class="btn" onclick="nextS()">다음 →</button>
      </div>
      <div class="counter" id="sxCount"></div>
    </div>
  </div>

  <!-- 해석 -->
  <div id="interpPane" class="hidden">
    <div class="card interp">
      <span class="para-tag" id="ipPara"></span>
      <div class="toolbar" style="justify-content:flex-start;">
        <button class="btn sound sm" onclick="speakCur()">🔊 듣기</button>
        <button class="btn slow sm" onclick="toggleInterpKo()">🇰🇷 해석 토글</button>
      </div>
      <div class="en" id="ipEn" onclick="speakCur()"></div>
      <div class="ko" id="ipKo"></div>
      <div class="snav">
        <button class="btn ghost" onclick="prevS()">← 이전</button>
        <button class="btn" onclick="nextS()">다음 →</button>
      </div>
      <div class="counter" id="ipCount"></div>
    </div>
  </div>

  <!-- 거꾸로 영작 -->
  <div id="revPane" class="hidden">
    <div class="card">
      <span class="para-tag" id="rvPara"></span>
      <div class="rev-ko" id="rvKo"></div>
      <div class="rev-hint">한글을 보고 영어 문장을 직접 써보세요</div>
      <textarea class="rev-input eng" id="rvInput" placeholder="영어로 작성하세요" autocapitalize="off" spellcheck="false"></textarea>
      <button class="btn lg" id="rvCheckBtn" onclick="checkRev()">채점하기</button>
      <div class="rev-result" id="rvResult"></div>
      <div class="rev-answer hidden" id="rvAnswer"></div>
      <div style="display:flex;gap:8px;margin-top:10px;">
        <button class="btn sound sm" onclick="speakCur()" style="flex:1;">🔊 정답 듣기</button>
        <button class="btn ghost sm hidden" id="rvNext" onclick="nextRev()" style="flex:2;">다음 →</button>
      </div>
      <div class="counter" id="rvCount"></div>
    </div>
  </div>

  <!-- 결과 -->
  <div id="resultPane" class="hidden">
    <div class="card result">
      <div class="big" id="rScore"></div>
      <div class="msg" id="rMsg"></div>
      <button class="btn lg" onclick="restartRev()">다시 하기</button>
    </div>
  </div>
  <div class="tag-line">강동미나 영어학원 · 자체 제작 학습 콘텐츠</div>
</div>

<script>// 중1 능률(김기택) 4과 본문 - Stay Safe at School (31문장)
// 각 문장: en, ko, chunks[{text, role}] (구문 끊어읽기), para(문단)
// role: S(주어) V(동사) O(목적어) C(보어) M(수식어/부사구) CONN(접속/전치)
const PASSAGE = {
  title:"Stay Safe at School",
  titleKo:"학교에서 안전하게 지내기",
  sentences:[
    {para:1, en:"Hello, I'm Safer.", ko:"안녕하세요, 저는 Safer입니다.",
     chunks:[{t:"Hello,",r:"M"},{t:"I'm",r:"S+V"},{t:"Safer.",r:"C"}]},
    {para:1, en:"Many students have fun at school.", ko:"많은 학생들이 학교에서 즐거운 시간을 보냅니다.",
     chunks:[{t:"Many students",r:"S"},{t:"have",r:"V"},{t:"fun",r:"O"},{t:"at school.",r:"M"}]},
    {para:1, en:"But sometimes, dangerous accidents happen.", ko:"하지만 때때로, 위험한 사고들이 발생합니다.",
     chunks:[{t:"But",r:"CONN"},{t:"sometimes,",r:"M"},{t:"dangerous accidents",r:"S"},{t:"happen.",r:"V"}]},
    {para:1, en:"So we need to know about common accidents.", ko:"그래서 우리는 흔한 사고들에 대해 알 필요가 있습니다.",
     chunks:[{t:"So",r:"CONN"},{t:"we",r:"S"},{t:"need",r:"V"},{t:"to know",r:"O"},{t:"about common accidents.",r:"M"}]},
    {para:1, en:"Let's learn!", ko:"알아봅시다!",
     chunks:[{t:"Let's",r:"V"},{t:"learn!",r:"V"}]},
    {para:1, en:"Many school accidents happen in PE classes, at lunchtime, or during break.", ko:"많은 학교 사고들은 체육 시간에, 점심시간에, 또는 쉬는 시간 동안 발생합니다.",
     chunks:[{t:"Many school accidents",r:"S"},{t:"happen",r:"V"},{t:"in PE classes,",r:"M"},{t:"at lunchtime,",r:"M"},{t:"or during break.",r:"M"}]},
    {para:1, en:"Students get injuries when they play soccer, basketball, or dodgeball.", ko:"학생들은 축구, 농구, 또는 피구를 할 때 부상을 입습니다.",
     chunks:[{t:"Students",r:"S"},{t:"get",r:"V"},{t:"injuries",r:"O"},{t:"when they play",r:"CONN"},{t:"soccer, basketball, or dodgeball.",r:"O"}]},
    {para:1, en:"Accidents also happen when students are walking!", ko:"사고들은 또한 학생들이 걷고 있을 때에도 발생합니다!",
     chunks:[{t:"Accidents",r:"S"},{t:"also happen",r:"V"},{t:"when",r:"CONN"},{t:"students",r:"S"},{t:"are walking!",r:"V"}]},
    {para:1, en:"Students injure their fingers, ankles, and knees.", ko:"학생들은 손가락, 발목, 그리고 무릎을 다칩니다.",
     chunks:[{t:"Students",r:"S"},{t:"injure",r:"V"},{t:"their fingers, ankles, and knees.",r:"O"}]},
    {para:2, en:"Now we know about common school accidents.", ko:"이제 우리는 흔한 학교 사고들에 대해 알게 되었습니다.",
     chunks:[{t:"Now",r:"M"},{t:"we",r:"S"},{t:"know",r:"V"},{t:"about common school accidents.",r:"M"}]},
    {para:2, en:"But how do they happen?", ko:"그런데 그것들은 어떻게 발생하는 걸까요?",
     chunks:[{t:"But",r:"CONN"},{t:"how",r:"M"},{t:"do they happen?",r:"V+S"}]},
    {para:2, en:"Jinho played basketball.", ko:"(오전 10시, 체육 시간) 진호는 농구를 했다.",
     chunks:[{t:"Jinho",r:"S"},{t:"played",r:"V"},{t:"basketball.",r:"O"}]},
    {para:2, en:"He jumped but landed the wrong way.", ko:"그는 점프를 했는데 잘못 착지했다.",
     chunks:[{t:"He",r:"S"},{t:"jumped",r:"V"},{t:"but",r:"CONN"},{t:"landed",r:"V"},{t:"the wrong way.",r:"M"}]},
    {para:2, en:"He injured his ankle!", ko:"그는 자신의 발목을 다쳤다!",
     chunks:[{t:"He",r:"S"},{t:"injured",r:"V"},{t:"his ankle!",r:"O"}]},
    {para:2, en:"Sora picked up a bowl of hot soup.", ko:"(오후 12시 30분, 점심시간) 소라는 뜨거운 국 한 그릇을 집어 들었다.",
     chunks:[{t:"Sora",r:"S"},{t:"picked up",r:"V"},{t:"a bowl of hot soup.",r:"O"}]},
    {para:2, en:"Oops! She bumped into Jaemin!", ko:"이런! 그녀는 재민이와 부딪쳤다!",
     chunks:[{t:"Oops!",r:"M"},{t:"She",r:"S"},{t:"bumped into",r:"V"},{t:"Jaemin!",r:"O"}]},
    {para:2, en:"Sora spilled the hot soup on her arm.", ko:"소라는 자신의 팔에 뜨거운 국을 쏟았다.",
     chunks:[{t:"Sora",r:"S"},{t:"spilled",r:"V"},{t:"the hot soup",r:"O"},{t:"on her arm.",r:"M"}]},
    {para:2, en:"Homin walked down the hallway.", ko:"(오후 2시, 쉬는 시간) 호민이는 복도를 걸어갔다.",
     chunks:[{t:"Homin",r:"S"},{t:"walked down",r:"V"},{t:"the hallway.",r:"M"}]},
    {para:2, en:"He looked at his smartphone.", ko:"그는 자신의 스마트폰을 보았다.",
     chunks:[{t:"He",r:"S"},{t:"looked at",r:"V"},{t:"his smartphone.",r:"O"}]},
    {para:2, en:"Be careful, Homin!", ko:"조심해, 호민아!",
     chunks:[{t:"Be careful,",r:"V+C"},{t:"Homin!",r:"M"}]},
    {para:2, en:"Ouch! He bumped into the wall.", ko:"아야! 그는 벽에 부딪쳤다.",
     chunks:[{t:"Ouch!",r:"M"},{t:"He",r:"S"},{t:"bumped into",r:"V"},{t:"the wall.",r:"O"}]},
    {para:2, en:"The school day ended.", ko:"(오후 3시 10분, 수업 후) 학교 수업이 끝났다.",
     chunks:[{t:"The school day",r:"S"},{t:"ended.",r:"V"}]},
    {para:2, en:"Minji wanted to go home quickly.", ko:"민지는 빨리 집에 가고 싶었다.",
     chunks:[{t:"Minji",r:"S"},{t:"wanted",r:"V"},{t:"to go home",r:"O"},{t:"quickly.",r:"M"}]},
    {para:2, en:"She ran down the stairs and slipped!", ko:"그녀는 계단을 뛰어 내려갔고 미끄러졌다!",
     chunks:[{t:"She",r:"S"},{t:"ran down",r:"V"},{t:"the stairs",r:"M"},{t:"and",r:"CONN"},{t:"slipped!",r:"V"}]},
    {para:3, en:"We looked at some examples of accidents at school.", ko:"우리는 학교에서의 몇 가지 사고 사례들을 살펴보았습니다.",
     chunks:[{t:"We",r:"S"},{t:"looked at",r:"V"},{t:"some examples of accidents",r:"O"},{t:"at school.",r:"M"}]},
    {para:3, en:"Now write the safety promises below.", ko:"이제 아래에 안전 약속들을 적어보세요.",
     chunks:[{t:"Now",r:"M"},{t:"write",r:"V"},{t:"the safety promises",r:"O"},{t:"below.",r:"M"}]},
    {para:3, en:"You should keep them!", ko:"여러분은 그것들을 지켜야 합니다!",
     chunks:[{t:"You",r:"S"},{t:"should keep",r:"V"},{t:"them!",r:"O"}]},
    {para:3, en:"I will warm up before I play sports.", ko:"나는 운동을 하기 전에 준비 운동을 할 것이다.",
     chunks:[{t:"I",r:"S"},{t:"will warm up",r:"V"},{t:"before",r:"CONN"},{t:"I play sports.",r:"S+V+O"}]},
    {para:3, en:"I will look around carefully when I am holding hot soup.", ko:"나는 뜨거운 국을 들고 있을 때 주변을 주의 깊게 살필 것이다.",
     chunks:[{t:"I",r:"S"},{t:"will look around",r:"V"},{t:"carefully",r:"M"},{t:"when",r:"CONN"},{t:"I am holding hot soup.",r:"S+V+O"}]},
    {para:3, en:"I will not use my smartphone when I walk.", ko:"나는 걸을 때 내 스마트폰을 사용하지 않을 것이다.",
     chunks:[{t:"I",r:"S"},{t:"will not use",r:"V"},{t:"my smartphone",r:"O"},{t:"when I walk.",r:"CONN"}]},
    {para:3, en:"I will not run on the stairs.", ko:"나는 계단에서 뛰지 않을 것이다.",
     chunks:[{t:"I",r:"S"},{t:"will not run",r:"V"},{t:"on the stairs.",r:"M"}]}
  ]
};

const ROLE_INFO = {
  "S":{label:"주어",color:"#2f6fb0"},
  "V":{label:"동사",color:"#c93a5a"},
  "O":{label:"목적어",color:"#2f8f6b"},
  "C":{label:"보어",color:"#8a5cc0"},
  "M":{label:"수식어",color:"#888"},
  "CONN":{label:"접속/전치",color:"#b8860b"},
  "S+V":{label:"주어+동사",color:"#2f6fb0"},
  "V+S":{label:"동사+주어",color:"#c93a5a"},
  "V+C":{label:"동사+보어",color:"#c93a5a"},
  "S+V+O":{label:"주어+동사+목적어",color:"#2f6fb0"}
};
</script>
<script>
/* ===== TTS ===== */
let voices=[],chosenVoice=null,ttsUnlocked=false;
function pickVoice(){voices=speechSynthesis.getVoices();const prefer=['Google US English','Google UK English Female','Samantha','Microsoft Aria','Microsoft Jenny','Microsoft Zira','Karen','Daniel','Alex'];for(const n of prefer){const v=voices.find(v=>v.name===n);if(v){chosenVoice=v;return;}}chosenVoice=voices.find(v=>v.lang==='en-US')||voices.find(v=>v.lang&&v.lang.startsWith('en'))||null;}
if('speechSynthesis'in window){pickVoice();speechSynthesis.onvoiceschanged=pickVoice;}
function unlockTTS(){if(ttsUnlocked||!('speechSynthesis'in window))return;const u=new SpeechSynthesisUtterance('');u.volume=0;speechSynthesis.speak(u);ttsUnlocked=true;}
document.body.addEventListener('touchstart',unlockTTS,{once:true});
document.body.addEventListener('click',unlockTTS,{once:true});
function speak(text,slow){if(!('speechSynthesis'in window))return;unlockTTS();speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);if(chosenVoice)u.voice=chosenVoice;u.lang='en-US';u.rate=slow?0.55:0.92;speechSynthesis.speak(u);}

/* ===== 상태 ===== */
const S = PASSAGE.sentences;
let idx=0, showInterpKo=true;
let revPos=0, revScore=0, revAnswered=false;
let allRolesShown=false;

function speakCur(slow){ speak(S[idx].en, slow); }

/* ===== 구문분석 ===== */
function renderSyntax(){
  const s=S[idx];
  document.getElementById('sxPara').textContent='문단 '+s.para;
  document.getElementById('sxCount').textContent=(idx+1)+' / '+S.length;
  document.getElementById('sxKo').textContent=s.ko;
  const box=document.getElementById('sxChunks');box.innerHTML='';
  const usedRoles=new Set();
  s.chunks.forEach(c=>{
    usedRoles.add(c.r);
    const info=ROLE_INFO[c.r]||{label:c.r,color:'#888'};
    const span=document.createElement('span');
    span.className='chunk'+(allRolesShown?' show':'');
    span.style.borderBottomColor=info.color;
    if(allRolesShown){span.style.background=info.color;}
    span.innerHTML=c.t+'<span class="role-label" style="'+(allRolesShown?'color:#fff':'color:'+info.color)+'">'+(allRolesShown?info.label:'')+'</span>';
    span.onclick=()=>{
      const shown=span.classList.toggle('show');
      const lbl=span.querySelector('.role-label');
      if(shown){span.style.background=info.color;span.style.color='#fff';lbl.textContent=info.label;lbl.style.color='#fff';}
      else{span.style.background='';span.style.color='';lbl.textContent='';lbl.style.color=info.color;}
    };
    box.appendChild(span);
  });
  // 범례
  const leg=document.getElementById('sxLegend');leg.innerHTML='';
  [...usedRoles].forEach(r=>{
    const info=ROLE_INFO[r]||{label:r,color:'#888'};
    const el=document.createElement('span');el.className='leg';el.style.background=info.color;el.textContent=info.label;
    leg.appendChild(el);
  });
  setProg((idx+1)/S.length);
}
function toggleAllRoles(){ allRolesShown=!allRolesShown; renderSyntax(); }

/* ===== 해석 ===== */
function renderInterp(){
  const s=S[idx];
  document.getElementById('ipPara').textContent='문단 '+s.para;
  document.getElementById('ipCount').textContent=(idx+1)+' / '+S.length;
  document.getElementById('ipEn').textContent=s.en;
  document.getElementById('ipKo').textContent=s.ko;
  document.getElementById('ipKo').classList.toggle('off',!showInterpKo);
  setProg((idx+1)/S.length);
}
function toggleInterpKo(){ showInterpKo=!showInterpKo; document.getElementById('ipKo').classList.toggle('off',!showInterpKo); }

/* ===== 문장 네비 (구문/해석 공용) ===== */
function nextS(){ idx=(idx+1)%S.length; refreshCur(); if(curMode==='syntax')speakCur(); }
function prevS(){ idx=(idx-1+S.length)%S.length; refreshCur(); }
function refreshCur(){ if(curMode==='syntax')renderSyntax(); else if(curMode==='interp')renderInterp(); }

/* ===== 거꾸로 영작 ===== */
function startRev(){ revPos=0; revScore=0; document.getElementById('resultPane').classList.add('hidden'); document.getElementById('revPane').classList.remove('hidden'); renderRev(); }
function renderRev(){
  if(revPos>=S.length)return finishRev();
  revAnswered=false; idx=revPos;
  const s=S[revPos];
  document.getElementById('rvPara').textContent='문단 '+s.para;
  document.getElementById('rvKo').textContent=s.ko;
  document.getElementById('rvInput').value='';
  document.getElementById('rvResult').innerHTML='';
  document.getElementById('rvAnswer').classList.add('hidden');
  document.getElementById('rvNext').classList.add('hidden');
  document.getElementById('rvCheckBtn').classList.remove('hidden');
  document.getElementById('rvCount').textContent='문장 '+(revPos+1)+' / '+S.length;
  setProg(revPos/S.length);
}
function norm(s){return s.toLowerCase().replace(/[.,!?'"\u201C\u201D]/g,'').replace(/\s+/g,' ').trim();}
function checkRev(){
  if(revAnswered)return;
  const s=S[revPos];
  const ans=norm(document.getElementById('rvInput').value);
  const cor=norm(s.en);
  const aw=ans.split(' '),cw=cor.split(' ');
  let html='';
  cw.forEach((c,i)=>{ if(aw[i]===c)html+='<span class="tok-ok">'+c+'</span> '; else html+='<span class="tok-no">'+(aw[i]||'___')+'</span> '; });
  document.getElementById('rvResult').innerHTML=html;
  const perfect=ans===cor; if(perfect)revScore++;
  const ab=document.getElementById('rvAnswer');ab.classList.remove('hidden');
  ab.innerHTML=(perfect?'✅ 정답!':'정답: ')+'<b class="eng">'+s.en+'</b>';
  document.getElementById('rvCheckBtn').classList.add('hidden');
  document.getElementById('rvNext').classList.remove('hidden');
  revAnswered=true;
}
function nextRev(){ revPos++; renderRev(); }
function restartRev(){ startRev(); }
function finishRev(){
  document.getElementById('revPane').classList.add('hidden');
  const pane=document.getElementById('resultPane');pane.classList.remove('hidden');
  document.getElementById('rScore').textContent=revScore+' / '+S.length;
  const pct=Math.round(revScore/S.length*100);
  document.getElementById('rMsg').innerHTML='거꾸로 영작 완료! '+(pct>=80?'대단해요 🎉':pct>=50?'잘하고 있어요!':'본문을 더 외워봐요');
  setProg(1);
}

/* ===== 공통 ===== */
let curMode='syntax';
function switchMode(m){
  curMode=m;
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('on',t.dataset.mode===m));
  ['syntaxPane','interpPane','revPane','resultPane'].forEach(p=>document.getElementById(p).classList.add('hidden'));
  if(m==='syntax'){document.getElementById('syntaxPane').classList.remove('hidden');renderSyntax();}
  else if(m==='interp'){document.getElementById('interpPane').classList.remove('hidden');renderInterp();}
  else if(m==='rev'){startRev();}
}
function setProg(r){document.getElementById('progBar').style.width=Math.round(r*100)+'%';}
document.getElementById('ptitle').textContent=PASSAGE.title;
renderSyntax();
</script>
</body>
</html>
