<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>뮤엠 영어 — 우리 아이 영어 진단</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gothic+A1:wght@600;700;800;900&family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#F2F5F1;--surface:#fff;--surface2:#F6F8F5;--ink:#1E2C34;--soft:#5C6B71;--line:#DDE3DD;--accent:#1F7A6B;--accent2:#E1F0EB;--gold:#B0831A;--gold2:#FBF1D9;--red:#C0392B;--red2:#FBE6E2;--blue:#2C5E8C;--blue2:#E3EDF6;--warm:#F7F3EE;--warm2:#EDE6DC;--r:16px;--shadow:0 2px 8px rgba(30,44,52,.07),0 12px 32px rgba(30,44,52,.06)}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'IBM Plex Sans KR',sans-serif;background:var(--bg);color:var(--ink);line-height:1.6}
.app{max-width:680px;margin:0 auto;padding:0 16px 80px}

/* hero */
.hero{background:var(--accent);color:#fff;margin:0 -16px 0;padding:32px 28px 36px;position:relative;overflow:hidden}
.hero::after{content:'';position:absolute;right:-40px;top:-40px;width:260px;height:260px;background:rgba(255,255,255,.06);border-radius:50%}
.heroLabel{font-size:.78rem;font-weight:800;letter-spacing:.08em;opacity:.75;margin-bottom:8px;text-transform:uppercase}
.heroTitle{font-family:'Gothic A1',sans-serif;font-weight:900;font-size:1.65rem;line-height:1.28;margin-bottom:10px;position:relative;z-index:1}
.heroSub{font-size:.9rem;opacity:.82;line-height:1.6;position:relative;z-index:1}
.heroSteps{display:flex;gap:0;margin-top:20px;position:relative;z-index:1}
.hstep{flex:1;text-align:center;font-size:.72rem;font-weight:800;opacity:.7}
.hstep span{display:block;width:28px;height:28px;border-radius:50%;background:rgba(255,255,255,.18);margin:0 auto 5px;line-height:28px;font-size:.85rem}
.hstep.cur{opacity:1}
.hstep.cur span{background:rgba(255,255,255,.9);color:var(--accent)}
.hstep-line{flex:0 0 20px;align-self:center;height:2px;background:rgba(255,255,255,.2);margin-bottom:14px}

/* card & nav */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.wrapPad{padding:24px 22px}
.qtitle{font-family:'Gothic A1',sans-serif;font-weight:900;font-size:1.15rem;margin-bottom:5px}
.qhint{font-size:.84rem;color:var(--soft);margin-bottom:18px;line-height:1.55}
.opts{display:grid;gap:10px}
.opts.grid{grid-template-columns:repeat(auto-fill,minmax(88px,1fr))}
.opt{font-family:inherit;text-align:left;border:1.5px solid var(--line);background:#fff;border-radius:13px;padding:14px 16px;cursor:pointer;font-weight:700;font-size:.95rem;transition:.12s;line-height:1.4}
.opt:hover{border-color:var(--accent);background:var(--accent2)}
.opt.sel{border-color:var(--accent);background:var(--accent2);box-shadow:inset 0 0 0 1px var(--accent)}
.opt small{display:block;font-weight:500;color:var(--soft);font-size:.78rem;margin-top:4px}
.opt.center{text-align:center}
.progress{display:flex;gap:5px;margin-bottom:20px}
.pdot{flex:1;height:5px;border-radius:99px;background:var(--line)}
.pdot.on{background:var(--accent)}
.wizNav{display:flex;justify-content:space-between;gap:8px;margin-top:22px}
.btn{font-family:inherit;border:1.5px solid var(--line);background:#fff;color:var(--ink);border-radius:12px;padding:12px 18px;cursor:pointer;font-weight:700;font-size:.92rem;transition:.12s}
.btn:hover{border-color:var(--soft)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.ghost{background:var(--surface2)}
.btn.big{padding:15px 22px;font-size:1rem;border-radius:14px;width:100%}
.btn:disabled{opacity:.4;cursor:not-allowed}

/* tabs */
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:18px 0 16px}
.tab{font-family:inherit;border:1.5px solid var(--line);background:#fff;color:var(--soft);border-radius:12px;padding:10px 15px;cursor:pointer;font-weight:800;font-size:.88rem}
.tab.active{background:var(--accent);border-color:var(--accent);color:#fff}
.view{display:none}.view.active{display:block}

/* AI loading */
.aiLoader{text-align:center;padding:40px 20px}
.aiDots{display:inline-flex;gap:8px;margin-bottom:14px}
.aiDots span{width:10px;height:10px;border-radius:50%;background:var(--accent);animation:bounce .9s infinite alternate}
.aiDots span:nth-child(2){animation-delay:.2s}
.aiDots span:nth-child(3){animation-delay:.4s}
@keyframes bounce{to{transform:translateY(-10px);opacity:.4}}
.aiLoadMsg{font-weight:700;color:var(--soft);font-size:.95rem}

/* result */
.resHero{background:linear-gradient(135deg,var(--accent) 0%,#155a4e 100%);color:#fff;border-radius:var(--r) var(--r) 0 0;padding:22px 22px 20px}
.resKicker{font-size:.76rem;font-weight:800;opacity:.7;letter-spacing:.06em;text-transform:uppercase;margin-bottom:5px}
.resTitle{font-family:'Gothic A1',sans-serif;font-weight:900;font-size:1.35rem;line-height:1.3;margin-bottom:10px}
.resTagrow{display:flex;gap:6px;flex-wrap:wrap}
.restag{background:rgba(255,255,255,.18);border-radius:99px;padding:3px 11px;font-size:.74rem;font-weight:800}
.resBody{padding:22px}
.sechead{font-family:'Gothic A1',sans-serif;font-weight:800;font-size:1rem;margin:20px 0 10px;display:flex;align-items:center;gap:7px;color:var(--ink)}
.sechead .dot{width:8px;height:8px;border-radius:99px;background:var(--accent)}
.aiAnswer{background:var(--warm);border:1px solid var(--warm2);border-radius:13px;padding:18px 20px;font-size:.97rem;line-height:1.85;white-space:pre-wrap;color:var(--ink)}
.aiAnswer b{color:var(--accent)}
.road{border-left:2px solid var(--accent2);margin-left:6px;padding-left:18px}
.stage{position:relative;padding:9px 0}
.stage::before{content:'';position:absolute;left:-25px;top:14px;width:11px;height:11px;border-radius:99px;background:#fff;border:2.5px solid var(--accent)}
.stage.now::before{background:var(--accent)}
.stage .nm{font-weight:800;font-size:.96rem}
.stage .meta{font-size:.8rem;color:var(--soft);font-family:'IBM Plex Mono',monospace}
.stage.now .nm{color:var(--accent)}
.swatch{width:22px;height:22px;border-radius:6px;display:inline-block;vertical-align:middle;margin-right:7px;border:1px solid rgba(0,0,0,.08)}
.note{font-size:.83rem;color:var(--soft);background:var(--gold2);border:1px solid #EBD9A8;border-radius:11px;padding:11px 13px;margin-top:10px}
.note b{color:var(--gold)}

/* inquiry form */
.formCard{background:var(--surface);border:1.5px solid var(--accent);border-radius:var(--r);padding:22px;margin-top:20px;box-shadow:0 4px 20px rgba(31,122,107,.12)}
.formTitle{font-family:'Gothic A1',sans-serif;font-weight:900;font-size:1.1rem;margin-bottom:5px;color:var(--accent)}
.formSub{font-size:.84rem;color:var(--soft);margin-bottom:18px}
.field{margin-bottom:14px}
.field label{display:block;font-weight:800;color:var(--soft);font-size:.78rem;margin-bottom:6px}
.field input,.field select,.field textarea{width:100%;font-family:inherit;border:1.5px solid var(--line);border-radius:10px;padding:11px 13px;font-size:.93rem;color:var(--ink)}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--accent)}
.field textarea{min-height:68px;resize:vertical}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:500px){.grid2{grid-template-columns:1fr}}
.submitted{text-align:center;padding:30px 20px;background:var(--accent2);border-radius:var(--r);border:1px solid var(--accent)}
.submitted .big-emoji{font-size:2.8rem;margin-bottom:10px}
.submitted h3{font-family:'Gothic A1',sans-serif;font-weight:900;font-size:1.2rem;color:var(--accent);margin-bottom:8px}
.submitted p{font-size:.9rem;color:var(--soft);line-height:1.65}

/* quiz demo */
.qcard{padding:16px 18px;margin-bottom:11px}
.qn{font-weight:800;margin-bottom:11px;font-size:.95rem}
.qn .idx{display:inline-flex;width:24px;height:24px;border-radius:7px;background:var(--accent2);color:var(--accent);font-family:'IBM Plex Mono',monospace;font-weight:700;align-items:center;justify-content:center;margin-right:7px;font-size:.8rem}
.choices{display:grid;gap:7px}
.choice{font-family:inherit;text-align:left;border:1.5px solid var(--line);background:#fff;border-radius:10px;padding:11px 13px;cursor:pointer;font-weight:600;font-size:.91rem}
.choice:hover{border-color:var(--accent)}
.choice.right{border-color:var(--accent);background:var(--accent2);color:var(--accent);font-weight:800}
.choice.wrong{border-color:var(--red);background:var(--red2);color:var(--red)}
.fb{margin-top:8px;font-size:.84rem;border-radius:9px;padding:9px 12px;display:none}
.fb.show{display:block}
.fb.ok{background:var(--accent2);color:var(--accent)}
.fb.no{background:var(--red2);color:var(--red)}
.demoGrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}
@media(max-width:500px){.demoGrid{grid-template-columns:1fr}}
.demoCardBtn{padding:16px;cursor:pointer;text-align:left;transition:.12s;border:1.5px solid var(--line)}
.demoCardBtn:hover{border-color:var(--accent);transform:translateY(-1px)}
.demoCardBtn .lv{font-family:'Gothic A1',sans-serif;font-weight:900;font-size:1rem;margin-bottom:4px}
.demoCardBtn .ds{font-size:.8rem;color:var(--soft)}
.listen{display:inline-flex;align-items:center;gap:7px;border:1.5px solid var(--accent);background:var(--accent2);color:var(--accent);border-radius:11px;padding:9px 14px;font-weight:800;font-size:.9rem;cursor:pointer;margin-bottom:10px;font-family:inherit}
.listen:hover{background:var(--accent);color:#fff}

/* faq */
.faq{margin-bottom:9px;overflow:hidden}
.faqQ{padding:14px 16px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:10px;font-weight:800;font-size:.94rem}
.faqA{display:none;padding:0 16px 16px;font-size:.91rem;line-height:1.75;color:var(--ink)}
.faq.open .faqA{display:block}
.faqA b{color:var(--accent)}
.bandlabel{font-family:'Gothic A1',sans-serif;font-weight:800;color:var(--soft);font-size:.83rem;margin:18px 0 8px}

/* ops */
.opsgrid{display:grid;grid-template-columns:1fr 1fr;gap:11px}
@media(max-width:500px){.opsgrid{grid-template-columns:1fr}}
.opsCard{padding:15px 17px}
.opsCard .t{font-family:'Gothic A1',sans-serif;font-weight:800;font-size:.93rem;margin-bottom:7px;color:var(--accent)}
.opsCard ul{list-style:none;font-size:.88rem}
.opsCard li{padding:4px 0 4px 16px;position:relative}
.opsCard li::before{content:'·';position:absolute;left:4px;color:var(--accent);font-weight:900}
.opsCard li b{color:var(--ink)}

.foot{text-align:center;color:var(--soft);font-size:.75rem;margin-top:24px;line-height:1.7}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;border-radius:11px;padding:11px 18px;font-weight:800;font-size:.88rem;opacity:0;pointer-events:none;transition:.2s;z-index:80}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>

<div class="hero">
  <div style="max-width:680px;margin:0 auto;padding:0 0px">
    <div class="heroLabel" id="acNameHero">뮤엠 영어</div>
    <div class="heroTitle">우리 아이 영어,<br>어디서부터 시작할까요?</div>
    <div class="heroSub">학년과 고민을 알려주시면 맞춤 커리큘럼과 답변을<br>바로 받아보실 수 있어요. (2~3분)</div>
    <div class="heroSteps" id="heroSteps">
      <div class="hstep cur" id="hs0"><span>1</span>학년·경험</div>
      <div class="hstep-line"></div>
      <div class="hstep" id="hs1"><span>2</span>고민·목표</div>
      <div class="hstep-line"></div>
      <div class="hstep" id="hs2"><span>3</span>맞춤 답변</div>
    </div>
  </div>
</div>

<div class="app">
  <div class="tabs" style="margin-top:18px">
    <button class="tab active" data-v="diag" onclick="goTab('diag')">📋 내 아이 진단</button>
    <button class="tab" data-v="demo" onclick="goTab('demo')">🎯 수업 맛보기</button>
    <button class="tab" data-v="faq" onclick="goTab('faq')">💬 자주 묻는 질문</button>
    <button class="tab" data-v="ops" onclick="goTab('ops')">📌 수업 안내</button>
  </div>

  <!-- ===== 진단 ===== -->
  <section id="v-diag" class="view active">
    <div class="card" id="wizCard"></div>
  </section>

  <!-- ===== 수업 맛보기 ===== -->
  <section id="v-demo" class="view">
    <div id="demoHome"></div>
    <div id="demoDetail" style="display:none"></div>
  </section>

  <!-- ===== FAQ ===== -->
  <section id="v-faq" class="view"><div id="faqBox"></div></section>

  <!-- ===== 수업 안내 ===== -->
  <section id="v-ops" class="view"><div id="opsBox"></div></section>

  <p class="foot">
    이 페이지에 입력하신 정보는 맞춤 답변 생성에만 활용되며,<br>
    상담 신청을 하셔야만 학원에 전달됩니다.
  </p>
</div>
<div id="toast" class="toast"></div>

<script>
/* ═══ 학원 정보 (원장님이 직접 수정하는 부분) ═══ */
/* ═══════════════════════════════════════════════════════
   ✏️  원장님 설정 — 이 부분만 수정하시면 됩니다
   ═══════════════════════════════════════════════════════ */
const ACADEMY = {
  name:    '뮤엠 영어',           // ← 학원명
  phone:   '010-4090-1505',       // ← 연락처
  address: '서울 강동구',          // ← 주소
  intro:   '영어를 오래 잘하는 아이로 키우는 뮤엠 영어입니다.',

  // Formspree 설정 ─────────────────────────────────────
  // 1) formspree.io 접속 → 회원가입(이메일 입력)
  // 2) "+ New Form" 클릭 → 폼 생성
  // 3) 생성된 ID(예: xabcde12)를 아래에 붙여넣기
  formspreeId: 'xpqgzapv',    // ← ✏️ Formspree ID

  // 카카오 오픈채팅 설정 ────────────────────────────────
  // 카카오 오픈채팅 링크 또는 카카오 채널 채팅 링크
  // 예1) 오픈채팅: 'https://open.kakao.com/o/xxxxxxx'
  // 예2) 카카오 채널: 'http://pf.kakao.com/_xxxxx/chat'
  kakaoUrl: 'http://pf.kakao.com/_fBRtG',                   // ← ✏️ 카카오 링크 붙여넣기
};

/* ═══ 공통 데이터 (원장용 콘솔과 동일) ═══ */
const LEVELS=[
 {id:'white',  nm:'화이트',      full:'화이트 (파닉스·그래마·커뮤니케이션 6권)', color:'#9aa0a6', months:12, demo:'phonics'},
 {id:'yellow', nm:'옐로우',      full:'옐로우 (2,000+ 프레이즈·청크)',           color:'#E8B91F', months:8,  demo:'yellow'},
 {id:'pink',   nm:'핑크',        full:'핑크 (전학년 교과 내용 스피킹)',           color:'#E27FA6', months:5,  demo:'pink'},
 {id:'greenblue',nm:'그린·블루', full:'그린·블루 (에세이 라이팅)',               color:'#3FA15C', months:12, demo:'greenblue'},
 {id:'redblack',nm:'레드·블랙',  full:'레드·블랙 (사회 이슈 디베이트 라이팅)',    color:'#C0392B', months:12, demo:'redblack'},
 {id:'middle', nm:'중등 커리',   full:'중등 내신 커리 (구글클래스+1:1직강+서술형 모의)', color:'#2C5E8C', months:null, demo:'middle'},
 {id:'grammar',nm:'문법 8권',    full:'문법 8권 (센텐스·프레이즈 빌드업)',         color:'#7A5BB0', months:null, demo:'grammar'},
];
function lv(id){return LEVELS.find(l=>l.id===id)}

const GRADES=['초1','초2','초3','초4','초5','초6','중1','중2','중3'];
function gnum(g){return GRADES.indexOf(g)+1}
function gname(n){if(n<1)return '미취학';if(n<=9)return GRADES[n-1];return '고등 연계';}
function band(g){const n=gnum(g);if(n<=3)return 'low';if(n<=6)return 'mid';return 'high';}

const WORRIES={
 low:[
  ['fun','영어를 싫어하게 되지 않을까 걱정돼요','거부감·흥미'],
  ['phonics_time','파닉스 떼는 데 얼마나 걸리나요','파닉스 기간'],
  ['exposure','집에서 영어 노출이 부족한데 괜찮을까요','가정 노출량'],
  ['late','또래보다 늦게 시작한 건 아닌지 걱정돼요','시작 시점'],
 ],
 mid:[
  ['toolate','지금 시작이 너무 늦은 건 아닌지 걱정돼요','시작 시점'],
  ['exam_prep','중학교 내신·문법 대비가 될까요','내신 연결'],
  ['reading','리딩·어휘가 제대로 늘까요','읽기·단어'],
  ['speaking','회화도 같이 잡힐 수 있을까요','말하기'],
 ],
 high:[
  ['naesin','내신·수행평가를 꼼꼼히 챙겨주나요','내신·수행'],
  ['seosul','서술형·모의고사 준비가 될까요','서술형·모의'],
  ['suneung','수능까지 연결이 될까요','입시 연결'],
  ['homework','숙제·학습량이 너무 버거울까봐요','학습량'],
  ['weakbase','기초가 부족한데 따라갈 수 있을까요','기초 보강'],
 ],
};

const GOALS=[
 ['interest','흥미·기초부터 차근히','영어와 친해지기'],
 ['balanced','회화·읽기·쓰기 균형 있게','전반적 실력 향상'],
 ['naesin','내신·서술형 집중 대비','학교 시험 중심'],
 ['ipsi','수능·입시까지 장기적으로','장기 입시 준비'],
];

/* ═══ 레벨 배치 ═══ */
function place(){
 const n=gnum(wiz.grade);
 if(wiz.exp==='other') return {start:null,label:'레벨 테스트 후 배치',testFirst:true,range:n<=3?'화이트 후반 ~ 옐로우':n<=6?'옐로우 ~ 그린·블루':'문법 8권 ~ 중등 커리'};
 if(wiz.exp==='current') return {start:null,label:'현재 레벨에서 이어가기',current:true};
 return {start:'white',label:'화이트 (파닉스) 시작'};
}

function buildRoad(startId){
 const order=['white','yellow','pink','greenblue','redblack','middle'];
 let idx=order.indexOf(startId); if(idx<0)idx=0;
 let g=gnum(wiz.grade),acc=0,rows=[];
 for(let i=idx;i<order.length;i++){
  const L=lv(order[i]);
  rows.push({L,when:acc===0?'지금 시작':`약 ${acc}개월 후`,grade:gname(Math.round(g+acc/12)),now:i===idx});
  if(L.months)acc+=L.months;
 }
 return rows;
}

/* ═══ 위저드 상태 ═══ */
let wiz={step:0,grade:null,exp:null,phonics:null,worry:null,goal:null};
const STEPS=['grade','exp','phonics','worry','goal','result'];

function renderWiz(){
 const c=document.getElementById('wizCard');
 const cur=STEPS[wiz.step];
 if(cur==='result'){startResult();return;}
 const prog='<div class="progress">'+STEPS.slice(0,5).map((_,i)=>`<div class="pdot ${i<=wiz.step?'on':''}"></div>`).join('')+'</div>';
 let body='';

 if(cur==='grade'){
  body=`<div class="qtitle">자녀분의 학년이 어떻게 되나요?</div>
   <div class="qhint">학년에 따라 적합한 커리큘럼과 시작 레벨이 달라집니다.</div>
   <div class="opts grid">${GRADES.map(g=>`<button class="opt center ${wiz.grade===g?'sel':''}" onclick="pick('grade','${g}')">${g}</button>`).join('')}</div>`;
 }
 if(cur==='exp'){
  body=`<div class="qtitle">${wiz.grade} · 지금까지 영어 학습 경험은요?</div>
   <div class="qhint">출발선을 정확히 잡아야 아이에게 맞는 커리큘럼을 제안할 수 있어요.</div>
   <div class="opts">
    <button class="opt ${wiz.exp==='new'?'sel':''}" onclick="pick('exp','new')">처음이에요 / 거의 안 했어요<small>알파벳·파닉스 단계부터 시작</small></button>
    <button class="opt ${wiz.exp==='other'?'sel':''}" onclick="pick('exp','other')">다른 학원·교습을 받은 적 있어요<small>기초가 있음 → 레벨 테스트로 배치</small></button>
    <button class="opt ${wiz.exp==='current'?'sel':''}" onclick="pick('exp','current')">현재 뮤엠에 다니고 있어요<small>현재 레벨에서 이어가기</small></button>
   </div>`;
 }
 if(cur==='phonics'){
  if(wiz.exp!=='new'){wiz.step++;renderWiz();return;}
  body=`<div class="qtitle">파닉스(읽기)는 어느 정도인가요?</div>
   <div class="qhint">정확한 시작 레벨을 잡기 위한 질문이에요.</div>
   <div class="opts">
    <button class="opt ${wiz.phonics==='none'?'sel':''}" onclick="pick('phonics','none')">거의 몰라요 (알파벳도 익히는 중)</button>
    <button class="opt ${wiz.phonics==='alpha'?'sel':''}" onclick="pick('phonics','alpha')">알파벳·소릿값은 조금 알아요</button>
    <button class="opt ${wiz.phonics==='some'?'sel':''}" onclick="pick('phonics','some')">간단한 단어는 읽을 수 있어요</button>
   </div>`;
 }
 if(cur==='worry'){
  const ws=WORRIES[band(wiz.grade)];
  body=`<div class="qtitle">가장 걱정되시는 부분이 어떤 건가요?</div>
   <div class="qhint">이 고민을 중심으로 맞춤 답변을 드릴게요.</div>
   <div class="opts">${ws.map(w=>`<button class="opt ${wiz.worry===w[0]?'sel':''}" onclick="pick('worry','${w[0]}')">${w[1]}<small>${w[2]}</small></button>`).join('')}</div>`;
 }
 if(cur==='goal'){
  body=`<div class="qtitle">어떤 목표를 바라고 계신가요?</div>
   <div class="qhint">목표에 맞춰 로드맵 방향을 안내해 드릴게요.</div>
   <div class="opts">${GOALS.map(g=>`<button class="opt ${wiz.goal===g[0]?'sel':''}" onclick="pick('goal','${g[0]}')">${g[1]}<small>${g[2]}</small></button>`).join('')}</div>`;
 }

 const canNext=wiz[cur]!=null;
 c.innerHTML=`<div class="wrapPad">${prog}${body}<div class="wizNav">
  <button class="btn ghost" onclick="wizBack()" ${wiz.step===0?'disabled':''}>← 이전</button>
  <button class="btn primary" onclick="wizNext()" ${canNext?'':'disabled'}>${wiz.step===4?'답변 받기 →':'다음 →'}</button>
 </div></div>`;
 updateHeroSteps();
}

function pick(k,v){wiz[k]=v;renderWiz();}
function wizNext(){if(wiz.step<5){wiz.step++;renderWiz();}}
function wizBack(){if(wiz.step>0){wiz.step--;if(STEPS[wiz.step]==='phonics'&&wiz.exp!=='new')wiz.step--;renderWiz();}}
function wizReset(){wiz={step:0,grade:null,exp:null,phonics:null,worry:null,goal:null};renderWiz();}

function updateHeroSteps(){
 [0,1,2].forEach(i=>document.getElementById('hs'+i)?.classList.remove('cur'));
 const s=wiz.step;
 if(s<=2) document.getElementById('hs0')?.classList.add('cur');
 else if(s<=4) document.getElementById('hs1')?.classList.add('cur');
 else document.getElementById('hs2')?.classList.add('cur');
}

/* ═══ AI 결과 생성 ═══ */
async function startResult(){
 updateHeroSteps();
 const c=document.getElementById('wizCard');
 c.innerHTML=`<div class="wrapPad"><div class="aiLoader">
  <div class="aiDots"><span></span><span></span><span></span></div>
  <div class="aiLoadMsg" id="loadMsg">아이 상황에 맞는 답변을 준비하고 있어요…</div>
 </div></div>`;

 const msgs=['아이 상황에 맞는 답변을 준비하고 있어요…','커리큘럼 로드맵을 구성하고 있어요…','맞춤 안내를 마무리하고 있어요…'];
 let mi=0; const iv=setInterval(()=>{mi=(mi+1)%msgs.length;const el=document.getElementById('loadMsg');if(el)el.textContent=msgs[mi];},1800);

 try{
  const aiText=await callAI();
  clearInterval(iv);
  renderResult(aiText);
 }catch(e){
  clearInterval(iv);
  renderResult(null);
 }
}

async function callAI(){
 const worryItem=WORRIES[band(wiz.grade)].find(w=>w[0]===wiz.worry);
 const goalItem=GOALS.find(g=>g[0]===wiz.goal);
 const p=place();
 const n=gnum(wiz.grade);

  exposure:'주 4회·매일 같은 리듬으로 학원 안에서 규칙적으로 영어 노출이 쌓입니다. 듣기 기반 수업이라 가정 노출량에 덜 의존해요.',
  late:'초4~5가 저희가 가장 추천하는 시작 시점입니다. 이해력이 받쳐줘서 화이트~옐로우를 더 빠르게 흡수해요.',
  toolate:'초4~5가 저희 추천 시작 시점입니다. 이해력이 뒷받침돼 진도가 빠르고, 중등 내신 타이밍에 맞아떨어집니다.',
  exam_prep:'색깔 레벨 후 문법 8권으로 문장을 쌓고, 초5부터 중등 내신 커리로 이어집니다. 구글클래스 6파트 개념 + 1:1 직강 구조예요.',

function renderResult(aiText){
 const c=document.getElementById('wizCard');
 const p=place();
 const worryItem=WORRIES[band(wiz.grade)].find(w=>w[0]===wiz.worry);
 const goalItem=GOALS.find(g=>g[0]===wiz.goal);

 // 로드맵
 let roadHtml='';
 if(p.start){
  const rows=buildRoad(p.start);
  roadHtml=`<div class="road">${rows.map(r=>`<div class="stage ${r.now?'now':''}">
   <div class="nm"><span class="swatch" style="background:${r.L.color}"></span>${r.L.full}</div>
   <div class="meta">${r.when}${r.L.months?' · '+r.L.months+'개월':''} · 예상 ${r.grade}</div>
  </div>`).join('')}</div>
  <div class="note">기간은 평균 진도 기준이에요. 시작 시점·집중도에 따라 달라집니다. <b>정확한 배치는 레벨 테스트로 확정</b>합니다.</div>`;
 }else if(p.testFirst){
  roadHtml=`<div style="background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:14px 16px;font-size:.93rem">
   <b>레벨 테스트</b>로 정확한 출발선을 먼저 잡을게요.<br>현재 학년 기준 예상 배치 범위: <b>${p.range}</b></div>`;
 }

 // AI 답변 또는 폴백
 const answerHtml=aiText
  ?`<div class="aiAnswer">${aiText.replace(/\*\*(.*?)\*\*/g,'<b>$1</b>').replace(/\n/g,'<br>')}</div>`
  :`<div class="aiAnswer">학부모님, 고민을 나눠주셔서 감사해요. <b>${worryItem?worryItem[1]:''}</b>에 대한 걱정, 충분히 공감됩니다.<br><br>뮤엠 영어는 ${wiz.grade} 자녀분께 <b>${p.label}</b>을 추천드립니다. 직접 방문 상담을 통해 더 자세한 안내를 드릴게요.</div>`;

 c.innerHTML=`
  <div class="resHero">
   <div class="resKicker">${wiz.grade} 맞춤 진단 결과</div>
   <div class="resTitle">${p.label}</div>
   <div class="resTagrow">
    ${worryItem?`<span class="restag">${worryItem[2]}</span>`:''}
    ${goalItem?`<span class="restag">${goalItem[1]}</span>`:''}
   </div>
  </div>
  <div class="resBody">
   <div class="sechead"><span class="dot"></span>원장 맞춤 답변</div>
   ${answerHtml}

   <div class="sechead"><span class="dot"></span>예상 학습 로드맵</div>
   ${roadHtml}

   <div style="display:flex;gap:9px;flex-wrap:wrap;margin-top:22px">
    <button class="btn primary" onclick="scrollToForm()">📞 상담 신청하기</button>
    <button class="btn" onclick="goTab('demo')">🎯 수업 맛보기</button>
    <button class="btn ghost" onclick="wizReset()">↩ 다시 진단하기</button>
   </div>
  </div>
  ${inquiryFormHtml()}`;
}

function buildKakaoText(){
 const name   = (document.getElementById('fName')?.value||'').trim();
 const phone  = (document.getElementById('fPhone')?.value||'').trim();
 const child  = (document.getElementById('fChild')?.value||'').trim();
 const method = document.getElementById('fMethod')?.value||'';
 const time   = (document.getElementById('fTime')?.value||'').trim();
 const note   = (document.getElementById('fNote')?.value||'').trim();
 const worryItem = WORRIES[band(wiz.grade)].find(w=>w[0]===wiz.worry);
 const goalItem  = GOALS.find(g=>g[0]===wiz.goal);
 const p = place();
 return `[${ACADEMY.name} 상담 신청]

📋 진단 결과
・자녀 학년: ${wiz.grade||'미입력'}
・주요 걱정: ${worryItem?worryItem[1]:''}
・목표: ${goalItem?goalItem[1]:''}
・추천 시작: ${p.label}

👤 신청 정보
・학부모: ${name||'미입력'}
・연락처: ${phone||'미입력'}
・자녀: ${child||'미입력'}
・상담 방법: ${method}
${time?'・원하는 시간: '+time:''}
${note?'・문의: '+note:''}`.trim();
}

function openKakaoLink(){
 if(ACADEMY.kakaoUrl) window.open(ACADEMY.kakaoUrl,'_blank');
}

async function sendViaKakao(){
 const name  = (document.getElementById('fName')?.value||'').trim();
 const phone = (document.getElementById('fPhone')?.value||'').trim();
 if(!name||!phone){toast('성함과 연락처는 필수예요');return;}
 if(!ACADEMY.kakaoUrl){
  toast('⚠️ 코드 상단 ACADEMY.kakaoUrl에 카카오 링크를 설정해 주세요');
  return;
 }

async function submitInquiry(){
 const name    = (document.getElementById('fName')?.value||'').trim();
 const phone   = (document.getElementById('fPhone')?.value||'').trim();
 const child   = (document.getElementById('fChild')?.value||'').trim();
 const method  = document.getElementById('fMethod')?.value||'';
 const time    = (document.getElementById('fTime')?.value||'').trim();
 const note    = (document.getElementById('fNote')?.value||'').trim();
 if(!name||!phone){toast('성함과 연락처는 필수예요');return;}

 // Formspree ID 확인
 if(!ACADEMY.formspreeId||ACADEMY.formspreeId==='YOUR_FORM_ID'){
  toast('⚠️ formspreeId를 설정해야 전송됩니다. 코드 상단 ACADEMY.formspreeId를 확인해 주세요.');
  return;
 }

 const worryItem = WORRIES[band(wiz.grade)].find(w=>w[0]===wiz.worry);
 const goalItem  = GOALS.find(g=>g[0]===wiz.goal);
 const p = place();

 // 제출 버튼 비활성화
 const btn = document.querySelector('#inquiryForm .btn.primary.big');
 if(btn){btn.disabled=true;btn.textContent='전송 중…';}

 try{
  const res = await fetch('https://formspree.io/f/'+ACADEMY.formspreeId, {
   method:'POST',
   headers:{'Content-Type':'application/json','Accept':'application/json'},
   body: JSON.stringify({
    '학부모 성함':  name,
    '연락처':        phone,
    '자녀 이름':    child||'(미입력)',
    '상담 방법':    method,
    '원하는 시간':  time||'(미입력)',
    '추가 문의':    note||'(없음)',
    '─── 진단 결과 ───': '─',
    '자녀 학년':    wiz.grade,
    '영어 경험':    wiz.exp==='new'?'처음 시작':wiz.exp==='other'?'타 학원 경험':'재원생',
    '주요 걱정':    worryItem?worryItem[1]:'',
    '목표':          goalItem?goalItem[1]:'',
    '추천 시작':    p.label,
   })
  });

  if(res.ok){
   document.getElementById('inquiryForm').innerHTML=`
    <div class="submitted">
     <div class="big-emoji">✅</div>
     <h3>상담 신청이 완료됐어요!</h3>
     <p>${name}님, 신청해 주셔서 감사합니다.<br>
     <b>${ACADEMY.name}</b>에서 빠른 시일 내에 연락드릴게요.<br><br>
     ${ACADEMY.phone?`📞 <b>${ACADEMY.phone}</b><br>`:''}
     ${ACADEMY.address?`📍 ${ACADEMY.address}`:''}
     </p>
    </div>`;
  }else{
   const data=await res.json().catch(()=>({}));
   throw new Error(data.error||'서버 오류');
  }
 }catch(e){
  if(btn){btn.disabled=false;btn.textContent='상담 신청 완료';}
  toast('전송 실패: '+e.message+' | 직접 연락: '+ACADEMY.phone);
 }
}

function speak(t){
 if(!('speechSynthesis'in window)){toast('이 브라우저는 음성 재생을 지원하지 않아요');return;}
 window.speechSynthesis.cancel();
 const u=new SpeechSynthesisUtterance(t);u.lang='en-US';u.rate=.82;
 const vs=window.speechSynthesis.getVoices();
 const en=vs.find(v=>/en-US/i.test(v.lang))||vs.find(v=>/^en/i.test(v.lang));
 if(en)u.voice=en; window.speechSynthesis.speak(u);
}

  const ch=it.c.map(c=>`<button class="choice" onclick="ans(this,${c[1]},'fb-${kind}-${i}')">${c[0]}</button>`).join('');
  return `<div class="card qcard"><div class="qn"><span class="idx">${i+1}</span>${it.q}</div><div class="choices">${ch}</div><div class="fb" id="fb-${kind}-${i}">${it.e}</div></div>`;
 }).join('');
 return `<button class="btn ghost" style="margin-bottom:12px" onclick="backDemo()">← 목록으로</button>

}

function ans(btn,correct,fbId){
 const box=btn.parentElement;
 [...box.children].forEach(b=>b.style.pointerEvents='none');
 if(correct){btn.classList.add('right');}
 else{btn.classList.add('wrong');[...box.children].forEach(b=>{if(b.onclick&&/,1,/.test(b.getAttribute('onclick')))b.classList.add('right');});}
 const fb=document.getElementById(fbId);fb.classList.add('show');fb.classList.add(correct?'ok':'no');
}

 window.scrollTo({top:0,behavior:'smooth'});
}
