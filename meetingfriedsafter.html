footer{text-align:center;color:var(--sub);font-size:.77rem;margin-top:34px}

/* ================= 엔진 ================= */
const TABS=[{id:'vocab',ic:'🔤',label:'단어'},{id:'grammar',ic:'🗺️',label:'핵심문법'},{id:'write',ic:'✍️',label:'거꾸로 영작'},{id:'sum',ic:'🏁',label:'종합'}];
let curTab='vocab';
// 상태
const vState=VOCAB.map(()=>({done:false,ok:false}));
const gState=GRAMMAR.map(g=>g.cp.map(()=>({done:false,ok:false})));
const wState=SENT.map(()=>({graded:false,best:0,mastered:false}));

let voice=null;
function pickVoice(){const vs=speechSynthesis.getVoices();voice=vs.find(v=>v.lang==='en-US'&&/female|samantha|aria|zira|jenny/i.test(v.name))||vs.find(v=>v.lang==='en-US')||vs.find(v=>v.lang.startsWith('en'))||null;}
if('speechSynthesis' in window){pickVoice();speechSynthesis.onvoiceschanged=pickVoice;}
function speak(t,btn){if(!('speechSynthesis' in window)){alert('Chrome 권장');return;}speechSynthesis.cancel();document.querySelectorAll('.playing').forEach(b=>b.classList.remove('playing'));const u=new SpeechSynthesisUtterance(t);u.lang='en-US';if(voice)u.voice=voice;u.rate=0.9;if(btn){btn.classList.add('playing');u.onend=u.onerror=()=>btn.classList.remove('playing');}speechSynthesis.speak(u);}
function spk(t){return `<button class="spk" onclick="speak(this.dataset.s,this)" data-s="${String(t).replace(/"/g,'&quot;')}">🔊</button>`;}
function normW(w){return w.toLowerCase().replace(/[.,!?;:"'\u2019\u201c\u201d]/g,'');}
function firstLetters(s){return s.split(/\s+/).map(w=>{let o='';for(let i=0;i<w.length;i++){o+=i===0?w[i]:(/[A-Za-z0-9]/.test(w[i])?'_':w[i]);}return o;}).join(' ');}
function renderEn(s){return s.replace(/\[\[(.+?)\]\]/g,'<span class="hl">$1</span>');}
function plain(s){return s.replace(/\[\[|\]\]/g,'');}
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');clearTimeout(window._tt);window._tt=setTimeout(()=>t.classList.remove('show'),1900);}
function toggleHint(id,btn){const el=document.getElementById(id);const open=el.classList.toggle('show');if(btn)btn.classList.toggle('on',open);}

function renderTabs(){
  const vp=Math.round(vState.filter(x=>x.ok).length/VOCAB.length*100);
  const gAll=gState.flat();const gp=gAll.length?Math.round(gAll.filter(x=>x.ok).length/gAll.length*100):0;
  const wp=Math.round(wState.filter(x=>x.mastered).length/SENT.length*100);
  const prog={vocab:vState.some(x=>x.done)?vp+'%':'',grammar:gAll.some(x=>x.done)?gp+'%':'',write:wState.some(x=>x.graded)?wp+'%':'',sum:''};
  document.getElementById('tabrow').innerHTML=TABS.map(t=>`<button class="tab ${t.id===curTab?'cur':''}" onclick="goTab('${t.id}')"><span class="ic">${t.ic}</span>${t.label}${prog[t.id]?`<span class="badge">${prog[t.id]}</span>`:''}</button>`).join('');
}
function goTab(id){curTab=id;document.querySelectorAll('.view').forEach(v=>v.classList.toggle('show',v.id==='view-'+id));renderTabs();window.scrollTo({top:0});if(id==='sum')renderSummary();}

/* ---- 단어 ---- */
function renderVocab(){
  const TAG={match:'의미',syn:'유의어',ant:'반의어',spell:'철자'};
  let html=`<h2 class="vtitle">🔤 단어 시험</h2><p class="vsub">의미 매칭 · 유의어 · 반의어 · 철자 — ${VOCAB.length}문항. 보기를 누르거나 철자를 입력하세요.</p>`;
  VOCAB.forEach((q,i)=>{
    let inner='';
    if(q.type==='spell'){
      inner=`<div class="qtext">우리말 뜻: <b>${q.ko}</b> &nbsp;<span class="hintb" id="vh-${i}" style="display:none"></span></div>
        <div class="spellrow"><input id="vin-${i}" type="text" placeholder="영어 철자 입력..." autocomplete="off" spellcheck="false" onkeydown="if(event.key==='Enter')gradeVocab(${i})">
        <button onclick="gradeVocab(${i})">채점</button></div>
        <button class="hbtn" style="margin-top:6px" onclick="document.getElementById('vh-${i}').style.display='inline';document.getElementById('vh-${i}').textContent=firstLettersOf(${i})">🔤 첫 글자 힌트</button>`;
    } else {
      inner=`<div class="qtext"><span class="big">${q.q}</span> ${q.type==='match'?'의 뜻은?':q.type==='syn'?'의 유의어는?':'의 반의어는?'}</div>
        <div class="opts">${q.opts.map((o,k)=>`<button class="opt" id="vo-${i}-${k}" onclick="pickVocab(${i},${k})">${k+1}. ${o}</button>`).join('')}</div>`;
    }
    html+=`<div class="card"><div class="q" id="vq-${i}"><div class="qno"><span class="qtag ${q.type}">${TAG[q.type]}</span> 문항 ${i+1} / ${VOCAB.length}</div>${inner}<div class="fb" id="vfb-${i}"></div></div></div>`;
  });
  return `<section class="view ${curTab==='vocab'?'show':''}" id="view-vocab">${html}</section>`;
}
function firstLettersOf(i){return firstLetters(VOCAB[i].en);}
function pickVocab(i,k){const q=VOCAB[i];if(vState[i].done)return;vState[i].done=true;vState[i].ok=(k===q.ans);
  q.opts.forEach((_,j)=>{const el=document.getElementById(`vo-${i}-${j}`);el.disabled=true;if(j===q.ans)el.classList.add('right');else if(j===k)el.classList.add('wrong');});
  const fb=document.getElementById(`vfb-${i}`);fb.className='fb show '+(vState[i].ok?'good':'bad');fb.innerHTML=(vState[i].ok?'✅ 정답! ':'❌ 오답. ')+q.ex;renderTabs();}
function gradeVocab(i){const q=VOCAB[i];const val=(document.getElementById(`vin-${i}`).value||'').trim();if(!val){toast('철자를 입력하세요');return;}
  vState[i].done=true;vState[i].ok=(normW(val)===normW(q.en));
  const fb=document.getElementById(`vfb-${i}`);fb.className='fb show '+(vState[i].ok?'good':'bad');
  fb.innerHTML=(vState[i].ok?'✅ 정답! ':`❌ 정답: <b>${q.en}</b> `)+q.ex;
  document.getElementById(`vin-${i}`).disabled=true;renderTabs();}

/* ---- 문법 ---- */
function renderGrammar(){
  let html=`<h2 class="vtitle">🗺️ 핵심문법 지도</h2><p class="vsub">로직 트리로 한눈에! 감각동사·동명사를 지도처럼 따라가며 익히고, 체크포인트로 확인하세요.</p>`;
  GRAMMAR.forEach((g,gi)=>{
    const ex=g.ex.map(e=>`<div class="exline"><div class="ex"><div class="e">${renderEn(e.en)}</div><div class="k">${e.ko} · ${e.note}</div></div>${spk(plain(e.en))}</div>`).join('');
    const cp=g.cp.map((c,ci)=>`<div class="q" id="gq-${gi}-${ci}"><div class="qno">체크포인트 ${ci+1}</div><div class="qtext">${c.q}</div>
      <div class="opts">${c.opts.map((o,k)=>`<button class="opt" id="go-${gi}-${ci}-${k}" onclick="pickCp(${gi},${ci},${k})">${k+1}. ${o}</button>`).join('')}</div>
      <div class="fb" id="gfb-${gi}-${ci}"></div></div>`).join('');
    html+=`<div class="gmap"><h3>${g.icon} ${g.title}</h3><div class="gi">${g.intro}</div>
      ${g.tree}${ex}
      <div class="diffb"><div class="dh">⭐ 헷갈림 포인트</div>${g.diff}</div>
      <div class="cp"><div class="cph">📝 체크포인트</div>${cp}</div></div>`;
  });
  return `<section class="view ${curTab==='grammar'?'show':''}" id="view-grammar">${html}</section>`;
}
function pickCp(gi,ci,k){const c=GRAMMAR[gi].cp[ci];if(gState[gi][ci].done)return;gState[gi][ci].done=true;gState[gi][ci].ok=(k===c.ans);
  c.opts.forEach((_,j)=>{const el=document.getElementById(`go-${gi}-${ci}-${j}`);el.disabled=true;if(j===c.ans)el.classList.add('right');else if(j===k)el.classList.add('wrong');});
  const fb=document.getElementById(`gfb-${gi}-${ci}`);fb.className='fb show '+(gState[gi][ci].ok?'good':'bad');fb.innerHTML=(gState[gi][ci].ok?'✅ 정답! ':'❌ 오답. ')+c.ex;renderTabs();}

/* ---- 거꾸로 영작 ---- */
function renderWrite(){
  let html=`<h2 class="vtitle">✍️ 거꾸로 영작</h2><p class="vsub">한글을 보고 영어 문장을 직접 써 보세요. 본문 31문장 · 단어별 채점 · 문법 포인트.</p>`;
  GRP.forEach((gr,gIdx)=>{
    html+=`<div class="wsec">${gr.ic} ${gr.t}</div>`;
    SENT.filter(s=>s.grp===gIdx).forEach(it=>{
      const i=it.n-1;
      html+=`<div class="wcard" id="wc-${i}"><div class="wn"><span class="num">${String(it.n).padStart(2,'0')}</span><span class="gtag">${it.g}</span><span class="star" id="ws-${i}"></span></div>
        <div class="wko">${it.ko}</div>
        <div class="whint"><span class="wc">단어 ${it.en.split(/\s+/).length}개</span>
          <button class="hbtn" onclick="toggleHint('wfl-${i}',this)">🔤 첫 글자</button>
          <button class="hbtn" onclick="toggleHint('wkw-${i}',this)">💡 단어</button></div>
        <div class="hintbox" id="wfl-${i}"><span class="fl">${firstLetters(it.en)}</span></div>
        <div class="hintbox" id="wkw-${i}">${it.kw.map(k=>`<span class="kw"><b>${k[0]}</b> ${k[1]}</span>`).join('')}</div>
        <div class="wrow"><input id="wi-${i}" type="text" placeholder="영어로 쓰세요..." autocomplete="off" spellcheck="false" onkeydown="if(event.key==='Enter')gradeWrite(${i})">
          <button onclick="gradeWrite(${i})">채점</button></div>
        <div class="wres" id="wr-${i}"></div></div>`;
    });
  });
  return `<section class="view ${curTab==='write'?'show':''}" id="view-write">${html}</section>`;
}
function gradeWrite(i){const it=SENT[i];const val=(document.getElementById(`wi-${i}`).value||'').trim();if(!val){toast('문장을 입력하세요');return;}
  const ans=it.en.split(/\s+/),got=val.split(/\s+/);let c=0;const toks=[];
  ans.forEach((aw,k)=>{const gw=got[k]||'';const ok=gw&&normW(gw)===normW(aw);if(ok)c++;toks.push(`<span class="tok ${ok?'ok':(gw?'no':'miss')}">${gw||aw}</span>`);});
  const pct=Math.round(c/ans.length*100);const st=wState[i];st.graded=true;st.best=Math.max(st.best,pct);if(pct===100)st.mastered=true;
  const r=document.getElementById(`wr-${i}`);r.className='wres show';
  r.innerHTML=`<div class="tokens">${toks.join(' ')}</div>
    <div class="scoreline"><span class="scorepct" style="color:${pct===100?'var(--ok)':pct>=60?'var(--b)':'var(--bad)'}">${pct===100?'🎉 100%':pct+'%'}</span>
      <span style="font-size:.83rem;color:var(--sub)">${c}/${ans.length} 단어</span>${spk(it.en)}</div>
    <div class="model">정답: ${it.en}</div><div class="gnote"><b>문법</b> · ${it.g}</div>`;
  document.getElementById(`ws-${i}`).textContent=st.mastered?'⭐':`${st.best}%`;
  document.getElementById(`wc-${i}`).classList.toggle('mastered',st.mastered);renderTabs();}

/* ---- 종합 ---- */
function renderSummary(){
  const host=document.getElementById('sumBody');if(!host)return;
  const vDone=vState.filter(x=>x.done).length,vOk=vState.filter(x=>x.ok).length;
  const gAll=gState.flat(),gDone=gAll.filter(x=>x.done).length,gOk=gAll.filter(x=>x.ok).length;
  const wGraded=wState.filter(x=>x.graded).length,wMast=wState.filter(x=>x.mastered).length;
  const vp=Math.round(vOk/VOCAB.length*100),gp=Math.round(gOk/gAll.length*100),wp=Math.round(wMast/SENT.length*100);
  const overall=Math.round((vp+gp+wp)/3);
  const grade=overall>=90?['🥇 완벽해요!','단어·문법·영작 모두 탄탄합니다.']:overall>=75?['🥈 잘했어요','조금만 더 복습하면 완성!']:overall>=60?['🥉 좋아요','약한 부분을 다시 공부해요.']:['🌱 한 번 더!','각 탭을 다시 풀어보세요.'];
  const bar=(lab,p,col,extra)=>`<div class="barrow"><div class="bl"><span>${lab}</span><span>${extra} · ${p}%</span></div><div class="tk"><div class="fl2" data-w="${p}%" style="background:${col}"></div></div></div>`;
  // 오답/미완성 모음
  const vWrong=VOCAB.filter((q,i)=>vState[i].done&&!vState[i].ok).length;
  const wLeft=SENT.filter((s,i)=>wState[i].graded&&!wState[i].mastered).length;
  host.innerHTML=`<div class="sumcard">
    <div class="sumtotal"><div class="big">${overall}%</div><div class="g">${grade[0]}</div><p style="font-size:.9rem;color:var(--sub);margin-top:4px">${grade[1]}</p></div>
    ${bar('🔤 단어',vp,'var(--e)',`${vOk}/${VOCAB.length} 정답 (푼 문항 ${vDone})`)}
    ${bar('🗺️ 핵심문법',gp,'var(--root)',`${gOk}/${gAll.length} 체크포인트`)}
    ${bar('✍️ 거꾸로 영작',wp,'var(--c)',`${wMast}/${SENT.length} 문장 마스터`)}
  </div>
  ${(vWrong||wLeft)?`<div class="review-box"><div class="rh"><span class="pb">🔁 복습 추천</span>아직 완성 못한 부분</div>
    <p style="font-size:.88rem;color:#6a5408">${vWrong?`· 단어 오답 <b>${vWrong}</b>문항 → [🔤 단어] 탭에서 확인<br>`:''}${wLeft?`· 영작 미완성 <b>${wLeft}</b>문장 → [✍️ 거꾸로 영작] 탭에서 100%까지 도전`:''}</p></div>`
   :(vDone&&wGraded?`<div class="empty-review">🎉 모든 영역을 완성했어요! 정말 잘했어요.</div>`:`<div class="review-box"><div class="rh"><span class="pb">진행 중</span>아직 안 푼 항목이 있어요</div><p style="font-size:.88rem;color:#6a5408">각 탭(단어·문법·영작)을 모두 풀면 종합 점수가 완성됩니다.</p></div>`)}`;
  requestAnimationFrame(()=>setTimeout(()=>host.querySelectorAll('.fl2').forEach(f=>f.style.width=f.dataset.w),60));
}

/* ---- 빌드 ---- */
function renderAll(){
  document.getElementById('main').innerHTML=renderVocab()+renderGrammar()+renderWrite()
    +`<section class="view ${curTab==='sum'?'show':''}" id="view-sum"><h2 class="vtitle">🏁 종합 결과</h2><p class="vsub">단어·문법·영작 세 영역의 성취를 한눈에 확인하세요.</p><div id="sumBody"></div></section>`;
  renderTabs();
}
renderAll();
</script>
