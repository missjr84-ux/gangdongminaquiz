<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Amazing Korea 거꾸로 영작</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;800;900&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f7f5fc; --paper:#ffffff; --ink:#2a2440; --sub:#6f6790;
  --lav:#6a57cc; --lav2:#a597e6; --soft:#efebfb; --line:#ddd6f3;
  --ok:#1d8a5c; --okbg:#e7f6ee; --bad:#c7364a; --badbg:#fdeef0; --miss:#a19cb2;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Nunito','Noto Sans KR',system-ui,sans-serif;font-size:17px;line-height:1.65;padding-bottom:120px}
.wrap{max-width:760px;margin:0 auto;padding:0 18px}
button{font-family:inherit}
:focus-visible{outline:3px solid var(--lav2);outline-offset:2px}

/* header: 글자 위주, 색 채움 없음 */
.hd{padding:30px 0 6px}
.brand{font-size:14px;font-weight:800;color:var(--lav);letter-spacing:.02em}
.hd h1{margin:4px 0 2px;font-size:28px;line-height:1.25;font-weight:900}
.hd p{margin:0;color:var(--sub);font-size:15px}

/* 스토리 레일 */
.rail{padding:4px 0 6px}
.pill{border:1.5px solid var(--line);background:var(--paper);color:var(--sub);border-radius:999px;padding:6px 14px;font-size:14px;font-weight:800;cursor:pointer;min-height:38px}
.pill.cur{border-color:var(--lav);color:var(--lav)}
.pill.done{color:var(--ok);border-color:#bfe3cf}
.pill:disabled{opacity:.4;cursor:default}

/* 단계 탭 */
.tabs{display:flex;gap:4px;border-bottom:1.5px solid var(--line);margin:14px 0 18px}
.tab{flex:1;background:none;border:0;border-bottom:3px solid transparent;margin-bottom:-1.5px;padding:12px 4px;font-size:15.5px;font-weight:800;color:var(--sub);cursor:pointer;min-height:48px}
.tab.on{color:var(--lav);border-bottom-color:var(--lav)}
.tab:disabled{opacity:.35;cursor:default}

h2{font-size:22px;margin:0 0 12px;font-weight:900;line-height:1.35}
h3{font-size:18px;margin:26px 0 10px;font-weight:900}
.gist{border-left:4px solid var(--lav2);padding:2px 0 2px 14px;margin:0 0 20px;font-size:16.5px}
.gist b{color:var(--lav)}

.flow{list-style:none;margin:0 0 22px;padding:0}
.flow li{display:grid;grid-template-columns:44px auto 1fr;gap:10px;align-items:baseline;padding:10px 0;border-bottom:1px dashed var(--line)}
.no{font-size:13px;color:var(--sub);font-weight:800}
.badge{justify-self:start;font-size:12.5px;font-weight:800;color:var(--lav);background:var(--soft);border-radius:6px;padding:2px 8px;white-space:nowrap}

.btn{min-height:48px;padding:0 18px;border-radius:12px;border:1.5px solid var(--lav);background:var(--paper);color:var(--lav);font-size:15.5px;font-weight:800;cursor:pointer}
.btn.pri{background:var(--lav);color:#fff}
.btn.sm{min-height:44px;font-size:14.5px;padding:0 14px}
.btn:disabled{opacity:.35;cursor:default}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.center{text-align:center;margin:22px 0}

/* ② 어순 */
.lead{color:var(--sub);font-size:15px;margin:0 0 16px}
.ord{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:18px;margin:0 0 18px}
.ord.ok{border-color:#bfe3cf}
.oq{margin:0;font-size:13.5px;font-weight:800;color:var(--sub)}
.oko{margin:4px 0 10px;font-size:18px;font-weight:700}
.chunks{list-style:none;margin:0 0 14px;padding:0}
.chunks li{display:flex;gap:12px;align-items:center;padding:6px 0}
.cn{flex:none;width:32px;height:32px;border-radius:50%;border:1.5px solid var(--lav);color:var(--lav);display:inline-flex;align-items:center;justify-content:center;font-weight:900;font-size:15px}
.cn.f{background:var(--lav);color:#fff}
.cko{font-size:17px;font-weight:500}
.role{font-size:12.5px;color:var(--sub);border:1px solid var(--line);border-radius:6px;padding:1px 7px;white-space:nowrap}
.slots{display:flex;flex-wrap:wrap;gap:8px;margin:4px 0 12px;min-height:48px}
.slot{width:46px;height:46px;border:2px dashed var(--line);border-radius:10px;display:inline-flex;align-items:center;justify-content:center;font-weight:900;font-size:20px;color:var(--lav)}
.slot.f{border-style:solid;border-color:var(--lav);background:var(--soft)}
.pad{display:flex;flex-wrap:wrap;gap:10px;margin:0 0 12px}
.pad button{width:52px;height:52px;border-radius:12px;border:1.5px solid var(--line);background:var(--paper);font-size:22px;font-weight:900;color:var(--ink);cursor:pointer}
.pad button:disabled{opacity:.25;cursor:default}
.msg{margin:10px 0 0;font-size:15px;font-weight:700}
.msg.bad{color:var(--bad)}
.eng{list-style:none;margin:6px 0 12px;padding:0}
.eng li{display:flex;gap:12px;align-items:center;padding:5px 0;font-size:18px;font-weight:700}
.diffcard{border:1.5px solid var(--lav2);border-radius:12px;padding:10px 14px;margin:8px 0 10px}
.dl{font-size:13px;font-weight:800;color:var(--lav)}
.diffcard p{margin:2px 0 0}
.diffcard b{color:var(--lav)}
.tts{display:inline-flex;gap:6px;margin-left:6px;vertical-align:middle}
.tts button{min-height:40px;min-width:44px;border-radius:10px;border:1.5px solid var(--line);background:var(--paper);font-size:17px;cursor:pointer}

/* ③ 영작 */
.wr{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:16px 18px;margin:0 0 16px}
.wr.pass{border-color:#bfe3cf}
.wr.wrong{border-color:#f0c2ca}
.wtop{display:flex;justify-content:space-between;align-items:center;gap:8px}
.st{font-size:12.5px;font-weight:800;border-radius:6px;padding:2px 8px}
.st.ok{color:var(--ok);background:var(--okbg)}
.st.re{color:#8a5a00;background:#fff4dc}
.st.bad{color:var(--bad);background:var(--badbg)}
.wko{font-size:18px;font-weight:700;margin:4px 0 8px}
.keys{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:0 0 10px}
.kl{font-size:12.5px;font-weight:800;color:var(--sub);margin-right:2px}
.kc{border:1px dashed var(--lav2);background:var(--paper);color:var(--ink);border-radius:8px;padding:5px 10px;font-size:14px;cursor:pointer;min-height:36px;text-align:left}
.kc.open{border-style:solid;background:var(--soft)}
.kc b{color:var(--lav)}
.hint{font-family:'Nunito',monospace;letter-spacing:.06em;color:var(--lav);font-weight:800;margin:0 0 8px;font-size:16px;word-break:break-word}
.inp{width:100%;height:52px;font-size:18px;border:1.5px solid var(--line);border-radius:12px;padding:0 14px;font-family:'Nunito',sans-serif;color:var(--ink);background:#fff}
.inp:focus{outline:none;border-color:var(--lav)}
.inp[readonly]{background:var(--okbg);border-color:#bfe3cf}
.wbtns{display:flex;gap:8px;justify-content:flex-end;margin-top:10px}
.res{margin-top:12px;padding-top:10px;border-top:1px dashed var(--line)}
.rl{margin:0;font-size:12.5px;font-weight:800;color:var(--sub)}
.dw{margin:2px 0 8px;font-size:17px;line-height:1.9}
.t-ok{color:var(--ok);font-weight:800}
.t-bad{color:var(--bad);text-decoration:line-through}
.t-miss{color:var(--miss);font-weight:800}
.ans{font-size:17px;font-weight:800;color:var(--ink)}
.res .ans{margin:2px 0 0}
.rn{margin:6px 0 0;font-size:14px;color:var(--bad);font-weight:700}
.passline{margin-top:10px;display:flex;flex-wrap:wrap;align-items:center;gap:4px}
.empty{text-align:center;color:var(--sub);padding:30px 0}

/* 하단 고정 바 */
.bar{position:fixed;left:0;right:0;bottom:0;background:rgba(255,255,255,.97);border-top:1px solid var(--line);padding:10px 0 calc(10px + env(safe-area-inset-bottom))}
.bar.hide{display:none}
.bar .wrap{display:flex;gap:8px;align-items:center}
.cnt{margin-left:auto;margin-right:4px;font-weight:800;color:var(--sub);white-space:nowrap}
.cnt b{color:var(--lav);font-size:19px}

/* 완주 */
.fin p{margin:0 0 10px}
.ktab{width:100%;border-collapse:collapse;font-size:15px}
.ktab td{padding:8px 6px;border-bottom:1px dashed var(--line);vertical-align:top}
.ktab td:first-child{font-weight:800;color:var(--lav);white-space:nowrap}
.ktab td.n{color:var(--sub);font-size:13px;white-space:nowrap}
@media (max-width:520px){
  .hd h1{font-size:24px}
  .flow li{grid-template-columns:40px 1fr}
  .flow li .fko{grid-column:1 / -1}
  .bar .btn{padding:0 10px;font-size:14px}
  .ktab td:first-child{white-space:normal}
}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
.pill.big{border-style:dashed}
.pill.big.cur{border-style:solid}
.peek{margin-left:6px;border:1px solid var(--line);background:var(--paper);color:var(--sub);border-radius:8px;padding:2px 10px;font-size:13px;font-weight:800;min-height:32px;cursor:pointer;vertical-align:middle}
.peekbox{border:1.5px dashed var(--lav2);border-radius:12px;padding:8px 12px;margin:0 0 10px}
.peekbox .ans{margin:0}
.peekbox .rn{color:var(--sub)}
.wr.compact{padding:12px 16px;margin-bottom:10px}
.wr.compact .wko{font-size:17px}
.smap{list-style:none;margin:0 0 20px;padding:0;border-left:3px solid var(--line)}
.smap li{display:grid;grid-template-columns:28px 1fr auto;gap:8px;align-items:baseline;padding:5px 0 5px 12px;font-size:15px}
.smap li b{color:var(--lav)}
.smap li.done{color:var(--ok)}
.smap .sc{font-size:13px;color:var(--sub);font-weight:800}
.sgroup{margin:0 0 8px}
.sgroup h3{margin:22px 0 10px;font-size:17px}
.storypara{background:var(--paper);border:1px solid #bfe3cf;border-radius:16px;padding:14px 18px;margin:0 0 12px}
.storypara p{margin:0 0 6px;font-size:17px;line-height:1.8}
.sech{margin:30px 0 12px;padding-bottom:6px;border-bottom:1.5px solid var(--line);color:var(--lav)}
.exq{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:16px 18px;margin:0 0 14px}
.exq.pass{border-color:#bfe3cf}
.exq.wrong{border-color:#f0c2ca}
.qq{margin:4px 0 8px;font-size:17px;font-weight:700}
.qq b{color:var(--bad)}
.ctx{margin:0 0 12px;padding:8px 12px;border-left:3px solid var(--lav2);font-size:17px;background:#fbfaff}
.ctx u,.ch u{text-decoration-thickness:2px;text-underline-offset:3px}
.chs{display:flex;flex-direction:column;gap:8px}
.ch{display:flex;gap:10px;align-items:flex-start;text-align:left;border:1.5px solid var(--line);background:var(--paper);border-radius:12px;padding:11px 14px;font-size:16px;min-height:48px;cursor:pointer;color:var(--ink)}
.ch .cir{color:var(--lav);font-weight:900}
.ch.sel{border-color:var(--lav);background:var(--soft)}
.ch.right{border-color:var(--ok);background:var(--okbg)}
.ch.wrongc{border-color:var(--bad);background:var(--badbg)}
.ch:disabled{cursor:default;opacity:1}
.given{margin:0 0 8px;font-size:16px}
.oitems{list-style:none;margin:0 0 12px;padding:0}
.oitems li{padding:5px 0;font-size:16px}
.oitems b{color:var(--lav);margin-right:4px}
.slot.wide{width:62px}
.pad button.wide{width:66px;font-size:18px}
.aline{min-height:52px;border:1.5px dashed var(--line);border-radius:12px;padding:10px 12px;margin:0 0 10px;font-size:18px;font-weight:700}
.aline .ph{color:var(--miss);font-weight:500;font-size:15px}
.wchips{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 10px}
.wchips button{min-height:48px;padding:0 16px;border-radius:12px;border:1.5px solid var(--line);background:var(--paper);font-size:17px;font-weight:800;font-family:'Nunito',sans-serif;color:var(--ink);cursor:pointer}
.wchips button:disabled{opacity:.25;cursor:default}
.cond{margin:-4px 0 8px;font-size:14px;color:var(--lav);font-weight:800}
.exp{margin-top:12px;padding-top:10px;border-top:1px dashed var(--line);font-size:15.5px}
.exp p{margin:0 0 4px}
.chunks li.hascj{background:linear-gradient(90deg,var(--soft),transparent 70%);border-radius:10px}
.cjb{font-size:12.5px;font-weight:800;color:#fff;background:var(--lav);border-radius:6px;padding:2px 8px;white-space:nowrap}
.cjnote{border:1.5px dashed var(--lav2);border-radius:12px;padding:10px 14px;margin:0 0 14px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.cjnote .rn{flex-basis:100%;margin:2px 0 0;color:var(--sub)}
.eng .cjw{font-style:normal;color:var(--lav);background:var(--soft);border-radius:6px;padding:1px 6px}
.railhead{margin:16px 0 8px;font-size:13.5px;color:var(--sub);font-weight:700}
.pills{display:flex;flex-wrap:wrap;gap:8px}
.pn{font-size:12.5px;color:var(--sub);font-weight:800}
.pill.cur .pn{color:var(--lav)}
.conflow{border:1.5px solid var(--line);border-radius:14px;padding:12px 16px;margin:0 0 20px}
.cchain{margin:6px 0 10px;font-size:18px;font-weight:800;color:var(--lav);display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.carrow{color:var(--miss);font-weight:700}
.clist{list-style:none;margin:0;padding:0;font-size:15px}
.clist li{padding:3px 0}
.clist b{color:var(--lav);margin-right:2px}
.links{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:0 0 10px}
.lc{border:1px solid var(--lav2);border-radius:8px;padding:4px 10px;font-size:14px;background:var(--soft)}
.lc b{color:var(--lav);font-size:15px}
.chs.tight{margin:0 0 12px}
.ptag{font-size:12.5px;font-weight:800;color:var(--lav);background:var(--soft);border-radius:6px;padding:1px 7px;margin-right:2px}
.blankline{display:inline-block;min-width:180px;border-bottom:2px solid var(--lav2);color:var(--lav);font-weight:800;text-align:center;padding:0 6px}
.conntext{line-height:2.4}
.cinp{width:112px;height:38px;font-size:16px;font-weight:700;font-family:'Nunito',sans-serif;color:var(--lav);text-align:center;border:0;border-bottom:2px solid var(--lav2);background:transparent;padding:0 2px;vertical-align:baseline}
.cinp:focus{outline:none;border-bottom-color:var(--lav);background:var(--soft)}
.cinp.ok{color:var(--ok);border-bottom-color:var(--ok)}
.cinp.bad{color:var(--bad);border-bottom-color:var(--bad)}
.cinp.rev{background:var(--soft)}
.pmark{display:inline-block;min-width:110px;border-bottom:2px solid var(--lav2);color:var(--lav);font-weight:900;text-align:center}
.pw{text-decoration-thickness:2px;text-underline-offset:3px;font-weight:800;color:var(--lav)}
.pnum{color:var(--lav);font-weight:900;margin-left:1px}
.spara{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:14px 18px;margin:0 0 12px}
.spara.used{border-color:var(--lav);background:#fbfaff}
.spara p{margin:4px 0 6px;font-size:16.5px;line-height:1.85}
.plab{font-size:16px;font-weight:900;color:var(--lav)}
.cblank{display:inline-block;min-width:74px;border-bottom:2px solid var(--lav2);vertical-align:baseline}
.storypara.fill{background:#fbfaff}
.storypara.fill p{line-height:2.5}
.slot.sok{border-color:var(--ok);background:var(--okbg);color:var(--ok)}
.slot.sbad{border-color:var(--bad);background:var(--badbg);color:var(--bad)}
.st.bad{color:var(--bad);background:var(--badbg)}
.ansord{counter-reset:none}
.ansord li{display:flex;gap:8px;align-items:baseline;padding:4px 0}
.ansord .cn{flex:none;width:24px;height:24px;font-size:13px}
.cwhy{color:var(--sub);font-size:14px}
.ansord .rn{margin:0;font-size:13.5px}

.peekbtn.on{background:var(--soft);border-color:var(--lav)}
.peekbox .passline{margin:0}
.olead{margin:0 0 10px;font-size:14.5px;color:var(--sub)}
.cjmark{color:var(--lav);font-weight:900}
.ochips{gap:10px}
.ochips button{display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:8px 14px;min-height:56px;text-align:left;line-height:1.35}
.ochips button b{font-size:17px;font-weight:800;color:var(--ink)}
.ochips button .cko{font-size:12.5px;color:var(--sub);font-weight:600}
.aline .aw{margin-right:2px}
.cslot{display:inline-block;min-width:76px;text-align:center;border-bottom:2px solid var(--lav2);color:var(--lav);font-weight:800;padding:0 4px}
.cslot.ok{color:var(--ok);border-bottom-color:var(--ok)}
.cslot.bad{color:var(--bad);border-bottom-color:var(--bad)}
.eng li .cko{font-size:13px;color:var(--sub);font-weight:600;margin-left:4px}
</style>
</head>
<body>
<header class="hd wrap">
  <div class="brand">준티 잉글리쉬</div>
  <h1>Amazing Korea 거꾸로 영작</h1>
  <p>능률(김기택) 중1 Lesson 06 Amazing Korea 본문</p>
</header>
<nav class="wrap rail" id="rail" aria-label="문단"></nav>
<main class="wrap" id="app"></main>
<div class="bar hide" id="bar"><div class="wrap" id="barIn"></div></div>

<script>
/* ============================================================
   DATA START — 새 본문을 만들 때 여기서 DATA END 까지만 바꾼다.
   아래 엔진 코드는 한 글자도 건드리지 않는다.
   BOOK = 교재 원문(번호별). check.js 가 PARAS 와 대조한다.
   이 샘플은 예시다. 전부 지우고 새 본문으로 채운다.
   ============================================================ */
/* ── 교재 원문 ── */
const BOOK={
1:"Reporter: Today is October 9, a special day for Hangeul, the Korean alphabet.",
2:"I'm at a Hangeul festival now.",
3:"People are enjoying fun activities here.",
4:"They look happy and excited.",
5:"I'm going to interview three Hangeul lovers.",
6:"Here is my first question.",
7:"Why do you like Hangeul?",
8:"Pueng: I like Hangeul because it is easy to learn.",
9:"I learned the 24 letters of Hangeul, and I am able to read any Korean word now.",
10:"Anna: The shapes of Hangeul look unique and beautiful.",
11:"I like the Korean word for Switzerland, “스위스[seu-wi-seu].”",
12:"It looks like a soldier between two mountains.",
13:"It looks great!",
14:"William: I like Hangeul because its history is amazing.",
15:"A long time ago, most Koreans couldn't read or write.",
16:"King Sejong felt bad about this, so he created a new alphabet for his people.",
17:"Reporter: You all really love Hangeul!",
18:"How did you start learning it?",
19:"Pueng: I'm a big fan of K-pop songs.",
20:"Because I wanted to sing Korean songs, I started learning Hangeul.",
21:"Now I can sing many K-pop songs!",
22:"Anna: I was interested in using Hangeul in my designs.",
23:"So I studied the shapes of Hangeul.",
24:"I can make unique patterns for clothes with Hangeul.",
25:"William: I wanted to teach the science of Hangeul to my students.",
26:"Some letters look like the shape of the mouth and tongue for their sounds.",
27:"King Sejong made it that way.",
28:"It's very scientific.",
29:"Reporter: Thank you for sharing your stories.",
30:"Enjoy this festival!"
};

/* ── 본문 ── */
const PARAS=[
{
  tag:"축제",
  title:"한글날, 축제 현장에서",
  gist:"기자가 <b>10월 9일 한글날</b> 축제 현장에서 방송을 시작한다. 날짜와 장소를 말하고 → 사람들의 모습을 전하고 → <b>세 명을 인터뷰하겠다</b>는 계획으로 이어진다.",
  flow:[
    {no:"1", fn:"날짜 소개", ko:"오늘은 한글을 위한 특별한 날인 10월 9일이다."},
    {no:"2", fn:"장소", ko:"지금 한글 축제에 와 있다."},
    {no:"3", fn:"현장 모습", ko:"사람들이 재미있는 활동을 즐기고 있다."},
    {no:"4", fn:"인상", ko:"사람들이 행복하고 신나 보인다."},
    {no:"5", fn:"계획", ko:"한글 애호가 세 명을 인터뷰할 것이다."}
  ],
  order:[
    { ko:"오늘은 한국의 문자인 한글을 위한 특별한 날인 10월 9일입니다.",

function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function norm(s){
  return String(s).toLowerCase()
    .replace(/[\u2018\u2019]/g,"'")
    .replace(/[^a-z0-9'\-\s]/gi,' ')
    .replace(/\s+/g,' ').trim();
}
function toks(s){const n=norm(s);return n?n.split(' '):[];}
function sameToks(a,b){const x=toks(a),y=toks(b);return x.length===y.length&&x.every((t,k)=>t===y[k]);}
function showQ(s){
  const o=(s.match(/\u201C/g)||[]).length,c=(s.match(/\u201D/g)||[]).length;
  if(o>c)return s+'\u201D';
  if(c>o)return '\u201C'+s;
  return s;
}
function hintOf(en){
  return en.replace(/[\u201C\u201D"]/g,'').split(/\s+/).filter(Boolean).map(w=>{
    let first=true;
    return w.replace(/[A-Za-z0-9]/g,ch=>{if(first){first=false;return ch;}return '_';});
  }).join(' ');
}
function lcsDiff(u,a){
  const n=u.length,m=a.length;
  const L=Array.from({length:n+1},()=>new Array(m+1).fill(0));
  for(let i=n-1;i>=0;i--)for(let j=m-1;j>=0;j--)
    L[i][j]=u[i]===a[j]?L[i+1][j+1]+1:Math.max(L[i+1][j],L[i][j+1]);
  const out=[];let i=0,j=0;
  while(i<n&&j<m){
    if(u[i]===a[j]){out.push({t:'ok',w:u[i]});i++;j++;}
    else if(L[i+1][j]>=L[i][j+1]){out.push({t:'bad',w:u[i]});i++;}
    else{out.push({t:'miss',w:a[j]});j++;}
  }
  while(i<n)out.push({t:'bad',w:u[i++]});
  while(j<m)out.push({t:'miss',w:a[j++]});
  return out;
}

let voice=null,actx=null,unlocked=false;
const VOICE_FIRST=/\bWilliam\b/i;   /* 지정 목소리: William. 없으면 기본 미국 영어로 대체 */
const hasTTS=typeof window!=='undefined'&&'speechSynthesis' in window&&typeof SpeechSynthesisUtterance!=='undefined';
function enVoices(){
  if(!hasTTS)return [];
  let vs=[];
  try{vs=speechSynthesis.getVoices()||[];}catch(e){return [];}
  return vs.filter(v=>/^en([-_]|$)/i.test(v.lang||''));
}
function pickVoice(){
  if(!hasTTS)return;
  const vs=enVoices();
  if(!vs.length){voice=null;return;}
  const will=vs.find(v=>VOICE_FIRST.test(v.name||''));
  if(will){voice=will;return;}
  const us=vs.filter(v=>/^en[-_]US/i.test(v.lang||''));
  const pool=us.length?us:vs;
  const rank=v=>{
    const n=v.name||'';let s=0;
    if(/Google US English/i.test(n))s+=30;
    else if(/Samantha|Aria|Jenny|Ava|Zira/i.test(n))s+=20;
    if(/Natural|Neural|Enhanced|Premium/i.test(n))s+=10;
    if(/Compact|eSpeak|Espeak/i.test(n))s-=15;
    return s;
  };
  voice=pool.slice().sort((a,b)=>rank(b)-rank(a))[0];
}
if(hasTTS){
  pickVoice();
  try{speechSynthesis.onvoiceschanged=pickVoice;}catch(e){}
  setTimeout(pickVoice,400);
}
function speak(t,slow){
  if(!hasTTS)return;
  try{
    speechSynthesis.cancel();
    if(!voice)pickVoice();
    const u=new SpeechSynthesisUtterance(String(t).replace(/[\u201C\u201D"]/g,''));
    if(voice){u.voice=voice;u.lang=voice.lang||'en-US';}else u.lang='en-US';
    u.rate=slow?0.6:0.88;
    speechSynthesis.speak(u);
  }catch(e){}
}
function getCtx(){
  if(actx)return actx;

  try{actx=new C();}catch(e){actx=null;}
  return actx;
}
function unlock(){
  if(unlocked)return;unlocked=true;
  if(hasTTS){try{const u=new SpeechSynthesisUtterance(' ');u.volume=0;speechSynthesis.speak(u);}catch(e){}pickVoice();}
  const c=getCtx();if(c&&c.state==='suspended'){try{c.resume();}catch(e){}}
}
document.addEventListener('touchstart',unlock,{once:true,passive:true});

function pageTurn(){
  const c=getCtx();if(!c)return;
  try{
    const d=0.24,n=Math.floor(c.sampleRate*d),b=c.createBuffer(1,n,c.sampleRate),a=b.getChannelData(0);
    for(let i=0;i<n;i++){const t=i/n;a[i]=(Math.random()*2-1)*Math.pow(1-t,2)*Math.min(1,t*8);}
    const s=c.createBufferSource();s.buffer=b;
    const f=c.createBiquadFilter();f.type='bandpass';f.Q.value=0.9;
    f.frequency.setValueAtTime(1500,c.currentTime);f.frequency.exponentialRampToValueAtTime(4800,c.currentTime+d);
    const g=c.createGain();g.gain.value=0.35;
    s.connect(f);f.connect(g);g.connect(c.destination);s.start();
  }catch(e){}
}

    g.gain.exponentialRampToValueAtTime(0.16,t0+0.012);
    g.gain.exponentialRampToValueAtTime(0.0001,t0+0.11);
    o.connect(g);g.connect(c.destination);o.start(t0);o.stop(t0+0.12);
  }catch(e){}
}

/* ---- ② 어순: 영어 조각 + 연결어 빈칸 ---- */
const CONN_POOL=(()=>{
  const o=[];
  PARAS.forEach(P=>P.write.forEach(x=>(x.link||[]).forEach(l=>{if(!o.some(y=>y.toLowerCase()===l.en.toLowerCase()))o.push(l.en)})));
  ['and','but','so','because','when','or','Then','First','Next','Finally','Actually'].forEach(w=>{if(!o.some(y=>y.toLowerCase()===w.toLowerCase()))o.push(w)});
  return o;
})();
function ordView(p,i){
  const o=PARAS[p].order[i],out=[];
  o.seq.forEach((cn,pos)=>{
    const c=o.chunks[cn-1],en=o.eng[pos];
    let text=en,cj=null;
    if(c.cj){
      const w=c.cj.w,re=new RegExp('(^|\\W)'+w.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'(\\W|$)');
      const m=re.exec(en);
      if(m){const at=m.index+m[1].length;text=en.slice(0,at)+'\u25A2'+en.slice(at+w.length);}
      cj={w:w,why:c.cj.why};
    }
    out.push({cn:cn,pos:pos,en:en,ko:c.ko,role:c.role,text:text,cj:cj});
  });
  return out;
}
function ordBlanks(p,i){return ordView(p,i).filter(v=>v.cj);}
function ordChips(p,i){                      /* 고정 규칙으로 섞는다 (정답 순서와 다르게) */
  const v=ordView(p,i),n=v.length,out=[];
  for(let k=n-1;k>=0;k-=2)out.push(v[k]);
  for(let k=(n%2?1:0);k<n;k+=2)out.push(v[k]);
  return out;
}
function cjOptions(word){
  const cap=/^[A-Z]/.test(word);
  const fix=w=>cap?w.charAt(0).toUpperCase()+w.slice(1):w.toLowerCase();
  const out=[word];
  CONN_POOL.forEach(w=>{
    if(out.length>=4)return;
    const f=fix(w);
    if(!out.some(y=>y.toLowerCase()===f.toLowerCase()))out.push(f);
  });
  const key=word.length;                      /* 문항마다 같은 자리에 정답이 오지 않게 */
  return out.slice(0,4).sort((a,b)=>((a.length*7+key)%5)-((b.length*7+key)%5));
}

/* ---- 전체 이야기: 문단 순서 → 연결어 채우기 ---- */
function reEsc(x){return String(x).replace(/[.*+?^${}()|[\]\\]/g,'\\$&');}
const STORY_SEGS=PARAS.map((P,p)=>{
  const out=[];let bi=0;
  P.write.forEach(it=>{
    let parts=[{t:'text',v:it.en}];
    (it.link||[]).forEach(l=>{
      for(let i=0;i<parts.length;i++){
        if(parts[i].t!=='text')continue;
        const m=new RegExp('(^|[^A-Za-z])('+reEsc(l.en)+')($|[^A-Za-z])').exec(parts[i].v);
        if(!m)continue;
        const at=m.index+m[1].length;
        const before=parts[i].v.slice(0,at),after=parts[i].v.slice(at+l.en.length);
        parts.splice(i,1,{t:'text',v:before},{t:'blank',a:l.en,why:l.why},{t:'text',v:after});
        break;
      }
    });
    parts.forEach(x=>{
      if(x.t==='text'){if(x.v)out.push(x);}
      else out.push({t:'blank',k:bi++,a:x.a,why:x.why});
    });
    out.push({t:'text',v:' '});
  });
  return out;
});
const CONN_BANK=(()=>{const o=[];STORY_SEGS.forEach(sg=>sg.forEach(x=>{if(x.t==='blank'&&!o.some(y=>y.toLowerCase()===x.a.toLowerCase()))o.push(x.a);}));return o.sort((a,b)=>a.toLowerCase()<b.toLowerCase()?-1:1);})();
const STORY_NB=STORY_SEGS.reduce((a,sg)=>a+sg.filter(x=>x.t==='blank').length,0);
function sKey(p,k){return p+'-'+k;}
function storyFilled(){let n=0;STORY_SEGS.forEach((sg,p)=>sg.forEach(x=>{if(x.t==='blank'&&norm(S.story.vals[sKey(p,x.k)]||'')===norm(x.a))n++;}));return n;}
function paraHTML(p,mode){
  return STORY_SEGS[p].map(x=>{
    if(x.t==='text')return esc(x.v);
    if(mode==='full')return `<b class="cjw">${esc(x.a)}</b>`;

  }).join('');
}

}

function storyStep1(){
  const st=S.story,n=PARAS.length;
  let h='';
  if(st.ordered){
    h+=`<p class="lead">순서를 맞췄어요. 이야기 순서대로 놓인 본문이에요. 연결어는 <b>② 연결어 넣기</b>에서 채워요.</p>`;
    h+=PARAS.map((P,p)=>`<section class="sgroup"><h3>${p+1}. ${esc(P.tag)} — ${esc(P.title)}</h3><div class="storypara"><p>${paraHTML(p,'hide')}</p></div></section>`).join('');
    return h;
  }

    h+=`<div class="row"><button class="btn sm pri" data-act="sRetry" id="sRetry">다시 놓기</button><button class="btn sm" data-act="sStep" data-s="2">연결어 먼저 하기</button></div>`;
  }

  return h;
}
function storyStep2(){
  const st=S.story;
  let h=`<p class="lead">문단마다 빈칸에 <b>연결어</b>를 쓰고 그 문단만 채점하세요. 모르겠으면 그 빈칸을 <b>두 번</b> 누르면 답이 나와요.</p>`;
  h+=`<div class="keys"><span class="kl">쓰이는 연결어</span>`+CONN_BANK.map(wd=>`<span class="lc">${esc(wd)}</span>`).join('')+`</div>`;
  h+=PARAS.map((P,p)=>{
    const c=storyParaCount(p),ok=c.n===c.N;
    let b=`<section class="sgroup" id="sg-${p}"><div class="wtop"><h3>${p+1}. ${esc(P.tag)} — ${esc(P.title)}</h3><span class="st ${ok?'ok':''}">${c.n}/${c.N}</span></div>`;
    if(ok){
      b+=`<div class="storypara"><p>${paraHTML(p,'full')}</p><div class="passline"><span class="rl">문단 듣기</span>${ttsBtns(paraText(p))}</div></div>`;
    }else{
      b+=`<div class="storypara fill"><p class="conntext">${paraHTML(p,'fill')}</p><div class="wbtns"><button class="btn sm pri" data-act="sGradeP" data-p="${p}">이 문단 채점</button></div>`;
      if(st.pmsg&&st.pmsg.p===p)b+=`<p class="msg bad">${esc(st.pmsg.t)}</p>`;
      if(st.ashown[p]){
        const bl=STORY_SEGS[p].filter(x=>x.t==='blank');
        b+=`<div class="exp"><p class="rl">정답 순서</p><ol class="clist ansord">`+bl.map((x,i)=>{
          const mine=String(st.vals[sKey(p,x.k)]||'').trim(),right=norm(mine)===norm(x.a);
          return `<li><span class="cn ${right?'f':''}">${i+1}</span><b>${esc(x.a)}</b> <span class="cwhy">${esc(x.why)}</span>${mine&&!right?` <span class="rn">내 답: ${esc(mine)}</span>`:''}</li>`;
        }).join('')+`</ol><p class="rn">정답을 보고 빈칸에 직접 써서 다시 채점하세요.</p></div>`;
      }
      b+=`</div>`;
    }
    return b+`</section>`;
  }).join('');
  if(storyAllOk())h+=`<p class="empty">연결어를 모두 채웠어요. 아래 ‘실전 문제로’를 누르세요.</p>`;
  return h;
}
function storyGradeP(p){
  const st=S.story;let bad=0,empty=0;
  STORY_SEGS[p].forEach(x=>{
    if(x.t!=='blank')return;
    const key=sKey(p,x.k),v=String(st.vals[key]||'').trim();
    if(!v){st.marks[key]=null;empty++;return;}
    const ok=norm(v)===norm(x.a);
    st.marks[key]=ok?'ok':'bad';
    if(!ok)bad++;
  });
  if(empty){st.pmsg={p:p,t:`빈칸 ${empty}개가 비어 있어요. 아래 정답을 보고 채워 보세요.`};st.ashown[p]=true;}
  else if(bad){st.tries++;st.pmsg={p:p,t:`빨간 칸 ${bad}개를 고쳐서 다시 채점하세요.`};st.ashown[p]=true;}
  else{st.pmsg=null;pageTurn();}
}
function storyGradeAll(){
  let touched=false;
  PARAS.forEach((_,p)=>{
    if(storyParaOk(p))return;
    const has=STORY_SEGS[p].some(x=>x.t==='blank'&&String(S.story.vals[sKey(p,x.k)]||'').trim());
    if(has){storyGradeP(p);touched=true;}
  });
  if(!touched)S.story.pmsg={p:-1,t:'먼저 빈칸을 채우세요.'};
}
function storyReveal(key){
  const st=S.story;if(st.done)return;
  const [p,k]=key.split('-').map(Number);
  const b=STORY_SEGS[p].find(x=>x.t==='blank'&&x.k===k);
  if(!b)return;
  st.vals[key]=b.a;st.rev[key]=true;st.marks[key]='ok';S.story.pmsg=null;render();
}

function exHTML(q){
  const x=xs(q.id),graded=x.status==='ok'||x.status==='bad';
  let badge='';
  if(x.status==='ok')badge=x.first?'<span class="st ok">정답</span>':'<span class="st re">다시 풀어 정답</span>';
  else if(x.status==='bad')badge='<span class="st bad">오답</span>';
  let h=`<div class="exq ${x.status==='ok'?'pass':''} ${x.status==='bad'?'wrong':''}" id="q-${q.id}"><div class="wtop"><span class="no">${q.id}</span>${badge}</div><p class="qq">${q.q}</p>`;
  if(q.ctx)h+=`<p class="ctx">${q.ctx}</p>`;
  if(q.type==='mc'){
    h+=`<div class="chs">`+q.choices.map((c,k)=>{
      let cls='';
      if(x.sel===k)cls+=' sel';
      if(graded&&k===q.ans&&x.status==='ok')cls+=' right';
      if(x.status==='bad'&&k===x.sel)cls+=' wrongc';
      return `<button class="ch${cls}" data-act="exSel" data-id="${q.id}" data-k="${k}" ${graded?'disabled':''}><span class="cir">${CIR[k]}</span><span>${c}</span></button>`;
    }).join('')+`</div>`;
  }else if(q.type==='order'){
    h+=`<p class="given"><span class="rl">주어진 문장</span><br>${esc(q.given)}</p><ol class="oitems">`+q.items.map((t,k)=>`<li><b>${LAB[k]}</b> ${esc(t)}</li>`).join('')+`</ol>`;
    h+=`<div class="slots">`+q.items.map((_,k)=>`<span class="slot wide ${x.pick[k]!=null?'f':''}">${x.pick[k]!=null?LAB[x.pick[k]]:''}</span>`).join('')+`</div>`;
    if(!graded){
      h+=`<div class="pad">`+q.items.map((_,k)=>`<button class="wide" data-act="exPick" data-id="${q.id}" data-k="${k}" ${x.pick.includes(k)?'disabled':''}>${LAB[k]}</button>`).join('')+`</div>`;
      h+=`<div class="row"><button class="btn sm" data-act="exUndo" data-id="${q.id}">하나 지우기</button><button class="btn sm" data-act="exClear" data-id="${q.id}">전체 지우기</button></div>`;
    }
  }else if(q.type==='arrange'){
    h+=`<p class="wko">${esc(q.ko)}</p>`;
    h+=`<div class="aline">${x.pick.length?x.pick.map(k=>`<span class="aw">${esc(q.words[k])}</span>`).join(' '):'<span class="ph">단어를 순서대로 누르세요</span>'}</div>`;
    if(!graded){
      h+=`<div class="wchips">`+q.words.map((w,k)=>`<button data-act="exPick" data-id="${q.id}" data-k="${k}" ${x.pick.includes(k)?'disabled':''}>${esc(w)}</button>`).join('')+`</div>`;
      h+=`<div class="row"><button class="btn sm" data-act="exUndo" data-id="${q.id}">하나 지우기</button><button class="btn sm" data-act="exClear" data-id="${q.id}">전체 지우기</button></div>`;
    }
  }else if(q.type==='write'){
    h+=`<p class="wko">${esc(q.ko)}</p><p class="cond">조건: ${esc(q.cond)}</p>`;
    h+=`<input class="inp" data-k="x:${q.id}" type="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="done" placeholder="영어로 써 보세요" value="${esc(x.val)}" ${x.status==='ok'?'readonly':''} aria-label="${q.id} 영작">`;
  }
  if(x.status!=='ok'&&!(x.status==='bad'&&q.type!=='write'))h+=`<div class="wbtns"><button class="btn sm pri" data-act="exGrade" data-id="${q.id}">채점</button></div>`;
  if(x.status==='empty')h+=`<p class="msg bad">${q.type==='mc'?'답을 먼저 고르세요.':q.type==='write'?'먼저 영작을 입력하세요.':'끝까지 골라 주세요.'}</p>`;
  if(graded){
    let ansTxt='';
    if(x.status==='bad'){
      if(q.type==='mc')ansTxt=`정답 ${CIR[q.ans]} ${q.choices[q.ans]}`;
      else if(q.type==='order')ansTxt='정답 '+q.ans.map(k=>LAB[k]).join(' - ');
      else if(q.type==='arrange')ansTxt='정답 '+esc(q.ans);
      else ansTxt='정답 '+q.ans.map(esc).join(' / ');
    }
    h+=`<div class="exp">`;
    if(x.status==='bad'&&q.type==='write'&&x.diff)h+=`<p class="rl">내 답</p><p class="dw">${diffHTML(x.diff)}</p>`;
    if(ansTxt)h+=`<p class="ans">${ansTxt}</p>`;
    h+=`<p>${q.exp}</p></div>`;
    if(x.status==='bad'&&q.type!=='write')h+=`<div class="wbtns"><button class="btn sm pri" data-act="exRetry" data-id="${q.id}">다시 풀기</button></div>`;
    if(x.status==='bad'&&q.type==='write')h+=`<p class="rn">고쳐 쓴 뒤 다시 채점하세요.</p>`;
  }
  return h+`</div>`;
}

function fnBadge(x){
  if(x.status==='ok')return x.first?'<span class="st ok">통과</span>':(x.rev&&Object.keys(x.rev).length?'<span class="st re">답 보고 통과</span>':'<span class="st re">다시 풀어 통과</span>');
  if(x.status==='bad')return '<span class="st bad">다시</span>';
  return '';
}

function segs(text){return String(text).split(/\[\[(\w+)\]\]/);}

function fnHTML(q){
  const x=fsx(q.id),done=x.status==='ok';
  let h=`<div class="exq ${done?'pass':''} ${x.status==='bad'?'wrong':''}" id="f-${q.id}"><div class="wtop"><span class="no">${esc(q.id)}${q.who?' · '+esc(q.who):''}</span>${fnBadge(x)}</div><p class="qq">${q.q}</p>`;

  if(q.kind==='short'){
    h+=`<div class="keys"><span class="kl">꼭 들어갈 말</span>`+q.must.map(g=>`<span class="lc">${esc(g[0])}</span>`).join('')+`</div>`;
    h+=`<input class="inp" data-k="f:${q.id}" type="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="done" placeholder="영어 문장으로 답하세요" value="${esc(x.val)}" ${done?'readonly':''} aria-label="${esc(q.id)} 서술형">`;
    if(x.status==='bad'&&x.marks)h+=`<p class="msg bad">빠진 말: ${x.marks.map(t=>esc(t)).join(', ')}</p>`;
  }

  if(q.kind==='paraorder'){
    h+=`<ol class="oitems">`+q.items.map((t,k)=>`<li><b>${LAB8[k]}</b> ${done?`<span class="ptag">${esc(t.tag)}</span> `:''}${esc(t.s)}</li>`).join('')+`</ol>`;
    h+=`<div class="slots">`+q.items.map((_,k)=>`<span class="slot wide ${x.pick[k]!=null?'f':''}">${x.pick[k]!=null?LAB8[x.pick[k]]:''}</span>`).join('')+`</div>`;
    if(!done&&x.status!=='bad'){
      h+=`<div class="pad">`+q.items.map((_,k)=>`<button class="wide" data-act="fPick" data-id="${q.id}" data-k="${k}" ${x.pick.includes(k)?'disabled':''}>${LAB8[k]}</button>`).join('')+`</div>`;
      h+=`<div class="row"><button class="btn sm" data-act="fUndo" data-id="${q.id}">하나 지우기</button><button class="btn sm" data-act="fClear" data-id="${q.id}">전체 지우기</button></div>`;
    }
  }

  if(q.kind==='pick'){
    const parts=q.text.split('[[BLANK]]');
    h+=`<p class="ctx">${esc(parts[0])}<span class="blankline">${done?esc(q.choices[q.ans]):'________________'}</span>${esc(parts[1]||'')}</p>`;
    h+=`<div class="chs">`+q.choices.map((c,k)=>{
      let cls='';
      if(x.sel===k)cls+=' sel';
      if(done&&k===q.ans)cls+=' right';
      if(x.status==='bad'&&k===x.sel)cls+=' wrongc';
      return `<button class="ch${cls}" data-act="fSel" data-id="${q.id}" data-k="${k}" ${done||x.status==='bad'?'disabled':''}><span class="cir">${CIR[k]}</span><span>${esc(c)}</span></button>`;
    }).join('')+`</div>`;
  }

  if(q.kind==='conn'){
    const sp=segs(q.text);
    let body='';
    sp.forEach((t,i)=>{
      if(i%2===0){body+=esc(t);return;}
      const bi=+t-1,v=x.vals[bi]||'',mk=x.marks?x.marks[bi]:null;
      body+=`<input class="cinp ${mk==='ok'?'ok':''} ${mk==='bad'?'bad':''} ${x.rev[bi]?'rev':''}" data-b="${bi}" data-id="${q.id}" type="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" value="${esc(v)}" ${done?'readonly':''} aria-label="${bi+1}번 빈칸">`;
    });
    h+=`<p class="ctx conntext">${body}</p>`;
    if(x.status==='bad')h+=`<p class="msg bad">빨간 칸을 고쳐서 다시 채점하세요. 모르겠으면 그 칸을 두 번 누르세요.</p>`;
    if(done)h+=`<ul class="clist">`+q.blanks.map((b,k)=>`<li><b>${esc(b.a)}</b> ${esc(b.exp)}${x.rev[k]?' <span class="rn">(답 보기)</span>':''}</li>`).join('')+`</ul>`;
  }

  if(q.kind==='pron'){
    const sp=segs(q.text);
    let body='';
    sp.forEach((t,i)=>{
      if(i%2===0){body+=esc(t);return;}
      const bi=+t-1,b=q.blanks[bi];body+=`<u class="pw">${esc(b.w)}</u><sup class="pnum">${esc(b.label)}</sup>`;
    });
    h+=`<p class="ctx">${body}</p>`;
    q.blanks.forEach((b,bi)=>{
      const sel=x.bs[bi],mk=x.marks?x.marks[bi]:null;
      h+=`<p class="rl">${esc(b.label)} <b>${esc(b.w)}</b>이(가) 가리키는 것</p><div class="chs tight">`+b.choices.map((c,k)=>{
        let cls='';
        if(sel===k)cls+=' sel';
        if(done&&k===b.ans)cls+=' right';
        if(mk==='bad'&&k===sel)cls+=' wrongc';
        return `<button class="ch${cls}" data-act="fSel" data-id="${q.id}" data-b="${bi}" data-k="${k}" ${done?'disabled':''}><span class="cir">${CIR[k]}</span><span>${esc(c)}</span></button>`;
      }).join('')+`</div>`;
    });
    if(x.status==='bad')h+=`<p class="msg bad">빨간 것을 다시 골라 채점하세요.</p>`;
  }

  if(!done)h+=`<div class="wbtns">${x.status==='bad'&&(q.kind==='pick'||q.kind==='paraorder')?`<button class="btn sm pri" data-act="fRetry" data-id="${q.id}">다시 풀기</button>`:`<button class="btn sm pri" data-act="fGrade" data-id="${q.id}">채점</button>`}</div>`;
  if(x.status==='empty')h+=`<p class="msg bad">${q.kind==='short'?'먼저 문장을 쓰세요.':q.kind==='conn'?'빈칸을 모두 채우세요.':'답을 고르세요.'}</p>`;

  if(done||x.status==='bad'){
    let ansTxt='';
    if(q.kind==='short')ansTxt='모범답안: '+q.model;
    else if(q.kind==='paraorder'&&x.status==='bad')ansTxt='정답 '+q.ans.map(k=>LAB8[k]).join(' - ');
    else if(q.kind==='pick'&&x.status==='bad')ansTxt='정답 '+CIR[q.ans]+' '+q.choices[q.ans];
    if(ansTxt||q.exp){
      h+=`<div class="exp">`;
      if(ansTxt)h+=`<p class="ans">${esc(ansTxt)}</p>`;
      if(q.exp)h+=`<p>${q.exp}</p>`;
      h+=`</div>`;
    }
    if(q.kind==='pron'&&done)h+=`<div class="exp">`+q.blanks.map(b=>`<p><b>${esc(b.label)}</b> ${esc(b.choices[b.ans])} — ${esc(b.exp)}</p>`).join('')+`</div>`;
    if(done&&q.kind==='short')h+=`<div class="passline"><span class="rl">모범답안 듣기</span>${ttsBtns(q.model)}</div>`;
  }
  return h+`</div>`;
}

function fnGrade(id){
  const q=FINAL.find(z=>z.id===id),x=fsx(id);
  if(x.status==='ok')return;
  let ok=false;
  if(q.kind==='short'){
    if(!toks(x.val).length){x.status='empty';return;}
    const v=' '+norm(x.val)+' ';
    const miss=q.must.filter(g=>!g.some(a=>v.includes(' '+norm(a)+' ')||v.includes(norm(a))));
    ok=miss.length===0;x.marks=miss.map(g=>g[0]);
  }else if(q.kind==='paraorder'){
    if(x.pick.length<q.items.length){x.status='empty';return;}
    ok=x.pick.join()===q.ans.join();
  }else if(q.kind==='pick'){
    if(x.sel==null){x.status='empty';return;}
    ok=x.sel===q.ans;
  }else if(q.kind==='conn'){
    if(q.blanks.some((_,k)=>!String(x.vals[k]||'').trim())){x.status='empty';return;}
    const m=q.blanks.map((b,k)=>norm(x.vals[k])===norm(b.a)?'ok':'bad');
    x.marks=m;ok=m.every(t=>t==='ok');
  }else if(q.kind==='pron'){
    if(q.blanks.some((_,k)=>x.bs[k]==null)){x.status='empty';return;}
    const m=q.blanks.map((b,k)=>x.bs[k]===b.ans?'ok':'bad');
    x.marks=m;ok=m.every(t=>t==='ok');
  }
  if(x.first===null)x.first=ok&&!Object.keys(x.rev).length;
  x.status=ok?'ok':'bad';
  if(ok&&q.kind==='conn')q.blanks.forEach((b,k)=>{x.vals[k]=b.a;});
}
function fnReset(id){
  const q=FINAL.find(z=>z.id===id),x=fsx(id);
  x.status='';x.marks=null;
  if(q.kind==='paraorder')x.pick=[];
  if(q.kind==='pick')x.sel=null;
}
function fnReveal(id,bi){
  const q=FINAL.find(z=>z.id===id),x=fsx(id);
  if(x.status==='ok')return;
  x.vals[bi]=q.blanks[bi].a;x.rev[bi]=true;
  if(x.marks)x.marks[bi]='ok';
  render();
}

function renderBar(){
  const sh=()=>bar.classList.remove('hide');
  if(S.phase==='para'){
    if(S.P[S.p].stage!==3){bar.classList.add('hide');barIn.innerHTML='';return;}
    sh();
    const p=S.p,n=passCount('w',p),N=PARAS[p].write.length,last=p===PARAS.length-1;
    barIn.innerHTML=`<button class="btn sm" data-act="gradeAll" id="gradeAll">전체 채점</button><button class="btn sm" data-act="onlyWrong" id="onlyWrong">${S.onlyWrong?'전체 보기':'틀린 것만 다시'}</button><span class="cnt">통과 <b id="passN">${n}</b>/${N}</span><button class="btn sm pri" data-act="next" id="nextBtn" ${n===N?'':'disabled'}>${last?'전체 이야기로':'다음 문단'}</button>`;
  }else if(S.phase==='story'){
    sh();const st=S.story;
    if(st.step===1){
      barIn.innerHTML=st.ordered
        ?`<span class="cnt">문단 순서 완료</span><button class="btn sm pri" data-act="sStep" data-s="2" id="nextBtn">연결어 넣기로</button>`
        :(st.shown?`<button class="btn sm pri" data-act="sRetry">다시 놓기</button><span class="cnt">배치 <b id="passN">${st.pick.length}</b>/${PARAS.length}</span><button class="btn sm" data-act="sStep" data-s="2" id="nextBtn">연결어 넣기로</button>`
                  :`<button class="btn sm" data-act="sClear">전체 지우기</button><button class="btn sm pri" data-act="sCheck">순서 확인</button><span class="cnt">배치 <b id="passN">${st.pick.length}</b>/${PARAS.length}</span><button class="btn sm" data-act="sStep" data-s="2" id="nextBtn">연결어 넣기로</button>`);
    }else{
      const n=storyFilled();
      barIn.innerHTML=`<button class="btn sm" data-act="sGradeAll" id="sGradeAll">전체 채점</button><span class="cnt">연결어 <b id="passN">${n}</b>/${STORY_NB}</span><button class="btn sm pri" data-act="toExam" id="nextBtn" ${storyDone()?'':'disabled'}>실전 문제로</button>`;
    }
  }else if(S.phase==='exam'){
    sh();const n=examOk();
    barIn.innerHTML=`<button class="btn sm" data-act="gradeAll" id="gradeAll">전체 채점</button><button class="btn sm" data-act="onlyWrong" id="onlyWrong">${S.onlyWrong?'전체 보기':'틀린 것만 다시'}</button><span class="cnt">정답 <b id="passN">${n}</b>/${EXAM.length}</span><button class="btn sm pri" data-act="toFinal" id="nextBtn" ${n===EXAM.length?'':'disabled'}>마무리 정리로</button>`;
  }else if(S.phase==='final'){
    sh();const n=finalOk();
    barIn.innerHTML=`<button class="btn sm" data-act="gradeAll" id="gradeAll">전체 채점</button><button class="btn sm" data-act="onlyWrong" id="onlyWrong">${S.onlyWrong?'전체 보기':'틀린 것만 다시'}</button><span class="cnt">통과 <b id="passN">${n}</b>/${FINAL.length}</span><button class="btn sm pri" data-act="toFinish" id="nextBtn" ${n===FINAL.length?'':'disabled'}>완주하기</button>`;
  }else{bar.classList.add('hide');barIn.innerHTML='';}
}

function renderFinish(){
  const cnt=m=>{const a=[];PARAS.forEach((P,p)=>P.write.forEach((_,i)=>a.push(ws(m,p,i))));return a;};
  const W=cnt('w');
  const one=a=>a.filter(w=>w.status==='pass'&&!w.retried&&!w.peeked).length;
  const firstOk=EXAM.filter(q=>xs(q.id).first===true).length;
  const seen=new Set(),rows=[];
  PARAS.forEach(P=>P.write.forEach(it=>(it.keys||[]).forEach(k=>{if(!seen.has(k.en)){seen.add(k.en);rows.push({no:it.no,en:k.en,ko:k.ko});}})));
  const lrows=[];PARAS.forEach(P=>P.write.forEach(it=>(it.link||[]).forEach(l=>lrows.push({no:it.no,en:l.en,why:l.why}))));
  const wrongSecs={};EXAM.forEach(q=>{if(xs(q.id).first===false)wrongSecs[q.sec]=(wrongSecs[q.sec]||0)+1;});
  const ws2=Object.keys(wrongSecs).map(k=>`${SECS[k]} ${wrongSecs[k]}문제`).join(', ');
  app.innerHTML=`<section class="fin" id="finish"><h2>사건 해결, 본문 완주!</h2>
  <p>문단 영작: ${TOTAL}문장 중 한 번에 통과 <b>${one(W)}</b>문장</p>
  <p>전체 이야기: 문단 순서 ${S.story.shownEver?'정답을 보고 맞춤':'<b>한 번에</b> 맞춤'} · 연결어 ${STORY_NB}개 중 답 보기 <b>${Object.keys(S.story.rev).length}</b>개 · 정답을 본 문단 <b>${Object.keys(S.story.ashown).length}</b>개</p>
  <p>마무리 정리: ${FINAL.length}개 중 한 번에 통과 <b>${FINAL.filter(q=>fsx(q.id).first===true).length}</b>개</p>
  <p>실전 문제: ${EXAM.length}문제 중 첫 시도 정답 <b>${firstOk}</b>문제${ws2?` (처음에 틀린 유형: ${esc(ws2)})`:''}</p>
  <h3>완성된 본문</h3>
  ${PARAS.map((P,p)=>`<div class="storypara"><p>${esc(paraText(p))}</p><div class="passline">${ttsBtns(paraText(p))}</div></div>`).join('')}
  <h3>연결어 다시 보기</h3>
  <table class="ktab"><tbody>${lrows.map(r=>`<tr><td>${esc(r.en)}</td><td>${esc(r.why)}</td><td class="n">${esc(r.no)}</td></tr>`).join('')}</tbody></table>
  <h3>핵심표현 다시 보기</h3>
  <table class="ktab"><tbody>${rows.map(r=>`<tr><td>${esc(r.en)}</td><td>${esc(r.ko)}</td><td class="n">${esc(r.no)}</td></tr>`).join('')}</tbody></table>
  <div class="center"><button class="btn pri" data-act="restart" id="restart">처음부터 다시</button></div></section>`;
}

/* ============ ACTIONS ============ */
function grade(m,p,i){
  const w=ws(m,p,i),it=PARAS[p].write[i];
  if(w.status==='pass')return;
  if(!toks(w.val).length){w.status='empty';return;}
  if(sameToks(w.val,it.en)){
    if(w.tries>0)w.retried=true;
    w.status='pass';w.diff=null;w.peek=false;
  }else{
    w.tries++;w.status='wrong';w.peek=false;w.diff=lcsDiff(toks(w.val),toks(it.en));
  }
}
function exGrade(id){
  const q=EXAM.find(z=>z.id===id),x=xs(id);
  if(x.status==='ok')return;
  let ok;
  if(q.type==='mc'){if(x.sel==null){x.status='empty';return;}ok=x.sel===q.ans;}
  else if(q.type==='order'){if(x.pick.length<q.items.length){x.status='empty';return;}ok=x.pick.join()===q.ans.join();}
  else if(q.type==='arrange'){if(!x.pick.length){x.status='empty';return;}ok=sameToks(x.pick.map(k=>q.words[k]).join(' '),q.ans);}
  else{
    if(!toks(x.val).length){x.status='empty';return;}
    ok=q.ans.some(a=>sameToks(x.val,a));
    x.diff=ok?null:lcsDiff(toks(x.val),toks(q.ans[0]));
  }
  if(x.first===null)x.first=ok;
  if(!ok)x.tries++;
  x.status=ok?'ok':'bad';
}
function exReset(id){const x=xs(id);x.sel=null;x.pick=[];x.status='';x.diff=null;const q=EXAM.find(z=>z.id===id);if(q.type==='write')x.val='';}
function focusInp(k){const el=document.querySelector(`.inp[data-k="${k}"]`);if(el&&!el.readOnly){try{el.focus();}catch(e){}}}
function nextUnpassed(m,p,i){
  const W=PARAS[p].write;
  for(let k=i+1;k<W.length;k++)if(ws(m,p,k).status!=='pass')return `${m}:${p}-${k}`;
  if(m==='s')for(let q=p+1;q<PARAS.length;q++)for(let k=0;k<PARAS[q].write.length;k++)if(ws(m,q,k).status!=='pass')return `${m}:${q}-${k}`;
  return null;
}
function afterGrade(m,p,i){
  render();
  if(ws(m,p,i).status==='pass'){const k=nextUnpassed(m,p,i);if(k)focusInp(k);}
  else focusInp(`${m}:${p}-${i}`);
}
function goPhase(ph){
  S.phase=ph;S.onlyWrong=false;render();goTop();
}

document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b||b.disabled)return;
  const a=b.dataset.act,p=+b.dataset.p,i=+b.dataset.i,m=b.dataset.m||'w',id=b.dataset.id;
  if(a==='goPara'||a==='goPhase'||a==='stage'||a==='sStep')clickTick();
  switch(a){
    case 'goPara':
      S.phase='para';S.p=p;S.onlyWrong=false;render();goTop();break;
    case 'goPhase':goPhase(b.dataset.ph);break;
    case 'stage':{
      const s=+b.dataset.s,st=S.P[S.p];
      if(s===2&&!st.read)return;
      if(s===3&&!(st.read&&ordAllDone(S.p)))return;
      st.stage=s;S.onlyWrong=false;render();goTop();break;}
    case 'readOk':
      S.P[S.p].read=true;S.P[S.p].stage=2;render();goTop();break;
    case 'pick':{
      const st=oS(p,i),n=+b.dataset.n,len=PARAS[p].order[i].chunks.length;
      if(st.ordered||st.shown||st.pick.includes(n)||st.pick.length>=len)return;
      st.pick.push(n);st.msg='';render();break;}
    case 'undo':{const st=oS(p,i);if(st.ordered||st.shown)return;st.pick.pop();st.msg='';render();break;}
    case 'clear':{const st=oS(p,i);if(st.ordered||st.shown)return;st.pick=[];st.msg='';render();break;}
    case 'check':{
      const st=oS(p,i),o=PARAS[p].order[i],n=o.seq.length;
      if(st.pick.length<n){st.msg=`조각 ${n}개를 모두 놓아 주세요.`;render();return;}
      let k=0;while(k<n&&st.pick[k]===o.seq[k])k++;
      if(k===n){st.ordered=true;st.shown=false;st.msg='';if(!ordBlanks(p,i).length)st.done=true;}
      else{st.shown=true;st.msg=`${n}개 중 ${st.pick.filter((v,z)=>v===o.seq[z]).length}개가 제자리예요. ${k+1}번째 자리부터 달라요.`;}
      render();break;}
    case 'oretry':{const st=oS(p,i);st.pick=[];st.shown=false;st.msg='';render();break;}
    case 'ocj':{
      const st=oS(p,i),bi=+b.dataset.b;
      if(st.cjmk[bi]==='ok')return;
      st.cj[bi]=b.dataset.w;st.cjmk[bi]=null;st.cjmsg='';render();break;}
    case 'ocheck':{
      const st=oS(p,i),bl=ordBlanks(p,i);
      if(bl.some((_,k)=>!st.cj[k])){st.cjmsg='연결어를 모두 골라 주세요.';render();return;}
      let wrong=0;
      bl.forEach((v,k)=>{const ok=norm(st.cj[k])===norm(v.cj.w);st.cjmk[k]=ok?'ok':'bad';if(!ok)wrong++;});
      if(wrong){st.cjmsg=`${wrong}개가 달라요. 아래 정답을 보고 다시 골라 보세요.`;st.cjshown=true;}
      else{st.cjmsg='';st.done=true;}
      render();break;}
    case 'say':speak(b.dataset.t,!!b.dataset.slow);break;
    case 'key':{const w=ws('w',p,i),j=+b.dataset.j;w.keys[j]=!w.keys[j];render();break;}
    case 'peek':{const w=ws(m,p,i);w.peek=!w.peek;if(w.peek)w.peeked=true;render();if(!w.peek)focusInp(`${m}:${p}-${i}`);break;}
    case 'hint':ws(m,p,i).hint=true;render();focusInp(`${m}:${p}-${i}`);break;
    case 'grade':grade(m,p,i);afterGrade(m,p,i);break;
    case 'gradeAll':
      if(S.phase==='para')PARAS[S.p].write.forEach((_,k)=>grade('w',S.p,k));
      else if(S.phase==='final')FINAL.forEach(q=>{const x=fsx(q.id);if(x.status==='ok')return;if(x.status==='bad'&&(q.kind==='pick'||q.kind==='paraorder'))return;if(S.onlyWrong||x.sel!=null||x.pick.length||x.val||Object.keys(x.vals).length||Object.keys(x.bs).length)fnGrade(q.id);});
      else if(S.phase==='exam')EXAM.forEach(q=>{const x=xs(q.id);if(x.status==='bad'&&q.type!=='write')return;if(S.onlyWrong||x.sel!=null||x.pick.length||x.val||x.status)exGrade(q.id);});
      render();break;
    case 'onlyWrong':
      S.onlyWrong=!S.onlyWrong;
      if(S.onlyWrong){
        const reset=w=>{if(w.status==='wrong'||w.status==='empty'){w.val='';w.status='';w.diff=null;w.peek=false;}};
        if(S.phase==='para')PARAS[S.p].write.forEach((_,k)=>reset(ws('w',S.p,k)));
        else if(S.phase==='final')FINAL.forEach(q=>{const x=fsx(q.id);if(x.status==='ok')return;if(x.status==='bad'&&(q.kind==='pick'||q.kind==='paraorder'))return;if(S.onlyWrong||x.sel!=null||x.pick.length||x.val||Object.keys(x.vals).length||Object.keys(x.bs).length)fnGrade(q.id);});
      else if(S.phase==='exam')EXAM.forEach(q=>{const x=xs(q.id);if(x.status==='bad'||x.status==='empty')exReset(q.id);});
      }
      render();goTop();break;
    case 'next':
      if(!paraDone(S.p))return;
      S.onlyWrong=false;
      if(S.p<PARAS.length-1)S.p++;
      else S.phase='story';
      pageTurn();render();goTop();break;
    case 'sPick':{
      const st=S.story,k=+b.dataset.k;
      if(st.ordered||st.shown||st.pick.includes(k)||st.pick.length>=PARAS.length)return;
      st.pick.push(k);st.msg='';render();break;}
    case 'sUndo':S.story.pick.pop();S.story.msg='';render();break;
    case 'sRetry':{const st=S.story;st.pick=[];st.shown=false;st.omarks=null;st.msg='';render();goTop();break;}
    case 'sClear':S.story.pick=[];S.story.msg='';render();break;
    case 'sCheck':{
      const st=S.story,n=PARAS.length;
      if(st.ordered)return;
      if(st.pick.length<n){st.msg=`문단 ${n}개를 모두 놓아 주세요.`;render();return;}
      let k=0;while(k<n&&st.pick[k]===SORD[k])k++;
      if(k===n){st.ordered=true;st.shown=false;st.omarks=null;st.msg='';st.step=2;pageTurn();}
      else{
        st.tries++;st.shown=true;st.shownEver=true;
        st.omarks=st.pick.map((v,i)=>v===SORD[i]?'ok':'bad');
        const right=st.omarks.filter(m=>m==='ok').length;
        st.msg=`${n}개 중 ${right}개가 제자리예요. ${k+1}번째 자리부터 달라요.`;
      }
      render();goTop();break;}
    case 'sStep':{S.story.step=+b.dataset.s;S.story.pmsg=null;render();goTop();break;}
    case 'sGradeP':storyGradeP(p);render();break;
    case 'sGradeAll':storyGradeAll();render();break;
    case 'toExam':
      if(!storyDone())return;
      S.phase='exam';S.onlyWrong=false;pageTurn();render();goTop();break;
    case 'toFinish':
      if(finalOk()!==FINAL.length)return;
      S.phase='finish';S.onlyWrong=false;pageTurn();render();goTop();break;
    case 'exSel':{const x=xs(id);if(x.status==='ok'||x.status==='bad')return;x.sel=+b.dataset.k;x.status='';render();break;}
    case 'exPick':{
      const x=xs(id),k=+b.dataset.k,q=EXAM.find(z=>z.id===id);
      if(x.status==='ok'||x.status==='bad'||x.pick.includes(k))return;
      if(q.type==='order'&&x.pick.length>=q.items.length)return;
      x.pick.push(k);x.status='';render();break;}
    case 'exUndo':xs(id).pick.pop();xs(id).status='';render();break;
    case 'exClear':xs(id).pick=[];xs(id).status='';render();break;
    case 'exGrade':exGrade(id);render();if(xs(id).status!=='ok'){const q=EXAM.find(z=>z.id===id);if(q.type==='write')focusInp('x:'+id);}break;
    case 'exRetry':exReset(id);render();break;
    case 'fSel':{
      const x=fsx(id),q=FINAL.find(z=>z.id===id);
      if(x.status==='ok')return;
      if(q.kind==='pron'){if(x.status==='bad'&&x.marks&&x.marks[+b.dataset.b]==='ok')return;x.bs[+b.dataset.b]=+b.dataset.k;if(x.marks)x.marks[+b.dataset.b]=null;}
      else{if(x.status==='bad')return;x.sel=+b.dataset.k;}
      x.status='';render();break;}
    case 'fPick':{
      const x=fsx(id),q=FINAL.find(z=>z.id===id),k=+b.dataset.k;
      if(x.status==='ok'||x.status==='bad'||x.pick.includes(k)||x.pick.length>=q.items.length)return;
      x.pick.push(k);x.status='';render();break;}
    case 'fUndo':fsx(id).pick.pop();fsx(id).status='';render();break;
    case 'fClear':fsx(id).pick=[];fsx(id).status='';render();break;
    case 'fGrade':fnGrade(id);render();break;
    case 'fRetry':fnReset(id);render();break;
    case 'toFinal':
      if(examOk()!==EXAM.length)return;
      S.phase='final';S.onlyWrong=false;pageTurn();render();goTop();break;
    case 'restart':S=freshState();pageTurn();render();goTop();break;
  }
});
let lastTap={el:null,t:0,v:''};
document.addEventListener('click',e=>{
  const el=e.target;
  if(!el.matches||!el.matches('.cinp')||el.readOnly)return;
  const now=Date.now();
  if(lastTap.el===el&&now-lastTap.t<800&&lastTap.v===el.value){lastTap={el:null,t:0,v:''};if(el.dataset.story)storyReveal(el.dataset.story);else fnReveal(el.dataset.id,+el.dataset.b);return;}
  lastTap={el:el,t:now,v:el.value};
});
document.addEventListener('dblclick',e=>{
  const el=e.target;
  if(el.matches&&el.matches('.cinp')&&!el.readOnly){if(el.dataset.story)storyReveal(el.dataset.story);else fnReveal(el.dataset.id,+el.dataset.b);}
});
document.addEventListener('input',e=>{
  if(e.target.matches&&e.target.matches('.cinp')){
    if(e.target.dataset.story){const key=e.target.dataset.story;S.story.vals[key]=e.target.value;S.story.marks[key]=null;return;}
    const x=fsx(e.target.dataset.id),bi=+e.target.dataset.b;
    x.vals[bi]=e.target.value;if(x.marks)x.marks[bi]=null;
    return;
  }
  if(!e.target.matches||!e.target.matches('.inp'))return;
  const k=e.target.dataset.k;
  if(k.startsWith('x:')){xs(k.slice(2)).val=e.target.value;return;}
  if(k.startsWith('f:')){fsx(k.slice(2)).val=e.target.value;return;}
  const [m,rest]=k.split(':'),[p,i]=rest.split('-').map(Number);
  ws(m,p,i).val=e.target.value;
});
document.addEventListener('keydown',e=>{
  if(e.key!=='Enter'||!e.target.matches||!e.target.matches('.inp'))return;
  e.preventDefault();
  const k=e.target.dataset.k;
  if(k.startsWith('x:')){const id=k.slice(2);exGrade(id);render();if(xs(id).status!=='ok')focusInp(k);return;}
  if(k.startsWith('f:')){const id=k.slice(2);fnGrade(id);render();if(fsx(id).status!=='ok')focusInp(k);return;}
  const [m,rest]=k.split(':'),[p,i]=rest.split('-').map(Number);
  grade(m,p,i);afterGrade(m,p,i);
});

render();
