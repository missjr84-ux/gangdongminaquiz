<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>The Story of the Commons — 본문</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f5f4fa;--card:#fff;--card2:#eeecf7;
  --primary:#5b4fa8;--primary-lt:#ece9f8;--primary-dk:#3b2f8a;
  --accent:#e8a020;--accent-lt:#fef3dc;
  --text:#1a1a2e;--muted:#6b6880;--border:#d8d4ee;
  --ok:#1a7a3c;--ok-bg:#e8f5ec;--no:#c0392b;--no-bg:#fdecea;
  --info:#3a5fa8;--info-bg:#e8eef8;
  --mint:#dff5ec;--mint-t:#1d7a55;--sky:#e1effc;--sky-t:#2a64a8;
  --peach:#fde9df;--peach-t:#b5532a;--lav:#ece9f8;--lav-t:#5b4fa8;
  --r:12px;--shadow:0 2px 10px rgba(91,79,168,.10);
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:'Noto Sans KR',system-ui,sans-serif;background:var(--bg);color:var(--text);font-size:16px;line-height:1.65;-webkit-tap-highlight-color:transparent}
.en{font-family:'Noto Sans KR',system-ui,sans-serif}
header.top{background:linear-gradient(135deg,#3b2f8a,#7b6fd0);color:#fff;padding:16px 16px 0}
.top .brand{font-size:12px;opacity:.85;letter-spacing:.04em}
.top h1{font-size:21px;font-weight:800;margin:2px 0 2px}
.top .sub{font-size:13px;opacity:.9;margin-bottom:12px}
nav.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:12px;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;border:1.5px solid rgba(255,255,255,.45);background:rgba(255,255,255,.12);color:#fff;border-radius:999px;padding:7px 13px;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit;white-space:nowrap}
.tab.on{background:#fff;color:var(--primary-dk);border-color:#fff}
.tab .pg{font-size:11px;font-weight:700;margin-left:5px;opacity:.85}
main{max-width:780px;margin:0 auto;padding:16px 14px 80px}
.panel{display:none;animation:pin .25s ease}
.panel.on{display:block}
@keyframes pin{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.intro{background:var(--card);border:1px solid var(--border);border-left:4px solid var(--primary);border-radius:var(--r);padding:12px 14px;margin-bottom:14px;font-size:15px}
.intro b{color:var(--primary-dk)}
h2.sec{font-size:18px;font-weight:800;color:var(--primary-dk);margin:22px 2px 10px;display:flex;align-items:center;gap:8px}
h2.sec:first-child{margin-top:4px}
h3.sub{font-size:15.5px;font-weight:700;margin:14px 2px 8px;color:var(--primary)}
.box{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:14px;margin-bottom:12px;box-shadow:var(--shadow)}
.tip{background:var(--accent-lt);border:1px solid #f3d99a;border-radius:10px;padding:10px 12px;margin:10px 0;font-size:14.5px}
.tip b{color:#9a5b00}
.warn{background:var(--no-bg);border:1px solid #f2c4bd;border-radius:10px;padding:10px 12px;margin:10px 0;font-size:14.5px}
.warn b{color:var(--no)}
table.t{width:100%;border-collapse:collapse;font-size:14.5px;background:var(--card)}
table.t th{background:var(--primary-lt);color:var(--primary-dk);font-weight:700;padding:7px 6px;border:1px solid var(--border);text-align:left}
table.t td{padding:7px 6px;border:1px solid var(--border);vertical-align:top}
.tw{overflow-x:auto;border-radius:10px;margin-bottom:12px}
.badge{display:inline-block;font-size:11.5px;font-weight:700;border-radius:6px;padding:1px 7px;vertical-align:middle}
.b-mint{background:var(--mint);color:var(--mint-t)}.b-sky{background:var(--sky);color:var(--sky-t)}
.b-peach{background:var(--peach);color:var(--peach-t)}.b-lav{background:var(--lav);color:var(--lav-t)}
.b-amb{background:var(--accent-lt);color:#9a5b00}
.spk{border:none;background:var(--primary-lt);color:var(--primary);border-radius:8px;width:30px;height:30px;font-size:15px;cursor:pointer;flex:0 0 auto;line-height:30px;text-align:center}
.spk.playing{background:var(--primary);color:#fff}
.btn{border:1.5px solid var(--primary);background:#fff;color:var(--primary);border-radius:9px;padding:7px 13px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit}
.btn.fill{background:var(--primary);color:#fff}
.btn.sm{padding:4px 10px;font-size:13px}
.btn.ghost{border-color:var(--border);color:var(--muted)}
.btn:disabled{opacity:.45;cursor:default}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
/* word chips */
.wgrid{display:flex;flex-wrap:wrap;gap:6px}
.wchip{border:1px solid var(--border);background:var(--card);border-radius:9px;padding:5px 10px;font-size:14px;cursor:pointer}
.wchip b{color:var(--primary-dk)}
.wchip span{color:var(--muted);font-size:13px;margin-left:4px}
/* qset */
.qset{margin-bottom:18px}
.qhead{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;margin:18px 2px 10px}
.qhead h3{font-size:16.5px;font-weight:800;color:var(--primary-dk)}
.score{font-size:13px;font-weight:700;color:var(--primary);background:var(--primary-lt);border-radius:999px;padding:3px 10px}
.q{background:var(--card);border:1.5px solid var(--border);border-radius:var(--r);padding:13px 14px;margin-bottom:10px;box-shadow:var(--shadow)}
.q.ok{border-color:#8fd0a7;background:#fbfffc}
.q.no{border-color:#eba59c;background:#fffafa}
.qn{display:flex;gap:8px;align-items:flex-start;margin-bottom:8px}
.qn .num{flex:0 0 auto;background:var(--primary);color:#fff;font-weight:800;font-size:13px;border-radius:7px;min-width:26px;height:24px;line-height:24px;text-align:center;padding:0 5px;margin-top:2px}
.qn .qt{flex:1;font-weight:600;font-size:15.5px}
.qt u{text-decoration-thickness:2px;text-underline-offset:3px;text-decoration-color:var(--primary)}
.pass{background:var(--card2);border-radius:10px;padding:10px 12px;margin:6px 0 10px;font-size:15px;line-height:1.75}
.pass .ln{display:block}
.pass .sp{font-weight:800;color:var(--primary);margin-right:4px}
.pass u{text-decoration-thickness:2px;text-underline-offset:3px}
.mark{color:var(--primary);font-weight:800}
.opts{display:flex;flex-direction:column;gap:6px}
.opts.inline{flex-direction:row;flex-wrap:wrap}
.opt{text-align:left;border:1.5px solid var(--border);background:#fff;border-radius:10px;padding:8px 11px;font-size:15px;cursor:pointer;font-family:inherit;color:var(--text);line-height:1.5}
.opts.inline .opt{flex:0 0 auto}
.opt.sel{border-color:var(--primary);background:var(--primary-lt);font-weight:600}
.opt.right{border-color:var(--ok);background:var(--ok-bg)}
.opt.wrong{border-color:var(--no);background:var(--no-bg)}
.opt:disabled{cursor:default;color:var(--text)}
.blank{display:inline-block;min-width:70px;border:none;border-bottom:2px solid var(--primary);background:var(--primary-lt);border-radius:6px 6px 0 0;padding:2px 6px;margin:2px 2px;font-size:15px;font-family:inherit;color:var(--text);text-align:center}
.blank.wide{display:block;width:100%;text-align:left;margin:6px 0;padding:8px 10px;border-radius:8px;border:1.5px solid var(--border);border-bottom:2px solid var(--primary)}
.blank.right{background:var(--ok-bg);border-bottom-color:var(--ok)}
.blank.wrong{background:var(--no-bg);border-bottom-color:var(--no)}
.tmpl{font-size:15.5px;line-height:2.1}
.ordwrap{display:flex;flex-direction:column;gap:8px}
.slots{min-height:48px;border:2px dashed var(--border);border-radius:10px;padding:7px;display:flex;flex-wrap:wrap;gap:6px;background:#fcfbff}
.slots.block{flex-direction:column}
.slots .hint{color:var(--muted);font-size:13px;align-self:center;padding:4px}
.pool{display:flex;flex-wrap:wrap;gap:6px}
.pool.block{flex-direction:column}
.chip{border:1.5px solid var(--primary);background:#fff;color:var(--primary-dk);border-radius:9px;padding:6px 11px;font-size:15px;cursor:pointer;font-family:inherit;text-align:left;line-height:1.45}
.chip.used{visibility:hidden}
.slots .chip{background:var(--primary-lt)}
.chip:disabled{cursor:default}
.qfoot{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:10px}
.fb{margin-top:9px;border-radius:9px;padding:9px 11px;font-size:14.5px;display:none}
.fb.show{display:block}
.fb.ok{background:var(--ok-bg);color:#145c2e}
.fb.no{background:var(--no-bg);color:#8e2a1f}
.fb.ans{background:var(--info-bg);color:#24406f}
.fb b{font-weight:800}
.qbar{display:flex;gap:6px;flex-wrap:wrap;margin:4px 0 6px}
.sticky{position:sticky;bottom:10px;display:flex;justify-content:center;gap:8px;margin-top:6px;z-index:5}
.sticky .btn{box-shadow:0 4px 14px rgba(59,47,138,.25)}
/* analysis cards */
.acard{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:12px 13px;margin-bottom:9px;box-shadow:var(--shadow)}
.acard .kr{font-size:16px;font-weight:600}
.acard .kr .no{color:var(--primary);font-weight:800;margin-right:6px}
.chunks{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}
.ck{border:1.5px solid var(--border);border-radius:9px;padding:5px 9px;background:#fcfbff;cursor:pointer;font-size:14px;text-align:left;font-family:inherit;color:var(--text)}
.ck small{display:block;color:var(--primary);font-weight:800;font-size:11px}
.ck .ce{display:none;color:var(--primary-dk);font-weight:700}
.ck.open .ce{display:block}
.ck.open{border-color:var(--primary);background:var(--primary-lt)}
.aen{display:none;margin-top:9px;background:var(--card2);border-radius:9px;padding:8px 10px}
.aen.show{display:block}
.aen .s{font-size:16px;font-weight:700;color:var(--primary-dk)}
.aen .tp{font-size:14px;color:#6a4a00;margin-top:5px}
.parahead{background:var(--primary-lt);border-radius:10px;padding:9px 12px;margin:18px 0 9px;font-size:14.5px}
.parahead b{color:var(--primary-dk);font-size:15.5px}
/* dialogue script */
.script{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:12px 13px;margin-bottom:10px;box-shadow:var(--shadow)}
.script .shead{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px;flex-wrap:wrap}
.script .shead b{color:var(--primary-dk);font-size:15.5px}
.line{display:flex;gap:8px;align-items:flex-start;padding:5px 0;border-bottom:1px dashed #ebe8f5}
.line:last-child{border-bottom:none}
.line .who{flex:0 0 auto;min-width:24px;font-weight:800;color:var(--primary)}
.line .tx{flex:1}
.line .ko{display:none;color:var(--muted);font-size:14px}
.script.kr .line .ko{display:block}
/* tapfill */
.tf{font-size:16px;line-height:2.2}
.tfb{display:inline-block;min-width:56px;border-bottom:2px solid var(--primary);background:var(--primary-lt);border-radius:6px 6px 0 0;padding:0 7px;text-align:center;cursor:pointer;color:transparent;font-weight:700;user-select:none}
.tfb.next{animation:pulse 1.4s infinite}
.tfb.open{color:var(--primary-dk);background:#fff3c9;border-bottom-color:var(--accent);cursor:default}
.tfb.shake{animation:shake .3s}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(91,79,168,.35)}50%{box-shadow:0 0 0 5px rgba(91,79,168,0)}}
@keyframes shake{0%,100%{transform:none}25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.formula{background:var(--card);border:2px solid var(--primary);border-radius:var(--r);padding:14px;margin-bottom:12px;text-align:center;font-size:18px;font-weight:800;color:var(--primary-dk);line-height:1.8}
.formula .f{display:inline-block;border-radius:8px;padding:2px 8px;margin:2px}
.steps{counter-reset:st}
.step{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:11px 13px;margin-bottom:8px;box-shadow:var(--shadow)}
.step .h{font-weight:800;color:var(--primary-dk)}
.step .h .n{display:inline-block;background:var(--primary);color:#fff;border-radius:6px;font-size:12px;padding:1px 7px;margin-right:6px}
.foot{text-align:center;color:var(--muted);font-size:12px;margin-top:30px}
@media (max-width:480px){
  .top h1{font-size:19px}
  main{padding:12px 12px 80px}
  .opt,.chip{font-size:14.5px}
}
/* v2 additions */
.spk.mini{width:24px;height:24px;line-height:24px;font-size:12px;border-radius:6px;vertical-align:middle;margin-left:4px}
.wl .wrow{border-bottom:1px dashed #e4e0f3;padding:8px 2px}
.wl .wrow:last-child{border-bottom:none}
.wtop{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.wn{font-size:12px;color:var(--muted);min-width:20px}
.ww{font-size:16.5px;color:var(--primary-dk)}
.wm{color:var(--text);font-size:15px;border-radius:6px;padding:0 4px}
.wl.hidem .wm{background:var(--card2);color:transparent;cursor:pointer;min-width:90px;display:inline-block}
.wl.hidem .wm.on{background:#fff3c9;color:var(--text)}
.wex{margin:4px 0 0 28px}
.wen{display:flex;align-items:center;gap:6px;font-size:15px;cursor:pointer}
.wen .spk{width:26px;height:26px;line-height:26px;font-size:13px}
.wk{display:none;color:var(--muted);font-size:14px}
.wl.showk .wk,.wrow.kon .wk{display:block}
.flip .frow{border-bottom:1px dashed #e4e0f3;padding:7px 2px}
.flip .frow:last-child{border-bottom:none}
.fen{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:15.5px}
.fen .en{flex:1;min-width:180px}
.fkr{display:none;margin-top:4px;background:#fff8e6;border-radius:8px;padding:6px 9px;font-size:14.5px}
.frow.on .fkr{display:block}
.fnote{color:#8a5a00;font-size:13.5px;margin-top:2px}
.rv{background:var(--card2);color:transparent;border-radius:5px;cursor:pointer;padding:0 4px;user-select:none}
.rv.on{background:#fff3c9;color:inherit}
.fam{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.fam .fc{border:1px solid var(--border);border-radius:8px;padding:3px 8px;background:#fff;font-size:14px}
.fam .fc i{font-style:normal;color:var(--muted);font-size:12px;margin-right:3px}
.anal{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:13px 14px;margin-bottom:12px;box-shadow:var(--shadow);font-size:15px}
.anal h4{font-size:15.5px;color:var(--primary-dk);margin:10px 0 4px}
.anal h4:first-child{margin-top:0}
.anal ol,.anal ul{padding-left:20px}
.anal li{margin:3px 0}
details>summary{list-style:none;display:inline-block;cursor:pointer}
details>summary::-webkit-details-marker{display:none}
.pass.big{background:#fff;border:1.5px solid var(--border);font-size:15.5px;line-height:1.9;padding:12px 14px;position:sticky;top:0;z-index:3;max-height:42vh;overflow:auto;box-shadow:var(--shadow)}

</style>
</head>

<script>
window.DATA={"file":"storyofthecommonswriting.html","brand":"강동미나 중고등부 · 중3 Lesson 6","title":"The Story of the Commons — 본문","sub":"공유지 이야기 · 글 분석 → 어순 → 빈칸·어법 → 순서·삽입 → 내용확인 → 거꾸로 영작","tabs":[{"name":"🔍 글 분석 · 한글 분석","intro":"<b>순서:</b> ① 글 전체 분석(주제·목적·순서의 이유) → ② 문단별 흐름 → ③ 문장별 한글 분석(🔊 작은 버튼 = 영어 소리 듣기) → 영작 탭에서 거꾸로 영작.","blocks":[{"k":"h","html":"① 글 전체 분석"},{"k":"html","html":"<div class=\"anal\">\n<h4>📌 어떤 글인가요?</h4>\n\"옛날에 ~가 있었다\"로 시작하는 <b>교훈이 있는 이야기(우화)</b>예요. 중간중간 <b>말풍선</b>(소와 농부들의 말)이 나와서 인물들의 속마음을 직접 보여 줘요.\n<h4>📌 주제</h4>\n모두가 함께 쓰는 자원은 <b>각자가 소중히 여기고 공정하게 써야 한다.</b> 한 사람 한 사람의 작은 욕심이 모이면 모두의 것이 사라진다.\n<h4>📌 글쓴이가 이 글을 쓴 이유 · 목적</h4>\n\"나 하나쯤이야\"라는 생각이 공동체 전체를 어떻게 망치는지 <b>이야기로 보여 주고</b>, 마지막에 교훈을 직접 말해 주려고 썼어요. (마지막 문장에서 마을 사람들이 이 이야기를 아이들에게 들려준다고 한 것도 \"이 교훈을 꼭 전하라\"는 뜻이에요.)\n<h4>📌 왜 이 순서로 썼을까?</h4>\n<ol><li><b>평화 → 규칙 깨짐 → 확산 → 비극 → 회복 → 교훈</b> 순서예요. 규칙이 있을 때 얼마나 좋았는지를 먼저 보여 줘야, 규칙을 깼을 때의 비극이 더 크게 느껴져요.</li>\n<li><b>한 사람 → 친구 한 명 → 모든 사람</b> 순서로 욕심이 번져요. \"아무도 모를 거야\"라는 생각이 어떻게 퍼지는지 단계별로 보여 줘요.</li>\n<li><b>짝꿍 문장으로 대비</b> — 9번 \"소가 풀을 찾는 것이 <b>쉬웠다</b>\" ↔ 34번 \"풀을 찾기가 <b>더 어려워졌다</b>\" / 38번 \"과거에는 건조한 해에도 늘 먹을 것을 찾았다\" ↔ 39번 \"<b>하지만</b> 이제는 풀이 하나도 남지 않았다\". 같은 틀을 반대로 써서 변화를 뚜렷하게 보여 줘요. (시험 단골!)</li>\n<li><b>비가 안 온 것은 마지막에 더해진 불운</b> — \"엎친 데 덮친 격으로\"가 붙은 이유: 진짜 원인은 소가 너무 많은 것이고, 가뭄은 거기에 더해진 것이에요.</li>\n<li><b>회복 후 교훈</b> — 규칙으로 돌아가자 풀이 돌아왔다 → 규칙(공정한 사용)이 답이라는 걸 결과로 증명한 다음 교훈을 말해요.</li></ol>\n<h4>📌 연결어 지도 — 시간과 흐름이 어떻게 이어지나</h4>\n<ul><li><b>다행히도</b> — 마을 한가운데에 좋은 목초지가 있음 (좋은 조건)</li>\n<li><b>그러므로</b> — 모두가 쓸 수 있으니까 → \"공유지\"라는 이름</li>\n<li><b>그러나 어느 날</b> — 평화 → 반전(규칙을 깸)</li>\n<li><b>며칠 후 / 곧</b> — 욕심이 친구에게, 다른 사람들에게 번지는 시간 흐름</li>\n<li><b>처음에는 → 그러더니</b> — 천천히 → 더 빨리 (속도 변화)</li>\n<li><b>엎친 데 덮친 격으로</b> — 나쁜 일에 나쁜 일이 더해짐</li>\n<li><b>과거에는 ↔ 하지만 이제는</b> — 대비</li>\n<li><b>마침내 → 이제</b> — 회복과 새로운 상태</li></ul>\n<h4>📌 말풍선의 역할</h4>\n\"소가 두 마리 있다면 더 부자일 텐데\", \"아무도 눈치 못 챌 거야\", \"내가 이 마을에서 제일 부자가 될 수 있어\" — 사람들의 <b>욕심</b>을 직접 보여 줘요. \"밀지 마!\", \"배고파\" — 소들의 말로 공유지가 <b>얼마나 붐비고 힘들어졌는지</b> 보여 줘요.\n</div>"},{"k":"h","html":"② 문단별 흐름 · ③ 문장별 한글 분석"},{"k":"analysis","paras":[{"title":"평화로운 공유지 (1~10) — 규칙이 있을 때","flow":"배경(숲속 작은 마을, 소를 기르는 농부들) → <b>\"다행히도\"</b> 마을 가운데 좋은 목초지 → 모두 사용 허락 → <b>\"그러므로\"</b> \"공유지\"라 불림 → 전통에 따라 한 가족 한 소 → 소들이 풀 찾기 쉬움 → 여름 내내 푸름<br>💡 규칙(한 가족 한 소) 덕분에 모두 행복했다는 것을 먼저 보여 줘야 뒤의 비극이 대비돼요.","items":[{"n":1,"kr":"옛날에 숲속에 작은 마을이 있었다.","en":"Once upon a time there was a small village in a forest.","ch":[["Once upon a time","옛날에"],["there was","~이 있었다"],["a small village","작은 마을"],["in a forest.","숲속에"]],"tip":"There was + 단수 명사. 장소(\"숲속에\")는 맨 뒤로."},{"n":2,"kr":"마을 주민들은 농부였고 소를 길렀다.","en":"The villagers were farmers and raised cows.","ch":[["The villagers","마을 주민들은"],["were farmers","농부였다"],["and","그리고"],["raised cows.","소를 길렀다"]],"tip":"were와 raised가 and로 병렬. raise(기르다)-raised — rise(오르다)-rose와 구별!"},{"n":3,"kr":"다행히도, 마을 한가운데에 좋은 목초지가 있었다.","en":"Luckily, some good grassland lay in the middle of the village.","ch":[["Luckily,","다행히도"],["some good grassland","좋은 목초지가"],["lay","(놓여) 있었다"],["in the middle of the village.","마을 한가운데에"]],"tip":"lie(놓여 있다)-<b>lay</b>-lain. lay(놓다)-laid와 헷갈리지 말기."},{"n":4,"kr":"\"공유지를 함께 나누어 씁시다.\"","en":"\"Let's share the commons.\"","ch":[["Let's share","함께 나누어 씁시다"],["the commons","공유지를"]],"tip":"Let's + 동사원형."},{"n":5,"kr":"\"내 소가 풀을 충분히 뜯을 수 있겠어.\"","en":"\"My cow can get enough grass.\"","ch":[["My cow","내 소가"],["can get","얻을 수 있다"],["enough grass","충분한 풀을"]],"tip":"enough + 명사 (enough grass)."},{"n":6,"kr":"\"맞아, 모든 소에게 충분한 양이야.\"","en":"\"Yeah, there's plenty for every cow.\"","ch":[["Yeah,","맞아"],["there's plenty","충분한 양이 있다"],["for every cow","모든 소에게"]],"tip":"every + <b>단수</b> 명사 (every cows ✗)."},{"n":7,"kr":"모든 사람들이 목초지를 사용하도록 허락되었다.","en":"Everyone was allowed to use the grassland.","ch":[["Everyone","모든 사람이"],["was allowed to","~하도록 허락되었다"],["use the grassland.","목초지를 사용하다"]],"tip":"be allowed to + 동사원형. Everyone은 단수 → was."},{"n":8,"kr":"그러므로 목초지는 '공유지'라고 불렸다.","en":"Therefore, it was called \"the commons.\"","ch":[["Therefore,","그러므로"],["it","그것(목초지)은"],["was called","불렸다"],["\"the commons.\"","'공유지'라고"]],"tip":"be called + 명사: ~라고 불리다 (call A B의 수동태). it = the grassland."},{"n":9,"kr":"전통에 따라 각 가정은 소가 한 마리만 있었고, 그래서 마을에 있는 각 소가 먹을 풀을 충분히 찾는 것은 쉬웠다.","en":"By tradition, each family only had one cow, so it was easy for each cow in the village to find enough grass to eat.","ch":[["By tradition,","전통에 따라"],["each family only had one cow,","각 가정은 소가 한 마리만 있었다"],["so","그래서"],["it was easy","(~하는 것은) 쉬웠다"],["for each cow in the village","마을의 각 소가"],["to find enough grass to eat.","먹을 풀을 충분히 찾는 것"]],"tip":"가주어 <b>it</b> + 의미상 주어 <b>for</b> ~ + 진주어 <b>to부정사</b>. grass to eat: 뒤에서 꾸미는 to부정사. 34번과 짝꿍 문장!"},{"n":10,"kr":"공유지의 풀은 여름 내내 푸르렀다.","en":"The grass on the commons was green all summer long.","ch":[["The grass on the commons","공유지의 풀은"],["was green","푸르렀다"],["all summer long.","여름 내내"]],"tip":"주어는 The grass(단수) → was. on the commons는 꾸밈말."}]},{"title":"한 사람의 욕심 (11~22) — 규칙이 깨지다","flow":"말풍선(더 부자가 되고 싶다, 아무도 모를 것) → <b>\"그러나 어느 날\"</b> 규칙을 깸 → 소를 한 마리 더 데려옴 → 아무도 모를 거라 생각 → 우유와 치즈 생각에 행복 → 아이가 넷인 친구 생각 → <b>\"며칠 후\"</b> 친구에게 몰래 같은 방법을 알려 줌 → 친구도 들은 대로 함<br>💡 욕심이 \"나 → 친구\"로 번지는 첫 단계. \"몰래(in secret)\"라는 말이 규칙을 깨는 일임을 알고 있었다는 걸 보여 줘요.","items":[{"n":11,"kr":"\"만약 내게 소가 두 마리 있다면, 나는 더 부유할 텐데.\"","en":"\"If I had two cows, I would be richer.\"","ch":[["If I had two cows,","만약 내게 소가 두 마리 있다면"],["I would be richer.","나는 더 부유할 텐데"]],"tip":"가정법 과거: If + 주어 + <b>과거동사</b>, 주어 + <b>would</b> + 동사원형 (지금 사실과 반대)."},{"n":12,"kr":"\"아무도 눈치채지 못할 거야.\"","en":"\"No one will notice it.\"","ch":[["No one","아무도 ~않다"],["will notice","알아챌 것이다"],["it","그것을"]],"tip":"No one 자체가 부정 → not을 또 쓰지 않음."},{"n":13,"kr":"그러나 어느 날 마을 사람 하나가 규칙을 깨뜨렸다.","en":"But one day a villager broke the rule.","ch":[["But","그러나"],["one day","어느 날"],["a villager","마을 사람 하나가"],["broke the rule.","규칙을 깨뜨렸다"]],"tip":"연결어 But: 평화로운 이야기 → 반전 시작. break-broke-broken."},{"n":14,"kr":"그는 소를 한 마리 더 데려와 공유지에서 풀을 뜯게 했다.","en":"He brought another cow and let it graze on the commons.","ch":[["He brought another cow","그는 소를 한 마리 더 데려왔다"],["and let it","그리고 그것이 ~하게 했다"],["graze","풀을 뜯다"],["on the commons.","공유지에서"]],"tip":"사역동사 let + 목적어 + <b>동사원형</b> (to graze ✗). it = another cow."},{"n":15,"kr":"그는 아무도 그것을 눈치채지 못할 것이라고 생각했다.","en":"He thought that nobody would notice it.","ch":[["He thought","그는 생각했다"],["that","~라고"],["nobody would notice","아무도 알아채지 못할 것이다"],["it.","그것을"]],"tip":"thought(과거) → would(시제 일치). that 생략 가능."},{"n":16,"kr":"두 번째 소가 가족에게 가져다줄 우유와 치즈를 생각하자 그의 마음은 행복감으로 가득 찼다.","en":"A happy feeling filled his heart when he thought of the milk and cheese that the second cow would bring to his family.","ch":[["A happy feeling","행복한 감정이"],["filled his heart","그의 마음을 채웠다"],["when he thought of","그가 ~을 생각했을 때"],["the milk and cheese","우유와 치즈"],["that the second cow would bring to his family.","두 번째 소가 가족에게 가져다줄"]],"tip":"한글은 \"가져다줄 우유와 치즈\"(꾸밈이 앞), 영어는 명사 <b>뒤</b>에 that절(목적격 관계대명사, 생략 가능)."},{"n":17,"kr":"'그는 아이가 네 명이나 있어.'","en":"'He has four children.'","ch":null,"tip":""},{"n":18,"kr":"\"내가 당신이라면, 소를 한 마리 더 기르겠어요.\"","en":"\"If I were you, I would raise another cow.\"","ch":[["If I were you,","내가 당신이라면"],["I would raise","나는 기를 텐데"],["another cow.","소를 한 마리 더"]],"tip":"가정법 과거의 be동사는 주어와 상관없이 <b>were</b> (If I was ✗ — 시험 기준)."},{"n":19,"kr":"\"조언 고마워요!\"","en":"\"Thanks for the tip!\"","ch":[["Thanks","고마워요"],["for the tip!","조언에 대해"]],"tip":"Thanks for + 명사."},{"n":20,"kr":"며칠 후, 그 농부는 아이가 네 명 있는 친한 친구를 방문했다.","en":"A few days later, the farmer visited a close friend who had four children.","ch":[["A few days later,","며칠 후"],["the farmer visited","그 농부는 방문했다"],["a close friend","친한 친구를"],["who had four children.","아이가 네 명 있는"]],"tip":"주격 관계대명사 who: 한글 \"아이가 네 명 있는\"(앞) → 영어는 friend <b>뒤</b>."},{"n":21,"kr":"그는 친구를 돕고 싶어서 몰래 그에게 말했다. \"내가 당신이라면, 소를 한 마리 더 데려와서 공유지에서 키우겠어요.\"","en":"He wanted to help his friend, so he told him in secret, \"If I were you, I would bring in one more cow and raise it on the commons.\"","ch":[["He wanted to help his friend,","그는 친구를 돕고 싶었다"],["so he told him in secret,","그래서 그에게 몰래 말했다"],["If I were you,","내가 당신이라면"],["I would bring in one more cow","소를 한 마리 더 데려오겠어요"],["and raise it on the commons.","그리고 공유지에서 그것을 키우겠어요"]],"tip":"in secret = secretly(몰래). 가정법 과거 were / would."},{"n":22,"kr":"친구는 그에게 고마워했고 다음 날 자신이 들은 대로 했다.","en":"The friend thanked him and did as he was told the next day.","ch":[["The friend thanked him","친구는 그에게 고마워했다"],["and did","그리고 했다"],["as he was told","그가 들은 대로"],["the next day.","다음 날"]],"tip":"as = ~대로. did = 소를 한 마리 더 데려왔다. be told: (말을) 듣다."}]},{"title":"모두의 욕심 (23~35) — 공유지가 무너지다","flow":"소들의 말풍선(새로 왔어) → <b>\"곧\"</b> 다른 사람들도 똑같이 함 → 몰래 한 마리 더, 훨씬 더 많이 → 풀이 충분할 거라 생각 → 행복해 보이는 농부들 → 붐비는 소들(\"밀지 마!\", \"배고파\") → <b>\"처음에는\"</b> 천천히, <b>\"그러더니\"</b> 더 빨리 소가 늘어남 → 풀이 사라짐 → <b>\"엎친 데 덮친 격으로\"</b> 비도 안 옴<br>💡 34번은 9번을 뒤집은 문장: 쉬웠다 → 더 어려워졌다.","items":[{"n":23,"kr":"\"넌 누구니?\" \"난 새로 왔어.\"","en":"\"Who are you?\" \"I'm new.\"","ch":null,"tip":"새로 온 소들끼리 나누는 말 — 소가 늘어나고 있다는 신호."},{"n":24,"kr":"\"누가 저기 누워 있는 거야?\" \"몰라.\"","en":"\"Who is lying there?\" \"I don't know.\"","ch":null,"tip":"lie(눕다)-lay-lain, 현재분사 <b>lying</b>."},{"n":25,"kr":"\"내가 이 마을에서 가장 부유한 농부가 될 수 있어.\"","en":"\"I can be the richest farmer in this village.\"","ch":[["I can be","나는 될 수 있다"],["the richest farmer","가장 부유한 농부"],["in this village.","이 마을에서"]],"tip":"최상급 the + -est + in 장소."},{"n":26,"kr":"곧, 다른 마을 사람들도 똑같이 했다.","en":"Soon, other villagers did the same.","ch":[["Soon,","곧"],["other villagers","다른 마을 사람들도"],["did the same.","똑같이 했다"]],"tip":"did the same = 소를 한 마리 더 데려와 공유지에서 길렀다."},{"n":27,"kr":"어떤 사람들은 몰래 소를 한 마리 더 공유지에 데려왔고, 다른 사람들은 아무에게도 말하지 않고 훨씬 더 많은 소를 목초지에 데려왔다.","en":"Some secretly brought one more cow to the commons while others brought even more to the grassland without telling anyone.","ch":[["Some","어떤 사람들은"],["secretly brought one more cow","몰래 소를 한 마리 더 데려왔다"],["to the commons","공유지에"],["while others","반면 다른 사람들은"],["brought even more","훨씬 더 많이 데려왔다"],["to the grassland","목초지에"],["without telling anyone.","아무에게도 말하지 않고"]],"tip":"Some ~, others ~ (일부는 ~, 다른 일부는 ~). <b>even</b> + 비교급(훨씬). without + <b>-ing</b>."},{"n":28,"kr":"그들은 추가된 소들에게도 풀이 충분할 것이라고 생각했다.","en":"They thought that there would be enough grass for the additional cows.","ch":[["They thought","그들은 생각했다"],["that","~라고"],["there would be enough grass","풀이 충분히 있을 것이다"],["for the additional cows.","추가된 소들을 위한"]],"tip":"시제 일치 thought → would. additional = extra."},{"n":29,"kr":"곧 마을은 행복해 보이는 농부들로 가득 찼다!","en":"Soon the village was full of happy-looking farmers!","ch":[["Soon","곧"],["the village","마을은"],["was full of","~로 가득 찼다"],["happy-looking farmers!","행복해 보이는 농부들"]],"tip":"be full of = be filled with."},{"n":30,"kr":"\"이봐, 밀지 마!\" \"저리 비켜!\" \"여긴 내 자리야!\"","en":"\"Hey, stop pushing me!\" \"Move over!\" \"This is my spot!\"","ch":null,"tip":"stop + <b>-ing</b>: ~하는 것을 멈추다 (stop to push = 밀기 위해 멈추다, 뜻이 다름)."},{"n":31,"kr":"\"비가 필요해!\" \"나 배고파.\" \"나도.\"","en":"\"We need rain!\" \"I'm hungry.\" \"Me, too.\"","ch":null,"tip":""},{"n":32,"kr":"처음에는 소의 수가 천천히 늘어났다.","en":"The number of cows rose slowly at first.","ch":[["The number of cows","소의 수가"],["rose","늘어났다"],["slowly","천천히"],["at first.","처음에는"]],"tip":"<b>the number of</b> + 복수 명사 → <b>단수</b> 취급. rise-rose-risen (raise와 구별)."},{"n":33,"kr":"그러더니 소의 개체 수는 더 빨리 늘어났다.","en":"Then the cow population grew more quickly.","ch":[["Then","그러더니"],["the cow population","소의 개체 수는"],["grew","늘어났다"],["more quickly.","더 빨리"]],"tip":"연결어 Then: \"처음에는 천천히\" → \"그러더니 더 빨리\". grow-grew-grown."},{"n":34,"kr":"공유지의 풀은 사라지기 시작했고, 소들이 먹을 풀을 찾기가 더 어려워졌다.","en":"The grass on the commons began to disappear, and it became harder for the cows to find grass to eat.","ch":[["The grass on the commons","공유지의 풀은"],["began to disappear,","사라지기 시작했다"],["and it became harder","그리고 (~하는 것이) 더 어려워졌다"],["for the cows","소들이"],["to find grass to eat.","먹을 풀을 찾는 것"]],"tip":"9번과 짝! it was easy ↔ it became harder (가주어 it + for + to부정사). begin to = begin -ing."},{"n":35,"kr":"엎친 데 덮친 격으로, 오랫동안 비가 내리지 않았다.","en":"To make matters worse, it did not rain for a long time.","ch":[["To make matters worse,","엎친 데 덮친 격으로"],["it did not rain","비가 내리지 않았다"],["for a long time.","오랫동안"]],"tip":"it = 날씨를 나타내는 비인칭 주어. To make matters worse: 나쁜 일에 또 나쁜 일을 더할 때."}]},{"title":"비극과 회복 (36~44) — 규칙으로 돌아가다","flow":"말풍선(남은 소가 없어, 무슨 일이야?) → <b>\"과거에는\"</b> 가뭄에도 먹을 것이 있었음 ↔ <b>\"하지만\"</b> 이제 풀이 하나도 없음 → 상황이 혹독, 많은 소가 죽음 → 표지판(가족당 소 한 마리만) → <b>\"마침내\"</b> 풀이 돌아옴 → <b>\"이제\"</b> 가족당 한 마리만 감당 → 한 가족 한 소 규칙으로 복귀","items":[{"n":36,"kr":"\"이제 나는 남은 소가 없어!\" \"잘 가.\"","en":"\"I don't have any cows left!\" \"Goodbye.\"","ch":null,"tip":"any cows <b>left</b>: left(남은)가 뒤에서 꾸밈."},{"n":37,"kr":"\"공유지에 무슨 일이 일어난 거지?\"","en":"\"What happened to the commons?\"","ch":[["What happened","무슨 일이 일어났니"],["to the commons?","공유지에"]],"tip":"happen은 목적어가 없는 동사 → 수동태 불가 (was happened ✗)."},{"n":38,"kr":"과거에는 건조한 해가 와도 공유지의 적은 수의 소들은 먹을 것을 항상 찾았다.","en":"In the past, when a dry year came, the small number of cows on the commons always found something to eat.","ch":[["In the past,","과거에는"],["when a dry year came,","건조한 해가 왔을 때"],["the small number of cows on the commons","공유지의 적은 수의 소들은"],["always found","항상 찾았다"],["something to eat.","먹을 것을"]],"tip":"something + to부정사(먹을 것). always는 일반동사 앞."},{"n":39,"kr":"하지만 소가 너무 많아서 이제는 풀이 하나도 남지 않았다.","en":"However, no grass was left now because there were too many cows.","ch":[["However,","하지만"],["no grass was left now","이제 풀이 하나도 남지 않았다"],["because","~ 때문에"],["there were too many cows.","소가 너무 많았다"]],"tip":"연결어 However: 과거(늘 먹을 것이 있음) ↔ 지금(하나도 없음). 한글은 이유가 앞, 영어는 because절이 뒤."},{"n":40,"kr":"마을 사람들에게 상황은 혹독했다. 많은 소들이 죽었다.","en":"Things were harsh for the villagers; many of the cows died.","ch":[["Things were harsh","상황은 혹독했다"],["for the villagers;","마을 사람들에게"],["many of the cows died.","많은 소들이 죽었다"]],"tip":"Things = 상황(복수 → were). many of + 복수 명사."},{"n":41,"kr":"\"즐기세요, 하지만 규칙을 기억하세요: 가족당 소 한 마리만.\"","en":"\"Enjoy, but remember the rule: ONLY ONE COW PER FAMILY.\"","ch":[["Enjoy,","즐기세요"],["but remember the rule:","하지만 규칙을 기억하세요"],["ONLY ONE COW PER FAMILY.","가족당 소 한 마리만"]],"tip":"per = ~당, ~마다."},{"n":42,"kr":"마침내 풀이 다시 돌아왔다.","en":"At last, the grass came back.","ch":[["At last,","마침내"],["the grass","풀이"],["came back.","돌아왔다"]],"tip":"At last = Finally."},{"n":43,"kr":"이제 그것(풀)은 가족당 소 한 마리만 감당할 수 있었다.","en":"Now it was able to support only one cow per family.","ch":[["Now","이제"],["it was able to support","그것은 감당할 수 있었다"],["only one cow per family.","가족당 소 한 마리만"]],"tip":"it = the grass (on the commons). be able to = can."},{"n":44,"kr":"마을은 '한 가족 한 소' 규칙으로 돌아갔다.","en":"The village went back to the one-family-one-cow rule.","ch":[["The village","마을은"],["went back to","~로 돌아갔다"],["the one-family-one-cow rule.","'한 가족 한 소' 규칙"]],"tip":"go back to: ~로 돌아가다."}]},{"title":"교훈 (45~47) — 글쓴이가 하고 싶은 말","flow":"중요한 교훈: 공유 자원은 모두가 소중히 여기고 공정하게 써야 한다 → 아이들에게 이 이야기를 들려줌 → \"공유지 이야기\"라고 부름<br>💡 주제문은 45번! 시험의 주제·요지·제목 문제는 이 문장에서 나와요.","items":[{"n":45,"kr":"마을 사람들은 모두 중요한 교훈을 배웠다. 자원이 공유될 때는 모두가 그 자원을 소중히 여기고 공정하게 사용하는 것이 중요하다.","en":"The villagers all learned an important lesson: when resources are shared, it is important for everyone to value the resources and use them fairly.","ch":[["The villagers all learned","마을 사람들은 모두 배웠다"],["an important lesson:","중요한 교훈을"],["when resources are shared,","자원이 공유될 때"],["it is important","(~하는 것이) 중요하다"],["for everyone","모두가"],["to value the resources","그 자원을 소중히 여기는 것"],["and use them fairly.","그리고 그것들을 공정하게 사용하는 것"]],"tip":"are shared(수동태: 자원은 \"공유되는\" 것). 가주어 it + for 의미상 주어 + to value and (to) use. them = the resources."},{"n":46,"kr":"이제 마을 사람들은 이 이야기를 자신들의 아이들에게 들려준다.","en":"The villagers now tell this story to their children.","ch":[["The villagers","마을 사람들은"],["now tell this story","이제 이 이야기를 들려준다"],["to their children.","자신들의 아이들에게"]],"tip":"tell A to B = tell B A (4형식 ↔ 3형식, 전치사 to)."},{"n":47,"kr":"그들은 그것을 '공유지 이야기'라고 부른다.","en":"They call it \"The Story of the Commons.\"","ch":[["They call","그들은 부른다"],["it","그것을"],["\"The Story of the Commons.\"","'공유지 이야기'라고"]],"tip":"call A B: A를 B라고 부르다. it = this story."}]}]}]},{"name":"🧱 어순 배열","intro":"<b>한글 순서 그대로 놓으면 틀려요.</b> \"누가 → 한다 → 무엇을 → 어디서/언제/왜\" 순서로 영어 덩어리를 놓으세요. 꾸며 주는 말(관계사절·to부정사)은 명사 <b>뒤</b>!","blocks":[{"k":"qset","title":"영어 덩어리 순서대로 놓기","qs":[{"t":"ord","q":"[1] 옛날에 숲속에 작은 마을이 있었다.","c":["Once upon a time","there was","a small village","in a forest"],"e":"There was + 단수 명사. 장소(\"숲속에\")는 맨 뒤로."},{"t":"ord","q":"[2] 마을 주민들은 농부였고 소를 길렀다.","c":["The villagers","were farmers","and","raised cows"],"e":"were와 raised가 and로 병렬. raise(기르다)-raised — rise(오르다)-rose와 구별!"},{"t":"ord","q":"[3] 다행히도, 마을 한가운데에 좋은 목초지가 있었다.","c":["Luckily","some good grassland","lay","in the middle of the village"],"e":"lie(놓여 있다)-<b>lay</b>-lain. lay(놓다)-laid와 헷갈리지 말기."},{"t":"ord","q":"[7] 모든 사람들이 목초지를 사용하도록 허락되었다.","c":["Everyone","was allowed to","use the grassland"],"e":"be allowed to + 동사원형. Everyone은 단수 → was."},{"t":"ord","q":"[8] 그러므로 목초지는 '공유지'라고 불렸다.","c":["Therefore","it","was called","the commons"],"e":"be called + 명사: ~라고 불리다 (call A B의 수동태). it = the grassland."},{"t":"ord","q":"[9] 전통에 따라 각 가정은 소가 한 마리만 있었고, 그래서 마을에 있는 각 소가 먹을 풀을 충분히 찾는 것은 쉬웠다.","c":["By tradition","each family only had one cow","so","it was easy","for each cow in the village","to find enough grass to eat"],"e":"가주어 <b>it</b> + 의미상 주어 <b>for</b> ~ + 진주어 <b>to부정사</b>. grass to eat: 뒤에서 꾸미는 to부정사. 34번과 짝꿍 문장!"},{"t":"ord","q":"[10] 공유지의 풀은 여름 내내 푸르렀다.","c":["The grass on the commons","was green","all summer long"],"e":"주어는 The grass(단수) → was. on the commons는 꾸밈말."},{"t":"ord","q":"[13] 그러나 어느 날 마을 사람 하나가 규칙을 깨뜨렸다.","c":["But","one day","a villager","broke the rule"],"e":"연결어 But: 평화로운 이야기 → 반전 시작. break-broke-broken."},{"t":"ord","q":"[14] 그는 소를 한 마리 더 데려와 공유지에서 풀을 뜯게 했다.","c":["He brought another cow","and let it","graze","on the commons"],"e":"사역동사 let + 목적어 + <b>동사원형</b> (to graze ✗). it = another cow."},{"t":"ord","q":"[15] 그는 아무도 그것을 눈치채지 못할 것이라고 생각했다.","c":["He thought","that","nobody would notice","it"],"e":"thought(과거) → would(시제 일치). that 생략 가능."},{"t":"ord","q":"[16] 두 번째 소가 가족에게 가져다줄 우유와 치즈를 생각하자 그의 마음은 행복감으로 가득 찼다.","c":["A happy feeling","filled his heart","when he thought of","the milk and cheese","that the second cow would bring to his family"],"e":"한글은 \"가져다줄 우유와 치즈\"(꾸밈이 앞), 영어는 명사 <b>뒤</b>에 that절(목적격 관계대명사, 생략 가능)."},{"t":"ord","q":"[20] 며칠 후, 그 농부는 아이가 네 명 있는 친한 친구를 방문했다.","c":["A few days later","the farmer visited","a close friend","who had four children"],"e":"주격 관계대명사 who: 한글 \"아이가 네 명 있는\"(앞) → 영어는 friend <b>뒤</b>."},{"t":"ord","q":"[21] 그는 친구를 돕고 싶어서 몰래 그에게 말했다. \"내가 당신이라면, 소를 한 마리 더 데려와서 공유지에서 키우겠어요.\"","c":["He wanted to help his friend","so he told him in secret","If I were you","I would bring in one more cow","and raise it on the commons"],"e":"in secret = secretly(몰래). 가정법 과거 were / would."},{"t":"ord","q":"[22] 친구는 그에게 고마워했고 다음 날 자신이 들은 대로 했다.","c":["The friend thanked him","and did","as he was told","the next day"],"e":"as = ~대로. did = 소를 한 마리 더 데려왔다. be told: (말을) 듣다."},{"t":"ord","q":"[25] \"내가 이 마을에서 가장 부유한 농부가 될 수 있어.\"","c":["I can be","the richest farmer","in this village"],"e":"최상급 the + -est + in 장소."},{"t":"ord","q":"[27] 어떤 사람들은 몰래 소를 한 마리 더 공유지에 데려왔고, 다른 사람들은 아무에게도 말하지 않고 훨씬 더 많은 소를 목초지에 데려왔다.","c":["Some","secretly brought one more cow","to the commons","while others","brought even more","to the grassland","without telling anyone"],"e":"Some ~, others ~ (일부는 ~, 다른 일부는 ~). <b>even</b> + 비교급(훨씬). without + <b>-ing</b>."},{"t":"ord","q":"[28] 그들은 추가된 소들에게도 풀이 충분할 것이라고 생각했다.","c":["They thought","that","there would be enough grass","for the additional cows"],"e":"시제 일치 thought → would. additional = extra."},{"t":"ord","q":"[32] 처음에는 소의 수가 천천히 늘어났다.","c":["The number of cows","rose","slowly","at first"],"e":"<b>the number of</b> + 복수 명사 → <b>단수</b> 취급. rise-rose-risen (raise와 구별)."},{"t":"ord","q":"[34] 공유지의 풀은 사라지기 시작했고, 소들이 먹을 풀을 찾기가 더 어려워졌다.","c":["The grass on the commons","began to disappear","and it became harder","for the cows","to find grass to eat"],"e":"9번과 짝! it was easy ↔ it became harder (가주어 it + for + to부정사). begin to = begin -ing."},{"t":"ord","q":"[35] 엎친 데 덮친 격으로, 오랫동안 비가 내리지 않았다.","c":["To make matters worse","it did not rain","for a long time"],"e":"it = 날씨를 나타내는 비인칭 주어. To make matters worse: 나쁜 일에 또 나쁜 일을 더할 때."},{"t":"ord","q":"[38] 과거에는 건조한 해가 와도 공유지의 적은 수의 소들은 먹을 것을 항상 찾았다.","c":["In the past","when a dry year came","the small number of cows on the commons","always found","something to eat"],"e":"something + to부정사(먹을 것). always는 일반동사 앞."},{"t":"ord","q":"[39] 하지만 소가 너무 많아서 이제는 풀이 하나도 남지 않았다.","c":["However","no grass was left now","because","there were too many cows"],"e":"연결어 However: 과거(늘 먹을 것이 있음) ↔ 지금(하나도 없음). 한글은 이유가 앞, 영어는 because절이 뒤."},{"t":"ord","q":"[40] 마을 사람들에게 상황은 혹독했다. 많은 소들이 죽었다.","c":["Things were harsh","for the villagers","many of the cows died"],"e":"Things = 상황(복수 → were). many of + 복수 명사."},{"t":"ord","q":"[43] 이제 그것(풀)은 가족당 소 한 마리만 감당할 수 있었다.","c":["Now","it was able to support","only one cow per family"],"e":"it = the grass (on the commons). be able to = can."},{"t":"ord","q":"[45] 마을 사람들은 모두 중요한 교훈을 배웠다. 자원이 공유될 때는 모두가 그 자원을 소중히 여기고 공정하게 사용하는 것이 중요하다.","c":["The villagers all learned","an important lesson","when resources are shared","it is important","for everyone","to value the resources","and use them fairly"],"e":"are shared(수동태: 자원은 \"공유되는\" 것). 가주어 it + for 의미상 주어 + to value and (to) use. them = the resources."},{"t":"ord","q":"[46] 이제 마을 사람들은 이 이야기를 자신들의 아이들에게 들려준다.","c":["The villagers","now tell this story","to their children"],"e":"tell A to B = tell B A (4형식 ↔ 3형식, 전치사 to)."}]}]},{"name":"✏️ 빈칸·어법","intro":"<b>핵심 표현과 어법 포인트</b>만 모았어요. 가정법 과거, 가주어 it + for + to부정사, 사역동사 let, the number of가 핵심!","blocks":[{"k":"qset","title":"A. 핵심 표현 빈칸","qs":[{"t":"in","q":"전통에 따라 각 가정은 소가 한 마리만 있었고, 그래서 마을의 각 소가 먹을 풀을 충분히 찾는 것은 쉬웠다.","s":"[] tradition, each family only had one cow, so [] was easy [] each cow in the village to find enough grass [] eat.","a":["by","it","for","to"],"e":"By tradition / 가주어 it / 의미상 주어 for / grass to eat"},{"t":"in","q":"\"만약 내게 소가 두 마리 있다면, 나는 더 부유할 텐데.\"","s":"\"If I [] two cows, I [] be richer.\"","a":["had","would"],"e":"가정법 과거: If + 과거동사, would + 동사원형"},{"t":"in","q":"그는 소를 한 마리 더 데려와 공유지에서 풀을 뜯게 했다.","s":"He brought [] cow and [] it [] on the commons.","a":["another","let","graze"],"e":"another + 단수 / let + 목적어 + 동사원형"},{"t":"in","q":"두 번째 소가 가족에게 가져다줄 우유와 치즈를 생각하자","s":"when he thought [] the milk and cheese [] the second cow would bring to his family","a":["of","that|which"],"e":"think of / 목적격 관계대명사 that(= which)"},{"t":"in","q":"그 농부는 아이가 네 명 있는 친한 친구를 방문했다.","s":"The farmer visited a [] friend [] had four children.","a":["close","who|that"],"e":"close friend(친한 친구) / 주격 관계대명사 who"},{"t":"in","q":"친구는 그에게 고마워했고 다음 날 자신이 들은 대로 했다.","s":"The friend thanked him and did [] he was [] the next day.","a":["as","told"],"e":"as(~대로) / be told(들다)"},{"t":"in","q":"어떤 사람들은 몰래 소를 한 마리 더 데려왔고, 다른 사람들은 아무에게도 말하지 않고 훨씬 더 많이 데려왔다.","s":"[] secretly brought one more cow to the commons while [] brought [] more to the grassland [] telling anyone.","a":["some","others","even|much|still|far|a lot","without"],"e":"Some ~ others ~ / even + 비교급 / without + -ing"},{"t":"in","q":"곧 마을은 행복해 보이는 농부들로 가득 찼다!","s":"Soon the village was [] [] happy-looking farmers!","a":["full","of"],"e":"be full of = be filled with"},{"t":"in","q":"처음에는 소의 수가 천천히 늘어났다.","s":"The [] of cows [] slowly at first.","a":["number","rose"],"e":"the number of(단수 취급) / rise-rose-risen"},{"t":"in","q":"엎친 데 덮친 격으로, 오랫동안 비가 내리지 않았다.","s":"To make matters [], [] did not rain for a long time.","a":["worse","it"],"e":"To make matters worse / 날씨 it"},{"t":"in","q":"공유지의 적은 수의 소들은 먹을 것을 항상 찾았다.","s":"The small number of cows on the commons always found [] [] eat.","a":["something","to"],"e":"something + to부정사"},{"t":"in","q":"마을은 '한 가족 한 소' 규칙으로 돌아갔다.","s":"The village went [] [] the one-family-one-cow rule.","a":["back","to"],"e":"go back to"},{"t":"in","q":"모두가 그 자원을 소중히 여기고 공정하게 사용하는 것이 중요하다.","s":"It is important [] everyone [] value the resources and use [] fairly.","a":["for","to","them"],"e":"가주어 It + for 의미상 주어 + to부정사 / them = the resources"},{"t":"in","q":"그들은 그것을 '공유지 이야기'라고 부른다.","s":"They [] it \"The Story of the Commons.\"","a":["call"],"e":"call A B"}]},{"k":"qset","title":"B. 어법에 맞는 것 고르기","note":"<b>이유까지 말할 수 있어야</b> 진짜 아는 거예요. 시험은 이 자리를 바꿔서 내요.","qs":[{"t":"mc","inline":1,"q":"Some good grassland (lay / laid) in the middle of the village.","o":["lay","laid"],"a":0,"e":"\"놓여 있었다\" = lie의 과거 <b>lay</b>. laid는 lay(놓다)의 과거."},{"t":"mc","inline":1,"q":"The villagers were farmers and (raised / rose) cows.","o":["raised","rose"],"a":0,"e":"목적어(cows)가 있음 → raise(기르다)의 과거 raised. rose는 목적어 없이 \"오르다\"."},{"t":"mc","inline":1,"q":"Everyone was allowed (to use / using) the grassland.","o":["to use","using"],"a":0,"e":"be allowed + <b>to부정사</b>."},{"t":"mc","inline":1,"q":"He brought another cow and let it (graze / to graze) on the commons.","o":["graze","to graze"],"a":0,"e":"사역동사 let + 목적어 + <b>동사원형</b>."},{"t":"mc","inline":1,"q":"\"If I (had / have) two cows, I would be richer.\"","o":["had","have"],"a":0,"e":"뒤에 would → 가정법 과거 → if절은 <b>과거동사</b>."},{"t":"mc","inline":1,"q":"\"If I (am / were) you, I would raise another cow.\"","o":["am","were"],"a":1,"e":"가정법 과거의 be동사 → <b>were</b>."},{"t":"mc","inline":1,"q":"The farmer visited a close friend (who / which) had four children.","o":["who","which"],"a":0,"e":"선행사가 사람(friend) → who."},{"t":"mc","inline":1,"q":"Others brought (even / very) more to the grassland.","o":["even","very"],"a":0,"e":"비교급(more) 강조 → even(훨씬). very는 비교급을 꾸미지 못해요."},{"t":"mc","inline":1,"q":"... without (telling / tell) anyone.","o":["telling","tell"],"a":0,"e":"전치사 without + <b>동명사</b>."},{"t":"mc","inline":1,"q":"The number of cows (rose / raised) slowly at first.","o":["rose","raised"],"a":0,"e":"목적어 없이 \"늘어났다\" → rise의 과거 rose."},{"t":"mc","inline":1,"q":"It became harder (for / of) the cows to find grass to eat.","o":["for","of"],"a":0,"e":"hard·easy처럼 상황을 나타내는 형용사 → 의미상 주어 <b>for</b>. (of는 kind, nice처럼 사람 성격일 때)"},{"t":"mc","inline":1,"q":"\"I don't have any cows (left / leaving)!\"","o":["left","leaving"],"a":0,"e":"\"남은\" 소 → 과거분사 left가 뒤에서 꾸밈."},{"t":"mc","inline":1,"q":"\"What (happened / was happened) to the commons?\"","o":["happened","was happened"],"a":0,"e":"happen은 목적어를 갖지 않는 동사 → 수동태 ✗."},{"t":"mc","inline":1,"q":"The cows always found something (to eat / eating).","o":["to eat","eating"],"a":0,"e":"something을 뒤에서 꾸미는 <b>to부정사</b>."},{"t":"mc","inline":1,"q":"When resources (are shared / share), it is important ...","o":["are shared","share"],"a":0,"e":"자원은 \"공유되는\" 대상 → 수동태 are shared."},{"t":"mc","inline":1,"q":"The villagers now tell this story (to / for) their children.","o":["to","for"],"a":0,"e":"tell A <b>to</b> B (tell은 to를 쓰는 동사)."},{"t":"mc","inline":1,"q":"\"Hey, stop (pushing / to push) me!\"","o":["pushing","to push"],"a":0,"e":"stop + -ing = ~하는 것을 멈추다. stop to push = 밀기 위해 멈추다 (뜻이 다름)."}]}]},{"name":"🔢 순서·삽입","intro":"<b>연결어·시간 표현·대명사가 단서!</b> But one day → 반전, A few days later / Soon → 시간 흐름, at first → Then, In the past ↔ However.","blocks":[{"k":"qset","title":"A. 문장 순서 맞추기","qs":[{"t":"ord","blk":1,"q":"한 사람의 욕심 — 다음 문장들을 순서대로 놓으세요.","c":["But one day a villager broke the rule.","He brought another cow and let it graze on the commons.","He thought that nobody would notice it.","A happy feeling filled his heart when he thought of the milk and cheese that the second cow would bring to his family."],"e":"반전(규칙을 깸) → 행동(소를 데려옴) → it(=그 행동)을 아무도 모를 것 → 행복"},{"t":"ord","blk":1,"q":"욕심의 확산 — 다음 문장들을 순서대로 놓으세요.","c":["A few days later, the farmer visited a close friend who had four children.","He wanted to help his friend, so he told him in secret, \"If I were you, I would bring in one more cow and raise it on the commons.\"","The friend thanked him and did as he was told the next day.","Soon, other villagers did the same."],"e":"며칠 후 친구 방문 → 몰래 조언 → 친구가 들은 대로 함 → 곧 다른 사람들도"},{"t":"ord","blk":1,"q":"공유지가 무너지는 과정 — 다음 문장들을 순서대로 놓으세요.","c":["The number of cows rose slowly at first.","Then the cow population grew more quickly.","The grass on the commons began to disappear, and it became harder for the cows to find grass to eat.","To make matters worse, it did not rain for a long time."],"e":"at first(처음에는) → Then(그러더니) → 결과(풀이 사라짐) → To make matters worse(설상가상)"},{"t":"ord","blk":1,"q":"비극과 회복 — 다음 문장들을 순서대로 놓으세요.","c":["In the past, when a dry year came, the small number of cows on the commons always found something to eat.","However, no grass was left now because there were too many cows.","Things were harsh for the villagers; many of the cows died.","At last, the grass came back.","Now it was able to support only one cow per family."],"e":"과거 ↔ However 지금 → 혹독한 결과 → At last 회복 → Now 새로운 상태"},{"t":"ord","blk":1,"q":"글 전체 — 다섯 부분을 이야기 순서대로 놓으세요.","c":["Once upon a time there was a small village in a forest. ...","But one day a villager broke the rule. ...","Soon, other villagers did the same. ...","However, no grass was left now because there were too many cows. ...","The villagers all learned an important lesson: ..."],"e":"평화 → 규칙 깨짐 → 확산 → 비극 → 교훈"}]},{"k":"qset","title":"B. 주어진 문장이 들어갈 위치","qs":[{"t":"mc","nonum":1,"inline":1,"q":"다음 문장이 들어갈 위치로 가장 알맞은 곳은?<br><b>Therefore, it was called \"the commons.\"</b>","p":"Luckily, some good grassland lay in the middle of the village. <span class=\"mark\">( ① )</span> Everyone was allowed to use the grassland. <span class=\"mark\">( ② )</span> By tradition, each family only had one cow, so it was easy for each cow in the village to find enough grass to eat. <span class=\"mark\">( ③ )</span> The grass on the commons was green all summer long. <span class=\"mark\">( ④ )</span> But one day a villager broke the rule. <span class=\"mark\">( ⑤ )</span>","o":["①","②","③","④","⑤"],"a":1,"e":"\"모두 사용하도록 허락됨\"(이유) → Therefore(그러므로) \"공유지\"라 불림. it = the grassland."},{"t":"mc","nonum":1,"inline":1,"q":"다음 문장이 들어갈 위치로 가장 알맞은 곳은?<br><b>He thought that nobody would notice it.</b>","p":"But one day a villager broke the rule. <span class=\"mark\">( ① )</span> He brought another cow and let it graze on the commons. <span class=\"mark\">( ② )</span> A happy feeling filled his heart when he thought of the milk and cheese that the second cow would bring to his family. <span class=\"mark\">( ③ )</span> A few days later, the farmer visited a close friend who had four children. <span class=\"mark\">( ④ )</span> The friend thanked him and did as he was told the next day. <span class=\"mark\">( ⑤ )</span>","o":["①","②","③","④","⑤"],"a":1,"e":"it = 다른 소를 데려와 풀을 뜯게 한 것 → 그 행동 바로 뒤."},{"t":"mc","nonum":1,"inline":1,"q":"다음 문장이 들어갈 위치로 가장 알맞은 곳은?<br><b>To make matters worse, it did not rain for a long time.</b>","p":"The number of cows rose slowly at first. <span class=\"mark\">( ① )</span> Then the cow population grew more quickly. <span class=\"mark\">( ② )</span> The grass on the commons began to disappear, and it became harder for the cows to find grass to eat. <span class=\"mark\">( ③ )</span> In the past, when a dry year came, the small number of cows on the commons always found something to eat. <span class=\"mark\">( ④ )</span> However, no grass was left now because there were too many cows. <span class=\"mark\">( ⑤ )</span>","o":["①","②","③","④","⑤"],"a":2,"e":"풀이 사라진 나쁜 상황 → \"엎친 데 덮친 격으로\" 비까지 안 옴. 뒤의 \"건조한 해(a dry year)\"와도 연결."},{"t":"mc","nonum":1,"inline":1,"q":"다음 문장이 들어갈 위치로 가장 알맞은 곳은?<br><b>However, no grass was left now because there were too many cows.</b>","p":"To make matters worse, it did not rain for a long time. <span class=\"mark\">( ① )</span> In the past, when a dry year came, the small number of cows on the commons always found something to eat. <span class=\"mark\">( ② )</span> Things were harsh for the villagers; many of the cows died. <span class=\"mark\">( ③ )</span> At last, the grass came back. <span class=\"mark\">( ④ )</span> Now it was able to support only one cow per family. <span class=\"mark\">( ⑤ )</span>","o":["①","②","③","④","⑤"],"a":1,"e":"In the past(과거) ↔ However ~ now(지금) 대비. 그 결과 상황이 혹독해짐."},{"t":"mc","q":"다음 글의 흐름과 관계<b>없는</b> 문장은?","p":"Once upon a time there was a small village in a forest. ① The villagers were farmers and raised cows. ② Luckily, some good grassland lay in the middle of the village. ③ Cows usually sleep for about four hours a day. ④ Everyone was allowed to use the grassland. ⑤ Therefore, it was called \"the commons.\"","o":["①","②","③","④","⑤"],"nonum":1,"inline":1,"a":2,"e":"공유지가 생긴 배경을 말하는 부분 → 소의 수면 시간은 관계없음."}]}]},{"name":"🧐 내용확인","intro":"<b>본문에 \"있는 말\"만 정답!</b> 대명사는 바로 앞 문장에서 찾고, 숫자·시간 표현(slowly at first, a few days later)은 꼭 확인하세요.","blocks":[{"k":"qset","title":"A. 대명사·대신하는 말이 가리키는 것","qs":[{"t":"in","q":"\"Therefore, <u>it</u> was called 'the commons.'\"의 it이 가리키는 말을 본문에서 찾아 쓰시오. (2단어)","a":"the grassland","e":"앞 문장의 the grassland(목초지)."},{"t":"in","q":"\"He brought another cow and let <u>it</u> graze on the commons.\"의 it이 가리키는 말을 쓰시오. (2단어)","a":"another cow","e":"바로 앞의 another cow."},{"t":"mc","q":"\"He thought that nobody would notice <u>it</u>.\"의 it이 가리키는 것은?","o":["공유지의 규칙","그가 소를 한 마리 더 데려와 공유지에서 풀을 뜯게 한 것","두 번째 소가 줄 우유와 치즈","그의 행복한 마음","친구의 네 아이"],"a":1,"e":"바로 앞 문장의 행동 전체."},{"t":"mc","q":"\"Soon, other villagers <u>did the same</u>.\"가 의미하는 것은?","o":["친구에게 몰래 조언했다","소를 한 마리 더 데려와 공유지에서 길렀다","규칙을 지켰다","우유와 치즈를 팔았다","마을을 떠났다"],"a":1,"e":"앞의 농부와 친구가 한 행동(소를 한 마리 더 데려옴)을 똑같이 함."},{"t":"in","q":"\"Now <u>it</u> was able to support only one cow per family.\"의 it이 가리키는 말을 쓰시오. (2단어)","a":"the grass","e":"앞 문장 \"the grass came back\"의 the grass."},{"t":"in","q":"\"... to value the resources and use <u>them</u> fairly.\"의 them이 가리키는 말을 쓰시오. (2단어)","a":"the resources","e":"바로 앞의 the resources."}]},{"k":"qset","title":"B. 본문과 일치하면 T, 아니면 F","qs":[{"t":"mc","inline":1,"q":"By tradition, each family had two cows.","o":["T (일치)","F (불일치)"],"a":1,"e":"전통에 따라 가족마다 소는 <b>한 마리</b>."},{"t":"mc","inline":1,"q":"Everyone was allowed to use the grassland.","o":["T (일치)","F (불일치)"],"a":0,"e":"7번 문장."},{"t":"mc","inline":1,"q":"The first farmer brought another cow because he wanted to be richer.","o":["T (일치)","F (불일치)"],"a":0,"e":"\"If I had two cows, I would be richer.\" → 더 부유해지고 싶어서."},{"t":"mc","inline":1,"q":"The farmer gave advice to his friend in front of all the villagers.","o":["T (일치)","F (불일치)"],"a":1,"tag":"함정","e":"<b>in secret</b>(몰래) 말했어요."},{"t":"mc","inline":1,"q":"The farmer's close friend had four children.","o":["T (일치)","F (불일치)"],"a":0,"e":"20번 문장."},{"t":"mc","inline":1,"q":"The number of cows rose quickly from the beginning.","o":["T (일치)","F (불일치)"],"a":1,"tag":"함정","e":"처음에는 <b>천천히(slowly at first)</b>, 그다음 더 빨리."},{"t":"mc","inline":1,"q":"It rained a lot while the grass was disappearing.","o":["T (일치)","F (불일치)"],"a":1,"e":"오랫동안 비가 <b>내리지 않았다</b>."},{"t":"mc","inline":1,"q":"In the past, the cows always found something to eat even in a dry year.","o":["T (일치)","F (불일치)"],"a":0,"e":"38번 문장."},{"t":"mc","inline":1,"q":"Many of the cows died.","o":["T (일치)","F (불일치)"],"a":0,"e":"40번 문장."},{"t":"mc","inline":1,"q":"In the end, the village made a new rule: two cows per family.","o":["T (일치)","F (불일치)"],"a":1,"e":"원래 규칙인 <b>한 가족 한 소</b>로 돌아갔어요."}]},{"k":"qset","title":"C. 객관식 내용확인","qs":[{"t":"mc","q":"이 글의 주제로 가장 알맞은 것은?","o":["부자가 되려면 소를 많이 길러야 한다.","공유 자원은 모두가 소중히 여기고 공정하게 사용해야 한다.","가뭄에 대비해 풀을 저장해야 한다.","전통은 시대에 맞게 바꿔야 한다.","친구를 돕는 것은 중요하다."],"a":1,"e":"45번 문장(교훈)이 주제문."},{"t":"mc","q":"본문을 읽고 답할 수 <b>없는</b> 질문은?","o":["Where was the good grassland?","Why was the grassland called \"the commons\"?","How many children did the farmer's friend have?","How many families lived in the village?","What lesson did the villagers learn?"],"a":3,"e":"마을에 몇 가족이 살았는지는 나오지 않아요."},{"t":"mc","q":"본문의 내용과 일치하지 <b>않는</b> 것은?","o":["마을 한가운데에 좋은 목초지가 있었다.","첫 농부는 아무도 눈치채지 못할 것이라고 생각했다.","친구는 다음 날 들은 대로 했다.","풀이 사라진 가장 큰 원인은 가뭄이었다.","마을 사람들은 이 이야기를 아이들에게 들려준다."],"a":3,"tag":"함정","e":"풀이 남지 않은 이유: <b>소가 너무 많아서</b>(because there were too many cows). 가뭄은 \"엎친 데 덮친\" 추가 불운."},{"t":"mc","q":"9번 문장(it was easy ~)과 34번 문장(it became harder ~)을 비교한 설명으로 알맞은 것은?","o":["두 문장 모두 소의 수가 늘어난 것을 말한다.","9번은 규칙이 지켜질 때, 34번은 규칙이 깨진 뒤의 상황이다.","두 문장의 it은 모두 날씨를 가리킨다.","9번은 가뭄, 34번은 홍수 상황이다.","두 문장은 같은 날의 일이다."],"a":1,"e":"같은 틀(가주어 it + for + to부정사)을 반대로 써서 변화를 보여 줘요. it은 가주어."}]}]},{"name":"✍️ 영작","intro":"<b>쓰기 전에 순서 3단계</b>: ① 누가(주어) ② 한다(동사) ③ 무엇을·어디서·언제·왜. 꾸밈말(관계사절, to부정사)은 명사 뒤! 문장부호는 채점에 상관없어요. 틀리면 \"정답 보기\"로 확인.","blocks":[{"k":"qset","title":"핵심 문장 거꾸로 영작","qs":[{"t":"in","q":"[3] 다행히도, 마을 한가운데에 좋은 목초지가 있었다. <span class=\"badge b-lav\">luckily, lie, middle</span>","a":"Luckily, some good grassland lay in the middle of the village.","e":"lie(놓여 있다)-<b>lay</b>-lain. lay(놓다)-laid와 헷갈리지 말기.","ph":"영어 문장 쓰기"},{"t":"in","q":"[7] 모든 사람들이 목초지를 사용하도록 허락되었다. <span class=\"badge b-lav\">be allowed to</span>","a":"Everyone was allowed to use the grassland.","e":"be allowed to + 동사원형. Everyone은 단수 → was.","ph":"영어 문장 쓰기"},{"t":"in","q":"[9] 전통에 따라 각 가정은 소가 한 마리만 있었고, 그래서 마을에 있는 각 소가 먹을 풀을 충분히 찾는 것은 쉬웠다. <span class=\"badge b-lav\">tradition, it, for, to find, to eat</span>","a":"By tradition, each family only had one cow, so it was easy for each cow in the village to find enough grass to eat.","e":"가주어 <b>it</b> + 의미상 주어 <b>for</b> ~ + 진주어 <b>to부정사</b>. grass to eat: 뒤에서 꾸미는 to부정사. 34번과 짝꿍 문장!","ph":"영어 문장 쓰기"},{"t":"in","q":"[11] \"만약 내게 소가 두 마리 있다면, 나는 더 부유할 텐데.\" <span class=\"badge b-lav\">가정법 과거</span>","a":"\"If I had two cows, I would be richer.\"","e":"가정법 과거: If + 주어 + <b>과거동사</b>, 주어 + <b>would</b> + 동사원형 (지금 사실과 반대).","ph":"영어 문장 쓰기"},{"t":"in","q":"[14] 그는 소를 한 마리 더 데려와 공유지에서 풀을 뜯게 했다. <span class=\"badge b-lav\">another, let, graze</span>","a":"He brought another cow and let it graze on the commons.","e":"사역동사 let + 목적어 + <b>동사원형</b> (to graze ✗). it = another cow.","ph":"영어 문장 쓰기"},{"t":"in","q":"[15] 그는 아무도 그것을 눈치채지 못할 것이라고 생각했다. <span class=\"badge b-lav\">that, nobody, would</span>","a":[["He thought (that) nobody would notice it."]],"e":"thought(과거) → would(시제 일치). that 생략 가능.","ph":"영어 문장 쓰기"},{"t":"in","q":"[16] 두 번째 소가 가족에게 가져다줄 우유와 치즈를 생각하자 그의 마음은 행복감으로 가득 찼다. <span class=\"badge b-lav\">fill, think of, that, bring</span>","a":[["A happy feeling filled his heart when he thought of the milk and cheese (that) the second cow would bring to his family.","A happy feeling filled his heart when he thought of the milk and cheese which the second cow would bring to his family."]],"e":"한글은 \"가져다줄 우유와 치즈\"(꾸밈이 앞), 영어는 명사 <b>뒤</b>에 that절(목적격 관계대명사, 생략 가능).","ph":"영어 문장 쓰기"},{"t":"in","q":"[18] \"내가 당신이라면, 소를 한 마리 더 기르겠어요.\" <span class=\"badge b-lav\">were, would, another</span>","a":"\"If I were you, I would raise another cow.\"","e":"가정법 과거의 be동사는 주어와 상관없이 <b>were</b> (If I was ✗ — 시험 기준).","ph":"영어 문장 쓰기"},{"t":"in","q":"[20] 며칠 후, 그 농부는 아이가 네 명 있는 친한 친구를 방문했다. <span class=\"badge b-lav\">a few days later, close, who</span>","a":"A few days later, the farmer visited a close friend who had four children.","e":"주격 관계대명사 who: 한글 \"아이가 네 명 있는\"(앞) → 영어는 friend <b>뒤</b>.","ph":"영어 문장 쓰기"},{"t":"in","q":"[22] 친구는 그에게 고마워했고 다음 날 자신이 들은 대로 했다. <span class=\"badge b-lav\">thank, as, be told</span>","a":"The friend thanked him and did as he was told the next day.","e":"as = ~대로. did = 소를 한 마리 더 데려왔다. be told: (말을) 듣다.","ph":"영어 문장 쓰기"},{"t":"in","q":"[27] 어떤 사람들은 몰래 소를 한 마리 더 공유지에 데려왔고, 다른 사람들은 아무에게도 말하지 않고 훨씬 더 많은 소를 목초지에 데려왔다. <span class=\"badge b-lav\">some, others, even, without</span>","a":"Some secretly brought one more cow to the commons while others brought even more to the grassland without telling anyone.","e":"Some ~, others ~ (일부는 ~, 다른 일부는 ~). <b>even</b> + 비교급(훨씬). without + <b>-ing</b>.","ph":"영어 문장 쓰기"},{"t":"in","q":"[29] 곧 마을은 행복해 보이는 농부들로 가득 찼다! <span class=\"badge b-lav\">be full of</span>","a":"Soon the village was full of happy-looking farmers!","e":"be full of = be filled with.","ph":"영어 문장 쓰기"},{"t":"in","q":"[32] 처음에는 소의 수가 천천히 늘어났다. <span class=\"badge b-lav\">the number of, rise</span>","a":"The number of cows rose slowly at first.","e":"<b>the number of</b> + 복수 명사 → <b>단수</b> 취급. rise-rose-risen (raise와 구별).","ph":"영어 문장 쓰기"},{"t":"in","q":"[34] 공유지의 풀은 사라지기 시작했고, 소들이 먹을 풀을 찾기가 더 어려워졌다. <span class=\"badge b-lav\">begin, it, for, to find</span>","a":"The grass on the commons began to disappear, and it became harder for the cows to find grass to eat.","e":"9번과 짝! it was easy ↔ it became harder (가주어 it + for + to부정사). begin to = begin -ing.","ph":"영어 문장 쓰기"},{"t":"in","q":"[35] 엎친 데 덮친 격으로, 오랫동안 비가 내리지 않았다. <span class=\"badge b-lav\">to make matters worse</span>","a":"To make matters worse, it did not rain for a long time.","e":"it = 날씨를 나타내는 비인칭 주어. To make matters worse: 나쁜 일에 또 나쁜 일을 더할 때.","ph":"영어 문장 쓰기"},{"t":"in","q":"[38] 과거에는 건조한 해가 와도 공유지의 적은 수의 소들은 먹을 것을 항상 찾았다. <span class=\"badge b-lav\">in the past, the small number of, something</span>","a":"In the past, when a dry year came, the small number of cows on the commons always found something to eat.","e":"something + to부정사(먹을 것). always는 일반동사 앞.","ph":"영어 문장 쓰기"},{"t":"in","q":"[39] 하지만 소가 너무 많아서 이제는 풀이 하나도 남지 않았다. <span class=\"badge b-lav\">however, no grass, because</span>","a":"However, no grass was left now because there were too many cows.","e":"연결어 However: 과거(늘 먹을 것이 있음) ↔ 지금(하나도 없음). 한글은 이유가 앞, 영어는 because절이 뒤.","ph":"영어 문장 쓰기"},{"t":"in","q":"[45] 마을 사람들은 모두 중요한 교훈을 배웠다. 자원이 공유될 때는 모두가 그 자원을 소중히 여기고 공정하게 사용하는 것이 중요하다. <span class=\"badge b-lav\">lesson, share, it, for, value</span>","a":"The villagers all learned an important lesson: when resources are shared, it is important for everyone to value the resources and use them fairly.","e":"are shared(수동태: 자원은 \"공유되는\" 것). 가주어 it + for 의미상 주어 + to value and (to) use. them = the resources.","ph":"영어 문장 쓰기"},{"t":"in","q":"[47] 그들은 그것을 '공유지 이야기'라고 부른다. <span class=\"badge b-lav\">call</span>","a":"They call it \"The Story of the Commons.\"","e":"call A B: A를 B라고 부르다. it = this story.","ph":"영어 문장 쓰기"}]}]}]};

<script>
(function(){
'use strict';
var D = window.DATA;
var REG = [];          // all question objects
var TABQ = [];         // per tab arrays of questions
var NUMS = ['①','②','③','④','⑤','⑥','⑦','⑧','⑨','⑩'];

/* ---------- utils ---------- */
function el(tag, cls, html){var e=document.createElement(tag); if(cls)e.className=cls; if(html!=null)e.innerHTML=html; return e;}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function hash(s){var h=2166136261;for(var i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619);}return h>>>0;}
function rng(seed){return function(){seed=(Math.imul(seed^(seed>>>15),2246822507)+0x6D2B79F5)>>>0;return (seed%100000)/100000;};}
function shuffleIdx(n, seedStr){
  var idx=[];for(var i=0;i<n;i++)idx.push(i);
  if(n<2)return idx;
  var r=rng(hash(seedStr));
  for(var k=0;k<6;k++){
    for(var j=n-1;j>0;j--){var x=Math.floor(r()*(j+1));var t=idx[j];idx[j]=idx[x];idx[x]=t;}
    var same=idx.every(function(v,i){return v===i;});
    if(!same)return idx;
  }
  idx.push(idx.shift()); return idx;
}
var CONTR=[[/can't/g,'cannot'],[/won't/g,'will not'],[/n't/g,' not'],[/\bi'm\b/g,'i am'],[/\bit's\b/g,'it is'],[/\bthat's\b/g,'that is'],[/\byou're\b/g,'you are'],[/\bthey're\b/g,'they are'],[/\bwe're\b/g,'we are'],[/\bhe's\b/g,'he is'],[/\bshe's\b/g,'she is'],[/\bwhat's\b/g,'what is'],[/\bthere's\b/g,'there is']];
function norm(s){
  s=String(s).toLowerCase().replace(/[’‘`´]/g,"'").replace(/[“”"]/g,'');
  CONTR.forEach(function(c){s=s.replace(c[0],c[1]);});
  s=s.replace(/[.,!?;:~]/g,' ').replace(/\s+/g,' ').trim();
  return s;
}
function variants(str){ // "(that) " optional words
  var m=str.match(/\(([^()]+)\)/);
  if(!m)return [str];
  var a=str.replace(m[0],m[1]), b=str.replace(m[0],'');
  return variants(a).concat(variants(b));
}
function alts(spec){ // 'a|b' or array -> list of normalized answers
  var arr=Array.isArray(spec)?spec:String(spec).split('|');
  var out=[];arr.forEach(function(x){variants(x).forEach(function(v){out.push(norm(v));});});
  return out;
}
function firstShow(spec){var s=Array.isArray(spec)?spec[0]:String(spec).split('|')[0];return s;}

/* ---------- sound ---------- */
var voices=[];
function loadV(){try{voices=window.speechSynthesis.getVoices()||[];}catch(e){voices=[];}}
if('speechSynthesis' in window){loadV();try{window.speechSynthesis.onvoiceschanged=loadV;}catch(e){}}
function pickVoice(){
  if(!voices.length)loadV();
  var v=voices.find(function(x){return /william/i.test(x.name);});
  if(!v)v=voices.find(function(x){return x.lang==='en-US';});
  if(!v)v=voices.find(function(x){return /^en/i.test(x.lang);});
  return v;
}
var unlocked=false;
function unlock(){
  if(unlocked||!('speechSynthesis' in window))return; unlocked=true;
  try{var u=new SpeechSynthesisUtterance(' ');u.volume=0;window.speechSynthesis.speak(u);}catch(e){}
}
document.addEventListener('touchstart',unlock,{once:true,passive:true});
document.addEventListener('click',unlock,{once:true});
function mkUtter(text){
  var u=new SpeechSynthesisUtterance(text.replace(/[○×]/g,''));
  var v=pickVoice(); if(v){u.voice=v;u.lang=v.lang;}else{u.lang='en-US';}
  u.rate=0.9; return u;
}
function speak(text,btn){
  if(!('speechSynthesis' in window))return;
  try{
    window.speechSynthesis.cancel();
    var u=mkUtter(text);

}

function pageSound(){
  try{

    var o=actx.createOscillator(),g=actx.createGain();
    o.type='sine';o.frequency.setValueAtTime(880,actx.currentTime);

    g.gain.setValueAtTime(.05,actx.currentTime);g.gain.exponentialRampToValueAtTime(.0001,actx.currentTime+.15);
    o.connect(g);g.connect(actx.destination);o.start();o.stop(actx.currentTime+.16);

function Q(def, num, tabIdx, setObj){
  var self=this;
  this.def=def; this.state='idle'; this.tab=tabIdx; this.set=setObj;
  var card=el('div','q'); this.card=card;
  var top=el('div','qn');
  top.appendChild(el('span','num',String(num)));
  var tt={mc:'객관식',multi:'모두 고르기',in:'쓰기',ord:'배열'}[def.t];
  var tcls={mc:'b-sky',multi:'b-peach',in:'b-mint',ord:'b-lav'}[def.t];
  var qt=el('div','qt',(def.tag?'<span class="badge b-amb">'+def.tag+'</span> ':'')+'<span class="badge '+tcls+'">'+tt+'</span> '+def.q);
  top.appendChild(qt); card.appendChild(top);
  // 소리: 정답 문장 자동 생성(빈칸·괄호 고르기) 또는 영어 문장 문제엔 바로 듣기
  var HAN=/[가-힣ⓐ-ⓩ①-⑩]/;
  this.say=def.say||null;
  if(!this.say&&def.t==='mc'&&def.o&&!HAN.test(def.o[def.a])&&def.o[def.a]!=='×(없음)'){
    var segs=def.q.split('<br>');var last=segs[segs.length-1].replace(/<[^>]+>/g,'');
    var ans=def.o[def.a].replace(/<[^>]+>/g,'');
    if(/______/.test(last)&&(def.q.match(/______/g)||[]).length===1){var s1=last.replace(/^\s*(?:[A-Z]:|•)\s*/,'').replace('______',ans).replace(/\([^)]*[가-힣][^)]*\)/g,'').trim();if(!HAN.test(s1))this.say=s1;}
    else if(/\([^()]*\/[^()]*\)/.test(last)){var s2=last.replace(/\([^()]*\/[^()]*\)/,ans).trim();if(!HAN.test(s2))this.say=s2;}
  }
  var plain=def.q.replace(/<[^>]+>/g,'');
  if(!HAN.test(plain)&&!/______|\[|\//.test(plain)&&def.t!=='ord'){
    var qs=spkBtn(plain);qs.className='spk mini';qt.appendChild(qs);
  }
  if(def.p){var p=el('div','pass',def.p);card.appendChild(p);}
  var body=el('div','qbody'); card.appendChild(body);
  this.body=body;
  this['build_'+def.t]();
  var foot=el('div','qfoot');
  this.gBtn=el('button','btn fill sm','채점');this.gBtn.type='button';
  this.rBtn=el('button','btn sm','다시 풀기');this.rBtn.type='button';this.rBtn.style.display='none';
  this.aBtn=el('button','btn ghost sm','정답 보기');this.aBtn.type='button';this.aBtn.style.display='none';
  this.gBtn.addEventListener('click',function(){self.grade(true);});
  this.rBtn.addEventListener('click',function(){self.reset();});
  this.aBtn.addEventListener('click',function(){self.showAns();});
  foot.appendChild(this.gBtn);foot.appendChild(this.rBtn);foot.appendChild(this.aBtn);
  card.appendChild(foot);
  this.fb=el('div','fb');card.appendChild(this.fb);
  REG.push(this);
}

Q.prototype.build_multi=function(){

Q.prototype.build_ord=function(){

Q.prototype.place=function(ci,src){
  var self=this,d=this.def;
  if(this.hint.parentNode)this.hint.remove();
  var b=el('button','chip',esc(d.c[ci]));b.type='button';
  var item={ci:ci,el:b,src:src};
  b.addEventListener('click',function(){
    if(self.locked)return;
    var k=self.placed.indexOf(item);if(k>=0)self.placed.splice(k,1);
    b.remove();src.classList.remove('used');
    if(!self.placed.length)self.slots.appendChild(self.hint);
  });
  this.placed.push(item);this.slots.appendChild(b);
};
Q.prototype.answered=function(){
  var d=this.def;
  if(d.t==='mc')return this.sel!=null;
  if(d.t==='multi')return Object.keys(this.sels).length>0;
  if(d.t==='in')return this.inputs.every(function(i){return i.value.trim()!=='';});
  if(d.t==='ord')return this.placed.length===d.c.length;
};
Q.prototype.check=function(){
  var d=this.def,self=this;
  if(d.t==='mc')return this.sel===d.a;
  if(d.t==='multi'){var k=Object.keys(this.sels).map(Number).sort();var a=d.a.slice().sort();return k.length===a.length&&k.every(function(v,i){return v===a[i];});}
  if(d.t==='in'){
    var A=Array.isArray(d.a)?d.a:[d.a];
    var ok=true;
    this.inputs.forEach(function(inp,i){
      var good=alts(A[i]).indexOf(norm(inp.value))>=0;
      inp.classList.toggle('right',good);inp.classList.toggle('wrong',!good);
      if(!good)ok=false;
    });
    return ok;
  }
  if(d.t==='ord'){
    var got=this.placed.map(function(p){return norm(d.c[p.ci]);}).join(' ');
    var want=d.c.map(norm).join(' ');
    return got===want;
  }
};
Q.prototype.lock=function(v){
  this.locked=v;
  (this.optEls||[]).forEach(function(b){b.disabled=v;});
  (this.inputs||[]).forEach(function(i){i.readOnly=v;});
};
Q.prototype.grade=function(manual){
  if(this.state==='ok')return true;
  if(!this.answered()){
    if(manual){this.fb.className='fb show no';this.fb.innerHTML='먼저 답을 고르거나 써 주세요.';}
    return null;
  }
  var ok=this.check();
  var d=this.def;
  this.lock(true);
  this.gBtn.style.display='none';
  if(ok){
    this.state='ok';this.card.className='q ok';
    if(d.t==='mc'){this.optEls[d.a].classList.add('right');}
    if(d.t==='multi'){var s=this;d.a.forEach(function(i){s.optEls[i].classList.add('right');});}
    this.fb.className='fb show ok';this.fb.innerHTML='<b>정답!</b> '+(d.e||'')+this.sayHtml();
    this.rBtn.style.display='none';this.aBtn.style.display='none';
  }else{
    this.state='no';this.card.className='q no';
    if(d.t==='mc'){this.optEls[this.sel].classList.add('wrong');}
    if(d.t==='multi'){var s2=this;Object.keys(this.sels).forEach(function(i){if(d.a.indexOf(+i)<0)s2.optEls[i].classList.add('wrong');});}
    this.fb.className='fb show no';this.fb.innerHTML='<b>틀렸어요.</b> 다시 풀어 보거나 정답을 확인하세요.';
    this.rBtn.style.display='';this.aBtn.style.display='';
  }
  updateScores();
  return ok;
};
Q.prototype.sayHtml=function(){
  var s=this.say;
  if(!s&&this.def.t==='in'&&!this.def.s){var a=Array.isArray(this.def.a)?this.def.a[0]:this.def.a;a=firstShow(a).replace(/[()]/g,'');if(a.split(' ').length>=3)s=a;}
  if(!s&&this.def.t==='ord'&&!/[가-힣]/.test(this.def.c.join('')))s=this.def.c.join(' ');
  if(!s)return '';
  return '<div style="margin-top:6px" class="row"><button class="spk mini" data-say="'+esc(s).replace(/"/g,'&quot;')+'">🔊</button><span class="en">'+esc(s)+'</span></div>';
};
Q.prototype.ansText=function(){
  var d=this.def;
  if(d.t==='mc')return NUMS[d.a]+' '+d.o[d.a];
  if(d.t==='multi')return d.a.map(function(i){return NUMS[i]+' '+d.o[i];}).join(' / ');
  if(d.t==='in'){var A=Array.isArray(d.a)?d.a:[d.a];return A.map(firstShow).join(' / ');}
  if(d.t==='ord')return d.c.join(d.blk?'<br>→ ':' ');
};
Q.prototype.showAns=function(){
  var d=this.def,s=this;
  if(d.t==='mc')this.optEls[d.a].classList.add('right');
  if(d.t==='multi')d.a.forEach(function(i){s.optEls[i].classList.add('right');});
  this.state='shown';
  this.fb.className='fb show ans';
  this.fb.innerHTML='<b>정답:</b> '+this.ansText()+(d.e?'<br>'+d.e:'')+this.sayHtml();
  this.aBtn.style.display='none';
  updateScores();
};
Q.prototype.reset=function(){
  var d=this.def,self=this;
  this.state='idle';this.card.className='q';this.lock(false);
  this.fb.className='fb';this.fb.innerHTML='';
  this.gBtn.style.display='';this.rBtn.style.display='none';this.aBtn.style.display='none';
  if(this.optEls)this.optEls.forEach(function(b){b.classList.remove('sel','right','wrong');});
  if(d.t==='mc')this.sel=null;
  if(d.t==='multi')this.sels={};
  if(d.t==='in')this.inputs.forEach(function(i){i.value='';i.classList.remove('right','wrong');});
  if(d.t==='ord'){
    this.placed.forEach(function(p){p.el.remove();p.src.classList.remove('used');});
    this.placed=[];this.slots.appendChild(this.hint);
  }
  updateScores();
};

      r.appendChild(ex);
    }
    w.appendChild(r);
  });
  return w;
}
function bFlip(blk){
  var w=el('div','box flip');
  var hd=el('div','row');hd.style.justifyContent='space-between';hd.style.marginBottom='6px';
  hd.appendChild(el('h3','sub',blk.title||''));
  var t=el('button','btn sm','뜻 모두 보기');t.type='button';
  t.addEventListener('click',function(){var on=!w.classList.contains('allon');w.classList.toggle('allon',on);w.querySelectorAll('.frow').forEach(function(r){r.classList.toggle('on',on);});t.textContent=on?'뜻 모두 가리기':'뜻 모두 보기';});
  hd.appendChild(t);w.appendChild(hd);
  if(blk.note)w.appendChild(el('div','tip',blk.note));
  blk.rows.forEach(function(rw){
    var r=el('div','frow');
    var a=el('div','fen');a.innerHTML='<span class="en">'+rw[0]+'</span>';
    a.appendChild(spkBtn(rw[0].replace(/<[^>]+>/g,'')));
    var b=el('button','btn sm ghost fbtn','뜻 ▾');b.type='button';
    b.addEventListener('click',function(){r.classList.toggle('on');});
    a.appendChild(b);r.appendChild(a);
    r.appendChild(el('div','fkr',rw[1]+(rw[2]?'<div class="fnote">'+rw[2]+'</div>':'')));
    w.appendChild(r);
  });
  return w;
}
document.addEventListener('click',function(e){
  var s=e.target.closest&&e.target.closest('[data-say]');
  if(s){speak(s.getAttribute('data-say'),s);return;}
  var rv=e.target.closest&&e.target.closest('.rv');
  if(rv){rv.classList.toggle('on');}
  var ra=e.target.closest&&e.target.closest('[data-rvall]');
  if(ra){var box=ra.closest('.box')||document;var list=box.querySelectorAll('.rv');var on=!ra.classList.contains('on');ra.classList.toggle('on',on);list.forEach(function(x){x.classList.toggle('on',on);});ra.textContent=on?'모두 가리기':'모두 보기';}
});

/* ---------- page ---------- */
function build(){
  document.title=D.title;
  var hd=el('header','top');
  hd.appendChild(el('div','brand',D.brand));
  hd.appendChild(el('h1','',D.title));
  hd.appendChild(el('div','sub',D.sub));
  var nav=el('nav','tabs');hd.appendChild(nav);
  document.body.appendChild(hd);
  var main=el('main');document.body.appendChild(main);
  D.tabs.forEach(function(tb,ti){
    TABQ.push([]);
    var t=el('button','tab'+(ti===0?' on':''),esc(tb.name)+'<span class="pg"></span>');t.type='button';t.dataset.i=ti;
    t.addEventListener('click',function(){go(ti);});
    nav.appendChild(t);
    var pn=el('section','panel'+(ti===0?' on':''));pn.dataset.i=ti;
    if(tb.intro)pn.appendChild(el('div','intro',tb.intro));
    tb.blocks.forEach(function(b){
      var node;
      if(b.k==='html')node=el('div','',b.html);
      else if(b.k==='h')node=el('h2','sec',b.html);
      else if(b.k==='words')node=bWords(b);
      else if(b.k==='qset')node=new QSet(b,ti).el;
      else if(b.k==='analysis')node=bAnalysis(b);
      else if(b.k==='script')node=bScript(b);
      else if(b.k==='tapfill')node=bTapfill(b);
      else if(b.k==='wordlist')node=bWordlist(b);
      else if(b.k==='flip')node=bFlip(b);
      if(node)pn.appendChild(node);
    });
    if(ti<D.tabs.length-1){
      var nx=el('div','row');nx.style.justifyContent='center';nx.style.marginTop='20px';
      var nb=el('button','btn','다음: '+esc(D.tabs[ti+1].name)+' →');nb.type='button';
      nb.addEventListener('click',function(){go(ti+1);});nx.appendChild(nb);pn.appendChild(nx);
    }
    main.appendChild(pn);
  });
  main.appendChild(el('div','foot',D.brand+' · '+D.title));
  updateScores();
}
function go(i){
  document.querySelectorAll('.tab').forEach(function(t){t.classList.toggle('on',+t.dataset.i===i);});
  document.querySelectorAll('.panel').forEach(function(p){p.classList.toggle('on',+p.dataset.i===i);});
  var t=document.querySelector('.tab[data-i="'+i+'"]');if(t&&t.scrollIntoView)try{t.scrollIntoView({inline:'center',block:'nearest'});}catch(e){}
  window.scrollTo(0,0);pageSound();
}
window.__L7={REG:REG,SETS:SETS,go:go,norm:norm,alts:alts};
build();
})();

</script>
