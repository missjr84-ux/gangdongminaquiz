<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>The Story of the Commons — 본문</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f5f4fa;--card:#fff;--card2:#eeecf7;
  --primary:#5b4fa8;--primary-lt:#ece9f8;--primary-dk:#3b2f8a;
  --accent:#e8a020;--accent-lt:#fef3dc;
  --text:#1a1a2e;--muted:#6b6880;--border:#d8d4ee;
  --ok:#1a7a3c;--ok-bg:#e8f5ec;--no:#c0392b;--no-bg:#fdecea;
  --info:#3a5fa8;--info-bg:#e8eef8;
  --mint:#dff5ec;--mint-t:#1d7a55;--sky:#e1effc;--sky-t:#2a64a8;
  --peach:#fde9df;--peach-t:#b5532a;--lav:#ece9f8;--lav-t:#5b4fa8;
  --r:12px;--shadow:0 2px 10px rgba(91,79,168,.10);
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:'Noto Sans KR',system-ui,sans-serif;background:var(--bg);color:var(--text);font-size:16px;line-height:1.65;-webkit-tap-highlight-color:transparent}
.en{font-family:'Noto Sans KR',system-ui,sans-serif}
header.top{background:linear-gradient(135deg,#3b2f8a,#7b6fd0);color:#fff;padding:16px 16px 0}
.top .brand{font-size:12px;opacity:.85;letter-spacing:.04em}
.top h1{font-size:21px;font-weight:800;margin:2px 0 2px}
.top .sub{font-size:13px;opacity:.9;margin-bottom:12px}
nav.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:12px;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;border:1.5px solid rgba(255,255,255,.45);background:rgba(255,255,255,.12);color:#fff;border-radius:999px;padding:7px 13px;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit;white-space:nowrap}
.tab.on{background:#fff;color:var(--primary-dk);border-color:#fff}
.tab .pg{font-size:11px;font-weight:700;margin-left:5px;opacity:.85}
main{max-width:780px;margin:0 auto;padding:16px 14px 80px}
.panel{display:none;animation:pin .25s ease}
.panel.on{display:block}
@keyframes pin{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.intro{background:var(--card);border:1px solid var(--border);border-left:4px solid var(--primary);border-radius:var(--r);padding:12px 14px;margin-bottom:14px;font-size:15px}
.intro b{color:var(--primary-dk)}
h2.sec{font-size:18px;font-weight:800;color:var(--primary-dk);margin:22px 2px 10px;display:flex;align-items:center;gap:8px}
h2.sec:first-child{margin-top:4px}
h3.sub{font-size:15.5px;font-weight:700;margin:14px 2px 8px;color:var(--primary)}
.box{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:14px;margin-bottom:12px;box-shadow:var(--shadow)}
.tip{background:var(--accent-lt);border:1px solid #f3d99a;border-radius:10px;padding:10px 12px;margin:10px 0;font-size:14.5px}
.tip b{color:#9a5b00}
.warn{background:var(--no-bg);border:1px solid #f2c4bd;border-radius:10px;padding:10px 12px;margin:10px 0;font-size:14.5px}
.warn b{color:var(--no)}
table.t{width:100%;border-collapse:collapse;font-size:14.5px;background:var(--card)}
table.t th{background:var(--primary-lt);color:var(--primary-dk);font-weight:700;padding:7px 6px;border:1px solid var(--border);text-align:left}
table.t td{padding:7px 6px;border:1px solid var(--border);vertical-align:top}
.tw{overflow-x:auto;border-radius:10px;margin-bottom:12px}
.badge{display:inline-block;font-size:11.5px;font-weight:700;border-radius:6px;padding:1px 7px;vertical-align:middle}
.b-mint{background:var(--mint);color:var(--mint-t)}.b-sky{background:var(--sky);color:var(--sky-t)}
.b-peach{background:var(--peach);color:var(--peach-t)}.b-lav{background:var(--lav);color:var(--lav-t)}
.b-amb{background:var(--accent-lt);color:#9a5b00}
.spk{border:none;background:var(--primary-lt);color:var(--primary);border-radius:8px;width:30px;height:30px;font-size:15px;cursor:pointer;flex:0 0 auto;line-height:30px;text-align:center}
.spk.playing{background:var(--primary);color:#fff}
.btn{border:1.5px solid var(--primary);background:#fff;color:var(--primary);border-radius:9px;padding:7px 13px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit}
.btn.fill{background:var(--primary);color:#fff}
.btn.sm{padding:4px 10px;font-size:13px}
.btn.ghost{border-color:var(--border);color:var(--muted)}
.btn:disabled{opacity:.45;cursor:default}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
/* word chips */
.wgrid{display:flex;flex-wrap:wrap;gap:6px}
.wchip{border:1px solid var(--border);background:var(--card);border-radius:9px;padding:5px 10px;font-size:14px;cursor:pointer}
.wchip b{color:var(--primary-dk)}
.wchip span{color:var(--muted);font-size:13px;margin-left:4px}
/* qset */
.qset{margin-bottom:18px}
.qhead{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;margin:18px 2px 10px}
.qhead h3{font-size:16.5px;font-weight:800;color:var(--primary-dk)}
.score{font-size:13px;font-weight:700;color:var(--primary);background:var(--primary-lt);border-radius:999px;padding:3px 10px}
.q{background:var(--card);border:1.5px solid var(--border);border-radius:var(--r);padding:13px 14px;margin-bottom:10px;box-shadow:var(--shadow)}
.q.ok{border-color:#8fd0a7;background:#fbfffc}
.q.no{border-color:#eba59c;background:#fffafa}
.qn{display:flex;gap:8px;align-items:flex-start;margin-bottom:8px}
.qn .num{flex:0 0 auto;background:var(--primary);color:#fff;font-weight:800;font-size:13px;border-radius:7px;min-width:26px;height:24px;line-height:24px;text-align:center;padding:0 5px;margin-top:2px}
.qn .qt{flex:1;font-weight:600;font-size:15.5px}
.qt u{text-decoration-thickness:2px;text-underline-offset:3px;text-decoration-color:var(--primary)}
.pass{background:var(--card2);border-radius:10px;padding:10px 12px;margin:6px 0 10px;font-size:15px;line-height:1.75}
.pass .ln{display:block}
.pass .sp{font-weight:800;color:var(--primary);margin-right:4px}
.pass u{text-decoration-thickness:2px;text-underline-offset:3px}
.mark{color:var(--primary);font-weight:800}
.opts{display:flex;flex-direction:column;gap:6px}
.opts.inline{flex-direction:row;flex-wrap:wrap}
.opt{text-align:left;border:1.5px solid var(--border);background:#fff;border-radius:10px;padding:8px 11px;font-size:15px;cursor:pointer;font-family:inherit;color:var(--text);line-height:1.5}
.opts.inline .opt{flex:0 0 auto}
.opt.sel{border-color:var(--primary);background:var(--primary-lt);font-weight:600}
.opt.right{border-color:var(--ok);background:var(--ok-bg)}
.opt.wrong{border-color:var(--no);background:var(--no-bg)}
.opt:disabled{cursor:default;color:var(--text)}
.blank{display:inline-block;min-width:70px;border:none;border-bottom:2px solid var(--primary);background:var(--primary-lt);border-radius:6px 6px 0 0;padding:2px 6px;margin:2px 2px;font-size:15px;font-family:inherit;color:var(--text);text-align:center}
.blank.wide{display:block;width:100%;text-align:left;margin:6px 0;padding:8px 10px;border-radius:8px;border:1.5px solid var(--border);border-bottom:2px solid var(--primary)}
.blank.right{background:var(--ok-bg);border-bottom-color:var(--ok)}
.blank.wrong{background:var(--no-bg);border-bottom-color:var(--no)}
.tmpl{font-size:15.5px;line-height:2.1}
.ordwrap{display:flex;flex-direction:column;gap:8px}
.slots{min-height:48px;border:2px dashed var(--border);border-radius:10px;padding:7px;display:flex;flex-wrap:wrap;gap:6px;background:#fcfbff}
.slots.block{flex-direction:column}
.slots .hint{color:var(--muted);font-size:13px;align-self:center;padding:4px}
.pool{display:flex;flex-wrap:wrap;gap:6px}
.pool.block{flex-direction:column}
.chip{border:1.5px solid var(--primary);background:#fff;color:var(--primary-dk);border-radius:9px;padding:6px 11px;font-size:15px;cursor:pointer;font-family:inherit;text-align:left;line-height:1.45}
.chip.used{visibility:hidden}
.slots .chip{background:var(--primary-lt)}
.chip:disabled{cursor:default}
.qfoot{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:10px}
.fb{margin-top:9px;border-radius:9px;padding:9px 11px;font-size:14.5px;display:none}
.fb.show{display:block}
.fb.ok{background:var(--ok-bg);color:#145c2e}
.fb.no{background:var(--no-bg);color:#8e2a1f}
.fb.ans{background:var(--info-bg);color:#24406f}
.fb b{font-weight:800}
.qbar{display:flex;gap:6px;flex-wrap:wrap;margin:4px 0 6px}
.sticky{position:sticky;bottom:10px;display:flex;justify-content:center;gap:8px;margin-top:6px;z-index:5}
.sticky .btn{box-shadow:0 4px 14px rgba(59,47,138,.25)}
/* analysis cards */
.acard{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:12px 13px;margin-bottom:9px;box-shadow:var(--shadow)}
.acard .kr{font-size:16px;font-weight:600}
.acard .kr .no{color:var(--primary);font-weight:800;margin-right:6px}
.chunks{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}
.ck{border:1.5px solid var(--border);border-radius:9px;padding:5px 9px;background:#fcfbff;cursor:pointer;font-size:14px;text-align:left;font-family:inherit;color:var(--text)}
.ck small{display:block;color:var(--primary);font-weight:800;font-size:11px}
.ck .ce{display:none;color:var(--primary-dk);font-weight:700}
.ck.open .ce{display:block}
.ck.open{border-color:var(--primary);background:var(--primary-lt)}
.aen{display:none;margin-top:9px;background:var(--card2);border-radius:9px;padding:8px 10px}
.aen.show{display:block}
.aen .s{font-size:16px;font-weight:700;color:var(--primary-dk)}
.aen .tp{font-size:14px;color:#6a4a00;margin-top:5px}
.parahead{background:var(--primary-lt);border-radius:10px;padding:9px 12px;margin:18px 0 9px;font-size:14.5px}
.parahead b{color:var(--primary-dk);font-size:15.5px}
/* dialogue script */
.script{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:12px 13px;margin-bottom:10px;box-shadow:var(--shadow)}
.script .shead{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px;flex-wrap:wrap}
.script .shead b{color:var(--primary-dk);font-size:15.5px}
.line{display:flex;gap:8px;align-items:flex-start;padding:5px 0;border-bottom:1px dashed #ebe8f5}
.line:last-child{border-bottom:none}
.line .who{flex:0 0 auto;min-width:24px;font-weight:800;color:var(--primary)}
.line .tx{flex:1}
.line .ko{display:none;color:var(--muted);font-size:14px}
.script.kr .line .ko{display:block}
/* tapfill */
.tf{font-size:16px;line-height:2.2}
.tfb{display:inline-block;min-width:56px;border-bottom:2px solid var(--primary);background:var(--primary-lt);border-radius:6px 6px 0 0;padding:0 7px;text-align:center;cursor:pointer;color:transparent;font-weight:700;user-select:none}
.tfb.next{animation:pulse 1.4s infinite}
.tfb.open{color:var(--primary-dk);background:#fff3c9;border-bottom-color:var(--accent);cursor:default}
.tfb.shake{animation:shake .3s}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(91,79,168,.35)}50%{box-shadow:0 0 0 5px rgba(91,79,168,0)}}
@keyframes shake{0%,100%{transform:none}25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.formula{background:var(--card);border:2px solid var(--primary);border-radius:var(--r);padding:14px;margin-bottom:12px;text-align:center;font-size:18px;font-weight:800;color:var(--primary-dk);line-height:1.8}
.formula .f{display:inline-block;border-radius:8px;padding:2px 8px;margin:2px}
.steps{counter-reset:st}
.step{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:11px 13px;margin-bottom:8px;box-shadow:var(--shadow)}
.step .h{font-weight:800;color:var(--primary-dk)}
.step .h .n{display:inline-block;background:var(--primary);color:#fff;border-radius:6px;font-size:12px;padding:1px 7px;margin-right:6px}
.foot{text-align:center;color:var(--muted);font-size:12px;margin-top:30px}
@media (max-width:480px){
  .top h1{font-size:19px}
  main{padding:12px 12px 80px}
  .opt,.chip{font-size:14.5px}
}
/* v2 additions */
.spk.mini{width:24px;height:24px;line-height:24px;font-size:12px;border-radius:6px;vertical-align:middle;margin-left:4px}
.wl .wrow{border-bottom:1px dashed #e4e0f3;padding:8px 2px}
.wl .wrow:last-child{border-bottom:none}
.wtop{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.wn{font-size:12px;color:var(--muted);min-width:20px}
.ww{font-size:16.5px;color:var(--primary-dk)}
.wm{color:var(--text);font-size:15px;border-radius:6px;padding:0 4px}
.wl.hidem .wm{background:var(--card2);color:transparent;cursor:pointer;min-width:90px;display:inline-block}
.wl.hidem .wm.on{background:#fff3c9;color:var(--text)}
.wex{margin:4px 0 0 28px}
.wen{display:flex;align-items:center;gap:6px;font-size:15px;cursor:pointer}
.wen .spk{width:26px;height:26px;line-height:26px;font-size:13px}
.wk{display:none;color:var(--muted);font-size:14px}
.wl.showk .wk,.wrow.kon .wk{display:block}
.flip .frow{border-bottom:1px dashed #e4e0f3;padding:7px 2px}
.flip .frow:last-child{border-bottom:none}
.fen{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:15.5px}
.fen .en{flex:1;min-width:180px}
.fkr{display:none;margin-top:4px;background:#fff8e6;border-radius:8px;padding:6px 9px;font-size:14.5px}
.frow.on .fkr{display:block}
.fnote{color:#8a5a00;font-size:13.5px;margin-top:2px}
.rv{background:var(--card2);color:transparent;border-radius:5px;cursor:pointer;padding:0 4px;user-select:none}
.rv.on{background:#fff3c9;color:inherit}
.fam{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.fam .fc{border:1px solid var(--border);border-radius:8px;padding:3px 8px;background:#fff;font-size:14px}
.fam .fc i{font-style:normal;color:var(--muted);font-size:12px;margin-right:3px}
.anal{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:13px 14px;margin-bottom:12px;box-shadow:var(--shadow);font-size:15px}
.anal h4{font-size:15.5px;color:var(--primary-dk);margin:10px 0 4px}
.anal h4:first-child{margin-top:0}
.anal ol,.anal ul{padding-left:20px}
.anal li{margin:3px 0}
details>summary{list-style:none;display:inline-block;cursor:pointer}
details>summary::-webkit-details-marker{display:none}
.pass.big{background:#fff;border:1.5px solid var(--border);font-size:15.5px;line-height:1.9;padding:12px 14px;position:sticky;top:0;z-index:3;max-height:42vh;overflow:auto;box-shadow:var(--shadow)}
.ref{color:var(--primary);font-weight:700;text-decoration:underline;text-decoration-style:dotted;text-underline-offset:3px;cursor:pointer;background:var(--primary-lt);border-radius:4px;padding:0 3px}
.refsheet{position:fixed;left:0;right:0;bottom:0;z-index:50;background:#fff;border-top:2px solid var(--primary);box-shadow:0 -6px 24px rgba(59,47,138,.18);max-height:55vh;display:none;flex-direction:column;border-radius:14px 14px 0 0}
.refsheet.show{display:flex}
.refsheet .rhead{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;border-bottom:1px solid var(--border)}
.refsheet .rhead b{color:var(--primary-dk)}
.refsheet .rclose{border:none;background:var(--primary-lt);color:var(--primary);border-radius:8px;width:32px;height:32px;font-size:16px;cursor:pointer}
.refsheet .rbody{overflow:auto;padding:8px 14px 16px;max-width:780px;width:100%;margin:0 auto}
.refsheet .rrow{padding:7px 0;border-bottom:1px dashed #e4e0f3}
.refsheet .rtop{display:flex;gap:8px;align-items:flex-start}
.refsheet .rn{flex:0 0 auto;background:var(--primary);color:#fff;font-weight:800;font-size:12px;border-radius:6px;padding:1px 7px;margin-top:3px}
.refsheet .ren{flex:1;font-weight:700;color:var(--primary-dk);font-size:15.5px}
.refsheet .rkr{color:var(--muted);font-size:14px;margin-left:34px}
.ref{white-space:nowrap}

</style>
</head>

<script>
window.DATA={"file":"storyofthecommonswriting.html","brand":"강동미나 중고등부 · 중3 Lesson 6","title":"The Story of the Commons — 본문","sub":"공유지 이야기 · 글 분석 → 어순 → 빈칸·어법 → 순서·삽입 → 내용확인 → 거꾸로 영작","tabs":[{"name":"🔍 한글 분석","intro":"<b>국어 독해하듯이 분석해요.</b> ① 글의 구조(서론·본론·결론) → ② 주제문 → ③ 근거 문장 → ④ 이기심과 대비 → ⑤ 연결어 → ⑥ 핵심 문법 → ⑦ 문장별 한글 분석. <b>번호(예: 45번)를 누르면 영어 원문이 아래에 떠요.</b>","blocks":[{"k":"h","html":"① 글의 구조 — 서론 · 본론 · 결론"},{"k":"html","html":"<div class=\"anal\">\n<div class=\"tw\"><table class=\"t\">\n<tr><th style=\"white-space:nowrap\">구분</th><th style=\"white-space:nowrap\">문장</th><th>내용</th><th>역할</th></tr>\n<tr><td><b>서론</b></td><td>1~10번</td><td>숲속 마을, 공유 목초지, \"한 가족 한 소\" 전통 → 풀이 넉넉하고 여름 내내 푸름</td><td>규칙이 지켜질 때의 <b>평화로운 모습</b> (나중의 비극과 대비하려고 먼저 보여 줌)</td></tr>\n<tr><td rowspan=\"3\"><b>본론</b></td><td>11~29번</td><td>한 농부가 몰래 소를 한 마리 더 → 친구에게 알려 줌 → 곧 모두가 따라 함</td><td><b>문제의 시작과 확산</b> — 이기심이 나 → 친구 → 모두로 번짐</td></tr>\n<tr><td>30~40번</td><td>소가 늘어남 → 풀이 사라짐 → 가뭄까지 → 풀이 하나도 없음 → 많은 소가 죽음</td><td><b>위기·비극</b> — 이기심의 결과</td></tr>\n<tr><td>41~44번</td><td>\"가족당 소 한 마리만\" → 풀이 돌아옴 → 규칙으로 복귀</td><td><b>해결</b> — 규칙을 지키자 회복</td></tr>\n<tr><td><b>결론</b></td><td>45~47번</td><td>교훈 → 아이들에게 이 이야기를 들려줌</td><td><b>주제 제시</b> + 교훈을 다음 세대에 전함</td></tr>\n</table></div>\n<div class=\"tip\"><b>이 글은 우화(fable)</b> — \"Once upon a time\"으로 시작하는 지어낸 이야기 + 말하는 소 + 마지막에 교훈. 우화는 <b>교훈(주제문)이 맨 끝</b>에 나오는 미괄식이 많아요.</div>\n</div>"},{"k":"h","html":"② 주제문 찾기"},{"k":"html","html":"<div class=\"anal\">\n<h4>📌 주제문 = 45번</h4>\n\"마을 사람들은 모두 중요한 교훈을 배웠다. <b>자원이 공유될 때는 모두가 그 자원을 소중히 여기고 공정하게 사용하는 것이 중요하다.</b>\"\n<h4>📌 왜 45번이 주제문일까?</h4>\n<ol><li><b>an important lesson:</b> — \"중요한 교훈\" 뒤의 콜론(:)이 \"이제 교훈을 말할게요\"라는 신호예요. 콜론 뒤 내용이 교훈 그 자체.</li>\n<li><b>일반적인 말</b> — 소·풀 같은 구체적인 이야기가 아니라 resources(자원), everyone(모두)처럼 <b>누구에게나 해당되는 말</b>로 바뀌었어요. 주제문은 이렇게 넓은 말로 써요.</li>\n<li><b>앞의 모든 사건이 이 문장의 근거</b> — 규칙을 지킬 때 풍족(서론), 깨뜨리자 비극(본론), 다시 지키자 회복(해결).</li></ol>\n<h4>📌 한 줄 요약</h4>\n나 하나쯤이야 하는 이기심이 모이면 모두의 자원이 사라진다 → 함께 쓰는 자원은 모두가 아끼고 공정하게 써야 한다.\n<div class=\"tip\"><b>참고</b> — 이런 현상을 사회 교과서에서 <b>공유지의 비극(the tragedy of the commons)</b>이라고 불러요. 모두가 쓰는 자원을 각자 자기 이익만 생각해 쓰다가 결국 모두 손해를 보는 것.</div>\n</div>"},{"k":"flip","title":"주제문 영어로 바꿔 쓰기 — 시험에 이렇게 나와요","note":"주제·요지 선택지는 본문 문장 그대로가 아니라 <b>다른 표현으로 바꿔서</b> 나와요. 🔊 듣고 뜻 떠올리기!","rows":[["When resources are shared, it is important for everyone to value the resources and use them fairly.","자원이 공유될 때는 모두가 그것을 소중히 여기고 공정하게 쓰는 것이 중요하다.","본문 45번 원문"],["Shared resources should be used fairly by everyone.","공유 자원은 모두에 의해 공정하게 사용되어야 한다.","수동태로 바꾼 표현"],["Everyone should take care of the things they share.","모두가 함께 쓰는 것을 소중히 다뤄야 한다.","value → take care of"],["If everyone takes a little more, everyone will lose in the end.","모두가 조금씩 더 가지면 결국 모두가 잃게 된다.","결과를 강조한 표현"],["Don't be greedy when you use things together.","함께 쓰는 것을 사용할 때 욕심부리지 마라.","명령문 표현"],["Thinking only of yourself can hurt everyone.","자기만 생각하는 것은 모두를 해칠 수 있다.","이기심 → 모두의 피해"],["Rules for shared things protect everyone.","공유하는 것에 대한 규칙은 모두를 보호한다.","규칙의 중요성"],["The Tragedy of the Commons","공유지의 비극","제목 / 개념 이름"]]},{"k":"h","html":"③ 근거 문장 찾기 — 주제를 뒷받침하는 문장"},{"k":"html","html":"<div class=\"anal\">\n<div class=\"tw\"><table class=\"t\">\n<tr><th style=\"white-space:nowrap\">근거</th><th style=\"white-space:nowrap\">문장</th><th>내용</th><th>주제와의 연결</th></tr>\n<tr><td>① 규칙을 지키면 풍족</td><td>6, 9, 10번</td><td>모든 소에게 충분한 양 / 한 가족 한 소라 풀 찾기 쉬움 / 여름 내내 푸름</td><td>공정하게 쓰면 모두 넉넉하다</td></tr>\n<tr><td>② 이기심이 규칙을 깸</td><td>11, 13, 15, 25, 27번</td><td>더 부자가 되고 싶다 / 규칙을 깸 / 아무도 모를 거야 / 제일 부자 / 훨씬 더 많이 몰래</td><td>자원을 \"소중히·공정하게\" 쓰지 않은 모습</td></tr>\n<tr><td>③ 그 결과 모두 손해</td><td>34, 39, 40번</td><td>풀이 사라짐 / 풀이 하나도 남지 않음 / 많은 소가 죽음</td><td>공정하게 쓰지 않으면 모두가 잃는다</td></tr>\n<tr><td>④ 규칙으로 돌아가자 회복</td><td>41~44번</td><td>가족당 한 마리 → 풀이 돌아옴 → 규칙 복귀</td><td>공정한 사용이 해결책이다</td></tr>\n</table></div>\n<div class=\"warn\"><b>함정!</b> 35번 \"비가 오지 않았다\"는 <b>진짜 원인이 아니에요.</b> \"엎친 데 덮친 격으로(To make matters worse)\" = 원래 나쁜 상황에 더해진 불운. 풀이 없어진 진짜 이유는 39번 <b>because there were too many cows</b>(소가 너무 많아서).</div>\n</div>"},{"k":"h","html":"④ 이기심을 드러내는 문장 · 대비되는 표현"},{"k":"html","html":"<div class=\"anal\">\n<h4>📌 이기심을 드러내는 문장</h4>\n<div class=\"tw\"><table class=\"t\">\n<tr><th style=\"white-space:nowrap\">문장</th><th>한글</th><th>드러나는 마음</th></tr>\n<tr><td>11번</td><td>소가 두 마리 있다면 더 부유할 텐데</td><td>더 부자가 되고 싶은 <b>욕심</b> (비교급 richer)</td></tr>\n<tr><td>12, 15번</td><td>아무도 눈치채지 못할 거야</td><td><b>나 하나쯤이야</b> — 들키지만 않으면 돼</td></tr>\n<tr><td>16번</td><td>두 번째 소가 <b>자기 가족에게</b> 가져다줄 우유와 치즈</td><td>공동체가 아니라 <b>자기 가족만</b> 생각</td></tr>\n<tr><td>25번</td><td>이 마을에서 <b>가장</b> 부유한 농부가 될 수 있어</td><td>남보다 앞서려는 <b>경쟁심</b> (최상급 the richest)</td></tr>\n<tr><td>27번</td><td><b>훨씬 더</b> 많이, <b>아무에게도 말하지 않고</b></td><td>욕심이 커지고, 잘못인 줄 알면서 <b>몰래</b></td></tr>\n<tr><td>28번</td><td>추가된 소들에게도 풀이 충분할 거라고 생각</td><td>15번(그 혼자) → 28번(그들 모두): \"괜찮겠지\"가 <b>모두에게 퍼짐</b></td></tr>\n<tr><td>30번</td><td>저리 비켜! 여긴 <b>내</b> 자리야!</td><td>소들까지 \"내 것\" 다툼 — 이기심이 퍼진 결과</td></tr>\n</table></div>\n<div class=\"tip\"><b>욕심이 커지는 단계</b> — another cow(14번) → one more cow(21번) → one more cow / <b>even more</b>(27번). 한 마리에서 \"훨씬 더\"로!<br><b>겉은 친절, 속은 문제</b> — 21번 \"친구를 돕고 싶어서\"는 착한 마음 같지만, 규칙을 깨는 방법을 몰래 알려 준 것이라 공동체에는 해가 돼요.</div>\n<h4>📌 대비되는 표현 — 앞(규칙이 있을 때) ↔ 뒤(규칙이 깨진 뒤)</h4>\n<div class=\"tw\"><table class=\"t\">\n<tr><th>앞</th><th>뒤</th><th>무엇이 바뀌었나</th></tr>\n<tr><td>4번 Let's <b>share</b> the commons. (우리 함께)</td><td>30번 This is <b>my</b> spot! (내 것)</td><td>우리 → 나</td></tr>\n<tr><td>6번 <b>plenty</b> for every cow</td><td>39번 <b>no grass</b> was left</td><td>넉넉함 → 하나도 없음</td></tr>\n<tr><td>9번 it was <b>easy</b> ~ to find enough grass</td><td>34번 it became <b>harder</b> ~ to find grass</td><td>쉬움 → 어려움 (같은 문장 틀!)</td></tr>\n<tr><td>10번 green <b>all summer long</b></td><td>34번 began to <b>disappear</b></td><td>푸름 → 사라짐</td></tr>\n<tr><td>5번 My cow can get <b>enough</b> grass.</td><td>31번 I'm <b>hungry</b>.</td><td>충분 → 배고픔</td></tr>\n<tr><td>29번 <b>happy-looking</b> farmers</td><td>40번 Things were <b>harsh</b>; many cows <b>died</b>.</td><td>행복해 <b>보임</b> → 혹독한 현실</td></tr>\n<tr><td>11, 25번 <b>richer</b> / <b>the richest</b></td><td>36번 I don't have <b>any cows left</b>!</td><td>부자의 꿈 → 소를 다 잃음 (<b>가장 큰 아이러니</b>)</td></tr>\n<tr><td>38번 <b>In the past</b>, ~ <b>always</b> found something to eat</td><td>39번 <b>However</b>, no grass was left <b>now</b></td><td>과거 ↔ 지금</td></tr>\n<tr><td>32번 <b>slowly</b> at first</td><td>33번 <b>more quickly</b></td><td>천천히 → 더 빨리</td></tr>\n<tr><td>15번 <b>nobody</b> would notice (나 하나)</td><td>45번 for <b>everyone</b> (모두)</td><td>나 하나쯤 → 모두의 책임</td></tr>\n</table></div>\n<div class=\"tip\"><b>표현 패턴</b> — 욕심은 <b>비교급·최상급</b>(richer, the richest, even more)으로, 결과는 <b>부정어</b>(no grass, not any cows left)로 나타나요.</div>\n</div>"},{"k":"h","html":"⑤ 연결어 — 앞 문장과 뒤 문장을 어떻게 잇나"},{"k":"html","html":"<div class=\"anal\">\n<div class=\"tw\"><table class=\"t\">\n<tr><th style=\"white-space:nowrap\">연결어</th><th style=\"white-space:nowrap\">문장</th><th>앞 내용</th><th>뒤 내용</th><th style=\"white-space:nowrap\">관계</th></tr>\n<tr><td>Luckily 다행히</td><td>3번</td><td>소를 기르는 농부들</td><td>마을 한가운데 좋은 목초지가 있었다</td><td>좋은 조건</td></tr>\n<tr><td>Therefore 그러므로</td><td>8번</td><td>모두가 사용하도록 허락됨</td><td>\"공유지\"라고 불렸다</td><td>이유 → 결과</td></tr>\n<tr><td>so 그래서</td><td>9번</td><td>각 가정은 소가 한 마리만</td><td>풀을 찾기 쉬웠다</td><td>원인 → 결과</td></tr>\n<tr><td>But one day 그러나 어느 날</td><td>13번</td><td>평화로운 공유지</td><td>한 사람이 규칙을 깼다</td><td><b>반전</b></td></tr>\n<tr><td>A few days later 며칠 후</td><td>20번</td><td>농부가 소를 한 마리 더</td><td>친구에게 같은 방법을 알려 줌</td><td>시간 흐름 (확산)</td></tr>\n<tr><td>Soon 곧</td><td>26번</td><td>친구도 따라 함</td><td>다른 사람들도 똑같이 함</td><td>시간 흐름 (확산)</td></tr>\n<tr><td>while 반면에</td><td>27번</td><td>어떤 사람들은 한 마리 더</td><td>다른 사람들은 훨씬 더 많이</td><td>대조</td></tr>\n<tr><td>at first → Then 처음에는 → 그러더니</td><td>32, 33번</td><td>천천히 늘어남</td><td>더 빨리 늘어남</td><td>속도 변화</td></tr>\n<tr><td>To make matters worse 엎친 데 덮친 격으로</td><td>35번</td><td>풀이 사라지기 시작</td><td>비도 오지 않았다</td><td>나쁜 일 + 나쁜 일</td></tr>\n<tr><td>In the past ↔ However 과거에는 ↔ 하지만</td><td>38, 39번</td><td>가뭄에도 늘 먹을 것이 있었다</td><td>지금은 풀이 하나도 없다</td><td><b>대조</b></td></tr>\n<tr><td>At last 마침내</td><td>42번</td><td>규칙 표지판</td><td>풀이 돌아왔다</td><td>오래 기다린 결과</td></tr>\n</table></div>\n<div class=\"tip\"><b>순서·삽입 문제 푸는 법</b> — 연결어의 \"관계\"를 보고 앞에 올 내용을 떠올리세요. 예: However가 보이면 앞에는 <b>반대</b> 내용(38번 In the past)이 있어야 해요.</div>\n</div>"},{"k":"h","html":"⑥ 핵심 문법이 들어간 표현"},{"k":"html","html":"<div class=\"anal\">\n<div class=\"tw\"><table class=\"t\">\n<tr><th>문법</th><th style=\"white-space:nowrap\">문장</th><th>표현</th><th>포인트</th></tr>\n<tr><td>가정법 과거</td><td>11, 18, 21번</td><td>If I <b>had</b> two cows, I <b>would</b> be richer. / If I <b>were</b> you, I <b>would</b> raise ~</td><td>지금 사실과 반대. If + <b>과거동사</b>, would + 동사원형. be동사는 <b>were</b></td></tr>\n<tr><td>가주어 it + for + to부정사</td><td>9, 34, 45번</td><td><b>it</b> was easy <b>for</b> each cow <b>to find</b> ~</td><td>for 뒤가 의미상 주어. 9번 ↔ 34번 짝꿍</td></tr>\n<tr><td>사역동사 let</td><td>14번</td><td><b>let</b> it <b>graze</b></td><td>let + 목적어 + <b>동사원형</b> (to graze ✗)</td></tr>\n<tr><td>목적격 관계대명사</td><td>16번</td><td>the milk and cheese <b>that</b> the second cow would bring</td><td>that 생략 가능</td></tr>\n<tr><td>주격 관계대명사</td><td>20번</td><td>a close friend <b>who</b> had four children</td><td>사람 → who</td></tr>\n<tr><td>수동태</td><td>7, 8, 22, 45번</td><td><b>was allowed to</b> / <b>was called</b> / <b>was told</b> / <b>are shared</b></td><td>be + p.p.</td></tr>\n<tr><td>Some ~ others ~ / even + 비교급</td><td>27번</td><td><b>Some</b> ~ while <b>others</b> brought <b>even more</b></td><td>even = 훨씬 (very ✗)</td></tr>\n<tr><td>without + 동명사</td><td>27번</td><td><b>without telling</b> anyone</td><td>전치사 뒤 -ing</td></tr>\n<tr><td>the number of</td><td>32번</td><td><b>The number of</b> cows <b>rose</b></td><td>단수 취급 / rise-rose-risen</td></tr>\n<tr><td>stop + -ing</td><td>30번</td><td><b>stop pushing</b> me</td><td>~하는 것을 멈추다</td></tr>\n<tr><td>-thing + to부정사</td><td>38번</td><td><b>something to eat</b></td><td>뒤에서 꾸밈</td></tr>\n<tr><td>lie-lay / raise-rose 구별</td><td>2, 3, 32번</td><td><b>raised</b> cows / grassland <b>lay</b> / <b>rose</b> slowly</td><td>목적어 있으면 raise, 없으면 rise</td></tr>\n<tr><td>tell A to B / call A B</td><td>46, 47번</td><td><b>tell</b> this story <b>to</b> their children / <b>call</b> it \"~\"</td><td>4형식 ↔ 3형식 전환</td></tr>\n</table></div>\n</div>"},{"k":"qset","title":"분석 확인 문제","note":"위 분석을 읽었으면 바로 확인! 번호를 눌러 원문을 다시 봐도 돼요.","qs":[{"t":"mc","q":"이 글의 주제문은 몇 번 문장인가?","o":["4번","9번","15번","39번","45번"],"a":4,"e":"an important lesson: 뒤가 교훈 = 주제문."},{"t":"mc","q":"주제문과 의미가 가장 가까운 것은?","o":["More cows make farmers richer.","Shared resources should be used fairly by everyone.","Farmers need rain to grow grass.","Old traditions must always change.","Good friends share their secrets."],"a":1,"e":"45번을 수동태로 바꾼 표현."},{"t":"multi","q":"\"나 하나쯤이야\"라는 이기심이 드러난 문장을 <b>모두</b> 고르시오.","o":["No one will notice it.","Everyone was allowed to use the grassland.","He thought that nobody would notice it.","The grass on the commons was green all summer long.","I can be the richest farmer in this village."],"a":[0,2,4],"e":"12, 15번(아무도 모를 것), 25번(제일 부자)."},{"t":"mc","q":"9번 문장과 대비되도록 같은 틀로 쓰인 문장은?","o":["10번 The grass was green all summer long.","29번 Soon the village was full of happy-looking farmers!","34번 ... it became harder for the cows to find grass to eat.","42번 At last, the grass came back.","45번 ... it is important for everyone ..."],"a":2,"e":"it was easy for ~ to find ↔ it became harder for ~ to find."},{"t":"mc","q":"공유지의 풀이 하나도 남지 않은 <b>가장 큰 원인</b>은?","o":["비가 오래 오지 않아서","여름이 너무 길어서","소가 너무 많아져서","마을 사람들이 풀을 팔아서","전통이 바뀌어서"],"a":2,"tag":"함정","e":"39번 because there were too many cows. 가뭄은 엎친 데 덮친 추가 불운."},{"t":"mc","q":"본론에 해당하지 <b>않는</b> 내용은?","o":["한 농부가 몰래 소를 한 마리 더 데려왔다.","다른 사람들도 똑같이 했다.","풀이 사라지고 소들이 죽었다.","마을이 다시 한 가족 한 소 규칙으로 돌아갔다.","모두가 자원을 공정하게 써야 한다는 교훈을 배웠다."],"a":4,"e":"교훈(45번)은 결론."}]},{"k":"h","html":"⑦ 문단별 흐름 · 문장별 한글 분석"},{"k":"analysis","paras":[{"title":"평화로운 공유지 (1~10) — 규칙이 있을 때","flow":"배경(숲속 작은 마을, 소를 기르는 농부들) → <b>\"다행히도\"</b> 마을 가운데 좋은 목초지 → 모두 사용 허락 → <b>\"그러므로\"</b> \"공유지\"라 불림 → 전통에 따라 한 가족 한 소 → 소들이 풀 찾기 쉬움 → 여름 내내 푸름<br>💡 규칙(한 가족 한 소) 덕분에 모두 행복했다는 것을 먼저 보여 줘야 뒤의 비극이 대비돼요.","items":[{"n":1,"kr":"옛날에 숲속에 작은 마을이 있었다.","en":"Once upon a time there was a small village in a forest.","ch":[["Once upon a time","옛날에"],["there was","~이 있었다"],["a small village","작은 마을"],["in a forest.","숲속에"]],"tip":"There was + 단수 명사. 장소(\"숲속에\")는 맨 뒤로."},{"n":2,"kr":"마을 주민들은 농부였고 소를 길렀다.","en":"The villagers were farmers and raised cows.","ch":[["The villagers","마을 주민들은"],["were farmers","농부였다"],["and","그리고"],["raised cows.","소를 길렀다"]],"tip":"were와 raised가 and로 병렬. raise(기르다)-raised — rise(오르다)-rose와 구별!"},{"n":3,"kr":"다행히도, 마을 한가운데에 좋은 목초지가 있었다.","en":"Luckily, some good grassland lay in the middle of the village.","ch":[["Luckily,","다행히도"],["some good grassland","좋은 목초지가"],["lay","(놓여) 있었다"],["in the middle of the village.","마을 한가운데에"]],"tip":"lie(놓여 있다)-<b>lay</b>-lain. lay(놓다)-laid와 헷갈리지 말기."},{"n":4,"kr":"\"공유지를 함께 나누어 씁시다.\"","en":"\"Let's share the commons.\"","ch":[["Let's share","함께 나누어 씁시다"],["the commons","공유지를"]],"tip":"Let's + 동사원형."},{"n":5,"kr":"\"내 소가 풀을 충분히 뜯을 수 있겠어.\"","en":"\"My cow can get enough grass.\"","ch":[["My cow","내 소가"],["can get","얻을 수 있다"],["enough grass","충분한 풀을"]],"tip":"enough + 명사 (enough grass)."},{"n":6,"kr":"\"맞아, 모든 소에게 충분한 양이야.\"","en":"\"Yeah, there's plenty for every cow.\"","ch":[["Yeah,","맞아"],["there's plenty","충분한 양이 있다"],["for every cow","모든 소에게"]],"tip":"every + <b>단수</b> 명사 (every cows ✗)."},{"n":7,"kr":"모든 사람들이 목초지를 사용하도록 허락되었다.","en":"Everyone was allowed to use the grassland.","ch":[["Everyone","모든 사람이"],["was allowed to","~하도록 허락되었다"],["use the grassland.","목초지를 사용하다"]],"tip":"be allowed to + 동사원형. Everyone은 단수 → was."},{"n":8,"kr":"그러므로 목초지는 '공유지'라고 불렸다.","en":"Therefore, it was called \"the commons.\"","ch":[["Therefore,","그러므로"],["it","그것(목초지)은"],["was called","불렸다"],["\"the commons.\"","'공유지'라고"]],"tip":"be called + 명사: ~라고 불리다 (call A B의 수동태). it = the grassland."},{"n":9,"kr":"전통에 따라 각 가정은 소가 한 마리만 있었고, 그래서 마을에 있는 각 소가 먹을 풀을 충분히 찾는 것은 쉬웠다.","en":"By tradition, each family only had one cow, so it was easy for each cow in the village to find enough grass to eat.","ch":[["By tradition,","전통에 따라"],["each family only had one cow,","각 가정은 소가 한 마리만 있었다"],["so","그래서"],["it was easy","(~하는 것은) 쉬웠다"],["for each cow in the village","마을의 각 소가"],["to find enough grass to eat.","먹을 풀을 충분히 찾는 것"]],"tip":"가주어 <b>it</b> + 의미상 주어 <b>for</b> ~ + 진주어 <b>to부정사</b>. grass to eat: 뒤에서 꾸미는 to부정사. 34번과 짝꿍 문장!"},{"n":10,"kr":"공유지의 풀은 여름 내내 푸르렀다.","en":"The grass on the commons was green all summer long.","ch":[["The grass on the commons","공유지의 풀은"],["was green","푸르렀다"],["all summer long.","여름 내내"]],"tip":"주어는 The grass(단수) → was. on the commons는 꾸밈말."}]},{"title":"한 사람의 욕심 (11~22) — 규칙이 깨지다","flow":"말풍선(더 부자가 되고 싶다, 아무도 모를 것) → <b>\"그러나 어느 날\"</b> 규칙을 깸 → 소를 한 마리 더 데려옴 → 아무도 모를 거라 생각 → 우유와 치즈 생각에 행복 → 아이가 넷인 친구 생각 → <b>\"며칠 후\"</b> 친구에게 몰래 같은 방법을 알려 줌 → 친구도 들은 대로 함<br>💡 욕심이 \"나 → 친구\"로 번지는 첫 단계. \"몰래(in secret)\"라는 말이 규칙을 깨는 일임을 알고 있었다는 걸 보여 줘요.","items":[{"n":11,"kr":"\"만약 내게 소가 두 마리 있다면, 나는 더 부유할 텐데.\"","en":"\"If I had two cows, I would be richer.\"","ch":[["If I had two cows,","만약 내게 소가 두 마리 있다면"],["I would be richer.","나는 더 부유할 텐데"]],"tip":"가정법 과거: If + 주어 + <b>과거동사</b>, 주어 + <b>would</b> + 동사원형 (지금 사실과 반대)."},{"n":12,"kr":"\"아무도 눈치채지 못할 거야.\"","en":"\"No one will notice it.\"","ch":[["No one","아무도 ~않다"],["will notice","알아챌 것이다"],["it","그것을"]],"tip":"No one 자체가 부정 → not을 또 쓰지 않음."},{"n":13,"kr":"그러나 어느 날 마을 사람 하나가 규칙을 깨뜨렸다.","en":"But one day a villager broke the rule.","ch":[["But","그러나"],["one day","어느 날"],["a villager","마을 사람 하나가"],["broke the rule.","규칙을 깨뜨렸다"]],"tip":"연결어 But: 평화로운 이야기 → 반전 시작. break-broke-broken."},{"n":14,"kr":"그는 소를 한 마리 더 데려와 공유지에서 풀을 뜯게 했다.","en":"He brought another cow and let it graze on the commons.","ch":[["He brought another cow","그는 소를 한 마리 더 데려왔다"],["and let it","그리고 그것이 ~하게 했다"],["graze","풀을 뜯다"],["on the commons.","공유지에서"]],"tip":"사역동사 let + 목적어 + <b>동사원형</b> (to graze ✗). it = another cow."},{"n":15,"kr":"그는 아무도 그것을 눈치채지 못할 것이라고 생각했다.","en":"He thought that nobody would notice it.","ch":[["He thought","그는 생각했다"],["that","~라고"],["nobody would notice","아무도 알아채지 못할 것이다"],["it.","그것을"]],"tip":"thought(과거) → would(시제 일치). that 생략 가능."},{"n":16,"kr":"두 번째 소가 가족에게 가져다줄 우유와 치즈를 생각하자 그의 마음은 행복감으로 가득 찼다.","en":"A happy feeling filled his heart when he thought of the milk and cheese that the second cow would bring to his family.","ch":[["A happy feeling","행복한 감정이"],["filled his heart","그의 마음을 채웠다"],["when he thought of","그가 ~을 생각했을 때"],["the milk and cheese","우유와 치즈"],["that the second cow would bring to his family.","두 번째 소가 가족에게 가져다줄"]],"tip":"한글은 \"가져다줄 우유와 치즈\"(꾸밈이 앞), 영어는 명사 <b>뒤</b>에 that절(목적격 관계대명사, 생략 가능)."},{"n":17,"kr":"'그는 아이가 네 명이나 있어.'","en":"'He has four children.'","ch":null,"tip":""},{"n":18,"kr":"\"내가 당신이라면, 소를 한 마리 더 기르겠어요.\"","en":"\"If I were you, I would raise another cow.\"","ch":[["If I were you,","내가 당신이라면"],["I would raise","나는 기를 텐데"],["another cow.","소를 한 마리 더"]],"tip":"가정법 과거의 be동사는 주어와 상관없이 <b>were</b> (If I was ✗ — 시험 기준)."},{"n":19,"kr":"\"조언 고마워요!\"","en":"\"Thanks for the tip!\"","ch":[["Thanks","고마워요"],["for the tip!","조언에 대해"]],"tip":"Thanks for + 명사."},{"n":20,"kr":"며칠 후, 그 농부는 아이가 네 명 있는 친한 친구를 방문했다.","en":"A few days later, the farmer visited a close friend who had four children.","ch":[["A few days later,","며칠 후"],["the farmer visited","그 농부는 방문했다"],["a close friend","친한 친구를"],["who had four children.","아이가 네 명 있는"]],"tip":"주격 관계대명사 who: 한글 \"아이가 네 명 있는\"(앞) → 영어는 friend <b>뒤</b>."},{"n":21,"kr":"그는 친구를 돕고 싶어서 몰래 그에게 말했다. \"내가 당신이라면, 소를 한 마리 더 데려와서 공유지에서 키우겠어요.\"","en":"He wanted to help his friend, so he told him in secret, \"If I were you, I would bring in one more cow and raise it on the commons.\"","ch":[["He wanted to help his friend,","그는 친구를 돕고 싶었다"],["so he told him in secret,","그래서 그에게 몰래 말했다"],["If I were you,","내가 당신이라면"],["I would bring in one more cow","소를 한 마리 더 데려오겠어요"],["and raise it on the commons.","그리고 공유지에서 그것을 키우겠어요"]],"tip":"in secret = secretly(몰래). 가정법 과거 were / would."},{"n":22,"kr":"친구는 그에게 고마워했고 다음 날 자신이 들은 대로 했다.","en":"The friend thanked him and did as he was told the next day.","ch":[["The friend thanked him","친구는 그에게 고마워했다"],["and did","그리고 했다"],["as he was told","그가 들은 대로"],["the next day.","다음 날"]],"tip":"as = ~대로. did = 소를 한 마리 더 데려왔다. be told: (말을) 듣다."}]},{"title":"모두의 욕심 (23~35) — 공유지가 무너지다","flow":"소들의 말풍선(새로 왔어) → <b>\"곧\"</b> 다른 사람들도 똑같이 함 → 몰래 한 마리 더, 훨씬 더 많이 → 풀이 충분할 거라 생각 → 행복해 보이는 농부들 → 붐비는 소들(\"밀지 마!\", \"배고파\") → <b>\"처음에는\"</b> 천천히, <b>\"그러더니\"</b> 더 빨리 소가 늘어남 → 풀이 사라짐 → <b>\"엎친 데 덮친 격으로\"</b> 비도 안 옴<br>💡 34번은 9번을 뒤집은 문장: 쉬웠다 → 더 어려워졌다.","items":[{"n":23,"kr":"\"넌 누구니?\" \"난 새로 왔어.\"","en":"\"Who are you?\" \"I'm new.\"","ch":null,"tip":"새로 온 소들끼리 나누는 말 — 소가 늘어나고 있다는 신호."},{"n":24,"kr":"\"누가 저기 누워 있는 거야?\" \"몰라.\"","en":"\"Who is lying there?\" \"I don't know.\"","ch":null,"tip":"lie(눕다)-lay-lain, 현재분사 <b>lying</b>."},{"n":25,"kr":"\"내가 이 마을에서 가장 부유한 농부가 될 수 있어.\"","en":"\"I can be the richest farmer in this village.\"","ch":[["I can be","나는 될 수 있다"],["the richest farmer","가장 부유한 농부"],["in this village.","이 마을에서"]],"tip":"최상급 the + -est + in 장소."},{"n":26,"kr":"곧, 다른 마을 사람들도 똑같이 했다.","en":"Soon, other villagers did the same.","ch":[["Soon,","곧"],["other villagers","다른 마을 사람들도"],["did the same.","똑같이 했다"]],"tip":"did the same = 소를 한 마리 더 데려와 공유지에서 길렀다."},{"n":27,"kr":"어떤 사람들은 몰래 소를 한 마리 더 공유지에 데려왔고, 다른 사람들은 아무에게도 말하지 않고 훨씬 더 많은 소를 목초지에 데려왔다.","en":"Some secretly brought one more cow to the commons while others brought even more to the grassland without telling anyone.","ch":[["Some","어떤 사람들은"],["secretly brought one more cow","몰래 소를 한 마리 더 데려왔다"],["to the commons","공유지에"],["while others","반면 다른 사람들은"],["brought even more","훨씬 더 많이 데려왔다"],["to the grassland","목초지에"],["without telling anyone.","아무에게도 말하지 않고"]],"tip":"Some ~, others ~ (일부는 ~, 다른 일부는 ~). <b>even</b> + 비교급(훨씬). without + <b>-ing</b>."},{"n":28,"kr":"그들은 추가된 소들에게도 풀이 충분할 것이라고 생각했다.","en":"They thought that there would be enough grass for the additional cows.","ch":[["They thought","그들은 생각했다"],["that","~라고"],["there would be enough grass","풀이 충분히 있을 것이다"],["for the additional cows.","추가된 소들을 위한"]],"tip":"시제 일치 thought → would. additional = extra."},{"n":29,"kr":"곧 마을은 행복해 보이는 농부들로 가득 찼다!","en":"Soon the village was full of happy-looking farmers!","ch":[["Soon","곧"],["the village","마을은"],["was full of","~로 가득 찼다"],["happy-looking farmers!","행복해 보이는 농부들"]],"tip":"be full of = be filled with."},{"n":30,"kr":"\"이봐, 밀지 마!\" \"저리 비켜!\" \"여긴 내 자리야!\"","en":"\"Hey, stop pushing me!\" \"Move over!\" \"This is my spot!\"","ch":null,"tip":"stop + <b>-ing</b>: ~하는 것을 멈추다 (stop to push = 밀기 위해 멈추다, 뜻이 다름)."},{"n":31,"kr":"\"비가 필요해!\" \"나 배고파.\" \"나도.\"","en":"\"We need rain!\" \"I'm hungry.\" \"Me, too.\"","ch":null,"tip":""},{"n":32,"kr":"처음에는 소의 수가 천천히 늘어났다.","en":"The number of cows rose slowly at first.","ch":[["The number of cows","소의 수가"],["rose","늘어났다"],["slowly","천천히"],["at first.","처음에는"]],"tip":"<b>the number of</b> + 복수 명사 → <b>단수</b> 취급. rise-rose-risen (raise와 구별)."},{"n":33,"kr":"그러더니 소의 개체 수는 더 빨리 늘어났다.","en":"Then the cow population grew more quickly.","ch":[["Then","그러더니"],["the cow population","소의 개체 수는"],["grew","늘어났다"],["more quickly.","더 빨리"]],"tip":"연결어 Then: \"처음에는 천천히\" → \"그러더니 더 빨리\". grow-grew-grown."},{"n":34,"kr":"공유지의 풀은 사라지기 시작했고, 소들이 먹을 풀을 찾기가 더 어려워졌다.","en":"The grass on the commons began to disappear, and it became harder for the cows to find grass to eat.","ch":[["The grass on the commons","공유지의 풀은"],["began to disappear,","사라지기 시작했다"],["and it became harder","그리고 (~하는 것이) 더 어려워졌다"],["for the cows","소들이"],["to find grass to eat.","먹을 풀을 찾는 것"]],"tip":"9번과 짝! it was easy ↔ it became harder (가주어 it + for + to부정사). begin to = begin -ing."},{"n":35,"kr":"엎친 데 덮친 격으로, 오랫동안 비가 내리지 않았다.","en":"To make matters worse, it did not rain for a long time.","ch":[["To make matters worse,","엎친 데 덮친 격으로"],["it did not rain","비가 내리지 않았다"],["for a long time.","오랫동안"]],"tip":"it = 날씨를 나타내는 비인칭 주어. To make matters worse: 나쁜 일에 또 나쁜 일을 더할 때."}]},{"title":"비극과 회복 (36~44) — 규칙으로 돌아가다","flow":"말풍선(남은 소가 없어, 무슨 일이야?) → <b>\"과거에는\"</b> 가뭄에도 먹을 것이 있었음 ↔ <b>\"하지만\"</b> 이제 풀이 하나도 없음 → 상황이 혹독, 많은 소가 죽음 → 표지판(가족당 소 한 마리만) → <b>\"마침내\"</b> 풀이 돌아옴 → <b>\"이제\"</b> 가족당 한 마리만 감당 → 한 가족 한 소 규칙으로 복귀","items":[{"n":36,"kr":"\"이제 나는 남은 소가 없어!\" \"잘 가.\"","en":"\"I don't have any cows left!\" \"Goodbye.\"","ch":null,"tip":"any cows <b>left</b>: left(남은)가 뒤에서 꾸밈."},{"n":37,"kr":"\"공유지에 무슨 일이 일어난 거지?\"","en":"\"What happened to the commons?\"","ch":[["What happened","무슨 일이 일어났니"],["to the commons?","공유지에"]],"tip":"happen은 목적어가 없는 동사 → 수동태 불가 (was happened ✗)."},{"n":38,"kr":"과거에는 건조한 해가 와도 공유지의 적은 수의 소들은 먹을 것을 항상 찾았다.","en":"In the past, when a dry year came, the small number of cows on the commons always found something to eat.","ch":[["In the past,","과거에는"],["when a dry year came,","건조한 해가 왔을 때"],["the small number of cows on the commons","공유지의 적은 수의 소들은"],["always found","항상 찾았다"],["something to eat.","먹을 것을"]],"tip":"something + to부정사(먹을 것). always는 일반동사 앞."},{"n":39,"kr":"하지만 소가 너무 많아서 이제는 풀이 하나도 남지 않았다.","en":"However, no grass was left now because there were too many cows.","ch":[["However,","하지만"],["no grass was left now","이제 풀이 하나도 남지 않았다"],["because","~ 때문에"],["there were too many cows.","소가 너무 많았다"]],"tip":"연결어 However: 과거(늘 먹을 것이 있음) ↔ 지금(하나도 없음). 한글은 이유가 앞, 영어는 because절이 뒤."},{"n":40,"kr":"마을 사람들에게 상황은 혹독했다. 많은 소들이 죽었다.","en":"Things were harsh for the villagers; many of the cows died.","ch":[["Things were harsh","상황은 혹독했다"],["for the villagers;","마을 사람들에게"],["many of the cows died.","많은 소들이 죽었다"]],"tip":"Things = 상황(복수 → were). many of + 복수 명사."},{"n":41,"kr":"\"즐기세요, 하지만 규칙을 기억하세요: 가족당 소 한 마리만.\"","en":"\"Enjoy, but remember the rule: ONLY ONE COW PER FAMILY.\"","ch":[["Enjoy,","즐기세요"],["but remember the rule:","하지만 규칙을 기억하세요"],["ONLY ONE COW PER FAMILY.","가족당 소 한 마리만"]],"tip":"per = ~당, ~마다."},{"n":42,"kr":"마침내 풀이 다시 돌아왔다.","en":"At last, the grass came back.","ch":[["At last,","마침내"],["the grass","풀이"],["came back.","돌아왔다"]],"tip":"At last = Finally."},{"n":43,"kr":"이제 그것(풀)은 가족당 소 한 마리만 감당할 수 있었다.","en":"Now it was able to support only one cow per family.","ch":[["Now","이제"],["it was able to support","그것은 감당할 수 있었다"],["only one cow per family.","가족당 소 한 마리만"]],"tip":"it = the grass (on the commons). be able to = can."},{"n":44,"kr":"마을은 '한 가족 한 소' 규칙으로 돌아갔다.","en":"The village went back to the one-family-one-cow rule.","ch":[["The village","마을은"],["went back to","~로 돌아갔다"],["the one-family-one-cow rule.","'한 가족 한 소' 규칙"]],"tip":"go back to: ~로 돌아가다."}]},{"title":"교훈 (45~47) — 글쓴이가 하고 싶은 말","flow":"중요한 교훈: 공유 자원은 모두가 소중히 여기고 공정하게 써야 한다 → 아이들에게 이 이야기를 들려줌 → \"공유지 이야기\"라고 부름<br>💡 주제문은 45번! 시험의 주제·요지·제목 문제는 이 문장에서 나와요.","items":[{"n":45,"kr":"마을 사람들은 모두 중요한 교훈을 배웠다. 자원이 공유될 때는 모두가 그 자원을 소중히 여기고 공정하게 사용하는 것이 중요하다.","en":"The villagers all learned an important lesson: when resources are shared, it is important for everyone to value the resources and use them fairly.","ch":[["The villagers all learned","마을 사람들은 모두 배웠다"],["an important lesson:","중요한 교훈을"],["when resources are shared,","자원이 공유될 때"],["it is important","(~하는 것이) 중요하다"],["for everyone","모두가"],["to value the resources","그 자원을 소중히 여기는 것"],["and use them fairly.","그리고 그것들을 공정하게 사용하는 것"]],"tip":"are shared(수동태: 자원은 \"공유되는\" 것). 가주어 it + for 의미상 주어 + to value and (to) use. them = the resources."},{"n":46,"kr":"이제 마을 사람들은 이 이야기를 자신들의 아이들에게 들려준다.","en":"The villagers now tell this story to their children.","ch":[["The villagers","마을 사람들은"],["now tell this story","이제 이 이야기를 들려준다"],["to their children.","자신들의 아이들에게"]],"tip":"tell A to B = tell B A (4형식 ↔ 3형식, 전치사 to)."},{"n":47,"kr":"그들은 그것을 '공유지 이야기'라고 부른다.","en":"They call it \"The Story of the Commons.\"","ch":[["They call","그들은 부른다"],["it","그것을"],["\"The Story of the Commons.\"","'공유지 이야기'라고"]],"tip":"call A B: A를 B라고 부르다. it = this story."}]}]}]},{"name":"🧱 어순 배열","intro":"<b>한글 순서 그대로 놓으면 틀려요.</b> \"누가 → 한다 → 무엇을 → 어디서/언제/왜\" 순서로 영어 덩어리를 놓으세요. 꾸며 주는 말(관계사절·to부정사)은 명사 <b>뒤</b>!","blocks":[{"k":"qset","title":"영어 덩어리 순서대로 놓기","qs":[{"t":"ord","q":"[1] 옛날에 숲속에 작은 마을이 있었다.","c":["Once upon a time","there was","a small village","in a forest"],"e":"There was + 단수 명사. 장소(\"숲속에\")는 맨 뒤로."},{"t":"ord","q":"[2] 마을 주민들은 농부였고 소를 길렀다.","c":["The villagers","were farmers","and","raised cows"],"e":"were와 raised가 and로 병렬. raise(기르다)-raised — rise(오르다)-rose와 구별!"},{"t":"ord","q":"[3] 다행히도, 마을 한가운데에 좋은 목초지가 있었다.","c":["Luckily","some good grassland","lay","in the middle of the village"],"e":"lie(놓여 있다)-<b>lay</b>-lain. lay(놓다)-laid와 헷갈리지 말기."},{"t":"ord","q":"[7] 모든 사람들이 목초지를 사용하도록 허락되었다.","c":["Everyone","was allowed to","use the grassland"],"e":"be allowed to + 동사원형. Everyone은 단수 → was."},{"t":"ord","q":"[8] 그러므로 목초지는 '공유지'라고 불렸다.","c":["Therefore","it","was called","the commons"],"e":"be called + 명사: ~라고 불리다 (call A B의 수동태). it = the grassland."},{"t":"ord","q":"[9] 전통에 따라 각 가정은 소가 한 마리만 있었고, 그래서 마을에 있는 각 소가 먹을 풀을 충분히 찾는 것은 쉬웠다.","c":["By tradition","each family only had one cow","so","it was easy","for each cow in the village","to find enough grass to eat"],"e":"가주어 <b>it</b> + 의미상 주어 <b>for</b> ~ + 진주어 <b>to부정사</b>. grass to eat: 뒤에서 꾸미는 to부정사. 34번과 짝꿍 문장!"},{"t":"ord","q":"[10] 공유지의 풀은 여름 내내 푸르렀다.","c":["The grass on the commons","was green","all summer long"],"e":"주어는 The grass(단수) → was. on the commons는 꾸밈말."},{"t":"ord","q":"[13] 그러나 어느 날 마을 사람 하나가 규칙을 깨뜨렸다.","c":["But","one day","a villager","broke the rule"],"e":"연결어 But: 평화로운 이야기 → 반전 시작. break-broke-broken."},{"t":"ord","q":"[14] 그는 소를 한 마리 더 데려와 공유지에서 풀을 뜯게 했다.","c":["He brought another cow","and let it","graze","on the commons"],"e":"사역동사 let + 목적어 + <b>동사원형</b> (to graze ✗). it = another cow."},{"t":"ord","q":"[15] 그는 아무도 그것을 눈치채지 못할 것이라고 생각했다.","c":["He thought","that","nobody would notice","it"],"e":"thought(과거) → would(시제 일치). that 생략 가능."},{"t":"ord","q":"[16] 두 번째 소가 가족에게 가져다줄 우유와 치즈를 생각하자 그의 마음은 행복감으로 가득 찼다.","c":["A happy feeling","filled his heart","when he thought of","the milk and cheese","that the second cow would bring to his family"],"e":"한글은 \"가져다줄 우유와 치즈\"(꾸밈이 앞), 영어는 명사 <b>뒤</b>에 that절(목적격 관계대명사, 생략 가능)."},{"t":"ord","q":"[20] 며칠 후, 그 농부는 아이가 네 명 있는 친한 친구를 방문했다.","c":["A few days later","the farmer visited","a close friend","who had four children"],"e":"주격 관계대명사 who: 한글 \"아이가 네 명 있는\"(앞) → 영어는 friend <b>뒤</b>."},{"t":"ord","q":"[21] 그는 친구를 돕고 싶어서 몰래 그에게 말했다. \"내가 당신이라면, 소를 한 마리 더 데려와서 공유지에서 키우겠어요.\"","c":["He wanted to help his friend","so he told him in secret","If I were you","I would bring in one more cow","and raise it on the commons"],"e":"in secret = secretly(몰래). 가정법 과거 were / would."},{"t":"ord","q":"[22] 친구는 그에게 고마워했고 다음 날 자신이 들은 대로 했다.","c":["The friend thanked him","and did","as he was told","the next day"],"e":"as = ~대로. did = 소를 한 마리 더 데려왔다. be told: (말을) 듣다."},{"t":"ord","q":"[25] \"내가 이 마을에서 가장 부유한 농부가 될 수 있어.\"","c":["I can be","the richest farmer","in this village"],"e":"최상급 the + -est + in 장소."},{"t":"ord","q":"[27] 어떤 사람들은 몰래 소를 한 마리 더 공유지에 데려왔고, 다른 사람들은 아무에게도 말하지 않고 훨씬 더 많은 소를 목초지에 데려왔다.","c":["Some","secretly brought one more cow","to the commons","while others","brought even more","to the grassland","without telling anyone"],"e":"Some ~, others ~ (일부는 ~, 다른 일부는 ~). <b>even</b> + 비교급(훨씬). without + <b>-ing</b>."},{"t":"ord","q":"[28] 그들은 추가된 소들에게도 풀이 충분할 것이라고 생각했다.","c":["They thought","that","there would be enough grass","for the additional cows"],"e":"시제 일치 thought → would. additional = extra."},{"t":"ord","q":"[32] 처음에는 소의 수가 천천히 늘어났다.","c":["The number of cows","rose","slowly","at first"],"e":"<b>the number of</b> + 복수 명사 → <b>단수</b> 취급. rise-rose-risen (raise와 구별)."},{"t":"ord","q":"[34] 공유지의 풀은 사라지기 시작했고, 소들이 먹을 풀을 찾기가 더 어려워졌다.","c":["The grass on the commons","began to disappear","and it became harder","for the cows","to find grass to eat"],"e":"9번과 짝! it was easy ↔ it became harder (가주어 it + for + to부정사). begin to = begin -ing."},{"t":"ord","q":"[35] 엎친 데 덮친 격으로, 오랫동안 비가 내리지 않았다.","c":["To make matters worse","it did not rain","for a long time"],"e":"it = 날씨를 나타내는 비인칭 주어. To make matters worse: 나쁜 일에 또 나쁜 일을 더할 때."},{"t":"ord","q":"[38] 과거에는 건조한 해가 와도 공유지의 적은 수의 소들은 먹을 것을 항상 찾았다.","c":["In the past","when a dry year came","the small number of cows on the commons","always found","something to eat"],"e":"something + to부정사(먹을 것). always는 일반동사 앞."},{"t":"ord","q":"[39] 하지만 소가 너무 많아서 이제는 풀이 하나도 남지 않았다.","c":["However","no grass was left now","because","there were too many cows"],"e":"연결어 However: 과거(늘 먹을 것이 있음) ↔ 지금(하나도 없음). 한글은 이유가 앞, 영어는 because절이 뒤."},{"t":"ord","q":"[40] 마을 사람들에게 상황은 혹독했다. 많은 소들이 죽었다.","c":["Things were harsh","for the villagers","many of the cows died"],"e":"Things = 상황(복수 → were). many of + 복수 명사."},{"t":"ord","q":"[43] 이제 그것(풀)은 가족당 소 한 마리만 감당할 수 있었다.","c":["Now","it was able to support","only one cow per family"],"e":"it = the grass (on the commons). be able to = can."},{"t":"ord","q":"[45] 마을 사람들은 모두 중요한 교훈을 배웠다. 자원이 공유될 때는 모두가 그 자원을 소중히 여기고 공정하게 사용하는 것이 중요하다.","c":["The villagers all learned","an important lesson","when resources are shared","it is important","for everyone","to value the resources","and use them fairly"],"e":"are shared(수동태: 자원은 \"공유되는\" 것). 가주어 it + for 의미상 주어 + to value and (to) use. them = the resources."},{"t":"ord","q":"[46] 이제 마을 사람들은 이 이야기를 자신들의 아이들에게 들려준다.","c":["The villagers","now tell this story","to their children"],"e":"tell A to B = tell B A (4형식 ↔ 3형식, 전치사 to)."}]}]},{"name":"✏️ 빈칸·어법","intro":"<b>핵심 표현과 어법 포인트</b>만 모았어요. 가정법 과거, 가주어 it + for + to부정사, 사역동사 let, the number of가 핵심!","blocks":[{"k":"qset","title":"A. 핵심 표현 빈칸","qs":[{"t":"in","q":"전통에 따라 각 가정은 소가 한 마리만 있었고, 그래서 마을의 각 소가 먹을 풀을 충분히 찾는 것은 쉬웠다.","s":"[] tradition, each family only had one cow, so [] was easy [] each cow in the village to find enough grass [] eat.","a":["by","it","for","to"],"e":"By tradition / 가주어 it / 의미상 주어 for / grass to eat"},{"t":"in","q":"\"만약 내게 소가 두 마리 있다면, 나는 더 부유할 텐데.\"","s":"\"If I [] two cows, I [] be richer.\"","a":["had","would"],"e":"가정법 과거: If + 과거동사, would + 동사원형"},{"t":"in","q":"그는 소를 한 마리 더 데려와 공유지에서 풀을 뜯게 했다.","s":"He brought [] cow and [] it [] on the commons.","a":["another","let","graze"],"e":"another + 단수 / let + 목적어 + 동사원형"},{"t":"in","q":"두 번째 소가 가족에게 가져다줄 우유와 치즈를 생각하자","s":"when he thought [] the milk and cheese [] the second cow would bring to his family","a":["of","that|which"],"e":"think of / 목적격 관계대명사 that(= which)"},{"t":"in","q":"그 농부는 아이가 네 명 있는 친한 친구를 방문했다.","s":"The farmer visited a [] friend [] had four children.","a":["close","who|that"],"e":"close friend(친한 친구) / 주격 관계대명사 who"},{"t":"in","q":"친구는 그에게 고마워했고 다음 날 자신이 들은 대로 했다.","s":"The friend thanked him and did [] he was [] the next day.","a":["as","told"],"e":"as(~대로) / be told(들다)"},{"t":"in","q":"어떤 사람들은 몰래 소를 한 마리 더 데려왔고, 다른 사람들은 아무에게도 말하지 않고 훨씬 더 많이 데려왔다.","s":"[] secretly brought one more cow to the commons while [] brought [] more to the grassland [] telling anyone.","a":["some","others","even|much|still|far|a lot","without"],"e":"Some ~ others ~ / even + 비교급 / without + -ing"},{"t":"in","q":"곧 마을은 행복해 보이는 농부들로 가득 찼다!","s":"Soon the village was [] [] happy-looking farmers!","a":["full","of"],"e":"be full of = be filled with"},{"t":"in","q":"처음에는 소의 수가 천천히 늘어났다.","s":"The [] of cows [] slowly at first.","a":["number","rose"],"e":"the number of(단수 취급) / rise-rose-risen"},{"t":"in","q":"엎친 데 덮친 격으로, 오랫동안 비가 내리지 않았다.","s":"To make matters [], [] did not rain for a long time.","a":["worse","it"],"e":"To make matters worse / 날씨 it"},{"t":"in","q":"공유지의 적은 수의 소들은 먹을 것을 항상 찾았다.","s":"The small number of cows on the commons always found [] [] eat.","a":["something","to"],"e":"something + to부정사"},{"t":"in","q":"마을은 '한 가족 한 소' 규칙으로 돌아갔다.","s":"The village went [] [] the one-family-one-cow rule.","a":["back","to"],"e":"go back to"},{"t":"in","q":"모두가 그 자원을 소중히 여기고 공정하게 사용하는 것이 중요하다.","s":"It is important [] everyone [] value the resources and use [] fairly.","a":["for","to","them"],"e":"가주어 It + for 의미상 주어 + to부정사 / them = the resources"},{"t":"in","q":"그들은 그것을 '공유지 이야기'라고 부른다.","s":"They [] it \"The Story of the Commons.\"","a":["call"],"e":"call A B"}]},{"k":"qset","title":"B. 어법에 맞는 것 고르기","note":"<b>이유까지 말할 수 있어야</b> 진짜 아는 거예요. 시험은 이 자리를 바꿔서 내요.","qs":[{"t":"mc","inline":1,"q":"Some good grassland (lay / laid) in the middle of the village.","o":["lay","laid"],"a":0,"e":"\"놓여 있었다\" = lie의 과거 <b>lay</b>. laid는 lay(놓다)의 과거."},{"t":"mc","inline":1,"q":"The villagers were farmers and (raised / rose) cows.","o":["raised","rose"],"a":0,"e":"목적어(cows)가 있음 → raise(기르다)의 과거 raised. rose는 목적어 없이 \"오르다\"."},{"t":"mc","inline":1,"q":"Everyone was allowed (to use / using) the grassland.","o":["to use","using"],"a":0,"e":"be allowed + <b>to부정사</b>."},{"t":"mc","inline":1,"q":"He brought another cow and let it (graze / to graze) on the commons.","o":["graze","to graze"],"a":0,"e":"사역동사 let + 목적어 + <b>동사원형</b>."},{"t":"mc","inline":1,"q":"\"If I (had / have) two cows, I would be richer.\"","o":["had","have"],"a":0,"e":"뒤에 would → 가정법 과거 → if절은 <b>과거동사</b>."},{"t":"mc","inline":1,"q":"\"If I (am / were) you, I would raise another cow.\"","o":["am","were"],"a":1,"e":"가정법 과거의 be동사 → <b>were</b>."},{"t":"mc","inline":1,"q":"The farmer visited a close friend (who / which) had four children.","o":["who","which"],"a":0,"e":"선행사가 사람(friend) → who."},{"t":"mc","inline":1,"q":"Others brought (even / very) more to the grassland.","o":["even","very"],"a":0,"e":"비교급(more) 강조 → even(훨씬). very는 비교급을 꾸미지 못해요."},{"t":"mc","inline":1,"q":"... without (telling / tell) anyone.","o":["telling","tell"],"a":0,"e":"전치사 without + <b>동명사</b>."},{"t":"mc","inline":1,"q":"The number of cows (rose / raised) slowly at first.","o":["rose","raised"],"a":0,"e":"목적어 없이 \"늘어났다\" → rise의 과거 rose."},{"t":"mc","inline":1,"q":"It became harder (for / of) the cows to find grass to eat.","o":["for","of"],"a":0,"e":"hard·easy처럼 상황을 나타내는 형용사 → 의미상 주어 <b>for</b>. (of는 kind, nice처럼 사람 성격일 때)"},{"t":"mc","inline":1,"q":"\"I don't have any cows (left / leaving)!\"","o":["left","leaving"],"a":0,"e":"\"남은\" 소 → 과거분사 left가 뒤에서 꾸밈."},{"t":"mc","inline":1,"q":"\"What (happened / was happened) to the commons?\"","o":["happened","was happened"],"a":0,"e":"happen은 목적어를 갖지 않는 동사 → 수동태 ✗."},{"t":"mc","inline":1,"q":"The cows always found something (to eat / eating).","o":["to eat","eating"],"a":0,"e":"something을 뒤에서 꾸미는 <b>to부정사</b>."},{"t":"mc","inline":1,"q":"When resources (are shared / share), it is important ...","o":["are shared","share"],"a":0,"e":"자원은 \"공유되는\" 대상 → 수동태 are shared."},{"t":"mc","inline":1,"q":"The villagers now tell this story (to / for) their children.","o":["to","for"],"a":0,"e":"tell A <b>to</b> B (tell은 to를 쓰는 동사)."},{"t":"mc","inline":1,"q":"\"Hey, stop (pushing / to push) me!\"","o":["pushing","to push"],"a":0,"e":"stop + -ing = ~하는 것을 멈추다. stop to push = 밀기 위해 멈추다 (뜻이 다름)."}]}]},{"name":"🔢 순서·삽입","intro":"<b>연결어·시간 표현·대명사가 단서!</b> But one day → 반전, A few days later / Soon → 시간 흐름, at first → Then, In the past ↔ However.","blocks":[{"k":"qset","title":"A. 문장 순서 맞추기","qs":[{"t":"ord","blk":1,"q":"한 사람의 욕심 — 다음 문장들을 순서대로 놓으세요.","c":["But one day a villager broke the rule.","He brought another cow and let it graze on the commons.","He thought that nobody would notice it.","A happy feeling filled his heart when he thought of the milk and cheese that the second cow would bring to his family."],"e":"반전(규칙을 깸) → 행동(소를 데려옴) → it(=그 행동)을 아무도 모를 것 → 행복"},{"t":"ord","blk":1,"q":"욕심의 확산 — 다음 문장들을 순서대로 놓으세요.","c":["A few days later, the farmer visited a close friend who had four children.","He wanted to help his friend, so he told him in secret, \"If I were you, I would bring in one more cow and raise it on the commons.\"","The friend thanked him and did as he was told the next day.","Soon, other villagers did the same."],"e":"며칠 후 친구 방문 → 몰래 조언 → 친구가 들은 대로 함 → 곧 다른 사람들도"},{"t":"ord","blk":1,"q":"공유지가 무너지는 과정 — 다음 문장들을 순서대로 놓으세요.","c":["The number of cows rose slowly at first.","Then the cow population grew more quickly.","The grass on the commons began to disappear, and it became harder for the cows to find grass to eat.","To make matters worse, it did not rain for a long time."],"e":"at first(처음에는) → Then(그러더니) → 결과(풀이 사라짐) → To make matters worse(설상가상)"},{"t":"ord","blk":1,"q":"비극과 회복 — 다음 문장들을 순서대로 놓으세요.","c":["In the past, when a dry year came, the small number of cows on the commons always found something to eat.","However, no grass was left now because there were too many cows.","Things were harsh for the villagers; many of the cows died.","At last, the grass came back.","Now it was able to support only one cow per family."],"e":"과거 ↔ However 지금 → 혹독한 결과 → At last 회복 → Now 새로운 상태"},{"t":"ord","blk":1,"q":"글 전체 — 다섯 부분을 이야기 순서대로 놓으세요.","c":["Once upon a time there was a small village in a forest. ...","But one day a villager broke the rule. ...","Soon, other villagers did the same. ...","However, no grass was left now because there were too many cows. ...","The villagers all learned an important lesson: ..."],"e":"평화 → 규칙 깨짐 → 확산 → 비극 → 교훈"}]},{"k":"qset","title":"B. 주어진 문장이 들어갈 위치","qs":[{"t":"mc","nonum":1,"inline":1,"q":"다음 문장이 들어갈 위치로 가장 알맞은 곳은?<br><b>Therefore, it was called \"the commons.\"</b>","p":"Luckily, some good grassland lay in the middle of the village. <span class=\"mark\">( ① )</span> Everyone was allowed to use the grassland. <span class=\"mark\">( ② )</span> By tradition, each family only had one cow, so it was easy for each cow in the village to find enough grass to eat. <span class=\"mark\">( ③ )</span> The grass on the commons was green all summer long. <span class=\"mark\">( ④ )</span> But one day a villager broke the rule. <span class=\"mark\">( ⑤ )</span>","o":["①","②","③","④","⑤"],"a":1,"e":"\"모두 사용하도록 허락됨\"(이유) → Therefore(그러므로) \"공유지\"라 불림. it = the grassland."},{"t":"mc","nonum":1,"inline":1,"q":"다음 문장이 들어갈 위치로 가장 알맞은 곳은?<br><b>He thought that nobody would notice it.</b>","p":"But one day a villager broke the rule. <span class=\"mark\">( ① )</span> He brought another cow and let it graze on the commons. <span class=\"mark\">( ② )</span> A happy feeling filled his heart when he thought of the milk and cheese that the second cow would bring to his family. <span class=\"mark\">( ③ )</span> A few days later, the farmer visited a close friend who had four children. <span class=\"mark\">( ④ )</span> The friend thanked him and did as he was told the next day. <span class=\"mark\">( ⑤ )</span>","o":["①","②","③","④","⑤"],"a":1,"e":"it = 다른 소를 데려와 풀을 뜯게 한 것 → 그 행동 바로 뒤."},{"t":"mc","nonum":1,"inline":1,"q":"다음 문장이 들어갈 위치로 가장 알맞은 곳은?<br><b>To make matters worse, it did not rain for a long time.</b>","p":"The number of cows rose slowly at first. <span class=\"mark\">( ① )</span> Then the cow population grew more quickly. <span class=\"mark\">( ② )</span> The grass on the commons began to disappear, and it became harder for the cows to find grass to eat. <span class=\"mark\">( ③ )</span> In the past, when a dry year came, the small number of cows on the commons always found something to eat. <span class=\"mark\">( ④ )</span> However, no grass was left now because there were too many cows. <span class=\"mark\">( ⑤ )</span>","o":["①","②","③","④","⑤"],"a":2,"e":"풀이 사라진 나쁜 상황 → \"엎친 데 덮친 격으로\" 비까지 안 옴. 뒤의 \"건조한 해(a dry year)\"와도 연결."},{"t":"mc","nonum":1,"inline":1,"q":"다음 문장이 들어갈 위치로 가장 알맞은 곳은?<br><b>However, no grass was left now because there were too many cows.</b>","p":"To make matters worse, it did not rain for a long time. <span class=\"mark\">( ① )</span> In the past, when a dry year came, the small number of cows on the commons always found something to eat. <span class=\"mark\">( ② )</span> Things were harsh for the villagers; many of the cows died. <span class=\"mark\">( ③ )</span> At last, the grass came back. <span class=\"mark\">( ④ )</span> Now it was able to support only one cow per family. <span class=\"mark\">( ⑤ )</span>","o":["①","②","③","④","⑤"],"a":1,"e":"In the past(과거) ↔ However ~ now(지금) 대비. 그 결과 상황이 혹독해짐."},{"t":"mc","q":"다음 글의 흐름과 관계<b>없는</b> 문장은?","p":"Once upon a time there was a small village in a forest. ① The villagers were farmers and raised cows. ② Luckily, some good grassland lay in the middle of the village. ③ Cows usually sleep for about four hours a day. ④ Everyone was allowed to use the grassland. ⑤ Therefore, it was called \"the commons.\"","o":["①","②","③","④","⑤"],"nonum":1,"inline":1,"a":2,"e":"공유지가 생긴 배경을 말하는 부분 → 소의 수면 시간은 관계없음."}]}]},{"name":"🧐 내용확인","intro":"<b>본문에 \"있는 말\"만 정답!</b> 대명사는 바로 앞 문장에서 찾고, 숫자·시간 표현(slowly at first, a few days later)은 꼭 확인하세요.","blocks":[{"k":"qset","title":"A. 대명사·대신하는 말이 가리키는 것","qs":[{"t":"in","q":"\"Therefore, <u>it</u> was called 'the commons.'\"의 it이 가리키는 말을 본문에서 찾아 쓰시오. (2단어)","a":"the grassland","e":"앞 문장의 the grassland(목초지)."},{"t":"in","q":"\"He brought another cow and let <u>it</u> graze on the commons.\"의 it이 가리키는 말을 쓰시오. (2단어)","a":"another cow","e":"바로 앞의 another cow."},{"t":"mc","q":"\"He thought that nobody would notice <u>it</u>.\"의 it이 가리키는 것은?","o":["공유지의 규칙","그가 소를 한 마리 더 데려와 공유지에서 풀을 뜯게 한 것","두 번째 소가 줄 우유와 치즈","그의 행복한 마음","친구의 네 아이"],"a":1,"e":"바로 앞 문장의 행동 전체."},{"t":"mc","q":"\"Soon, other villagers <u>did the same</u>.\"가 의미하는 것은?","o":["친구에게 몰래 조언했다","소를 한 마리 더 데려와 공유지에서 길렀다","규칙을 지켰다","우유와 치즈를 팔았다","마을을 떠났다"],"a":1,"e":"앞의 농부와 친구가 한 행동(소를 한 마리 더 데려옴)을 똑같이 함."},{"t":"in","q":"\"Now <u>it</u> was able to support only one cow per family.\"의 it이 가리키는 말을 쓰시오. (2단어)","a":"the grass","e":"앞 문장 \"the grass came back\"의 the grass."},{"t":"in","q":"\"... to value the resources and use <
