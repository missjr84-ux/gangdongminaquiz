w many families lived in the village?","What lesson did the villagers learn?"],"a":3,"e":"마을에 몇 가족이 살았는지는 나오지 않아요."},{"t":"mc","q":"본문의 내용과 일치하지 <b>않는</b> 것은?","o":["마을 한가운데에 좋은 목초지가 있었다.","첫 농부는 아무도 눈치채지 못할 것이라고 생각했다.","친구는 다음 날 들은 대로 했다.","풀이 사라진 가장 큰 원인은 가뭄이었다.","마을 사람들은 이 이야기를 아이들에게 들려준다."],"a":3,"tag":"함정","e":"풀이 남지 않은 이유: <b>소가 너무 많아서</b>(because there were too many cows). 가뭄은 \"엎친 데 덮친\" 추가 불운."},{"t":"mc","q":"9번 문장(it was easy ~)과 34번 문장(it became harder ~)을 비교한 설명으로 알맞은 것은?","o":["두 문장 모두 소의 수가 늘어난 것을 말한다.","9번은 규칙이 지켜질 때, 34번은 규칙이 깨진 뒤의 상황이다.","두 문장의 it은 모두 날씨를 가리킨다.","9번은 가뭄, 34번은 홍수 상황이다.","두 문장은 같은 날의 일이다."],"a":1,"e":"같은 틀(가주어 it + for + to부정사)을 반대로 써서 변화를 보여 줘요. it은 가주어."}]},{"k":"flip","title":"📚 글의 종류 — 영어로 나오는 단어","note":"<b>판단 기준</b>: 실제 인물인가? → biography / autobiography · 지어낸 이야기 + 교훈? → fable · 사실 전달? → article · 의견 주장? → editorial","rows":[["biography","전기 — 다른 사람이 쓴 실존 인물의 일생","5과 윤동주 이야기 ✓ (시간 순서, 연도, 사실)"],["autobiography","자서전 — 자기가 쓴 자기 일생","함정! 주어가 I가 아니면 자서전 아님"],["fable","우화 — 교훈을 주는 짧은 지어낸 이야기 (동물이 말하기도 함)","6과 공유지 이야기 ✓ (Once upon a time + 교훈)"],["folktale / fairy tale","민담·옛이야기 / 동화",""],["poem / poetry","시 (한 편 / 시 전체)","5과 1~10행 ✓"],["novel","소설 (긴 이야기)",""],["play","희곡, 연극",""],["essay","수필, 에세이",""],["diary / journal","일기",""],["article","기사 (사실 전달)",""],["editorial","사설 (신문사의 의견)",""],["review","감상문, 평론",""],["advertisement","광고",""],["brochure","안내 책자",""],["newsletter","소식지",""]]},{"k":"qset","title":"D. 영어로 묻는 글의 종류 · 교훈 · 제목","qs":[{"t":"mc","q":"What do you call this kind of story?","o":["biography","news article","fable","diary","recipe"],"a":2,"e":"\"Once upon a time\"으로 시작하는 지어낸 이야기 + 말하는 소 + 마지막에 교훈(an important lesson) → <b>fable</b>(우화). 실존 인물이 아니라서 biography ✗."},{"t":"mc","q":"What lesson does the story teach?","o":["Rich farmers should have more cows.","We should always follow old traditions.","When resources are shared, everyone should value them and use them fairly.","Cows need a lot of rain to grow.","It is good to help your friends secretly."],"a":2,"e":"45번 문장이 교훈(주제문)."},{"t":"mc","q":"What is the main purpose of the story?","o":["to give information about raising cows","to teach a lesson through a story","to advertise milk and cheese","to report news about a dry year","to introduce a famous farmer"],"a":1,"e":"이야기로 교훈을 전하는 글."},{"t":"mc","q":"Which is the best title for the story?","o":["How to Raise Cows","The Richest Farmer in the Village","A Rainy Summer","What Happens When Everyone Takes a Little More","The Best Milk and Cheese"],"a":3,"e":"모두가 \"조금만 더\"를 원하다가 공유지가 무너진 이야기."},{"t":"mc","q":"Which word best describes the farmer who brought another cow?","o":["greedy","generous","honest","lazy","brave"],"a":0,"e":"\"If I had two cows, I would be richer.\" + 몰래 규칙을 깸 → <b>greedy</b>(욕심 많은)."},{"t":"mc","q":"Why was no grass left on the commons?","o":["Because the summer was too long.","Because there were too many cows.","Because the villagers sold the land.","Because the cows were sick.","Because it snowed a lot."],"a":1,"e":"39번 \"because there were too many cows\". 가뭄은 엎친 데 덮친 추가 원인."}]}]},{"name":"✍️ 영작","intro":"<b>쓰기 전에 순서 3단계</b>: ① 누가(주어) ② 한다(동사) ③ 무엇을·어디서·언제·왜. 꾸밈말(관계사절, to부정사)은 명사 뒤! 문장부호는 채점에 상관없어요. 틀리면 \"정답 보기\"로 확인.","blocks":[{"k":"qset","title":"핵심 문장 거꾸로 영작","qs":[{"t":"in","q":"[3] 다행히도, 마을 한가운데에 좋은 목초지가 있었다. <span class=\"badge b-lav\">luckily, lie, middle</span>","a":"Luckily, some good grassland lay in the middle of the village.","e":"lie(놓여 있다)-<b>lay</b>-lain. lay(놓다)-laid와 헷갈리지 말기.","ph":"영어 문장 쓰기"},{"t":"in","q":"[7] 모든 사람들이 목초지를 사용하도록 허락되었다. <span class=\"badge b-lav\">be allowed to</span>","a":"Everyone was allowed to use the grassland.","e":"be allowed to + 동사원형. Everyone은 단수 → was.","ph":"영어 문장 쓰기"},{"t":"in","q":"[9] 전통에 따라 각 가정은 소가 한 마리만 있었고, 그래서 마을에 있는 각 소가 먹을 풀을 충분히 찾는 것은 쉬웠다. <span class=\"badge b-lav\">tradition, it, for, to find, to eat</span>","a":"By tradition, each family only had one cow, so it was easy for each cow in the village to find enough grass to eat.","e":"가주어 <b>it</b> + 의미상 주어 <b>for</b> ~ + 진주어 <b>to부정사</b>. grass to eat: 뒤에서 꾸미는 to부정사. 34번과 짝꿍 문장!","ph":"영어 문장 쓰기"},{"t":"in","q":"[11] \"만약 내게 소가 두 마리 있다면, 나는 더 부유할 텐데.\" <span class=\"badge b-lav\">가정법 과거</span>","a":"\"If I had two cows, I would be richer.\"","e":"가정법 과거: If + 주어 + <b>과거동사</b>, 주어 + <b>would</b> + 동사원형 (지금 사실과 반대).","ph":"영어 문장 쓰기"},{"t":"in","q":"[14] 그는 소를 한 마리 더 데려와 공유지에서 풀을 뜯게 했다. <span class=\"badge b-lav\">another, let, graze</span>","a":"He brought another cow and let it graze on the commons.","e":"사역동사 let + 목적어 + <b>동사원형</b> (to graze ✗). it = another cow.","ph":"영어 문장 쓰기"},{"t":"in","q":"[15] 그는 아무도 그것을 눈치채지 못할 것이라고 생각했다. <span class=\"badge b-lav\">that, nobody, would</span>","a":[["He thought (that) nobody would notice it."]],"e":"thought(과거) → would(시제 일치). that 생략 가능.","ph":"영어 문장 쓰기"},{"t":"in","q":"[16] 두 번째 소가 가족에게 가져다줄 우유와 치즈를 생각하자 그의 마음은 행복감으로 가득 찼다. <span class=\"badge b-lav\">fill, think of, that, bring</span>","a":[["A happy feeling filled his heart when he thought of the milk and cheese (that) the second cow would bring to his family.","A happy feeling filled his heart when he thought of the milk and cheese which the second cow would bring to his family."]],"e":"한글은 \"가져다줄 우유와 치즈\"(꾸밈이 앞), 영어는 명사 <b>뒤</b>에 that절(목적격 관계대명사, 생략 가능).","ph":"영어 문장 쓰기"},{"t":"in","q":"[18] \"내가 당신이라면, 소를 한 마리 더 기르겠어요.\" <span class=\"badge b-lav\">were, would, another</span>","a":"\"If I were you, I would raise another cow.\"","e":"가정법 과거의 be동사는 주어와 상관없이 <b>were</b> (If I was ✗ — 시험 기준).","ph":"영어 문장 쓰기"},{"t":"in","q":"[20] 며칠 후, 그 농부는 아이가 네 명 있는 친한 친구를 방문했다. <span class=\"badge b-lav\">a few days later, close, who</span>","a":"A few days later, the farmer visited a close friend who had four children.","e":"주격 관계대명사 who: 한글 \"아이가 네 명 있는\"(앞) → 영어는 friend <b>뒤</b>.","ph":"영어 문장 쓰기"},{"t":"in","q":"[22] 친구는 그에게 고마워했고 다음 날 자신이 들은 대로 했다. <span class=\"badge b-lav\">thank, as, be told</span>","a":"The friend thanked him and did as he was told the next day.","e":"as = ~대로. did = 소를 한 마리 더 데려왔다. be told: (말을) 듣다.","ph":"영어 문장 쓰기"},{"t":"in","q":"[27] 어떤 사람들은 몰래 소를 한 마리 더 공유지에 데려왔고, 다른 사람들은 아무에게도 말하지 않고 훨씬 더 많은 소를 목초지에 데려왔다. <span class=\"badge b-lav\">some, others, even, without</span>","a":"Some secretly brought one more cow to the commons while others brought even more to the grassland without telling anyone.","e":"Some ~, others ~ (일부는 ~, 다른 일부는 ~). <b>even</b> + 비교급(훨씬). without + <b>-ing</b>.","ph":"영어 문장 쓰기"},{"t":"in","q":"[29] 곧 마을은 행복해 보이는 농부들로 가득 찼다! <span class=\"badge b-lav\">be full of</span>","a":"Soon the village was full of happy-looking farmers!","e":"be full of = be filled with.","ph":"영어 문장 쓰기"},{"t":"in","q":"[32] 처음에는 소의 수가 천천히 늘어났다. <span class=\"badge b-lav\">the number of, rise</span>","a":"The number of cows rose slowly at first.","e":"<b>the number of</b> + 복수 명사 → <b>단수</b> 취급. rise-rose-risen (raise와 구별).","ph":"영어 문장 쓰기"},{"t":"in","q":"[34] 공유지의 풀은 사라지기 시작했고, 소들이 먹을 풀을 찾기가 더 어려워졌다. <span class=\"badge b-lav\">begin, it, for, to find</span>","a":"The grass on the commons began to disappear, and it became harder for the cows to find grass to eat.","e":"9번과 짝! it was easy ↔ it became harder (가주어 it + for + to부정사). begin to = begin -ing.","ph":"영어 문장 쓰기"},{"t":"in","q":"[35] 엎친 데 덮친 격으로, 오랫동안 비가 내리지 않았다. <span class=\"badge b-lav\">to make matters worse</span>","a":"To make matters worse, it did not rain for a long time.","e":"it = 날씨를 나타내는 비인칭 주어. To make matters worse: 나쁜 일에 또 나쁜 일을 더할 때.","ph":"영어 문장 쓰기"},{"t":"in","q":"[38] 과거에는 건조한 해가 와도 공유지의 적은 수의 소들은 먹을 것을 항상 찾았다. <span class=\"badge b-lav\">in the past, the small number of, something</span>","a":"In the past, when a dry year came, the small number of cows on the commons always found something to eat.","e":"something + to부정사(먹을 것). always는 일반동사 앞.","ph":"영어 문장 쓰기"},{"t":"in","q":"[39] 하지만 소가 너무 많아서 이제는 풀이 하나도 남지 않았다. <span class=\"badge b-lav\">however, no grass, because</span>","a":"However, no grass was left now because there were too many cows.","e":"연결어 However: 과거(늘 먹을 것이 있음) ↔ 지금(하나도 없음). 한글은 이유가 앞, 영어는 because절이 뒤.","ph":"영어 문장 쓰기"},{"t":"in","q":"[45] 마을 사람들은 모두 중요한 교훈을 배웠다. 자원이 공유될 때는 모두가 그 자원을 소중히 여기고 공정하게 사용하는 것이 중요하다. <span class=\"badge b-lav\">lesson, share, it, for, value</span>","a":"The villagers all learned an important lesson: when resources are shared, it is important for everyone to value the resources and use them fairly.","e":"are shared(수동태: 자원은 \"공유되는\" 것). 가주어 it + for 의미상 주어 + to value and (to) use. them = the resources.","ph":"영어 문장 쓰기"},{"t":"in","q":"[47] 그들은 그것을 '공유지 이야기'라고 부른다. <span class=\"badge b-lav\">call</span>","a":"They call it \"The Story of the Commons.\"","e":"call A B: A를 B라고 부르다. it = this story.","ph":"영어 문장 쓰기"}]}]}],"sents":{"1":["Once upon a time there was a small village in a forest.","옛날에 숲속에 작은 마을이 있었다."],"2":["The villagers were farmers and raised cows.","마을 주민들은 농부였고 소를 길렀다."],"3":["Luckily, some good grassland lay in the middle of the village.","다행히도, 마을 한가운데에 좋은 목초지가 있었다."],"4":["\"Let's share the commons.\"","\"공유지를 함께 나누어 씁시다.\""],"5":["\"My cow can get enough grass.\"","\"내 소가 풀을 충분히 뜯을 수 있겠어.\""],"6":["\"Yeah, there's plenty for every cow.\"","\"맞아, 모든 소에게 충분한 양이야.\""],"7":["Everyone was allowed to use the grassland.","모든 사람들이 목초지를 사용하도록 허락되었다."],"8":["Therefore, it was called \"the commons.\"","그러므로 목초지는 '공유지'라고 불렸다."],"9":["By tradition, each family only had one cow, so it was easy for each cow in the village to find enough grass to eat.","전통에 따라 각 가정은 소가 한 마리만 있었고, 그래서 마을에 있는 각 소가 먹을 풀을 충분히 찾는 것은 쉬웠다."],"10":["The grass on the commons was green all summer long.","공유지의 풀은 여름 내내 푸르렀다."],"11":["\"If I had two cows, I would be richer.\"","\"만약 내게 소가 두 마리 있다면, 나는 더 부유할 텐데.\""],"12":["\"No one will notice it.\"","\"아무도 눈치채지 못할 거야.\""],"13":["But one day a villager broke the rule.","그러나 어느 날 마을 사람 하나가 규칙을 깨뜨렸다."],"14":["He brought another cow and let it graze on the commons.","그는 소를 한 마리 더 데려와 공유지에서 풀을 뜯게 했다."],"15":["He thought that nobody would notice it.","그는 아무도 그것을 눈치채지 못할 것이라고 생각했다."],"16":["A happy feeling filled his heart when he thought of the milk and cheese that the second cow would bring to his family.","두 번째 소가 가족에게 가져다줄 우유와 치즈를 생각하자 그의 마음은 행복감으로 가득 찼다."],"17":["'He has four children.'","'그는 아이가 네 명이나 있어.'"],"18":["\"If I were you, I would raise another cow.\"","\"내가 당신이라면, 소를 한 마리 더 기르겠어요.\""],"19":["\"Thanks for the tip!\"","\"조언 고마워요!\""],"20":["A few days later, the farmer visited a close friend who had four children.","며칠 후, 그 농부는 아이가 네 명 있는 친한 친구를 방문했다."],"21":["He wanted to help his friend, so he told him in secret, \"If I were you, I would bring in one more cow and raise it on the commons.\"","그는 친구를 돕고 싶어서 몰래 그에게 말했다. \"내가 당신이라면, 소를 한 마리 더 데려와서 공유지에서 키우겠어요.\""],"22":["The friend thanked him and did as he was told the next day.","친구는 그에게 고마워했고 다음 날 자신이 들은 대로 했다."],"23":["\"Who are you?\" \"I'm new.\"","\"넌 누구니?\" \"난 새로 왔어.\""],"24":["\"Who is lying there?\" \"I don't know.\"","\"누가 저기 누워 있는 거야?\" \"몰라.\""],"25":["\"I can be the richest farmer in this village.\"","\"내가 이 마을에서 가장 부유한 농부가 될 수 있어.\""],"26":["Soon, other villagers did the same.","곧, 다른 마을 사람들도 똑같이 했다."],"27":["Some secretly brought one more cow to the commons while others brought even more to the grassland without telling anyone.","어떤 사람들은 몰래 소를 한 마리 더 공유지에 데려왔고, 다른 사람들은 아무에게도 말하지 않고 훨씬 더 많은 소를 목초지에 데려왔다."],"28":["They thought that there would be enough grass for the additional cows.","그들은 추가된 소들에게도 풀이 충분할 것이라고 생각했다."],"29":["Soon the village was full of happy-looking farmers!","곧 마을은 행복해 보이는 농부들로 가득 찼다!"],"30":["\"Hey, stop pushing me!\" \"Move over!\" \"This is my spot!\"","\"이봐, 밀지 마!\" \"저리 비켜!\" \"여긴 내 자리야!\""],"31":["\"We need rain!\" \"I'm hungry.\" \"Me, too.\"","\"비가 필요해!\" \"나 배고파.\" \"나도.\""],"32":["The number of cows rose slowly at first.","처음에는 소의 수가 천천히 늘어났다."],"33":["Then the cow population grew more quickly.","그러더니 소의 개체 수는 더 빨리 늘어났다."],"34":["The grass on the commons began to disappear, and it became harder for the cows to find grass to eat.","공유지의 풀은 사라지기 시작했고, 소들이 먹을 풀을 찾기가 더 어려워졌다."],"35":["To make matters worse, it did not rain for a long time.","엎친 데 덮친 격으로, 오랫동안 비가 내리지 않았다."],"36":["\"I don't have any cows left!\" \"Goodbye.\"","\"이제 나는 남은 소가 없어!\" \"잘 가.\""],"37":["\"What happened to the commons?\"","\"공유지에 무슨 일이 일어난 거지?\""],"38":["In the past, when a dry year came, the small number of cows on the commons always found something to eat.","과거에는 건조한 해가 와도 공유지의 적은 수의 소들은 먹을 것을 항상 찾았다."],"39":["However, no grass was left now because there were too many cows.","하지만 소가 너무 많아서 이제는 풀이 하나도 남지 않았다."],"40":["Things were harsh for the villagers; many of the cows died.","마을 사람들에게 상황은 혹독했다. 많은 소들이 죽었다."],"41":["\"Enjoy, but remember the rule: ONLY ONE COW PER FAMILY.\"","\"즐기세요, 하지만 규칙을 기억하세요: 가족당 소 한 마리만.\""],"42":["At last, the grass came back.","마침내 풀이 다시 돌아왔다."],"43":["Now it was able to support only one cow per family.","이제 그것(풀)은 가족당 소 한 마리만 감당할 수 있었다."],"44":["The village went back to the one-family-one-cow rule.","마을은 '한 가족 한 소' 규칙으로 돌아갔다."],"45":["The villagers all learned an important lesson: when resources are shared, it is important for everyone to value the resources and use them fairly.","마을 사람들은 모두 중요한 교훈을 배웠다. 자원이 공유될 때는 모두가 그 자원을 소중히 여기고 공정하게 사용하는 것이 중요하다."],"46":["The villagers now tell this story to their children.","이제 마을 사람들은 이 이야기를 자신들의 아이들에게 들려준다."],"47":["They call it \"The Story of the Commons.\"","그들은 그것을 '공유지 이야기'라고 부른다."]}};
</script>
<script>
(function(){
'use strict';
var D = window.DATA;
var REG = [];          // all question objects
var TABQ = [];         // per tab arrays of questions
var NUMS = ['①','②','③','④','⑤','⑥','⑦','⑧','⑨','⑩'];

/* ---------- utils ---------- */
function el(tag, cls, html){var e=document.createElement(tag); if(cls)e.className=cls; if(html!=null)e.innerHTML=html; return e;}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function hash(s){var h=2166136261;for(var i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619);}return h>>>0;}
function rng(seed){return function(){seed=(Math.imul(seed^(seed>>>15),2246822507)+0x6D2B79F5)>>>0;return (seed%100000)/100000;};}
function shuffleIdx(n, seedStr){
  var idx=[];for(var i=0;i<n;i++)idx.push(i);
  if(n<2)return idx;
  var r=rng(hash(seedStr));
  for(var k=0;k<6;k++){
    for(var j=n-1;j>0;j--){var x=Math.floor(r()*(j+1));var t=idx[j];idx[j]=idx[x];idx[x]=t;}
    var same=idx.every(function(v,i){return v===i;});
    if(!same)return idx;
  }
  idx.push(idx.shift()); return idx;
}
var CONTR=[[/can't/g,'cannot'],[/won't/g,'will not'],[/n't/g,' not'],[/\bi'm\b/g,'i am'],[/\bit's\b/g,'it is'],[/\bthat's\b/g,'that is'],[/\byou're\b/g,'you are'],[/\bthey're\b/g,'they are'],[/\bwe're\b/g,'we are'],[/\bhe's\b/g,'he is'],[/\bshe's\b/g,'she is'],[/\bwhat's\b/g,'what is'],[/\bthere's\b/g,'there is']];
function norm(s){
  s=String(s).toLowerCase().replace(/[’‘`´]/g,"'").replace(/[“”"]/g,'');
  CONTR.forEach(function(c){s=s.replace(c[0],c[1]);});
  s=s.replace(/[.,!?;:~]/g,' ').replace(/\s+/g,' ').trim();
  return s;
}
function variants(str){ // "(that) " optional words
  var m=str.match(/\(([^()]+)\)/);
  if(!m)return [str];
  var a=str.replace(m[0],m[1]), b=str.replace(m[0],'');
  return variants(a).concat(variants(b));
}
function alts(spec){ // 'a|b' or array -> list of normalized answers
  var arr=Array.isArray(spec)?spec:String(spec).split('|');
  var out=[];arr.forEach(function(x){variants(x).forEach(function(v){out.push(norm(v));});});
  return out;
}
function firstShow(spec){var s=Array.isArray(spec)?spec[0]:String(spec).split('|')[0];return s;}

/* ---------- sound ---------- */
var voices=[];
function loadV(){try{voices=window.speechSynthesis.getVoices()||[];}catch(e){voices=[];}}
if('speechSynthesis' in window){loadV();try{window.speechSynthesis.onvoiceschanged=loadV;}catch(e){}}
function pickVoice(){
  if(!voices.length)loadV();
  var v=voices.find(function(x){return /william/i.test(x.name);});
  if(!v)v=voices.find(function(x){return x.lang==='en-US';});
  if(!v)v=voices.find(function(x){return /^en/i.test(x.lang);});
  return v;
}
var unlocked=false;
function unlock(){
  if(unlocked||!('speechSynthesis' in window))return; unlocked=true;
  try{var u=new SpeechSynthesisUtterance(' ');u.volume=0;window.speechSynthesis.speak(u);}catch(e){}
}
document.addEventListener('touchstart',unlock,{once:true,passive:true});
document.addEventListener('click',unlock,{once:true});
function mkUtter(text){
  var u=new SpeechSynthesisUtterance(text.replace(/[○×]/g,''));
  var v=pickVoice(); if(v){u.voice=v;u.lang=v.lang;}else{u.lang='en-US';}
  u.rate=0.9; return u;
}
function speak(text,btn){
  if(!('speechSynthesis' in window))return;
  try{
    window.speechSynthesis.cancel();
    var u=mkUtter(text);
    if(btn){btn.classList.add('playing');u.onend=u.onerror=function(){btn.classList.remove('playing');};}
    window.speechSynthesis.speak(u);
  }catch(e){}
}
function speakAll(list,btn){
  if(!('speechSynthesis' in window))return;
  try{
    window.speechSynthesis.cancel();
    list.forEach(function(t,i){
      var u=mkUtter(t);
      if(btn&&i===0)btn.classList.add('playing');
      if(btn&&i===list.length-1)u.onend=u.onerror=function(){btn.classList.remove('playing');};
      window.speechSynthesis.speak(u);
    });
  }catch(e){}
}
var actx=null;
function pageSound(){
  try{
    actx=actx||new (window.AudioContext||window.webkitAudioContext)();
    var o=actx.createOscillator(),g=actx.createGain();
    o.type='sine';o.frequency.setValueAtTime(880,actx.currentTime);
    o.frequency.exponentialRampToValueAtTime(1320,actx.currentTime+.08);
    g.gain.setValueAtTime(.05,actx.currentTime);g.gain.exponentialRampToValueAtTime(.0001,actx.currentTime+.15);
    o.connect(g);g.connect(actx.destination);o.start();o.stop(actx.currentTime+.16);
  }catch(e){}
}
function spkBtn(text){
  var b=el('button','spk','🔊');b.type='button';b.setAttribute('aria-label','듣기');
  b.addEventListener('click',function(ev){ev.stopPropagation();speak(text,b);});
  return b;
}

/* ---------- question engine ---------- */
function Q(def, num, tabIdx, setObj){
  var self=this;
  this.def=def; this.state='idle'; this.tab=tabIdx; this.set=setObj;
  var card=el('div','q'); this.card=card;
  var top=el('div','qn');
  top.appendChild(el('span','num',String(num)));
  var tt={mc:'객관식',multi:'모두 고르기',in:'쓰기',ord:'배열'}[def.t];
  var tcls={mc:'b-sky',multi:'b-peach',in:'b-mint',ord:'b-lav'}[def.t];
  var qt=el('div','qt',(def.tag?'<span class="badge b-amb">'+def.tag+'</span> ':'')+'<span class="badge '+tcls+'">'+tt+'</span> '+def.q);
  top.appendChild(qt); card.appendChild(top);
  // 소리: 정답 문장 자동 생성(빈칸·괄호 고르기) 또는 영어 문장 문제엔 바로 듣기
  var HAN=/[가-힣ⓐ-ⓩ①-⑩]/;
  this.say=def.say||null;
  if(!this.say&&def.t==='mc'&&def.o&&!HAN.test(def.o[def.a])&&def.o[def.a]!=='×(없음)'){
    var segs=def.q.split('<br>');var last=segs[segs.length-1].replace(/<[^>]+>/g,'');
    var ans=def.o[def.a].replace(/<[^>]+>/g,'');
    if(/______/.test(last)&&(def.q.match(/______/g)||[]).length===1){var s1=last.replace(/^\s*(?:[A-Z]:|•)\s*/,'').replace('______',ans).replace(/\([^)]*[가-힣][^)]*\)/g,'').trim();if(!HAN.test(s1))this.say=s1;}
    else if(/\([^()]*\/[^()]*\)/.test(last)){var s2=last.replace(/\([^()]*\/[^()]*\)/,ans).trim();if(!HAN.test(s2))this.say=s2;}
  }
  var plain=def.q.replace(/<[^>]+>/g,'');
  if(!HAN.test(plain)&&!/______|\[|\//.test(plain)&&def.t!=='ord'){
    var qs=spkBtn(plain);qs.className='spk mini';qt.appendChild(qs);
  }
  if(def.p){var p=el('div','pass',def.p);card.appendChild(p);}
  var body=el('div','qbody'); card.appendChild(body);
  this.body=body;
  this['build_'+def.t]();
  var foot=el('div','qfoot');
  this.gBtn=el('button','btn fill sm','채점');this.gBtn.type='button';
  this.rBtn=el('button','btn sm','다시 풀기');this.rBtn.type='button';this.rBtn.style.display='none';
  this.aBtn=el('button','btn ghost sm','정답 보기');this.aBtn.type='button';this.aBtn.style.display='none';
  this.gBtn.addEventListener('click',function(){self.grade(true);});
  this.rBtn.addEventListener('click',function(){self.reset();});
  this.aBtn.addEventListener('click',function(){self.showAns();});
  foot.appendChild(this.gBtn);foot.appendChild(this.rBtn);foot.appendChild(this.aBtn);
  card.appendChild(foot);
  this.fb=el('div','fb');card.appendChild(this.fb);
  REG.push(this);
}
Q.prototype.build_mc=function(){
  var self=this,d=this.def; this.sel=null; this.optEls=[];
  var box=el('div','opts'+(d.inline?' inline':''));
  d.o.forEach(function(o,i){
    var b=el('button','opt',(d.nonum?'':NUMS[i]+' ')+o);b.type='button';
    b.addEventListener('click',function(){
      if(self.locked)return;
      self.optEls.forEach(function(x){x.classList.remove('sel');});
      b.classList.add('sel');self.sel=i;
    });
    self.optEls.push(b);box.appendChild(b);
  });
  this.body.appendChild(box);
};
Q.prototype.build_multi=function(){
  var self=this,d=this.def; this.sels={}; this.optEls=[];
  var box=el('div','opts');
  d.o.forEach(function(o,i){
    var b=el('button','opt',NUMS[i]+' '+o);b.type='button';
    b.addEventListener('click',function(){
      if(self.locked)return;
      if(self.sels[i]){delete self.sels[i];b.classList.remove('sel');}else{self.sels[i]=1;b.classList.add('sel');}
    });
    self.optEls.push(b);box.appendChild(b);
  });
  this.body.appendChild(box);
};
Q.prototype.build_in=function(){
  var self=this,d=this.def; this.inputs=[];
  if(d.s){
    var parts=d.s.split('[]');
    var w=el('div','tmpl');
    parts.forEach(function(pt,i){
      w.appendChild(document.createTextNode(''));
      var sp=el('span','',pt);w.appendChild(sp);
      if(i<parts.length-1){
        var inp=el('input','blank');inp.type='text';inp.autocomplete='off';inp.setAttribute('autocapitalize','off');inp.spellcheck=false;
        inp.addEventListener('keydown',function(e){if(e.key==='Enter'){self.grade(true);}});
        self.inputs.push(inp);w.appendChild(inp);
      }
    });
    this.body.appendChild(w);
  }else{
    var inp=el('input','blank wide');inp.type='text';inp.autocomplete='off';inp.setAttribute('autocapitalize','off');inp.spellcheck=false;
    inp.placeholder=d.ph||'여기에 쓰기';
    inp.addEventListener('keydown',function(e){if(e.key==='Enter'){self.grade(true);}});
    this.inputs.push(inp);this.body.appendChild(inp);
  }
};
Q.prototype.build_ord=function(){
  var self=this,d=this.def; this.placed=[];
  var w=el('div','ordwrap');
  this.slots=el('div','slots'+(d.blk?' block':''));
  this.hint=el('span','hint','↓ 아래 조각을 순서대로 누르세요 (다시 누르면 빠짐)');
  this.slots.appendChild(this.hint);
  this.pool=el('div','pool'+(d.blk?' block':''));
  var order=shuffleIdx(d.c.length,d.q+'|'+d.c.join('/'));
  this.poolBtns=[];
  order.forEach(function(ci){
    var b=el('button','chip',esc(d.c[ci]));b.type='button';b.dataset.ci=ci;
    b.addEventListener('click',function(){
      if(self.locked||b.classList.contains('used'))return;
      b.classList.add('used');self.place(ci,b);
    });
    self.poolBtns.push(b);self.pool.appendChild(b);
  });
  w.appendChild(this.slots);w.appendChild(this.pool);this.body.appendChild(w);
};
Q.prototype.place=function(ci,src){
  var self=this,d=this.def;
  if(this.hint.parentNode)this.hint.remove();
  var b=el('button','chip',esc(d.c[ci]));b.type='button';
  var item={ci:ci,el:b,src:src};
  b.addEventListener('click',function(){
    if(self.locked)return;
    var k=self.placed.indexOf(item);if(k>=0)self.placed.splice(k,1);
    b.remove();src.classList.remove('used');
    if(!self.placed.length)self.slots.appendChild(self.hint);
  });
  this.placed.push(item);this.slots.appendChild(b);
};
Q.prototype.answered=function(){
  var d=this.def;
  if(d.t==='mc')return this.sel!=null;
  if(d.t==='multi')return Object.keys(this.sels).length>0;
  if(d.t==='in')return this.inputs.every(function(i){return i.value.trim()!=='';});
  if(d.t==='ord')return this.placed.length===d.c.length;
};
Q.prototype.check=function(){
  var d=this.def,self=this;
  if(d.t==='mc')return this.sel===d.a;
  if(d.t==='multi'){var k=Object.keys(this.sels).map(Number).sort();var a=d.a.slice().sort();return k.length===a.length&&k.every(function(v,i){return v===a[i];});}
  if(d.t==='in'){
    var A=Array.isArray(d.a)?d.a:[d.a];
    var ok=true;
    this.inputs.forEach(function(inp,i){
      var good=alts(A[i]).indexOf(norm(inp.value))>=0;
      inp.classList.toggle('right',good);inp.classList.toggle('wrong',!good);
      if(!good)ok=false;
    });
    return ok;
  }
  if(d.t==='ord'){
    var got=this.placed.map(function(p){return norm(d.c[p.ci]);}).join(' ');
    var want=d.c.map(norm).join(' ');
    return got===want;
  }
};
Q.prototype.lock=function(v){
  this.locked=v;
  (this.optEls||[]).forEach(function(b){b.disabled=v;});
  (this.inputs||[]).forEach(function(i){i.readOnly=v;});
};
Q.prototype.grade=function(manual){
  if(this.state==='ok')return true;
  if(!this.answered()){
    if(manual){this.fb.className='fb show no';this.fb.innerHTML='먼저 답을 고르거나 써 주세요.';}
    return null;
  }
  var ok=this.check();
  var d=this.def;
  this.lock(true);
  this.gBtn.style.display='none';
  if(ok){
    this.state='ok';this.card.className='q ok';
    if(d.t==='mc'){this.optEls[d.a].classList.add('right');}
    if(d.t==='multi'){var s=this;d.a.forEach(function(i){s.optEls[i].classList.add('right');});}
    this.fb.className='fb show ok';this.fb.innerHTML='<b>정답!</b> '+(d.e||'')+this.sayHtml();
    this.rBtn.style.display='none';this.aBtn.style.display='none';
  }else{
    this.state='no';this.card.className='q no';
    if(d.t==='mc'){this.optEls[this.sel].classList.add('wrong');}
    if(d.t==='multi'){var s2=this;Object.keys(this.sels).forEach(function(i){if(d.a.indexOf(+i)<0)s2.optEls[i].classList.add('wrong');});}
    this.fb.className='fb show no';this.fb.innerHTML='<b>틀렸어요.</b> 다시 풀어 보거나 정답을 확인하세요.';
    this.rBtn.style.display='';this.aBtn.style.display='';
  }
  updateScores();
  return ok;
};
Q.prototype.sayHtml=function(){
  var s=this.say;
  if(!s&&this.def.t==='in'&&!this.def.s){var a=Array.isArray(this.def.a)?this.def.a[0]:this.def.a;a=firstShow(a).replace(/[()]/g,'');if(a.split(' ').length>=3)s=a;}
  if(!s&&this.def.t==='ord'&&!/[가-힣]/.test(this.def.c.join('')))s=this.def.c.join(' ');
  if(!s)return '';
  return '<div style="margin-top:6px" class="row"><button class="spk mini" data-say="'+esc(s).replace(/"/g,'&quot;')+'">🔊</button><span class="en">'+esc(s)+'</span></div>';
};
Q.prototype.ansText=function(){
  var d=this.def;
  if(d.t==='mc')return NUMS[d.a]+' '+d.o[d.a];
  if(d.t==='multi')return d.a.map(function(i){return NUMS[i]+' '+d.o[i];}).join(' / ');
  if(d.t==='in'){var A=Array.isArray(d.a)?d.a:[d.a];return A.map(firstShow).join(' / ');}
  if(d.t==='ord')return d.c.join(d.blk?'<br>→ ':' ');
};
Q.prototype.showAns=function(){
  var d=this.def,s=this;
  if(d.t==='mc')this.optEls[d.a].classList.add('right');
  if(d.t==='multi')d.a.forEach(function(i){s.optEls[i].classList.add('right');});
  this.state='shown';
  this.fb.className='fb show ans';
  this.fb.innerHTML='<b>정답:</b> '+this.ansText()+(d.e?'<br>'+d.e:'')+this.sayHtml();
  this.aBtn.style.display='none';
  updateScores();
};
Q.prototype.reset=function(){
  var d=this.def,self=this;
  this.state='idle';this.card.className='q';this.lock(false);
  this.fb.className='fb';this.fb.innerHTML='';
  this.gBtn.style.display='';this.rBtn.style.display='none';this.aBtn.style.display='none';
  if(this.optEls)this.optEls.forEach(function(b){b.classList.remove('sel','right','wrong');});
  if(d.t==='mc')this.sel=null;
  if(d.t==='multi')this.sels={};
  if(d.t==='in')this.inputs.forEach(function(i){i.value='';i.classList.remove('right','wrong');});
  if(d.t==='ord'){
    this.placed.forEach(function(p){p.el.remove();p.src.classList.remove('used');});
    this.placed=[];this.slots.appendChild(this.hint);
  }
  updateScores();
};

function QSet(blk, tabIdx){
  var self=this; this.qs=[];
  var wrap=el('div','qset');
  var head=el('div','qhead');
  head.appendChild(el('h3','',blk.title||'문제'));
  this.sc=el('span','score','0 / '+blk.qs.length);head.appendChild(this.sc);
  wrap.appendChild(head);
  if(blk.note)wrap.appendChild(el('div','tip',blk.note));
  if(blk.pass){var pb=el('div','pass big',blk.pass);wrap.appendChild(pb);}
  blk.qs.forEach(function(d,i){
    var q=new Q(d,i+(blk.start||1),tabIdx,self);self.qs.push(q);TABQ[tabIdx].push(q);wrap.appendChild(q.card);
  });
  var bar=el('div','sticky');
  var g=el('button','btn fill','전체 채점');g.type='button';
  var r=el('button','btn','틀린 것만 다시');r.type='button';
  g.addEventListener('click',function(){
    var un=0;self.qs.forEach(function(q){if(q.state==='idle'){var x=q.grade(false);if(x===null)un++;}});
    updateScores();
    var ok=self.qs.filter(function(q){return q.state==='ok';}).length;
    self.sc.textContent=ok+' / '+self.qs.length+(un?' (미응답 '+un+')':'');
  });
  r.addEventListener('click',function(){
    var first=null;
    self.qs.forEach(function(q){if(q.state==='no'||q.state==='shown'){q.reset();if(!first)first=q;}});
    if(first)first.card.scrollIntoView({behavior:'smooth',block:'center'});
  });
  bar.appendChild(g);bar.appendChild(r);wrap.appendChild(bar);
  this.el=wrap;
  SETS.push(this);
}
var SETS=[];
function updateScores(){
  SETS.forEach(function(s){
    var ok=s.qs.filter(function(q){return q.state==='ok';}).length;
    var t=s.sc.textContent;var m=t.match(/\(미응답 \d+\)/);
    s.sc.textContent=ok+' / '+s.qs.length;
  });
  TABQ.forEach(function(arr,i){
    var pg=document.querySelector('.tab[data-i="'+i+'"] .pg');
    if(!pg)return;
    if(!arr.length){pg.textContent='';return;}
    var ok=arr.filter(function(q){return q.state==='ok';}).length;
    pg.textContent=ok+'/'+arr.length;
  });
}

function build(){
  document.title=D.title;
  var hd=el('header','top');

  hd.appendChild(el('div','sub',D.sub));

  document.body.appendChild(hd);
  var main=el('main');document.body.appendChild(main);
  D.tabs.forEach(function(tb,ti){
    TABQ.push([]);
    var t=el('button','tab'+(ti===0?' on':''),esc(tb.name)+'<span class="pg"></span>');t.type='button';t.dataset.i=ti;
    t.addEventListener('click',function(){go(ti);});
    nav.appendChild(t);
    var pn=el('section','panel'+(ti===0?' on':''));pn.dataset.i=ti;
    if(tb.intro)pn.appendChild(el('div','intro',tb.intro));
    tb.blocks.forEach(function(b){
      var node;
      if(b.k==='html')node=el('div','',b.html);
      else if(b.k==='h')node=el('h2','sec',b.html);
      else if(b.k==='words')node=bWords(b);
      else if(b.k==='qset')node=new QSet(b,ti).el;
      else if(b.k==='analysis')node=bAnalysis(b);
      else if(b.k==='script')node=bScript(b);
      else if(b.k==='tapfill')node=bTapfill(b);
      else if(b.k==='wordlist')node=bWordlist(b);
      else if(b.k==='flip')node=bFlip(b);
      if(node)pn.appendChild(node);
    });
    if(ti<D.tabs.length-1){
      var nx=el('div','row');nx.style.justifyContent='center';nx.style.marginTop='20px';
      var nb=el('button','btn','다음: '+esc(D.tabs[ti+1].name)+' →');nb.type='button';
      nb.addEventListener('click',function(){go(ti+1);});nx.appendChild(nb);pn.appendChild(nx);
    }
    main.appendChild(pn);
  });
  main.appendChild(el('div','foot',D.brand+' · '+D.title));
  updateScores();
}
function go(i){
  document.querySelectorAll('.tab').forEach(function(t){t.classList.toggle('on',+t.dataset.i===i);});
  document.querySelectorAll('.panel').forEach(function(p){p.classList.toggle('on',+p.dataset.i===i);});
  var t=document.querySelector('.tab[data-i="'+i+'"]');if(t&&t.scrollIntoView)try{t.scrollIntoView({inline:'center',block:'nearest'});}catch(e){}
  window.scrollTo(0,0);pageSound();
}
/* ---------- 문장 번호 → 실제 문장 보기 ---------- */
var sheet=null;
function openRef(a,b){
  var S=D.sents;if(!S)return;
  if(!sheet){
    sheet=el('div','refsheet');
    sheet.innerHTML='<div class="rhead"><b></b><button type="button" class="rclose" aria-label="닫기">✕</button></div><div class="rbody"></div>';
    sheet.querySelector('.rclose').addEventListener('click',function(){sheet.classList.remove('show');});
    document.body.appendChild(sheet);
  }
  var body=sheet.querySelector('.rbody');body.innerHTML='';
  for(var n=a;n<=b;n++){
    var s=S[n];if(!s)continue;
    var r=el('div','rrow');
    var top=el('div','rtop','<span class="rn">'+n+'</span><span class="ren en">'+esc(s[0])+'</span>');
    top.appendChild(spkBtn(s[0]));
    r.appendChild(top);r.appendChild(el('div','rkr',esc(s[1])));
    body.appendChild(r);
  }
  sheet.querySelector('.rhead b').textContent='본문 '+(a===b?a+'번':a+'~'+b+'번');
  sheet.classList.add('show');body.scrollTop=0;
}
function linkRefs(root){
  var S=D.sents;if(!S)return;
  var max=Object.keys(S).length;
  var re=/(^|[^\d])(\((\d{1,2}(?:\s*~\s*\d{1,2})?)\)|(\d{1,2}(?:\s*~\s*\d{1,2})?(?:\s*[,·]\s*\d{1,2}(?:\s*~\s*\d{1,2})?)*)\s*번)/g;
  function mk(tok){
    var m=tok.match(/(\d{1,2})(?:\s*~\s*(\d{1,2}))?/);var a=+m[1],b=m[2]?+m[2]:a;
    if(a<1||b>max||b<a)return document.createTextNode(tok);
    var s=el('span','ref',esc(tok));s.dataset.a=a;s.dataset.b=b;return s;
  }
  root.querySelectorAll('.anal, .parahead').forEach(function(box){
    var walker=document.createTreeWalker(box,NodeFilter.SHOW_TEXT,null);
    var nodes=[];while(walker.nextNode())nodes.push(walker.currentNode);
    nodes.forEach(function(tn){
      if(tn.parentNode.closest('.ref'))return;
      var t=tn.nodeValue;re.lastIndex=0;if(!re.test(t))return;re.lastIndex=0;
      var frag=document.createDocumentFragment(),last=0,m;
      while((m=re.exec(t))){
        var start=m.index+m[1].length;
        frag.appendChild(document.createTextNode(t.slice(last,start)));
        if(m[3]!==undefined){ // (N) or (N~M)
          frag.appendChild(document.createTextNode('('));frag.appendChild(mk(m[3]));frag.appendChild(document.createTextNode(')'));
        }else{
          var parts=m[4].split(/(\s*[,·]\s*)/);var lastEl=null;
          parts.forEach(function(p){if(/^\s*[,·]\s*$/.test(p))frag.appendChild(document.createTextNode(p));else{lastEl=mk(p);frag.appendChild(lastEl);}});
          var suf=m[2].slice(m[4].length);
          if(lastEl&&lastEl.nodeType===1)lastEl.textContent+=suf;else frag.appendChild(document.createTextNode(suf));
        }
        last=start+m[2].length;
      }
      frag.appendChild(document.createTextNode(t.slice(last)));
      tn.parentNode.replaceChild(frag,tn);
    });
  });
  root.addEventListener('click',function(e){var r=e.target.closest&&e.target.closest('.ref');if(r){e.stopPropagation();openRef(+r.dataset.a,+r.dataset.b);}});
}
window.__L7={REG:REG,SETS:SETS,go:go,norm:norm,alts:alts,openRef:openRef};
build();
linkRefs(document);
})();
