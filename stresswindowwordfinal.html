<script>
/* ══ Audio/TTS/Timer ══ */
const _ac=new(window.AudioContext||window.webkitAudioContext)();
function playPageTurn(){try{if(_ac.state==='suspended')_ac.resume();const now=_ac.currentTime;const mk=(len,vol,delay,hp)=>{const buf=_ac.createBuffer(1,Math.floor(_ac.sampleRate*len),_ac.sampleRate);const d=buf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*(1-i/d.length);const src=_ac.createBufferSource();src.buffer=buf;const f=_ac.createBiquadFilter();f.type='highpass';f.frequency.value=hp;const g=_ac.createGain();g.gain.setValueAtTime(0,now+delay);g.gain.linearRampToValueAtTime(vol,now+delay+0.02);g.gain.exponentialRampToValueAtTime(0.001,now+delay+len);src.connect(f);f.connect(g);g.connect(_ac.destination);src.start(now+delay);src.stop(now+delay+len);};mk(0.16,0.32,0,1800);mk(0.07,0.14,0.09,3200);}catch(e){}}
let voice=null,ttsOk=false;
function lv(){const vs=speechSynthesis.getVoices();const p=['Google US English','Samantha','Microsoft Aria','Karen'];for(const n of p){const v=vs.find(x=>x.name===n);if(v){voice=v;return;}}voice=vs.find(v=>v.lang==='en-US')||null;}
if('speechSynthesis' in window){lv();speechSynthesis.onvoiceschanged=lv;}
function unlockTTS(){if(ttsOk||!('speechSynthesis' in window))return;const u=new SpeechSynthesisUtterance('');u.volume=0;speechSynthesis.speak(u);ttsOk=true;}
document.addEventListener('touchstart',unlockTTS,{once:true});document.addEventListener('click',unlockTTS,{once:true});
function speak(t,b){if(!('speechSynthesis' in window))return;unlockTTS();speechSynthesis.cancel();document.querySelectorAll('.snd.playing').forEach(x=>x.classList.remove('playing'));const u=new SpeechSynthesisUtterance(t);if(voice)u.voice=voice;u.lang='en-US';u.rate=.9;if(b){b.classList.add('playing');u.onend=()=>b.classList.remove('playing');}speechSynthesis.speak(u);}
function mkSnd(t){const b=document.createElement('button');b.className='snd';b.innerHTML='🔊';b.onclick=()=>speak(t,b);return b;}
let tSec=0,tInt=null;
function startT(){if(tInt)return;tInt=setInterval(()=>{tSec++;const m=String(Math.floor(tSec/60)).padStart(2,'0'),s=String(tSec%60).padStart(2,'0');document.getElementById('td').textContent=m+':'+s;},1000);}
document.addEventListener('click',startT,{once:true});
function norm(s){return(s||'').toLowerCase().replace(/[^a-z0-9\-\s]/gi,'').replace(/\s+/g,' ').trim();}
const _vMap={},_sMap={};
const completed=new Set();
function toggleAns(id){const el=document.getElementById(id);if(el)el.classList.toggle('open');}
function go(v){
  playPageTurn();
  for(let i=0;i<8;i++){const t=document.getElementById('t'+i);if(t){t.classList.toggle('on',i===v);if(completed.has(i))t.classList.add('done');else t.classList.remove('done');}}
  window.scrollTo(0,0);const app=document.getElementById('app');app.innerHTML='';
  setTimeout(()=>{app.classList.add('page-enter');[buildL3Blank,buildL3Sent,buildL3DlgA,buildL3DlgB,buildL4Blank,buildL4Sent,buildL4DlgA,buildL4DlgB][v]();setTimeout(()=>app.classList.remove('page-enter'),250);},80);
}

/* ══ BUILD FUNCTIONS ══ */
function buildVocabBlank(vocab,lessonLabel){
  const app=document.getElementById('app');
  let h=`<div class="desc">💡 <b>${lessonLabel} 부분빈칸</b> — 힌트를 보고 영어 단어를 입력하세요. Enter로 채점, 정답 보기 버튼으로 확인!</div>`;
  const byLesson=[...new Set(vocab.map(v=>v.lesson))];
  byLesson.forEach(les=>{
    h+=`<div class="glabel">${les}</div>`;
    vocab.filter(v=>v.lesson===les).forEach((v,i)=>{
      const idx=vocab.indexOf(v);
      const mtClass=['mt0','mt1','mt2'][v.mode];
      const mtLabel=['모음숨김','뒷부분','가운데'][v.mode];
      let polyHtml='';
      if(v.poly){
        polyHtml=`<div class="poly-box"><div class="poly-title">${v.poly.title}</div>`;
        v.poly.rows.forEach(r=>{polyHtml+=`<div class="poly-row"><span class="poly-num">${r.n}</span><span>${r.m} — </span><span class="poly-ex">${r.ex}</span></div>`;});
        if(v.poly.note)polyHtml+=`<div class="poly-note">${v.poly.note}</div>`;
        polyHtml+=`</div>`;
      }
      _vMap[idx]=v.en;
      h+=`<div class="vocab-card" id="vc${idx}">
        ${polyHtml}
        <div class="vc-top">
          <span class="vc-num">${idx+1}</span>
          <span class="${les==='L3'?'l3b':'l4b'}">${les}</span>
          <span class="vc-blank">${v.blank}</span>
          <span class="vc-kr">${v.kr}</span>
          <span class="${mtClass}">${mtLabel}</span>
        </div>
        <div class="vc-inp-row">
          <input class="vc-inp" id="vi${idx}" placeholder="영어 단어 입력..." onkeydown="if(event.key==='Enter')checkVI(${idx})">
          <button class="mini-btn" onclick="checkVI(${idx})">확인</button>
        </div>
        <div class="vc-fb" id="vf${idx}"></div>
        <div class="btn-row">
          <button class="mini-btn" onclick="speak('${v.en.replace(/'/g,"\\'")}')">🔊 듣기</button>
          <button class="mini-btn" onclick="toggleAns('va${idx}')">정답 보기</button>
        </div>
        <div class="ans-r" id="va${idx}">${v.en} — ${v.kr}</div>
      </div>`;
    });
  });
  const wrongIds=[];
  h+=`<div class="check-bar">
    <button class="cb cb-g" onclick="checkAllVI()">✅ 전체 채점</button>
    <button class="cb cb-r" id="cbRetry" disabled onclick="retryWrongVI()">🔄 틀린 것만</button>
    <button class="cb cb-s" onclick="resetVI()">초기화</button>
    <span class="result-pill" id="rpill"></span>
  </div>`;
  app.innerHTML=h;
}
function buildL3Blank(){buildVocabBlank(VOCAB_L3,'L3');}
function buildL4Blank(){buildVocabBlank(VOCAB_L4,'L4');}

function checkVI(idx){
  const ans=_vMap[idx];if(!ans)return;
  const inp=document.getElementById('vi'+idx);
  const fb=document.getElementById('vf'+idx);
  if(!inp||!fb)return;
  const ok=norm(inp.value)===norm(ans);
  inp.className='vc-inp '+(ok?'ok':'no');
  fb.className='vc-fb '+(ok?'ok':'no');
  fb.textContent=ok?'✅ 정답!':'❌ 오답 — 정답: '+ans;
}
let _wrongVI=[];
function checkAllVI(){
  _wrongVI=[];
  Object.keys(_vMap).forEach(idxStr=>{
    const idx=parseInt(idxStr);
    const ans=_vMap[idx];
    const inp=document.getElementById('vi'+idx);
    const fb=document.getElementById('vf'+idx);
    if(!inp)return;
    const ok=norm(inp.value)===norm(ans);
    inp.className='vc-inp '+(ok?'ok':(inp.value.trim()?'no':''));
    fb.className='vc-fb '+(ok?'ok':(inp.value.trim()?'no':''));
    if(ok){fb.textContent='✅ 정답!';}
    else if(inp.value.trim()){fb.textContent='❌ 정답: '+ans;_wrongVI.push(idx);}
  });
  const pill=document.getElementById('rpill');
  const total=Object.keys(_vMap).length;
  const done=Object.keys(_vMap).filter(i=>{const el=document.getElementById('vi'+i);return el&&el.value.trim();}).length;
  const okCnt=done-_wrongVI.length;
  pill.textContent=`${okCnt}/${done} 정답`;
  pill.className='result-pill '+(_wrongVI.length===0&&done>0?'pill-ok':'pill-bad');
  pill.style.display='inline-block';
  const rb=document.getElementById('cbRetry');
  if(rb)rb.disabled=_wrongVI.length===0;
}
function retryWrongVI(){
  _wrongVI.forEach(idx=>{
    const inp=document.getElementById('vi'+idx);
    const fb=document.getElementById('vf'+idx);
    if(inp){inp.value='';inp.className='vc-inp';}
    if(fb){fb.className='vc-fb';fb.textContent='';}
  });
  _wrongVI=[];
  const rb=document.getElementById('cbRetry');if(rb)rb.disabled=true;
}
function resetVI(){
  Object.keys(_vMap).forEach(i=>{
    const inp=document.getElementById('vi'+i);const fb=document.getElementById('vf'+i);
    if(inp){inp.value='';inp.className='vc-inp';}
    if(fb){fb.className='vc-fb';fb.textContent='';}
  });
  const pill=document.getElementById('rpill');if(pill)pill.style.display='none';
  const rb=document.getElementById('cbRetry');if(rb)rb.disabled=true;
}

/* ══ SENT BLANK ══ */
function buildSentBlank(vocab,lessonLabel){
  const app=document.getElementById('app');
  let h=`<div class="desc">💡 <b>${lessonLabel} 본문빈칸</b> — 한국어 뜻을 보고 문장 속 빈칸을 채우세요.</div>`;
  vocab.forEach((v,idx)=>{
    _sMap[idx]=v.sent.match(/\[(.+?)\]/)?.[1]||'';
    const sentDisplay=v.sent.replace(/\[(.+?)\]/,`<input class="inline-inp" id="si${idx}" placeholder="?" onkeydown="if(event.key==='Enter')checkSI(${idx})">`);
    h+=`<div class="vocab-card">
      <div class="sent-box">${sentDisplay}<span class="sk">${v.sentKr}</span></div>
      <div class="btn-row">
        <button class="mini-btn" onclick="checkSI(${idx})">확인</button>
        <button class="mini-btn" onclick="toggleAns('sa${idx}')">정답 보기</button>
        <button class="mini-btn" onclick="speak('${v.sent.replace(/\[|\]/g,'').replace(/'/g,"\\'")}')">🔊 듣기</button>
      </div>
      <div class="vc-fb" id="sf${idx}"></div>
      <div class="ans-r" id="sa${idx}">${v.sent.match(/\[(.+?)\]/)?.[1]||''}</div>
    </div>`;
  });
  const answers=vocab.map(v=>v.sent.match(/\[(.+?)\]/)?.[1]||'');
  h+=`<div class="check-bar">
    <button class="cb cb-g" onclick="checkAllSI()">✅ 전체 채점</button>
    <button class="cb cb-r" id="sbRetry" disabled onclick="retryWrongSI()">🔄 틀린 것만</button>
    <button class="cb cb-s" onclick="resetSI()">초기화</button>
    <span class="result-pill" id="spill"></span>
  </div>`;
  app.innerHTML=h;
}

function buildL4Sent(){buildSentBlank(VOCAB_L4,'L4');}

function checkSI(idx){
  const ans=_sMap[idx];if(ans===undefined)return;
  const inp=document.getElementById('si'+idx);const fb=document.getElementById('sf'+idx);
  if(!inp||!fb)return;
  const ok=norm(inp.value)===norm(ans);
  inp.className='inline-inp '+(ok?'ok':'no');
  fb.className='vc-fb '+(ok?'ok':'no');
  fb.textContent=ok?'✅ 정답!':'❌ 정답: '+ans;
}
let _wrongSI=[];
function checkAllSI(){
  _wrongSI=[];
  Object.keys(_sMap).forEach(idxStr=>{
    const idx=parseInt(idxStr);
    const ans=_sMap[idx];
    const inp=document.getElementById('si'+idx);const fb=document.getElementById('sf'+idx);
    if(!inp)return;
    const ok=norm(inp.value)===norm(ans);
    inp.className='inline-inp '+(ok?'ok':(inp.value.trim()?'no':''));
    fb.className='vc-fb '+(ok?'ok':(inp.value.trim()?'no':''));
    if(ok){fb.textContent='✅ 정답!';}
    else if(inp.value.trim()){fb.textContent='❌ 정답: '+ans;_wrongSI.push(idx);}
  });
  const done=Object.keys(_sMap).filter(i=>{const el=document.getElementById('si'+i);return el&&el.value.trim();}).length;
  const okCnt=done-_wrongSI.length;
  const pill=document.getElementById('spill');
  pill.textContent=`${okCnt}/${done} 정답`;pill.className='result-pill '+(_wrongSI.length===0&&done>0?'pill-ok':'pill-bad');pill.style.display='inline-block';
  const rb=document.getElementById('sbRetry');if(rb)rb.disabled=_wrongSI.length===0;
}
function retryWrongSI(){
  _wrongSI.forEach(idx=>{const inp=document.getElementById('si'+idx);const fb=document.getElementById('sf'+idx);if(inp){inp.value='';inp.className='inline-inp';}if(fb){fb.className='vc-fb';fb.textContent='';}});
  _wrongSI=[];const rb=document.getElementById('sbRetry');if(rb)rb.disabled=true;
}
function resetSI(){
  Object.keys(_sMap).forEach(i=>{const inp=document.getElementById('si'+i);const fb=document.getElementById('sf'+i);if(inp){inp.value='';inp.className='inline-inp';}if(fb){fb.className='vc-fb';fb.textContent='';}});
  const pill=document.getElementById('spill');if(pill)pill.style.display='none';
  const rb=document.getElementById('sbRetry');if(rb)rb.disabled=true;
}

/* ══ DIALOGUE ══ */
const _qMap={};  // qid -> q 객체 저장소

function buildDlg(dlgData,lessonLabel){
  const app=document.getElementById('app');
  let h=`<div class="desc">💡 <b>${lessonLabel} 대화문</b> — 핵심 표현을 읽고 문제를 풀어보세요. 모든 정답은 클릭 후 확인!</div>`;
  dlgData.forEach((dlg,di)=>{
    const spClass={W:'spW',B:'spB',G:'spG',B1:'spB1',B2:'spB2',A:'spA',Leah:'spLeah'};
    let linesH=dlg.lines.map(l=>`
      <div class="dlg-line">
        <span class="sp ${spClass[l.sp]||'spA'}">${l.sp}</span>
        <span class="dl-text">${l.text}</span>
      </div>`).join('');
    linesH+=`<div class="btn-row"><button class="mini-btn" onclick="speakAll(${di},'${lessonLabel}')">🔊 전체 듣기</button></div>`;

    let simH=dlg.similar.map(s=>`<div class="ks-item"><span class="poly-ex">${s.en}</span><div class="ks-kr">${s.kr}</div></div>`).join('');

    let qH='';
    dlg.qs.forEach((q,qi)=>{
      const qid=`${lessonLabel}_${di}_${qi}`;
      _qMap[qid]=q;  // 저장
      qH+=`<div class="q-card">`;
      if(q.tag)qH+=`<span class="q-tag warn">${q.tag}</span>`;
      else qH+=`<span class="q-tag">Q${qi+1}</span>`;
      qH+=`<div class="q-text">${q.q}</div>`;

      if(q.type==='mc-wrong'||q.type==='mc-match'||q.type==='mc-similar'){
        const opts=q.opts||[];
        qH+=`<div class="mc-opts">`;
        opts.forEach((opt,oi)=>{
          const safeOpt=opt.replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
          qH+=`<div class="mc-opt" id="mo_${qid}_${oi}" onclick="ansMC('${qid}',${oi})"><span class="on">${'①②③④⑤'[oi]}</span>${safeOpt}</div>`;
        });
        qH+=`</div>`;
        qH+=`<div class="q-fb" id="qf_${qid}"></div>`;
        qH+=`<div class="btn-row"><button class="mini-btn" onclick="toggleAns('qa_${qid}')">정답 보기</button></div>`;
        const correctAns=q.type==='mc-wrong'?(q.opts&&q.wrongIdx!==undefined?q.opts[q.wrongIdx]:''):( q.opts?q.opts[q.ans]:'');
        qH+=`<div class="ans-r" id="qa_${qid}">정답: ${correctAns}<br>${q.fb}</div>`;
      }
      else if(q.type==='fill'){
        const safeAns=(q.ans||'').replace(/'/g,'&#39;');
        qH+=`<div class="sent-box" style="margin-bottom:7px">${q.sent.replace('________',`<input class="inline-inp" id="fi_${qid}" placeholder="?" onkeydown="if(event.key==='Enter')checkFill('${qid}')" style="min-width:100px">`)}</div>`;
        qH+=`<div class="btn-row"><button class="mini-btn" onclick="checkFill('${qid}')">확인</button><button class="mini-btn" onclick="toggleAns('qa_${qid}')">정답 보기</button></div>`;
        qH+=`<div class="vc-fb" id="qf_${qid}"></div>`;
        qH+=`<div class="ans-r" id="qa_${qid}">정답: ${q.ans}<br>${q.fb}</div>`;
      }
      else if(q.type==='order'){
        const chips=q.chips;
        qH+=`<div class="chip-pool" id="cp_${qid}">`;
        chips.forEach((c,ci)=>{
          const safeC=c.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
          qH+=`<div class="ord-chip" id="oc_${qid}_${ci}" onclick="addOrdChip('${qid}',${ci})">${safeC}</div>`;
        });
        qH+=`</div>`;
        qH+=`<div class="ord-slots" id="os_${qid}"><span style="color:var(--muted);font-size:12px">여기에 순서대로 클릭하세요</span></div>`;
        qH+=`<div class="btn-row"><button class="mini-btn" onclick="checkOrder('${qid}')">확인</button><button class="mini-btn" onclick="resetOrder('${qid}',${chips.length})">초기화</button><button class="mini-btn" onclick="toggleAns('qa_${qid}')">정답 보기</button></div>`;
        qH+=`<div class="q-fb" id="qf_${qid}"></div>`;
        qH+=`<div class="ans-r" id="qa_${qid}">정답 순서: ${q.ans.map(i=>chips[i]).join(' → ')}<br>${q.fb}</div>`;
      }
      else if(q.type==='insert'){
        qH+=`<div class="ins-box"><div class="ilab">삽입할 문장</div><div class="itext">${q.ins}</div></div>`;
        // q.lines에서 {INSERT} 제외하고 번호 표시
        const realLines=q.lines.filter(l=>l!=='{INSERT}');
        realLines.forEach((l,li)=>{
          qH+=`<div style="font-size:13px;padding:3px 0;font-family:'Lora',serif">${li+1}. ${l}</div>`;
        });
        qH+=`<div style="margin-top:8px;font-size:12px;color:var(--muted);font-weight:700">삽입 위치 선택 (몇 번 뒤):</div>`;
        qH+=`<div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:5px">`;
        // 0번 앞 포함, 각 줄 뒤마다 버튼
        for(let p=0;p<=realLines.length;p++){
          const label=p===0?'맨 앞':`${p}번 뒤`;
          qH+=`<button class="mini-btn" id="ib_${qid}_${p}" onclick="checkInsert('${qid}',${p})">${label}</button>`;
        }
        qH+=`</div>`;
        qH+=`<div class="q-fb" id="qf_${qid}"></div>`;
        qH+=`<div class="btn-row"><button class="mini-btn" onclick="toggleAns('qa_${qid}')">정답 보기</button></div>`;
        qH+=`<div class="ans-r" id="qa_${qid}">정답: ${q.pos===0?'맨 앞':q.pos+'번 뒤'}<br>${q.exp}</div>`;
      }
      qH+=`</div>`;
    });

    h+=`<div class="dlg-sec">
      <div class="dlg-title">📝 ${dlg.title}</div>
      <div class="key-box">
        <div class="key-main">${dlg.keyExpr}</div>
        <div class="key-meaning">${dlg.keyMeaning}</div>
        <div class="key-usage">${dlg.keyUsage}</div>
        <div class="key-similar">
          <div class="ks-title">바꿔 쓸 수 있는 표현</div>
          ${simH}
        </div>
      </div>
      <div class="warn-box">
        <div class="wt">⚠️ 함정 (틀린 표현)</div>
        <div class="wr"><span class="wbad">${dlg.wrong.en}</span> → <span class="wgood">${dlg.wrong.exp}</span></div>
      </div>
      <div class="dlg-lines">${linesH}</div>
      ${qH}
    </div>`;
  });
  app.innerHTML=h;
}
function buildL3DlgA(){buildDlg(L3_DLG_A,'L3A');}
function buildL3DlgB(){buildDlg(L3_DLG_B,'L3B');}
function buildL4DlgA(){buildDlg(L4_DLG_A,'L4A');}
function buildL4DlgB(){buildDlg(L4_DLG_B,'L4B');}

/* ══ MC ══ */
function ansMC(qid,sel){
  const q=_qMap[qid];if(!q)return;
  let ok=false;
  if(q.type==='mc-wrong'){
    ok=(sel===q.wrongIdx);
  } else {
    ok=(sel===q.ans);
  }
  const allOpts=document.querySelectorAll(`[id^="mo_${qid}_"]`);
  allOpts.forEach((el,i)=>{
    el.classList.remove('ok','no','rv');
    if(i===sel)el.classList.add(ok?'ok':'no');
    if(!ok){
      const ci=q.type==='mc-wrong'?q.wrongIdx:q.ans;
      if(i===ci)el.classList.add('rv');
    }
  });
  const fb=document.getElementById('qf_'+qid);
  if(fb){fb.className='q-fb show '+(ok?'ok':'no');fb.textContent=(ok?'✅ ':'❌ ')+q.fb;}
}

/* ══ FILL ══ */
function checkFill(qid){
  const q=_qMap[qid];if(!q)return;
  const inp=document.getElementById('fi_'+qid);const fb=document.getElementById('qf_'+qid);
  if(!inp||!fb)return;
  const ok=norm(inp.value)===norm(q.ans);
  inp.className='inline-inp '+(ok?'ok':'no');
  fb.className='vc-fb '+(ok?'ok':'no');
  fb.textContent=ok?'✅ 정답!':'❌ 정답: '+q.ans;
}

/* ══ ORDER ══ */
const ordPlaced={};
function addOrdChip(qid,ci){
  const chip=document.getElementById('oc_'+qid+'_'+ci);
  if(!chip||chip.classList.contains('used'))return;
  chip.classList.add('used');
  if(!ordPlaced[qid])ordPlaced[qid]=[];
  ordPlaced[qid].push(ci);
  const slots=document.getElementById('os_'+qid);
  if(!slots)return;
  const hint=slots.querySelector('span');
  if(hint)hint.remove();
  const s=document.createElement('div');
  s.className='ord-slot';
  s.textContent=chip.textContent;
  s.onclick=function(){
    const idx=ordPlaced[qid].indexOf(ci);
    if(idx>-1)ordPlaced[qid].splice(idx,1);
    s.remove();
    chip.classList.remove('used');
    if(slots.children.length===0)slots.innerHTML='<span style="color:var(--muted);font-size:12px">여기에 순서대로 클릭하세요</span>';
  };
  slots.appendChild(s);
}
function checkOrder(qid){
  const q=_qMap[qid];if(!q)return;
  const placed=ordPlaced[qid]||[];
  const ok=placed.length===q.ans.length&&placed.every((v,i)=>v===q.ans[i]);
  const fb=document.getElementById('qf_'+qid);
  if(fb){fb.className='q-fb show '+(ok?'ok':'no');fb.textContent=ok?'✅ 정답! — '+q.fb:'❌ 순서를 다시 확인해 보세요. — '+q.fb;}
}
function resetOrder(qid,len){
  ordPlaced[qid]=[];
  const slots=document.getElementById('os_'+qid);
  if(slots)slots.innerHTML='<span style="color:var(--muted);font-size:12px">여기에 순서대로 클릭하세요</span>';
  for(let i=0;i<len;i++){const c=document.getElementById(`oc_${qid}_${i}`);if(c)c.classList.remove('used');}
  const fb=document.getElementById('qf_'+qid);if(fb){fb.className='q-fb';fb.textContent='';}
}

/* ══ INSERT ══ */
function checkInsert(qid,sel){
  const q=_qMap[qid];if(!q)return;
  const ok=(sel===q.pos);
  const fb=document.getElementById('qf_'+qid);
  if(fb){fb.className='q-fb show '+(ok?'ok':'no');fb.textContent=(ok?'✅ 정답! — ':'❌ 오답 — ')+q.exp;}
  document.querySelectorAll(`[id^="ib_${qid}_"]`).forEach(b=>{b.className='mini-btn';});
  const btn=document.getElementById(`ib_${qid}_${sel}`);if(btn)btn.className='mini-btn '+(ok?'ok':'no');
}

/* ══ SPEAK ALL ══ */
function speakAll(di,les){
  const dlgArr=les==='L3A'?L3_DLG_A:les==='L3B'?L3_DLG_B:les==='L4A'?L4_DLG_A:L4_DLG_B;
  const lines=dlgArr[di].lines;
  let i=0;
  function next(){if(i>=lines.length)return;const u=new SpeechSynthesisUtterance(lines[i].text);if(voice)u.voice=voice;u.lang='en-US';u.rate=.9;u.onend=()=>{i++;setTimeout(next,400);};speechSynthesis.cancel();speechSynthesis.speak(u);}
  unlockTTS();next();
}
