<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>준티 잉글리쉬 · 거꾸로 영작 · 동아(윤정미) Lesson 5</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=Lora:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f5f4fa; --card:#ffffff; --card2:#eeecf7; --card3:#f8f7fd;
  --purple:#5b4fa8; --purple-lt:#ece9f8; --purple-dk:#3b2f8a; --purple-sf:#7b6fd0;
  --green:#1a7a3c; --green-lt:#e8f5ec;
  --amber:#e8a020; --amber-lt:#fef3dc;
  --blue:#1a5c9e; --blue-lt:#e8f0fb;
  --red:#c0392b; --red-lt:#fdecea;
  --ink:#1a1a2e; --sub:#6b6880; --border:#d8d4ee;
  --r:12px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Noto Sans KR',sans-serif;background:var(--bg);color:var(--ink);line-height:1.75;
  -webkit-font-smoothing:antialiased;padding-bottom:80px}
.wrap{max-width:740px;margin:0 auto;padding:0 16px}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* header */
header{padding:26px 0 14px}
.brand{font-size:.78rem;font-weight:700;color:var(--purple);letter-spacing:.02em}
h1{font-family:'Lora',serif;font-size:1.55rem;line-height:1.35;margin:6px 0 4px;font-weight:600}
.sub{font-size:.9rem;color:var(--sub)}

/* story rail */
.rail{display:flex;gap:6px;margin:18px 0 6px}
.rail div{flex:1;text-align:center;font-size:.76rem;font-weight:500;color:var(--sub);
  padding:9px 2px;border-radius:9px;background:var(--card);border:1.5px solid var(--border)}
.rail div.on{background:var(--purple);border-color:var(--purple);color:#fff;font-weight:700}
.rail div.done{background:var(--green-lt);border-color:#b2d8c2;color:var(--green)}
.railnote{font-size:.78rem;color:var(--sub);text-align:center;margin-bottom:20px}

/* step bar */
.steps{display:flex;gap:8px;margin:0 0 16px}
.steps button{flex:1;font-family:inherit;font-size:.84rem;font-weight:700;padding:11px 4px;
  border-radius:10px;border:1.5px solid var(--border);background:var(--card);color:var(--sub);cursor:pointer}
.steps button.on{background:var(--purple-lt);border-color:var(--purple);color:var(--purple-dk)}
.steps button.done{background:var(--green-lt);border-color:#b2d8c2;color:var(--green)}
.steps button:disabled{opacity:.45;cursor:not-allowed}

/* card */
.card{background:var(--card);border:1.5px solid var(--border);border-radius:var(--r);
  padding:22px 20px;margin-bottom:16px}
.card h2{font-size:1.05rem;font-weight:700;margin-bottom:6px;color:var(--purple-dk)}
.lead{font-size:.92rem;color:var(--sub);margin-bottom:16px}
.gist{background:var(--purple-lt);border-radius:10px;padding:16px 18px;margin-bottom:18px;
  font-size:.98rem;line-height:1.85}
.flow{list-style:none}
.flow li{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-bottom:1px dashed var(--border)}
.flow li:last-child{border-bottom:0}
.fn{flex:0 0 auto;font-size:.74rem;font-weight:700;padding:3px 9px;border-radius:999px;
  background:var(--blue-lt);color:var(--blue);white-space:nowrap;margin-top:3px}
.fk{font-size:.94rem;line-height:1.7}

/* buttons */
.btn{font-family:inherit;font-size:.95rem;font-weight:700;padding:13px 20px;border-radius:10px;
  border:0;background:var(--purple);color:#fff;cursor:pointer}
.btn:disabled{background:#c9c4e2;cursor:not-allowed}
.btn.ghost{background:var(--card);color:var(--purple-dk);border:1.5px solid var(--border)}
.btn.wide{width:100%}
.btn.sm{font-size:.85rem;padding:9px 14px}
.btnrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.sound{font-family:inherit;font-size:.85rem;padding:7px 13px;border-radius:999px;
  border:1.5px solid var(--border);background:var(--card3);color:var(--purple-dk);cursor:pointer}

/* order trainer */
.qhead{font-size:.8rem;font-weight:700;color:var(--purple);margin-bottom:8px}
.kosent{font-size:1.05rem;font-weight:500;line-height:1.8;margin-bottom:16px}
.chunks{display:flex;flex-direction:column;gap:8px;margin-bottom:18px}
.chunk{display:flex;gap:10px;align-items:center;background:var(--card3);
  border:1.5px solid var(--border);border-radius:10px;padding:11px 13px}
.cnum{flex:0 0 26px;height:26px;line-height:24px;text-align:center;border-radius:50%;
  background:var(--purple);color:#fff;font-size:.82rem;font-weight:700}
.ctxt{flex:1;font-size:.95rem}
.crole{font-size:.74rem;font-weight:700;color:var(--sub);background:var(--card2);
  padding:3px 9px;border-radius:999px;white-space:nowrap}
.slotline{background:var(--purple-lt);border-radius:10px;padding:14px;margin-bottom:12px;min-height:58px;
  display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.slotline .ph{color:var(--sub);font-size:.88rem}
.slot{width:38px;height:38px;line-height:36px;text-align:center;border-radius:9px;
  background:#fff;border:2px solid var(--purple);color:var(--purple-dk);font-weight:700}
.pad{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.pad button{width:52px;height:52px;font-family:inherit;font-size:1.15rem;font-weight:700;
  border-radius:11px;border:1.5px solid var(--border);background:var(--card);color:var(--purple-dk);cursor:pointer}
.pad button:disabled{opacity:.35;cursor:not-allowed}
.eng{display:flex;flex-direction:column;gap:6px;margin-top:14px}
.engrow{display:flex;gap:10px;align-items:baseline;background:var(--green-lt);
  border-radius:9px;padding:9px 12px}
.engrow b{flex:0 0 22px;color:var(--green);font-size:.82rem}
.engrow span{font-family:'Lora',serif;font-size:1rem}
.diff{background:var(--amber-lt);border-left:4px solid var(--amber);border-radius:0 9px 9px 0;
  padding:13px 15px;margin-top:14px;font-size:.93rem;line-height:1.75}
.diff b{color:#a06b00}

/* writing */
.wq{border:1.5px solid var(--border);border-radius:11px;padding:16px;margin-bottom:12px;background:var(--card)}
.wq.ok{background:var(--green-lt);border-color:#b2d8c2}
.wq .num{font-size:.76rem;font-weight:700;color:var(--sub)}
.wq .ko{font-size:1rem;font-weight:500;margin:5px 0 11px;line-height:1.75}
.wq input{width:100%;font-family:'Lora',serif;font-size:1.02rem;padding:12px 13px;
  border:1.5px solid var(--border);border-radius:9px;background:#fff;color:var(--ink)}
.wq input:focus{outline:2px solid var(--purple-sf);outline-offset:1px}
.fb{margin-top:10px;font-size:.92rem;line-height:1.8}
.fb .tk{display:inline-block;padding:1px 5px;border-radius:5px;margin:1px 2px;font-family:'Lora',serif}
.tk.g{background:#d5efdd;color:var(--green)}
.tk.b{background:#fadcd8;color:var(--red);text-decoration:line-through}
.tk.m{background:var(--card2);color:var(--purple-dk)}
.ansline{font-family:'Lora',serif;font-size:1rem;background:#fff;border:1.5px dashed var(--border);
  border-radius:9px;padding:10px 12px;margin-top:9px}
.hintline{font-family:'Lora',serif;font-size:.95rem;color:var(--sub);margin-top:8px;letter-spacing:.06em}
.msg{font-weight:700;margin-bottom:6px}
.msg.ok{color:var(--green)} .msg.no{color:var(--red)}
.bar{position:sticky;bottom:0;background:rgba(245,244,250,.96);border-top:1.5px solid var(--border);
  padding:12px 0;margin-top:8px;display:flex;gap:8px;flex-wrap:wrap}
.progress{font-size:.85rem;color:var(--sub);text-align:center;margin:10px 0}
.hidden{display:none}
.locked{text-align:center;color:var(--sub);font-size:.92rem;padding:26px 10px}
footer{text-align:center;font-size:.78rem;color:var(--sub);padding:26px 0 10px}
</style>
</head>
<body>
<div class="wrap">
<header>
  <div class="brand">준티 잉글리쉬</div>
  <h1>거꾸로 영작 · Street Art in London</h1>
  <div class="sub">동아(윤정미) Lesson 5 · 본문 28문장 — 한글 문단을 분석하고, 어순을 뒤집어서, 영어로 쓴다</div>
</header>

<div class="rail" id="rail"></div>
<div class="railnote" id="railnote"></div>

<div class="steps" id="steps">
  <button id="sb0" onclick="goStep(0)">1 · 문단 읽기</button>
  <button id="sb1" onclick="goStep(1)">2 · 어순 바꾸기</button>
  <button id="sb2" onclick="goStep(2)">3 · 영작</button>
</div>

<div id="stage"></div>
</div>

<footer>준티 잉글리쉬 · 강동미나</footer>

<script>
/* ================= 데이터 ================= */
const PARAS = [
{
  tag:"도입", title:"거리 예술이란, 그리고 오늘의 계획",

    {fn:"오늘의 계획", ko:"오늘 우리는 런던의 잘 알려진 거리 예술 작품들을 볼 것이다."}

    { ko:"현대의 거리 예술은 다양한 형태로 나타나며, 그것은 도시를 다채롭고 활기차게 만든다.",
      chunks:[{ko:"현대의 거리 예술은",role:"주어"},{ko:"다양한 형태로",role:"방식"},{ko:"나타난다",role:"동사"},{ko:"그리고 그것은",role:"주어2"},{ko:"도시를",role:"목적어"},{ko:"다채롭고 활기차게",role:"목적격보어"},{ko:"만든다",role:"동사2"}],
      seq:[1,3,2,4,7,5,6],
      eng:["Modern street art","comes","in many different forms,","and it","makes","cities","colorful and lively"],

      seq:[1,2,5,4,3],

  write:[

  ]
},
{
  tag:"STIK", title:"첫 번째 장소 — Shoreditch, 화가 STIK",
  gist:"첫 번째 정거장이다. <b>장소 소개 → 그 동네의 변화 → 작품 가리키기 → 작가 소개 → 작품의 의미 → 질문과 힌트</b> 순서로 간다. 마지막에 답을 바로 주지 않고 '눈을 자세히 보라'는 <b>단서</b>만 남기고 넘어가는 것이 이 문단의 특징이다.",

      diff:"이 과의 핵심 문법이다. 한글은 <b>'우리가 방문할' + 장소</b>처럼 꾸밈말이 앞이지만, 영어는 <b>The place를 먼저 쓰고 that절을 뒤에</b> 붙인다. 목적격 관계대명사 자리."},
    { ko:"그는 인체를 그린 그의 그림에서 선과 점만을 사용하는 것으로 유명하다.",

      seq:[1,5,4,3,2],

  write:[

{
  tag:"Banksy", title:"두 번째 장소 — Finsbury Park, Banksy",

/* ================= 상태 ================= */
let P = 0;                 // 현재 문단
let step = 0;              // 0 읽기 / 1 어순 / 2 영작
const doneStep = PARAS.map(()=>[false,false,false]);
const ordState = PARAS.map(p=>p.order.map(()=>({picks:[],solved:false})));
const wrState  = PARAS.map(p=>p.write.map(()=>({solved:false,tried:false,hint:false,val:'',fb:''})));
let retryOnly = false;

/* ================= 소리 ================= */
let voices=[], ttsReady=false;
function loadVoices(){ try{ voices = speechSynthesis.getVoices()||[]; }catch(e){ voices=[]; } }
if('speechSynthesis' in window){ loadVoices(); speechSynthesis.onvoiceschanged = loadVoices; }
function unlockTTS(){
  if(ttsReady || !('speechSynthesis' in window)) return;
  try{ const u=new SpeechSynthesisUtterance(' '); u.volume=0; speechSynthesis.speak(u); ttsReady=true; }catch(e){}
}
document.addEventListener('touchstart', unlockTTS, {once:true});
document.addEventListener('click', unlockTTS, {once:true});
function speak(text, slow){
  if(!('speechSynthesis' in window)) return;
  try{
    speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(text);
    u.lang='en-US'; u.rate = slow?0.65:0.9;
    const want=['Google US English','Samantha','Microsoft Aria Online (Natural) - English (United States)','Alex'];
    for(const w of want){ const v=voices.find(v=>v.name===w); if(v){ u.voice=v; break; } }
    if(!u.voice){ const v=voices.find(v=>/^en(-|_)US/i.test(v.lang)); if(v) u.voice=v; }
    speechSynthesis.speak(u);
  }catch(e){}
}
/* 페이지 넘김음 — 문단 이동에만 */
let actx=null;
function pageTurn(){
  try{
    actx = actx || new (window.AudioContext||window.webkitAudioContext)();
    const t=actx.currentTime, o=actx.createOscillator(), g=actx.createGain();
    o.type='triangle'; o.frequency.setValueAtTime(420,t); o.frequency.exponentialRampToValueAtTime(190,t+0.16);
    g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(0.09,t+0.02);
    g.gain.exponentialRampToValueAtTime(0.0001,t+0.22);
    o.connect(g); g.connect(actx.destination); o.start(t); o.stop(t+0.24);
  }catch(e){}
}

/* ================= 유틸 ================= */
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function norm(s){
  return String(s).toLowerCase().replace(/[\u2018\u2019]/g,"'").replace(/[^a-z0-9'\-\s]/gi,' ')
    .replace(/\s+/g,' ').trim();
}
function tokens(s){ const n=norm(s); return n?n.split(' '):[]; }
function firstLetters(en){
  return tokens(en).map(w=> w.length>1 ? w[0]+'_'.repeat(Math.min(w.length-1,6)) : w).join(' ');
}
function goTop(){ window.scrollTo(0,0); }

/* ================= 레일 · 스텝바 ================= */
function renderRail(){
  const r=document.getElementById('rail'); r.innerHTML='';
  PARAS.forEach((p,i)=>{
    const d=document.createElement('div');
    d.textContent=p.tag;
    if(i===P) d.className='on';
    else if(doneStep[i].every(Boolean)) d.className='done';
    r.appendChild(d);
  });
  document.getElementById('railnote').innerHTML =
    '문단 '+(P+1)+' / '+PARAS.length+' · <b>'+esc(PARAS[P].title)+'</b>';
  for(let s=0;s<3;s++){
    const b=document.getElementById('sb'+s);
    b.className = (s===step?'on':(doneStep[P][s]?'done':''));
    b.disabled = s>0 && !doneStep[P][s-1];
  }
}
function goStep(s){
  if(s>0 && !doneStep[P][s-1]) return;
  step=s; retryOnly=false; render(); goTop();
}
function unlock(s){ doneStep[P][s]=true; }

/* ================= 렌더 ================= */
function render(){
  renderRail();
  const st=document.getElementById('stage');
  if(step===0) st.innerHTML=viewRead();
  else if(step===1) st.innerHTML=viewOrder();
  else st.innerHTML=viewWrite();
}

/* --- STEP 1 : 문단 읽기 --- */
function viewRead(){
  const p=PARAS[P];
  let li=p.flow.map(f=>'<li><span class="fn">'+esc(f.fn)+'</span><span class="fk">'+esc(f.ko)+'</span></li>').join('');
  return '<div class="card">'+
    '<h2>'+esc(p.title)+'</h2>'+
    '<div class="lead">영작하기 전에, 이 문단이 무슨 말을 어떤 순서로 하는지부터 잡는다.</div>'+
    '<div class="gist">'+p.gist+'</div>'+
    '<h2 style="font-size:.95rem;margin-bottom:8px">문장이 하는 일</h2>'+
    '<ul class="flow">'+li+'</ul>'+
    '<div class="btnrow"><button class="btn wide" onclick="readDone()">흐름 파악했어요 · 어순 단계로</button></div>'+
  '</div>';
}
function readDone(){ unlock(0); step=1; render(); goTop(); }

/* --- STEP 2 : 어순 바꾸기 --- */
function viewOrder(){
  const p=PARAS[P];
  let html='<div class="card"><h2>한글 순서를 영어 순서로</h2>'+
    '<div class="lead">한글 덩어리에 번호가 붙어 있다. 영어로 쓸 때의 순서대로 번호를 눌러라. 영어는 아직 쓰지 않는다.</div></div>';
  p.order.forEach((q,qi)=>{
    const s=ordState[P][qi];
    let chunks=q.chunks.map((c,ci)=>
      '<div class="chunk"><div class="cnum">'+(ci+1)+'</div><div class="ctxt">'+esc(c.ko)+'</div><div class="crole">'+esc(c.role)+'</div></div>').join('');
    let slots = s.picks.length
      ? s.picks.map(n=>'<div class="slot">'+n+'</div>').join('')
      : '<span class="ph">영어 순서대로 아래 번호를 누르세요</span>';
    let pad = q.chunks.map((c,ci)=>{
      const n=ci+1, used=s.picks.indexOf(n)>=0;
      return '<button onclick="pick('+qi+','+n+')"'+((used||s.solved)?' disabled':'')+'>'+n+'</button>';
    }).join('');
    let body='';
    if(s.solved){
      const rows=q.seq.map((n,i)=>'<div class="engrow"><b>'+n+'</b><span>'+esc(q.eng[i])+'</span></div>').join('');
      body='<div class="eng">'+rows+'</div>'+
        '<div class="diff"><b>한글과 뒤집힌 지점</b><br>'+q.diff+'</div>'+
        '<div class="btnrow"><button class="sound" onclick="speak(_ordFull('+P+','+qi+'),false)">🔊 문장 듣기</button>'+
        '<button class="sound" onclick="speak(_ordFull('+P+','+qi+'),true)">🐢 천천히</button></div>';
    }else{
      body='<div class="btnrow">'+
        '<button class="btn ghost sm" onclick="undo('+qi+')">← 하나 지우기</button>'+
        '<button class="btn ghost sm" onclick="clr('+qi+')">전체 지우기</button>'+
        '<button class="btn sm" onclick="checkOrd('+qi+')"'+(s.picks.length===q.chunks.length?'':' disabled')+'>순서 확인</button>'+
        '</div><div class="fb" id="ofb'+qi+'"></div>';
    }
    html+='<div class="card">'+
      '<div class="qhead">어순 '+(qi+1)+' / '+p.order.length+'</div>'+
      '<div class="kosent">'+esc(q.ko)+'</div>'+
      '<div class="chunks">'+chunks+'</div>'+
      '<div class="slotline">'+slots+'</div>'+
      '<div class="pad">'+pad+'</div>'+
      body+'</div>';
  });
  const all=ordState[P].every(s=>s.solved);
  html+='<div class="card"><button class="btn wide" onclick="orderDone()"'+(all?'':' disabled')+'>'+
    (all?'어순 훈련 끝 · 영작 단계로':'모든 문장의 순서를 맞혀야 열립니다')+'</button></div>';
  return html;
}
function _ordFull(pi,qi){ return PARAS[pi].order[qi].full; }
function pick(qi,n){
  const s=ordState[P][qi]; if(s.solved) return;
  if(s.picks.indexOf(n)<0) s.picks.push(n);
  render();
}
function undo(qi){ ordState[P][qi].picks.pop(); render(); }
function clr(qi){ ordState[P][qi].picks=[]; render(); }
function checkOrd(qi){
  const q=PARAS[P].order[qi], s=ordState[P][qi];
  const ok = s.picks.length===q.seq.length && s.picks.every((n,i)=>n===q.seq[i]);
  if(ok){ s.solved=true; render(); }
  else{
    const first = s.picks.findIndex((n,i)=>n!==q.seq[i]);
    s.picks=[];
    render();
    const fb=document.getElementById('ofb'+qi);
    if(fb) fb.innerHTML='<div class="msg no">'+(first===0?'첫 번째 자리부터 달라요.':(first+1)+'번째 자리부터 달라요.')+'</div>'+
      '<div>영어는 <b>주어 → 동사</b>가 먼저 붙고, 꾸미는 말은 뒤로 갑니다. 다시 눌러 보세요.</div>';
  }
}
function orderDone(){ unlock(1); step=2; render(); goTop(); }

/* --- STEP 3 : 거꾸로 영작 --- */
function viewWrite(){
  const p=PARAS[P];
  let html='<div class="card"><h2>한글을 보고 영어로 쓰기</h2>'+
    '<div class="lead">방금 잡은 어순 그대로 쓴다. 틀리면 정답을 보여주고, 정답을 보고 다시 정확히 써야 통과된다.</div></div>';
  let shown=0;
  p.write.forEach((w,wi)=>{
    const s=wrState[P][wi];
    if(retryOnly && s.solved) return;
    shown++;
    html+='<div class="wq'+(s.solved?' ok':'')+'" id="wq'+wi+'">'+
      '<div class="num">문장 '+(wi+1)+'</div>'+
      '<div class="ko">'+esc(w.ko)+'</div>'+
      '<input id="wi'+wi+'" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" value="'+esc(s.val)+'" '+
        (s.solved?'disabled ':'')+'placeholder="영어로 쓰세요" onkeydown="if(event.key===\'Enter\')checkWrite('+wi+')">'+
      (s.hint&&!s.solved?'<div class="hintline">'+esc(firstLetters(w.en))+'</div>':'')+
      '<div class="btnrow">'+
        (s.solved?'':'<button class="btn sm" onclick="checkWrite('+wi+')">채점</button>')+
        (s.solved?'':'<button class="btn ghost sm" onclick="showHint('+wi+')">첫 글자 힌트</button>')+
        (s.solved?'<button class="sound" onclick="speak(_wrEn('+P+','+wi+'),false)">🔊 듣기</button><button class="sound" onclick="speak(_wrEn('+P+','+wi+'),true)">🐢 천천히</button>':'')+
      '</div>'+
      '<div class="fb" id="wfb'+wi+'">'+(s.fb||'')+'</div>'+
    '</div>';
  });
  if(shown===0) html+='<div class="card locked">틀린 문장이 없습니다.</div>';
  const solved=wrState[P].filter(s=>s.solved).length;
  html+='<div class="progress">통과 '+solved+' / '+p.write.length+'</div>';
  html+='<div class="bar">'+
    '<button class="btn ghost sm" onclick="checkAll()">전체 채점</button>'+
    '<button class="btn ghost sm" onclick="toggleRetry()">'+(retryOnly?'전체 보기':'틀린 것만 다시')+'</button>'+
    (solved===p.write.length
      ? (P<PARAS.length-1 ? '<button class="btn sm" onclick="nextPara()">다음 문단으로 →</button>'
                          : '<button class="btn sm" onclick="finish()">전체 마무리</button>')
      : '')+
  '</div>';
  return html;
}
function _wrEn(pi,wi){ return PARAS[pi].write[wi].en; }
function syncVals(){
  PARAS[P].write.forEach((w,wi)=>{ const el=document.getElementById('wi'+wi); if(el) wrState[P][wi].val=el.value; });
}
function showHint(wi){ syncVals(); wrState[P][wi].hint=true; render(); }
function gradeOne(wi){
  const w=PARAS[P].write[wi], s=wrState[P][wi];
  const user=tokens(s.val), ans=tokens(w.en);
  if(!user.length){ s.fb='<div class="msg no">아직 안 썼어요</div>'; return; }
  if(user.length===ans.length && user.every((t,i)=>t===ans[i])){
    s.solved=true; s.fb='<div class="msg ok">'+(s.tried?'다시 써서 통과':'정답')+'</div><div class="ansline">'+esc(w.en)+'</div>';
    return;
  }
  s.tried=true;
  let marks='', len=Math.max(user.length,ans.length);
  for(let i=0;i<len;i++){
    if(i<user.length && user[i]===ans[i]) marks+='<span class="tk g">'+esc(user[i])+'</span>';
    else if(i<user.length) marks+='<span class="tk b">'+esc(user[i])+'</span>';
    else marks+='<span class="tk m">___</span>';
  }
  s.fb='<div class="msg no">아직 아니에요</div><div>'+marks+'</div>'+
    '<div class="ansline">'+esc(w.en)+'</div>'+
    '<div style="font-size:.86rem;color:var(--sub);margin-top:6px">정답을 보고 그대로 다시 쳐서 통과시키세요.</div>';
}
function checkWrite(wi){ syncVals(); gradeOne(wi); render(); }
function checkAll(){
  syncVals();
  PARAS[P].write.forEach((w,wi)=>{ if(!wrState[P][wi].solved) gradeOne(wi); });
  render(); goTop();
}
function toggleRetry(){ retryOnly=!retryOnly; render(); goTop(); }
function nextPara(){
  unlock(2);
  pageTurn();
  P++; step=0; retryOnly=false; render(); goTop();
}
function finish(){
  unlock(2); pageTurn();
