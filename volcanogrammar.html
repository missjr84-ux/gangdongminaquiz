<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lesson 7 Watch Out — 문법</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;600;700&family=Lora:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--p:#5b4fa8;--pd:#3b2f8a;--pl:#ece9f8;--bg:#f5f4fa;--ink:#24213a;--mut:#6b6788;--ok:#1f8a5b;--okl:#e3f5ec;--no:#c4423a;--nol:#fbe9e7;--ye:#fff6d6;--line:#dcd8ee}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Noto Sans KR',system-ui,sans-serif;font-size:17px;line-height:1.7}
button{font-family:inherit;font-size:inherit;color:inherit;cursor:pointer}
.top{max-width:740px;margin:0 auto;padding:22px 16px 10px}
.brand{font-size:13px;color:var(--p);font-weight:700;letter-spacing:.02em}
.top h1{font-size:23px;margin:4px 0 2px;color:var(--pd);line-height:1.35}
.sub{font-size:14px;color:var(--mut)}
.hint{margin-top:8px;font-size:13px;color:var(--mut);background:#fff;border:1px dashed var(--line);border-radius:10px;padding:6px 10px}
.tabs{position:sticky;top:0;z-index:20;background:rgba(245,244,250,.96);backdrop-filter:blur(6px);border-bottom:1px solid var(--line);display:flex;gap:6px;overflow-x:auto;padding:8px 12px;-webkit-overflow-scrolling:touch}
.tab{flex:0 0 auto;border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:8px 14px;font-size:15px;font-weight:600;color:var(--mut)}
.tab.on{background:var(--p);border-color:var(--p);color:#fff}
.tab:first-child{margin-left:auto}.tab:last-child{margin-right:auto}
.wrap{max-width:740px;margin:0 auto;padding:12px 16px 80px}
.intro{background:#fff;border-left:4px solid var(--p);border-radius:10px;padding:12px 14px;margin:6px 0 14px;font-size:15.5px}
.bh{font-size:19px;color:var(--pd);margin:26px 0 10px;padding-bottom:6px;border-bottom:2px solid var(--pl)}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px;margin:12px 0}
.ct{margin:0 0 8px;font-size:17px;color:var(--pd)}
.note{font-size:14.5px;background:var(--pl);border-radius:10px;padding:8px 12px;margin:6px 0 10px}
.row{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 10px}
.btn{border:none;background:var(--p);color:#fff;border-radius:10px;padding:10px 16px;font-weight:600;min-height:44px}
.btn.ghost{background:#fff;color:var(--p);border:1.5px solid var(--p)}
.btn.sm{padding:6px 12px;font-size:14.5px;min-height:38px}
.mini{border:1px solid var(--line);background:#fff;border-radius:8px;padding:0 6px;font-size:13px;line-height:24px;vertical-align:middle}
.mini.playing,.sw.playing,.wen.playing{background:var(--ye)}
.sw{border:none;background:var(--pl);color:var(--pd);border-radius:6px;padding:0 6px;font-weight:600;font-size:inherit}
.sw::after{content:' 🔊';font-size:.75em}
.ref{border:1px solid var(--p);background:#fff;color:var(--p);border-radius:6px;padding:0 6px;font-size:.9em;font-weight:700}
.ref.on{background:var(--p);color:#fff}
.refbox{display:block;margin:6px 0;padding:8px 10px;background:#faf9ff;border:1px dashed var(--p);border-radius:8px;font-family:Lora,Georgia,serif;font-size:16px}
.rich p{margin:6px 0}
.anal{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px;margin:12px 0}
.anal h4{margin:14px 0 6px;color:var(--pd);font-size:16px}
.anal h4:first-child{margin-top:0}
.tw{overflow-x:auto}
table.t{border-collapse:collapse;width:100%;font-size:15px;margin:8px 0}
table.t th,table.t td{border:1px solid var(--line);padding:7px 8px;vertical-align:top;text-align:left}
table.t th{background:var(--pl);color:var(--pd);font-weight:700}
.tip{background:var(--ye);border-radius:10px;padding:8px 12px;margin:8px 0;font-size:15px}
.warnbox{background:var(--nol);border-radius:10px;padding:8px 12px;margin:8px 0;font-size:15px}
.en{font-family:Lora,Georgia,serif}
.rp{padding:8px 0;border-bottom:1px dashed var(--line)}
.rp:last-child{border-bottom:none}
.gl{display:inline-block;font-size:12.5px;background:var(--pl);color:var(--pd);border-radius:6px;padding:0 6px;margin:2px 4px 0 0}
/* 단어 */
.wl.hideko .wko{color:transparent;background:#eeecf6;border-radius:6px;min-width:90px;display:inline-block}
.wl.hideko .wko.peek{color:inherit;background:var(--ye)}
.wi{padding:10px 0;border-bottom:1px dashed var(--line)}
.wtop{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.no{color:var(--mut);font-size:13px;min-width:20px}
.wen{border:none;background:none;font-family:Lora,Georgia,serif;font-size:19px;font-weight:700;color:var(--pd);padding:0}
.wen i{font-style:normal;font-size:14px}
.pos{font-size:12.5px;background:var(--pl);color:var(--pd);border-radius:6px;padding:0 6px}
.wko{font-size:16px}
.wex{margin:4px 0 0 28px;font-size:15.5px}
.exen{font-family:Lora,Georgia,serif;cursor:pointer;margin-left:6px}
.exko{display:none;color:var(--mut);font-size:14.5px}
.exko.show{display:block}
/* 토글 */
.fl{border-bottom:1px dashed var(--line);padding:8px 0}
.flen{display:flex;align-items:center;gap:8px;font-family:Lora,Georgia,serif;font-size:17px}
.flen span{flex:1}
.tg{border:1.5px solid var(--p);color:var(--p);background:#fff;border-radius:8px;padding:2px 10px;font-size:14px;white-space:nowrap;font-family:'Noto Sans KR',sans-serif}
.flko{display:none;margin:4px 0 0 34px;font-size:15.5px}
.fl.open .flko{display:block}
.fltip{font-size:14px;color:var(--p);margin-top:2px}
/* 대화 */
.dl{display:flex;gap:10px;padding:8px 0;border-bottom:1px dashed var(--line)}
.dl.now{background:var(--ye)}
.spk{flex:0 0 auto;min-width:34px;font-weight:700;color:var(--p);font-size:15px}
.dtx{flex:1}
.den{font-family:Lora,Georgia,serif;font-size:17px;cursor:pointer}
.dko{display:none;color:var(--mut);font-size:15px}
.dl.open .dko{display:block}
/* 채우기 */
.tp{padding:10px 0;border-bottom:1px dashed var(--line)}
.tps{font-family:Lora,Georgia,serif;font-size:18px;line-height:2.1}
.blank{border:2px dashed var(--line);background:#fff;border-radius:8px;padding:0 10px;color:var(--mut);font-size:15px;font-family:'Noto Sans KR',sans-serif}
.blank.next{border-color:var(--p);color:var(--p);background:var(--pl)}
.blank.fill{border:2px solid var(--ok);background:var(--okl);color:var(--ok);font-weight:700;font-family:Lora,Georgia,serif;font-size:18px}
.blank.shake{animation:sh .35s}
@keyframes sh{0%,100%{transform:translateX(0)}30%{transform:translateX(-5px)}70%{transform:translateX(5px)}}
.tpko{font-size:15px;color:var(--mut)}
.tptip{display:none;font-size:14.5px;color:var(--p)}
.tp.done .tptip{display:block}
/* 문제 */
.psg{position:sticky;top:58px;z-index:5;max-height:42vh;overflow-y:auto;background:#fdfcff;border:1.5px solid var(--p);border-radius:12px;padding:10px 12px;margin:6px 0 12px;font-family:Lora,Georgia,serif;font-size:16px;line-height:1.75;box-shadow:0 4px 12px rgba(59,47,138,.08)}
.psg b,.psg u{font-family:inherit}
.q{border-top:1px solid var(--line);padding:14px 0 10px}
.q:first-of-type{border-top:none}
.q.ok .qno{background:var(--ok)}
.q.no .qno{background:var(--no)}
.qq{font-size:16.5px;margin-bottom:8px}
.qno{display:inline-block;min-width:26px;height:26px;line-height:26px;text-align:center;border-radius:13px;background:var(--p);color:#fff;font-size:13.5px;font-weight:700;margin-right:6px}
.qtag{display:inline-block;font-size:12px;background:var(--no);color:#fff;border-radius:6px;padding:0 6px;margin-right:6px;vertical-align:middle}
.ctx{background:#faf9ff;border:1px solid var(--line);border-radius:10px;padding:8px 12px;margin-bottom:8px;font-family:Lora,Georgia,serif;font-size:16px}
.opts{display:flex;flex-direction:column;gap:6px}
.opts.inline{flex-direction:row;flex-wrap:wrap}
.opt{text-align:left;border:1.5px solid var(--line);background:#fff;border-radius:10px;padding:9px 12px;font-size:16px;min-height:44px}
.opts.inline .opt{font-family:Lora,Georgia,serif;font-weight:600;min-width:120px;text-align:center}
.opt .mk{color:var(--p);margin-right:6px;font-weight:700}
.opt.pick{border-color:var(--p);background:var(--pl)}
.opt.right{border-color:var(--ok);background:var(--okl)}
.multi{font-size:13.5px;color:var(--no);margin-bottom:4px}
.inw{display:flex;align-items:center;gap:6px;margin:4px 0}
.inl{font-size:14px;color:var(--mut);white-space:nowrap}
.inp{flex:1;width:100%;border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;font-size:17px;font-family:Lora,Georgia,serif;background:#fff}
.inp:focus{outline:none;border-color:var(--p)}
.inp.good{border-color:var(--ok);background:var(--okl)}
.inp.bad{border-color:var(--no);background:var(--nol)}
.ta{resize:vertical;min-height:60px}
.rwh{font-size:14px;color:var(--mut);margin-bottom:4px}
.diff{font-family:Lora,Georgia,serif;font-size:16px;margin-top:4px}
.dg{color:var(--ok)}.db{color:var(--no);text-decoration:underline}
.ordp{font-size:15.5px;margin-bottom:6px}
.oslot{min-height:52px;border:2px dashed var(--p);border-radius:10px;padding:6px;display:flex;flex-wrap:wrap;gap:6px;align-items:center;background:#fdfcff}
.oh{font-size:13.5px;color:var(--mut)}
.opool{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{border:1.5px solid var(--line);background:#fff;border-radius:10px;padding:8px 12px;font-family:Lora,Georgia,serif;font-size:16.5px;min-height:44px}
.oslot .chip{border-color:var(--p);background:var(--pl)}
.chip.cn{border-color:#d9a400;background:#fffbea}
.qbtn{display:flex;gap:8px;margin-top:10px}
.fb{display:none;margin-top:8px;border-radius:10px;padding:8px 12px;font-size:15.5px}
.fb.good,.fb.bad,.fb.warn{display:block}
.fb.good{background:var(--okl)}
.fb.bad{background:var(--nol)}
.fb.warn{background:var(--ye)}
.fb .ans{margin-top:2px}
.fb .ans b{font-family:Lora,Georgia,serif}
.fb .ex{margin-top:4px;color:#3d3a55;font-size:15px}
.alt{color:var(--mut);font-size:14px}
.qfoot{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;padding-top:12px;border-top:2px solid var(--pl)}
.score{margin-top:8px;font-size:16px;color:var(--pd)}
.pnav{display:flex;justify-content:space-between;gap:8px;margin-top:26px;flex-wrap:wrap}
details.sum{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin:12px 0}
details.sum summary{font-weight:700;color:var(--p);cursor:pointer}
@media (max-width:480px){body{font-size:16px}.top h1{font-size:20px}.wex{margin-left:0}.flko{margin-left:0}}
</style></head>

<script>
/* ===== DATA START ===== */
var CFG={"brand":"강동미나 중고등부 · 중3 Lesson 7 (천재 이재영)","title":"Lesson 7 Watch Out — 문법","sub":"분사구문 (만들기 · 뜻 · 부정 · 과거분사 · having p.p.) · 조동사가 포함된 수동태","sents":[],"tabs":[{"name":"① 분사구문 만들기","intro":"<b>부사절을 짧게 줄인 것이 분사구문!</b> 3단계 순서대로 바꾸는 연습을 해요. 예문 빈칸은 ▢1 → ▢2 순서로 눌러 채워요.","blocks":[{"k":"html","html":"<div class=\"anal\"><h4>📌 공식: 접속사 + 주어 + 동사 ~, 주절 → 동사-ing ~, 주절</h4><ol><li><b>접속사 지우기</b> — <s>While</s> farmers were working on a cornfield, farmers found something surprising.</li><li><b>주어 확인하고 지우기</b> — 부사절 주어 = 주절 주어(farmers)면 지워요. <b>다르면 남겨요!</b></li><li><b>동사를 -ing로</b> — were working → <b>Working</b> on a cornfield, farmers found something surprising.</li></ol><div class=\"tip\">기본 점검: ① 시제가 같으면 동사원형 + -ing (was → Being, have → Having) ② 주절은 <b>그대로</b> 둬요 ③ 콤마(,)로 주절과 나눠요.</div></div>"},{"k":"tap","title":"순서대로 채우기 — 본문 · 교과서 문장","note":"다 채우면 아래에 원래 문장이 나와요.","rows":[{"s":"{Working} on a cornfield one day in 1943, farmers in Mexico found something surprising.","ko":"1943년 어느 날 옥수수밭에서 일하다가, 멕시코 농부들은 놀라운 것을 발견했다.","tip":"= While they were working on a cornfield ~ (때)"},{"s":"{Being} very powerful and dangerous, volcanoes do harm to people.","ko":"매우 강력하고 위험하기 때문에, 화산은 사람들에게 해를 끼친다.","tip":"= Because volcanoes are very powerful and dangerous ~ (이유)"},{"s":"{Looking} for fantastic scenery, millions of tourists visit Mt. Halla.","ko":"환상적인 경치를 찾아서, 수백만 명의 관광객이 한라산을 방문한다.","tip":"= Because they are looking for fantastic scenery ~ (이유)"},{"s":"I study math, {listening} to music.","ko":"나는 음악을 들으면서 수학을 공부한다.","tip":"= while I listen to music (동시 동작)"},{"s":"{Finishing} my dinner, I watched the news about the typhoon.","ko":"저녁을 다 먹은 후에 나는 태풍 뉴스를 보았다.","tip":"= After I finished my dinner ~ (때)"}]},{"k":"qset","title":"바꿔 쓰기 연습","qs":[{"t":"in","q":"While she was hiking up Mt. Halla, she saw a deer.<br>→ ______ ______ Mt. Halla, she saw a deer.","a":"Hiking up"},{"t":"in","q":"Because I had a map, I could find the cave easily.<br>→ ______ a map, I could find the cave easily.","a":"Having"},{"t":"in","q":"When the farmers saw the smoke, they ran away.<br>→ ______ the smoke, the farmers ran away.","a":"Seeing"},{"t":"in","q":"As he was hungry, he ate two sandwiches.<br>→ ______ hungry, he ate two sandwiches.","a":"Being"},{"t":"rw","q":"분사구문으로 바꿔 쓰기: Because it was very windy, we stayed inside.","a":"It being very windy, we stayed inside.","e":"주어(it)가 주절의 주어(we)와 달라서 남겨요!"},{"t":"rw","q":"분사구문으로 바꿔 쓰기: While I lay in my tent, I heard the rain.","a":"Lying in my tent, I heard the rain.","e":"lie(눕다) - lay - lain / -ing형은 lying"},{"t":"rw","q":"분사구문으로 바꿔 쓰기: If you take this road, you will get to the beach.","a":"Taking this road, you will get to the beach."},{"t":"rw","q":"분사구문으로 바꿔 쓰기: Because she studied hard, she passed the science test.","a":"Studying hard, she passed the science test."},{"t":"mc","q":"Because the scientists worked hard, they found the underwater volcano.<br>= ______, the scientists found the underwater volcano.","o":["Worked hard","Working hard","They working hard","Being worked hard","Because worked hard"],"a":1,"e":"주어가 같으니 they 지우기 / 과학자들이 일하는 쪽 → -ing"},{"t":"ord","q":"우리말에 맞게 배열: 그녀는 노래를 부르면서 설거지를 했다.","c":["She washed the dishes,","singing","a song."],"x":["sang"],"e":"동시 동작 → 콤마 뒤 -ing"}]}]},{"name":"② 분사구문의 뜻","intro":"<b>분사구문은 접속사가 없어서 뜻을 문맥으로 찾아야 해요!</b> 앞뒤 내용이 어떤 관계인지 보고 접속사를 골라요.","blocks":[{"k":"html","html":"<div class=\"anal\"><div class=\"tw\"><table class=\"t\">\n<tr><th>뜻</th><th>숨은 접속사</th><th>예문</th></tr>\n<tr><td><b>때</b> ~할 때, ~하는 동안, ~한 후에</td><td>when · while · after · as</td><td><b>Working</b> on a cornfield, farmers found something surprising.</td></tr>\n<tr><td><b>이유</b> ~해서, ~ 때문에</td><td>because · as · since</td><td><b>Being</b> very powerful and dangerous, volcanoes do harm to people.</td></tr>\n<tr><td><b>동시 동작</b> ~하면서</td><td>while · as</td><td>I study math, <b>listening</b> to music.</td></tr>\n<tr><td><b>연속 동작 · 결과</b> 그리고 ~하다</td><td>and</td><td>A volcanic eruption shoots ash into the air, <b>preventing</b> the sunlight from reaching Earth.</td></tr>\n<tr><td><b>조건</b> ~하면</td><td>if</td><td><b>Following</b> this map, you will find the cave.</td></tr>\n<tr><td><b>양보</b> ~이지만</td><td>although · though</td><td><b>Living</b> next to the volcano, they have never seen it erupt.</td></tr>\n</table></div>\n<div class=\"tip\">판별 순서: ① 앞뒤가 <b>반대</b>(~지만)인가? → 양보 ② 뒤가 <b>미래·명령</b>이고 \"~하면\" 말이 되나? → 조건 ③ 뒤가 <b>결과</b>인가? → 이유 ④ 같은 시간에 하나? → 동시 동작 / 시간 순서인가? → 때<br>뜻을 분명하게 하려고 접속사를 남기기도 해요: <b>When hearing</b> the warning, people left the area.</div></div>"},{"k":"qset","title":"숨은 접속사 고르기","qs":[{"t":"mc","inline":1,"q":"<u>Working on a cornfield</u>, farmers in Mexico found something surprising. → ______ they were working","o":["While","If"],"a":0,"e":"본문 15번"},{"t":"mc","inline":1,"q":"<u>Being very powerful and dangerous</u>, volcanoes do harm to people. → ______ volcanoes are","o":["Although","Because"],"a":1,"e":"본문 23번"},{"t":"mc","inline":1,"q":"<u>Following this map</u>, you will find the cave. → ______ you follow","o":["If","Though"],"a":0},{"t":"mc","inline":1,"q":"<u>Being only twelve</u>, she speaks three languages. → ______ she is only twelve","o":["Because","Though"],"a":1,"e":"열두 살밖에 안 됐다 ↔ 3개 국어 (반대)"},{"t":"mc","inline":1,"q":"<u>Not knowing the way</u>, we asked a police officer. → ______ we didn't know","o":["Because","Although"],"a":0},{"t":"mc","inline":1,"q":"<u>Living near the volcano</u>, they are not afraid of it. → ______ they live","o":["Because","Although"],"a":1,"e":"화산 가까이 사는데도 무서워하지 않음 (반대)"},{"t":"mc","inline":1,"q":"<u>Leaving now</u>, you will catch the last bus. → ______ you leave","o":["If","Although"],"a":0},{"t":"mc","inline":1,"q":"The guide smiled at us, <u>waving her hand</u>. → ______ she waved","o":["while","although"],"a":0,"e":"동시 동작"},{"t":"mc","q":"밑줄 친 분사구문의 생략된 접속사가 나머지와 <b>다른</b> 것은?","o":["<u>Feeling cold</u>, I closed the window.","<u>Having no umbrella</u>, I got wet.","<u>Not knowing the answer</u>, he kept quiet.","<u>Pressing this button</u>, you can call for help.","<u>Being sick</u>, she stayed in bed."],"a":3,"e":"④ 조건(If), 나머지는 이유(Because)"},{"t":"mc","q":"밑줄 친 분사구문의 생략된 접속사가 나머지와 <b>다른</b> 것은?","o":["<u>Singing a song</u>, she cleaned her room.","<u>Holding an umbrella</u>, he walked to school.","The children ran to the beach, <u>laughing loudly</u>.","<u>Waving her hand</u>, she got on the train.","<u>Feeling very tired</u>, I didn't stop working."],"a":4,"e":"⑤ 양보(Although), 나머지는 동시 동작(while/as)"},{"t":"mc","q":"밑줄 친 부분과 바꿔 쓸 수 있는 것은?<br><u>Living next to the volcano</u>, they have never seen it erupt.","o":["If they live","After they lived","Unless they live","When they lived","Though they live"],"a":4,"e":"옆에 사는데도 분출을 본 적이 없다 (반대)"},{"t":"mc","q":"빈칸에 들어갈 말로 알맞은 것을 <b>모두</b> 고르세요.<br>______, you can see the whole island.","o":["Climbing the mountain","If you climb the mountain","Being climbed the mountain","Unless climbing the mountain","As having climbed the mountain"],"a":[0,1]}]}]},{"name":"③ 주의할 분사구문","intro":"<b>시험에 나오는 함정 4가지!</b> 부정 · Being 생략 · 시제가 앞설 때 · 주어가 다를 때. 하나씩 판별 순서대로 확인해요.","blocks":[{"k":"html","html":"<div class=\"anal\"><h4>📌 함정 1: 부정 → Not을 맨 앞에</h4><ol><li>Because I <b>don't</b> know his address, I can't send the card.</li><li>→ <b>Not knowing</b> his address, I can't send the card.</li></ol><div class=\"tip\">Knowing not ✗ / Don't knowing ✗ / Not knowing ⭕ — not(never)은 분사 <b>바로 앞</b>!</div></div>"},{"k":"html","html":"<div class=\"anal\"><h4>📌 함정 2: Being은 생략할 수 있어요 → 과거분사·형용사로 시작</h4><ol><li>As he <b>was tired</b>, he went home early. → <b>(Being)</b> Tired, he went home early.</li><li>Because the guidebook <b>is written</b> in simple English, it is easy to read. → <b>(Being) Written</b> in simple English, the guidebook is easy to read.</li><li>When Jejudo <b>is seen</b> from the sky, it looks like a big leaf. → <b>Seen</b> from the sky, Jejudo looks like a big leaf.</li></ol><div class=\"tip\">판별: 주절의 주어가 <b>하는 쪽</b>이면 -ing / <b>당하는 쪽</b>이면 p.p.<br>안내서는 쓰는 게 아니라 <b>쓰여지는</b> 쪽 → Written ⭕ / Writing ✗</div></div>"},{"k":"html","html":"<div class=\"anal\"><h4>📌 함정 3: 부사절이 주절보다 앞선 일 → Having + p.p.</h4><ol><li>Because I <b>have visited</b> the island before, I know the way.</li><li>→ <b>Having visited</b> the island before, I know the way.</li><li>Because I <b>lost</b> my ticket, I can't get on the train. (과거 → 현재) → <b>Having lost</b> my ticket, ~</li></ol><div class=\"tip\">시제가 같으면 동사-ing / 부사절이 더 앞선 시제면 Having p.p.</div></div>"},{"k":"html","html":"<div class=\"anal\"><h4>📌 함정 4: 두 주어가 다르면 부사절의 주어를 남겨요</h4><ol><li>If the weather <b>is</b> fine, <b>we</b> will climb Mt. Halla. → <b>The weather being</b> fine, we will climb Mt. Halla.</li><li>Because <b>it</b> was so windy, <b>the flight</b> was canceled. → <b>It being</b> so windy, the flight was canceled.</li><li>Because <b>my bag</b> was lost, <b>I</b> had to buy new clothes. → <b>My bag (being) lost</b>, I had to buy new clothes.</li></ol><div class=\"tip\">함정: 주어를 지우면 뜻이 바뀌어요 — <s>Being rainy, we stayed home</s> (우리가 비가 오는 것?) → <b>It being rainy</b>, we stayed home.</div></div>"},{"k":"qset","title":"함정 판별 — 고르기","qs":[{"t":"mc","inline":1,"q":"______ the way, we got lost in the forest.","o":["Not knowing","Knowing not"],"a":0},{"t":"mc","inline":1,"q":"______ in simple English, the guidebook is easy to read.","o":["Writing","Written"],"a":1,"e":"안내서는 쓰여진 쪽"},{"t":"mc","inline":1,"q":"______ from the top of Mt. Halla, Jejudo looks beautiful.","o":["Seeing","Seen"],"a":1,"e":"제주도는 보여지는 쪽"},{"t":"mc","inline":1,"q":"______ the movie before, I know how it ends.","o":["Watching","Having watched"],"a":1,"e":"본 것이 먼저"},{"t":"mc","inline":1,"q":"______ by the strong wind, the old tree fell down.","o":["Hitting","Hit"],"a":1,"e":"나무는 바람에 맞은 쪽 (hit - hit - hit)"},{"t":"mc","inline":1,"q":"______ badly, the bike can't be used.","o":["Damaging","Damaged"],"a":1,"e":"자전거는 망가진 쪽"},{"t":"mc","inline":1,"q":"______ snowy, we couldn't go hiking.","o":["Being","It being"],"a":1,"e":"주어가 다르니 It을 남겨요"},{"t":"mc","inline":1,"q":"______ tired, she didn't stop running.","o":["Though","Because"],"a":0,"e":"피곤했는데도 계속 → 양보"},{"t":"mc","inline":1,"q":"______ hungry, I skipped dinner.","o":["Feeling not","Not feeling"],"a":1},{"t":"mc","inline":1,"q":"______ in a small town, he knew everyone.","o":["Lived","Living"],"a":1,"e":"그는 사는 쪽 → Living"},{"t":"mc","inline":1,"q":"______ as the Ring of Fire, the area has many volcanoes.","o":["Knowing","Known"],"a":1,"e":"그 지역은 알려진 쪽"},{"t":"mc","inline":1,"q":"______ by the typhoon, the house needs to be repaired.","o":["Destroying","Destroyed"],"a":1,"e":"집은 파괴된 쪽"}]},{"k":"qset","title":"함정 판별 — 바꿔 쓰기","qs":[{"t":"in","q":"Since she was surprised at the news, she shouted. → ______ at the news, she shouted. (1단어)","a":"Surprised|Being surprised"},{"t":"in","q":"Because the road was blocked, we took the subway. → The road ______, we took the subway.","a":"blocked|being blocked"},{"t":"in","q":"As I don't like spicy food, I didn't eat the soup. → ______ ______ spicy food, I didn't eat the soup.","a":"Not liking"},{"t":"in","q":"He didn't wear a helmet, so he got hurt. → ______ ______ a helmet, he got hurt.","a":"Not wearing"},{"t":"rw","q":"분사구문으로 바꿔 쓰기: Because I didn't check the weather report, I didn't bring an umbrella.","a":"Not checking the weather report, I didn't bring an umbrella.|Not having checked the weather report, I didn't bring an umbrella."},{"t":"rw","q":"분사구문으로 바꿔 쓰기: If the weather is fine, the festival will be held outside.","a":"The weather being fine, the festival will be held outside."},{"t":"mc","q":"어법상 <b>틀린</b> 문장은?","o":["Shocked by the news, I couldn't say anything.","The bus came down the road, making a loud noise.","Being writing in Spanish, the letter needs to be translated.","Not having a map, they asked for directions.","Having read the book twice, I know the story well."],"a":2,"e":"편지는 쓰여진 쪽 → Written in Spanish"},{"t":"mc","q":"괄호 안의 동사를 알맞게 바꾼 것끼리 짝지은 것은?<br>ⓐ (lose) my key, I can't open the door now.<br>ⓑ (make) in Korea, the phone is popular.<br>ⓒ (eat) all the cookies, I had nothing for dessert.","o":["Losing - Making - Eating","Losing - Made - Eaten","Being lost - Making - Eating","Having lost - Made - Having eaten","Having lost - Making - Eaten"],"a":3,"e":"ⓐ 먼저 일어난 일 ⓑ 수동 ⓒ 먼저 일어난 일(능동)"}]}]},{"name":"④ -ing 구별","intro":"<b>-ing라고 다 분사구문이 아니에요!</b> 문장에서 <b>무슨 자리</b>에 있는지부터 봐요.","blocks":[{"k":"html","html":"<div class=\"anal\"><div class=\"tw\"><table class=\"t\">\n<tr><th>종류</th><th>알아보는 법</th><th>예문</th></tr>\n<tr><td><b>분사구문</b></td><td>콤마로 나뉘고, 뒤(앞)에 <b>주어 + 동사</b>가 따로 있음</td><td><b>Climbing</b> the mountain, we saw a rainbow.</td></tr>\n<tr><td><b>동명사</b> (~하는 것)</td><td>주어 · 목적어 · 보어 · 전치사 뒤 <b>명사 자리</b></td><td><b>Climbing</b> mountains is my hobby. / He enjoys <b>climbing</b> mountains.</td></tr>\n<tr><td><b>진행형</b></td><td><b>be동사 + -ing</b></td><td>The boy <b>is walking</b> down the street.</td></tr>\n<tr><td><b>명사 수식</b> (~하는)</td><td>명사 <b>바로 뒤(앞)</b>에서 꾸밈</td><td>The boy <b>playing</b> soccer over there is my brother.</td></tr>\n</table></div>\n<div class=\"tip\">시험 포인트: \"The boy <b>playing</b> soccer over there is my brother.\" — 콤마가 없고 the boy를 꾸며요. 분사구문 ✗</div></div>"},{"k":"qset","title":"쓰임 구별","qs":[{"t":"mc","q":"〈보기〉의 밑줄 친 Climbing과 쓰임이 <b>다른</b> 것은?<br>〈보기〉 <u>Climbing</u> mountains is my favorite hobby.","o":["He enjoys <u>climbing</u> mountains.","I think <u>climbing</u> Mt. Halla is fun.","<u>Climbing</u> the mountain, we saw a rainbow.","They started <u>climbing</u> at 6 a.m.","She is good at <u>climbing</u> trees."],"a":2,"e":"③ 분사구문, 나머지는 동명사"},{"t":"mc","q":"밑줄 친 부분의 쓰임이 나머지와 <b>다른</b> 것은?","o":["She walked home, <u>singing</u> a song.","The boy <u>playing</u> soccer over there is my brother.","<u>Opening</u> the door, he said hello.","There <u>being</u> no bus, we walked home.","Dad <u>cooking</u> dinner, Mom set the table."],"a":1,"e":"② 명사를 꾸미는 분사, 나머지는 분사구문"},{"t":"mc","q":"상황: 소녀가 음악을 들으면서 공부하고 있다. 바르게 묘사한 것을 <b>모두</b> 고르세요.","o":["After listening to music, she studied.","The girl is studying, listening to music.","Not listening to music, the girl is studying.","As the girl is listening to music, she is studying.","When the girl studies, she doesn't listen to music."],"a":[1,3]},{"t":"mc","inline":1,"q":"My sister is doing her homework, ______ to music.","o":["listening","listens"],"a":0,"e":"두 문장 → 분사구문"},{"t":"rw","q":"두 문장을 분사구문으로 한 문장 쓰기 (분사구문으로 시작): My dad is washing the car. He is singing a song.","a":"Singing a song, my dad is washing the car."},{"t":"mc","inline":1,"q":"<u>Preventing</u> fires is very important. → 쓰임은?","o":["동명사","분사구문"],"a":0,"e":"주어 자리"},{"t":"mc","inline":1,"q":"A volcanic eruption shoots ash into the air, <u>preventing</u> some of the sunlight from reaching Earth. → 쓰임은?","o":["동명사","분사구문"],"a":1}]}]},{"name":"⑤ 조동사 + 수동태","intro":"<b>조동사 + be + p.p.</b> — 조동사 뒤는 <b>무조건 be</b>! 순서대로 바꾸는 연습을 해요.","blocks":[{"k":"html","html":"<div class=\"anal\"><h4>📌 공식: 조동사 + 동사원형 → 조동사 + be + p.p.</h4><ol><li><b>목적어를 주어로</b> — Anybody can see <b>the volcano</b> from here. → <b>The volcano</b> ~</li><li><b>조동사 그대로 + be</b> — can → <b>can be</b> (is ✗, are ✗, been ✗)</li><li><b>동사를 p.p.로</b> — see → <b>seen</b> → The volcano can be seen (by anybody) from here.</li><li><b>by + 목적격</b> — 행위자가 일반인(people, anybody, they)이면 생략해요.</li></ol><div class=\"tip\">부정: 조동사 + <b>not</b> + be + p.p. (cannot be fixed / should not be thrown / will not be finished)<br>의문: <b>조동사</b> + 주어 + be + p.p. ~? (Will the road be closed ~? / Can the tickets be bought ~?)</div></div>"},{"k":"tap","title":"순서대로 채우기 — 본문 문장","rows":[{"s":"Therefore, they {should} {be} {studied} and understood.","ko":"그러므로 화산은 연구되고 이해되어야 한다.","tip":"be 하나에 studied와 understood 둘이 걸려요"},{"s":"You may think volcanoes {can} {be} {found} only on Earth.","ko":"여러분은 화산이 지구에서만 발견될 수 있다고 생각할지도 모른다."},{"s":"Crops {may} {be} {destroyed}, and air traffic can be threatened.","ko":"농작물이 파괴될 수도 있고, 항공 교통이 위협받을 수도 있다."},{"s":"Volcanoes {can} {be} {used} to produce electricity, too.","ko":"화산은 전기를 만드는 데에도 이용될 수 있다."},{"s":"They are hopeful that more ways {will} {be} {found} soon.","ko":"그들은 더 많은 방법이 곧 발견되기를 바란다."},{"s":"The energy inside the earth {can} {be} {felt} in different ways.","ko":"지구 내부의 에너지는 다양한 방식으로 느껴질 수 있다.","tip":"Wrap Up 지문 · feel - felt - felt"},{"s":"The party {will} {be} {held} at 7 p.m.","ko":"파티는 오후 7시에 열릴 것이다.","tip":"hold - held - held"}]},{"k":"qset","title":"바꿔 쓰기 연습","qs":[{"t":"in","q":"We can see many stars from this hill.<br>→ Many stars ______ ______ ______ from this hill.","a":"can be seen"},{"t":"in","q":"People should not throw trash on the beach.<br>→ Trash ______ ______ ______ ______ on the beach.","a":"should not be thrown|shouldn't be thrown"},{"t":"in","q":"Scientists will study the new volcano.<br>→ The new volcano ______ ______ ______ by scientists.","a":"will be studied"},{"t":"in","q":"Visitors have to follow the safety rules.<br>→ The safety rules ______ ______ ______ ______.","a":"have to be followed"},{"t":"in","q":"Can they fix the elevator today?<br>→ ______ the elevator ______ ______ by them today?","a":["Can","be fixed"],"e":""},{"t":"in","q":"The city will issue a warning soon.<br>→ A warning ______ ______ ______ by the city soon.","a":"will be issued"},{"t":"mc","q":"They will build a new bridge next year.<br>= A new bridge ______ next year.","o":["be built","will built","will builded","will be build","will be built"],"a":4,"e":"build - built - built"},{"t":"mc","q":"Residents must follow the rules. → 수동태로 바르게 바꾼 것은?","o":["Residents are must followed the rules.","Residents must be followed by the rules.","The rules must be followed by residents.","The rules are must followed by residents.","The rules must been followed by residents."],"a":2},{"t":"mc","q":"Will the city close the road? → 수동태로 바르게 바꾼 것은?","o":["Will be closed the road by the city?","Is will the road closed by
