let synQ={}, bIdx=0, bBuilt=[], bChecked=S.map(function(){return false;}), bCorrect=S.map(function(){return null;}), bReveal=S.map(function(){return false;});
var SS=('speechSynthesis' in window)?window.speechSynthesis:null;
var ttsReady=false, ttsVoices=[];
function loadVoices(){if(!SS)return;ttsVoices=SS.getVoices()||[];}
if(SS){loadVoices();SS.onvoiceschanged=loadVoices;}
function unlockTTS(){
  if(!SS||ttsReady)return;
  try{var u=new SpeechSynthesisUtterance(' ');u.volume=0;SS.speak(u);SS.cancel();}catch(e){}
  loadVoices();ttsReady=true;
  var h=document.getElementById('sndHint');if(h)h.style.display='none';
}
document.addEventListener('touchstart',unlockTTS,{once:true,passive:true});
document.addEventListener('mousedown',unlockTTS,{once:true});
document.addEventListener('click',unlockTTS,{once:true});
function pickVoice(){
  if(!ttsVoices.length)loadVoices();
  return ttsVoices.filter(function(x){return x.lang==='en-US';})[0]
    ||ttsVoices.filter(function(x){return x.lang&&x.lang.toLowerCase().indexOf('en')===0;})[0]||ttsVoices[0]||null;}
function speak(t,btn){
  if(!SS){alert('Chrome으로 열어 주세요.');return;}
  unlockTTS();
  var msg=String(t==null?'':t).replace(/[\/~_]/g,' ').replace(/\s+/g,' ').trim();
  if(!msg)return;
  SS.cancel();
  var bs=document.querySelectorAll('.speak.playing');
  for(var i=0;i<bs.length;i++)bs[i].classList.remove('playing');
  function fire(){
    var u=new SpeechSynthesisUtterance(msg);
    u.lang='en-US';u.rate=0.85;u.pitch=1;u.volume=1;
    var v=pickVoice();if(v)u.voice=v;
    if(btn){btn.classList.add('playing');u.onend=u.onerror=function(){btn.classList.remove('playing');};}
    try{SS.resume();}catch(e){}
    SS.speak(u);
  }
  if(!ttsVoices.length){loadVoices();if(!ttsVoices.length){setTimeout(fire,180);return;}}
  setTimeout(fire,0);
}
function speakAll(){
  if(!SS)return;var k=0;SS.cancel();
  function next(){if(k>=S.length)return;var u=new SpeechSynthesisUtterance(S[k++].en);u.lang='en-US';u.rate=.85;var v=pickVoice();if(v)u.voice=v;u.onend=next;SS.speak(u);}
  next();
}
function esc(t){return String(t==null?'':t).replace(/[&<>"']/g,function(m){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m];});}
function sp(t,mini){return '<button type="button" class="speak'+(mini?' mini':'')+'" data-say="'+esc(t)+'" onclick="event.stopPropagation();speak(this.getAttribute(\'data-say\'),this)">🔊</button>';}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
function norm(s){return String(s||'').toLowerCase().replace(/["""'']/g,"'").replace(/[^a-z0-9가-힣\s']/g,'').replace(/\s+/g,' ').trim();}
function words(en){return en.replace(/[""]/g,'').replace(/[?!.,:]/g,'').split(/\s+/).filter(Boolean);}
function buildOpts(correct,pool){
  var set=[correct],sh=shuffle(pool),k;
  for(k=0;k<sh.length&&set.length<4;k++){if(sh[k]!=null&&set.indexOf(sh[k])<0)set.push(sh[k]);}
  var opts=shuffle(set);return {opts:opts,ans:opts.indexOf(correct)};
}

/* ===== NAV ===== */
const STEPS=[['구문분석','①'],['한글 통독','②'],['흐름·주제','③'],['내용 OX','④'],['거꾸로영작','⑤']];
function buildSteps(){
  document.getElementById('steps').innerHTML=STEPS.map(function(s,i){
    return '<button class="step'+(i===0?' on':'')+'" id="st'+i+'" onclick="go('+i+')"><span class="sn">'+s[1]+'단계</span>'+s[0]+'</button>';}).join('');}
function go(v){view=v;if(SS)SS.cancel();
  for(var i=0;i<STEPS.length;i++)document.getElementById('st'+i).classList.toggle('on',i===v);
  if(v===4)bBuilt=[];
  render();window.scrollTo({top:0,behavior:'smooth'});}
function render(){
  document.getElementById('ctrl').innerHTML=(view===0)?'<button class="b b5" onclick="speakAll()">🔊 본문 전체 듣기</button><button class="b b2" onclick="if(SS)SS.cancel()">⏹ 정지</button>':'';
  document.getElementById('app').innerHTML=[V0,V1,V2,V3,V4][view]();
}

/* ===== ① 영어 구문분석 (대명사·수일치·시제 포함) ===== */
function V0(){
  var h='<div class="intro">💡 <b>① 영어 구문분석</b><br>문장마다 <span class="kw">구문 포인트</span> + <span style="background:#e0f2fe;color:#0369a1;font-weight:900;padding:1px 8px;border-radius:8px">대명사 지칭</span> + <span style="background:#dcfce7;color:#166534;font-weight:900;padding:1px 8px;border-radius:8px">수일치</span> + <span style="background:#fef3c7;color:#92400e;font-weight:900;padding:1px 8px;border-radius:8px">시제</span>를 짚습니다. 분석은 토글로 가렸다가 스스로 분석해 본 뒤 확인하세요.</div>';
  var lastSec='';
  S.forEach(function(s,i){
    if(s.sec!==lastSec){lastSec=s.sec;h+='<div style="font-size:15px;font-weight:900;color:#be185d;margin:20px 0 10px;padding-left:10px;border-left:4px solid #ec4899">'+esc(s.sec)+'</div>';}
    h+='<div class="qcard"><div class="qnum">문장 '+(i+1)+' / '+S.length+'</div>'+
      '<div class="qsent" style="font-style:italic">'+sp(s.en,true)+'<span>'+esc(s.en)+'</span></div>'+
      '<div class="qhint">'+esc(s.ko)+'</div>'+
      '<button class="b b1" style="margin-top:9px;padding:9px 16px;font-size:13px" onclick="var a=this.nextElementSibling;a.classList.toggle(\'show\');this.textContent=a.classList.contains(\'show\')?\'분석 닫기 ▲\':\'구문분석 보기 ▼\'">구문분석 보기 ▼</button>'+
      '<div class="ansbox">'+
        (s.syn?'<div>🔧 <b>구문</b> '+esc(s.syn)+'</div>':'')+
        (s.ref?'<div style="color:#0369a1">👉 <b>대명사</b> '+esc(s.ref)+'</div>':'')+
        (s.agr?'<div style="color:#166534">⚖️ <b>수일치</b> '+esc(s.agr)+'</div>':'')+
        (s.tns?'<div style="color:#92400e">⏰ <b>시제</b> '+esc(s.tns)+'</div>':'')+
      '</div></div>';
  });
  /* 구문 퀴즈 — 대명사/수일치/시제 골라내기 */
  if(!synQ.qs){
    synQ.qs=[
    {p:'"Surprisingly, this made traveling difficult."에서 this가 가리키는 것은?',say:'Surprisingly, this made traveling difficult.',
     opts:['탐보라 화산','흉작이 든 상황','자전거','말'],ans:1,why:'this = 앞 문장의 흉작(crops failed) 상황 전체.'},
    {p:'"they corrected it by simply painting over it."에서 it이 가리키는 것은?',say:'they corrected it by simply painting over it.',
     opts:['the mistake (실수)','the paint','the window','the bank'],ans:0,why:'페인트공들이 바로잡은 것 = the mistake.'},
    {p:'"Soon, everybody at the bank began using it."에서 it은?',say:'Soon, everybody at the bank began using it.',
     opts:["Graham's own white paint","the bank","the typewriter","the page"],ans:0,why:'은행 사람들이 쓰기 시작한 것 = Graham이 만든 흰 페인트.'},
    {p:'"Dr. Stafford-Fraser and Dr. Jardetzky ___ working at a computer lab."의 빈칸은?',say:'Dr. Stafford-Fraser and Dr. Jardetzky were working at a computer lab.',
     opts:['was','were','is','be'],ans:1,why:'주어가 A and B(복수) → were. 수일치!'},
    {p:'"However, there ___ only one coffee machine in the building."의 빈칸은?',say:'However, there was only one coffee machine in the building.',
     opts:['was','were','are','is (과거 문맥)'],ans:0,why:'there+be+단수명사(one coffee machine), 과거 문맥 → was.'},
    {p:'"In 1956, Graham ___ at a bank."(일하고 있었다) 빈칸은?',say:'In 1956, Graham was working at a bank.',
     opts:['was working','were working','is working','works'],ans:0,why:'과거진행형 + 주어 단수(Graham) → was working. 시제일치!'}
    ];
    synQ.picked=synQ.qs.map(function(){return -1;});
    synQ.done=synQ.qs.map(function(){return false;});
  }
  h+='<div class="intro" style="background:#fdf2f8;border-color:#f9a8d4">⛳ <b>구문 정밀 퀴즈</b> — 대명사 지칭 · 수일치 · 시제</div>';
  synQ.qs.forEach(function(q,i){
    h+='<div class="qcard"><div class="qnum">구문 Q'+(i+1)+'</div><div class="qsent" style="font-size:16px">'+q.p+' '+sp(q.say,true)+'</div>';
    q.opts.forEach(function(o,j){
      var cls='';
      if(synQ.done[i]){if(j===q.ans)cls=' correct';else if(j===synQ.picked[i])cls=' wrong';}
      h+='<button class="opt'+cls+'" onclick="pickSyn('+i+','+j+')"><span>'+String.fromCharCode(9312+j)+' '+esc(o)+'</span></button>';
    });
    h+='<div class="ansbox'+(synQ.done[i]?' show':'')+'">'+esc(q.why)+'</div></div>';
  });
  return h;
}
function pickSyn(i,j){if(synQ.done[i])return;synQ.picked[i]=j;synQ.done[i]=true;render();}

/* ===== ② 한글 통독 ===== */
function V1(){
  var h='<div class="intro">💡 <b>② 한글 통독</b><br>영어를 보지 않고 한글만으로 전체 이야기를 잡습니다. 영어는 ⑤ 거꾸로 영작에서 직접 만들어 봅니다.</div>';
  var lastSec='';
  S.forEach(function(s,i){
    if(s.sec!==lastSec){lastSec=s.sec;h+='<div style="font-size:15px;font-weight:900;color:#be185d;margin:20px 0 10px;padding-left:10px;border-left:4px solid #ec4899">'+esc(s.sec)+'</div><div class="qcard">';}
    h+='<div style="font-size:16px;line-height:2;padding:4px 0"><span style="display:inline-flex;width:28px;height:28px;background:#fdf2f8;color:#be185d;border-radius:50%;align-items:center;justify-content:center;font-size:12px;font-weight:900;margin-right:8px">'+(i+1)+'</span>'+esc(s.ko)+'</div>';
    var next=S[i+1];
    if(!next||next.sec!==s.sec)h+='</div>';
  });
  return h;
}

/* ===== ③ 흐름·주제 ===== */
function V2(){
  var h='<div class="intro">💡 <b>③ 흐름·개요·주제</b><br>속담 → 세 가지 발명 이야기 → 주제. 이 흐름을 기억하면 본문이 한 장의 그림이 됩니다.</div><div class="qcard">';
  FLOW.forEach(function(f,i){
    h+='<div style="background:#f0f7ff;border-radius:12px;padding:13px 16px;font-size:15px;font-weight:800;color:#0369a1;margin-bottom:'+(i<FLOW.length-1?'30px':'0')+';position:relative">'+
      '<span style="font-size:12px;color:#be185d;display:block;margin-bottom:3px">'+esc(f.t)+'</span>'+esc(f.x)+
      (i<FLOW.length-1?'<span style="position:absolute;bottom:-24px;left:50%;transform:translateX(-50%);color:#93c5e8">▼</span>':'')+'</div>';
  });
  h+='</div><div class="qcard"><div class="qnum">🎯 핵심 주제</div><div class="qsent" style="font-size:17px">불편함(필요)이 관찰과 아이디어를 거쳐 새로운 발명을 낳는다 — <i>Necessity is the mother of invention.</i> '+sp('Necessity is the mother of invention.',true)+'</div></div>';
  /* 순서배열 */
  if(!window._shuf)window._shuf=shuffle(FLOW.map(function(f,i){return {t:f.t,x:f.x,oi:i};}));
  var op=window._orderPick||[];
  h+='<div class="intro" style="background:#fdf2f8;border-color:#f9a8d4">⛳ <b>순서 배열</b> — 섞인 단락을 글의 순서대로 탭하세요.</div>';
  window._shuf.forEach(function(f){
    var idx=op.indexOf(f.oi);
    h+='<div class="opt'+(idx>=0?' pick':'')+'" onclick="pickOrder('+f.oi+')" style="cursor:pointer"><span style="display:inline-flex;width:27px;height:27px;border-radius:50%;background:'+(idx>=0?'#ec4899':'#e5e7eb')+';color:'+(idx>=0?'#fff':'#666')+';align-items:center;justify-content:center;font-size:12px;font-weight:900;margin-right:6px">'+(idx>=0?idx+1:'·')+'</span><b style="color:#be185d">'+esc(f.t)+'</b> — '+esc(f.x)+'</div>';
  });
  h+='<div class="btns"><button class="b b1" onclick="checkOrder()">순서 확인</button><button class="b b2" onclick="window._orderPick=[];render()">초기화</button></div>';
  if(window._orderChecked){
    var ok=op.length===FLOW.length&&op.every(function(v,i){return v===i;});
    h+='<div class="ansbox show" style="text-align:center;font-size:16px">'+(ok?'✅ 정답! 속담→자전거→수정액→웹캠→주제':'❌ 다시 — 글의 전개 순서를 떠올려 보세요')+'</div>';
  }
  return h;
}
function pickOrder(oi){var op=window._orderPick||[];var i=op.indexOf(oi);if(i>=0)op.splice(i,1);else op.push(oi);window._orderPick=op;window._orderChecked=false;render();}
function checkOrder(){var op=window._orderPick||[];if(op.length<FLOW.length){alert('모든 단락을 순서대로 선택하세요.');return;}window._orderChecked=true;render();}

/* ===== ④ 내용 OX ===== */
function V3(){
  var done=oxAns.filter(function(x){return x!==null;}).length;
  var h='<div class="intro">💡 <b>④ 내용일치 O/X</b><br>모두 푼 뒤 채점하세요. 해설은 채점 후 공개됩니다.</div>'+
    '<div class="bar"><div style="width:'+Math.round(done/OX.length*100)+'%"></div></div>';
  OX.forEach(function(o,i){
    var p=oxAns[i];
    h+='<div class="qcard"><div class="qnum">문제 '+(i+1)+' / '+OX.length+'</div><div class="qsent" style="font-size:16px">'+esc(o.q)+'</div>'+
      '<div style="display:flex;gap:10px;margin-top:10px">'+
      '<button class="opt'+(p===true?' pick':'')+(oxChecked?(o.a===true?' correct':(p===true?' wrong':'')):'')+'" style="flex:1;text-align:center;justify-content:center" onclick="pickOX('+i+',true)">O</button>'+
      '<button class="opt'+(p===false?' pick':'')+(oxChecked?(o.a===false?' correct':(p===false?' wrong':'')):'')+'" style="flex:1;text-align:center;justify-content:center" onclick="pickOX('+i+',false)">X</button></div>'+
      (oxChecked?'<div class="ansbox show">정답: '+(o.a?'O':'X')+' — '+esc(o.why)+' '+sp(o.why,true)+'</div>':'')+'</div>';
  });
  h+='<div class="btns"><button class="b b4" onclick="checkOX()">📝 채점하기</button><button class="b b2" onclick="oxAns=OX.map(function(){return null;});oxChecked=false;render()">다시 풀기</button></div>';
  if(oxChecked){
    var sc=OX.filter(function(o,i){return oxAns[i]===o.a;}).length;
    h+='<div class="result"><div class="score-big">'+sc+' / '+OX.length+'</div></div>';
  }
  return h;
}
function pickOX(i,v){if(oxChecked)return;oxAns[i]=v;render();}
function checkOX(){if(oxAns.some(function(x){return x===null;})){alert('모든 문제를 먼저 풀어주세요.');return;}oxChecked=true;render();}

/* ===== ⑤ 거꾸로 영작 (어순 배열) ===== */
function V4(){
  var q=S[bIdx], done=bChecked.filter(Boolean).length, correct=bCorrect.filter(function(x){return x===true;}).length;
  if(!q._sh)q._sh=shuffle(words(q.en).map(function(w,i){return {w:w,i:i};}));
  var built=bBuilt.map(function(i){return '<span style="display:inline-block;background:#fff;border:1.5px solid #ec4899;border-radius:8px;padding:3px 10px;margin:3px;cursor:pointer" onclick="rmTok('+i+')">'+esc(words(q.en)[i])+'</span>';}).join(' ');
  var toks=q._sh.map(function(o){return '<span class="opt" style="display:inline-block;width:auto;padding:9px 13px;margin:4px;'+(bBuilt.indexOf(o.i)>=0?'opacity:.25;pointer-events:none':'')+'" onclick="addTok('+o.i+')">'+esc(o.w)+'</span>';}).join('');
  var made=bBuilt.map(function(i){return words(q.en)[i];}).join(' ');
  var h='<div class="intro">💡 <b>⑤ 거꾸로 영작</b><br>본문 <b>전체 '+S.length+'문장</b>을 한글→영어로! 단어를 순서대로 탭해 문장을 만드세요.</div>'+
    '<div class="bar"><div style="width:'+Math.round(done/S.length*100)+'%"></div></div>'+
    '<div class="qcard"><div class="qnum">'+(bIdx+1)+' / '+S.length+' · '+esc(q.sec)+'</div>'+
    '<div class="qsent" style="color:#065f46;font-size:17px">'+esc(q.ko)+'</div>'+
    '<div class="qhint">핵심: '+q.hint.map(function(p){return '<span style="background:#fdf2f8;color:#be185d;font-weight:800;padding:2px 9px;border-radius:8px;margin:2px;display:inline-block">'+esc(p)+'</span>';}).join('')+'</div>'+
    '<div style="min-height:56px;background:#f0f7ff;border:2px dashed #93c5e8;border-radius:10px;padding:12px;font-size:15px;font-weight:800;line-height:1.9;margin:12px 0">'+(built||'<span style="color:#aaa">단어를 탭해서 문장을 만드세요</span>')+'</div>'+
    '<div style="display:flex;flex-wrap:wrap">'+toks+'</div>';
  if(bChecked[bIdx])h+='<div style="font-weight:900;margin-top:9px;color:'+(bCorrect[bIdx]?'#10b981':'#ef4444')+'">'+(bCorrect[bIdx]?'✓ 맞음!':'✗ 다시 배열해 보세요')+'</div>';
  if(bReveal[bIdx])h+='<div class="ansbox show">정답: '+sp(q.en,true)+' '+esc(q.en)+'<br><span style="font-size:12px;color:#888">내 답: '+esc(made||'(없음)')+'</span></div>';
  h+='<div class="btns"><button class="b b1" onclick="checkB()">확인</button><button class="b b3" onclick="showB()">정답 보기</button><button class="b b2" onclick="bBuilt=[];render()">지우기</button></div></div>'+
    '<div style="display:flex;justify-content:space-between;align-items:center;margin-top:14px">'+
    '<button class="b b2" onclick="bNav(-1)" '+(bIdx===0?'disabled style="opacity:.35"':'')+'>← 이전</button>'+
    '<span style="font-size:13px;color:#666;font-weight:800">'+done+'/'+S.length+' 완료 · 정답 '+correct+'</span>'+
    '<button class="b b2" onclick="bNav(1)" '+(bIdx===S.length-1?'disabled style="opacity:.35"':'')+'>다음 →</button></div>';
  return h;
}
function addTok(i){if(bBuilt.indexOf(i)<0){bBuilt.push(i);render();}}
function rmTok(i){bBuilt=bBuilt.filter(function(x){return x!==i;});render();}
function checkB(){var q=S[bIdx],ans=words(q.en).join(' '),made=bBuilt.map(function(i){return words(q.en)[i];}).join(' ');bChecked[bIdx]=true;bCorrect[bIdx]=(norm(made)===norm(ans));render();}
function showB(){if(!bChecked[bIdx]){alert('먼저 확인을 눌러주세요.');return;}bReveal[bIdx]=true;render();}
function bNav(d){bIdx=Math.max(0,Math.min(S.length-1,bIdx+d));bBuilt=[];render();}

buildSteps();render();
</script>
</body>
