<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>절(Clause)의 지도 — 큰 그림에서 작은 그림으로</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Lora:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#FAF7F0; --card:#FFFFFF; --ink:#23272F; --sub:#727784; --line:#E7E2D6;
  --root:#1F3A5F; --root-bg:#E8EEF6;
  --n:#1E7A5A;  --n-bg:#E2F3EB;
  --a:#C84F2F;  --a-bg:#FBE8E0;
  --ad:#5D4FA3; --ad-bg:#EBE7F8;
  --hl:#FFE45C;
  --ok:#1E7A5A; --bad:#C0392B;
  --r:14px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{animation:none!important;transition:none!important}}
body{font-family:'IBM Plex Sans KR',sans-serif;background:var(--paper);color:var(--ink);line-height:1.65;
  background-image:radial-gradient(#e9e4d6 1px,transparent 1px);background-size:26px 26px;}
.wrap{max-width:780px;margin:0 auto;padding:0 16px 90px}

/* ---------- header ---------- */
header{padding:38px 0 10px;text-align:center}
.eyebrow{display:inline-block;font-size:.78rem;font-weight:700;letter-spacing:.18em;color:var(--root);
  border:1.5px solid var(--root);border-radius:999px;padding:3px 14px;margin-bottom:14px;background:#fff}
h1{font-family:'Black Han Sans',sans-serif;font-size:clamp(1.9rem,6vw,2.7rem);line-height:1.25;font-weight:400}
h1 .mark{background:linear-gradient(transparent 58%,var(--hl) 58%);padding:0 4px}
.tagline{color:var(--sub);margin-top:10px;font-size:.95rem}

/* ---------- stepper ---------- */
.stepper{position:sticky;top:0;z-index:50;background:rgba(250,247,240,.94);backdrop-filter:blur(6px);
  border-bottom:1px solid var(--line);margin:22px -16px 0;padding:10px 8px}
.steps{display:flex;justify-content:center;gap:4px;max-width:780px;margin:0 auto}
.step{flex:1;max-width:118px;border:none;background:transparent;cursor:pointer;font-family:inherit;
  display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 2px;border-radius:10px}
.step .dot{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-size:.95rem;background:#fff;border:2px solid var(--line);transition:.25s}
.step .lb{font-size:.68rem;font-weight:600;color:var(--sub);white-space:nowrap}
.step.cur .dot{border-color:var(--ink);box-shadow:0 0 0 3px rgba(35,39,47,.12)}
.step.cur .lb{color:var(--ink)}
.step.done .dot{background:var(--ink);border-color:var(--ink);color:#fff}
.step.locked{opacity:.42;cursor:not-allowed}
.step:not(.locked):hover .dot{transform:translateY(-2px)}

/* ---------- stage shell ---------- */
.stage{display:none;animation:fadeUp .4s ease}
.stage.show{display:block}
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.path{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin:26px 0 8px;font-size:.8rem;font-weight:700}
.path .crumb{padding:2px 10px;border-radius:999px;background:#fff;border:1.5px solid var(--line)}
.path .crumb.on-root{border-color:var(--root);color:var(--root);background:var(--root-bg)}
.path .crumb.on-n{border-color:var(--n);color:var(--n);background:var(--n-bg)}
.path .crumb.on-a{border-color:var(--a);color:var(--a);background:var(--a-bg)}
.path .crumb.on-ad{border-color:var(--ad);color:var(--ad);background:var(--ad-bg)}
.path .sep{color:var(--sub)}
h2.stitle{font-family:'Black Han Sans',sans-serif;font-weight:400;font-size:1.55rem;margin:4px 0 4px}
.ssub{color:var(--sub);font-size:.93rem;margin-bottom:18px}

/* ---------- cards ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:20px 22px;margin:14px 0;
  box-shadow:0 1px 3px rgba(40,35,20,.05)}
.card h3{font-size:1.05rem;margin-bottom:10px;display:flex;align-items:center;gap:8px}
.card h3 .chip{font-size:.7rem;font-weight:700;padding:2px 9px;border-radius:999px}
.chip.c-root{background:var(--root-bg);color:var(--root)}
.chip.c-n{background:var(--n-bg);color:var(--n)}
.chip.c-a{background:var(--a-bg);color:var(--a)}
.chip.c-ad{background:var(--ad-bg);color:var(--ad)}
.card p{margin:6px 0}
.card ul{margin:6px 0 6px 20px}
.kw{font-weight:700}
.kw.n{color:var(--n)} .kw.a{color:var(--a)} .kw.ad{color:var(--ad)} .kw.root{color:var(--root)}
.test-box{margin-top:12px;border:1.5px dashed var(--ink);border-radius:10px;padding:12px 14px;background:#FFFDF4;font-size:.92rem}
.test-box b{display:block;margin-bottom:2px}

/* ---------- english line ---------- */
.enline{display:flex;align-items:flex-start;gap:10px;flex-wrap:wrap}
.en{font-family:'Lora',serif;font-size:1.12rem;line-height:1.7}
.hl{padding:1px 3px;border-radius:3px;font-weight:600;
  background:linear-gradient(180deg,transparent 30%,var(--hl) 30%)}
.hl.n{box-shadow:inset 0 -2.5px 0 var(--n)}
.hl.a{box-shadow:inset 0 -2.5px 0 var(--a)}
.hl.ad{box-shadow:inset 0 -2.5px 0 var(--ad)}
.hl.root{box-shadow:inset 0 -2.5px 0 var(--root)}
.spk{flex:none;border:1.5px solid var(--line);background:#fff;border-radius:999px;width:34px;height:34px;
  cursor:pointer;font-size:.95rem;display:inline-flex;align-items:center;justify-content:center;transition:.2s}
.spk:hover{border-color:var(--ink)}
.spk.playing{background:var(--hl);border-color:var(--ink);animation:pulse 1s infinite}
@keyframes pulse{50%{transform:scale(1.12)}}
.exc{border-left:4px solid var(--line);padding:12px 16px;margin:12px 0;background:#fff;border-radius:0 10px 10px 0;border-top:1px solid var(--line);border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
.exc.n{border-left-color:var(--n)} .exc.a{border-left-color:var(--a)} .exc.ad{border-left-color:var(--ad)} .exc.root{border-left-color:var(--root)}
.tgl{margin-top:8px;border:1.5px solid var(--line);background:#fff;border-radius:8px;padding:4px 12px;
  font-family:inherit;font-size:.8rem;font-weight:600;cursor:pointer;color:var(--sub)}
.tgl:hover{border-color:var(--ink);color:var(--ink)}
.tgl[aria-expanded="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
.trans{display:none;margin-top:9px;font-size:.9rem;background:#F7F5EE;border-radius:8px;padding:9px 12px}
.trans.open{display:block}
.trans .ko{font-weight:600}
.trans .note{color:var(--sub);font-size:.85rem;margin-top:3px}

/* ---------- tree ---------- */
.tree{padding:6px 0 6px 4px}
.tree ul{list-style:none;padding-left:26px;position:relative}
.tree>ul{padding-left:0}
.tree ul ul::before{content:"";position:absolute;left:8px;top:-8px;bottom:14px;border-left:2px solid var(--line)}
.tree li{position:relative;padding:5px 0}
.tree ul ul li::before{content:"";position:absolute;left:-18px;top:21px;width:16px;border-top:2px solid var(--line)}
.node{display:inline-flex;align-items:center;gap:7px;background:#fff;border:1.8px solid var(--line);
  border-radius:10px;padding:5px 12px;font-weight:600;font-size:.9rem;cursor:pointer;transition:.18s;font-family:inherit}
.node .e{font-family:'Lora',serif;font-weight:400;font-style:italic;color:var(--sub);font-size:.82rem}
.node:hover{transform:translateX(2px)}
.node.nd-root{border-color:var(--root);background:var(--root-bg)}
.node.nd-n{border-color:var(--n);background:var(--n-bg)}
.node.nd-a{border-color:var(--a);background:var(--a-bg)}
.node.nd-ad{border-color:var(--ad);background:var(--ad-bg)}
.node.leaf{border-style:dashed;font-family:'Lora',serif;font-style:italic;font-weight:600}
.node.playing{background:var(--hl)!important}

/* ---------- quiz ---------- */
.qz{background:var(--card);border:1.5px solid var(--ink);border-radius:var(--r);padding:20px 22px;margin:26px 0;
  box-shadow:4px 4px 0 rgba(35,39,47,.9)}
.qz-head{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.qz-head .badge{background:var(--ink);color:#fff;font-size:.72rem;font-weight:700;padding:3px 11px;border-radius:999px}
.q{margin:18px 0;padding-top:16px;border-top:1px dashed var(--line)}
.q:first-of-type{border-top:none}
.qno{font-weight:700;font-size:.8rem;color:var(--sub);margin-bottom:4px}
.qtext{font-weight:600;margin-bottom:10px}
.qsent{margin:8px 0 12px;padding:10px 14px;background:#F7F5EE;border-radius:10px}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{text-align:left;font-family:inherit;font-size:.92rem;background:#fff;border:1.5px solid var(--line);
  border-radius:10px;padding:9px 13px;cursor:pointer;transition:.15s;line-height:1.55}
.opt:hover:not(:disabled){border-color:var(--ink)}
.opt.sel{border-color:var(--ink);background:#F2F0E8;box-shadow:inset 0 0 0 1px var(--ink)}
.opt.right{border-color:var(--ok);background:var(--n-bg);box-shadow:inset 0 0 0 1px var(--ok)}
.opt.wrong{border-color:var(--bad);background:#FBE5E1;box-shadow:inset 0 0 0 1px var(--bad);animation:shake .3s}
.opt:disabled{cursor:default}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.fb{display:none;margin-top:9px;font-size:.87rem;border-radius:8px;padding:9px 12px}
.fb.show{display:block}
.fb.good{background:var(--n-bg);border:1px solid var(--ok)}
.fb.badf{background:#FBE5E1;border:1px solid var(--bad)}
.selrow{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:9px 0;padding:9px 12px;background:#fff;border:1.5px solid var(--line);border-radius:10px}
.selrow select{font-family:inherit;font-size:.88rem;padding:5px 8px;border-radius:8px;border:1.5px solid var(--line);background:#fff}
.selrow .mark{font-weight:700;min-width:22px;text-align:center}
.walkstep{margin:12px 0;padding:11px 13px;border:1.5px solid var(--line);border-radius:10px;background:#fff}
.walkstep .wp{font-weight:600;font-size:.9rem;margin-bottom:8px}
.walkstep.lockedw{opacity:.45;pointer-events:none}
.btn{font-family:inherit;font-weight:700;font-size:.95rem;border:none;border-radius:12px;padding:12px 26px;cursor:pointer;transition:.2s}
.btn.primary{background:var(--ink);color:#fff;box-shadow:3px 3px 0 rgba(35,39,47,.35)}
.btn.primary:hover{transform:translate(-1px,-1px);box-shadow:4px 4px 0 rgba(35,39,47,.35)}
.btn.primary:disabled{opacity:.4;cursor:not-allowed;transform:none;box-shadow:none}
.btn.ghost{background:#fff;border:1.5px solid var(--ink);color:var(--ink)}
.navrow{display:flex;justify-content:space-between;align-items:center;margin:28px 0 10px;gap:10px}
.unlock-banner{display:none;align-items:center;gap:10px;margin-top:16px;background:var(--n-bg);border:1.5px solid var(--ok);
  border-radius:12px;padding:12px 16px;font-weight:600;animation:fadeUp .4s ease}
.unlock-banner.show{display:flex}

/* ---------- result ---------- */
.score-wrap{text-align:center;padding:10px 0 4px}
.score-big{font-family:'Black Han Sans',sans-serif;font-size:3.2rem;line-height:1.1}
.grade{font-weight:700;margin-top:2px}
.branchbars{margin:18px 0 6px;text-align:left}
.bb{margin:10px 0}
.bb .bl{display:flex;justify-content:space-between;font-size:.83rem;font-weight:700;margin-bottom:4px}
.bb .track{height:12px;background:#EFEBDF;border-radius:99px;overflow:hidden}
.bb .fill{height:100%;border-radius:99px;width:0;transition:width .8s ease}
.advice{margin-top:14px;font-size:.9rem;background:#F7F5EE;border-radius:10px;padding:12px 14px;text-align:left}
footer{text-align:center;color:var(--sub);font-size:.78rem;margin-top:46px}
@media(max-width:520px){
  .card,.qz{padding:16px 14px}
  .step .lb{font-size:.6rem}
  .en{font-size:1.02rem}
}
</style>
</head>
<body>
<div class="wrap">
<header>
  <div class="eyebrow">ENGLISH GRAMMAR · CLAUSE MAP</div>
  <h1>절(Clause)의 <span class="mark">지도</span>를 그리다</h1>
  <p class="tagline">큰 그림에서 작은 그림으로 — 나무의 뿌리부터 잎까지, 한 가지씩 정복합니다.<br>🔊 버튼으로 모든 영어 표현을 들어보세요.</p>
</header>
<nav class="stepper"><div class="steps" id="steps"></div></nav>
<main id="main"></main>
<footer>절의 지도 · 중3 → 고1 브릿지 과정 · Web Speech API 듣기 지원</footer>
</div>
<script>
/* ================= DATA ================= */
const TREE = {k:'절',e:'Clause',c:'root',kids:[
  {k:'독립절',e:'Independent Clause',c:'root',kids:[]},
  {k:'종속절',e:'Subordinate Clause',c:'root',kids:[
    {k:'명사절',e:'Noun Clause',c:'n',kids:[
      {leaf:'that'},{leaf:'if'},{leaf:'whether'},{leaf:'의문사 (what, who, where...)',say:'what, who, where, when, why, how'}
    ]},
    {k:'형용사절',e:'Adjective Clause = Relative Clause',c:'a',kids:[
      {k:'관계대명사',e:'Relative Pronoun',c:'a',kids:[{leaf:'who'},{leaf:'whom'},{leaf:'whose'},{leaf:'which'},{leaf:'that'}]},
      {k:'관계부사',e:'Relative Adverb',c:'a',kids:[{leaf:'where'},{leaf:'when'},{leaf:'why'}]}
    ]},
    {k:'부사절',e:'Adverb Clause',c:'ad',kids:[
      {leaf:'if'},{leaf:'because'},{leaf:'when'},{leaf:'although'},{leaf:'since'},{leaf:'while'}
    ]}
  ]}
]};

/* en strings: [[...]] = highlighted clause */
const STAGES = [
/* ---------- 0 큰 그림 ---------- */
{id:'map',icon:'🌳',label:'큰 그림',pathArr:[['절','root']],
 title:'1단계 · 절이란 무엇인가 — 전체 지도 펼치기',
 sub:'세부 사항을 외우기 전에, 먼저 숲 전체를 봅니다. 이 지도가 끝까지 우리의 나침반이 됩니다.',
 cards:[
  {t:'h',chip:['지도','root'],title:'절(Clause) = 주어 + 동사를 가진 의미 단위',html:
   `<p>단어가 모여 <b>구(phrase)</b>가 되고, <span class="kw root">주어와 동사</span>를 갖추면 <b>절(clause)</b>이 됩니다. 문장은 절로 만들어집니다.</p>
    <p>절은 딱 두 종류뿐입니다.</p>
    <ul><li><span class="kw root">독립절</span> — 혼자서도 <b>완전한 문장</b>이 되는 절</li>
        <li><span class="kw root">종속절</span> — 접속사 등이 붙어 <b>혼자서는 미완성</b>인 절. 반드시 독립절에 기대야 합니다</li></ul>`},
  {t:'ex',cls:'root',en:'[[She smiled.]]',ko:'그녀는 미소 지었다.',note:'주어(She)+동사(smiled). 혼자서 완전 → 독립절.'},
  {t:'ex',cls:'root',en:'[[because she was happy]] … ?',ko:'그녀가 행복했기 때문에 … (그래서 뭐?)',note:'주어+동사는 있지만 because 때문에 듣는 사람이 뒷이야기를 기다리게 됨 → 혼자서는 미완성인 종속절.'},
  {t:'ex',cls:'root',en:'She smiled [[because she was happy]].',ko:'그녀는 행복했기 때문에 미소 지었다.',note:'독립절(She smiled)에 종속절이 기대어 완전한 문장이 됨.'},
  {t:'h',chip:['핵심','root'],title:'종속절의 정체는 “단어”가 아니라 “역할”로 정해진다',html:
   `<p>종속절은 문장 속에서 맡은 <b>역할(직업)</b>에 따라 딱 3가지로 나뉩니다.</p>
    <ul><li><span class="kw n">명사절</span> — 명사처럼 <b>주어·목적어·보어 자리</b>를 차지 (문장의 부품)</li>
        <li><span class="kw a">형용사절</span> — 형용사처럼 <b>앞의 명사를 꾸밈</b> (명사의 액세서리)</li>
        <li><span class="kw ad">부사절</span> — 부사처럼 <b>시간·이유·조건 등 배경</b>을 설명 (문장의 배경음악)</li></ul>
    <p>⚠️ 같은 단어(that, if, when)가 다른 절을 이끌 수 있어서, <b>단어 암기만으로는 절대 풀 수 없습니다.</b> 이것이 이 수업의 최종 목표입니다.</p>`},
  {t:'tree'},
 ],
 cp:[
  {q:'“Although it was raining”이 혼자서 문장이 될 수 없는 이유로 가장 정확한 것은?',
   opts:['동사가 없기 때문에','although가 붙어 다른 절에 기대야 하는 종속절이기 때문에','주어가 대명사 it이기 때문에','과거시제이기 때문에'],ans:1,
   ex:'주어(it)+동사(was raining)는 갖췄지만, although(비록 ~지만)가 붙는 순간 “그런데 어쨌다는 거지?”라는 뒷이야기가 필요해집니다. 이런 절이 종속절입니다.'},
  {q:'다음 중 독립절(혼자서 완전한 문장)은?',
   opts:['when the movie ended','that he is a liar','The phone rang.','if you study hard'],ans:2,
   ex:'The phone rang은 주어+동사만으로 완전합니다. 나머지는 when/that/if가 붙어 뒷말을 기다리게 만드는 종속절입니다.'},
  {q:'종속절이 명사절·형용사절·부사절 중 무엇인지는 무엇으로 결정되는가?',
   opts:['절을 이끄는 단어(접속사)의 종류','절의 길이','문장 속에서 그 절이 맡은 역할(기능)','동사의 시제'],ans:2,
   ex:'같은 that도 명사절일 수도, 형용사절일 수도 있습니다. 단어가 아니라 “문장 안에서 무슨 일을 하는가(역할)”가 절의 종류를 결정합니다. 이 원리를 끝까지 기억하세요.'}
 ]},

/* ---------- 1 명사절 ---------- */
{id:'noun',icon:'🟩',label:'명사절',pathArr:[['절','root'],['종속절','root'],['명사절','n']],
 title:'2단계 · 명사절 — 문장의 부품이 되는 절',
 sub:'명사가 앉는 의자(주어·목적어·보어)에 절이 통째로 앉으면 명사절입니다.',
 cards:[
  {t:'h',chip:['개념','n'],title:'명사절 = 명사 자리를 통째로 차지하는 절',html:
   `<p>명사는 문장에서 <b>주어·목적어·보어</b> 자리에 앉습니다. 절이 그 의자에 앉으면 <span class="kw n">명사절</span>입니다.</p>
    <div class="test-box"><b>🔍 판별 도구 ① 대치 테스트</b>그 절을 통째로 <b>it</b>(또는 something)으로 바꿔도 문장이 성립하면 → 명사절!</div>`},
  {t:'ex',cls:'n',en:'I know [[that she is honest]].',ko:'나는 그녀가 정직하다는 것을 안다.',note:'I know it. ✔ → know의 목적어 자리를 차지한 명사절. that = ~라는 것'},
  {t:'ex',cls:'n',en:'[[That he passed the exam]] is surprising.',ko:'그가 시험에 합격했다는 것은 놀랍다.',note:'It is surprising. ✔ → 주어 자리의 명사절.'},

/* ================= ENGINE ================= */
const CLS_LB=['명사절','형용사절','부사절'], CLS_KEY=['n','a','ad'];
let cur=0, maxUnlocked=0;
const cpState=STAGES.map(()=>({done:false}));

/* ---- TTS ---- */
let voice=null;
function pickVoice(){const vs=speechSynthesis.getVoices();
  voice=vs.find(v=>v.lang==='en-US'&&/female|samantha|aria|zira|jenny/i.test(v.name))||vs.find(v=>v.lang==='en-US')||vs.find(v=>v.lang.startsWith('en'))||null;}
if('speechSynthesis' in window){pickVoice();speechSynthesis.onvoiceschanged=pickVoice;}
function speak(text,btn){
  if(!('speechSynthesis' in window)){alert('이 브라우저는 음성 듣기를 지원하지 않습니다. Chrome 사용을 권장합니다.');return;}
  speechSynthesis.cancel();
  document.querySelectorAll('.playing').forEach(b=>b.classList.remove('playing'));
  const u=new SpeechSynthesisUtterance(text);
  u.lang='en-US'; if(voice)u.voice=voice; u.rate=0.9;
  if(btn){btn.classList.add('playing');u.onend=u.onerror=()=>btn.classList.remove('playing');}
  speechSynthesis.speak(u);
}
function spkBtn(text){return `<button class="spk" title="듣기" aria-label="영어 듣기" onclick="speak(this.dataset.say,this)" data-say="${text.replace(/"/g,'&quot;')}">🔊</button>`;}
function plain(s){return s.replace(/\[\[|\]\]|\{\{|\}\}/g,'').replace(/<[^>]+>/g,'');}
function renderEn(s,cls){
  return s.replace(/\[\[(.+?)\]\]/g,`<span class="hl ${cls||'root'}">$1</span>`)
          .replace(/\{\{(.+?)\}\}/g,`<span class="hl ad">$1</span>`);
}

/* ---- toggle ---- */
function tgl(btn){const t=btn.nextElementSibling;const open=t.classList.toggle('open');
  btn.setAttribute('aria-expanded',open);btn.textContent=open?'해석 닫기 ▲':'해석 + 풀이 보기 ▼';}

/* ---- stepper ---- */
function renderSteps(){
  const el=document.getElementById('steps');
  el.innerHTML=STAGES.map((s,i)=>{
    const lock=i>maxUnlocked, done=cpState[i].done;
    return `<button class="step ${i===cur?'cur':''} ${done?'done':''} ${lock?'locked':''}" onclick="go(${i})" ${lock?'aria-disabled="true"':''}>
      <span class="dot">${lock?'🔒':done?'✓':s.icon}</span><span class="lb">${s.label}</span></button>`;
  }).join('');
}
function go(i){
  if(i>maxUnlocked){window.speechSynthesis&&speechSynthesis.cancel();
    alert('🔒 아직 잠겨 있어요!\n이전 단계의 체크포인트를 모두 통과하면 열립니다.\n(큰 그림 → 작은 그림 순서가 이 학습의 핵심이에요.)');return;}
  window.speechSynthesis&&speechSynthesis.cancel();cur=i;renderSteps();
  document.querySelectorAll('.stage').forEach((s,k)=>s.classList.toggle('show',k===i));
  window.scrollTo({top:0});
}

/* ---- tree ---- */
function treeHTML(node){
  if(node.leaf!==undefined){const say=node.say||node.leaf;
    return `<li><button class="node leaf" onclick="speak(this.dataset.say,this)" data-say="${say}">${node.leaf} 🔉</button></li>`;}
  const kids=node.kids&&node.kids.length?`<ul>${node.kids.map(treeHTML).join('')}</ul>`:'';
  return `<li><button class="node nd-${node.c}" onclick="speak(this.dataset.say,this)" data-say="${node.e.replace(/=.+$/,'')}">${node.k} <span class="e">${node.e} 🔉</span></button>${kids}</li>`;
}

/* ---- cards ---- */
function cardHTML(c){
  if(c.t==='tree') return `<div class="card"><h3><span class="chip c-root">전체 지도</span>로직 트리 — 노드를 누르면 영어 명칭을 읽어 줍니다</h3>
    <div class="tree"><ul>${treeHTML(TREE)}</ul></div>
    <p style="font-size:.85rem;color:var(--sub);margin-top:8px">이제부터 🟩명사절 → 🟧형용사절 → 🟪부사절 순서로, 이 나무를 한 가지씩 타고 내려갑니다.</p></div>`;
  if(c.t==='h') return `<div class="card"><h3><span class="chip c-${c.chip[1]}">${c.chip[0]}</span>${c.title}</h3>${c.html}</div>`;
  if(c.t==='ex'){const say=plain(c.en);
    return `<div class="exc ${c.cls}">
      <div class="enline"><span class="en">${renderEn(c.en,c.cls)}</span>${spkBtn(say)}</div>
      <button class="tgl" aria-expanded="false" onclick="tgl(this)">해석 + 풀이 보기 ▼</button>
      <div class="trans"><div class="ko">${c.ko}</div><div class="note">${c.note}</div></div></div>`;}
  return '';
}

/* ---- checkpoint (MC) ---- */
function cpHTML(i,qs){
  return `<div class="qz" id="cp${i}"><div class="qz-head"><span class="badge">CHECKPOINT</span><b>체크포인트 — 모두 맞히면 다음 가지가 열립니다</b></div>
  ${qs.map((q,k)=>`<div class="q"><div class="qno">Q${k+1} / ${qs.length}</div><div class="qtext">${q.q}</div>
    <div class="opts">${q.opts.map((o,oi)=>`<button class="opt" onclick="cpPick(${i},${k},${oi},this)">${String.fromCharCode(9312+oi)} ${o}</button>`).join('')}</div>
    <div class="fb" id="fb-${i}-${k}"></div></div>`).join('')}
  <div class="unlock-banner" id="ub${i}">🌿 통과! 다음 가지가 열렸습니다. <button class="btn primary" onclick="go(${i+1})">다음 단계로 →</button></div></div>`;
}
const cpOK=STAGES.map(s=>s.cp?s.cp.map(()=>false):[]);
function cpPick(si,qi,oi,btn){
  const q=STAGES[si].cp[qi], fb=document.getElementById(`fb-${si}-${qi}`);
  const opts=btn.parentElement.querySelectorAll('.opt');
  if(oi===q.ans){
    opts.forEach((o,k)=>{o.disabled=true;o.classList.remove('wrong');if(k===oi)o.classList.add('right');});
    fb.className='fb show good';fb.innerHTML='✅ 정답! '+q.ex;
    cpOK[si][qi]=true;
    if(cpOK[si].every(v=>v)) unlockNext(si);
  }else{
    btn.classList.add('wrong');
    fb.className='fb show badf';fb.innerHTML='🤔 다시 생각해 보세요. 힌트: 단어가 아니라 <b>역할(자리·기능)</b>로 판단하세요.';
    setTimeout(()=>btn.classList.remove('wrong'),500);
  }
}
function unlockNext(si){
  cpState[si].done=true;
  if(si+1>maxUnlocked)maxUnlocked=si+1;
  renderSteps();
  const ub=document.getElementById('ub'+si);if(ub)ub.classList.add('show');
}

/* ---- classify checkpoint (stage 5) ---- */
function classifyCpHTML(i,data){
  return `<div class="qz"><div class="qz-head"><span class="badge">FINAL CHECK</span><b>${data.intro}</b></div>
  ${data.items.map((it,k)=>`<div class="selrow"><span class="mark" id="cm-${i}-${k}">·</span>
    <span class="en" style="flex:1;min-width:200px">${renderEn(it.en,"root")}</span>${spkBtn(plain(it.en))}
    <select id="cs-${i}-${k}"><option value="-1">— 선택 —</option>${CLS_LB.map((l,li)=>`<option value="${li}">${l}</option>`).join('')}</select>
    <div class="fb" id="cf-${i}-${k}" style="flex-basis:100%"></div></div>`).join('')}
  <div style="margin-top:14px"><button class="btn primary" onclick="classifyCheck(${i})">채점하기</button></div>
  <div class="unlock-banner" id="ub${i}">🏆 6연승! 최종 시험이 열렸습니다. <button class="btn primary" onclick="go(${i+1})">시험 보러 가기 →</button></div></div>`;
}
function classifyCheck(i){
  const data=STAGES[i].cpClassify;let all=true;
  data.items.forEach((it,k)=>{
    const v=+document.getElementById(`cs-${i}-${k}`).value, m=document.getElementById(`cm-${i}-${k}`), f=document.getElementById(`cf-${i}-${k}`);
    if(v===it.ans){m.textContent='✅';f.className='fb show good';f.innerHTML=`<b>${CLS_LB[it.ans]}</b> — ${it.why}`;document.getElementById(`cs-${i}-${k}`).disabled=true;}
    else{all=false;m.textContent='❌';f.className='fb show badf';f.innerHTML=v<0?'아직 선택하지 않았어요.':'3단계 알고리즘을 처음부터 적용해 보세요: ① 빼도 완전+이동 가능? ② it 대치? ③ 앞 명사 수식?';}
  });
  if(all)unlockNext(i);
}

    const sent=q.sent?`<div class="qsent"><div class="enline"><span class="en">${renderEn(q.sent,'root')}</span>${spkBtn(q.say||plain(q.sent))}</div></div>`:'';
    if(q.type==='mc'){
      body=`<div class="opts">${q.opts.map((o,oi)=>`<button class="opt" id="e-${qi}-${oi}" onclick="exPick(${qi},${oi})">${String.fromCharCode(9312+oi)} ${o}</button>`).join('')}</div>`;
    }else if(q.type==='walk'){
      body=q.steps.map((st,si)=>`<div class="walkstep ${si>0?'lockedw':''}" id="ws-${qi}-${si}">
        <div class="wp">${st.p}</div>
        <div class="opts">${st.opts.map((o,oi)=>`<button class="opt" id="e-${qi}-${si}-${oi}" onclick="exWalk(${qi},${si},${oi})">${String.fromCharCode(9312+oi)} ${o}</button>`).join('')}</div></div>`).join('');
    }else{
      body=q.items.map((it,k)=>`<div class="selrow"><span class="mark" id="em-${qi}-${k}">·</span>
        <span class="en" style="flex:1;min-width:200px">${renderEn(it.en,"root")}</span>${spkBtn(plain(it.en))}
        <select id="es-${qi}-${k}" onchange="exAns[${qi}][${k}]=+this.value"><option value="-1">— 선택 —</option>${CLS_LB.map((l,li)=>`<option value="${li}">${l}</option>`).join('')}</select>
        <div class="fb" id="ef-${qi}-${k}" style="flex-basis:100%"></div></div>`).join('');
    }
    return `<div class="qz" id="eq${qi}"><div class="qz-head"><span class="badge">${q.type==='walk'?'WALK · 트리 분석':q.type==='classify'?'SORT · 분류':'WHY · 개념'}</span><b>문항 ${qi+1} / ${EXAM.length}</b></div>
      <div class="qtext">${q.q}</div>${sent}${body}<div class="fb" id="exfb${qi}"></div></div>`;
  }).join('')}
  <div style="text-align:center;margin:30px 0">
    <button class="btn primary" id="gradeBtn" onclick="grade()" style="font-size:1.05rem;padding:15px 40px">📝 최종 채점하기</button>
  </div>
  <div id="result"></div>`;
}
function exPick(qi,oi){if(graded)return;exAns[qi]=oi;
  EXAM[qi].opts.forEach((_,k)=>document.getElementById(`e-${qi}-${k}`).classList.toggle('sel',k===oi));}
function exWalk(qi,si,oi){if(graded)return;exAns[qi][si]=oi;
  EXAM[qi].steps[si].opts.forEach((_,k)=>document.getElementById(`e-${qi}-${si}-${oi===k?k:k}`).classList.toggle('sel',k===oi));
  const next=document.getElementById(`ws-${qi}-${si+1}`);if(next)next.classList.remove('lockedw');}
function grade(){
  /* completeness check */
  for(let qi=0;qi<EXAM.length;qi++){const a=exAns[qi];
    const empty=Array.isArray(a)?a.some(v=>v<0):a<0;
    if(empty){document.getElementById('eq'+qi).scrollIntoView({block:'center'});
      const f=document.getElementById('exfb'+qi);f.className='fb show badf';f.textContent='⚠️ 아직 답하지 않은 부분이 있어요. 모두 답한 뒤 채점하세요.';return;}}
  graded=true;document.getElementById('gradeBtn').disabled=true;
  let score=0;const tagTot={n:0,a:0,ad:0},tagOK={n:0,a:0,ad:0};
  EXAM.forEach((q,qi)=>{
    let ok;
    if(q.type==='mc'){
      ok=exAns[qi]===q.ans;
      q.opts.forEach((_,k)=>{const el=document.getElementById(`e-${qi}-${k}`);el.disabled=true;
        if(k===q.ans)el.classList.add('right');else if(k===exAns[qi])el.classList.add('wrong');});
      const f=document.getElementById('exfb'+qi);f.className='fb show '+(ok?'good':'badf');
      f.innerHTML=(ok?'✅ 정답! ':'❌ 오답. ')+q.ex;
    }else if(q.type==='walk'){
      ok=q.steps.every((st,si)=>exAns[qi][si]===st.ans);
      q.steps.forEach((st,si)=>st.opts.forEach((_,k)=>{const el=document.getElementById(`e-${qi}-${si}-${k}`);el.disabled=true;
        if(k===st.ans)el.classList.add('right');else if(k===exAns[qi][si])el.classList.add('wrong');}));
      const f=document.getElementById('exfb'+qi);f.className='fb show '+(ok?'good':'badf');
      f.innerHTML=(ok?'✅ 완벽한 트리 분석! ':'❌ 분석 경로에 오류가 있어요. ')+q.ex;
    }else{
      ok=q.items.every((it,k)=>exAns[qi][k]===it.ans);
      q.items.forEach((it,k)=>{const f=document.getElementById(`ef-${qi}-${k}`),m=document.getElementById(`em-${qi}-${k}`);
        document.getElementById(`es-${qi}-${k}`).disabled=true;
        const good=exAns[qi][k]===it.ans;m.textContent=good?'✅':'❌';
        f.className='fb show '+(good?'good':'badf');f.innerHTML=`<b>${CLS_LB[it.ans]}</b> — ${it.why}`;});
      const f=document.getElementById('exfb'+qi);f.className='fb show '+(ok?'good':'badf');
      f.innerHTML=ok?'✅ 세 얼굴을 완벽히 구분했어요!':'❌ 위 각 문장의 해설을 확인하세요. “단어가 아니라 역할”입니다.';
    }
    if(ok)score++;
    q.tags.forEach(t=>{tagTot[t]++;if(ok)tagOK[t]++;});
  });
  const pct=score*10;
  const grade= score>=9?['🌳 클로즈 마스터','로직 트리가 완전히 머릿속에 자랐습니다. 고1 어법 문제로 직행하세요!']
    :score>=7?['🌿 거의 다 자란 나무','뼈대는 탄탄! 틀린 문항의 해설을 소리 내어 설명해 보면 완성됩니다.']
    :score>=5?['🌱 자라는 중','개념의 절반이 잡혔어요. 약한 가지(아래 그래프)의 단계로 돌아가 예문을 다시 들어 보세요.']
    :['🫘 씨앗 단계','괜찮아요, 지도는 이미 손에 있어요. 1단계부터 체크포인트를 다시 통과해 봅시다.'];
  const bars=[['명사절 🟩','n','var(--n)'],['형용사절 🟧','a','var(--a)'],['부사절 🟪','ad','var(--ad)']]
    .map(([lb,t,col])=>{const p=tagTot[t]?Math.round(tagOK[t]/tagTot[t]*100):100;
      return `<div class="bb"><div class="bl"><span>${lb}</span><span>${tagOK[t]} / ${tagTot[t]} 문항</span></div>
      <div class="track"><div class="fill" style="background:${col}" data-w="${p}%"></div></div></div>`;}).join('');
  const weak=[['n','2단계 · 명사절',1],['a','3단계 · 형용사절',2],['ad','4단계 · 부사절',3]]
    .filter(([t])=>tagTot[t]&&tagOK[t]/tagTot[t]<0.7)
    .map(([t,name,idx])=>`<li>${name} 복습 추천 → <button class="btn ghost" style="padding:3px 12px;font-size:.8rem" onclick="go(${idx})">바로 가기</button></li>`).join('');
  document.getElementById('result').innerHTML=`<div class="qz"><div class="score-wrap">
    <div class="score-big">${score} / 10</div><div class="grade">${grade[0]}</div>
    <p style="font-size:.9rem;margin-top:6px">${grade[1]}</p>
    <div class="branchbars">${bars}</div>
    ${weak?`<div class="advice"><b>🧭 맞춤 복습 경로</b><ul style="margin:6px 0 0 18px">${weak}</ul></div>`:''}
    <div style="margin-top:18px"><button class="btn ghost" onclick="resetExam()">처음부터 다시 풀기</button></div>
  </div></div>`;
  document.getElementById('result').scrollIntoView({behavior:'smooth',block:'start'});
  requestAnimationFrame(()=>setTimeout(()=>document.querySelectorAll('.fill').forEach(f=>f.style.width=f.dataset.w),60));
}
function resetExam(){graded=false;
  EXAM.forEach((q,qi)=>{exAns[qi]=q.type==='walk'?q.steps.map(()=>-1):q.type==='classify'?q.items.map(()=>-1):-1;});
  renderAll();go(STAGES.length-1);}

/* ---- mount ---- */
function pathHTML(arr){return `<div class="path">${arr.map(([t,c],i)=>(i?'<span class="sep">▸</span>':'')+`<span class="crumb on-${c}">${t}</span>`).join('')}</div>`;}
function renderAll(){
  document.getElementById('main').innerHTML=STAGES.map((s,i)=>{
    let inner='';
    if(s.exam) inner=examHTML();
    else{
      inner=(s.cards||[]).map(cardHTML).join('');
      if(s.cp)inner+=cpHTML(i,s.cp);
      if(s.cpClassify)inner+=classifyCpHTML(i,s.cpClassify);
    }
    return `<section class="stage ${i===cur?'show':''}" id="st${i}">
      ${pathHTML(s.pathArr)}<h2 class="stitle">${s.title}</h2><p class="ssub">${s.sub}</p>${inner}
      <div class="navrow">${i>0?`<button class="btn ghost" onclick="go(${i-1})">← 이전 단계</button>`:'<span></span>'}
        <span style="font-size:.78rem;color:var(--sub)">${i+1} / ${STAGES.length}</span></div></section>`;
  }).join('');
  renderSteps();
}
renderAll();
</script>
</body>
</html>
